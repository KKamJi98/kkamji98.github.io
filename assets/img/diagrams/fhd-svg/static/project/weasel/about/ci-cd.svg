<polygon data-arrowhead="root.0.2.0.1" points="509.500,325.300 503.500,315.300 515.500,315.300" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="125.400" font-size="36" font-weight="700" fill="#111827">Weasel CI/CD는 코드 변경을 이미지와 배포 상태로 전달합니다</text>
<text data-source="root.0.1.0" x="106.000" y="174.000" font-size="16" font-weight="700" fill="#111827">Developer</text>
<text data-source="root.0.1.0" x="106.000" y="204.800" font-size="14" font-weight="400" fill="#111827">애플리케이션 코드를 변경합니다.</text>
<text data-source="root.0.1.2" x="730.000" y="174.000" font-size="16" font-weight="700" fill="#111827">App Repository</text>
<text data-source="root.0.1.2" x="730.000" y="204.800" font-size="14" font-weight="400" fill="#111827">push를 저장하고 Jenkins webhook을 호출합니다.</text>
<text data-source="root.0.1.4" x="1354.000" y="174.000" font-size="16" font-weight="700" fill="#111827">Jenkins</text>
<text data-source="root.0.1.4" x="1354.000" y="204.800" font-size="14" font-weight="400" fill="#111827">빌드를 실행하고 두 delivery 경로로 결과를 보냅니다.</text>
<text data-source="root.0.1.1" x="580.000" y="166.950" font-size="14" font-weight="400" fill="#111827">Code Push</text>
<text data-source="root.0.1.3" x="1204.000" y="166.950" font-size="14" font-weight="400" fill="#111827">Webhook</text>
<text data-source="root.0.2.0.0" x="74.000" y="255.700" font-size="16" font-weight="700" fill="#111827">Image and GitOps deploy</text>
<text data-source="root.0.2.0.2.0.0" x="108.000" y="387.300" font-size="16" font-weight="700" fill="#111827">Image push</text>
<text data-source="root.0.2.0.2.0.1.0" x="118.000" y="428.900" font-size="16" font-weight="700" fill="#111827">ECR</text>
<text data-source="root.0.2.0.2.0.1.0" x="118.000" y="459.700" font-size="14" font-weight="400" fill="#111827">Jenkins가 container image를 push합니다.</text>
<text data-source="root.0.2.0.2.1.0" x="524.500" y="387.300" font-size="16" font-weight="700" fill="#111827">Manifest update and deploy</text>
<text data-source="root.0.2.0.2.1.1.0" x="534.500" y="428.900" font-size="16" font-weight="700" fill="#111827">Manifest Repository</text>
<text data-source="root.0.2.0.2.1.1.0" x="534.500" y="459.700" font-size="14" font-weight="400" fill="#111827">Jenkins가 deployment manifest를 업데이트합니다.</text>
<text data-source="root.0.2.0.2.1.1.2" x="534.500" y="576.600" font-size="16" font-weight="700" fill="#111827">Argo CD</text>
<text data-source="root.0.2.0.2.1.1.2" x="534.500" y="607.400" font-size="14" font-weight="400" fill="#111827">Manifest Repository 변경을 감지합니다.</text>
<text data-source="root.0.2.0.2.1.1.4" x="534.500" y="724.300" font-size="16" font-weight="700" fill="#111827">K8s Deployment</text>
<text data-source="root.0.2.0.2.1.1.4" x="534.500" y="755.100" font-size="14" font-weight="400" fill="#111827">클러스터에 desired state를 적용합니다.</text>
<text data-source="root.0.2.0.2.1.1.6" x="534.500" y="872.000" font-size="16" font-weight="700" fill="#111827">ECR target image</text>
<text data-source="root.0.2.0.2.1.1.6" x="534.500" y="902.800" font-size="14" font-weight="400" fill="#111827">배포 대상이 ECR에서 target image를 가져옵니다.</text>
<text data-source="root.0.2.0.2.1.1.1" x="737.750" y="517.150" font-size="14" font-weight="400" fill="#111827">Detect</text>
<text data-source="root.0.2.0.2.1.1.3" x="737.750" y="664.850" font-size="14" font-weight="400" fill="#111827">Apply</text>
<text data-source="root.0.2.0.2.1.1.5" x="737.750" y="812.550" font-size="14" font-weight="400" fill="#111827">target image pull</text>
<text data-source="root.0.2.0.1" x="529.500" y="303.850" font-size="14" font-weight="400" fill="#111827">Jenkins independent branches</text>
<text data-source="root.0.2.1.0" x="975.000" y="255.700" font-size="16" font-weight="700" fill="#111827">File update</text>
<text data-source="root.0.2.1.1.0" x="985.000" y="297.300" font-size="16" font-weight="700" fill="#111827">S3</text>
<text data-source="root.0.2.1.1.0" x="985.000" y="328.100" font-size="14" font-weight="400" fill="#111827">Jenkins가 file을 업데이트합니다.</text>
<text data-source="root.0.3" x="64.000" y="985.700" font-size="14" font-weight="400" fill="#111827">Jenkins의 image push와 manifest update는 독립 branch입니다. Argo CD는 Manifest Repository를 감지하고, K8s Deployment는 적용된 target image를 ECR에서 pull합니다.</text>
</svg>
