<polygon data-arrowhead="root.0.2.0.1" points="509.000,328.000 503.000,318.000 515.000,318.000" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="106.100" font-size="36" font-weight="700" fill="#111827">Weasel CI/CD는 코드 변경을 이미지와 배포 상태로 전달합니다</text>
<text data-source="root.0.1.0" x="108.000" y="160.700" font-size="18" font-weight="700" fill="#111827">Developer</text>
<text data-source="root.0.1.0" x="108.000" y="194.100" font-size="16" font-weight="400" fill="#111827">애플리케이션 코드를 변경합니다.</text>
<text data-source="root.0.1.2" x="732.000" y="160.700" font-size="18" font-weight="700" fill="#111827">App Repository</text>
<text data-source="root.0.1.2" x="732.000" y="194.100" font-size="16" font-weight="400" fill="#111827">push를 저장하고 Jenkins webhook을 호출합니다.</text>
<text data-source="root.0.1.4" x="1356.000" y="160.700" font-size="18" font-weight="700" fill="#111827">Jenkins</text>
<text data-source="root.0.1.4" x="1356.000" y="194.100" font-size="16" font-weight="400" fill="#111827">빌드를 실행하고 두 delivery 경로로 결과를 보냅니다.</text>
<text data-source="root.0.1.1" x="580.000" y="153.600" font-size="16" font-weight="400" fill="#111827">Code Push</text>
<text data-source="root.0.1.3" x="1204.000" y="153.600" font-size="16" font-weight="400" fill="#111827">Webhook</text>
<text data-source="root.0.2.0.0" x="76.000" y="253.700" font-size="18" font-weight="700" fill="#111827">Image and GitOps deploy</text>
<text data-source="root.0.2.0.2.0.0" x="88.000" y="370.000" font-size="18" font-weight="700" fill="#111827">Image push</text>
<text data-source="root.0.2.0.2.0.1.0" x="100.000" y="418.300" font-size="18" font-weight="700" fill="#111827">ECR</text>
<text data-source="root.0.2.0.2.0.1.0" x="100.000" y="451.700" font-size="16" font-weight="400" fill="#111827">Jenkins가 container image를 push합니다.</text>
<text data-source="root.0.2.0.2.1.0" x="527.000" y="370.000" font-size="18" font-weight="700" fill="#111827">Manifest update and deploy</text>
<text data-source="root.0.2.0.2.1.1.0" x="539.000" y="418.300" font-size="18" font-weight="700" fill="#111827">Manifest Repository</text>
<text data-source="root.0.2.0.2.1.1.0" x="539.000" y="451.700" font-size="16" font-weight="400" fill="#111827">Jenkins가 deployment manifest를 업데이트합니다.</text>
<text data-source="root.0.2.0.2.1.1.2" x="539.000" y="579.300" font-size="18" font-weight="700" fill="#111827">Argo CD</text>
<text data-source="root.0.2.0.2.1.1.2" x="539.000" y="612.700" font-size="16" font-weight="400" fill="#111827">Manifest Repository 변경을 감지합니다.</text>
<text data-source="root.0.2.0.2.1.1.4" x="539.000" y="740.300" font-size="18" font-weight="700" fill="#111827">K8s Deployment</text>
<text data-source="root.0.2.0.2.1.1.4" x="539.000" y="773.700" font-size="16" font-weight="400" fill="#111827">클러스터에 desired state를 적용합니다.</text>
<text data-source="root.0.2.0.2.1.1.6" x="539.000" y="901.300" font-size="18" font-weight="700" fill="#111827">ECR target image</text>
<text data-source="root.0.2.0.2.1.1.6" x="539.000" y="934.700" font-size="16" font-weight="400" fill="#111827">배포 대상이 ECR에서 target image를 가져옵니다.</text>
<text data-source="root.0.2.0.2.1.1.1" x="748.500" y="514.500" font-size="16" font-weight="400" fill="#111827">Detect</text>
<text data-source="root.0.2.0.2.1.1.3" x="748.500" y="675.500" font-size="16" font-weight="400" fill="#111827">Apply</text>
<text data-source="root.0.2.0.2.1.1.5" x="748.500" y="836.500" font-size="16" font-weight="400" fill="#111827">target image pull</text>
<text data-source="root.0.2.0.1" x="529.000" y="305.200" font-size="16" font-weight="400" fill="#111827">Jenkins independent branches</text>
<text data-source="root.0.2.1.0" x="978.000" y="253.700" font-size="18" font-weight="700" fill="#111827">File update</text>
<text data-source="root.0.2.1.1.0" x="990.000" y="302.000" font-size="18" font-weight="700" fill="#111827">S3</text>
<text data-source="root.0.2.1.1.0" x="990.000" y="335.400" font-size="16" font-weight="400" fill="#111827">Jenkins가 file을 업데이트합니다.</text>
<text data-source="root.0.3" x="64.000" y="1004.300" font-size="16" font-weight="400" fill="#111827">Jenkins의 image push와 manifest update는 독립 branch입니다. Argo CD는 Manifest Repository를 감지하고, K8s Deployment는 적용된 target image를 ECR에서 pull합니다.</text>
</svg>
