<text data-source="root.0.0" x="64.000" y="157.300" font-size="36" font-weight="700" fill="#111827">Remember Me는 CloudFront edge에서 API와 정적 자산을 나눕니다</text>
<text data-source="root.0.1" x="64.000" y="197.900" font-size="16" font-weight="400" fill="#111827">DNS: client가 Route53에서 CloudFront 주소를 조회합니다. DNS는 HTTP forwarding hop이 아닙니다.</text>
<text data-source="root.0.2" x="76.000" y="245.500" font-size="18" font-weight="700" fill="#111827">CloudFront + WAF</text>
<text data-source="root.0.2" x="76.000" y="278.900" font-size="16" font-weight="400" fill="#111827">하나의 edge에서 static/API 요청 분기</text>
<text data-source="root.0.4.0" x="76.000" y="406.500" font-size="18" font-weight="700" fill="#111827">Amazon S3</text>
<text data-source="root.0.4.0" x="76.000" y="439.900" font-size="16" font-weight="400" fill="#111827">frontend 정적 파일 origin</text>
<text data-source="root.0.4.1.0" x="978.000" y="406.500" font-size="18" font-weight="700" fill="#111827">Serverless backend</text>
<text data-source="root.0.4.1.1" x="990.000" y="454.800" font-size="18" font-weight="700" fill="#111827">API Gateway + WAF</text>
<text data-source="root.0.4.1.1" x="990.000" y="488.200" font-size="16" font-weight="400" fill="#111827">API request rule과 integration</text>
<text data-source="root.0.4.1.3" x="990.000" y="615.800" font-size="18" font-weight="700" fill="#111827">AWS Lambda functions</text>
<text data-source="root.0.4.1.3" x="990.000" y="649.200" font-size="16" font-weight="400" fill="#111827">단어 목록과 퀴즈 처리</text>
<text data-source="root.0.4.1.4.0" x="990.000" y="708.800" font-size="18" font-weight="700" fill="#111827">Parameter Store and Secrets Manager</text>
<text data-source="root.0.4.1.4.0" x="990.000" y="742.200" font-size="16" font-weight="400" fill="#111827">Lambda가 config와 secret read</text>
<text data-source="root.0.4.1.4.1" x="1429.000" y="708.800" font-size="18" font-weight="700" fill="#111827">MongoDB</text>
<text data-source="root.0.4.1.4.1" x="1429.000" y="742.200" font-size="16" font-weight="400" fill="#111827">Lambda가 사용자 단어 data read/write</text>
<text data-source="root.0.4.1.2" x="1431.000" y="551.000" font-size="16" font-weight="400" fill="#111827">Lambda integration</text>
<text data-source="root.0.5.0" x="76.000" y="813.800" font-size="18" font-weight="700" fill="#111827">비용 알림</text>
<text data-source="root.0.5.1.0" x="120.000" y="862.100" font-size="18" font-weight="700" fill="#111827">AWS Budgets</text>
<text data-source="root.0.5.1.0" x="120.000" y="895.500" font-size="16" font-weight="400" fill="#111827">비용 threshold 감시</text>
<text data-source="root.0.5.1.2" x="736.000" y="862.100" font-size="18" font-weight="700" fill="#111827">AWS Chatbot</text>
<text data-source="root.0.5.1.2" x="736.000" y="895.500" font-size="16" font-weight="400" fill="#111827">Slack channel 형식 변환</text>
<text data-source="root.0.5.1.4" x="1352.000" y="862.100" font-size="18" font-weight="700" fill="#111827">Slack</text>
<text data-source="root.0.5.1.4" x="1352.000" y="895.500" font-size="16" font-weight="400" fill="#111827">운영자 비용 경고</text>
