<text data-source="root.0.5.1.3" x="1200.000" y="855.000" font-size="16" font-weight="400" fill="#111827">chat delivery</text>
<text data-source="root.0.6" x="64.000" y="953.100" font-size="16" font-weight="400" fill="#111827">HCP Terraform이 VPC와 위 serverless resources를 코드로 provisioning합니다.</text>
