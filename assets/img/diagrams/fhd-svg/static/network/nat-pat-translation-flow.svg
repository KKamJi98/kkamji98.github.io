<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="78346e39db152eaf7e38999d4083626688bd672a67247c4e0753a84f70ef26c3">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-node="root.0.2.0" x="96.000" y="498.400" width="324.000" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.2" x="564.000" y="483.550" width="324.000" height="185.500" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.2.4" x="1032.000" y="480.200" width="324.000" height="192.200" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.2.6" x="1500.000" y="498.400" width="324.000" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<path data-edge="root.0.2.1" data-from="root.0.2.0" data-to="root.0.2.2" d="M 432.000 576.300 L 552.000 576.300" fill="none" stroke="#475569" stroke-width="3"><title>outbound packet의 source tuple을 변환</title></path>
<polygon data-arrowhead="root.0.2.1" points="552.000,576.300 542.000,582.300 542.000,570.300" fill="#475569"/>
<path data-edge="root.0.2.3" data-from="root.0.2.2" data-to="root.0.2.4" d="M 900.000 576.300 L 1020.000 576.300" fill="none" stroke="#475569" stroke-width="3"><title>변환된 tuple을 flow별로 기록</title></path>
<polygon data-arrowhead="root.0.2.3" points="1020.000,576.300 1010.000,582.300 1010.000,570.300" fill="#475569"/>
<path data-edge="root.0.2.5" data-from="root.0.2.4" data-to="root.0.2.6" d="M 1368.000 576.300 L 1488.000 576.300" fill="none" stroke="#475569" stroke-width="3"><title>public address로 외부에 전송</title></path>
<polygon data-arrowhead="root.0.2.5" points="1488.000,576.300 1478.000,582.300 1478.000,570.300" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="355.200" font-size="36" font-weight="700" fill="#111827">PAT는 port를 바꿔 여러 private host가 public address를 공유하게 합니다</text>
<text data-source="root.0.1" x="64.000" y="413.800" font-size="22" font-weight="400" fill="#111827">Gateway가 source address와 port를 바꾸고 translation table에 flow를 기록해야 응답을 올바른 내부 host로 되돌릴 수 있습니다.</text>
<text data-source="root.0.2.0" x="120.000" y="550.400" font-size="28" font-weight="700" fill="#111827">Private client</text>
<text data-source="root.0.2.0" x="120.000" y="592.800" font-size="22" font-weight="400" fill="#111827">10.0.0.10:49152에서 외부</text>
<text data-source="root.0.2.0" x="120.000" y="622.500" font-size="22" font-weight="400" fill="#111827">server로 연결 시작</text>
<text data-source="root.0.2.2" x="588.000" y="535.550" font-size="28" font-weight="700" fill="#111827">NAT or PAT gateway</text>
<text data-source="root.0.2.2" x="588.000" y="577.950" font-size="22" font-weight="400" fill="#111827">private IP와 source port를</text>
<text data-source="root.0.2.2" x="588.000" y="607.650" font-size="22" font-weight="400" fill="#111827">public address와 port로</text>
<text data-source="root.0.2.2" x="588.000" y="637.350" font-size="22" font-weight="400" fill="#111827">rewrite</text>
<text data-source="root.0.2.4" x="1056.000" y="532.200" font-size="28" font-weight="700" fill="#111827">Translation table</text>
<text data-source="root.0.2.4" x="1056.000" y="568.600" font-size="28" font-weight="700" fill="#111827">entry</text>
<text data-source="root.0.2.4" x="1056.000" y="611.000" font-size="22" font-weight="400" fill="#111827">address와 port 조합으로 한</text>
<text data-source="root.0.2.4" x="1056.000" y="640.700" font-size="22" font-weight="400" fill="#111827">flow를 식별</text>
<text data-source="root.0.2.6" x="1524.000" y="550.400" font-size="28" font-weight="700" fill="#111827">External server</text>
<text data-source="root.0.2.6" x="1524.000" y="592.800" font-size="22" font-weight="400" fill="#111827">198.51.100.20:443. private</text>
<text data-source="root.0.2.6" x="1524.000" y="622.500" font-size="22" font-weight="400" fill="#111827">address는 보이지 않음</text>
<text data-source="root.0.2.1" x="424.000" y="467.500" font-size="22" font-weight="400" fill="#111827">outbound</text>
<text data-source="root.0.2.1" x="424.000" y="497.200" font-size="22" font-weight="400" fill="#111827">packet의</text>
<text data-source="root.0.2.1" x="424.000" y="526.900" font-size="22" font-weight="400" fill="#111827">source</text>
<text data-source="root.0.2.1" x="424.000" y="556.600" font-size="22" font-weight="400" fill="#111827">tuple을 변환</text>
<text data-source="root.0.2.3" x="892.000" y="497.200" font-size="22" font-weight="400" fill="#111827">변환된</text>
<text data-source="root.0.2.3" x="892.000" y="526.900" font-size="22" font-weight="400" fill="#111827">tuple을</text>
<text data-source="root.0.2.3" x="892.000" y="556.600" font-size="22" font-weight="400" fill="#111827">flow별로 기록</text>
<text data-source="root.0.2.5" x="1360.000" y="497.200" font-size="22" font-weight="400" fill="#111827">public</text>
<text data-source="root.0.2.5" x="1360.000" y="526.900" font-size="22" font-weight="400" fill="#111827">address로</text>
<text data-source="root.0.2.5" x="1360.000" y="556.600" font-size="22" font-weight="400" fill="#111827">외부에 전송</text>
<text data-source="root.0.3" x="64.000" y="753.100" font-size="22" font-weight="400" fill="#111827">응답이 돌아오면 gateway는 destination tuple을 table에서 찾아 private address와 port로 역변환합니다. NAT는 주소 변환이며 방화벽 정책이나 인증을 대신하지 않습니다.</text>
</svg>
