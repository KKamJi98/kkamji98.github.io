<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="1c9fa152c5c44ca68da2f411508d04d238b9b9e67d98ea636e9eab6467b9e773">
