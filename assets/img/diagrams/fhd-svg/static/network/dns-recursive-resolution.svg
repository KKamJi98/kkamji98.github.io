<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="cc946bacf1b6a2f58ce31ce533a2af978d7f36c8e9fdb02e8232371aa5c22a12">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-source="root.0.4" x="64.000" y="413.650" width="1792.000" height="503.700" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.4.1" x="966.000" y="437.650" width="866.000" height="455.700" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.2" x="64.000" y="223.250" width="1792.000" height="110.400" rx="16" fill="none" stroke="#64748b" stroke-width="2"/>
<rect data-node="root.0.2.0" x="96.000" y="237.950" width="792.000" height="81.000" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.2" x="1032.000" y="237.950" width="792.000" height="81.000" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.4.0" x="88.000" y="437.650" width="866.000" height="81.000" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.4.1.1.0" x="1010.000" y="533.050" width="317.000" height="102.600" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.4.1.1.2" x="1471.000" y="533.050" width="317.000" height="102.600" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.4.1.1.4" x="1010.000" y="778.750" width="317.000" height="102.600" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<path data-edge="root.0.2.1" data-from="root.0.2.0" data-to="root.0.2.2" d="M 900.000 278.450 L 1020.000 278.450" fill="none" stroke="#475569" stroke-width="3"><title>설정된 resolver에 질의 전달</title></path>
<polygon data-arrowhead="root.0.2.1" points="1020.000,278.450 1010.000,284.450 1010.000,272.450" fill="#475569"/>
<path data-edge="root.0.4.1.1.1" data-from="root.0.4.1.1.0" data-to="root.0.4.1.1.2" d="M 1339.000 584.350 L 1459.000 584.350" fill="none" stroke="#475569" stroke-width="3"><title>resolver가 root referral을 따라 .com 같은 TLD에 질의</title></path>
<polygon data-arrowhead="root.0.4.1.1.1" points="1459.000,584.350 1449.000,590.350 1449.000,578.350" fill="#475569"/>
<path data-edge="root.0.4.1.1.3" data-from="root.0.4.1.1.2" data-to="root.0.4.1.1.4" d="M 1800.000 584.350 L 1812.000 584.350 L 1812.000 730.750 L 986.000 730.750 L 986.000 830.050 L 998.000 830.050" fill="none" stroke="#475569" stroke-width="3"><title>resolver가 TLD referral을 따라 대상 zone에 질의</title></path>
<polygon data-arrowhead="root.0.4.1.1.3" points="998.000,830.050 988.000,836.050 988.000,824.050" fill="#475569"/>
<path data-edge="root.0.3" data-from="root.0.2" data-to="root.0.4" d="M 960.000 345.650 L 960.000 401.650" fill="none" stroke="#475569" stroke-width="3"><title>cache 상태에 따라 두 경로로 분기</title></path>
<polygon data-arrowhead="root.0.3" points="960.000,401.650 954.000,391.650 966.000,391.650" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="165.050" font-size="36" font-weight="700" fill="#111827">Recursive resolver가 DNS delegation을 걷고 stub은 한 번만 묻습니다</text>
<text data-source="root.0.1" x="64.000" y="205.650" font-size="16" font-weight="400" fill="#111827">유효한 cache가 있으면 resolver 안에서 끝납니다. cache miss일 때만 root부터 TLD와 authoritative server까지 delegation을 따라갑니다.</text>
<text data-source="root.0.2.0" x="108.000" y="267.950" font-size="18" font-weight="700" fill="#111827">Browser or stub resolver</text>
<text data-source="root.0.2.0" x="108.000" y="301.350" font-size="16" font-weight="400" fill="#111827">한 번 질의하고 최종 answer를 기다림</text>
<text data-source="root.0.2.2" x="1044.000" y="267.950" font-size="18" font-weight="700" fill="#111827">Recursive resolver</text>
<text data-source="root.0.2.2" x="1044.000" y="301.350" font-size="16" font-weight="400" fill="#111827">cache를 먼저 확인하고, miss면 delegation chain을 대신 탐색</text>
<text data-source="root.0.2.1" x="892.000" y="239.250" font-size="16" font-weight="400" fill="#111827">설정된 resolver에</text>
<text data-source="root.0.2.1" x="892.000" y="260.850" font-size="16" font-weight="400" fill="#111827">질의 전달</text>
<text data-source="root.0.4.0" x="100.000" y="467.650" font-size="18" font-weight="700" fill="#111827">Cache hit</text>
<text data-source="root.0.4.0" x="100.000" y="501.050" font-size="16" font-weight="400" fill="#111827">resolver를 벗어나지 않고 즉시 stub에 응답</text>
<text data-source="root.0.4.1.0" x="978.000" y="467.650" font-size="18" font-weight="700" fill="#111827">Cache miss</text>
<text data-source="root.0.4.1.1.0" x="1022.000" y="563.050" font-size="18" font-weight="700" fill="#111827">Root name server</text>
<text data-source="root.0.4.1.1.0" x="1022.000" y="596.450" font-size="16" font-weight="400" fill="#111827">TLD name server를 가리키는</text>
<text data-source="root.0.4.1.1.0" x="1022.000" y="618.050" font-size="16" font-weight="400" fill="#111827">referral 제공</text>
<text data-source="root.0.4.1.1.2" x="1483.000" y="563.050" font-size="18" font-weight="700" fill="#111827">TLD name server</text>
<text data-source="root.0.4.1.1.2" x="1483.000" y="596.450" font-size="16" font-weight="400" fill="#111827">zone의 authoritative name</text>
<text data-source="root.0.4.1.1.2" x="1483.000" y="618.050" font-size="16" font-weight="400" fill="#111827">server를 가리킴</text>
<text data-source="root.0.4.1.1.4" x="1022.000" y="808.750" font-size="18" font-weight="700" fill="#111827">Authoritative server</text>
<text data-source="root.0.4.1.1.4" x="1022.000" y="842.150" font-size="16" font-weight="400" fill="#111827">실제 record를 반환하고 resolver가</text>
<text data-source="root.0.4.1.1.4" x="1022.000" y="863.750" font-size="16" font-weight="400" fill="#111827">answer와 delegation을 cache</text>
<text data-source="root.0.4.1.1.1" x="1331.000" y="501.950" font-size="16" font-weight="400" fill="#111827">resolver가 root</text>
<text data-source="root.0.4.1.1.1" x="1331.000" y="523.550" font-size="16" font-weight="400" fill="#111827">referral을 따라</text>
<text data-source="root.0.4.1.1.1" x="1331.000" y="545.150" font-size="16" font-weight="400" fill="#111827">.com 같은</text>
<text data-source="root.0.4.1.1.1" x="1331.000" y="566.750" font-size="16" font-weight="400" fill="#111827">TLD에 질의</text>
<text data-source="root.0.4.1.1.3" x="1018.000" y="722.750" font-size="16" font-weight="400" fill="#111827">resolver가 TLD referral을 따라 대상 zone에 질의</text>
<text data-source="root.0.5" x="64.000" y="945.350" font-size="16" font-weight="400" fill="#111827">Stub은 root와 TLD를 직접 걷지 않습니다. resolver가 얻은 최종 answer를 반환한 뒤 유효 기간 동안 cache를 재사용합니다.</text>
<text data-source="root.0.3" x="980.000" y="378.850" font-size="16" font-weight="400" fill="#111827">cache 상태에 따라 두 경로로 분기</text>
</svg>
