<text data-source="root.0.0" x="64.000" y="260.300" font-size="36" font-weight="700" fill="#111827">Bundle-first와 Vite dev server의 첫 요청 경로</text>
<text data-source="root.0.1.0.0" x="84.000" y="336.900" font-size="24" font-weight="700" fill="#111827">Bundle-first dev server 경로</text>
<text data-source="root.0.1.0.1.0" x="136.000" y="420.200" font-size="24" font-weight="700" fill="#111827">Source modules</text>
<text data-source="root.0.1.0.1.0" x="136.000" y="459.400" font-size="20" font-weight="400" fill="#111827">수백 개 파일 전체</text>
<text data-source="root.0.1.0.1.2" x="599.000" y="420.200" font-size="24" font-weight="700" fill="#111827">Bundle everything</text>
<text data-source="root.0.1.0.1.2" x="599.000" y="459.400" font-size="20" font-weight="400" fill="#111827">앱 크기와 함께 비용 증가</text>
<text data-source="root.0.1.0.1.4" x="136.000" y="637.300" font-size="24" font-weight="700" fill="#111827">Serve one bundle</text>
<text data-source="root.0.1.0.1.4" x="136.000" y="676.500" font-size="20" font-weight="400" fill="#111827">첫 요청이 전체 graph를 기다림</text>
<text data-source="root.0.1.0.1.6" x="599.000" y="637.300" font-size="24" font-weight="700" fill="#111827">Browser</text>
<text data-source="root.0.1.0.1.6" x="599.000" y="676.500" font-size="20" font-weight="400" fill="#111827">bundle-first 결과를 받음</text>
<text data-source="root.0.1.0.1.1" x="439.000" y="385.300" font-size="20" font-weight="400" fill="#111827">전체 graph를</text>
<text data-source="root.0.1.0.1.1" x="439.000" y="412.300" font-size="20" font-weight="400" fill="#111827">먼저 처리</text>
<text data-source="root.0.1.0.1.3" x="124.000" y="537.300" font-size="20" font-weight="400" fill="#111827">번들 생성 후</text>
<text data-source="root.0.1.0.1.5" x="439.000" y="629.400" font-size="20" font-weight="400" fill="#111827">응답</text>
<text data-source="root.0.1.1.0" x="990.000" y="336.900" font-size="24" font-weight="700" fill="#111827">Vite dev server 경로</text>
<text data-source="root.0.1.1.1.0" x="1042.000" y="424.900" font-size="24" font-weight="700" fill="#111827">Source modules</text>
<text data-source="root.0.1.1.1.0" x="1042.000" y="464.100" font-size="20" font-weight="400" fill="#111827">같은 수백 개 파일</text>
<text data-source="root.0.1.1.1.2" x="1505.000" y="409.300" font-size="24" font-weight="700" fill="#111827">Pre-bundle</text>
<text data-source="root.0.1.1.1.2" x="1505.000" y="440.500" font-size="24" font-weight="700" fill="#111827">dependencies</text>
<text data-source="root.0.1.1.1.2" x="1505.000" y="479.700" font-size="20" font-weight="400" fill="#111827">esbuild, node_modules만 대상</text>
<text data-source="root.0.1.1.1.4" x="1042.000" y="669.000" font-size="24" font-weight="700" fill="#111827">Transform on</text>
<text data-source="root.0.1.1.1.4" x="1042.000" y="700.200" font-size="24" font-weight="700" fill="#111827">request</text>
<text data-source="root.0.1.1.1.4" x="1042.000" y="739.400" font-size="20" font-weight="400" fill="#111827">import된 모듈 하나씩 변환</text>
<text data-source="root.0.1.1.1.6" x="1505.000" y="671.100" font-size="24" font-weight="700" fill="#111827">Browser</text>
<text data-source="root.0.1.1.1.6" x="1505.000" y="710.300" font-size="20" font-weight="400" fill="#111827">브라우저가 모듈별 요청을 보내고</text>
<text data-source="root.0.1.1.1.6" x="1505.000" y="737.300" font-size="20" font-weight="400" fill="#111827">Native ESM을 받음</text>
<text data-source="root.0.1.1.1.1" x="1345.000" y="390.000" font-size="20" font-weight="400" fill="#111827">dependency만</text>
<text data-source="root.0.1.1.1.1" x="1345.000" y="417.000" font-size="20" font-weight="400" fill="#111827">사전 처리</text>
<text data-source="root.0.1.1.1.3" x="1030.000" y="546.700" font-size="20" font-weight="400" fill="#111827">브라우저 요청마다</text>
<text data-source="root.0.1.1.1.5" x="1345.000" y="622.700" font-size="20" font-weight="400" fill="#111827">브라우저 요청 /</text>
<text data-source="root.0.1.1.1.5" x="1345.000" y="649.700" font-size="20" font-weight="400" fill="#111827">Native ESM</text>
<text data-source="root.0.1.1.1.5" x="1345.000" y="676.700" font-size="20" font-weight="400" fill="#111827">응답</text>
<text data-source="root.0.2" x="64.000" y="848.700" font-size="20" font-weight="400" fill="#111827">두 경로의 목적지는 Browser입니다. Vite는 source 전체 번들이 끝날 때까지 기다리지 않고, 브라우저가 요청한 모듈만 transform해 시작 지연을 줄입니다.</text>
