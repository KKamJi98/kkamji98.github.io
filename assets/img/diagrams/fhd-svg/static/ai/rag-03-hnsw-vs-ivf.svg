<text data-source="root.0.0" x="64.000" y="235.950" font-size="36" font-weight="700" fill="#111827">HNSW와 IVF의 ANN 탐색 방식 비교</text>
<text data-source="root.0.1.0.0" x="88.000" y="324.550" font-size="28" font-weight="700" fill="#111827">HNSW: graph based</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="410.350" font-size="28" font-weight="700" fill="#111827">Layer 2 (sparse)</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="452.750" font-size="22" font-weight="400" fill="#111827">long hop으로 넓게 이동</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="410.350" font-size="28" font-weight="700" fill="#111827">Layer 1</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="452.750" font-size="22" font-weight="400" fill="#111827">더 짧은 이웃 hop</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="632.450" font-size="28" font-weight="700" fill="#111827">Layer 0 (all vectors)</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="674.850" font-size="22" font-weight="400" fill="#111827">full graph에서 후보를 좁힘</text>
<text data-source="root.0.1.0.2" x="88.000" y="752.550" font-size="22" font-weight="400" fill="#111827">낮은 latency에서 높은 recall을 얻지만 memory가 큽니다. 검색 폭은 ef_search로</text>
<text data-source="root.0.1.0.2" x="88.000" y="782.250" font-size="22" font-weight="400" fill="#111827">조절합니다.</text>
<text data-source="root.0.1.1.0" x="996.000" y="324.550" font-size="28" font-weight="700" fill="#111827">IVF: cluster based</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="425.200" font-size="28" font-weight="700" fill="#111827">Query</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="467.600" font-size="22" font-weight="400" fill="#111827">입력 vector</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="410.350" font-size="28" font-weight="700" fill="#111827">Centroids</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="452.750" font-size="22" font-weight="400" fill="#111827">coarse quantizer로 가까운</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="482.450" font-size="22" font-weight="400" fill="#111827">list를 찾음</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="662.150" font-size="28" font-weight="700" fill="#111827">Probe top-nprobe</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="698.550" font-size="28" font-weight="700" fill="#111827">lists</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="740.950" font-size="22" font-weight="400" fill="#111827">열어 볼 cluster 수를 결정</text>
<text data-source="root.0.1.1.1.6" x="1510.000" y="665.500" font-size="28" font-weight="700" fill="#111827">Scan candidates</text>
<text data-source="root.0.1.1.1.6" x="1510.000" y="707.900" font-size="22" font-weight="400" fill="#111827">선택한 list 안에서 exact</text>
<text data-source="root.0.1.1.1.6" x="1510.000" y="737.600" font-size="22" font-weight="400" fill="#111827">distance 계산</text>
<text data-source="root.0.1.1.2" x="996.000" y="818.650" font-size="22" font-weight="400" fill="#111827">memory 효율이 높고 recall은 nprobe로 조정합니다. list 학습과 data 분포 변화도 함께</text>
<text data-source="root.0.1.1.2" x="996.000" y="848.350" font-size="22" font-weight="400" fill="#111827">관리해야 합니다.</text>
<text data-source="root.0.1.0.1.1.meaning" x="450.000" y="404.500" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
