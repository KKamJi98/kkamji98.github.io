<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="993d049090451e0bacf1b53aaca7208108ffb6756d569882fe49c757640b59ab">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-source="root.0.1.0" x="64.000" y="366.600" width="581.333" height="336.000" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.1.1" x="669.333" y="366.600" width="581.333" height="336.000" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.1.2" x="1274.667" y="366.600" width="581.333" height="365.700" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text data-source="root.0.0" x="64.000" y="330.000" font-size="36" font-weight="700" fill="#111827">Jev primitive별 질문과 반환값</text>
<text data-source="root.0.1.0.0" x="88.000" y="418.600" font-size="28" font-weight="700" fill="#111827">Choice</text>
<text data-source="root.0.1.0.1" x="88.000" y="474.400" font-size="22" font-weight="400" fill="#111827">질문</text>
<text data-source="root.0.1.0.1" x="88.000" y="504.100" font-size="22" font-weight="400" fill="#111827">후보 A, B, C 중 무엇인가?</text>
<text data-source="root.0.1.0.2" x="88.000" y="557.800" font-size="22" font-weight="400" fill="#111827">출력</text>
<text data-source="root.0.1.0.2" x="88.000" y="587.500" font-size="22" font-weight="400" fill="#111827">choice, probabilities, confidence</text>
<text data-source="root.0.1.0.3" x="88.000" y="641.200" font-size="22" font-weight="400" fill="#111827">예시</text>
<text data-source="root.0.1.0.3" x="88.000" y="670.900" font-size="22" font-weight="400" fill="#111827">어느 검토 경로로 보낼 것인가?</text>
<text data-source="root.0.1.1.0" x="693.333" y="418.600" font-size="28" font-weight="700" fill="#111827">Score</text>
<text data-source="root.0.1.1.1" x="693.333" y="474.400" font-size="22" font-weight="400" fill="#111827">질문</text>
<text data-source="root.0.1.1.1" x="693.333" y="504.100" font-size="22" font-weight="400" fill="#111827">정의한 순서형 척도에서 어디인가?</text>
<text data-source="root.0.1.1.2" x="693.333" y="557.800" font-size="22" font-weight="400" fill="#111827">출력</text>
<text data-source="root.0.1.1.2" x="693.333" y="587.500" font-size="22" font-weight="400" fill="#111827">score, legend, probabilities, confidence</text>
<text data-source="root.0.1.1.3" x="693.333" y="641.200" font-size="22" font-weight="400" fill="#111827">예시</text>
<text data-source="root.0.1.1.3" x="693.333" y="670.900" font-size="22" font-weight="400" fill="#111827">영향 범위가 어느 단계인가?</text>
<text data-source="root.0.1.2.0" x="1298.667" y="418.600" font-size="28" font-weight="700" fill="#111827">Noul</text>
<text data-source="root.0.1.2.1" x="1298.667" y="474.400" font-size="22" font-weight="400" fill="#111827">질문</text>
<text data-source="root.0.1.2.1" x="1298.667" y="504.100" font-size="22" font-weight="400" fill="#111827">명제가 참일 가능성은 얼마인가?</text>
<text data-source="root.0.1.2.2" x="1298.667" y="557.800" font-size="22" font-weight="400" fill="#111827">출력</text>
<text data-source="root.0.1.2.2" x="1298.667" y="587.500" font-size="22" font-weight="400" fill="#111827">noul = yes probability</text>
<text data-source="root.0.1.2.2" x="1298.667" y="617.200" font-size="22" font-weight="400" fill="#111827">별도 confidence 없음</text>
<text data-source="root.0.1.2.3" x="1298.667" y="670.900" font-size="22" font-weight="400" fill="#111827">예시</text>
<text data-source="root.0.1.2.3" x="1298.667" y="700.600" font-size="22" font-weight="400" fill="#111827">이 작업은 비가역적인가?</text>
<text data-source="root.0.2" x="64.000" y="778.300" font-size="22" font-weight="400" fill="#111827">보정된 확률은 여러 예측의 집단 성질이며, 개별 답 하나의 정답을 보장하지 않는다.</text>
</svg>
