<text data-source="root.0.0" x="64.000" y="108.550" font-size="36" font-weight="700" fill="#111827">Hermes WSL2 agent의 entry와 runtime 분리</text>
<text data-source="root.0.1" x="74.000" y="157.150" font-size="16" font-weight="700" fill="#111827">User</text>
<text data-source="root.0.1" x="74.000" y="187.950" font-size="14" font-weight="400" fill="#111827">한 session에서 두 entry point를 선택</text>
<text data-source="root.0.3.0.0" x="74.000" y="304.850" font-size="16" font-weight="700" fill="#111827">터미널 entry</text>
<text data-source="root.0.3.0.1" x="84.000" y="346.450" font-size="16" font-weight="700" fill="#111827">Terminal</text>
<text data-source="root.0.3.0.1" x="84.000" y="377.250" font-size="14" font-weight="400" fill="#111827">WSL2 안에서 직접 접근</text>
<text data-source="root.0.3.1.0" x="975.000" y="304.850" font-size="16" font-weight="700" fill="#111827">메시징 entry</text>
<text data-source="root.0.3.1.1" x="985.000" y="346.450" font-size="16" font-weight="700" fill="#111827">Telegram gateway</text>
<text data-source="root.0.3.1.1" x="985.000" y="377.250" font-size="14" font-weight="400" fill="#111827">터미널 밖에서 agent에 접근</text>
<text data-source="root.0.5" x="74.000" y="504.150" font-size="16" font-weight="700" fill="#111827">Hermes runtime</text>
<text data-source="root.0.5" x="74.000" y="534.950" font-size="14" font-weight="400" fill="#111827">standard chat loop 또는 Codex app-server path를 선택</text>
<text data-source="root.0.7" x="74.000" y="651.850" font-size="16" font-weight="700" fill="#111827">openai-codex provider</text>
<text data-source="root.0.7" x="74.000" y="682.650" font-size="14" font-weight="400" fill="#111827">인증과 model call path를 담당</text>
<text data-source="root.0.9" x="74.000" y="799.550" font-size="16" font-weight="700" fill="#111827">Model turn</text>
<text data-source="root.0.9" x="74.000" y="830.350" font-size="14" font-weight="400" fill="#111827">선택한 runtime 아래에서 tool loop 실행</text>
<text data-source="root.0.10.0" x="74.000" y="881.250" font-size="16" font-weight="700" fill="#111827">WSL2 supervision</text>
<text data-source="root.0.10.1" x="84.000" y="922.850" font-size="16" font-weight="700" fill="#111827">systemd service</text>
<text data-source="root.0.10.1" x="84.000" y="953.650" font-size="14" font-weight="400" fill="#111827">Telegram gateway process를 감독하며 WSL2 안에서 실행</text>
<text data-source="root.0.11" x="64.000" y="1002.550" font-size="14" font-weight="400" fill="#111827">provider는 인증과 호출 방식을, runtime은 turn을 처리할 loop를 정합니다. systemd는 process를 감독하지만 WSL 인스턴스를 영구 실행시키지는 않습니다.</text>
<text data-source="root.0.4" x="980.000" y="444.700" font-size="14" font-weight="400" fill="#111827">두 entry point가 같은 turn으로 모임</text>
<text data-source="root.0.2.meaning" x="980.000" y="245.400" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
