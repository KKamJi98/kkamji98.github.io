<text data-source="root.0.0" x="64.000" y="157.000" font-size="36" font-weight="700" fill="#111827">발급은 한 번, 추론은 가상 키로</text>
<text data-source="root.0.1.0" x="64.000" y="213.600" font-size="24" font-weight="700" fill="#111827">사전 발급</text>
<text data-source="root.0.1.1.0" x="96.000" y="262.000" font-size="20" font-weight="400" fill="#111827">관리자</text>
<text data-source="root.0.1.1.0" x="96.000" y="289.000" font-size="20" font-weight="400" fill="#111827">master key 인증</text>
<text data-source="root.0.1.1.2" x="720.000" y="262.000" font-size="20" font-weight="400" fill="#111827">/key/generate</text>
<text data-source="root.0.1.1.2" x="720.000" y="289.000" font-size="20" font-weight="400" fill="#111827">키와 예산 정책 생성</text>
<text data-source="root.0.1.1.4" x="1344.000" y="262.000" font-size="20" font-weight="400" fill="#111827">DB에 관리 레코드 저장</text>
<text data-source="root.0.1.1.4" x="1344.000" y="289.000" font-size="20" font-weight="400" fill="#111827">가상 키 반환</text>
<text data-source="root.0.1.2" x="64.000" y="336.000" font-size="20" font-weight="400" fill="#111827">관리자가 가상 키를 클라이언트에 전달. master key와 발급 API는 반복 추론에 사용하지 않는다.</text>
<text data-source="root.0.2.0" x="64.000" y="387.000" font-size="24" font-weight="700" fill="#111827">반복 추론</text>
<text data-source="root.0.2.1.0" x="116.000" y="459.400" font-size="24" font-weight="700" fill="#111827">/v1/chat/completions</text>
<text data-source="root.0.2.1.0" x="116.000" y="498.600" font-size="20" font-weight="400" fill="#111827">클라이언트의 가상 키</text>
<text data-source="root.0.2.1.2" x="1052.000" y="459.400" font-size="24" font-weight="700" fill="#111827">인증과 예산 검사</text>
<text data-source="root.0.2.1.2" x="1052.000" y="498.600" font-size="20" font-weight="400" fill="#111827">키 권한, spend, max_budget</text>
<text data-source="root.0.2.2.0.0" x="64.000" y="565.600" font-size="20" font-weight="400" fill="#111827">검사 통과</text>
<text data-source="root.0.2.2.0.1" x="84.000" y="636.600" font-size="24" font-weight="700" fill="#111827">Provider 호출</text>
<text data-source="root.0.2.2.0.1" x="84.000" y="675.800" font-size="20" font-weight="400" fill="#111827">일반 경로: 선택한 모델로 전달</text>
<text data-source="root.0.2.2.0.3" x="84.000" y="845.800" font-size="24" font-weight="700" fill="#111827">사용 내역 기록</text>
<text data-source="root.0.2.2.0.3" x="84.000" y="885.000" font-size="20" font-weight="400" fill="#111827">응답의 토큰 사용량과 모델 가격 설정에 따른 비용</text>
<text data-source="root.0.2.2.1.0" x="970.000" y="565.600" font-size="20" font-weight="400" fill="#111827">예산 조건 미충족</text>
<text data-source="root.0.2.2.1.1" x="990.000" y="636.600" font-size="24" font-weight="700" fill="#111827">요청 거절</text>
<text data-source="root.0.2.2.1.1" x="990.000" y="675.800" font-size="20" font-weight="400" fill="#111827">관측: max_budget: 0</text>
<text data-source="root.0.2.2.1.1" x="990.000" y="702.800" font-size="20" font-weight="400" fill="#111827">HTTP 429</text>
<text data-source="root.0.2.2.1.1" x="990.000" y="729.800" font-size="20" font-weight="400" fill="#111827">budget_exceeded</text>
<text data-source="root.0.3" x="64.000" y="952.000" font-size="20" font-weight="400" fill="#111827">관측은 mock 응답 성공과 0 예산 키의 HTTP 429다. 양수 예산 소진과 실제 provider 미도달은 별도 검증이 필요하다.</text>
