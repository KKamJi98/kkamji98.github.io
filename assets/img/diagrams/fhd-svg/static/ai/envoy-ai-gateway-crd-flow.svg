<text data-source="root.0.0" x="64.000" y="145.400" font-size="36" font-weight="700" fill="#111827">Envoy 요청 경로와 외부 처리</text>
<text data-source="root.0.1.0" x="120.000" y="234.000" font-size="28" font-weight="700" fill="#111827">Client</text>
<text data-source="root.0.1.0" x="120.000" y="276.400" font-size="22" font-weight="400" fill="#111827">Gateway endpoint로 요청</text>
<text data-source="root.0.1.2" x="744.000" y="234.000" font-size="28" font-weight="700" fill="#111827">Envoy Proxy</text>
<text data-source="root.0.1.2" x="744.000" y="276.400" font-size="22" font-weight="400" fill="#111827">모델에 맞는 upstream 선택</text>
<text data-source="root.0.1.4" x="1368.000" y="234.000" font-size="28" font-weight="700" fill="#111827">LLM provider</text>
<text data-source="root.0.1.4" x="1368.000" y="276.400" font-size="22" font-weight="400" fill="#111827">지원되는 모델 API</text>
<text data-source="root.0.2.1" x="88.000" y="469.800" font-size="28" font-weight="700" fill="#111827">AI Gateway external processor</text>
<text data-source="root.0.2.1" x="88.000" y="512.200" font-size="22" font-weight="400" fill="#111827">API 변환, 토큰 사용량 추출</text>
<text data-source="root.0.3" x="64.000" y="589.900" font-size="22" font-weight="400" fill="#111827">external processor는 Proxy와 통신한다. Provider 호출 홉이 아니다.</text>
<text data-source="root.0.4.0" x="88.000" y="673.600" font-size="28" font-weight="700" fill="#111827">설정 반영: 요청 홉과 별개</text>
<text data-source="root.0.4.1.0" x="144.000" y="759.400" font-size="28" font-weight="700" fill="#111827">CRD와 정책</text>
<text data-source="root.0.4.1.0" x="144.000" y="801.800" font-size="22" font-weight="400" fill="#111827">AIGatewayRoute</text>
<text data-source="root.0.4.1.0" x="144.000" y="831.500" font-size="22" font-weight="400" fill="#111827">BackendSecurityPolicy</text>
<text data-source="root.0.4.1.0" x="144.000" y="861.200" font-size="22" font-weight="400" fill="#111827">사용량 제한 설정</text>
<text data-source="root.0.4.1.2" x="752.000" y="774.250" font-size="28" font-weight="700" fill="#111827">Controllers</text>
<text data-source="root.0.4.1.2" x="752.000" y="816.650" font-size="22" font-weight="400" fill="#111827">AI Gateway /</text>
<text data-source="root.0.4.1.2" x="752.000" y="846.350" font-size="22" font-weight="400" fill="#111827">Envoy Gateway</text>
<text data-source="root.0.4.1.4" x="1360.000" y="774.250" font-size="28" font-weight="700" fill="#111827">런타임 구성</text>
<text data-source="root.0.4.1.4" x="1360.000" y="816.650" font-size="22" font-weight="400" fill="#111827">Proxy 라우팅/필터</text>
<text data-source="root.0.4.1.4" x="1360.000" y="846.350" font-size="22" font-weight="400" fill="#111827">external processor 처리 설정</text>
<text data-source="root.0.4.2" x="88.000" y="938.900" font-size="22" font-weight="400" fill="#111827">선언을 감시하고 구성으로 변환하여 두 런타임에 각각 반영한다. Controller별 내부 변환 단계는 생략했다.</text>
<text data-source="root.0.2.0" x="84.000" y="354.100" font-size="22" font-weight="400" fill="#111827">gRPC 처리 메시지 / 결과</text>
