<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="1d5f68d9df1251c8f5682584485b5ec6772417a20bf70413fb4cbc5ccd79ee59">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-node="root.0.1.0" x="96.000" y="367.000" width="480.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.2" x="720.000" y="367.000" width="480.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.4" x="1344.000" y="367.000" width="480.000" height="126.100" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.1.6" x="408.000" y="605.800" width="480.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.8" x="1032.000" y="605.800" width="480.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 588.000 430.050 L 708.000 430.050" fill="none" stroke="#475569" stroke-width="3"><title>범위와 완료 조건을 정함</title></path>
<polygon data-arrowhead="root.0.1.1" points="708.000,430.050 698.000,436.050 698.000,424.050" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 1212.000 430.050 L 1332.000 430.050" fill="none" stroke="#475569" stroke-width="3"><title>결과를 기준으로 검증</title></path>
<polygon data-arrowhead="root.0.1.3" points="1332.000,430.050 1322.000,436.050 1322.000,424.050" fill="#475569"/>
<path data-edge="root.0.1.5" data-from="root.0.1.4" data-to="root.0.1.6" d="M 1584.000 505.100 L 1584.000 549.450 L 648.000 549.450 L 648.000 593.800" fill="none" stroke="#475569" stroke-width="3"><title>다음 판단을 위한 기록</title></path>
<polygon data-arrowhead="root.0.1.5" points="648.000,593.800 642.000,583.800 654.000,583.800" fill="#475569"/>
<path data-edge="root.0.1.7" data-from="root.0.1.6" data-to="root.0.1.8" d="M 900.000 668.850 L 1020.000 668.850" fill="none" stroke="#475569" stroke-width="3"><title>continue 또는 stop</title></path>
<polygon data-arrowhead="root.0.1.7" points="1020.000,668.850 1010.000,674.850 1010.000,662.850" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="322.050" font-size="36" font-weight="700" fill="#111827">한 번의 agent loop를 이루는 다섯 단계</text>
<text data-source="root.0.1.0" x="120.000" y="419.000" font-size="28" font-weight="700" fill="#111827">Find work</text>
<text data-source="root.0.1.0" x="120.000" y="461.400" font-size="22" font-weight="400" fill="#111827">backlog, issue, diff scan에서 일거리를 찾음</text>
<text data-source="root.0.1.2" x="744.000" y="419.000" font-size="28" font-weight="700" fill="#111827">Hand out</text>
<text data-source="root.0.1.2" x="744.000" y="461.400" font-size="22" font-weight="400" fill="#111827">context와 scope를 agent에게 전달</text>
<text data-source="root.0.1.4" x="1368.000" y="419.000" font-size="28" font-weight="700" fill="#111827">Verify</text>
<text data-source="root.0.1.4" x="1368.000" y="461.400" font-size="22" font-weight="400" fill="#111827">tests, gates, review로 완료 조건을 확인</text>
<text data-source="root.0.1.6" x="432.000" y="657.800" font-size="28" font-weight="700" fill="#111827">Record</text>
<text data-source="root.0.1.6" x="432.000" y="700.200" font-size="22" font-weight="400" fill="#111827">notes, logs, state를 남김</text>
<text data-source="root.0.1.8" x="1056.000" y="657.800" font-size="28" font-weight="700" fill="#111827">Decide next</text>
<text data-source="root.0.1.8" x="1056.000" y="700.200" font-size="22" font-weight="400" fill="#111827">계속이면 다음 cycle의 find work로 이어짐</text>
<text data-source="root.0.1.1" x="580.000" y="380.650" font-size="22" font-weight="400" fill="#111827">범위와 완료</text>
<text data-source="root.0.1.1" x="580.000" y="410.350" font-size="22" font-weight="400" fill="#111827">조건을 정함</text>
<text data-source="root.0.1.3" x="1204.000" y="380.650" font-size="22" font-weight="400" fill="#111827">결과를</text>
<text data-source="root.0.1.3" x="1204.000" y="410.350" font-size="22" font-weight="400" fill="#111827">기준으로 검증</text>
<text data-source="root.0.1.5" x="660.000" y="541.450" font-size="22" font-weight="400" fill="#111827">다음 판단을 위한 기록</text>
<text data-source="root.0.1.7" x="892.000" y="619.450" font-size="22" font-weight="400" fill="#111827">continue 또는</text>
<text data-source="root.0.1.7" x="892.000" y="649.150" font-size="22" font-weight="400" fill="#111827">stop</text>
<text data-source="root.0.2" x="64.000" y="786.250" font-size="22" font-weight="400" fill="#111827">Verify가 루프의 중심입니다. 검증 없이 계속 진행하면 자동화된 loop가 아니라 무한 반복이 됩니다.</text>
</svg>
