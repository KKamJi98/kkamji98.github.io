<text data-source="root.0.0" x="64.000" y="121.450" font-size="36" font-weight="700" fill="#111827">Semantic cache hit와 RAG latency budget</text>
<text data-source="root.0.1.0" x="108.000" y="176.050" font-size="18" font-weight="700" fill="#111827">User query</text>
<text data-source="root.0.1.0" x="108.000" y="209.450" font-size="16" font-weight="400" fill="#111827">한 번의 질문이 cache부터 통과</text>
<text data-source="root.0.1.2" x="1044.000" y="176.050" font-size="18" font-weight="700" fill="#111827">Semantic cache</text>
<text data-source="root.0.1.2" x="1044.000" y="209.450" font-size="16" font-weight="400" fill="#111827">유사 query의 결과를 재사용할지 판정</text>
<text data-source="root.0.2.0.0" x="100.000" y="293.050" font-size="18" font-weight="700" fill="#111827">Cache hit</text>
<text data-source="root.0.2.0.1" x="112.000" y="341.350" font-size="18" font-weight="700" fill="#111827">Bypass retrieval and generation</text>
<text data-source="root.0.2.0.1" x="112.000" y="374.750" font-size="16" font-weight="400" fill="#111827">cache 결과를 공통 Answer로 즉시 전달</text>
<text data-source="root.0.2.1.0" x="978.000" y="293.050" font-size="18" font-weight="700" fill="#111827">Cache miss</text>
<text data-source="root.0.2.1.1.0" x="1022.000" y="341.350" font-size="18" font-weight="700" fill="#111827">Retrieval (ANN)</text>
<text data-source="root.0.2.1.1.0" x="1022.000" y="374.750" font-size="16" font-weight="400" fill="#111827">t_retrieve</text>
<text data-source="root.0.2.1.1.2" x="1483.000" y="341.350" font-size="18" font-weight="700" fill="#111827">Reranking</text>
<text data-source="root.0.2.1.1.2" x="1483.000" y="374.750" font-size="16" font-weight="400" fill="#111827">t_rerank</text>
<text data-source="root.0.2.1.1.4" x="1022.000" y="518.350" font-size="18" font-weight="700" fill="#111827">LLM generation</text>
<text data-source="root.0.2.1.1.4" x="1022.000" y="551.750" font-size="16" font-weight="400" fill="#111827">t_generate, usually the largest</text>
<text data-source="root.0.4" x="76.000" y="715.350" font-size="18" font-weight="700" fill="#111827">Answer</text>
<text data-source="root.0.4" x="76.000" y="748.750" font-size="16" font-weight="400" fill="#111827">cache 결과 또는 누적된 생성 결과를 반환</text>
<text data-source="root.0.5" x="64.000" y="794.350" font-size="16" font-weight="400" fill="#111827">Latency budget: t_retrieve + t_rerank + t_generate를 평균이 아니라 p99 기준으로 관리합니다.</text>
<text data-source="root.0.7" x="76.000" y="909.950" font-size="18" font-weight="700" fill="#111827">Ragas evaluation</text>
<text data-source="root.0.7" x="76.000" y="943.350" font-size="16" font-weight="400" fill="#111827">faithfulness와 context precision으로 품질을 측정</text>
<text data-source="root.0.8" x="64.000" y="988.950" font-size="16" font-weight="400" fill="#111827">hit는 짧은 경로이고 miss는 retrieval, reranking, generation의 시간을 모두 더합니다. 두 결과를 같은 Answer 평가 루프로 보냅니다.</text>
<text data-source="root.0.3" x="980.000" y="650.550" font-size="16" font-weight="400" fill="#111827">hit와 miss가 공통 Answer로 재결합</text>
<text data-source="root.0.6" x="980.000" y="845.150" font-size="16" font-weight="400" fill="#111827">Answer 품질을 같은 평가셋에서 확인</text>
<text data-source="root.0.1.1.meaning" x="904.000" y="169.650" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.2.1.1.1.meaning" x="1343.000" y="334.950" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
