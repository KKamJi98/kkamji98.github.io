<rect data-source="root.0.1.1" x="64.000" y="374.850" width="1792.000" height="169.300" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.1.2" x="64.000" y="560.150" width="1792.000" height="169.300" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.1.3" x="64.000" y="745.450" width="1792.000" height="169.300" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-node="root.0.1.0.1" x="80.000" y="248.550" width="1760.000" height="94.300" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.1.1" x="80.000" y="433.850" width="1760.000" height="94.300" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.2.1" x="80.000" y="619.150" width="1760.000" height="94.300" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.1.3.1" x="80.000" y="804.450" width="1760.000" height="94.300" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text data-source="root.0.0" x="64.000" y="160.950" font-size="36" font-weight="700" fill="#111827">Agent engineering 설계 범위</text>
<text data-source="root.0.1.0.0" x="80.000" y="225.550" font-size="20" font-weight="700" fill="#111827">1. prompt engineering</text>
<text data-source="root.0.1.0.1" x="96.000" y="284.550" font-size="20" font-weight="700" fill="#111827">한 instruction, 한 turn</text>
<text data-source="root.0.1.0.1" x="96.000" y="320.550" font-size="18" font-weight="400" fill="#111827">질문 하나와 답 하나의 품질을 다듬음</text>
<text data-source="root.0.1.1.0" x="80.000" y="410.850" font-size="20" font-weight="700" fill="#111827">2. context engineering</text>
<text data-source="root.0.1.1.1" x="96.000" y="469.850" font-size="20" font-weight="700" fill="#111827">모델이 볼 context를 큐레이션</text>
<text data-source="root.0.1.1.1" x="96.000" y="505.850" font-size="18" font-weight="400" fill="#111827">검색, memory, 문서 주입을 매 turn에 선택</text>
<text data-source="root.0.1.2.0" x="80.000" y="596.150" font-size="20" font-weight="700" fill="#111827">3. loop engineering</text>
<text data-source="root.0.1.2.1" x="96.000" y="655.150" font-size="20" font-weight="700" fill="#111827">에이전트를 대신 prompt하는 system</text>
<text data-source="root.0.1.2.1" x="96.000" y="691.150" font-size="18" font-weight="400" fill="#111827">한 작업을 완료할 때까지 반복 절차를 설계</text>
<text data-source="root.0.1.3.0" x="80.000" y="781.450" font-size="20" font-weight="700" fill="#111827">4. graph engineering</text>
<text data-source="root.0.1.3.1" x="96.000" y="840.450" font-size="20" font-weight="700" fill="#111827">task, agent, state를 graph로 조직</text>
<text data-source="root.0.1.3.1" x="96.000" y="876.450" font-size="18" font-weight="400" fill="#111827">여러 loop 사이의 의존성과 조정을 구조화</text>
<text data-source="root.0.2" x="64.000" y="948.750" font-size="18" font-weight="400" fill="#111827">위에서 아래로 갈수록 설계 대상이 문장과 context에서 작업, 여러 loop의 관계로 넓어집니다.</text>
</svg>
