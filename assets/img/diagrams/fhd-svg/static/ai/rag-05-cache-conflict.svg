<rect data-node="root.0.4.1.1" x="996.000" y="789.150" width="836.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<path data-edge="root.0.2" data-from="root.0.1" data-to="root.0.3" d="M 960.000 455.550 L 960.000 541.250" fill="none" stroke="#475569" stroke-width="3"><title>유사한 query가 같은 cache를 조회</title></path>
<polygon data-arrowhead="root.0.2" points="960.000,541.250 954.000,531.250 966.000,531.250" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="123.050" font-size="36" font-weight="700" fill="#111827">Query-only semantic cache가 role 경계를 넘는 방식</text>
<text data-source="root.0.1.0.0" x="112.000" y="235.650" font-size="28" font-weight="700" fill="#111827">User A</text>
<text data-source="root.0.1.0.1" x="136.000" y="321.450" font-size="28" font-weight="700" fill="#111827">Role: HR</text>
<text data-source="root.0.1.0.1" x="136.000" y="363.850" font-size="22" font-weight="400" fill="#111827">HR documents를 볼 권한이 있음</text>
<text data-source="root.0.1.1.0" x="996.000" y="235.650" font-size="28" font-weight="700" fill="#111827">User B</text>
<text data-source="root.0.1.1.1" x="1020.000" y="321.450" font-size="28" font-weight="700" fill="#111827">Role: Eng</text>
<text data-source="root.0.1.1.1" x="1020.000" y="363.850" font-size="22" font-weight="400" fill="#111827">HR documents를 볼 권한이 없음</text>
<text data-source="root.0.3" x="88.000" y="605.250" font-size="28" font-weight="700" fill="#111827">Semantic cache</text>
<text data-source="root.0.3" x="88.000" y="647.650" font-size="22" font-weight="400" fill="#111827">기본 key = query embedding</text>
<text data-source="root.0.4.0.0" x="88.000" y="755.350" font-size="28" font-weight="700" fill="#111827">Shared key: leak</text>
<text data-source="root.0.4.0.1" x="112.000" y="841.150" font-size="28" font-weight="700" fill="#111827">User B receives User A&#x27;s HR documents</text>
<text data-source="root.0.4.0.1" x="112.000" y="883.550" font-size="22" font-weight="400" fill="#111827">role을 key에서 빼면 cache hit가 인가를 우회</text>
<text data-source="root.0.4.1.0" x="996.000" y="755.350" font-size="28" font-weight="700" fill="#111827">Per-role key: isolate</text>
<text data-source="root.0.4.1.1" x="1020.000" y="841.150" font-size="28" font-weight="700" fill="#111827">격리되고 안전함</text>
<text data-source="root.0.4.1.1" x="1020.000" y="883.550" font-size="22" font-weight="400" fill="#111827">role을 key에 포함하면 hit rate가 낮아짐</text>
<text data-source="root.0.5" x="64.000" y="985.250" font-size="22" font-weight="400" fill="#111827">실제 cache namespace에는 role뿐 아니라 tenant, 문서 범위, policy version 등 현재 인가 문맥을 함께 반영해야 합니다.</text>
<text data-source="root.0.2" x="980.000" y="505.550" font-size="22" font-weight="400" fill="#111827">유사한 query가 같은 cache를 조회</text>
</svg>
