<text data-source="root.0.0" x="64.000" y="117.000" font-size="36" font-weight="700" fill="#111827">결정적 점수가 humanize 경로와 call 수를 선택</text>
<text data-source="root.0.1.0" x="136.000" y="205.600" font-size="20" font-weight="700" fill="#111827">Input prose</text>
<text data-source="root.0.1.0" x="136.000" y="241.600" font-size="18" font-weight="400" fill="#111827">아직 어떤 model도 읽지 않은 원문</text>
<text data-source="root.0.1.2" x="1048.000" y="205.600" font-size="20" font-weight="700" fill="#111827">prepare_monolith_input.py</text>
<text data-source="root.0.1.2" x="1048.000" y="241.600" font-size="18" font-weight="400" fill="#111827">counted tells와 risk band로 route_hint를 계산</text>
<text data-source="root.0.3.0.0" x="104.000" y="436.200" font-size="20" font-weight="700" fill="#111827">light</text>
<text data-source="root.0.3.0.1" x="120.000" y="495.200" font-size="20" font-weight="700" fill="#111827">1 call</text>
<text data-source="root.0.3.0.1" x="120.000" y="531.200" font-size="18" font-weight="400" fill="#111827">15000자 이하, counted tells 2개 이하이고 risk가 낮음</text>
<text data-source="root.0.3.1.0" x="690.667" y="436.200" font-size="20" font-weight="700" fill="#111827">standard</text>
<text data-source="root.0.3.1.1" x="706.667" y="495.200" font-size="20" font-weight="700" fill="#111827">2 calls</text>
<text data-source="root.0.3.1.1" x="706.667" y="531.200" font-size="18" font-weight="400" fill="#111827">heavy 조건이 아닌 입력 중 tells가 섞였거나 구조 지표 risk가 높음</text>
<text data-source="root.0.3.2.0" x="1277.333" y="436.200" font-size="20" font-weight="700" fill="#111827">heavy</text>
<text data-source="root.0.3.2.1" x="1293.333" y="495.200" font-size="20" font-weight="700" fill="#111827">3+ calls</text>
<text data-source="root.0.3.2.1" x="1293.333" y="531.200" font-size="18" font-weight="400" fill="#111827">tells 8개 이상 또는 15000자 초과</text>
<text data-source="root.0.5" x="80.000" y="717.800" font-size="20" font-weight="700" fill="#111827">verify_gates.py</text>
<text data-source="root.0.5" x="80.000" y="753.800" font-size="18" font-weight="400" fill="#111827">변경률 30%에서 경고하고 50%에서 중단</text>
<text data-source="root.0.7" x="80.000" y="900.400" font-size="20" font-weight="700" fill="#111827">final.md</text>
<text data-source="root.0.7" x="80.000" y="936.400" font-size="18" font-weight="400" fill="#111827">원문의 meaning unchanged</text>
<text data-source="root.0.8" x="64.000" y="992.700" font-size="18" font-weight="400" fill="#111827">잘 쓴 prose는 light로 빠르게 끝내고, dense한 AI slop만 heavy path에서 추가 호출을 부담합니다.</text>
<text data-source="root.0.2" x="980.000" y="337.900" font-size="18" font-weight="400" fill="#111827">route_hint에 따라 세 path로 분기</text>
