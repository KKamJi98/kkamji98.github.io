<text data-source="root.0.0" x="64.000" y="235.950" font-size="36" font-weight="700" fill="#111827">RAG와 LLM Wiki가 정리하는 시점</text>
<text data-source="root.0.1.0.0" x="88.000" y="324.550" font-size="28" font-weight="700" fill="#111827">RAG over raw sources</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="425.200" font-size="28" font-weight="700" fill="#111827">Raw sources</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="467.600" font-size="22" font-weight="400" fill="#111827">docs, tickets, threads</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="410.350" font-size="28" font-weight="700" fill="#111827">Chunk and embed</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="452.750" font-size="22" font-weight="400" fill="#111827">읽거나 모순을 조정하지 않고</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="482.450" font-size="22" font-weight="400" fill="#111827">조각을 만듦</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="662.150" font-size="28" font-weight="700" fill="#111827">Retrieve at query</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="698.550" font-size="28" font-weight="700" fill="#111827">time</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="740.950" font-size="22" font-weight="400" fill="#111827">relevant fragments를</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="770.650" font-size="22" font-weight="400" fill="#111827">가져오지만 unresolved 상태</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="662.150" font-size="28" font-weight="700" fill="#111827">Model reconciles per</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="698.550" font-size="28" font-weight="700" fill="#111827">query</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="740.950" font-size="22" font-weight="400" fill="#111827">같은 교차 참조와 모순 처리를</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="770.650" font-size="22" font-weight="400" fill="#111827">매번 반복</text>
<text data-source="root.0.1.1.0" x="996.000" y="324.550" font-size="28" font-weight="700" fill="#111827">LLM Wiki</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="425.200" font-size="28" font-weight="700" fill="#111827">Raw sources</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="467.600" font-size="22" font-weight="400" fill="#111827">같은 docs, tickets, threads</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="497.300" font-size="22" font-weight="400" fill="#111827">입력</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="410.350" font-size="28" font-weight="700" fill="#111827">Compile into notes</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="452.750" font-size="22" font-weight="400" fill="#111827">cross-links와</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="482.450" font-size="22" font-weight="400" fill="#111827">contradictions를</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="512.150" font-size="22" font-weight="400" fill="#111827">ingestion에서 해결</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="695.200" font-size="28" font-weight="700" fill="#111827">Markdown wiki</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="737.600" font-size="22" font-weight="400" fill="#111827">정리된 지식을 유지하고</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="767.300" font-size="22" font-weight="400" fill="#111827">git으로 versioning</text>
<text data-source="root.0.1.1.1.6" x="1510.000" y="691.850" font-size="28" font-weight="700" fill="#111827">Agent reads settled</text>
<text data-source="root.0.1.1.1.6" x="1510.000" y="728.250" font-size="28" font-weight="700" fill="#111827">notes</text>
<text data-source="root.0.1.1.1.6" x="1510.000" y="770.650" font-size="22" font-weight="400" fill="#111827">query마다 재추론하지 않음</text>
<text data-source="root.0.2" x="64.000" y="872.350" font-size="22" font-weight="400" fill="#111827">두 경로의 원문 입력은 같지만, RAG는 query time에 정리하고 LLM Wiki는 ingestion에서 한 번 컴파일합니다.</text>
