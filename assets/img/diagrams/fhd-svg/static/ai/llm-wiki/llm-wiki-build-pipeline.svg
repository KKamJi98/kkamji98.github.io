<polygon data-arrowhead="root.0.2" points="960.000,492.850 954.000,482.850 966.000,482.850" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="232.450" font-size="36" font-weight="700" fill="#111827">LLM Wiki의 vault, index, hook 연결</text>
<text data-source="root.0.1.0" x="120.000" y="321.050" font-size="28" font-weight="700" fill="#111827">Sources</text>
<text data-source="root.0.1.0" x="120.000" y="363.450" font-size="22" font-weight="400" fill="#111827">docs, logs, decisions</text>
<text data-source="root.0.1.2" x="1056.000" y="321.050" font-size="28" font-weight="700" fill="#111827">Obsidian vault</text>
<text data-source="root.0.1.2" x="1056.000" y="363.450" font-size="22" font-weight="400" fill="#111827">markdown과 frontmatter를 보관하는 source of truth</text>
<text data-source="root.0.3.0.0" x="88.000" y="556.850" font-size="28" font-weight="700" fill="#111827">검색 경로</text>
<text data-source="root.0.3.0.1.0" x="144.000" y="642.650" font-size="28" font-weight="700" fill="#111827">BM25 index</text>
<text data-source="root.0.3.0.1.0" x="144.000" y="685.050" font-size="22" font-weight="400" fill="#111827">로컬 BM25로 title, tags,</text>
<text data-source="root.0.3.0.1.0" x="144.000" y="714.750" font-size="22" font-weight="400" fill="#111827">body를 색인하며 vector</text>
<text data-source="root.0.3.0.1.0" x="144.000" y="744.450" font-size="22" font-weight="400" fill="#111827">database나 SaaS는</text>
<text data-source="root.0.3.0.1.0" x="144.000" y="774.150" font-size="22" font-weight="400" fill="#111827">사용하지 않습니다.</text>
<text data-source="root.0.3.0.1.2" x="602.000" y="672.350" font-size="28" font-weight="700" fill="#111827">Agent and search CLI</text>
<text data-source="root.0.3.0.1.2" x="602.000" y="714.750" font-size="22" font-weight="400" fill="#111827">이 index를 읽는 유일한</text>
<text data-source="root.0.3.0.1.2" x="602.000" y="744.450" font-size="22" font-weight="400" fill="#111827">consumer</text>
<text data-source="root.0.3.1.0" x="996.000" y="556.850" font-size="28" font-weight="700" fill="#111827">버전과 갱신 trigger</text>
<text data-source="root.0.3.1.1.0" x="1052.000" y="657.500" font-size="28" font-weight="700" fill="#111827">git</text>
<text data-source="root.0.3.1.1.0" x="1052.000" y="699.900" font-size="22" font-weight="400" fill="#111827">history와 review를 남김</text>
<text data-source="root.0.3.1.1.2" x="1510.000" y="642.650" font-size="28" font-weight="700" fill="#111827">Commit hook</text>
<text data-source="root.0.3.1.1.2" x="1510.000" y="685.050" font-size="22" font-weight="400" fill="#111827">link를 검사하고 BM25</text>
<text data-source="root.0.3.1.1.2" x="1510.000" y="714.750" font-size="22" font-weight="400" fill="#111827">index를 reindex</text>
<text data-source="root.0.4" x="64.000" y="875.850" font-size="22" font-weight="400" fill="#111827">vault의 내용은 index로 읽히고 git으로 versioning됩니다. Commit hook에서 index를 갱신하는 연결은 데이터 복사가 아니라 freshness trigger입니다.</text>
<text data-source="root.0.2" x="980.000" y="457.150" font-size="22" font-weight="400" fill="#111827">vault 내용이 검색과 version 관리로 분기</text>
