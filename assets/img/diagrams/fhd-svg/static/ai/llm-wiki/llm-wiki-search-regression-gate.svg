<text data-source="root.0.0" x="64.000" y="116.100" font-size="36" font-weight="700" fill="#111827">LLM Wiki 검색 회귀를 merge gate로 측정</text>
<text data-source="root.0.1.0.0" x="100.000" y="194.700" font-size="18" font-weight="700" fill="#111827">변경 입력</text>
<text data-source="root.0.1.0.1" x="112.000" y="243.000" font-size="18" font-weight="700" fill="#111827">Add or restructure notes</text>
<text data-source="root.0.1.0.1" x="112.000" y="276.400" font-size="16" font-weight="400" fill="#111827">검색 구조를 바꾸는 change under test</text>
<text data-source="root.0.1.1.0" x="978.000" y="194.700" font-size="18" font-weight="700" fill="#111827">평가 입력</text>
<text data-source="root.0.1.1.1" x="990.000" y="243.000" font-size="18" font-weight="700" fill="#111827">Eval set</text>
<text data-source="root.0.1.1.1" x="990.000" y="276.400" font-size="16" font-weight="400" fill="#111827">answer notes에 매핑한 50개 real questions</text>
<text data-source="root.0.3" x="76.000" y="440.000" font-size="18" font-weight="700" fill="#111827">Deterministic retriever</text>
<text data-source="root.0.3" x="76.000" y="473.400" font-size="16" font-weight="400" fill="#111827">같은 input이면 같은 ranking을 반환</text>
<text data-source="root.0.5" x="76.000" y="601.000" font-size="18" font-weight="700" fill="#111827">Recall@5 and MRR@5</text>
<text data-source="root.0.5" x="76.000" y="634.400" font-size="16" font-weight="400" fill="#111827">지난 run과 검색 순위를 비교</text>
<text data-source="root.0.7" x="76.000" y="762.000" font-size="18" font-weight="700" fill="#111827">Gate</text>
<text data-source="root.0.7" x="76.000" y="795.400" font-size="16" font-weight="400" fill="#111827">recall이 떨어지면 변경을 되돌리거나 note 구조를 다시 설계</text>
<text data-source="root.0.8.0" x="76.000" y="855.000" font-size="18" font-weight="700" fill="#111827">부작용: hub에서 고립된 note</text>
<text data-source="root.0.8.1.0" x="120.000" y="903.300" font-size="18" font-weight="700" fill="#111827">Note change</text>
<text data-source="root.0.8.1.0" x="120.000" y="936.700" font-size="16" font-weight="400" fill="#111827">hub link 없이 추가된 note</text>
<text data-source="root.0.8.1.2" x="1044.000" y="903.300" font-size="18" font-weight="700" fill="#111827">Unreachable notes</text>
<text data-source="root.0.8.1.2" x="1044.000" y="936.700" font-size="16" font-weight="400" fill="#111827">어떤 hub에서도 링크되지 않아 candidate가 되지 않음</text>
<text data-source="root.0.8.1.1" x="892.000" y="896.200" font-size="16" font-weight="400" fill="#111827">연결이 없으면</text>
<text data-source="root.0.9" x="64.000" y="994.300" font-size="16" font-weight="400" fill="#111827">Add or restructure notes는 검색 점수뿐 아니라 연결되지 않은 note를 만들 수 있으므로, eval set과 orphan 경로를 함께 확인합니다.</text>
<text data-source="root.0.2" x="980.000" y="375.200" font-size="16" font-weight="400" fill="#111827">같은 입력으로 결정적 검색을 재실행</text>
