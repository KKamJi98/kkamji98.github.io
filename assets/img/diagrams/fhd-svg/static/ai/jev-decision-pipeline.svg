<text data-source="jev-title.meaning" x="64.000" y="92.000" font-size="40" font-weight="700" fill="#111827">Jev 판단과 실행 권한의 경계</text>
<text data-source="jev-subtitle.meaning" x="64.000" y="138.000" font-size="25" font-weight="400" fill="#475569">검증된 입력과 확률 신호를 코드가 정한 정책으로 연결</text>
<text data-source="jev-signals.meaning" x="88.000" y="240.000" font-size="28" font-weight="700" fill="#4438a5">Jev: 판단 신호 반환</text>
<text data-source="root.0.0.2.0" x="1272.000" y="240.000" font-size="28" font-weight="700" fill="#0f766e">실행 권한 판단</text>
<text data-source="root.0.0.0.0" x="112.000" y="336.000" font-size="34" font-weight="700" fill="#111827">State</text>
<text data-source="root.0.0.0.0" x="112.000" y="376.000" font-size="24" font-weight="400" fill="#111827">Typed Questions</text>
<text data-source="root.0.0.0.2" x="680.000" y="336.000" font-size="34" font-weight="700" fill="#111827">Jev</text>
<text data-source="root.0.0.0.2" x="680.000" y="376.000" font-size="24" font-weight="400" fill="#111827">실행 권한 없음</text>
<text data-source="root.0.0.2.1" x="1296.000" y="336.000" font-size="34" font-weight="700" fill="#111827">Deterministic Policy</text>
<text data-source="root.0.0.2.1" x="1296.000" y="376.000" font-size="24" font-weight="400" fill="#111827">코드와 정책이 결정</text>
<text data-source="root.0.0.0.0" x="112.000" y="432.000" font-size="23" font-weight="400" fill="#111827">tool: kubectl</text>
<text data-source="root.0.0.0.0" x="112.000" y="472.000" font-size="23" font-weight="400" fill="#111827">canonical_args:</text>
<text data-source="root.0.0.0.0" x="112.000" y="508.000" font-size="23" font-weight="400" fill="#111827">delete / namespace</text>
<text data-source="root.0.0.0.0" x="112.000" y="544.000" font-size="23" font-weight="400" fill="#111827">production</text>
<text data-source="root.0.0.0.0" x="112.000" y="600.000" font-size="23" font-weight="400" fill="#111827">environment: production</text>
<text data-source="root.0.0.0.0" x="112.000" y="644.000" font-size="23" font-weight="400" fill="#111827">caller_role: release-bot</text>
<text data-source="root.0.0.0.0" x="112.000" y="688.000" font-size="23" font-weight="400" fill="#111827">change_window: closed</text>
<text data-source="root.0.0.0.2" x="704.000" y="447.000" font-size="24" font-weight="700" fill="#4438a5">Choice / tool_risk</text>
<text data-source="root.0.0.0.2" x="704.000" y="486.000" font-size="22" font-weight="400" fill="#111827">review_required, confidence 1.0</text>
<text data-source="root.0.0.0.2" x="704.000" y="547.000" font-size="24" font-weight="700" fill="#0f766e">Noul / irreversible</text>
<text data-source="root.0.0.0.2" x="704.000" y="586.000" font-size="22" font-weight="400" fill="#111827">noul 0.78, yes probability</text>
<text data-source="root.0.0.0.2" x="704.000" y="647.000" font-size="24" font-weight="700" fill="#6843a6">Score / blast_radius</text>
<text data-source="root.0.0.0.2" x="704.000" y="686.000" font-size="22" font-weight="400" fill="#111827">score 2.78, confidence 0.78</text>
<text data-source="root.0.0.2.1" x="1296.000" y="440.000" font-size="22" font-weight="400" fill="#111827">risk.choice != &quot;bounded&quot;</text>
<text data-source="root.0.0.2.1" x="1296.000" y="488.000" font-size="22" font-weight="400" fill="#111827">risk.confidence &lt; 0.90</text>
<text data-source="root.0.0.2.1" x="1296.000" y="536.000" font-size="22" font-weight="400" fill="#111827">irreversible.noul &gt;= 0.10</text>
<text data-source="root.0.0.2.1" x="1296.000" y="584.000" font-size="22" font-weight="400" fill="#111827">blast_radius.score &gt;= 2</text>
<text data-source="root.0.0.2.1" x="1296.000" y="632.000" font-size="22" font-weight="400" fill="#111827">blast_radius.confidence &lt; 0.90</text>
<text data-source="root.0.0.2.1" x="1296.000" y="692.000" font-size="24" font-weight="400" fill="#92400e">하나라도 충족하면 Escalate</text>
<text data-source="root.0.0.2.3.0" x="1296.000" y="875.000" font-size="30" font-weight="700" fill="#111827">Shadow</text>
<text data-source="root.0.0.2.3.0" x="1296.000" y="915.000" font-size="22" font-weight="400" fill="#111827">실행 없이 비교</text>
<text data-source="root.0.0.2.3.1" x="1600.000" y="875.000" font-size="30" font-weight="700" fill="#111827">Escalate</text>
<text data-source="root.0.0.2.3.1" x="1600.000" y="915.000" font-size="22" font-weight="400" fill="#111827">사람 / 상위 제어</text>
<text data-source="root.0.0.0.1.meaning" x="564.000" y="482.000" font-size="24" font-weight="400" fill="#111827">입력</text>
<text data-source="root.0.0.1" x="1172.000" y="446.000" font-size="22" font-weight="400" fill="#111827">typed</text>
<text data-source="root.0.0.1" x="1172.000" y="486.000" font-size="22" font-weight="400" fill="#111827">answers</text>
<text data-source="root.0.1" x="112.000" y="808.000" font-size="23" font-weight="700" fill="#475569">본문 측정 예시 - 실행 허가가 아님</text>
<text data-source="root.0.1" x="112.000" y="850.000" font-size="25" font-weight="400" fill="#111827">kubectl delete namespace production</text>
<text data-source="root.0.1" x="956.000" y="850.000" font-size="26" font-weight="700" fill="#92400e">Escalate</text>
<text data-source="root.0.1" x="112.000" y="890.000" font-size="25" font-weight="400" fill="#111827">git status --short</text>
<text data-source="root.0.1" x="956.000" y="890.000" font-size="26" font-weight="700" fill="#0f766e">Shadow</text>
<text data-source="root.0.1" x="112.000" y="930.000" font-size="25" font-weight="400" fill="#111827">rm -rf ./build</text>
<text data-source="root.0.1" x="956.000" y="930.000" font-size="26" font-weight="700" fill="#92400e">Escalate</text>
<text data-source="root.0.2" x="64.000" y="1032.000" font-size="23" font-weight="400" fill="#475569">판단은 병렬로 수행하며, 실행 권한은 Policy와 Harness에 남습니다. 값과 임계값은 본문 예시입니다.</text>
<text data-source="root.0.0.2.2.branch-0.meaning" x="1280.000" y="804.000" font-size="14" font-weight="400" fill="#111827">Shadow 경로</text>
<text data-source="root.0.0.2.2.branch-1.meaning" x="1718.000" y="804.000" font-size="14" font-weight="400" fill="#111827">Escalate 경로</text>
</svg>
