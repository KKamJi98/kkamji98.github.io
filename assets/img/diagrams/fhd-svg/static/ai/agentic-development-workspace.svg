<path data-edge="root.0.4" data-from="root.0.3" data-to="root.0.5" d="M 960.000 580.150 L 960.000 644.450" fill="none" stroke="#475569" stroke-width="3"><title>Workspace</title></path>
<polygon data-arrowhead="root.0.4" points="960.000,644.450 954.000,634.450 966.000,634.450" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="139.650" font-size="36" font-weight="700" fill="#111827">Agentic development workspace 책임 경계</text>
<text data-source="root.0.1.0.0" x="104.000" y="228.250" font-size="20" font-weight="700" fill="#111827">주요 진입</text>
<text data-source="root.0.1.0.1.0" x="120.000" y="287.250" font-size="20" font-weight="700" fill="#111827">Developer</text>
<text data-source="root.0.1.0.1.0" x="120.000" y="323.250" font-size="18" font-weight="400" fill="#111827">task를 선언하고 결과를 review</text>
<text data-source="root.0.1.1.0" x="984.000" y="228.250" font-size="20" font-weight="700" fill="#111827">복구 진입</text>
<text data-source="root.0.1.1.1.0" x="1000.000" y="287.250" font-size="20" font-weight="700" fill="#111827">Ghostty</text>
<text data-source="root.0.1.1.1.0" x="1000.000" y="323.250" font-size="18" font-weight="400" fill="#111827">cmux 장애와 설정 복구를 위한 독립 terminal</text>
<text data-source="root.0.3" x="80.000" y="509.850" font-size="20" font-weight="700" fill="#111827">cmux</text>
<text data-source="root.0.3" x="80.000" y="545.850" font-size="18" font-weight="400" fill="#111827">control plane에서 task를 찾고 attention을 배분</text>
<text data-source="root.0.5" x="80.000" y="692.450" font-size="20" font-weight="700" fill="#111827">Workspace</text>
<text data-source="root.0.5" x="80.000" y="728.450" font-size="18" font-weight="400" fill="#111827">하나의 task와 하나의 worktree를 가리킴</text>
<text data-source="root.0.6.0.0" x="80.000" y="802.750" font-size="20" font-weight="700" fill="#111827">Native agent session</text>
<text data-source="root.0.6.0.1.0" x="96.000" y="861.750" font-size="20" font-weight="700" fill="#111827">Agent CLI</text>
<text data-source="root.0.6.0.1.0" x="96.000" y="897.750" font-size="18" font-weight="400" fill="#111827">cmux terminal에서 직접 실행하고 native session과 resume을 유지</text>
<text data-source="root.0.6.1.0" x="984.000" y="802.750" font-size="20" font-weight="700" fill="#111827">장기 process</text>
<text data-source="root.0.6.1.1.0" x="1000.000" y="861.750" font-size="20" font-weight="700" fill="#111827">tmux</text>
<text data-source="root.0.6.1.1.0" x="1000.000" y="897.750" font-size="18" font-weight="400" fill="#111827">pane보다 오래 살아야 하는 명시적 process lifetime에만 사용</text>
<text data-source="root.0.7" x="64.000" y="970.050" font-size="18" font-weight="400" fill="#111827">tmux는 Workspace 아래의 선택적 persistence layer이며, native subagent와 one-shot worker에는 필요하지 않습니다.</text>
<text data-source="root.0.2" x="980.000" y="435.550" font-size="18" font-weight="400" fill="#111827">두 진입점이 attention control로 모임</text>
</svg>
