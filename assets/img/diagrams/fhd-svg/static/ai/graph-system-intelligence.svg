<path data-edge="root.0.2" data-from="root.0.1" data-to="root.0.3" d="M 960.000 558.850 L 960.000 623.150" fill="none" stroke="#475569" stroke-width="3"><title>loop와 ontology가 같은 구조를 참조</title></path>
<polygon data-arrowhead="root.0.2" points="960.000,623.150 954.000,613.150 966.000,613.150" fill="#475569"/>
<path data-edge="root.0.4" data-from="root.0.3" data-to="root.0.5" d="M 960.000 741.450 L 960.000 805.750" fill="none" stroke="#475569" stroke-width="3"><title>다음 단계</title></path>
<polygon data-arrowhead="root.0.4" points="960.000,805.750 954.000,795.750 966.000,795.750" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="163.650" font-size="36" font-weight="700" fill="#111827">Graph engineering이 시스템을 조직하는 방식</text>
<text data-source="root.0.1.0.0" x="80.000" y="228.250" font-size="20" font-weight="700" fill="#111827">Loop A</text>
<text data-source="root.0.1.0.1" x="96.000" y="287.250" font-size="20" font-weight="700" fill="#111827">Coding agent loop</text>
<text data-source="root.0.1.0.1" x="96.000" y="323.250" font-size="18" font-weight="400" fill="#111827">작업을 수행하고 다음 상태를 남김</text>
<text data-source="root.0.1.1.0" x="984.000" y="228.250" font-size="20" font-weight="700" fill="#111827">Loop B</text>
<text data-source="root.0.1.1.1" x="1000.000" y="287.250" font-size="20" font-weight="700" fill="#111827">Review and audit loop</text>
<text data-source="root.0.1.1.1" x="1000.000" y="323.250" font-size="18" font-weight="400" fill="#111827">변경을 읽고 검증 결과를 연결</text>
<text data-source="root.0.1.2.0" x="80.000" y="413.550" font-size="20" font-weight="700" fill="#111827">공유 의미 계층</text>
<text data-source="root.0.1.2.1" x="96.000" y="472.550" font-size="20" font-weight="700" fill="#111827">Ontology</text>
<text data-source="root.0.1.2.1" x="96.000" y="508.550" font-size="18" font-weight="400" fill="#111827">agent 사이의 용어와 관계를 통일</text>
<text data-source="root.0.3" x="80.000" y="671.150" font-size="20" font-weight="700" fill="#111827">Task graph</text>
<text data-source="root.0.3" x="80.000" y="707.150" font-size="18" font-weight="400" fill="#111827">task는 node, dependency와 handoff는 edge</text>
<text data-source="root.0.5" x="80.000" y="853.750" font-size="20" font-weight="700" fill="#111827">Shared state</text>
<text data-source="root.0.5" x="80.000" y="889.750" font-size="18" font-weight="400" fill="#111827">누가 무엇을 했고 상태가 어디에 있는지 함께 기록</text>
<text data-source="root.0.6" x="64.000" y="946.050" font-size="18" font-weight="400" fill="#111827">여러 loop가 각자 상태를 들지 않고 graph를 공유할 때 individual intelligence가 system intelligence로 확장됩니다.</text>
<text data-source="root.0.2" x="980.000" y="596.850" font-size="18" font-weight="400" fill="#111827">loop와 ontology가 같은 구조를 참조</text>
<text data-source="root.0.4.meaning" x="980.000" y="778.150" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
</svg>
