<text data-source="root.0.0" x="64.000" y="434.950" font-size="36" font-weight="700" fill="#111827">RUM Resource와 backend trace를 같은 trace_id로 연결</text>
<text data-source="root.0.1.0" x="120.000" y="523.550" font-size="28" font-weight="700" fill="#111827">Browser + RUM Browser SDK</text>
<text data-source="root.0.1.0" x="120.000" y="565.950" font-size="22" font-weight="400" fill="#111827">click 뒤 fetch 또는 XHR을 만들고 request</text>
<text data-source="root.0.1.0" x="120.000" y="595.650" font-size="22" font-weight="400" fill="#111827">header에 trace_id 주입</text>
<text data-source="root.0.1.2" x="744.000" y="538.400" font-size="28" font-weight="700" fill="#111827">Backend service + APM tracer</text>
<text data-source="root.0.1.2" x="744.000" y="580.800" font-size="22" font-weight="400" fill="#111827">받은 trace_id를 이어받아 span 생성</text>
<text data-source="root.0.1.4" x="1368.000" y="538.400" font-size="28" font-weight="700" fill="#111827">Database</text>
<text data-source="root.0.1.4" x="1368.000" y="580.800" font-size="22" font-weight="400" fill="#111827">느린 SQL이 backend 병목으로 드러나는 지점</text>
<text data-source="root.0.1.1" x="580.000" y="500.050" font-size="22" font-weight="400" fill="#111827">trace context</text>
<text data-source="root.0.1.1" x="580.000" y="529.750" font-size="22" font-weight="400" fill="#111827">전달</text>
<text data-source="root.0.1.3" x="1204.000" y="500.050" font-size="22" font-weight="400" fill="#111827">DB 호출 span</text>
<text data-source="root.0.1.3" x="1204.000" y="529.750" font-size="22" font-weight="400" fill="#111827">생성</text>
<text data-source="root.0.2" x="64.000" y="673.350" font-size="22" font-weight="400" fill="#111827">연결 조건: allowedTracingUrls에 backend origin이 있어야 header가 주입됩니다. 등록이 빠지면 RUM Resource와 backend trace가 각각 남고 한 흐름으로 연결되지 않습니다.</text>
