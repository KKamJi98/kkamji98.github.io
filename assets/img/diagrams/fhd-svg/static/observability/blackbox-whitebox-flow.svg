<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="9cf0e838e82eeb36d24b51bbfec21a5c55ff1d680061f118a095c85034084d89">
