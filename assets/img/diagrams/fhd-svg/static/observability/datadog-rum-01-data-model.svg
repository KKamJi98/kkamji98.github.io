<text data-source="root.0.0" x="64.000" y="195.950" font-size="36" font-weight="700" fill="#111827">RUM 데이터는 Session &gt; View &gt; Event 계층으로 쌓인다</text>
<text data-source="root.0.1.0" x="120.000" y="322.600" font-size="28" font-weight="700" fill="#111827">Session (session.id)</text>
<text data-source="root.0.1.0" x="120.000" y="365.000" font-size="22" font-weight="400" fill="#111827">사용자 여정 전체, 최대 4시간, 15분 비활동 시 만료</text>
<text data-source="root.0.1.2" x="1056.000" y="322.600" font-size="28" font-weight="700" fill="#111827">View (view.id)</text>
<text data-source="root.0.1.2" x="1056.000" y="365.000" font-size="22" font-weight="400" fill="#111827">initial load 또는 route change마다 생성</text>
<text data-source="root.0.1.4.0" x="120.000" y="582.750" font-size="28" font-weight="700" fill="#111827">Action</text>
<text data-source="root.0.1.4.0" x="120.000" y="625.150" font-size="22" font-weight="400" fill="#111827">click, tap, frustration</text>
<text data-source="root.0.1.4.0" x="120.000" y="654.850" font-size="22" font-weight="400" fill="#111827">signal</text>
<text data-source="root.0.1.4.1" x="392.000" y="582.750" font-size="28" font-weight="700" fill="#111827">Resource</text>
<text data-source="root.0.1.4.1" x="392.000" y="625.150" font-size="22" font-weight="400" fill="#111827">XHR, fetch와 단계별</text>
<text data-source="root.0.1.4.1" x="392.000" y="654.850" font-size="22" font-weight="400" fill="#111827">timing</text>
<text data-source="root.0.1.4.2" x="664.000" y="582.750" font-size="28" font-weight="700" fill="#111827">Error</text>
<text data-source="root.0.1.4.2" x="664.000" y="625.150" font-size="22" font-weight="400" fill="#111827">JS error, crash, stack</text>
<text data-source="root.0.1.4.2" x="664.000" y="654.850" font-size="22" font-weight="400" fill="#111827">trace</text>
<text data-source="root.0.1.4.3" x="120.000" y="762.550" font-size="28" font-weight="700" fill="#111827">Long Task</text>
<text data-source="root.0.1.4.3" x="120.000" y="804.950" font-size="22" font-weight="400" fill="#111827">main thread를 50ms</text>
<text data-source="root.0.1.4.3" x="120.000" y="834.650" font-size="22" font-weight="400" fill="#111827">이상 block</text>
<text data-source="root.0.1.4.4" x="392.000" y="762.550" font-size="28" font-weight="700" fill="#111827">Vital</text>
<text data-source="root.0.1.4.4" x="392.000" y="804.950" font-size="22" font-weight="400" fill="#111827">Core Web Vitals와</text>
<text data-source="root.0.1.4.4" x="392.000" y="834.650" font-size="22" font-weight="400" fill="#111827">custom vital</text>
<text data-source="root.0.1.1" x="892.000" y="254.550" font-size="22" font-weight="400" fill="#111827">페이지 또는</text>
<text data-source="root.0.1.1" x="892.000" y="284.250" font-size="22" font-weight="400" fill="#111827">화면 단위로</text>
<text data-source="root.0.1.1" x="892.000" y="313.950" font-size="22" font-weight="400" fill="#111827">묶음</text>
<text data-source="root.0.1.3" x="104.000" y="474.750" font-size="22" font-weight="400" fill="#111827">수집 시점의 active View에 귀속</text>
<text data-source="root.0.2" x="64.000" y="912.350" font-size="22" font-weight="400" fill="#111827">다섯 Event는 View에서 갈라지는 종류이며 서로의 실행 순서를 뜻하지 않습니다. 각 Event에는 당시 active View의 맥락이 붙습니다.</text>
</svg>
