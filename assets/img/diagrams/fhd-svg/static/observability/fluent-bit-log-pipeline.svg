<path data-edge="root.0.1.7" data-from="root.0.1.6" data-to="root.0.1.8" d="M 900.000 698.550 L 1020.000 698.550" fill="none" stroke="#475569" stroke-width="3"><title>운영자에게 결과 표시</title></path>
<polygon data-arrowhead="root.0.1.7" points="1020.000,698.550 1010.000,704.550 1010.000,692.550" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="292.350" font-size="36" font-weight="700" fill="#111827">Fluent Bit이 Node의 container log를 수집해 검색 경로로 전달</text>
<text data-source="root.0.1.0" x="120.000" y="419.000" font-size="28" font-weight="700" fill="#111827">Container logs</text>
<text data-source="root.0.1.0" x="120.000" y="461.400" font-size="22" font-weight="400" fill="#111827">Node에 남은 stdout와 stderr</text>
<text data-source="root.0.1.2" x="744.000" y="404.150" font-size="28" font-weight="700" fill="#111827">Fluent Bit</text>
<text data-source="root.0.1.2" x="744.000" y="446.550" font-size="22" font-weight="400" fill="#111827">Node마다 DaemonSet Pod 하나가 수집과</text>
<text data-source="root.0.1.2" x="744.000" y="476.250" font-size="22" font-weight="400" fill="#111827">전송</text>
<text data-source="root.0.1.4" x="1368.000" y="419.000" font-size="28" font-weight="700" fill="#111827">Elasticsearch</text>
<text data-source="root.0.1.4" x="1368.000" y="461.400" font-size="22" font-weight="400" fill="#111827">로그를 parse, enrich하고 index에 저장</text>
<text data-source="root.0.1.6" x="432.000" y="687.500" font-size="28" font-weight="700" fill="#111827">Kibana</text>
<text data-source="root.0.1.6" x="432.000" y="729.900" font-size="22" font-weight="400" fill="#111827">저장된 index를 query하고 시각화</text>
<text data-source="root.0.1.8" x="1056.000" y="687.500" font-size="28" font-weight="700" fill="#111827">Log search</text>
<text data-source="root.0.1.8" x="1056.000" y="729.900" font-size="22" font-weight="400" fill="#111827">운영자가 실제로 읽는 검색 결과</text>
<text data-source="root.0.1.1" x="580.000" y="410.350" font-size="22" font-weight="400" fill="#111827">파일 tail</text>
<text data-source="root.0.1.3" x="1204.000" y="350.950" font-size="22" font-weight="400" fill="#111827">parse와</text>
<text data-source="root.0.1.3" x="1204.000" y="380.650" font-size="22" font-weight="400" fill="#111827">metadata</text>
<text data-source="root.0.1.3" x="1204.000" y="410.350" font-size="22" font-weight="400" fill="#111827">보강</text>
<text data-source="root.0.1.5" x="660.000" y="571.150" font-size="22" font-weight="400" fill="#111827">index query</text>
<text data-source="root.0.1.7" x="892.000" y="649.150" font-size="22" font-weight="400" fill="#111827">운영자에게</text>
<text data-source="root.0.1.7" x="892.000" y="678.850" font-size="22" font-weight="400" fill="#111827">결과 표시</text>
<text data-source="root.0.2" x="64.000" y="815.950" font-size="22" font-weight="400" fill="#111827">Fluent Bit은 애플리케이션 내부가 아니라 각 Node의 container log를 읽습니다. DaemonSet으로 모든 Node에 수집 Pod를 배치합니다.</text>
</svg>
