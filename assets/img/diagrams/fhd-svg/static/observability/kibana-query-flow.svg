<text data-source="root.0.0" x="64.000" y="285.850" font-size="36" font-weight="700" fill="#111827">Kibana는 데이터를 보관하지 않고 Elasticsearch query를 만든다</text>
<text data-source="root.0.1.0" x="120.000" y="397.650" font-size="28" font-weight="700" fill="#111827">User</text>
<text data-source="root.0.1.0" x="120.000" y="440.050" font-size="22" font-weight="400" fill="#111827">dashboard 또는 log</text>
<text data-source="root.0.1.0" x="120.000" y="469.750" font-size="22" font-weight="400" fill="#111827">search를 요청</text>
<text data-source="root.0.1.2" x="589.757" y="397.650" font-size="28" font-weight="700" fill="#111827">Kibana</text>
<text data-source="root.0.1.2" x="589.757" y="440.050" font-size="22" font-weight="400" fill="#111827">index pattern을 바탕으로</text>
<text data-source="root.0.1.2" x="589.757" y="469.750" font-size="22" font-weight="400" fill="#111827">query 생성</text>
<text data-source="root.0.1.4" x="1059.514" y="412.500" font-size="28" font-weight="700" fill="#111827">Elasticsearch</text>
<text data-source="root.0.1.4" x="1059.514" y="454.900" font-size="22" font-weight="400" fill="#111827">여러 shard에서 query 실행</text>
<text data-source="root.0.1.6" x="1529.271" y="397.650" font-size="28" font-weight="700" fill="#111827">Log indices</text>
<text data-source="root.0.1.6" x="1529.271" y="440.050" font-size="22" font-weight="400" fill="#111827">time range와 index</text>
<text data-source="root.0.1.6" x="1529.271" y="469.750" font-size="22" font-weight="400" fill="#111827">pattern이 정한 검색 대상</text>
<text data-source="root.0.1.8" x="120.000" y="672.650" font-size="28" font-weight="700" fill="#111827">Search results</text>
<text data-source="root.0.1.8" x="120.000" y="715.050" font-size="22" font-weight="400" fill="#111827">dashboard table, chart 또는</text>
<text data-source="root.0.1.8" x="120.000" y="744.750" font-size="22" font-weight="400" fill="#111827">검색 목록</text>
<text data-source="root.0.1.1" x="418.729" y="344.450" font-size="22" font-weight="400" fill="#111827">panel 설정과</text>
<text data-source="root.0.1.1" x="418.729" y="374.150" font-size="22" font-weight="400" fill="#111827">time range</text>
<text data-source="root.0.1.1" x="418.729" y="403.850" font-size="22" font-weight="400" fill="#111827">전달</text>
<text data-source="root.0.1.3" x="888.486" y="374.150" font-size="22" font-weight="400" fill="#111827">Elasticsearch</text>
<text data-source="root.0.1.3" x="888.486" y="403.850" font-size="22" font-weight="400" fill="#111827">에 query 전송</text>
<text data-source="root.0.1.5" x="1358.243" y="374.150" font-size="22" font-weight="400" fill="#111827">pattern이 대상</text>
<text data-source="root.0.1.5" x="1358.243" y="403.850" font-size="22" font-weight="400" fill="#111827">index 선택</text>
<text data-source="root.0.1.7" x="104.000" y="564.650" font-size="22" font-weight="400" fill="#111827">결과를 panel에 반환</text>
<text data-source="root.0.2" x="64.000" y="822.450" font-size="22" font-weight="400" fill="#111827">Kibana에 원본 log data가 쌓이는 것이 아니라 Elasticsearch query 결과가 표시됩니다. 넓은 time range는 index pattern이 많은 index를 건드려 비용이 커질 수 있습니다.</text>
</svg>
