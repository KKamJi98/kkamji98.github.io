<text data-source="root.0.0" x="64.000" y="309.050" font-size="36" font-weight="700" fill="#111827">CloudWatch Logs Subscription Filter가 Lambda 로그를 ELK로 모읍니다</text>
<text data-source="root.0.1" x="64.000" y="367.650" font-size="22" font-weight="400" fill="#111827">여러 Lambda의 Log Group을 하나의 forwarding Lambda로 수렴시킨 뒤 Logstash HTTP input 5044로 전달합니다.</text>
<text data-source="root.0.2.0" x="120.000" y="466.200" font-size="28" font-weight="700" fill="#111827">Lambda functions x4</text>
<text data-source="root.0.2.0" x="120.000" y="508.600" font-size="22" font-weight="400" fill="#111827">각 함수가 실행 로그를 남깁니다.</text>
<text data-source="root.0.2.2" x="770.667" y="451.350" font-size="28" font-weight="700" fill="#111827">CloudWatch Logs Log Groups</text>
<text data-source="root.0.2.2" x="770.667" y="493.750" font-size="22" font-weight="400" fill="#111827">Lambda별 그룹에 로그가 분산</text>
<text data-source="root.0.2.2" x="770.667" y="523.450" font-size="22" font-weight="400" fill="#111827">저장됩니다.</text>
<text data-source="root.0.2.4" x="1421.333" y="451.350" font-size="28" font-weight="700" fill="#111827">Log forwarding Lambda</text>
<text data-source="root.0.2.4" x="1421.333" y="493.750" font-size="22" font-weight="400" fill="#111827">구독 payload를 읽고 필요한 로그를</text>
<text data-source="root.0.2.4" x="1421.333" y="523.450" font-size="22" font-weight="400" fill="#111827">필터링합니다.</text>
<text data-source="root.0.2.6" x="120.000" y="703.150" font-size="28" font-weight="700" fill="#111827">Logstash</text>
<text data-source="root.0.2.6" x="120.000" y="745.550" font-size="22" font-weight="400" fill="#111827">정제된 event를 수신해 pipeline으로</text>
<text data-source="root.0.2.6" x="120.000" y="775.250" font-size="22" font-weight="400" fill="#111827">전달합니다.</text>
<text data-source="root.0.2.8" x="770.667" y="718.000" font-size="28" font-weight="700" fill="#111827">Elasticsearch</text>
<text data-source="root.0.2.8" x="770.667" y="760.400" font-size="22" font-weight="400" fill="#111827">중앙 검색용 로그 index를 보관합니다.</text>
<text data-source="root.0.2.10" x="1421.333" y="703.150" font-size="28" font-weight="700" fill="#111827">Kibana</text>
<text data-source="root.0.2.10" x="1421.333" y="745.550" font-size="22" font-weight="400" fill="#111827">여러 Lambda 로그를 한 화면에서</text>
<text data-source="root.0.2.10" x="1421.333" y="775.250" font-size="22" font-weight="400" fill="#111827">시각화합니다.</text>
<text data-source="root.0.2.1" x="534.667" y="427.850" font-size="22" font-weight="400" fill="#111827">function별 log</text>
<text data-source="root.0.2.1" x="534.667" y="457.550" font-size="22" font-weight="400" fill="#111827">stream</text>
<text data-source="root.0.2.3" x="1185.333" y="457.550" font-size="22" font-weight="400" fill="#111827">Subscription Filter</text>
<text data-source="root.0.2.5" x="321.333" y="595.150" font-size="22" font-weight="400" fill="#111827">HTTP input :5044</text>
<text data-source="root.0.2.7" x="526.667" y="709.350" font-size="22" font-weight="400" fill="#111827">index and store</text>
<text data-source="root.0.2.9" x="1177.333" y="709.350" font-size="22" font-weight="400" fill="#111827">dashboard query</text>
</svg>
