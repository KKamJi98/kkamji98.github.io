<text data-source="root.0.0" x="64.000" y="290.850" font-size="36" font-weight="700" fill="#111827">Helm provider가 release lifecycle을 Terraform state에 연결합니다</text>
<text data-source="root.0.1" x="64.000" y="349.450" font-size="22" font-weight="400" fill="#111827">helm_release를 Terraform이 소유하므로 수동 helm upgrade는 다음 plan에서 drift로 보입니다.</text>
<text data-source="root.0.2.0" x="120.000" y="433.150" font-size="28" font-weight="700" fill="#111827">Terraform</text>
<text data-source="root.0.2.0" x="120.000" y="469.550" font-size="28" font-weight="700" fill="#111827">configuration</text>
<text data-source="root.0.2.0" x="120.000" y="511.950" font-size="22" font-weight="400" fill="#111827">helm_release resource와</text>
<text data-source="root.0.2.0" x="120.000" y="541.650" font-size="22" font-weight="400" fill="#111827">values를 선언합니다.</text>
<text data-source="root.0.2.2" x="588.000" y="451.350" font-size="28" font-weight="700" fill="#111827">Helm provider</text>
<text data-source="root.0.2.2" x="588.000" y="493.750" font-size="22" font-weight="400" fill="#111827">Helm SDK를 Terraform</text>
<text data-source="root.0.2.2" x="588.000" y="523.450" font-size="22" font-weight="400" fill="#111827">process 안에서 실행합니다.</text>
<text data-source="root.0.2.4" x="1056.000" y="451.350" font-size="28" font-weight="700" fill="#111827">Helm chart</text>
<text data-source="root.0.2.4" x="1056.000" y="493.750" font-size="22" font-weight="400" fill="#111827">chart template과 전달한</text>
<text data-source="root.0.2.4" x="1056.000" y="523.450" font-size="22" font-weight="400" fill="#111827">values를 조합합니다.</text>
<text data-source="root.0.2.6" x="1524.000" y="451.350" font-size="28" font-weight="700" fill="#111827">Kubernetes API</text>
<text data-source="root.0.2.6" x="1524.000" y="493.750" font-size="22" font-weight="400" fill="#111827">rendered manifests를</text>
<text data-source="root.0.2.6" x="1524.000" y="523.450" font-size="22" font-weight="400" fill="#111827">cluster에 적용합니다.</text>
<text data-source="root.0.2.8" x="120.000" y="721.350" font-size="28" font-weight="700" fill="#111827">Release resources</text>
<text data-source="root.0.2.8" x="120.000" y="763.750" font-size="22" font-weight="400" fill="#111827">release 상태가 Terraform</text>
<text data-source="root.0.2.8" x="120.000" y="793.450" font-size="22" font-weight="400" fill="#111827">state에서 추적됩니다.</text>
<text data-source="root.0.2.1" x="424.000" y="457.550" font-size="22" font-weight="400" fill="#111827">provider 선택</text>
<text data-source="root.0.2.3" x="892.000" y="427.850" font-size="22" font-weight="400" fill="#111827">chart와</text>
<text data-source="root.0.2.3" x="892.000" y="457.550" font-size="22" font-weight="400" fill="#111827">values 렌더링</text>
<text data-source="root.0.2.5" x="1360.000" y="427.850" font-size="22" font-weight="400" fill="#111827">manifests</text>
<text data-source="root.0.2.5" x="1360.000" y="457.550" font-size="22" font-weight="400" fill="#111827">적용</text>
<text data-source="root.0.2.7" x="104.000" y="613.350" font-size="22" font-weight="400" fill="#111827">state에 lifecycle 기록</text>
