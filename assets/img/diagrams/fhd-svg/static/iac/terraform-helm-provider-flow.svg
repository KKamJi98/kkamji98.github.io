<text data-source="root.0.0" x="64.000" y="309.050" font-size="36" font-weight="700" fill="#111827">Helm provider가 release lifecycle을 Terraform state에 연결합니다</text>
<text data-source="root.0.1" x="64.000" y="367.650" font-size="22" font-weight="400" fill="#111827">helm_release를 Terraform이 소유하므로 수동 helm upgrade는 다음 plan에서 drift로 보입니다.</text>
<text data-source="root.0.2.0" x="120.000" y="451.350" font-size="28" font-weight="700" fill="#111827">Terraform configuration</text>
<text data-source="root.0.2.0" x="120.000" y="493.750" font-size="22" font-weight="400" fill="#111827">helm_release resource와 values를</text>
<text data-source="root.0.2.0" x="120.000" y="523.450" font-size="22" font-weight="400" fill="#111827">선언합니다.</text>
<text data-source="root.0.2.2" x="744.000" y="451.350" font-size="28" font-weight="700" fill="#111827">Helm provider</text>
<text data-source="root.0.2.2" x="744.000" y="493.750" font-size="22" font-weight="400" fill="#111827">Helm SDK를 Terraform process 안에서</text>
<text data-source="root.0.2.2" x="744.000" y="523.450" font-size="22" font-weight="400" fill="#111827">실행합니다.</text>
<text data-source="root.0.2.4" x="1368.000" y="466.200" font-size="28" font-weight="700" fill="#111827">Helm chart</text>
<text data-source="root.0.2.4" x="1368.000" y="508.600" font-size="22" font-weight="400" fill="#111827">chart template과 전달한 values를 조합합니다.</text>
<text data-source="root.0.2.6" x="432.000" y="718.000" font-size="28" font-weight="700" fill="#111827">Kubernetes API</text>
<text data-source="root.0.2.6" x="432.000" y="760.400" font-size="22" font-weight="400" fill="#111827">rendered manifests를 cluster에 적용합니다.</text>
<text data-source="root.0.2.8" x="1056.000" y="703.150" font-size="28" font-weight="700" fill="#111827">Release resources</text>
<text data-source="root.0.2.8" x="1056.000" y="745.550" font-size="22" font-weight="400" fill="#111827">release 상태가 Terraform state에서</text>
<text data-source="root.0.2.8" x="1056.000" y="775.250" font-size="22" font-weight="400" fill="#111827">추적됩니다.</text>
<text data-source="root.0.2.1" x="580.000" y="457.550" font-size="22" font-weight="400" fill="#111827">provider 선택</text>
<text data-source="root.0.2.3" x="1204.000" y="427.850" font-size="22" font-weight="400" fill="#111827">chart와</text>
<text data-source="root.0.2.3" x="1204.000" y="457.550" font-size="22" font-weight="400" fill="#111827">values 렌더링</text>
<text data-source="root.0.2.5" x="660.000" y="595.150" font-size="22" font-weight="400" fill="#111827">manifests 적용</text>
<text data-source="root.0.2.7" x="892.000" y="679.650" font-size="22" font-weight="400" fill="#111827">state에</text>
<text data-source="root.0.2.7" x="892.000" y="709.350" font-size="22" font-weight="400" fill="#111827">lifecycle 기록</text>
</svg>
