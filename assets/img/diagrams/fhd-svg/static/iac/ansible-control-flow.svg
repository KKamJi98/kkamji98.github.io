<polygon data-arrowhead="root.0.2.7" points="84.000,762.100 74.000,768.100 74.000,756.100" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="276.000" font-size="36" font-weight="700" fill="#111827">Ansible은 control node에서 SSH로 managed host를 관리합니다</text>
<text data-source="root.0.1" x="64.000" y="334.600" font-size="22" font-weight="400" fill="#111827">Inventory와 playbook은 control node에 있고, managed host에는 사전에 Ansible agent를 설치하지 않습니다.</text>
<text data-source="root.0.2.0" x="120.000" y="451.350" font-size="28" font-weight="700" fill="#111827">Inventory</text>
<text data-source="root.0.2.0" x="120.000" y="493.750" font-size="22" font-weight="400" fill="#111827">관리할 hosts와 group, host</text>
<text data-source="root.0.2.0" x="120.000" y="523.450" font-size="22" font-weight="400" fill="#111827">변수를 정의합니다.</text>
<text data-source="root.0.2.2" x="588.000" y="451.350" font-size="28" font-weight="700" fill="#111827">Ansible control node</text>
<text data-source="root.0.2.2" x="588.000" y="493.750" font-size="22" font-weight="400" fill="#111827">ansible-playbook가 실행되는</text>
<text data-source="root.0.2.2" x="588.000" y="523.450" font-size="22" font-weight="400" fill="#111827">위치입니다.</text>
<text data-source="root.0.2.4" x="1056.000" y="418.300" font-size="28" font-weight="700" fill="#111827">Playbook and</text>
<text data-source="root.0.2.4" x="1056.000" y="454.700" font-size="28" font-weight="700" fill="#111827">modules</text>
<text data-source="root.0.2.4" x="1056.000" y="497.100" font-size="22" font-weight="400" fill="#111827">순서가 있는 task와 대체로</text>
<text data-source="root.0.2.4" x="1056.000" y="526.800" font-size="22" font-weight="400" fill="#111827">idempotent한</text>
<text data-source="root.0.2.4" x="1056.000" y="556.500" font-size="22" font-weight="400" fill="#111827">module입니다.</text>
<text data-source="root.0.2.6" x="1524.000" y="451.350" font-size="28" font-weight="700" fill="#111827">SSH</text>
<text data-source="root.0.2.6" x="1524.000" y="493.750" font-size="22" font-weight="400" fill="#111827">인증, 명령 전송과 결과 회신에</text>
<text data-source="root.0.2.6" x="1524.000" y="523.450" font-size="22" font-weight="400" fill="#111827">필요한 channel입니다.</text>
<text data-source="root.0.2.8" x="120.000" y="736.200" font-size="28" font-weight="700" fill="#111827">Managed hosts</text>
<text data-source="root.0.2.8" x="120.000" y="778.600" font-size="22" font-weight="400" fill="#111827">원격 host에서 module이</text>
<text data-source="root.0.2.8" x="120.000" y="808.300" font-size="22" font-weight="400" fill="#111827">실행되고 상태를 돌려줍니다.</text>
<text data-source="root.0.2.1" x="424.000" y="427.850" font-size="22" font-weight="400" fill="#111827">대상 group</text>
<text data-source="root.0.2.1" x="424.000" y="457.550" font-size="22" font-weight="400" fill="#111827">선택</text>
<text data-source="root.0.2.3" x="892.000" y="457.550" font-size="22" font-weight="400" fill="#111827">task 순서 해석</text>
<text data-source="root.0.2.5" x="1360.000" y="457.550" font-size="22" font-weight="400" fill="#111827">원격 실행 요청</text>
<text data-source="root.0.2.7" x="104.000" y="628.200" font-size="22" font-weight="400" fill="#111827">module 실행과 report</text>
</svg>
