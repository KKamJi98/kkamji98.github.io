<text data-source="root.0.0" x="64.000" y="309.050" font-size="36" font-weight="700" fill="#111827">Ansible playbook은 control plane을 먼저 만들고 worker를 join시킵니다</text>
<text data-source="root.0.1" x="64.000" y="367.650" font-size="22" font-weight="400" fill="#111827">control plane 초기화가 만든 join token을 worker 단계에서 사용하므로 순서가 고정됩니다.</text>
<text data-source="root.0.2.0" x="120.000" y="466.200" font-size="28" font-weight="700" fill="#111827">Inventory</text>
<text data-source="root.0.2.0" x="120.000" y="508.600" font-size="22" font-weight="400" fill="#111827">control plane과 worker group을 나눠 둡니다.</text>
<text data-source="root.0.2.2" x="744.000" y="466.200" font-size="28" font-weight="700" fill="#111827">Ansible control node</text>
<text data-source="root.0.2.2" x="744.000" y="508.600" font-size="22" font-weight="400" fill="#111827">bootstrap play를 실행하고 결과를 모읍니다.</text>
<text data-source="root.0.2.4" x="1368.000" y="451.350" font-size="28" font-weight="700" fill="#111827">Control plane</text>
<text data-source="root.0.2.4" x="1368.000" y="493.750" font-size="22" font-weight="400" fill="#111827">먼저 초기화하고 worker join token을</text>
<text data-source="root.0.2.4" x="1368.000" y="523.450" font-size="22" font-weight="400" fill="#111827">생성합니다.</text>
<text data-source="root.0.2.6" x="432.000" y="703.150" font-size="28" font-weight="700" fill="#111827">Worker nodes</text>
<text data-source="root.0.2.6" x="432.000" y="745.550" font-size="22" font-weight="400" fill="#111827">control plane이 발급한 token으로 cluster에</text>
<text data-source="root.0.2.6" x="432.000" y="775.250" font-size="22" font-weight="400" fill="#111827">합류합니다.</text>
<text data-source="root.0.2.8" x="1056.000" y="718.000" font-size="28" font-weight="700" fill="#111827">Kubernetes cluster</text>
<text data-source="root.0.2.8" x="1056.000" y="760.400" font-size="22" font-weight="400" fill="#111827">workload를 schedule할 수 있는 상태가 됩니다.</text>
<text data-source="root.0.2.1" x="580.000" y="427.850" font-size="22" font-weight="400" fill="#111827">대상 group</text>
<text data-source="root.0.2.1" x="580.000" y="457.550" font-size="22" font-weight="400" fill="#111827">순서 결정</text>
<text data-source="root.0.2.3" x="1204.000" y="457.550" font-size="22" font-weight="400" fill="#111827">kubeadm init</text>
<text data-source="root.0.2.5" x="660.000" y="595.150" font-size="22" font-weight="400" fill="#111827">token으로 join</text>
<text data-source="root.0.2.7" x="892.000" y="709.350" font-size="22" font-weight="400" fill="#111827">노드 준비 완료</text>
</svg>
