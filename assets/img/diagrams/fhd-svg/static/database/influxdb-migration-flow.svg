<polygon data-arrowhead="root.0.2.7" points="1020.000,729.050 1010.000,735.050 1010.000,723.050" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="309.050" font-size="36" font-weight="700" fill="#111827">InfluxDB 1.x EC2 이전: export, 파일 정리, import</text>
<text data-source="root.0.1" x="64.000" y="367.650" font-size="22" font-weight="400" fill="#111827">v1.11.8 실습은 database 이름과 measurement, tag, field, timestamp를 유지한 채 Line Protocol로 옮깁니다.</text>
<text data-source="root.0.2.0" x="120.000" y="466.200" font-size="28" font-weight="700" fill="#111827">Source InfluxDB</text>
<text data-source="root.0.2.0" x="120.000" y="508.600" font-size="22" font-weight="400" fill="#111827">기존 EC2의 InfluxDB v1.11.8 database</text>
<text data-source="root.0.2.2" x="744.000" y="466.200" font-size="28" font-weight="700" fill="#111827">Export data</text>
<text data-source="root.0.2.2" x="744.000" y="508.600" font-size="22" font-weight="400" fill="#111827">influx_inspect export -lponly로 추출합니다.</text>
<text data-source="root.0.2.4" x="1368.000" y="451.350" font-size="28" font-weight="700" fill="#111827">Clean export file</text>
<text data-source="root.0.2.4" x="1368.000" y="493.750" font-size="22" font-weight="400" fill="#111827">실습 스크립트는 CREATE DATABASE 행을</text>
<text data-source="root.0.2.4" x="1368.000" y="523.450" font-size="22" font-weight="400" fill="#111827">제거합니다. 데이터 이름은 바꾸지 않습니다.</text>
<text data-source="root.0.2.6" x="432.000" y="703.150" font-size="28" font-weight="700" fill="#111827">Import data</text>
<text data-source="root.0.2.6" x="432.000" y="745.550" font-size="22" font-weight="400" fill="#111827">target에 같은 이름의 database를 생성한 뒤</text>
<text data-source="root.0.2.6" x="432.000" y="775.250" font-size="22" font-weight="400" fill="#111827">/write에 Line Protocol을 전송합니다.</text>
<text data-source="root.0.2.8" x="1056.000" y="703.150" font-size="28" font-weight="700" fill="#111827">Target InfluxDB</text>
<text data-source="root.0.2.8" x="1056.000" y="745.550" font-size="22" font-weight="400" fill="#111827">삭제 복원, 누락 구간과 덮어쓴 값의 복구를</text>
<text data-source="root.0.2.8" x="1056.000" y="775.250" font-size="22" font-weight="400" fill="#111827">Grafana로 비교합니다.</text>
<text data-source="root.0.2.1" x="580.000" y="457.550" font-size="22" font-weight="400" fill="#111827">데이터 추출</text>
<text data-source="root.0.2.3" x="1204.000" y="427.850" font-size="22" font-weight="400" fill="#111827">export 파일</text>
<text data-source="root.0.2.3" x="1204.000" y="457.550" font-size="22" font-weight="400" fill="#111827">정리</text>
<text data-source="root.0.2.5" x="660.000" y="595.150" font-size="22" font-weight="400" fill="#111827">새 인스턴스에 기록</text>
<text data-source="root.0.2.7" x="892.000" y="679.650" font-size="22" font-weight="400" fill="#111827">건수와 구간</text>
<text data-source="root.0.2.7" x="892.000" y="709.350" font-size="22" font-weight="400" fill="#111827">확인</text>
</svg>
