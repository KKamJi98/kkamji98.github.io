<text data-source="root.0.0" x="64.000" y="264.500" font-size="36" font-weight="700" fill="#111827">InfluxDB 1.x EC2 이전: export, 파일 정리, import</text>
<text data-source="root.0.1" x="64.000" y="323.100" font-size="22" font-weight="400" fill="#111827">v1.11.8 실습은 database 이름과 measurement, tag, field, timestamp를 유지한 채 Line Protocol로 옮깁니다.</text>
<text data-source="root.0.2.0" x="120.000" y="436.500" font-size="28" font-weight="700" fill="#111827">Source InfluxDB</text>
<text data-source="root.0.2.0" x="120.000" y="478.900" font-size="22" font-weight="400" fill="#111827">기존 EC2의 InfluxDB v1.11.8</text>
<text data-source="root.0.2.0" x="120.000" y="508.600" font-size="22" font-weight="400" fill="#111827">database</text>
<text data-source="root.0.2.2" x="588.000" y="436.500" font-size="28" font-weight="700" fill="#111827">Export data</text>
<text data-source="root.0.2.2" x="588.000" y="478.900" font-size="22" font-weight="400" fill="#111827">influx_inspect export</text>
<text data-source="root.0.2.2" x="588.000" y="508.600" font-size="22" font-weight="400" fill="#111827">-lponly로 추출합니다.</text>
<text data-source="root.0.2.4" x="1056.000" y="406.800" font-size="28" font-weight="700" fill="#111827">Clean export file</text>
<text data-source="root.0.2.4" x="1056.000" y="449.200" font-size="22" font-weight="400" fill="#111827">실습 스크립트는 CREATE</text>
<text data-source="root.0.2.4" x="1056.000" y="478.900" font-size="22" font-weight="400" fill="#111827">DATABASE 행을 제거합니다.</text>
<text data-source="root.0.2.4" x="1056.000" y="508.600" font-size="22" font-weight="400" fill="#111827">데이터 이름은 바꾸지</text>
<text data-source="root.0.2.4" x="1056.000" y="538.300" font-size="22" font-weight="400" fill="#111827">않습니다.</text>
<text data-source="root.0.2.6" x="1524.000" y="406.800" font-size="28" font-weight="700" fill="#111827">Import data</text>
<text data-source="root.0.2.6" x="1524.000" y="449.200" font-size="22" font-weight="400" fill="#111827">target에 같은 이름의</text>
<text data-source="root.0.2.6" x="1524.000" y="478.900" font-size="22" font-weight="400" fill="#111827">database를 생성한 뒤</text>
<text data-source="root.0.2.6" x="1524.000" y="508.600" font-size="22" font-weight="400" fill="#111827">/write에 Line Protocol을</text>
<text data-source="root.0.2.6" x="1524.000" y="538.300" font-size="22" font-weight="400" fill="#111827">전송합니다.</text>
<text data-source="root.0.2.8" x="120.000" y="718.000" font-size="28" font-weight="700" fill="#111827">Target InfluxDB</text>
<text data-source="root.0.2.8" x="120.000" y="760.400" font-size="22" font-weight="400" fill="#111827">삭제 복원, 누락 구간과 덮어쓴</text>
<text data-source="root.0.2.8" x="120.000" y="790.100" font-size="22" font-weight="400" fill="#111827">값의 복구를 Grafana로</text>
<text data-source="root.0.2.8" x="120.000" y="819.800" font-size="22" font-weight="400" fill="#111827">비교합니다.</text>
<text data-source="root.0.2.1" x="424.000" y="442.700" font-size="22" font-weight="400" fill="#111827">데이터 추출</text>
<text data-source="root.0.2.3" x="892.000" y="413.000" font-size="22" font-weight="400" fill="#111827">export 파일</text>
<text data-source="root.0.2.3" x="892.000" y="442.700" font-size="22" font-weight="400" fill="#111827">정리</text>
<text data-source="root.0.2.5" x="1360.000" y="413.000" font-size="22" font-weight="400" fill="#111827">새 인스턴스에</text>
<text data-source="root.0.2.5" x="1360.000" y="442.700" font-size="22" font-weight="400" fill="#111827">기록</text>
<text data-source="root.0.2.7" x="104.000" y="610.000" font-size="22" font-weight="400" fill="#111827">건수와 구간 확인</text>
</svg>
