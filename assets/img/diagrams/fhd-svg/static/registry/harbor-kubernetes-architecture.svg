<path data-edge="root.0.2.4.1.1.1" data-from="root.0.2.4.1.1.0" data-to="root.0.2.4.1.1.2" d="M 1151.000 687.000 L 1151.000 789.000" fill="none" stroke="#475569" stroke-width="3"><title>blob과 manifest 저장</title></path>
