<polygon data-arrowhead="root.0.2.1" points="1020.000,274.750 1010.000,280.750 1010.000,268.750" fill="#475569"/>
<path data-edge="root.0.2.3" data-from="root.0.2.2" data-to="root.0.2.4" d="M 1836.000 274.750 L 1848.000 274.750 L 1848.000 394.150 L 72.000 394.150 L 72.000 722.550 L 84.000 722.550" fill="none" stroke="#475569" stroke-width="3"><title>hostname 내부에서 경로 분기</title></path>
<polygon data-arrowhead="root.0.2.3" points="84.000,722.550 74.000,728.550 74.000,716.550" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="113.050" font-size="36" font-weight="700" fill="#111827">Harbor는 하나의 Ingress 뒤에서 portal과 registry path를 나눕니다</text>
<text data-source="root.0.1" x="64.000" y="171.650" font-size="22" font-weight="400" fill="#111827">같은 hostname으로 들어온 요청을 Ingress가 경로별로 분기하고, registry path만 image storage에 이어집니다.</text>
<text data-source="root.0.2.0" x="120.000" y="263.700" font-size="28" font-weight="700" fill="#111827">User</text>
<text data-source="root.0.2.0" x="120.000" y="306.100" font-size="22" font-weight="400" fill="#111827">browser 또는 Docker CLI가 같은 Harbor hostname으로 접근합니다.</text>
<text data-source="root.0.2.2" x="1056.000" y="263.700" font-size="28" font-weight="700" fill="#111827">Ingress</text>
<text data-source="root.0.2.2" x="1056.000" y="306.100" font-size="22" font-weight="400" fill="#111827">요청 path에 따라 UI와 registry service를 선택합니다.</text>
<text data-source="root.0.2.4.0.0" x="120.000" y="494.150" font-size="28" font-weight="700" fill="#111827">Portal path</text>
<text data-source="root.0.2.4.0.1.0" x="144.000" y="579.950" font-size="28" font-weight="700" fill="#111827">Harbor portal</text>
<text data-source="root.0.2.4.0.1.0" x="144.000" y="622.350" font-size="22" font-weight="400" fill="#111827">web UI와 core API를</text>
<text data-source="root.0.2.4.0.1.0" x="144.000" y="652.050" font-size="22" font-weight="400" fill="#111827">제공합니다.</text>
<text data-source="root.0.2.4.1.0" x="528.000" y="494.150" font-size="28" font-weight="700" fill="#111827">Registry path</text>
<text data-source="root.0.2.4.1.1.0" x="552.000" y="579.950" font-size="28" font-weight="700" fill="#111827">Registry service</text>
<text data-source="root.0.2.4.1.1.0" x="552.000" y="622.350" font-size="22" font-weight="400" fill="#111827">image distribution API를</text>
<text data-source="root.0.2.4.1.1.0" x="552.000" y="652.050" font-size="22" font-weight="400" fill="#111827">처리합니다.</text>
<text data-source="root.0.2.4.1.1.2" x="552.000" y="875.150" font-size="28" font-weight="700" fill="#111827">Image storage</text>
<text data-source="root.0.2.4.1.1.2" x="552.000" y="917.550" font-size="22" font-weight="400" fill="#111827">object storage 또는</text>
<text data-source="root.0.2.4.1.1.2" x="552.000" y="947.250" font-size="22" font-weight="400" fill="#111827">Kubernetes PVC에 보관합니다.</text>
<text data-source="root.0.2.4.1.1.1" x="716.000" y="745.750" font-size="22" font-weight="400" fill="#111827">blob과</text>
<text data-source="root.0.2.4.1.1.1" x="716.000" y="775.450" font-size="22" font-weight="400" fill="#111827">manifest 저장</text>
<text data-source="root.0.2.1" x="892.000" y="225.350" font-size="22" font-weight="400" fill="#111827">TLS 종료와</text>
<text data-source="root.0.2.1" x="892.000" y="255.050" font-size="22" font-weight="400" fill="#111827">path routing</text>
<text data-source="root.0.2.3" x="104.000" y="386.150" font-size="22" font-weight="400" fill="#111827">hostname 내부에서 경로 분기</text>
</svg>
