<polygon data-arrowhead="root.0.2.1" points="1020.000,279.400 1010.000,285.400 1010.000,273.400" fill="#475569"/>
<path data-edge="root.0.2.3" data-from="root.0.2.2" data-to="root.0.2.4" d="M 1428.000 346.500 L 1428.000 393.400 L 960.000 393.400 L 960.000 429.400" fill="none" stroke="#475569" stroke-width="3"><title>hostname 내부에서 경로 분기</title></path>
<polygon data-arrowhead="root.0.2.3" points="960.000,429.400 954.000,419.400 966.000,419.400" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="133.800" font-size="36" font-weight="700" fill="#111827">Harbor는 하나의 Ingress 뒤에서 portal과 registry path를 나눕니다</text>
<text data-source="root.0.1" x="64.000" y="186.400" font-size="20" font-weight="400" fill="#111827">같은 hostname으로 들어온 요청을 Ingress가 경로별로 분기하고, registry path만 image storage에 이어집니다.</text>
<text data-source="root.0.2.0" x="116.000" y="268.300" font-size="24" font-weight="700" fill="#111827">User</text>
<text data-source="root.0.2.0" x="116.000" y="307.500" font-size="20" font-weight="400" fill="#111827">browser 또는 Docker CLI가 같은 Harbor hostname으로 접근합니다.</text>
<text data-source="root.0.2.2" x="1052.000" y="268.300" font-size="24" font-weight="700" fill="#111827">Ingress</text>
<text data-source="root.0.2.2" x="1052.000" y="307.500" font-size="20" font-weight="400" fill="#111827">요청 path에 따라 UI와 registry service를 선택합니다.</text>
<text data-source="root.0.2.4.0.0" x="608.000" y="509.400" font-size="24" font-weight="700" fill="#111827">Portal path</text>
<text data-source="root.0.2.4.0.1.0" x="628.000" y="581.800" font-size="24" font-weight="700" fill="#111827">Harbor portal</text>
<text data-source="root.0.2.4.0.1.0" x="628.000" y="621.000" font-size="20" font-weight="400" fill="#111827">web UI와 core API를 제공합니다.</text>
<text data-source="root.0.2.4.1.0" x="990.000" y="509.400" font-size="24" font-weight="700" fill="#111827">Registry path</text>
<text data-source="root.0.2.4.1.1.0" x="1010.000" y="581.800" font-size="24" font-weight="700" fill="#111827">Registry service</text>
<text data-source="root.0.2.4.1.1.0" x="1010.000" y="621.000" font-size="20" font-weight="400" fill="#111827">image distribution API를</text>
<text data-source="root.0.2.4.1.1.0" x="1010.000" y="648.000" font-size="20" font-weight="400" fill="#111827">처리합니다.</text>
<text data-source="root.0.2.4.1.1.2" x="1010.000" y="845.000" font-size="24" font-weight="700" fill="#111827">Image storage</text>
<text data-source="root.0.2.4.1.1.2" x="1010.000" y="884.200" font-size="20" font-weight="400" fill="#111827">object storage 또는 Kubernetes</text>
<text data-source="root.0.2.4.1.1.2" x="1010.000" y="911.200" font-size="20" font-weight="400" fill="#111827">PVC에 보관합니다.</text>
<text data-source="root.0.2.4.1.1.1" x="1171.000" y="731.000" font-size="20" font-weight="400" fill="#111827">blob과</text>
<text data-source="root.0.2.4.1.1.1" x="1171.000" y="758.000" font-size="20" font-weight="400" fill="#111827">manifest 저장</text>
<text data-source="root.0.2.1" x="892.000" y="233.400" font-size="20" font-weight="400" fill="#111827">TLS 종료와</text>
<text data-source="root.0.2.1" x="892.000" y="260.400" font-size="20" font-weight="400" fill="#111827">path routing</text>
<text data-source="root.0.2.3" x="972.000" y="385.400" font-size="20" font-weight="400" fill="#111827">hostname 내부에서 경로 분기</text>
</svg>
