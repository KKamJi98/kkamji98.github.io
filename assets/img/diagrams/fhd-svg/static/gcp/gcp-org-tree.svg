<text data-source="root.0.0" x="64.000" y="132.250" font-size="36" font-weight="700" fill="#111827">Folder는 Project를 묶어 한 정책을 여러 프로젝트에 적용합니다</text>
<text data-source="root.0.1" x="64.000" y="190.850" font-size="22" font-weight="400" fill="#111827">Folder는 Organization 아래에서 중첩할 수 있는 그룹 단위이며, Project는 billing과 quota의 경계로 남습니다.</text>
<text data-source="root.0.2" x="88.000" y="274.550" font-size="28" font-weight="700" fill="#111827">Organization</text>
<text data-source="root.0.2" x="88.000" y="316.950" font-size="22" font-weight="400" fill="#111827">example.com. Folder는 Organization 아래에서만 존재</text>
<text data-source="root.0.4.0.0" x="88.000" y="510.350" font-size="28" font-weight="700" fill="#111827">Engineering branch</text>
<text data-source="root.0.4.0.1.0" x="112.000" y="596.150" font-size="28" font-weight="700" fill="#111827">Folder: engineering</text>
<text data-source="root.0.4.0.1.0" x="112.000" y="638.550" font-size="22" font-weight="400" fill="#111827">중첩 가능. Folder 정책이 아래 Project로 적용</text>
<text data-source="root.0.4.0.1.2.0" x="112.000" y="831.950" font-size="28" font-weight="700" fill="#111827">Project: app-prod</text>
<text data-source="root.0.4.0.1.2.0" x="112.000" y="874.350" font-size="22" font-weight="400" fill="#111827">billing과 quota의 경계</text>
<text data-source="root.0.4.0.1.2.1" x="542.000" y="831.950" font-size="28" font-weight="700" fill="#111827">Project: app-staging</text>
<text data-source="root.0.4.0.1.2.1" x="542.000" y="874.350" font-size="22" font-weight="400" fill="#111827">billing과 quota의 경계</text>
<text data-source="root.0.4.0.1.1" x="526.000" y="732.250" font-size="22" font-weight="400" fill="#111827">하나의 Folder 아래에 여러 환경</text>
<text data-source="root.0.4.1.0" x="996.000" y="510.350" font-size="28" font-weight="700" fill="#111827">Finance branch</text>
<text data-source="root.0.4.1.1.0" x="1052.000" y="634.200" font-size="28" font-weight="700" fill="#111827">Folder: finance</text>
<text data-source="root.0.4.1.1.0" x="1052.000" y="676.600" font-size="22" font-weight="400" fill="#111827">부서 단위 정책과 리소스 그룹</text>
<text data-source="root.0.4.1.1.2" x="1510.000" y="616.000" font-size="28" font-weight="700" fill="#111827">Project:</text>
<text data-source="root.0.4.1.1.2" x="1510.000" y="652.400" font-size="28" font-weight="700" fill="#111827">billing-system</text>
<text data-source="root.0.4.1.1.2" x="1510.000" y="694.800" font-size="22" font-weight="400" fill="#111827">billing과 quota의 경계</text>
<text data-source="root.0.4.1.1.1" x="1346.000" y="566.150" font-size="22" font-weight="400" fill="#111827">Folder 정책을</text>
<text data-source="root.0.4.1.1.1" x="1346.000" y="595.850" font-size="22" font-weight="400" fill="#111827">이 Project에</text>
<text data-source="root.0.4.1.1.1" x="1346.000" y="625.550" font-size="22" font-weight="400" fill="#111827">적용</text>
<text data-source="root.0.5" x="64.000" y="976.050" font-size="22" font-weight="400" fill="#111827">Folder는 최대 10단계까지 중첩할 수 있습니다. 개인 Gmail 계정처럼 Organization이 없으면 Folder를 만들 수 없습니다.</text>
<text data-source="root.0.3" x="980.000" y="410.650" font-size="22" font-weight="400" fill="#111827">조직 아래에서 부서별 Folder branch로 분기</text>
