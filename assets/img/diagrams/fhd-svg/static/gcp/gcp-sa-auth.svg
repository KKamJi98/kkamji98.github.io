<path data-edge="root.0.2.0.1.3" data-from="root.0.2.0.1.2" data-to="root.0.2.0.1.4" d="M 904.000 398.700 L 916.000 398.700 L 916.000 547.800 L 96.000 547.800 L 96.000 658.850 L 108.000 658.850" fill="none" stroke="#475569" stroke-width="3"><title>Resource의 IAM binding으로 권한 확인</title></path>
