<path data-edge="root.0.2.0.1.1" data-from="root.0.2.0.1.0" data-to="root.0.2.0.1.2" d="M 446.000 398.700 L 566.000 398.700" fill="none" stroke="#475569" stroke-width="3"><title>metadata server가 단기 token 발급</title></path>
