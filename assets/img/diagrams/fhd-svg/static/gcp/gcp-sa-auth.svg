<polygon data-arrowhead="root.0.2.1.1.5" points="1474.000,786.000 1464.000,792.000 1464.000,780.000" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="121.500" font-size="36" font-weight="700" fill="#111827">Workload에는 Service Account를 붙이고 JSON key 파일은 배포하지 않습니다</text>
<text data-source="root.0.1" x="64.000" y="180.100" font-size="22" font-weight="400" fill="#111827">Attached Service Account와 단기 token은 장기 secret을 만들지 않습니다. 디스크의 JSON key는 같은 identity라도 유출과 rotation 부담을 남깁니다.</text>
<text data-source="root.0.2.0.0" x="88.000" y="263.800" font-size="28" font-weight="700" fill="#111827">Keyless: attached Service Account</text>
<text data-source="root.0.2.0.1.0" x="144.000" y="387.650" font-size="28" font-weight="700" fill="#111827">Workload</text>
<text data-source="root.0.2.0.1.0" x="144.000" y="430.050" font-size="22" font-weight="400" fill="#111827">GCE 또는 GKE에서 실행</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="387.650" font-size="28" font-weight="700" fill="#111827">Service Account</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="430.050" font-size="22" font-weight="400" fill="#111827">워크로드의 Google identity</text>
<text data-source="root.0.2.0.1.4" x="144.000" y="647.800" font-size="28" font-weight="700" fill="#111827">Resource</text>
<text data-source="root.0.2.0.1.4" x="144.000" y="690.200" font-size="22" font-weight="400" fill="#111827">binding이 허용한 API 작업</text>
<text data-source="root.0.2.0.1.1" x="438.000" y="319.600" font-size="22" font-weight="400" fill="#111827">metadata</text>
<text data-source="root.0.2.0.1.1" x="438.000" y="349.300" font-size="22" font-weight="400" fill="#111827">server가 단기</text>
<text data-source="root.0.2.0.1.1" x="438.000" y="379.000" font-size="22" font-weight="400" fill="#111827">token 발급</text>
<text data-source="root.0.2.0.1.3" x="128.000" y="539.800" font-size="22" font-weight="400" fill="#111827">Resource의 IAM binding으로 권한 확인</text>
<text data-source="root.0.2.1.0" x="996.000" y="263.800" font-size="28" font-weight="700" fill="#111827">Key file: 디스크에 남는 장기 credential</text>
<text data-source="root.0.2.1.1.0" x="1052.000" y="402.500" font-size="28" font-weight="700" fill="#111827">Workload</text>
<text data-source="root.0.2.1.1.0" x="1052.000" y="444.900" font-size="22" font-weight="400" fill="#111827">Google Cloud 밖에서도 실행</text>
<text data-source="root.0.2.1.1.0" x="1052.000" y="474.600" font-size="22" font-weight="400" fill="#111827">가능</text>
<text data-source="root.0.2.1.1.2" x="1510.000" y="417.350" font-size="28" font-weight="700" fill="#111827">JSON key file</text>
<text data-source="root.0.2.1.1.2" x="1510.000" y="459.750" font-size="22" font-weight="400" fill="#111827">leak와 rotation risk</text>
<text data-source="root.0.2.1.1.4" x="1052.000" y="760.100" font-size="28" font-weight="700" fill="#111827">Service Account</text>
<text data-source="root.0.2.1.1.4" x="1052.000" y="802.500" font-size="22" font-weight="400" fill="#111827">identity는 같지만 credential</text>
<text data-source="root.0.2.1.1.4" x="1052.000" y="832.200" font-size="22" font-weight="400" fill="#111827">취급이 약함</text>
<text data-source="root.0.2.1.1.6" x="1510.000" y="774.950" font-size="28" font-weight="700" fill="#111827">Resource</text>
<text data-source="root.0.2.1.1.6" x="1510.000" y="817.350" font-size="22" font-weight="400" fill="#111827">binding이 허용한 API 작업</text>
<text data-source="root.0.2.1.1.1" x="1346.000" y="319.600" font-size="22" font-weight="400" fill="#111827">파일에 저장된</text>
<text data-source="root.0.2.1.1.1" x="1346.000" y="349.300" font-size="22" font-weight="400" fill="#111827">장기</text>
<text data-source="root.0.2.1.1.1" x="1346.000" y="379.000" font-size="22" font-weight="400" fill="#111827">credential</text>
<text data-source="root.0.2.1.1.1" x="1346.000" y="408.700" font-size="22" font-weight="400" fill="#111827">사용</text>
<text data-source="root.0.2.1.1.3" x="1036.000" y="599.200" font-size="22" font-weight="400" fill="#111827">같은 Service Account identity로 인증</text>
<text data-source="root.0.2.1.1.5" x="1346.000" y="677.200" font-size="22" font-weight="400" fill="#111827">Resource의</text>
<text data-source="root.0.2.1.1.5" x="1346.000" y="706.900" font-size="22" font-weight="400" fill="#111827">IAM</text>
<text data-source="root.0.2.1.1.5" x="1346.000" y="736.600" font-size="22" font-weight="400" fill="#111827">binding으로</text>
<text data-source="root.0.2.1.1.5" x="1346.000" y="766.300" font-size="22" font-weight="400" fill="#111827">권한 확인</text>
<text data-source="root.0.3" x="64.000" y="986.800" font-size="22" font-weight="400" fill="#111827">외부 CI는 Workload Identity Federation, 사람의 임시 작업은 Service Account impersonation으로 keyless 경로를 유지할 수 있습니다.</text>
</svg>
