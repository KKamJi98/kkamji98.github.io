<path data-edge="root.0.2" data-from="root.0.1" data-to="root.0.3" d="M 960.000 223.850 L 960.000 275.850" fill="none" stroke="#475569" stroke-width="3"><title>token exchange 요청</title></path>
<polygon data-arrowhead="root.0.2" points="960.000,275.850 954.000,265.850 966.000,265.850" fill="#475569"/>
<path data-edge="root.0.4" data-from="root.0.3" data-to="root.0.5" d="M 960.000 638.150 L 960.000 690.150" fill="none" stroke="#475569" stroke-width="3"><title>Federated token으로 principal 경로 선택</title></path>
<polygon data-arrowhead="root.0.4" points="960.000,690.150 954.000,680.150 966.000,680.150" fill="#475569"/>
<path data-edge="root.0.6" data-from="root.0.5" data-to="root.0.7" d="M 960.000 833.850 L 960.000 885.850" fill="none" stroke="#475569" stroke-width="3"><title>선택한 principal로 호출</title></path>
<polygon data-arrowhead="root.0.6" points="960.000,885.850 954.000,875.850 966.000,875.850" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="117.550" font-size="36" font-weight="700" fill="#111827">WIF는 외부 OIDC token을 단기 Google credential로 교환합니다</text>
<text data-source="root.0.1" x="74.000" y="166.150" font-size="16" font-weight="700" fill="#111827">External CI: GitHub Actions</text>
<text data-source="root.0.1" x="74.000" y="196.950" font-size="14" font-weight="400" fill="#111827">OIDC token: workflow run의 외부 assertion</text>
<text data-source="root.0.3.0" x="74.000" y="313.850" font-size="16" font-weight="700" fill="#111827">Security Token Service</text>
<text data-source="root.0.3.1" x="84.000" y="355.450" font-size="16" font-weight="700" fill="#111827">Assertion 검증과 token 발급</text>
<text data-source="root.0.3.1" x="84.000" y="386.250" font-size="14" font-weight="400" fill="#111827">단기 federated token 발급</text>
<text data-source="root.0.3.2.0" x="84.000" y="437.150" font-size="16" font-weight="700" fill="#111827">STS가 참조하는 trust 설정</text>
<text data-source="root.0.3.2.1" x="94.000" y="478.750" font-size="16" font-weight="700" fill="#111827">Workload identity pool / OIDC provider</text>
<text data-source="root.0.3.2.1" x="94.000" y="509.550" font-size="14" font-weight="400" fill="#111827">Issuer URL, audience, google.subject와 repository attribute mapping</text>
<text data-source="root.0.3.2.2" x="94.000" y="560.450" font-size="16" font-weight="700" fill="#111827">Attribute condition</text>
<text data-source="root.0.3.2.2" x="94.000" y="591.250" font-size="14" font-weight="400" fill="#111827">허용한 조직과 repository만 통과; shared issuer의 다른 workload 거부</text>
<text data-source="root.0.5.0" x="98.000" y="752.150" font-size="16" font-weight="700" fill="#111827">Direct resource access</text>
<text data-source="root.0.5.0" x="98.000" y="782.950" font-size="14" font-weight="400" fill="#111827">target resource role을 federated principalSet에 직접 부여</text>
<text data-source="root.0.5.1" x="975.000" y="752.150" font-size="16" font-weight="700" fill="#111827">Service Account impersonation</text>
<text data-source="root.0.5.1" x="975.000" y="782.950" font-size="14" font-weight="400" fill="#111827">좁은 principalSet에 roles/iam.workloadIdentityUser를 부여하고 단기 Service Account credential 발급</text>
<text data-source="root.0.7" x="74.000" y="923.850" font-size="16" font-weight="700" fill="#111827">Target resource</text>
<text data-source="root.0.7" x="74.000" y="954.650" font-size="14" font-weight="400" fill="#111827">least-privilege role로 필요한 작업만 허용</text>
<text data-source="root.0.8" x="64.000" y="993.550" font-size="14" font-weight="400" fill="#111827">장기 Service Account key 없이 사용합니다. 조직 ID와 repository ID 같은 좁은 claim을 condition과 IAM binding에 함께 사용합니다.</text>
<text data-source="root.0.2" x="980.000" y="254.400" font-size="14" font-weight="400" fill="#111827">token exchange 요청</text>
<text data-source="root.0.4" x="980.000" y="668.700" font-size="14" font-weight="400" fill="#111827">Federated token으로 principal 경로 선택</text>
<text data-source="root.0.6" x="980.000" y="864.400" font-size="14" font-weight="400" fill="#111827">선택한 principal로 호출</text>
</svg>
