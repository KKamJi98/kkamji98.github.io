<text data-source="root.0.0" x="64.000" y="100.000" font-size="36" font-weight="700" fill="#111827">Jenkins Operator는 base를 맞춘 뒤 user configuration을 적용</text>
<text data-source="root.0.1.0" x="80.000" y="196.000" font-size="20" font-weight="700" fill="#111827">Jenkins CR</text>
<text data-source="root.0.1.0" x="80.000" y="232.000" font-size="18" font-weight="400" fill="#111827">master, plugins, seed jobs, CASC를 선언</text>
<text data-source="root.0.1.2" x="1112.000" y="196.000" font-size="20" font-weight="700" fill="#111827">Jenkins Operator</text>
<text data-source="root.0.1.2" x="1112.000" y="232.000" font-size="18" font-weight="400" fill="#111827">watch, Validate, Reconcile 수행</text>
<text data-source="root.0.1.1" x="844.000" y="167.150" font-size="20" font-weight="400" fill="#111827">watch 이벤트 수신</text>
<text data-source="root.0.1.4.0.0" x="80.000" y="396.000" font-size="20" font-weight="700" fill="#111827">정상 pass</text>
<text data-source="root.0.1.4.0.1.0" x="128.000" y="455.000" font-size="20" font-weight="700" fill="#111827">Base reconciliation</text>
<text data-source="root.0.1.4.0.1.0" x="128.000" y="481.000" font-size="20" font-weight="700" fill="#111827">loop</text>
<text data-source="root.0.1.4.0.1.0" x="128.000" y="517.000" font-size="18" font-weight="400" fill="#111827">namespace, RBAC, master</text>
<text data-source="root.0.1.4.0.1.0" x="128.000" y="541.300" font-size="18" font-weight="400" fill="#111827">Pod, API token, 보안 Groovy</text>
<text data-source="root.0.1.4.0.1.2" x="568.000" y="468.000" font-size="20" font-weight="700" fill="#111827">User reconciliation loop</text>
<text data-source="root.0.1.4.0.1.2" x="568.000" y="504.000" font-size="18" font-weight="400" fill="#111827">CASC, seed jobs, user Groovy,</text>
<text data-source="root.0.1.4.0.1.2" x="568.000" y="528.300" font-size="18" font-weight="400" fill="#111827">backup와 restore job</text>
<text data-source="root.0.1.4.0.1.4" x="128.000" y="695.600" font-size="20" font-weight="700" fill="#111827">Jenkins master Pod</text>
<text data-source="root.0.1.4.0.1.4" x="128.000" y="731.600" font-size="18" font-weight="400" fill="#111827">base와 user configuration이</text>
<text data-source="root.0.1.4.0.1.4" x="128.000" y="755.900" font-size="18" font-weight="400" fill="#111827">적용된 실행 인스턴스</text>
<text data-source="root.0.1.4.0.1.6" x="568.000" y="695.600" font-size="20" font-weight="700" fill="#111827">CR status fields</text>
<text data-source="root.0.1.4.0.1.6" x="568.000" y="731.600" font-size="18" font-weight="400" fill="#111827">provision과 configuration</text>
<text data-source="root.0.1.4.0.1.6" x="568.000" y="755.900" font-size="18" font-weight="400" fill="#111827">timestamp</text>
<text data-source="root.0.1.4.0.1.1" x="412.000" y="448.700" font-size="18" font-weight="400" fill="#111827">기본 자원 준비</text>
<text data-source="root.0.1.4.0.1.1" x="412.000" y="473.000" font-size="18" font-weight="400" fill="#111827">완료</text>
<text data-source="root.0.1.4.0.1.3" x="120.000" y="603.600" font-size="18" font-weight="400" fill="#111827">사용자 설정 반영</text>
<text data-source="root.0.1.4.0.1.5" x="412.000" y="700.600" font-size="18" font-weight="400" fill="#111827">완료 시각 기록</text>
<text data-source="root.0.1.4.1.0" x="1040.000" y="396.000" font-size="20" font-weight="700" fill="#111827">반복 오류 경로</text>
<text data-source="root.0.1.4.1.1.0" x="1088.000" y="456.300" font-size="20" font-weight="700" fill="#111827">Reconcile step error</text>
<text data-source="root.0.1.4.1.1.0" x="1088.000" y="492.300" font-size="18" font-weight="400" fill="#111827">Validate, base 또는 user</text>
<text data-source="root.0.1.4.1.1.0" x="1088.000" y="516.600" font-size="18" font-weight="400" fill="#111827">단계의 조정 실패</text>
<text data-source="root.0.1.4.1.1.2" x="1528.000" y="468.450" font-size="20" font-weight="700" fill="#111827">Same error 10 times</text>
<text data-source="root.0.1.4.1.1.2" x="1528.000" y="504.450" font-size="18" font-weight="400" fill="#111827">같은 error가 한도까지 누적</text>
<text data-source="root.0.1.4.1.1.4" x="1088.000" y="672.200" font-size="20" font-weight="700" fill="#111827">ReconcileLoopFailed</text>
<text data-source="root.0.1.4.1.1.4" x="1088.000" y="708.200" font-size="18" font-weight="400" fill="#111827">CR status에 실패를 기록하고</text>
<text data-source="root.0.1.4.1.1.4" x="1088.000" y="732.500" font-size="18" font-weight="400" fill="#111827">조정 loop를 중단</text>
<text data-source="root.0.1.4.1.1.1" x="1372.000" y="437.000" font-size="18" font-weight="400" fill="#111827">현재 pass</text>
<text data-source="root.0.1.4.1.1.1" x="1372.000" y="461.300" font-size="18" font-weight="400" fill="#111827">재시도</text>
<text data-source="root.0.1.4.1.1.3" x="1080.000" y="580.200" font-size="18" font-weight="400" fill="#111827">반복 오류 한도 도달</text>
<text data-source="root.0.1.3" x="64.000" y="324.000" font-size="20" font-weight="400" fill="#111827">pass 결과에 따라 분기</text>
<text data-source="root.0.2" x="64.000" y="996.000" font-size="16" font-weight="400" fill="#111827">정상 pass는 CR status fields에서 끝나고, Validate 또는 base 단계가 실패하면 user 단계는 실행되지 않습니다. 같은 error가 10회 누적될 때만 반복 오류 경로에서 ReconcileLoopFailed로 중단되며, status와 Operator log에서 완료 지점을 확인할</text>
<text data-source="root.0.2" x="64.000" y="1017.600" font-size="16" font-weight="400" fill="#111827">수 있습니다.</text>
</svg>
