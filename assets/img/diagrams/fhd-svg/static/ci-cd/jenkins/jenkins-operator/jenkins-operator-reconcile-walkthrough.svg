<text data-source="root.0.0" x="64.000" y="115.000" font-size="36" font-weight="700" fill="#111827">한 번의 reconcile pass: base 이후 user 설정 적용</text>
<text data-source="root.0.1.0" x="106.000" y="177.550" font-size="16" font-weight="700" fill="#111827">Watch event</text>
<text data-source="root.0.1.0" x="106.000" y="208.350" font-size="14" font-weight="400" fill="#111827">Jenkins CR 생성 또는 변경</text>
<text data-source="root.0.1.2" x="574.000" y="177.550" font-size="16" font-weight="700" fill="#111827">base.Validate</text>
<text data-source="root.0.1.2" x="574.000" y="208.350" font-size="14" font-weight="400" fill="#111827">CR spec의 유효성 검사</text>
<text data-source="root.0.1.4" x="1042.000" y="168.100" font-size="16" font-weight="700" fill="#111827">base.Reconcile</text>
<text data-source="root.0.1.4" x="1042.000" y="198.900" font-size="14" font-weight="400" fill="#111827">namespace, RBAC, Secret, master Pod, API</text>
<text data-source="root.0.1.4" x="1042.000" y="217.800" font-size="14" font-weight="400" fill="#111827">token, 7개 보안 Groovy</text>
<text data-source="root.0.1.6" x="1510.000" y="168.100" font-size="16" font-weight="700" fill="#111827">waitForJenkins</text>
<text data-source="root.0.1.6" x="1510.000" y="198.900" font-size="14" font-weight="400" fill="#111827">readiness를 polling하고 준비 전에는 pass를</text>
<text data-source="root.0.1.6" x="1510.000" y="217.800" font-size="14" font-weight="400" fill="#111827">끝냄</text>
<text data-source="root.0.1.1" x="424.000" y="170.500" font-size="14" font-weight="400" fill="#111827">reconcile 진입</text>
<text data-source="root.0.1.3" x="892.000" y="170.500" font-size="14" font-weight="400" fill="#111827">검증 통과</text>
<text data-source="root.0.1.5" x="1360.000" y="151.600" font-size="14" font-weight="400" fill="#111827">Jenkins API 준비</text>
<text data-source="root.0.1.5" x="1360.000" y="170.500" font-size="14" font-weight="400" fill="#111827">대기</text>
<text data-source="root.0.1.8.0.0" x="98.000" y="363.200" font-size="16" font-weight="700" fill="#111827">Jenkins 준비됨</text>
<text data-source="root.0.1.8.0.1.0" x="140.000" y="404.800" font-size="16" font-weight="700" fill="#111827">user.ReconcileCasc</text>
<text data-source="root.0.1.8.0.1.0" x="140.000" y="435.600" font-size="14" font-weight="400" fill="#111827">JCasC와 user Groovy 적용</text>
<text data-source="root.0.1.8.0.1.2" x="603.500" y="404.800" font-size="16" font-weight="700" fill="#111827">user.ReconcileOthers</text>
<text data-source="root.0.1.8.0.1.2" x="603.500" y="435.600" font-size="14" font-weight="400" fill="#111827">seed jobs, backup와 restore job 확인</text>
<text data-source="root.0.1.8.0.1.4" x="140.000" y="572.500" font-size="16" font-weight="700" fill="#111827">CR status update</text>
<text data-source="root.0.1.8.0.1.4" x="140.000" y="603.300" font-size="14" font-weight="400" fill="#111827">provision, base, user 완료 timestamp</text>
<text data-source="root.0.1.8.0.1.1" x="453.500" y="397.750" font-size="14" font-weight="400" fill="#111827">user resource 생성</text>
<text data-source="root.0.1.8.0.1.3" x="138.000" y="490.500" font-size="14" font-weight="400" fill="#111827">단계 완료 시각 저장</text>
<text data-source="root.0.1.8.1.0" x="975.000" y="363.200" font-size="16" font-weight="700" fill="#111827">아직 준비되지 않음</text>
<text data-source="root.0.1.8.1.1.0" x="985.000" y="404.800" font-size="16" font-weight="700" fill="#111827">Requeue</text>
<text data-source="root.0.1.8.1.1.0" x="985.000" y="435.600" font-size="14" font-weight="400" fill="#111827">readiness가 될 때까지 5초 뒤 같은 pass를 다시 시도</text>
<text data-source="root.0.1.8.2.0" x="98.000" y="664.200" font-size="16" font-weight="700" fill="#111827">어느 단계에서든 오류</text>
<text data-source="root.0.1.8.2.1.0" x="140.000" y="705.800" font-size="16" font-weight="700" fill="#111827">Reconcile step error</text>
<text data-source="root.0.1.8.2.1.0" x="140.000" y="736.600" font-size="14" font-weight="400" fill="#111827">Validate, Reconcile, readiness 또는 user</text>
<text data-source="root.0.1.8.2.1.0" x="140.000" y="755.500" font-size="14" font-weight="400" fill="#111827">단계</text>
<text data-source="root.0.1.8.2.1.2" x="603.500" y="715.250" font-size="16" font-weight="700" fill="#111827">Same error 10 times</text>
<text data-source="root.0.1.8.2.1.2" x="603.500" y="746.050" font-size="14" font-weight="400" fill="#111827">같은 error가 반복 오류 한도에 도달</text>
<text data-source="root.0.1.8.2.1.4" x="140.000" y="892.400" font-size="16" font-weight="700" fill="#111827">ReconcileLoopFailed</text>
<text data-source="root.0.1.8.2.1.4" x="140.000" y="923.200" font-size="14" font-weight="400" fill="#111827">CR status에 실패를 남기고 조정을 중단</text>
<text data-source="root.0.1.8.2.1.1" x="453.500" y="708.200" font-size="14" font-weight="400" fill="#111827">현재 pass 재큐</text>
<text data-source="root.0.1.8.2.1.3" x="138.000" y="810.400" font-size="14" font-weight="400" fill="#111827">공통 종료 조건</text>
<text data-source="root.0.1.7" x="980.000" y="265.200" font-size="14" font-weight="400" fill="#111827">준비 상태에 따라 분기</text>
<text data-source="root.0.2" x="64.000" y="996.100" font-size="14" font-weight="400" fill="#111827">각 단계 완료 시각이 CR status에 기록됩니다. waitForJenkins의 not-ready 경로는 readiness를 기다리는 5초 재큐이고, Validate, Reconcile, readiness 또는 user 단계의 오류는 공통 재큐 경로를 타며 같은 error가 10회 누적될 때만 ReconcileLoopFailed로 중단됩니다.</text>
</svg>
