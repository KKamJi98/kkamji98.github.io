<text data-source="root.0.1.0.1.1" x="421.383" y="560.650" font-size="22" font-weight="400" fill="#111827">DSL 실행</text>
<text data-source="root.0.1.2.0" x="1061.234" y="276.650" font-size="28" font-weight="700" fill="#111827">2. Branch별 Pipeline 실행</text>
<text data-source="root.0.1.2.1.0" x="1117.234" y="362.450" font-size="28" font-weight="700" fill="#111827">Multibranch</text>
