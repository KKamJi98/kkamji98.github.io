<text data-source="root.0.2" x="64.000" y="920.250" font-size="22" font-weight="400" fill="#111827">잡 생성은 중앙 Job DSL이 담당하고, 실행할 Pipeline은 Service repository의 Jenkinsfile이 정의합니다. 공통 단계는 Shared Library에서 재사용합니다.</text>
