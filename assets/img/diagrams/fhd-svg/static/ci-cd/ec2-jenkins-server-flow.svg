<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 588.000 430.050 L 708.000 430.050" fill="none" stroke="#475569" stroke-width="3"><title>Jenkins가 변경을 받음</title></path>
<polygon data-arrowhead="root.0.1.1" points="708.000,430.050 698.000,436.050 698.000,424.050" fill="#475569"/>
