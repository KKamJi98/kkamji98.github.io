<text data-source="root.0.0" x="64.000" y="309.050" font-size="36" font-weight="700" fill="#111827">EC2의 Jenkins controller가 commit을 artifact로 전달하는 흐름</text>
<text data-source="root.0.1.0" x="120.000" y="397.650" font-size="28" font-weight="700" fill="#111827">Source repository</text>
<text data-source="root.0.1.0" x="120.000" y="440.050" font-size="22" font-weight="400" fill="#111827">webhook 또는 poll로 변경</text>
<text data-source="root.0.1.0" x="120.000" y="469.750" font-size="22" font-weight="400" fill="#111827">감지</text>
<text data-source="root.0.1.2" x="588.000" y="397.650" font-size="28" font-weight="700" fill="#111827">Jenkins on EC2</text>
<text data-source="root.0.1.2" x="588.000" y="440.050" font-size="22" font-weight="400" fill="#111827">controller가 queue를</text>
<text data-source="root.0.1.2" x="588.000" y="469.750" font-size="22" font-weight="400" fill="#111827">관리하고 executor를 할당</text>
<text data-source="root.0.1.4" x="1056.000" y="412.500" font-size="28" font-weight="700" fill="#111827">Build job</text>
<text data-source="root.0.1.4" x="1056.000" y="454.900" font-size="22" font-weight="400" fill="#111827">compile, test, package 실행</text>
<text data-source="root.0.1.6" x="1524.000" y="397.650" font-size="28" font-weight="700" fill="#111827">Artifact or image</text>
<text data-source="root.0.1.6" x="1524.000" y="440.050" font-size="22" font-weight="400" fill="#111827">다음 단계로 넘기는 버전 있는</text>
<text data-source="root.0.1.6" x="1524.000" y="469.750" font-size="22" font-weight="400" fill="#111827">결과물</text>
<text data-source="root.0.1.8" x="120.000" y="649.450" font-size="28" font-weight="700" fill="#111827">Deployment target</text>
<text data-source="root.0.1.8" x="120.000" y="691.850" font-size="22" font-weight="400" fill="#111827">artifact 또는 image를 사용해</text>
<text data-source="root.0.1.8" x="120.000" y="721.550" font-size="22" font-weight="400" fill="#111827">배포</text>
<text data-source="root.0.1.1" x="424.000" y="374.150" font-size="22" font-weight="400" fill="#111827">Jenkins가</text>
<text data-source="root.0.1.1" x="424.000" y="403.850" font-size="22" font-weight="400" fill="#111827">변경을 받음</text>
<text data-source="root.0.1.3" x="892.000" y="374.150" font-size="22" font-weight="400" fill="#111827">Build job</text>
<text data-source="root.0.1.3" x="892.000" y="403.850" font-size="22" font-weight="400" fill="#111827">스케줄</text>
<text data-source="root.0.1.5" x="1360.000" y="374.150" font-size="22" font-weight="400" fill="#111827">versioned</text>
<text data-source="root.0.1.5" x="1360.000" y="403.850" font-size="22" font-weight="400" fill="#111827">output 생성</text>
<text data-source="root.0.1.7" x="104.000" y="541.450" font-size="22" font-weight="400" fill="#111827">배포 대상이 결과물을 소비</text>
<text data-source="root.0.2" x="64.000" y="799.250" font-size="22" font-weight="400" fill="#111827">controller는 작업을 조정하고 build workload는 격리된 agent에서 실행할 수 있습니다. 다음 stage로 이동하는 것은 workspace가 아니라 versioned artifact입니다.</text>
</svg>
