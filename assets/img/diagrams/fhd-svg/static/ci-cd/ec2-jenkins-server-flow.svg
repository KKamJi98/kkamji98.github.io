<polygon data-arrowhead="root.0.1.3" points="1332.000,430.050 1322.000,436.050 1322.000,424.050" fill="#475569"/>
<path data-edge="root.0.1.5" data-from="root.0.1.4" data-to="root.0.1.6" d="M 1584.000 505.100 L 1584.000 555.950 L 648.000 555.950 L 648.000 600.300" fill="none" stroke="#475569" stroke-width="3"><title>versioned output 생성</title></path>
<polygon data-arrowhead="root.0.1.5" points="648.000,600.300 642.000,590.300 654.000,590.300" fill="#475569"/>
<path data-edge="root.0.1.7" data-from="root.0.1.6" data-to="root.0.1.8" d="M 900.000 675.350 L 1020.000 675.350" fill="none" stroke="#475569" stroke-width="3"><title>배포 대상이 결과물을 소비</title></path>
<polygon data-arrowhead="root.0.1.7" points="1020.000,675.350 1010.000,681.350 1010.000,669.350" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="315.550" font-size="36" font-weight="700" fill="#111827">EC2의 Jenkins controller가 commit을 artifact로 전달하는 흐름</text>
<text data-source="root.0.1.0" x="120.000" y="419.000" font-size="28" font-weight="700" fill="#111827">Source repository</text>
<text data-source="root.0.1.0" x="120.000" y="461.400" font-size="22" font-weight="400" fill="#111827">webhook 또는 poll로 변경 감지</text>
<text data-source="root.0.1.2" x="744.000" y="404.150" font-size="28" font-weight="700" fill="#111827">Jenkins on EC2</text>
<text data-source="root.0.1.2" x="744.000" y="446.550" font-size="22" font-weight="400" fill="#111827">controller가 queue를 관리하고</text>
<text data-source="root.0.1.2" x="744.000" y="476.250" font-size="22" font-weight="400" fill="#111827">executor를 할당</text>
<text data-source="root.0.1.4" x="1368.000" y="419.000" font-size="28" font-weight="700" fill="#111827">Build job</text>
<text data-source="root.0.1.4" x="1368.000" y="461.400" font-size="22" font-weight="400" fill="#111827">compile, test, package 실행</text>
<text data-source="root.0.1.6" x="432.000" y="664.300" font-size="28" font-weight="700" fill="#111827">Artifact or image</text>
<text data-source="root.0.1.6" x="432.000" y="706.700" font-size="22" font-weight="400" fill="#111827">다음 단계로 넘기는 버전 있는 결과물</text>
<text data-source="root.0.1.8" x="1056.000" y="664.300" font-size="28" font-weight="700" fill="#111827">Deployment target</text>
<text data-source="root.0.1.8" x="1056.000" y="706.700" font-size="22" font-weight="400" fill="#111827">artifact 또는 image를 사용해 배포</text>
<text data-source="root.0.1.1" x="580.000" y="380.650" font-size="22" font-weight="400" fill="#111827">Jenkins가</text>
<text data-source="root.0.1.1" x="580.000" y="410.350" font-size="22" font-weight="400" fill="#111827">변경을 받음</text>
<text data-source="root.0.1.3" x="1204.000" y="380.650" font-size="22" font-weight="400" fill="#111827">Build job</text>
<text data-source="root.0.1.3" x="1204.000" y="410.350" font-size="22" font-weight="400" fill="#111827">스케줄</text>
<text data-source="root.0.1.5" x="660.000" y="547.950" font-size="22" font-weight="400" fill="#111827">versioned output 생성</text>
<text data-source="root.0.1.7" x="892.000" y="625.950" font-size="22" font-weight="400" fill="#111827">배포 대상이</text>
<text data-source="root.0.1.7" x="892.000" y="655.650" font-size="22" font-weight="400" fill="#111827">결과물을 소비</text>
<text data-source="root.0.2" x="64.000" y="792.750" font-size="22" font-weight="400" fill="#111827">controller는 작업을 조정하고 build workload는 격리된 agent에서 실행할 수 있습니다. 다음 stage로 이동하는 것은 workspace가 아니라 versioned artifact입니다.</text>
</svg>
