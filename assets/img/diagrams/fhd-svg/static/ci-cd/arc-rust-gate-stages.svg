<text data-source="root.0.1.1.3" x="695.000" y="749.000" font-size="24" font-weight="400" fill="#111827">runner 점유 94.6분, 95.6분</text>
<text data-source="root.0.1.1.4" x="695.000" y="804.000" font-size="24" font-weight="400" fill="#111827">가장 긴 경로 73.6분, 75.7분</text>
