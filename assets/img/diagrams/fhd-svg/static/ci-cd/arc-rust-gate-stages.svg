<text data-source="root.0.0" x="60.000" y="86.000" font-size="36" font-weight="700" fill="#111827">Rust 저장소 gate의 runner 점유는 106.5분에서 약 55분이 됐습니다</text>
<text data-source="root.0.1.0.1" x="103.000" y="303.000" font-size="30" font-weight="700" fill="#111827">job마다 각자 컴파일</text>
<text data-source="root.0.1.0.1" x="103.000" y="348.000" font-size="24" font-weight="400" fill="#111827">Tier A, Tier B와</text>
<text data-source="root.0.1.0.1" x="103.000" y="380.400" font-size="24" font-weight="400" fill="#111827">source qualification 병렬</text>
<text data-source="root.0.1.0.2" x="103.000" y="528.000" font-size="30" font-weight="700" fill="#111827">오라클 직접 실행</text>
<text data-source="root.0.1.0.2" x="103.000" y="573.000" font-size="24" font-weight="400" fill="#111827">녹화된 fixture 없음</text>
<text data-source="root.0.1.0.2" x="103.000" y="605.400" font-size="24" font-weight="400" fill="#111827">PR마다 약 30분</text>
<text data-source="root.0.1.1.1" x="723.000" y="303.000" font-size="30" font-weight="700" fill="#111827">한 번만 컴파일</text>
<text data-source="root.0.1.1.1" x="723.000" y="348.000" font-size="24" font-weight="400" fill="#111827">cargo test --no-run</text>
<text data-source="root.0.1.1.1" x="723.000" y="380.400" font-size="24" font-weight="400" fill="#111827">테스트 archive 2.2GB</text>
<text data-source="root.0.1.1.2" x="723.000" y="528.000" font-size="30" font-weight="700" fill="#111827">tier를 한 job에서 차례로</text>
<text data-source="root.0.1.1.2" x="723.000" y="573.000" font-size="24" font-weight="400" fill="#111827">오라클은 여전히 직접 실행</text>
<text data-source="root.0.1.1.2" x="723.000" y="605.400" font-size="24" font-weight="400" fill="#111827">가장 긴 경로가 길어짐</text>
<text data-source="root.0.1.2.1" x="1343.000" y="303.000" font-size="30" font-weight="700" fill="#111827">archive 빌드 20~21분</text>
<text data-source="root.0.1.2.1" x="1343.000" y="348.000" font-size="24" font-weight="400" fill="#111827">Tier A 약 10분</text>
<text data-source="root.0.1.2.1" x="1343.000" y="380.400" font-size="24" font-weight="400" fill="#111827">Tier B 1.9분</text>
<text data-source="root.0.1.2.2" x="1343.000" y="528.000" font-size="30" font-weight="700" fill="#111827">오라클 비교 모드</text>
<text data-source="root.0.1.2.2" x="1343.000" y="573.000" font-size="24" font-weight="400" fill="#111827">fixture 복원 22~24초</text>
<text data-source="root.0.1.2.2" x="1343.000" y="605.400" font-size="24" font-weight="400" fill="#111827">source qualification</text>
<text data-source="root.0.1.2.2" x="1343.000" y="637.800" font-size="24" font-weight="400" fill="#111827">2.6~2.8분</text>
<text data-source="root.0.4" x="60.000" y="914.000" font-size="24" font-weight="400" fill="#111827">다음 단계(예상): tier를 다시 병렬로 나누면 가장 긴 경로는 약 30분</text>
<text data-source="root.0.1.0.0" x="75.000" y="205.000" font-size="30" font-weight="700" fill="#111827">처음: 11건 중앙값</text>
<text data-source="root.0.1.0.3" x="75.000" y="749.000" font-size="24" font-weight="400" fill="#111827">runner 점유 106.5분</text>
