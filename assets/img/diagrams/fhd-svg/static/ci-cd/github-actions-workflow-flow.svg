<text data-source="root.0.0" x="64.000" y="100.000" font-size="36" font-weight="700" fill="#111827">GitHub event가 Workflow run을 만들고 Job마다 Runner를 배정</text>
<text data-source="root.0.1.0" x="84.000" y="204.000" font-size="24" font-weight="700" fill="#111827">GitHub event</text>
<text data-source="root.0.1.0" x="84.000" y="243.200" font-size="20" font-weight="400" fill="#111827">push, pull_request, schedule</text>
<text data-source="root.0.1.2" x="1116.000" y="204.000" font-size="24" font-weight="700" fill="#111827">Workflow run</text>
<text data-source="root.0.1.2" x="1116.000" y="243.200" font-size="20" font-weight="400" fill="#111827">event마다 독립적인 실행 하나 생성</text>
<text data-source="root.0.1.1" x="844.000" y="175.100" font-size="20" font-weight="400" fill="#111827">trigger 조건 일치</text>
<text data-source="root.0.1.4.0.0" x="84.000" y="444.000" font-size="24" font-weight="700" fill="#111827">Test job</text>
<text data-source="root.0.1.4.0.1.0" x="136.000" y="516.400" font-size="24" font-weight="700" fill="#111827">Test</text>
<text data-source="root.0.1.4.0.1.0" x="136.000" y="555.600" font-size="20" font-weight="400" fill="#111827">선행 needs가 없으면 독립</text>
<text data-source="root.0.1.4.0.1.0" x="136.000" y="582.600" font-size="20" font-weight="400" fill="#111827">실행</text>
<text data-source="root.0.1.4.0.1.2" x="572.000" y="516.400" font-size="24" font-weight="700" fill="#111827">Runner and steps</text>
<text data-source="root.0.1.4.0.1.2" x="572.000" y="555.600" font-size="20" font-weight="400" fill="#111827">Job마다 새 환경에서</text>
<text data-source="root.0.1.4.0.1.2" x="572.000" y="582.600" font-size="20" font-weight="400" fill="#111827">순서대로 실행</text>
<text data-source="root.0.1.4.0.1.1" x="412.000" y="522.000" font-size="20" font-weight="400" fill="#111827">runs-on</text>
<text data-source="root.0.1.4.1.0" x="1044.000" y="444.000" font-size="24" font-weight="700" fill="#111827">Lint job</text>
<text data-source="root.0.1.4.1.1.0" x="1096.000" y="516.400" font-size="24" font-weight="700" fill="#111827">Lint</text>
<text data-source="root.0.1.4.1.1.0" x="1096.000" y="555.600" font-size="20" font-weight="400" fill="#111827">Test와 dependency가</text>
<text data-source="root.0.1.4.1.1.0" x="1096.000" y="582.600" font-size="20" font-weight="400" fill="#111827">없어 병렬 실행 가능</text>
<text data-source="root.0.1.4.1.1.2" x="1532.000" y="516.400" font-size="24" font-weight="700" fill="#111827">Runner and steps</text>
<text data-source="root.0.1.4.1.1.2" x="1532.000" y="555.600" font-size="20" font-weight="400" fill="#111827">각 Job의 workspace는</text>
<text data-source="root.0.1.4.1.1.2" x="1532.000" y="582.600" font-size="20" font-weight="400" fill="#111827">자동 공유되지 않음</text>
<text data-source="root.0.1.4.1.1.1" x="1372.000" y="522.000" font-size="20" font-weight="400" fill="#111827">runs-on</text>
<text data-source="root.0.1.3" x="64.000" y="324.000" font-size="20" font-weight="400" fill="#111827">정의된 Job을 스케줄</text>
<text data-source="root.0.1.6" x="780.000" y="896.000" font-size="24" font-weight="700" fill="#111827">Deploy job</text>
<text data-source="root.0.1.6" x="780.000" y="935.200" font-size="20" font-weight="400" fill="#111827">앞선 Job이 성공한 뒤에만 실행</text>
<text data-source="root.0.1.5" x="840.000" y="806.000" font-size="20" font-weight="400" fill="#111827">needs: [test, lint] 통과</text>
<text data-source="root.0.2" x="64.000" y="996.000" font-size="16" font-weight="400" fill="#111827">Job은 기본적으로 서로 독립적이며 needs로 의존성을 선언할 때만 순서가 생깁니다. Job 사이 결과 전달에는 artifact, cache, output을 목적에 맞게 지정합니다.</text>
</svg>
