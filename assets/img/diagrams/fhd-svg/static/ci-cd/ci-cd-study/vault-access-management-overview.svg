<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="aa41c8e2ae9975bff70431abbe1793ae5142245a73086901d743977ed1e659b3">
