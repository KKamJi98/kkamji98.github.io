<rect data-source="root.0.2.2" x="64.000" y="615.150" width="884.000" height="289.600" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.2.3" x="972.000" y="615.150" width="884.000" height="289.600" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-node="root.0.2.0.1" x="88.000" y="387.350" width="836.000" height="126.100" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.2.1.1" x="996.000" y="387.350" width="836.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.2.1" x="88.000" y="700.950" width="836.000" height="126.100" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect data-node="root.0.2.3.1" x="996.000" y="700.950" width="836.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text data-source="root.0.0" x="64.000" y="211.250" font-size="36" font-weight="700" fill="#111827">Vault 액세스 관리: 네 가지 질문으로 권한을 정의한다</text>
<text data-source="root.0.1" x="64.000" y="269.850" font-size="22" font-weight="400" fill="#111827">Vault는 신원을 확인한 뒤 대상, 허용 시간, 접근키 수명까지 함께 관리한다.</text>
<text data-source="root.0.2.0.0" x="88.000" y="353.550" font-size="28" font-weight="700" fill="#111827">1 누구</text>
<text data-source="root.0.2.0.1" x="112.000" y="439.350" font-size="28" font-weight="700" fill="#111827">Identity</text>
<text data-source="root.0.2.0.1" x="112.000" y="481.750" font-size="22" font-weight="400" fill="#111827">사람, 애플리케이션, 시스템, 머신의 신원을 인증한다.</text>
<text data-source="root.0.2.0.2" x="88.000" y="559.450" font-size="22" font-weight="400" fill="#111827">인증 결과가 이후 정책 평가의 주체가 된다.</text>
<text data-source="root.0.2.1.0" x="996.000" y="353.550" font-size="28" font-weight="700" fill="#111827">2 무엇에</text>
<text data-source="root.0.2.1.1" x="1020.000" y="439.350" font-size="28" font-weight="700" fill="#111827">Target resource</text>
<text data-source="root.0.2.1.1" x="1020.000" y="481.750" font-size="22" font-weight="400" fill="#111827">Database, Web Server, S3, Cloud Console 같은 접근 대상을 지정한다.</text>
<text data-source="root.0.2.1.2" x="996.000" y="559.450" font-size="22" font-weight="400" fill="#111827">정책은 identity와 resource path의 조합으로 접근 범위를 정한다.</text>
<text data-source="root.0.2.2.0" x="88.000" y="667.150" font-size="28" font-weight="700" fill="#111827">3 얼마 동안</text>
<text data-source="root.0.2.2.1" x="112.000" y="752.950" font-size="28" font-weight="700" fill="#111827">TTL and lease</text>
<text data-source="root.0.2.2.1" x="112.000" y="795.350" font-size="22" font-weight="400" fill="#111827">임시 credential에 만료 시간과 lease를 부여해 허용 기간을 제한한다.</text>
<text data-source="root.0.2.2.2" x="88.000" y="873.050" font-size="22" font-weight="400" fill="#111827">만료 시점이 지나면 같은 credential을 계속 사용할 수 없다.</text>
<text data-source="root.0.2.3.0" x="996.000" y="667.150" font-size="28" font-weight="700" fill="#111827">4 라이프 사이클</text>
<text data-source="root.0.2.3.1" x="1020.000" y="752.950" font-size="28" font-weight="700" fill="#111827">Create, renew, revoke</text>
<text data-source="root.0.2.3.1" x="1020.000" y="795.350" font-size="22" font-weight="400" fill="#111827">접근키를 생성하고 필요하면 갱신하며 사용이 끝나면 폐기한다.</text>
<text data-source="root.0.2.3.2" x="996.000" y="873.050" font-size="22" font-weight="400" fill="#111827">자동화된 수명주기가 장기 고정키와 수동 회수 누락을 줄인다.</text>
</svg>
