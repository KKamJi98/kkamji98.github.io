<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="e7219cf66422a266418e5e8f7a82ee6fe1a7120330d8613d46c837f0006d6bf1">
