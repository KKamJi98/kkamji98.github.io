<rect data-source="root.0.1.2" x="1032.000" y="226.200" width="792.000" height="649.200" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.1.2.3.0" x="1052.000" y="475.800" width="237.333" height="374.200" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.1.2.3.1" x="1309.333" y="475.800" width="237.333" height="379.600" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.1.2.3.2" x="1566.667" y="475.800" width="237.333" height="310.600" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-node="root.0.1.0" x="96.000" y="495.700" width="792.000" height="110.200" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
