<text data-source="root.0.0" x="64.000" y="170.200" font-size="36" font-weight="700" fill="#111827">Kubernetes GitOps에서 CI 결과를 CD가 Cluster에 적용하는 구조</text>
<text data-source="root.0.1.0.0" x="112.000" y="382.750" font-size="20" font-weight="700" fill="#111827">CI (Continuous Integration)</text>
<text data-source="root.0.1.0.1.0" x="160.000" y="443.050" font-size="20" font-weight="700" fill="#111827">Source Git Repository</text>
<text data-source="root.0.1.0.1.0" x="160.000" y="479.050" font-size="18" font-weight="400" fill="#111827">애플리케이션</text>
<text data-source="root.0.1.0.1.0" x="160.000" y="503.350" font-size="18" font-weight="400" fill="#111827">source code를 관리</text>
<text data-source="root.0.1.0.1.2" x="580.000" y="443.050" font-size="20" font-weight="700" fill="#111827">CI</text>
<text data-source="root.0.1.0.1.2" x="580.000" y="479.050" font-size="18" font-weight="400" fill="#111827">Container Image를</text>
<text data-source="root.0.1.0.1.2" x="580.000" y="503.350" font-size="18" font-weight="400" fill="#111827">빌드하고 검증</text>
<text data-source="root.0.1.0.1.4" x="160.000" y="658.950" font-size="20" font-weight="700" fill="#111827">Image Registry</text>
<text data-source="root.0.1.0.1.4" x="160.000" y="694.950" font-size="18" font-weight="400" fill="#111827">versioned Container</text>
<text data-source="root.0.1.0.1.4" x="160.000" y="719.250" font-size="18" font-weight="400" fill="#111827">Image를 저장</text>
<text data-source="root.0.1.0.1.1" x="424.000" y="423.750" font-size="18" font-weight="400" fill="#111827">code</text>
<text data-source="root.0.1.0.1.1" x="424.000" y="448.050" font-size="18" font-weight="400" fill="#111827">build와 test</text>
<text data-source="root.0.1.0.1.3" x="152.000" y="566.950" font-size="18" font-weight="400" fill="#111827">image push</text>
<text data-source="root.0.1.2.0" x="1048.000" y="234.800" font-size="20" font-weight="700" fill="#111827">CD (Continuous Delivery)</text>
<text data-source="root.0.1.2.1.0.0" x="1064.000" y="293.800" font-size="20" font-weight="700" fill="#111827">Config synchronization</text>
<text data-source="root.0.1.2.1.0.1.0" x="1080.000" y="352.800" font-size="20" font-weight="700" fill="#111827">Config Git Repository</text>
<text data-source="root.0.1.2.1.0.1.0" x="1080.000" y="388.800" font-size="18" font-weight="400" fill="#111827">Kubernetes Manifest와 배포</text>
<text data-source="root.0.1.2.1.0.1.0" x="1080.000" y="413.100" font-size="18" font-weight="400" fill="#111827">형상을 관리</text>
<text data-source="root.0.1.2.1.0.1.2" x="1080.000" y="584.000" font-size="20" font-weight="700" fill="#111827">CD</text>
<text data-source="root.0.1.2.1.0.1.2" x="1080.000" y="620.000" font-size="18" font-weight="400" fill="#111827">Manifest를 읽고 동기화 작업을 수행</text>
<text data-source="root.0.1.2.1.0.1.4" x="1080.000" y="790.900" font-size="20" font-weight="700" fill="#111827">Kubernetes</text>
<text data-source="root.0.1.2.1.0.1.4" x="1080.000" y="826.900" font-size="18" font-weight="400" fill="#111827">Manifest를 적용하고 실제</text>
<text data-source="root.0.1.2.1.0.1.4" x="1080.000" y="851.200" font-size="18" font-weight="400" fill="#111827">image를 실행</text>
<text data-source="root.0.1.2.1.0.1.1" x="1254.000" y="485.400" font-size="18" font-weight="400" fill="#111827">desired state를</text>
<text data-source="root.0.1.2.1.0.1.1" x="1254.000" y="509.700" font-size="18" font-weight="400" fill="#111827">pull</text>
<text data-source="root.0.1.2.1.0.1.3" x="1254.000" y="692.300" font-size="18" font-weight="400" fill="#111827">Push 또는</text>
<text data-source="root.0.1.2.1.0.1.3" x="1254.000" y="716.600" font-size="18" font-weight="400" fill="#111827">Pull로 적용</text>
<text data-source="root.0.1.2.1.1.0" x="1452.000" y="293.800" font-size="20" font-weight="700" fill="#111827">Image delivery</text>
<text data-source="root.0.1.2.1.1.1.0" x="1468.000" y="352.800" font-size="20" font-weight="700" fill="#111827">Image Registry</text>
<text data-source="root.0.1.2.1.1.1.0" x="1468.000" y="388.800" font-size="18" font-weight="400" fill="#111827">CI가 push한 versioned</text>
<text data-source="root.0.1.2.1.1.1.0" x="1468.000" y="413.100" font-size="18" font-weight="400" fill="#111827">Container Image</text>
<text data-source="root.0.1.2.1.1.1.2" x="1468.000" y="559.700" font-size="20" font-weight="700" fill="#111827">Kubernetes</text>
<text data-source="root.0.1.2.1.1.1.2" x="1468.000" y="595.700" font-size="18" font-weight="400" fill="#111827">Registry에서 image를 가져와</text>
<text data-source="root.0.1.2.1.1.1.2" x="1468.000" y="620.000" font-size="18" font-weight="400" fill="#111827">Pod를 실행</text>
<text data-source="root.0.1.2.1.1.1.1" x="1642.000" y="485.400" font-size="18" font-weight="400" fill="#111827">image pull</text>
<text data-source="root.0.1.1" x="892.000" y="485.250" font-size="18" font-weight="400" fill="#111827">Pull Request로</text>
<text data-source="root.0.1.1" x="892.000" y="509.550" font-size="18" font-weight="400" fill="#111827">Manifest와</text>
<text data-source="root.0.1.1" x="892.000" y="533.850" font-size="18" font-weight="400" fill="#111827">image tag 변경</text>
<text data-source="root.0.2" x="64.000" y="939.500" font-size="18" font-weight="400" fill="#111827">CI는 image를 만들고 Registry에 저장합니다. CD는 Config Git을 기준으로 Cluster 상태를 맞추고, Kubernetes는 필요한 image를 Registry에서 pull합니다.</text>
</svg>
