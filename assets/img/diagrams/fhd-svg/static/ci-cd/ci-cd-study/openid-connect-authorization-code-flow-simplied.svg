<text data-source="root.0.0" x="64.000" y="125.400" font-size="36" font-weight="700" fill="#111827">OpenID Connect Authorization Code Flow</text>
<text data-source="root.0.1.0" x="116.000" y="222.200" font-size="24" font-weight="700" fill="#111827">1. Application</text>
<text data-source="root.0.1.0" x="116.000" y="253.400" font-size="24" font-weight="700" fill="#111827">redirects the</text>
<text data-source="root.0.1.0" x="116.000" y="284.600" font-size="24" font-weight="700" fill="#111827">browser</text>
<text data-source="root.0.1.0" x="116.000" y="323.800" font-size="20" font-weight="400" fill="#111827">Argo CD가 사용자를</text>
<text data-source="root.0.1.0" x="116.000" y="350.800" font-size="20" font-weight="400" fill="#111827">Keycloak으로 보냄</text>
<text data-source="root.0.1.2" x="590.294" y="222.200" font-size="24" font-weight="700" fill="#111827">2. Browser sends an</text>
<text data-source="root.0.1.2" x="590.294" y="253.400" font-size="24" font-weight="700" fill="#111827">authorization</text>
<text data-source="root.0.1.2" x="590.294" y="284.600" font-size="24" font-weight="700" fill="#111827">request</text>
<text data-source="root.0.1.2" x="590.294" y="323.800" font-size="20" font-weight="400" fill="#111827">Keycloak의 Authorization</text>
<text data-source="root.0.1.2" x="590.294" y="350.800" font-size="20" font-weight="400" fill="#111827">Endpoint로 요청</text>
<text data-source="root.0.1.4" x="1064.587" y="222.200" font-size="24" font-weight="700" fill="#111827">3. Keycloak</text>
<text data-source="root.0.1.4" x="1064.587" y="253.400" font-size="24" font-weight="700" fill="#111827">authenticates the</text>
<text data-source="root.0.1.4" x="1064.587" y="284.600" font-size="24" font-weight="700" fill="#111827">user</text>
<text data-source="root.0.1.4" x="1064.587" y="323.800" font-size="20" font-weight="400" fill="#111827">Authorization Server와</text>
<text data-source="root.0.1.4" x="1064.587" y="350.800" font-size="20" font-weight="400" fill="#111827">OpenID Provider 역할</text>
<text data-source="root.0.1.6" x="1538.881" y="222.200" font-size="24" font-weight="700" fill="#111827">4. Keycloak returns</text>
<text data-source="root.0.1.6" x="1538.881" y="253.400" font-size="24" font-weight="700" fill="#111827">an Authorization</text>
<text data-source="root.0.1.6" x="1538.881" y="284.600" font-size="24" font-weight="700" fill="#111827">Code</text>
<text data-source="root.0.1.6" x="1538.881" y="323.800" font-size="20" font-weight="400" fill="#111827">code를 Application(Argo</text>
<text data-source="root.0.1.6" x="1538.881" y="350.800" font-size="20" font-weight="400" fill="#111827">CD)으로 전달</text>
<text data-source="root.0.1.8" x="116.000" y="538.000" font-size="24" font-weight="700" fill="#111827">5. Application</text>
<text data-source="root.0.1.8" x="116.000" y="569.200" font-size="24" font-weight="700" fill="#111827">exchanges the code</text>
<text data-source="root.0.1.8" x="116.000" y="608.400" font-size="20" font-weight="400" fill="#111827">ID Token과 Access</text>
<text data-source="root.0.1.8" x="116.000" y="635.400" font-size="20" font-weight="400" fill="#111827">Token을 발급받음</text>
<text data-source="root.0.1.1" x="405.119" y="232.000" font-size="20" font-weight="400" fill="#111827">Application -&gt;</text>
<text data-source="root.0.1.1" x="405.119" y="259.000" font-size="20" font-weight="400" fill="#111827">User: redirect</text>
<text data-source="root.0.1.3" x="879.413" y="178.000" font-size="20" font-weight="400" fill="#111827">User -&gt;</text>
<text data-source="root.0.1.3" x="879.413" y="205.000" font-size="20" font-weight="400" fill="#111827">Keycloak:</text>
<text data-source="root.0.1.3" x="879.413" y="232.000" font-size="20" font-weight="400" fill="#111827">authorization</text>
<text data-source="root.0.1.3" x="879.413" y="259.000" font-size="20" font-weight="400" fill="#111827">request</text>
<text data-source="root.0.1.5" x="1353.706" y="205.000" font-size="20" font-weight="400" fill="#111827">Keycloak -&gt;</text>
<text data-source="root.0.1.5" x="1353.706" y="232.000" font-size="20" font-weight="400" fill="#111827">User:</text>
<text data-source="root.0.1.5" x="1353.706" y="259.000" font-size="20" font-weight="400" fill="#111827">authentication</text>
<text data-source="root.0.1.7" x="104.000" y="438.000" font-size="20" font-weight="400" fill="#111827">Keycloak -&gt; Application: Authorization Code</text>
<text data-source="root.0.2.0.0" x="84.000" y="805.400" font-size="24" font-weight="700" fill="#111827">6. Application establishes a session</text>
<text data-source="root.0.2.0.0" x="84.000" y="844.600" font-size="20" font-weight="400" fill="#111827">Application -&gt; Application: ID Token으로 사용자 신원을 확인하고 session 생성</text>
<text data-source="root.0.3" x="64.000" y="983.600" font-size="20" font-weight="400" fill="#111827">Application은 자격 증명을 직접 보관하지 않고 Keycloak이 발급한 token을 사용해 SSO를 완성합니다.</text>
<text data-source="root.0.1.9" x="450.000" y="702.400" font-size="20" font-weight="400" fill="#111827">Application -&gt; Keycloak: Token Endpoint exchange</text>
<text data-source="root.0.2.loop.meaning" x="88.000" y="927.600" font-size="14" font-weight="400" fill="#111827">반복</text>
</svg>
