<text data-source="root.0.0" x="64.000" y="131.700" font-size="36" font-weight="700" fill="#111827">Jenkins 이미지 빌드와 Kubernetes 수동 배포</text>
<text data-source="root.0.1.0" x="116.000" y="219.200" font-size="24" font-weight="700" fill="#111827">Developer</text>
<text data-source="root.0.1.0" x="116.000" y="258.400" font-size="20" font-weight="400" fill="#111827">source code를 Git 저장소에 push</text>
<text data-source="root.0.1.2" x="740.000" y="219.200" font-size="24" font-weight="700" fill="#111827">Git source repository</text>
<text data-source="root.0.1.2" x="740.000" y="258.400" font-size="20" font-weight="400" fill="#111827">Jenkins가 가져올 source 보관</text>
<text data-source="root.0.1.4" x="1364.000" y="219.200" font-size="24" font-weight="700" fill="#111827">CI server (Jenkins)</text>
<text data-source="root.0.1.4" x="1364.000" y="258.400" font-size="20" font-weight="400" fill="#111827">source checkout 후 container image를 build</text>
<text data-source="root.0.1.1" x="580.000" y="211.300" font-size="20" font-weight="400" fill="#111827">push</text>
<text data-source="root.0.1.3" x="1204.000" y="184.300" font-size="20" font-weight="400" fill="#111827">수동 빌드 실행</text>
<text data-source="root.0.1.3" x="1204.000" y="211.300" font-size="20" font-weight="400" fill="#111827">후 checkout</text>
<text data-source="root.0.2.0.0" x="84.000" y="360.300" font-size="24" font-weight="700" fill="#111827">Image artifact</text>
<text data-source="root.0.2.0.2.0" x="160.000" y="535.700" font-size="24" font-weight="700" fill="#111827">Container image</text>
<text data-source="root.0.2.0.2.0" x="160.000" y="566.900" font-size="24" font-weight="700" fill="#111827">build</text>
<text data-source="root.0.2.0.2.0" x="160.000" y="606.100" font-size="20" font-weight="400" fill="#111827">Jenkins가 애플리케이션을</text>
<text data-source="root.0.2.0.2.0" x="160.000" y="633.100" font-size="20" font-weight="400" fill="#111827">이미지로 패키징</text>
<text data-source="root.0.2.0.2.2" x="599.000" y="549.200" font-size="24" font-weight="700" fill="#111827">Container image</text>
<text data-source="root.0.2.0.2.2" x="599.000" y="580.400" font-size="24" font-weight="700" fill="#111827">registry</text>
<text data-source="root.0.2.0.2.2" x="599.000" y="619.600" font-size="20" font-weight="400" fill="#111827">배포할 버전 이미지를 보관</text>
<text data-source="root.0.2.0.2.1" x="439.000" y="556.900" font-size="20" font-weight="400" fill="#111827">image push</text>
<text data-source="root.0.2.0.1" x="527.000" y="424.700" font-size="20" font-weight="400" fill="#111827">Jenkins -&gt; Image artifact: image push</text>
<text data-source="root.0.2.1.0" x="990.000" y="360.300" font-size="24" font-weight="700" fill="#111827">Runtime deployment</text>
<text data-source="root.0.2.1.2.0" x="1066.000" y="535.700" font-size="24" font-weight="700" fill="#111827">Operator: kubectl</text>
<text data-source="root.0.2.1.2.0" x="1066.000" y="566.900" font-size="24" font-weight="700" fill="#111827">set image</text>
<text data-source="root.0.2.1.2.0" x="1066.000" y="606.100" font-size="20" font-weight="400" fill="#111827">Deployment의 이미지</text>
<text data-source="root.0.2.1.2.0" x="1066.000" y="633.100" font-size="20" font-weight="400" fill="#111827">태그를 0.0.2로 변경</text>
<text data-source="root.0.2.1.2.2" x="1505.715" y="535.700" font-size="24" font-weight="700" fill="#111827">Kubernetes</text>
<text data-source="root.0.2.1.2.2" x="1505.715" y="566.900" font-size="24" font-weight="700" fill="#111827">Deployment</text>
<text data-source="root.0.2.1.2.2" x="1505.715" y="606.100" font-size="20" font-weight="400" fill="#111827">새 이미지의 Pod로 순차</text>
<text data-source="root.0.2.1.2.2" x="1505.715" y="633.100" font-size="20" font-weight="400" fill="#111827">교체</text>
<text data-source="root.0.2.1.2.4" x="1066.000" y="800.100" font-size="24" font-weight="700" fill="#111827">Running Pod</text>
<text data-source="root.0.2.1.2.4" x="1066.000" y="839.300" font-size="20" font-weight="400" fill="#111827">registry의 이미지를 받아</text>
<text data-source="root.0.2.1.2.4" x="1066.000" y="866.300" font-size="20" font-weight="400" fill="#111827">실행</text>
<text data-source="root.0.2.1.2.1" x="1344.285" y="529.900" font-size="20" font-weight="400" fill="#111827">Deployment</text>
<text data-source="root.0.2.1.2.1" x="1344.285" y="556.900" font-size="20" font-weight="400" fill="#111827">rollout</text>
<text data-source="root.0.2.1.1" x="1433.000" y="424.700" font-size="20" font-weight="400" fill="#111827">이미지 push 후 운영자가 수동 배포</text>
<text data-source="root.0.3" x="64.000" y="977.300" font-size="20" font-weight="400" fill="#111827">이 단계에서는 Jenkins 빌드를 수동 실행합니다. Jenkins는 이미지를 build/push하고, 운영자가 kubectl로 Deployment를 갱신합니다.</text>
<text data-source="root.0.2.1.2.3" x="579.000" y="764.700" font-size="20" font-weight="400" fill="#111827">Registry -&gt; node runtime:</text>
<text data-source="root.0.2.1.2.3" x="579.000" y="791.700" font-size="20" font-weight="400" fill="#111827">image pull</text>
</svg>
