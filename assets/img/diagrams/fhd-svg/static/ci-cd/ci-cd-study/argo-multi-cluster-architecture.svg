<polygon data-arrowhead="root.0.1.1" points="1020.000,534.600 1010.000,540.600 1010.000,528.600" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="347.000" font-size="36" font-weight="700" fill="#111827">kind-mgmt의 Argo CD가 kind-prd와 kind-dev를 중앙 관리</text>
<text data-source="root.0.1.0" x="120.000" y="523.550" font-size="28" font-weight="700" fill="#111827">kind-mgmt</text>
<text data-source="root.0.1.0" x="120.000" y="565.950" font-size="22" font-weight="400" fill="#111827">Argo CD가 설치된 Control Cluster</text>
<text data-source="root.0.1.2.0.0" x="1056.000" y="435.600" font-size="28" font-weight="700" fill="#111827">kind-prd</text>
<text data-source="root.0.1.2.0.1.0" x="1080.000" y="521.400" font-size="28" font-weight="700" fill="#111827">Production</text>
<text data-source="root.0.1.2.0.1.0" x="1080.000" y="557.800" font-size="28" font-weight="700" fill="#111827">Cluster</text>
<text data-source="root.0.1.2.0.1.0" x="1080.000" y="600.200" font-size="22" font-weight="400" fill="#111827">운영 workload의 대상</text>
<text data-source="root.0.1.2.0.1.0" x="1080.000" y="629.900" font-size="22" font-weight="400" fill="#111827">Cluster</text>
<text data-source="root.0.1.2.1.0" x="1464.000" y="435.600" font-size="28" font-weight="700" fill="#111827">kind-dev</text>
<text data-source="root.0.1.2.1.1.0" x="1488.000" y="521.400" font-size="28" font-weight="700" fill="#111827">Development</text>
<text data-source="root.0.1.2.1.1.0" x="1488.000" y="557.800" font-size="28" font-weight="700" fill="#111827">Cluster</text>
<text data-source="root.0.1.2.1.1.0" x="1488.000" y="600.200" font-size="22" font-weight="400" fill="#111827">개발과 테스트 workload의</text>
<text data-source="root.0.1.2.1.1.0" x="1488.000" y="629.900" font-size="22" font-weight="400" fill="#111827">대상 Cluster</text>
<text data-source="root.0.1.1" x="892.000" y="455.500" font-size="22" font-weight="400" fill="#111827">등록된</text>
<text data-source="root.0.1.1" x="892.000" y="485.200" font-size="22" font-weight="400" fill="#111827">자격증명으</text>
<text data-source="root.0.1.1" x="892.000" y="514.900" font-size="22" font-weight="400" fill="#111827">로 Deploy</text>
<text data-source="root.0.2" x="64.000" y="731.600" font-size="22" font-weight="400" fill="#111827">kind-mgmt의 Argo CD에 대상 Cluster credential을 등록한 뒤, 각 Application의 destination을 kind-prd 또는 kind-dev로 지정합니다. 두 경로는 순서가 아니라 중앙 관리에서</text>
<text data-source="root.0.2" x="64.000" y="761.300" font-size="22" font-weight="400" fill="#111827">갈라지는 대상입니다.</text>
