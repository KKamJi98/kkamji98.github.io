<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="dd7418c90028b0bfe5872e5735e94e574bbd7d8a711eeadc2565ea7843d97572">
