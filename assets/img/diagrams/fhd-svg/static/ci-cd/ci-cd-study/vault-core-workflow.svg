<rect data-node="root.0.1.1.6" x="424.000" y="651.550" width="464.000" height="155.800" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.1.1.8" x="1032.000" y="621.850" width="464.000" height="215.200" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<path data-edge="root.0.1.1.1" data-from="root.0.1.1.0" data-to="root.0.1.1.2" d="M 596.000 424.750 L 716.000 424.750" fill="none" stroke="#475569" stroke-width="3"><title>identity 제출</title></path>
<polygon data-arrowhead="root.0.1.1.1" points="716.000,424.750 706.000,430.750 706.000,418.750" fill="#475569"/>
<path data-edge="root.0.1.1.3" data-from="root.0.1.1.2" data-to="root.0.1.1.4" d="M 1204.000 424.750 L 1324.000 424.750" fill="none" stroke="#475569" stroke-width="3"><title>로그인 중 Auth Method별 검증</title></path>
<polygon data-arrowhead="root.0.1.1.3" points="1324.000,424.750 1314.000,430.750 1314.000,418.750" fill="#475569"/>
<path data-edge="root.0.1.1.5" data-from="root.0.1.1.4" data-to="root.0.1.1.6" d="M 1568.000 514.650 L 1568.000 573.850 L 656.000 573.850 L 656.000 639.550" fill="none" stroke="#475569" stroke-width="3"><title>이후 token으로 요청할 때마다 인가</title></path>
<polygon data-arrowhead="root.0.1.1.5" points="656.000,639.550 650.000,629.550 662.000,629.550" fill="#475569"/>
<path data-edge="root.0.1.1.7" data-from="root.0.1.1.6" data-to="root.0.1.1.8" d="M 900.000 729.450 L 1020.000 729.450" fill="none" stroke="#475569" stroke-width="3"><title>허용된 secret path 요청</title></path>
<polygon data-arrowhead="root.0.1.1.7" points="1020.000,729.450 1010.000,735.450 1010.000,723.450" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="201.250" font-size="36" font-weight="700" fill="#111827">Vault 요청은 Authenticate에서 Access까지 정책으로 이어진다</text>
<text data-source="root.0.1.0" x="88.000" y="289.850" font-size="28" font-weight="700" fill="#111827">Client to Vault core workflow</text>
<text data-source="root.0.1.1.0" x="144.000" y="398.850" font-size="28" font-weight="700" fill="#111827">Client</text>
<text data-source="root.0.1.1.0" x="144.000" y="441.250" font-size="22" font-weight="400" fill="#111827">사람, 애플리케이션, 시스템이 identity와</text>
<text data-source="root.0.1.1.0" x="144.000" y="470.950" font-size="22" font-weight="400" fill="#111827">credential을 제출한다.</text>
<text data-source="root.0.1.1.2" x="752.000" y="398.850" font-size="28" font-weight="700" fill="#111827">1 Authenticate</text>
<text data-source="root.0.1.1.2" x="752.000" y="441.250" font-size="22" font-weight="400" fill="#111827">LDAP, OIDC, Kubernetes, AWS IAM 같은</text>
<text data-source="root.0.1.1.2" x="752.000" y="470.950" font-size="22" font-weight="400" fill="#111827">Auth Method가 신원을 확인한다.</text>
<text data-source="root.0.1.1.4" x="1360.000" y="398.850" font-size="28" font-weight="700" fill="#111827">2 Validate</text>
<text data-source="root.0.1.1.4" x="1360.000" y="441.250" font-size="22" font-weight="400" fill="#111827">로그인 시 필요한 신원 검증 후 policy가 연결된</text>
<text data-source="root.0.1.1.4" x="1360.000" y="470.950" font-size="22" font-weight="400" fill="#111827">client token을 반환한다.</text>
<text data-source="root.0.1.1.6" x="448.000" y="703.550" font-size="28" font-weight="700" fill="#111827">3 Authorize</text>
<text data-source="root.0.1.1.6" x="448.000" y="745.950" font-size="22" font-weight="400" fill="#111827">identity에 연결된 security policy가 요청</text>
<text data-source="root.0.1.1.6" x="448.000" y="775.650" font-size="22" font-weight="400" fill="#111827">path와 허용 동작을 결정한다.</text>
<text data-source="root.0.1.1.8" x="1056.000" y="673.850" font-size="28" font-weight="700" fill="#111827">4 Access</text>
<text data-source="root.0.1.1.8" x="1056.000" y="716.250" font-size="22" font-weight="400" fill="#111827">Secret Engine이 KV secret을 조회하거나</text>
<text data-source="root.0.1.1.8" x="1056.000" y="745.950" font-size="22" font-weight="400" fill="#111827">dynamic credential을 발급한다. Dynamic</text>
<text data-source="root.0.1.1.8" x="1056.000" y="775.650" font-size="22" font-weight="400" fill="#111827">secret에는 lease를 등록하지만 KV 조회에는</text>
<text data-source="root.0.1.1.8" x="1056.000" y="805.350" font-size="22" font-weight="400" fill="#111827">등록하지 않는다.</text>
<text data-source="root.0.1.1.1" x="588.000" y="405.050" font-size="22" font-weight="400" fill="#111827">identity 제출</text>
<text data-source="root.0.1.1.3" x="1196.000" y="345.650" font-size="22" font-weight="400" fill="#111827">로그인 중 Auth</text>
<text data-source="root.0.1.1.3" x="1196.000" y="375.350" font-size="22" font-weight="400" fill="#111827">Method별</text>
<text data-source="root.0.1.1.3" x="1196.000" y="405.050" font-size="22" font-weight="400" fill="#111827">검증</text>
<text data-source="root.0.1.1.5" x="668.000" y="565.850" font-size="22" font-weight="400" fill="#111827">이후 token으로 요청할 때마다 인가</text>
<text data-source="root.0.1.1.7" x="892.000" y="680.050" font-size="22" font-weight="400" fill="#111827">허용된 secret</text>
<text data-source="root.0.1.1.7" x="892.000" y="709.750" font-size="22" font-weight="400" fill="#111827">path 요청</text>
<text data-source="root.0.2" x="64.000" y="907.050" font-size="22" font-weight="400" fill="#111827">Service token과 dynamic secret은 lease 수명 관리 대상입니다. Audit Device는 대부분의 요청과 응답을 기록하고 expiration manager는 lease 만료와 폐기를 처리합니다.</text>
</svg>
