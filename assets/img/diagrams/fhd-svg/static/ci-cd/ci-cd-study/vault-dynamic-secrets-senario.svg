<polygon data-arrowhead="root.0.4.1.1.1" points="1461.000,798.100 1451.000,804.100 1451.000,792.100" fill="#475569"/>
<path data-edge="root.0.3" data-from="root.0.2" data-to="root.0.4" d="M 960.000 546.100 L 960.000 621.100" fill="none" stroke="#475569" stroke-width="3"><title>VSO가 각 namespace의 Kubernetes Secret을 동기화</title></path>
<polygon data-arrowhead="root.0.3" points="960.000,621.100 954.000,611.100 966.000,611.100" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="131.300" font-size="36" font-weight="700" fill="#111827">Dynamic Secret은 Vault가 발급하고 VSO가 Kubernetes Secret으로 동기화합니다</text>
<text data-source="root.0.1" x="84.000" y="207.900" font-size="24" font-weight="700" fill="#111827">Postgres Namespace / Postgres</text>
<text data-source="root.0.1" x="84.000" y="247.100" font-size="20" font-weight="400" fill="#111827">Vault Database Secrets Engine이 임시 계정을 생성하는 대상</text>
<text data-source="root.0.2.0" x="116.000" y="403.000" font-size="24" font-weight="700" fill="#111827">Vault Namespace / Vault</text>
<text data-source="root.0.2.0" x="116.000" y="442.200" font-size="20" font-weight="400" fill="#111827">role 요청마다 짧은 TTL의 username과 password를 생성합니다.</text>
<text data-source="root.0.2.2" x="1080.920" y="403.000" font-size="24" font-weight="700" fill="#111827">Operator Namespace / Vault Secrets Operator</text>
<text data-source="root.0.2.2" x="1080.920" y="442.200" font-size="20" font-weight="400" fill="#111827">Vault 응답을 대상 namespace의 Secret으로 반영합니다.</text>
<text data-source="root.0.2.1" x="863.080" y="314.100" font-size="20" font-weight="400" fill="#111827">VSO의 VaultAuth</text>
<text data-source="root.0.2.1" x="863.080" y="341.100" font-size="20" font-weight="400" fill="#111827">로그인과</text>
<text data-source="root.0.2.1" x="863.080" y="368.100" font-size="20" font-weight="400" fill="#111827">VaultDynamicSecret</text>
<text data-source="root.0.2.1" x="863.080" y="395.100" font-size="20" font-weight="400" fill="#111827">요청에 자격증명 응답</text>
<text data-source="root.0.4.0.0" x="108.000" y="701.100" font-size="24" font-weight="700" fill="#111827">app Namespace</text>
<text data-source="root.0.4.0.1.0" x="160.000" y="773.500" font-size="24" font-weight="700" fill="#111827">secretkv</text>
<text data-source="root.0.4.0.1.0" x="160.000" y="812.700" font-size="20" font-weight="400" fill="#111827">Kubernetes Secret</text>
<text data-source="root.0.4.0.1.0" x="160.000" y="839.700" font-size="20" font-weight="400" fill="#111827">destination; KV static secret</text>
<text data-source="root.0.4.0.1.0" x="160.000" y="866.700" font-size="20" font-weight="400" fill="#111827">실습</text>
<text data-source="root.0.4.0.1.2" x="611.000" y="800.500" font-size="24" font-weight="700" fill="#111827">App</text>
<text data-source="root.0.4.0.1.2" x="611.000" y="839.700" font-size="20" font-weight="400" fill="#111827">애플리케이션 workload</text>
<text data-source="root.0.4.0.1.1" x="451.000" y="765.600" font-size="20" font-weight="400" fill="#111827">Secret mount</text>
<text data-source="root.0.4.0.1.1" x="451.000" y="792.600" font-size="20" font-weight="400" fill="#111827">또는 env 주입</text>
<text data-source="root.0.4.1.0" x="990.000" y="701.100" font-size="24" font-weight="700" fill="#111827">demo-ns Namespace</text>
<text data-source="root.0.4.1.1.0" x="1042.000" y="773.500" font-size="24" font-weight="700" fill="#111827">vso-db-demo Secret</text>
<text data-source="root.0.4.1.1.0" x="1042.000" y="812.700" font-size="20" font-weight="400" fill="#111827">username과 password를</text>
<text data-source="root.0.4.1.1.0" x="1042.000" y="839.700" font-size="20" font-weight="400" fill="#111827">Pod에 전달</text>
<text data-source="root.0.4.1.1.2" x="1493.000" y="773.500" font-size="24" font-weight="700" fill="#111827">vso-db-demo</text>
<text data-source="root.0.4.1.1.2" x="1493.000" y="812.700" font-size="20" font-weight="400" fill="#111827">Postgres 자격증명을 사용하는</text>
<text data-source="root.0.4.1.1.2" x="1493.000" y="839.700" font-size="20" font-weight="400" fill="#111827">workload</text>
<text data-source="root.0.4.1.1.1" x="1333.000" y="779.100" font-size="20" font-weight="400" fill="#111827">Secret mount</text>
<text data-source="root.0.5" x="64.000" y="977.700" font-size="20" font-weight="400" fill="#111827">TTL 10분의 lease를 67% 지점에서 갱신하는 실습입니다. Vault가 계정을 교체하면 VSO가 Secret을 갱신하고, 설정된 workload rollout을 유도합니다.</text>
<text data-source="root.0.3" x="980.000" y="590.100" font-size="20" font-weight="400" fill="#111827">VSO가 각 namespace의 Kubernetes Secret을 동기화</text>
</svg>
