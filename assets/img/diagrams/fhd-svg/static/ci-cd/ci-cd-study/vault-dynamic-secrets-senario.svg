<path data-edge="root.0.2.1" data-from="root.0.2.0" data-to="root.0.2.2" d="M 871.080 414.100 L 1048.920 414.100" fill="none" stroke="#475569" stroke-width="3"><title>VSO의 VaultAuth 로그인과 VaultDynamicSecret 요청에 자격증명 응답</title></path>
