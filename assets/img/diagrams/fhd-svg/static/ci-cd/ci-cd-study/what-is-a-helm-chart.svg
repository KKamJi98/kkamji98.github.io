<polygon data-arrowhead="root.0.1.1" points="708.000,419.500 698.000,425.500 698.000,413.500" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 1212.000 419.500 L 1332.000 419.500" fill="none" stroke="#475569" stroke-width="3"><title>helm install 또는 helm upgrade: 값 주입과 렌더링</title></path>
<polygon data-arrowhead="root.0.1.3" points="1332.000,419.500 1322.000,425.500 1322.000,413.500" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="252.100" font-size="36" font-weight="700" fill="#111827">Helm Chart는 Kubernetes manifest를 정의하고 패키징해 release로 관리합니다</text>
<text data-source="root.0.1.0" x="120.000" y="408.450" font-size="28" font-weight="700" fill="#111827">Chart files</text>
<text data-source="root.0.1.0" x="120.000" y="450.850" font-size="22" font-weight="400" fill="#111827">Chart.yaml, values.yaml, templates/, charts/</text>
<text data-source="root.0.1.2" x="744.000" y="393.600" font-size="28" font-weight="700" fill="#111827">Chart package (.tgz)</text>
<text data-source="root.0.1.2" x="744.000" y="436.000" font-size="22" font-weight="400" fill="#111827">templates와 values를 포함한 버전 artifact;</text>
<text data-source="root.0.1.2" x="744.000" y="465.700" font-size="22" font-weight="400" fill="#111827">아직 렌더링하지 않음</text>
<text data-source="root.0.1.4" x="1368.000" y="408.450" font-size="28" font-weight="700" fill="#111827">Kubernetes Release</text>
<text data-source="root.0.1.4" x="1368.000" y="450.850" font-size="22" font-weight="400" fill="#111827">렌더링된 manifest를 클러스터에 적용</text>
<text data-source="root.0.1.1" x="580.000" y="340.400" font-size="22" font-weight="400" fill="#111827">helm</text>
<text data-source="root.0.1.1" x="580.000" y="370.100" font-size="22" font-weight="400" fill="#111827">package:</text>
<text data-source="root.0.1.1" x="580.000" y="399.800" font-size="22" font-weight="400" fill="#111827">source 보관</text>
<text data-source="root.0.1.3" x="1204.000" y="310.700" font-size="22" font-weight="400" fill="#111827">helm install</text>
<text data-source="root.0.1.3" x="1204.000" y="340.400" font-size="22" font-weight="400" fill="#111827">또는 helm</text>
<text data-source="root.0.1.3" x="1204.000" y="370.100" font-size="22" font-weight="400" fill="#111827">upgrade: 값</text>
<text data-source="root.0.1.3" x="1204.000" y="399.800" font-size="22" font-weight="400" fill="#111827">주입과 렌더링</text>
<text data-source="root.0.2" x="64.000" y="596.300" font-size="22" font-weight="400" fill="#111827">로컬 Chart 디렉터리도 직접 설치할 수 있습니다. helm template은 설치 없이 렌더링합니다.</text>
<text data-source="root.0.3.0" x="88.000" y="680.000" font-size="28" font-weight="700" fill="#111827">Release 관리 기능</text>
<text data-source="root.0.3.1" x="112.000" y="765.800" font-size="28" font-weight="700" fill="#111827">Manage</text>
<text data-source="root.0.3.1" x="112.000" y="808.200" font-size="22" font-weight="400" fill="#111827">upgrade, rollback, helm test</text>
</svg>
