<text data-source="root.0.0" x="64.000" y="398.950" font-size="36" font-weight="700" fill="#111827">GitOps Lifecycle: 배포에서 조정까지</text>
<text data-source="root.0.1.0.0" x="120.000" y="487.550" font-size="28" font-weight="700" fill="#111827">Deploy</text>
<text data-source="root.0.1.0.0" x="120.000" y="529.950" font-size="22" font-weight="400" fill="#111827">Git에 저장된 manifest를</text>
<text data-source="root.0.1.0.0" x="120.000" y="559.650" font-size="22" font-weight="400" fill="#111827">클러스터에 반영</text>
<text data-source="root.0.1.0.2" x="588.000" y="487.550" font-size="28" font-weight="700" fill="#111827">Monitoring</text>
<text data-source="root.0.1.0.2" x="588.000" y="529.950" font-size="22" font-weight="400" fill="#111827">Git repository와 클러스터</text>
<text data-source="root.0.1.0.2" x="588.000" y="559.650" font-size="22" font-weight="400" fill="#111827">상태를 모니터링</text>
<text data-source="root.0.1.0.4" x="1056.000" y="487.550" font-size="28" font-weight="700" fill="#111827">Drift Detection</text>
<text data-source="root.0.1.0.4" x="1056.000" y="529.950" font-size="22" font-weight="400" fill="#111827">원하는 상태와 live state의</text>
<text data-source="root.0.1.0.4" x="1056.000" y="559.650" font-size="22" font-weight="400" fill="#111827">차이를 감지</text>
<text data-source="root.0.1.0.6" x="1524.000" y="487.550" font-size="28" font-weight="700" fill="#111827">Take Action</text>
<text data-source="root.0.1.0.6" x="1524.000" y="529.950" font-size="22" font-weight="400" fill="#111827">Rollback 또는 3-way-diff로</text>
<text data-source="root.0.1.0.6" x="1524.000" y="559.650" font-size="22" font-weight="400" fill="#111827">상태를 수정</text>
<text data-source="root.0.1.0.1" x="424.000" y="493.750" font-size="22" font-weight="400" fill="#111827">상태 관찰</text>
<text data-source="root.0.1.0.3" x="892.000" y="493.750" font-size="22" font-weight="400" fill="#111827">차이 탐지</text>
<text data-source="root.0.1.0.5" x="1360.000" y="493.750" font-size="22" font-weight="400" fill="#111827">조정 실행</text>
<text data-source="root.0.2" x="64.000" y="709.350" font-size="22" font-weight="400" fill="#111827">Take Action 뒤 다시 Deploy로 돌아가는 폐쇄 루프이며, Git repository가 desired state의 단일 신뢰 소스입니다.</text>
<text data-source="root.0.1.loop.meaning" x="88.000" y="647.350" font-size="14" font-weight="400" fill="#111827">반복</text>
