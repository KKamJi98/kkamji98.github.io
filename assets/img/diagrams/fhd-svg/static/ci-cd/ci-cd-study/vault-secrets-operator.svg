<text data-source="root.0.0" x="64.000" y="115.100" font-size="36" font-weight="700" fill="#111827">Vault Secrets Operator의 Kubernetes와 Vault 경계</text>
<text data-source="root.0.1" x="74.000" y="163.700" font-size="16" font-weight="700" fill="#111827">Developer and kubectl</text>
<text data-source="root.0.1" x="74.000" y="194.500" font-size="14" font-weight="400" fill="#111827">클러스터 밖에서 VaultConnection, VaultAuth, secret 관련 CRD를 선언</text>
<text data-source="root.0.3.0" x="74.000" y="311.400" font-size="16" font-weight="700" fill="#111827">Kubernetes cluster / 제어 영역</text>
<text data-source="root.0.3.1.0" x="116.000" y="366.950" font-size="16" font-weight="700" fill="#111827">Kubernetes API Server</text>
<text data-source="root.0.3.1.0" x="116.000" y="397.750" font-size="14" font-weight="400" fill="#111827">CRD watch와 Secret 저장의 진입점; etcd는 상태를, scheduler는 배치를 관리</text>
<text data-source="root.0.3.1.2" x="1042.000" y="366.950" font-size="16" font-weight="700" fill="#111827">Vault Secrets Operator Controller</text>
<text data-source="root.0.3.1.2" x="1042.000" y="397.750" font-size="14" font-weight="400" fill="#111827">VaultAuth로 인증하고 secret data를 받아 native Secret을 create 또는 update</text>
<text data-source="root.0.3.1.1" x="892.000" y="341.000" font-size="14" font-weight="400" fill="#111827">리소스 watch와</text>
<text data-source="root.0.3.1.1" x="892.000" y="359.900" font-size="14" font-weight="400" fill="#111827">reconcile</text>
<text data-source="root.0.4.0.1.0" x="74.000" y="552.400" font-size="16" font-weight="700" fill="#111827">클러스터 밖 / HashiCorp Vault</text>
<text data-source="root.0.4.0.1.1" x="84.000" y="594.000" font-size="16" font-weight="700" fill="#111827">Vault API</text>
<text data-source="root.0.4.0.1.1" x="84.000" y="624.800" font-size="14" font-weight="400" fill="#111827">Operator 요청에 응답</text>
<text data-source="root.0.4.0.1.2.0" x="84.000" y="675.700" font-size="16" font-weight="700" fill="#111827">Kubernetes Auth and Policy</text>
<text data-source="root.0.4.0.1.2.0" x="84.000" y="706.500" font-size="14" font-weight="400" fill="#111827">ServiceAccount identity 검증과 secret path 권한</text>
<text data-source="root.0.4.0.1.2.1" x="84.000" y="757.400" font-size="16" font-weight="700" fill="#111827">Secret Engine</text>
<text data-source="root.0.4.0.1.2.1" x="84.000" y="788.200" font-size="14" font-weight="400" fill="#111827">KV, Database, PKI의 static 또는 dynamic secret</text>
<text data-source="root.0.4.1.1.0" x="674.667" y="538.600" font-size="16" font-weight="700" fill="#111827">Kubernetes cluster / Namespace A</text>
<text data-source="root.0.4.1.1.1.0" x="716.667" y="580.200" font-size="16" font-weight="700" fill="#111827">Kubernetes Secret A</text>
<text data-source="root.0.4.1.1.1.0" x="716.667" y="611.000" font-size="14" font-weight="400" fill="#111827">Database 자격증명</text>
<text data-source="root.0.4.1.1.1.2" x="716.667" y="747.900" font-size="16" font-weight="700" fill="#111827">Application Pod A</text>
<text data-source="root.0.4.1.1.1.2" x="716.667" y="778.700" font-size="14" font-weight="400" fill="#111827">Vault SDK 없이 native Secret 사용</text>
<text data-source="root.0.4.1.1.1.1" x="714.667" y="665.900" font-size="14" font-weight="400" fill="#111827">mount 또는 env 주입</text>
<text data-source="root.0.4.1.3.0" x="674.667" y="905.600" font-size="16" font-weight="700" fill="#111827">클러스터 밖</text>
<text data-source="root.0.4.1.3.1" x="684.667" y="947.200" font-size="16" font-weight="700" fill="#111827">Database</text>
<text data-source="root.0.4.1.2" x="980.000" y="846.150" font-size="14" font-weight="400" fill="#111827">Pod A가 동기화된 credential로 연결</text>
<text data-source="root.0.4.2.1.0" x="1275.333" y="538.600" font-size="16" font-weight="700" fill="#111827">Kubernetes cluster / Namespace B</text>
<text data-source="root.0.4.2.1.1.0" x="1317.333" y="580.200" font-size="16" font-weight="700" fill="#111827">Kubernetes Secret B</text>
<text data-source="root.0.4.2.1.1.0" x="1317.333" y="611.000" font-size="14" font-weight="400" fill="#111827">Cloud 자격증명</text>
<text data-source="root.0.4.2.1.1.2" x="1317.333" y="747.900" font-size="16" font-weight="700" fill="#111827">Application Pod B</text>
<text data-source="root.0.4.2.1.1.2" x="1317.333" y="778.700" font-size="14" font-weight="400" fill="#111827">Vault SDK 없이 native Secret 사용</text>
<text data-source="root.0.4.2.1.1.1" x="1315.333" y="665.900" font-size="14" font-weight="400" fill="#111827">mount 또는 env 주입</text>
<text data-source="root.0.4.2.3.0" x="1275.333" y="905.600" font-size="16" font-weight="700" fill="#111827">클러스터 밖</text>
<text data-source="root.0.4.2.3.1" x="1285.333" y="947.200" font-size="16" font-weight="700" fill="#111827">Cloud</text>
<text data-source="root.0.4.2.2" x="1580.667" y="846.150" font-size="14" font-weight="400" fill="#111827">Pod B가 동기화된 credential로 연결</text>
<text data-source="root.0.5" x="64.000" y="996.000" font-size="14" font-weight="400" fill="#111827">제어 영역과 두 namespace는 같은 Kubernetes cluster에 속합니다. Vault API 통신은 Controller가, 외부 의존 대상 연결은 각 Pod가 담당합니다.</text>
<text data-source="root.0.2" x="980.000" y="251.950" font-size="14" font-weight="400" fill="#111827">apply resources</text>
<text data-source="root.0.4.0.0" x="84.000" y="460.600" font-size="14" font-weight="400" fill="#111827">Controller가 인증 / secret 요청</text>
<text data-source="root.0.4.0.0" x="84.000" y="479.500" font-size="14" font-weight="400" fill="#111827">Vault가 token / data 반환</text>
<text data-source="root.0.4.1.0" x="684.667" y="460.600" font-size="14" font-weight="400" fill="#111827">Controller가 Secret A 동기화</text>
<text data-source="root.0.4.2.0" x="1285.333" y="460.600" font-size="14" font-weight="400" fill="#111827">Controller가 Secret B 동기화</text>
