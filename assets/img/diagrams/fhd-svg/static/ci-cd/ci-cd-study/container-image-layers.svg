<text data-source="root.0.0" x="64.000" y="267.150" font-size="36" font-weight="700" fill="#111827">Container Image는 재사용 가능한 Layer를 아래에서 위로 쌓는다</text>
<text data-source="root.0.1.0.0" x="88.000" y="355.750" font-size="28" font-weight="700" fill="#111827">Container Image Layers</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="449.900" font-size="28" font-weight="700" fill="#111827">Base Image</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="492.300" font-size="22" font-weight="400" fill="#111827">모든 상위 Layer의 시작점</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="449.900" font-size="28" font-weight="700" fill="#111827">Image Layer 1</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="492.300" font-size="22" font-weight="400" fill="#111827">첫 번째 명령의 결과</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="688.700" font-size="28" font-weight="700" fill="#111827">Image Layer 2</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="731.100" font-size="22" font-weight="400" fill="#111827">이전 Layer 위에 누적</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="688.700" font-size="28" font-weight="700" fill="#111827">Image Layer 3</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="731.100" font-size="22" font-weight="400" fill="#111827">최종 이미지의 상위 Layer</text>
<text data-source="root.0.1.0.1.1" x="438.000" y="411.550" font-size="22" font-weight="400" fill="#111827">변경분을 한 겹</text>
<text data-source="root.0.1.0.1.1" x="438.000" y="441.250" font-size="22" font-weight="400" fill="#111827">추가</text>
<text data-source="root.0.1.0.1.3" x="128.000" y="572.350" font-size="22" font-weight="400" fill="#111827">변경분을 한 겹 추가</text>
<text data-source="root.0.1.0.1.5" x="438.000" y="650.350" font-size="22" font-weight="400" fill="#111827">변경분을 한 겹</text>
<text data-source="root.0.1.0.1.5" x="438.000" y="680.050" font-size="22" font-weight="400" fill="#111827">추가</text>
<text data-source="root.0.1.1.0" x="996.000" y="355.750" font-size="28" font-weight="700" fill="#111827">Example Container Image</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="441.550" font-size="28" font-weight="700" fill="#111827">Base RHEL</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="483.950" font-size="22" font-weight="400" fill="#111827">실행 환경의 기본 OS</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="441.550" font-size="28" font-weight="700" fill="#111827">OS Update Layer</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="483.950" font-size="22" font-weight="400" fill="#111827">업데이트된 OS 패키지</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="672.000" font-size="28" font-weight="700" fill="#111827">Java Runtime Layer</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="714.400" font-size="22" font-weight="400" fill="#111827">애플리케이션 실행 runtime</text>
<text data-source="root.0.1.1.1.6" x="1510.000" y="672.000" font-size="28" font-weight="700" fill="#111827">Application Layer</text>
<text data-source="root.0.1.1.1.6" x="1510.000" y="714.400" font-size="22" font-weight="400" fill="#111827">변경이 잦은 최상위 내용</text>
<text data-source="root.0.1.1.1.1" x="1346.000" y="432.900" font-size="22" font-weight="400" fill="#111827">OS 변경</text>
<text data-source="root.0.1.1.1.3" x="1036.000" y="555.650" font-size="22" font-weight="400" fill="#111827">runtime 추가</text>
