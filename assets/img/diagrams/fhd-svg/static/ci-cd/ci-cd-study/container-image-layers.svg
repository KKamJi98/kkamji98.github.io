<text data-source="root.0.1.1.1.5" x="1346.000" y="663.350" font-size="22" font-weight="400" fill="#111827">추가</text>
<text data-source="root.0.2" x="64.000" y="841.150" font-size="22" font-weight="400" fill="#111827">하위 Layer가 바뀌지 않으면 cache와 재사용이 가능합니다. Dockerfile 명령에서 바뀐 지점 이후의 Layer만 다시 생성됩니다.</text>
