<text data-source="root.0.0" x="64.000" y="147.300" font-size="36" font-weight="700" fill="#111827">Jenkins CI와 GitOps 확장 설계</text>
<text data-source="root.0.1.0" x="116.000" y="234.800" font-size="24" font-weight="700" fill="#111827">개발팀 Repo</text>
<text data-source="root.0.1.0" x="116.000" y="274.000" font-size="20" font-weight="400" fill="#111827">애플리케이션 source code</text>
<text data-source="root.0.1.2" x="1052.000" y="234.800" font-size="24" font-weight="700" fill="#111827">CI server (Jenkins)</text>
<text data-source="root.0.1.2" x="1052.000" y="274.000" font-size="20" font-weight="400" fill="#111827">실습 Jenkinsfile: source checkout과 image build/push</text>
<text data-source="root.0.1.1" x="892.000" y="199.900" font-size="20" font-weight="400" fill="#111827">source</text>
<text data-source="root.0.1.1" x="892.000" y="226.900" font-size="20" font-weight="400" fill="#111827">checkout</text>
<text data-source="root.0.2.0.0" x="84.000" y="375.900" font-size="24" font-weight="700" fill="#111827">Container image path</text>
<text data-source="root.0.2.0.2.0" x="160.000" y="593.900" font-size="24" font-weight="700" fill="#111827">Build container image</text>
<text data-source="root.0.2.0.2.0" x="160.000" y="633.100" font-size="20" font-weight="400" fill="#111827">CI 결과물을 배포 가능한</text>
<text data-source="root.0.2.0.2.0" x="160.000" y="660.100" font-size="20" font-weight="400" fill="#111827">이미지로 생성</text>
<text data-source="root.0.2.0.2.2" x="599.000" y="578.300" font-size="24" font-weight="700" fill="#111827">Container</text>
<text data-source="root.0.2.0.2.2" x="599.000" y="609.500" font-size="24" font-weight="700" fill="#111827">image registry</text>
<text data-source="root.0.2.0.2.2" x="599.000" y="648.700" font-size="20" font-weight="400" fill="#111827">Kubernetes가 가져갈</text>
<text data-source="root.0.2.0.2.2" x="599.000" y="675.700" font-size="20" font-weight="400" fill="#111827">이미지 저장소</text>
<text data-source="root.0.2.0.2.1" x="439.000" y="599.500" font-size="20" font-weight="400" fill="#111827">이미지 업로드</text>
<text data-source="root.0.2.0.1" x="527.000" y="440.300" font-size="20" font-weight="400" fill="#111827">CI server (Jenkins) -&gt; Container image</text>
<text data-source="root.0.2.0.1" x="527.000" y="467.300" font-size="20" font-weight="400" fill="#111827">registry: image push</text>
<text data-source="root.0.2.1.0" x="990.000" y="375.900" font-size="24" font-weight="700" fill="#111827">GitOps 확장 예시 (실습 미구현)</text>
<text data-source="root.0.2.1.2.0" x="1066.000" y="551.300" font-size="24" font-weight="700" fill="#111827">DevOps팀 Repo</text>
<text data-source="root.0.2.1.2.0" x="1066.000" y="590.500" font-size="20" font-weight="400" fill="#111827">Kubernetes manifest 변경을</text>
<text data-source="root.0.2.1.2.0" x="1066.000" y="617.500" font-size="20" font-weight="400" fill="#111827">보관</text>
<text data-source="root.0.2.1.2.2" x="1505.000" y="551.300" font-size="24" font-weight="700" fill="#111827">CD server (Argo CD)</text>
<text data-source="root.0.2.1.2.2" x="1505.000" y="590.500" font-size="20" font-weight="400" fill="#111827">Repo의 desired state를</text>
<text data-source="root.0.2.1.2.2" x="1505.000" y="617.500" font-size="20" font-weight="400" fill="#111827">동기화</text>
<text data-source="root.0.2.1.2.4" x="1066.000" y="784.500" font-size="24" font-weight="700" fill="#111827">K8S (kind)</text>
<text data-source="root.0.2.1.2.4" x="1066.000" y="823.700" font-size="20" font-weight="400" fill="#111827">manifest를 적용하고</text>
<text data-source="root.0.2.1.2.4" x="1066.000" y="850.700" font-size="20" font-weight="400" fill="#111827">registry에서 image를 pull</text>
<text data-source="root.0.2.1.2.1" x="1345.000" y="556.900" font-size="20" font-weight="400" fill="#111827">manifest 감시</text>
<text data-source="root.0.2.1.1" x="1433.000" y="440.300" font-size="20" font-weight="400" fill="#111827">별도 manifest-update 자동화를 추가한 경우</text>
<text data-source="root.0.3" x="64.000" y="961.700" font-size="20" font-weight="400" fill="#111827">본문 실습은 image push 후 운영자가 kubectl set image로 0.0.3을 적용합니다. 오른쪽 GitOps 경로는 별도 확장 설계이며, 제시된 Jenkinsfile에는 manifest 갱신이나 Argo CD 연동이 없습니다.</text>
<text data-source="root.0.2.1.2.3" x="1046.000" y="672.500" font-size="20" font-weight="400" fill="#111827">Argo CD -&gt; K8S: sync (삭제는 prune 설정 시)</text>
<text data-source="root.0.2.1.2.3" x="579.000" y="789.100" font-size="20" font-weight="400" fill="#111827">Container image registry -&gt; K8S:</text>
<text data-source="root.0.2.1.2.3" x="579.000" y="816.100" font-size="20" font-weight="400" fill="#111827">image pull</text>
