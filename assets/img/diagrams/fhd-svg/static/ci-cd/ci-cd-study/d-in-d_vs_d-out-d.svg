<rect data-node="root.0.1.1.1.4" x="1022.000" y="481.400" width="319.000" height="137.200" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.1.1.6" x="1485.000" y="465.800" width="319.000" height="168.400" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect data-node="root.0.1.1.1.8" x="1022.000" y="766.000" width="319.000" height="137.200" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<path data-edge="root.0.1.0.1.1" data-from="root.0.1.0.1.0" data-to="root.0.1.0.1.2" d="M 447.000 316.800 L 567.000 316.800" fill="none" stroke="#475569" stroke-width="3"><title>같은 Docker network에 배치</title></path>
<polygon data-arrowhead="root.0.1.0.1.1" points="567.000,316.800 557.000,322.800 557.000,310.800" fill="#475569"/>
<path data-edge="root.0.1.0.1.3" data-from="root.0.1.0.1.2" data-to="root.0.1.0.1.4" d="M 910.000 316.800 L 922.000 316.800 L 922.000 457.800 L 92.000 457.800 L 92.000 574.400 L 104.000 574.400" fill="none" stroke="#475569" stroke-width="3"><title>TCP TLS: docker:2376</title></path>
<polygon data-arrowhead="root.0.1.0.1.3" points="104.000,574.400 94.000,580.400 94.000,568.400" fill="#475569"/>
<path data-edge="root.0.1.0.1.5" data-from="root.0.1.0.1.4" data-to="root.0.1.0.1.6" d="M 447.000 574.400 L 567.000 574.400" fill="none" stroke="#475569" stroke-width="3"><title>docker run</title></path>
<polygon data-arrowhead="root.0.1.0.1.5" points="567.000,574.400 557.000,580.400 557.000,568.400" fill="#475569"/>
<path data-edge="root.0.1.1.1.1" data-from="root.0.1.1.1.0" data-to="root.0.1.1.1.2" d="M 1353.000 278.900 L 1473.000 278.900" fill="none" stroke="#475569" stroke-width="3"><title>Jenkins 실행</title></path>
<polygon data-arrowhead="root.0.1.1.1.1" points="1473.000,278.900 1463.000,284.900 1463.000,272.900" fill="#475569"/>
<path data-edge="root.0.1.1.1.3" data-from="root.0.1.1.1.2" data-to="root.0.1.1.1.4" d="M 1816.000 278.900 L 1828.000 278.900 L 1828.000 382.000 L 998.000 382.000 L 998.000 550.000 L 1010.000 550.000" fill="none" stroke="#475569" stroke-width="3"><title>Unix socket 전달</title></path>
<polygon data-arrowhead="root.0.1.1.1.3" points="1010.000,550.000 1000.000,556.000 1000.000,544.000" fill="#475569"/>
<path data-edge="root.0.1.1.1.5" data-from="root.0.1.1.1.4" data-to="root.0.1.1.1.6" d="M 1353.000 550.000 L 1473.000 550.000" fill="none" stroke="#475569" stroke-width="3"><title>호스트 daemon에 build / run 요청</title></path>
<polygon data-arrowhead="root.0.1.1.1.5" points="1473.000,550.000 1463.000,556.000 1463.000,544.000" fill="#475569"/>
<path data-edge="root.0.1.1.1.7" data-from="root.0.1.1.1.6" data-to="root.0.1.1.1.8" d="M 1816.000 550.000 L 1828.000 550.000 L 1828.000 718.000 L 998.000 718.000 L 998.000 834.600 L 1010.000 834.600" fill="none" stroke="#475569" stroke-width="3"><title>결과 실행</title></path>
<polygon data-arrowhead="root.0.1.1.1.7" points="1010.000,834.600 1000.000,840.600 1000.000,828.600" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="118.800" font-size="36" font-weight="700" fill="#111827">DinD와 DooD는 Docker daemon의 경계와 권한이 다릅니다</text>
<text data-source="root.0.1.0.0" x="84.000" y="195.400" font-size="24" font-weight="700" fill="#111827">Docker in Docker (DinD)</text>
<text data-source="root.0.1.0.1.0" x="136.000" y="292.200" font-size="24" font-weight="700" fill="#111827">Host</text>
<text data-source="root.0.1.0.1.0" x="136.000" y="331.400" font-size="20" font-weight="400" fill="#111827">Jenkins와 DinD를 sibling</text>
<text data-source="root.0.1.0.1.0" x="136.000" y="358.400" font-size="20" font-weight="400" fill="#111827">container로 실행</text>
<text data-source="root.0.1.0.1.2" x="599.000" y="292.200" font-size="24" font-weight="700" fill="#111827">Jenkins Container</text>
<text data-source="root.0.1.0.1.2" x="599.000" y="331.400" font-size="20" font-weight="400" fill="#111827">Docker CLI가 별도 DinD</text>
<text data-source="root.0.1.0.1.2" x="599.000" y="358.400" font-size="20" font-weight="400" fill="#111827">daemon에 연결</text>
<text data-source="root.0.1.0.1.4" x="136.000" y="549.800" font-size="24" font-weight="700" fill="#111827">DinD Container</text>
<text data-source="root.0.1.0.1.4" x="136.000" y="589.000" font-size="20" font-weight="400" fill="#111827">docker:dind 안의 daemon,</text>
<text data-source="root.0.1.0.1.4" x="136.000" y="616.000" font-size="20" font-weight="400" fill="#111827">privileged 실행</text>
<text data-source="root.0.1.0.1.6" x="599.000" y="549.800" font-size="24" font-weight="700" fill="#111827">Inner Container</text>
<text data-source="root.0.1.0.1.6" x="599.000" y="589.000" font-size="20" font-weight="400" fill="#111827">DinD daemon이 이미지를</text>
<text data-source="root.0.1.0.1.6" x="599.000" y="616.000" font-size="20" font-weight="400" fill="#111827">사용해 실행한 컨테이너</text>
<text data-source="root.0.1.0.1.1" x="439.000" y="243.800" font-size="20" font-weight="400" fill="#111827">같은 Docker</text>
<text data-source="root.0.1.0.1.1" x="439.000" y="270.800" font-size="20" font-weight="400" fill="#111827">network에</text>
<text data-source="root.0.1.0.1.1" x="439.000" y="297.800" font-size="20" font-weight="400" fill="#111827">배치</text>
<text data-source="root.0.1.0.1.3" x="124.000" y="449.800" font-size="20" font-weight="400" fill="#111827">TCP TLS: docker:2376</text>
<text data-source="root.0.1.0.1.5" x="439.000" y="555.400" font-size="20" font-weight="400" fill="#111827">docker run</text>
<text data-source="root.0.1.0.2" x="84.000" y="683.000" font-size="20" font-weight="400" fill="#111827">Jenkins 공식 Docker 설치 예시의 구성입니다. build는 이미지를 만들고 run은 컨테이너를</text>
<text data-source="root.0.1.0.2" x="84.000" y="710.000" font-size="20" font-weight="400" fill="#111827">실행합니다. privileged 권한은 호스트 경계를 약화할 수 있습니다.</text>
<text data-source="root.0.1.1.0" x="990.000" y="195.400" font-size="24" font-weight="700" fill="#111827">Docker out of Docker (DooD)</text>
<text data-source="root.0.1.1.1.0" x="1042.000" y="267.800" font-size="24" font-weight="700" fill="#111827">Host</text>
<text data-source="root.0.1.1.1.0" x="1042.000" y="307.000" font-size="20" font-weight="400" fill="#111827">공유 Docker daemon을 실행</text>
<text data-source="root.0.1.1.1.2" x="1505.000" y="267.800" font-size="24" font-weight="700" fill="#111827">Jenkins Container</text>
<text data-source="root.0.1.1.1.2" x="1505.000" y="307.000" font-size="20" font-weight="400" fill="#111827">user: jenkins, group: docker</text>
<text data-source="root.0.1.1.1.4" x="1042.000" y="525.400" font-size="24" font-weight="700" fill="#111827">Docker Client</text>
<text data-source="root.0.1.1.1.4" x="1042.000" y="564.600" font-size="20" font-weight="400" fill="#111827">/var/run/docker.sock으로</text>
<text data-source="root.0.1.1.1.4" x="1042.000" y="591.600" font-size="20" font-weight="400" fill="#111827">요청</text>
<text data-source="root.0.1.1.1.6" x="1505.000" y="509.800" font-size="24" font-weight="700" fill="#111827">Host Docker</text>
<text data-source="root.0.1.1.1.6" x="1505.000" y="541.000" font-size="24" font-weight="700" fill="#111827">daemon</text>
<text data-source="root.0.1.1.1.6" x="1505.000" y="580.200" font-size="20" font-weight="400" fill="#111827">이미지 build와 sibling</text>
<text data-source="root.0.1.1.1.6" x="1505.000" y="607.200" font-size="20" font-weight="400" fill="#111827">container 실행을 처리</text>
<text data-source="root.0.1.1.1.8" x="1042.000" y="810.000" font-size="24" font-weight="700" fill="#111827">Sibling Container</text>
<text data-source="root.0.1.1.1.8" x="1042.000" y="849.200" font-size="20" font-weight="400" fill="#111827">Jenkins와 같은 호스트</text>
<text data-source="root.0.1.1.1.8" x="1042.000" y="876.200" font-size="20" font-weight="400" fill="#111827">daemon의 결과물</text>
<text data-source="root.0.1.1.1.1" x="1345.000" y="259.900" font-size="20" font-weight="400" fill="#111827">Jenkins 실행</text>
<text data-source="root.0.1.1.1.3" x="1030.000" y="374.000" font-size="20" font-weight="400" fill="#111827">Unix socket 전달</text>
<text data-source="root.0.1.1.1.5" x="1345.000" y="450.000" font-size="20" font-weight="400" fill="#111827">호스트</text>
<text data-source="root.0.1.1.1.5" x="1345.000" y="477.000" font-size="20" font-weight="400" fill="#111827">daemon에</text>
<text data-source="root.0.1.1.1.5" x="1345.000" y="504.000" font-size="20" font-weight="400" fill="#111827">build / run</text>
<text data-source="root.0.1.1.1.5" x="1345.000" y="531.000" font-size="20" font-weight="400" fill="#111827">요청</text>
<text data-source="root.0.1.1.1.7" x="1030.000" y="710.000" font-size="20" font-weight="400" fill="#111827">결과 실행</text>
<text data-source="root.0.1.1.2" x="990.000" y="943.200" font-size="20" font-weight="400" fill="#111827">중첩 daemon은 없지만 socket 접근이 호스트 Docker 권한으로 이어지므로 접근</text>
<text data-source="root.0.1.1.2" x="990.000" y="970.200" font-size="20" font-weight="400" fill="#111827">통제가 필요합니다.</text>
</svg>
