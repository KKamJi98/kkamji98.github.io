<text data-source="root.0.1.1.3.1.1" x="1040.000" y="699.150" font-size="18" font-weight="400" fill="#111827">일반 실행 stage: steps 안에 step DSL</text>
<text data-source="root.0.1.1.3.2.0" x="1024.000" y="789.450" font-size="20" font-weight="700" fill="#111827">post</text>
<text data-source="root.0.1.1.3.2.1" x="1024.000" y="830.450" font-size="18" font-weight="400" fill="#111827">pipeline-level post actions</text>
<text data-source="root.0.1.1.4" x="984.000" y="910.750" font-size="18" font-weight="400" fill="#111827">Declarative stage는 steps, stages, parallel, matrix 중 정확히 하나를 포함합니다. steps는 일반 실행 stage의</text>
<text data-source="root.0.1.1.4" x="984.000" y="935.050" font-size="18" font-weight="400" fill="#111827">형태입니다.</text>
