<text data-source="root.0.1.0.1" x="96.000" y="282.250" font-size="20" font-weight="700" fill="#111827">Node</text>
<text data-source="root.0.1.0.1" x="96.000" y="318.250" font-size="18" font-weight="400" fill="#111827">실행할 agent와 imperative 흐름</text>
<text data-source="root.0.1.0.3.0.0" x="120.000" y="488.850" font-size="20" font-weight="700" fill="#111827">Stage: Build</text>
