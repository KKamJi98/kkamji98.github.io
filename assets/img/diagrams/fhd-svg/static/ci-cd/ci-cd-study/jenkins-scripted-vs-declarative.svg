<text data-source="root.0.1.0.4" x="80.000" y="865.450" font-size="18" font-weight="400" fill="#111827">그림은 node 안에 흐름을 작성한 Scripted 예시입니다. stage block은 선택 사항입니다.</text>
<text data-source="root.0.1.0.2" x="528.000" y="390.550" font-size="18" font-weight="400" fill="#111827">stage blocks</text>
<text data-source="root.0.1.1.0" x="984.000" y="223.250" font-size="20" font-weight="700" fill="#111827">Declarative</text>
<text data-source="root.0.1.1.1" x="1000.000" y="282.250" font-size="20" font-weight="700" fill="#111827">pipeline</text>
<text data-source="root.0.1.1.1" x="1000.000" y="318.250" font-size="18" font-weight="400" fill="#111827">검증 가능한 선언형 root</text>
<text data-source="root.0.1.1.3.0.0" x="1024.000" y="488.850" font-size="20" font-weight="700" fill="#111827">Top-level directives</text>
<text data-source="root.0.1.1.3.0.1" x="1024.000" y="529.850" font-size="18" font-weight="400" fill="#111827">agent, environment, tools, options, triggers, parameters, libraries</text>
