<text data-source="root.0.1.0.3.0.1.2" x="596.000" y="583.850" font-size="18" font-weight="400" fill="#111827">추가 작업</text>
<text data-source="root.0.1.0.3.1.0" x="120.000" y="674.150" font-size="20" font-weight="700" fill="#111827">Stage: Test</text>
<text data-source="root.0.1.0.3.1.1.0" x="168.000" y="733.150" font-size="20" font-weight="700" fill="#111827">Step</text>
<text data-source="root.0.1.0.3.1.1.0" x="168.000" y="769.150" font-size="18" font-weight="400" fill="#111827">test 작업</text>
