<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 432.000 549.450 L 552.000 549.450" fill="none" stroke="#475569" stroke-width="3"><title>VaultAuth로 인증</title></path>
<polygon data-arrowhead="root.0.1.1" points="552.000,549.450 542.000,555.450 542.000,543.450" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 900.000 549.450 L 1020.000 549.450" fill="none" stroke="#475569" stroke-width="3"><title>Kubernetes Secret 생성 또는 갱신</title></path>
<polygon data-arrowhead="root.0.1.3" points="1020.000,549.450 1010.000,555.450 1010.000,543.450" fill="#475569"/>
<path data-edge="root.0.1.5" data-from="root.0.1.4" data-to="root.0.1.6" d="M 1368.000 549.450 L 1488.000 549.450" fill="none" stroke="#475569" stroke-width="3"><title>Secret mount</title></path>
<polygon data-arrowhead="root.0.1.5" points="1488.000,549.450 1478.000,555.450 1478.000,543.450" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="398.550" font-size="36" font-weight="700" fill="#111827">Static Secret은 Vault의 KV 값을 VSO가 app namespace로 주기적으로 복사합니다</text>
<text data-source="root.0.1.0" x="120.000" y="505.350" font-size="28" font-weight="700" fill="#111827">Vault Namespace /</text>
<text data-source="root.0.1.0" x="120.000" y="541.750" font-size="28" font-weight="700" fill="#111827">Vault</text>
<text data-source="root.0.1.0" x="120.000" y="584.150" font-size="22" font-weight="400" fill="#111827">KV v2 webapp/config에 고정</text>
<text data-source="root.0.1.0" x="120.000" y="613.850" font-size="22" font-weight="400" fill="#111827">secret을 저장합니다.</text>
<text data-source="root.0.1.2" x="588.000" y="487.150" font-size="28" font-weight="700" fill="#111827">Operator Namespace</text>
<text data-source="root.0.1.2" x="588.000" y="523.550" font-size="28" font-weight="700" fill="#111827">/ Vault Secrets</text>
<text data-source="root.0.1.2" x="588.000" y="559.950" font-size="28" font-weight="700" fill="#111827">Operator</text>
<text data-source="root.0.1.2" x="588.000" y="602.350" font-size="22" font-weight="400" fill="#111827">VaultStaticSecret CRD로</text>
<text data-source="root.0.1.2" x="588.000" y="632.050" font-size="22" font-weight="400" fill="#111827">Vault 값을 조회합니다.</text>
<text data-source="root.0.1.4" x="1056.000" y="505.350" font-size="28" font-weight="700" fill="#111827">App Namespace /</text>
<text data-source="root.0.1.4" x="1056.000" y="541.750" font-size="28" font-weight="700" fill="#111827">secretkv</text>
<text data-source="root.0.1.4" x="1056.000" y="584.150" font-size="22" font-weight="400" fill="#111827">VSO가 만든 Kubernetes</text>
<text data-source="root.0.1.4" x="1056.000" y="613.850" font-size="22" font-weight="400" fill="#111827">Secret destination</text>
<text data-source="root.0.1.6" x="1524.000" y="523.550" font-size="28" font-weight="700" fill="#111827">Pod / App</text>
<text data-source="root.0.1.6" x="1524.000" y="565.950" font-size="22" font-weight="400" fill="#111827">애플리케이션이 namespace</text>
<text data-source="root.0.1.6" x="1524.000" y="595.650" font-size="22" font-weight="400" fill="#111827">Secret을 사용합니다.</text>
<text data-source="root.0.1.1" x="424.000" y="500.050" font-size="22" font-weight="400" fill="#111827">VaultAuth로</text>
<text data-source="root.0.1.1" x="424.000" y="529.750" font-size="22" font-weight="400" fill="#111827">인증</text>
<text data-source="root.0.1.3" x="892.000" y="470.350" font-size="22" font-weight="400" fill="#111827">Kubernetes</text>
<text data-source="root.0.1.3" x="892.000" y="500.050" font-size="22" font-weight="400" fill="#111827">Secret 생성</text>
<text data-source="root.0.1.3" x="892.000" y="529.750" font-size="22" font-weight="400" fill="#111827">또는 갱신</text>
<text data-source="root.0.1.5" x="1360.000" y="529.750" font-size="22" font-weight="400" fill="#111827">Secret mount</text>
<text data-source="root.0.2" x="64.000" y="709.750" font-size="22" font-weight="400" fill="#111827">refreshAfter: 30s 주기로 Vault를 다시 읽어 Kubernetes Secret을 최신 값으로 유지합니다. Kubernetes Auth에서는 TokenReview로 ServiceAccount token을 검증합니다.</text>
</svg>
