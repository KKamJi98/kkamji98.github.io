<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="6af0599e693557c66414ce28793159ba05cc999e905e4347a05dcbe8ddf8ad06">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
