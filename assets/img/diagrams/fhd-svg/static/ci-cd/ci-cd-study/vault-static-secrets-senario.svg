<polygon data-arrowhead="root.0.1.5" points="1491.361,549.450 1481.361,555.450 1481.361,543.450" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="380.350" font-size="36" font-weight="700" fill="#111827">Static Secret은 Vault의 KV 값을 VSO가 app namespace로 주기적으로 복사합니다</text>
<text data-source="root.0.1.0" x="120.000" y="505.350" font-size="28" font-weight="700" fill="#111827">Vault Namespace</text>
<text data-source="root.0.1.0" x="120.000" y="541.750" font-size="28" font-weight="700" fill="#111827">/ Vault</text>
<text data-source="root.0.1.0" x="120.000" y="584.150" font-size="22" font-weight="400" fill="#111827">KV v2 webapp/config에</text>
<text data-source="root.0.1.0" x="120.000" y="613.850" font-size="22" font-weight="400" fill="#111827">고정 secret을 저장합니다.</text>
<text data-source="root.0.1.2" x="589.120" y="468.950" font-size="28" font-weight="700" fill="#111827">Operator</text>
<text data-source="root.0.1.2" x="589.120" y="505.350" font-size="28" font-weight="700" fill="#111827">Namespace /</text>
<text data-source="root.0.1.2" x="589.120" y="541.750" font-size="28" font-weight="700" fill="#111827">Vault Secrets</text>
<text data-source="root.0.1.2" x="589.120" y="578.150" font-size="28" font-weight="700" fill="#111827">Operator</text>
<text data-source="root.0.1.2" x="589.120" y="620.550" font-size="22" font-weight="400" fill="#111827">VaultStaticSecret CRD로</text>
<text data-source="root.0.1.2" x="589.120" y="650.250" font-size="22" font-weight="400" fill="#111827">Vault 값을 조회합니다.</text>
<text data-source="root.0.1.4" x="1058.241" y="505.350" font-size="28" font-weight="700" fill="#111827">App Namespace</text>
<text data-source="root.0.1.4" x="1058.241" y="541.750" font-size="28" font-weight="700" fill="#111827">/ secretkv</text>
<text data-source="root.0.1.4" x="1058.241" y="584.150" font-size="22" font-weight="400" fill="#111827">VSO가 만든 Kubernetes</text>
<text data-source="root.0.1.4" x="1058.241" y="613.850" font-size="22" font-weight="400" fill="#111827">Secret destination</text>
<text data-source="root.0.1.6" x="1527.361" y="508.700" font-size="28" font-weight="700" fill="#111827">Pod / App</text>
<text data-source="root.0.1.6" x="1527.361" y="551.100" font-size="22" font-weight="400" fill="#111827">애플리케이션이</text>
<text data-source="root.0.1.6" x="1527.361" y="580.800" font-size="22" font-weight="400" fill="#111827">namespace Secret을</text>
<text data-source="root.0.1.6" x="1527.361" y="610.500" font-size="22" font-weight="400" fill="#111827">사용합니다.</text>
<text data-source="root.0.1.1" x="420.639" y="500.050" font-size="22" font-weight="400" fill="#111827">VaultAuth로</text>
<text data-source="root.0.1.1" x="420.639" y="529.750" font-size="22" font-weight="400" fill="#111827">인증</text>
<text data-source="root.0.1.3" x="889.759" y="470.350" font-size="22" font-weight="400" fill="#111827">Kubernetes</text>
<text data-source="root.0.1.3" x="889.759" y="500.050" font-size="22" font-weight="400" fill="#111827">Secret 생성</text>
<text data-source="root.0.1.3" x="889.759" y="529.750" font-size="22" font-weight="400" fill="#111827">또는 갱신</text>
<text data-source="root.0.1.5" x="1358.880" y="500.050" font-size="22" font-weight="400" fill="#111827">Secret</text>
<text data-source="root.0.1.5" x="1358.880" y="529.750" font-size="22" font-weight="400" fill="#111827">mount</text>
<text data-source="root.0.2" x="64.000" y="727.950" font-size="22" font-weight="400" fill="#111827">refreshAfter: 30s 주기로 Vault를 다시 읽어 Kubernetes Secret을 최신 값으로 유지합니다. Kubernetes Auth에서는 TokenReview로 ServiceAccount token을 검증합니다.</text>
</svg>
