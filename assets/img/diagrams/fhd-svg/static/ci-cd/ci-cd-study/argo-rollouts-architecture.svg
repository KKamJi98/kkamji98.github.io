<path data-edge="root.0.1.0.1.0.1.1" data-from="root.0.1.0.1.0.1.0" data-to="root.0.1.0.1.0.1.2" d="M 299.000 420.600 L 299.000 549.600" fill="none" stroke="#475569" stroke-width="3"><title>Controller가 Rollout spec을 watch</title></path>
