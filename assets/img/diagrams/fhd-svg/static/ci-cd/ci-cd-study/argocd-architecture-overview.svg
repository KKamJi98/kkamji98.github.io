<path data-edge="root.0.3" data-from="root.0.2" data-to="root.0.4" d="M 960.000 687.100 L 960.000 762.100" fill="none" stroke="#475569" stroke-width="3"><title>Controller가 선택된 Application destination에 적용</title></path>
<polygon data-arrowhead="root.0.3" points="960.000,762.100 954.000,752.100 966.000,752.100" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="132.500" font-size="36" font-weight="700" fill="#111827">Argo CD가 Git desired state를 여러 Kubernetes Cluster에 배포</text>
<text data-source="root.0.1.0" x="84.000" y="209.100" font-size="24" font-weight="700" fill="#111827">Git repository</text>
<text data-source="root.0.1.0" x="84.000" y="248.300" font-size="20" font-weight="400" fill="#111827">search와 guestbook desired state. Webhook은 API Server에 변경 알림</text>
<text data-source="root.0.1.1" x="990.000" y="209.100" font-size="24" font-weight="700" fill="#111827">User or CI/CD</text>
<text data-source="root.0.1.1" x="990.000" y="248.300" font-size="20" font-weight="400" fill="#111827">UI, CLI의 gRPC / REST 요청은 API Server가 수신</text>
<text data-source="root.0.2.0" x="84.000" y="339.300" font-size="24" font-weight="700" fill="#111827">Argo CD control plane</text>
<text data-source="root.0.2.1.0" x="104.000" y="411.700" font-size="24" font-weight="700" fill="#111827">API Server</text>
<text data-source="root.0.2.1.0" x="104.000" y="450.900" font-size="20" font-weight="400" fill="#111827">인증, 상태 조회, Sync/Rollback와 사용자 action 요청</text>
<text data-source="root.0.2.1.1" x="990.000" y="411.700" font-size="24" font-weight="700" fill="#111827">Repo Server</text>
<text data-source="root.0.2.1.1" x="990.000" y="450.900" font-size="20" font-weight="400" fill="#111827">Git revision과 path에서 manifest 생성</text>
<text data-source="root.0.2.2" x="84.000" y="517.900" font-size="20" font-weight="400" fill="#111827">Application Controller가 Repo Server에 manifest를 요청하고 반환된 desired state를 사용합니다.</text>
<text data-source="root.0.2.3" x="104.000" y="588.900" font-size="24" font-weight="700" fill="#111827">Application Controller</text>
<text data-source="root.0.2.3" x="104.000" y="628.100" font-size="20" font-weight="400" fill="#111827">live state와 비교. Sync 시 PreSync, Sync, PostSync hook과 manifest apply 수행</text>
<text data-source="root.0.4.0" x="84.000" y="818.100" font-size="24" font-weight="700" fill="#111827">dev</text>
<text data-source="root.0.4.1" x="688.000" y="818.100" font-size="24" font-weight="700" fill="#111827">staging</text>
<text data-source="root.0.4.2" x="1292.000" y="818.100" font-size="24" font-weight="700" fill="#111827">us-west-1</text>
<text data-source="root.0.4.3" x="84.000" y="909.300" font-size="24" font-weight="700" fill="#111827">us-central-1</text>
<text data-source="root.0.4.4" x="688.000" y="909.300" font-size="24" font-weight="700" fill="#111827">us-east-1</text>
<text data-source="root.0.5" x="64.000" y="976.500" font-size="20" font-weight="400" fill="#111827">Git 변경은 polling 또는 webhook으로 감지합니다. 자동 적용 여부는 sync policy에 따릅니다.</text>
<text data-source="root.0.3" x="980.000" y="731.100" font-size="20" font-weight="400" fill="#111827">Controller가 선택된 Application destination에 적용</text>
</svg>
