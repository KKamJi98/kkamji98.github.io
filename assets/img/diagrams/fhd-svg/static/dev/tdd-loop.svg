<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="1b5aedeffebb32e7f4058799970c8dee026162de648bab513e037a46d7640e55">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-node="root.0.2.0" x="96.000" y="510.400" width="324.000" height="185.500" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect data-node="root.0.2.2" x="564.000" y="510.400" width="324.000" height="185.500" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.2.4" x="1032.000" y="525.250" width="324.000" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.6" x="1500.000" y="525.250" width="324.000" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<path data-edge="root.0.2.1" data-from="root.0.2.0" data-to="root.0.2.2" d="M 432.000 603.150 L 552.000 603.150" fill="none" stroke="#475569" stroke-width="3"><title>실패를 확인</title></path>
<polygon data-arrowhead="root.0.2.1" points="552.000,603.150 542.000,609.150 542.000,597.150" fill="#475569"/>
<path data-edge="root.0.2.3" data-from="root.0.2.2" data-to="root.0.2.4" d="M 900.000 603.150 L 1020.000 603.150" fill="none" stroke="#475569" stroke-width="3"><title>동작을 유지하며 정리</title></path>
<polygon data-arrowhead="root.0.2.3" points="1020.000,603.150 1010.000,609.150 1010.000,597.150" fill="#475569"/>
<path data-edge="root.0.2.5" data-from="root.0.2.4" data-to="root.0.2.6" d="M 1368.000 603.150 L 1488.000 603.150" fill="none" stroke="#475569" stroke-width="3"><title>다음 behavior 선택</title></path>
<polygon data-arrowhead="root.0.2.5" points="1488.000,603.150 1478.000,609.150 1478.000,597.150" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="420.100" font-size="36" font-weight="700" fill="#111827">TDD는 동작 하나마다 RED-GREEN-REFACTOR를 반복합니다</text>
<text data-source="root.0.1" x="64.000" y="478.700" font-size="22" font-weight="400" fill="#111827">구현보다 테스트를 먼저 실행해 동작이 아직 없다는 실패를 확인한 뒤 가장 작은 변경을 추가합니다.</text>
<text data-source="root.0.2.0" x="120.000" y="562.400" font-size="28" font-weight="700" fill="#111827">RED</text>
<text data-source="root.0.2.0" x="120.000" y="604.800" font-size="22" font-weight="400" fill="#111827">다음 behavior 하나를</text>
<text data-source="root.0.2.0" x="120.000" y="634.500" font-size="22" font-weight="400" fill="#111827">검증하는 failing test를</text>
<text data-source="root.0.2.0" x="120.000" y="664.200" font-size="22" font-weight="400" fill="#111827">씁니다.</text>
<text data-source="root.0.2.2" x="588.000" y="562.400" font-size="28" font-weight="700" fill="#111827">GREEN</text>
<text data-source="root.0.2.2" x="588.000" y="604.800" font-size="22" font-weight="400" fill="#111827">테스트를 통과시키는 smallest</text>
<text data-source="root.0.2.2" x="588.000" y="634.500" font-size="22" font-weight="400" fill="#111827">implementation만</text>
<text data-source="root.0.2.2" x="588.000" y="664.200" font-size="22" font-weight="400" fill="#111827">추가합니다.</text>
<text data-source="root.0.2.4" x="1056.000" y="577.250" font-size="28" font-weight="700" fill="#111827">REFACTOR</text>
<text data-source="root.0.2.4" x="1056.000" y="619.650" font-size="22" font-weight="400" fill="#111827">tests stay green인 상태로</text>
<text data-source="root.0.2.4" x="1056.000" y="649.350" font-size="22" font-weight="400" fill="#111827">구조를 정리합니다.</text>
<text data-source="root.0.2.6" x="1524.000" y="577.250" font-size="28" font-weight="700" fill="#111827">Next behavior</text>
<text data-source="root.0.2.6" x="1524.000" y="619.650" font-size="22" font-weight="400" fill="#111827">새 테스트를 쓰며 다음 RED</text>
<text data-source="root.0.2.6" x="1524.000" y="649.350" font-size="22" font-weight="400" fill="#111827">단계로 돌아갑니다.</text>
<text data-source="root.0.2.1" x="424.000" y="583.450" font-size="22" font-weight="400" fill="#111827">실패를 확인</text>
<text data-source="root.0.2.3" x="892.000" y="553.750" font-size="22" font-weight="400" fill="#111827">동작을</text>
<text data-source="root.0.2.3" x="892.000" y="583.450" font-size="22" font-weight="400" fill="#111827">유지하며 정리</text>
<text data-source="root.0.2.5" x="1360.000" y="553.750" font-size="22" font-weight="400" fill="#111827">다음 behavior</text>
<text data-source="root.0.2.5" x="1360.000" y="583.450" font-size="22" font-weight="400" fill="#111827">선택</text>
</svg>
