<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="6757f942d17e48114a107857f07aa976dd52e8352be6faf178a3edf4a17f7b5c">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-source="root.0.1.4" x="564.000" y="358.750" width="792.000" height="566.500" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
