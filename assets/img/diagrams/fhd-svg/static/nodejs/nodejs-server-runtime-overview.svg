<rect data-node="root.0.1.4.2.0" x="576.000" y="462.250" width="768.000" height="81.000" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.1.4.2.2" x="576.000" y="623.250" width="768.000" height="81.000" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.4.2.4.0" x="600.000" y="808.250" width="354.000" height="81.000" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.4.2.4.1" x="966.000" y="808.250" width="354.000" height="81.000" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<path data-edge="root.0.1.4.2.1" data-from="root.0.1.4.2.0" data-to="root.0.1.4.2.2" d="M 960.000 555.250 L 960.000 611.250" fill="none" stroke="#475569" stroke-width="3"><title>callback 실행</title></path>
<polygon data-arrowhead="root.0.1.4.2.1" points="960.000,611.250 954.000,601.250 966.000,601.250" fill="#475569"/>
<path data-edge="root.0.1.4.2.3" data-from="root.0.1.4.2.2" data-to="root.0.1.4.2.4" d="M 960.000 716.250 L 960.000 772.250" fill="none" stroke="#475569" stroke-width="3"><title>workload 선택</title></path>
<polygon data-arrowhead="root.0.1.4.2.3" points="960.000,772.250 954.000,762.250 966.000,762.250" fill="#475569"/>
<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 900.000 222.250 L 1020.000 222.250" fill="none" stroke="#475569" stroke-width="3"><title>socket readiness</title></path>
<polygon data-arrowhead="root.0.1.1" points="1020.000,222.250 1010.000,228.250 1010.000,216.250" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 1428.000 274.750 L 1428.000 310.750 L 960.000 310.750 L 960.000 346.750" fill="none" stroke="#475569" stroke-width="3"><title>libuv가 process로 전달</title></path>
<polygon data-arrowhead="root.0.1.3" points="960.000,346.750 954.000,336.750 966.000,336.750" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="157.150" font-size="36" font-weight="700" fill="#111827">Application은 기다리지 않고 runtime이 I/O를 기다립니다</text>
<text data-source="root.0.1.0" x="108.000" y="211.750" font-size="18" font-weight="700" fill="#111827">Client</text>
<text data-source="root.0.1.0" x="108.000" y="245.150" font-size="16" font-weight="400" fill="#111827">HTTP request</text>
<text data-source="root.0.1.2" x="1044.000" y="211.750" font-size="18" font-weight="700" fill="#111827">OS I/O readiness</text>
<text data-source="root.0.1.2" x="1044.000" y="245.150" font-size="16" font-weight="400" fill="#111827">epoll 또는 kqueue가 준비 상태를 보고</text>
<text data-source="root.0.1.4.0" x="576.000" y="388.750" font-size="18" font-weight="700" fill="#111827">Node.js process</text>
<text data-source="root.0.1.4.1" x="576.000" y="423.050" font-size="16" font-weight="400" fill="#111827">외부 Process supervisor (systemd, PM2 또는 container runtime)가 이 process 경계의 restart와 종료를</text>
<text data-source="root.0.1.4.1" x="576.000" y="444.650" font-size="16" font-weight="400" fill="#111827">관리합니다.</text>
<text data-source="root.0.1.4.2.0" x="588.000" y="492.250" font-size="18" font-weight="700" fill="#111827">Node runtime</text>
<text data-source="root.0.1.4.2.0" x="588.000" y="525.650" font-size="16" font-weight="400" fill="#111827">libuv event loop + V8</text>
<text data-source="root.0.1.4.2.2" x="588.000" y="653.250" font-size="18" font-weight="700" fill="#111827">Application code</text>
<text data-source="root.0.1.4.2.2" x="588.000" y="686.650" font-size="16" font-weight="400" fill="#111827">한 JavaScript flow, I/O 대기로 thread를 붙잡지 않음</text>
<text data-source="root.0.1.4.2.4.0" x="612.000" y="838.250" font-size="18" font-weight="700" fill="#111827">I/O work</text>
<text data-source="root.0.1.4.2.4.0" x="612.000" y="871.650" font-size="16" font-weight="400" fill="#111827">완료 event가 loop로 돌아옴</text>
<text data-source="root.0.1.4.2.4.1" x="978.000" y="838.250" font-size="18" font-weight="700" fill="#111827">CPU-bound work</text>
<text data-source="root.0.1.4.2.4.1" x="978.000" y="871.650" font-size="16" font-weight="400" fill="#111827">single loop를 점유해 다른 connection을 지연</text>
<text data-source="root.0.1.4.2.1" x="980.000" y="588.450" font-size="16" font-weight="400" fill="#111827">callback 실행</text>
<text data-source="root.0.1.4.2.3" x="980.000" y="749.450" font-size="16" font-weight="400" fill="#111827">workload 선택</text>
<text data-source="root.0.1.1" x="892.000" y="204.650" font-size="16" font-weight="400" fill="#111827">socket readiness</text>
<text data-source="root.0.1.3" x="972.000" y="302.750" font-size="16" font-weight="400" fill="#111827">libuv가 process로 전달</text>
<text data-source="root.0.2" x="64.000" y="953.250" font-size="16" font-weight="400" fill="#111827">Node.js는 JavaScript language나 framework가 아니라 OS process에서 core API를 실행하는 runtime입니다. I/O와 CPU workload를 같은 비동기 처리로 가정하면 지연 원인을 놓칠 수 있습니다.</text>
</svg>
