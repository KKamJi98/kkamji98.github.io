<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="8c810cf4d69a463d23fd9679f50aeeaf08e200c59e371c013e8833f4aef920f5">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-source="root.0.2" x="64.000" y="271.050" width="1792.000" height="657.900" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.2.6" x="76.000" y="674.950" width="1768.000" height="81.000" rx="16" fill="none" stroke="#64748b" stroke-width="2"/>
<rect data-node="root.0.1" x="64.000" y="178.050" width="1792.000" height="81.000" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.1" x="76.000" y="319.350" width="1768.000" height="81.000" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.3" x="76.000" y="480.350" width="1768.000" height="81.000" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.2.6.0" x="76.000" y="674.950" width="878.000" height="81.000" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.6.1" x="966.000" y="674.950" width="878.000" height="81.000" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect data-node="root.0.2.8" x="76.000" y="835.950" width="1768.000" height="81.000" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<path data-edge="root.0.2.2" data-from="root.0.2.1" data-to="root.0.2.3" d="M 960.000 412.350 L 960.000 468.350" fill="none" stroke="#475569" stroke-width="3"><title>await</title></path>
<polygon data-arrowhead="root.0.2.2" points="960.000,468.350 954.000,458.350 966.000,458.350" fill="#475569"/>
<path data-edge="root.0.2.5" data-from="root.0.2.4" data-to="root.0.2.6" d="M 960.000 606.950 L 960.000 662.950" fill="none" stroke="#475569" stroke-width="3"><title>Promise settlement</title></path>
<polygon data-arrowhead="root.0.2.5" points="960.000,662.950 954.000,652.950 966.000,652.950" fill="#475569"/>
<path data-edge="root.0.2.7" data-from="root.0.2.6" data-to="root.0.2.8" d="M 960.000 767.950 L 960.000 823.950" fill="none" stroke="#475569" stroke-width="3"><title>동일 writer로 합류</title></path>
<polygon data-arrowhead="root.0.2.7" points="960.000,823.950 954.000,813.950 966.000,813.950" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="153.450" font-size="36" font-weight="700" fill="#111827">한 곳이 response를 소유하고 모든 실패가 그 경계를 통과합니다</text>
<text data-source="root.0.1" x="76.000" y="208.050" font-size="18" font-weight="700" fill="#111827">Client / request event</text>
<text data-source="root.0.1" x="76.000" y="241.450" font-size="16" font-weight="400" fill="#111827">HTTP server가 handleRequest() 호출</text>
<text data-source="root.0.2.0" x="76.000" y="301.050" font-size="18" font-weight="700" fill="#111827">Error boundary: response owner</text>
<text data-source="root.0.2.1" x="88.000" y="349.350" font-size="18" font-weight="700" fill="#111827">handleRequest()</text>
<text data-source="root.0.2.1" x="88.000" y="382.750" font-size="16" font-weight="400" fill="#111827">downstream 작업 조정</text>
<text data-source="root.0.2.3" x="88.000" y="510.350" font-size="18" font-weight="700" fill="#111827">fetchJson()</text>
<text data-source="root.0.2.3" x="88.000" y="543.750" font-size="16" font-weight="400" fill="#111827">Upstream HTTP service 요청. 완료 전 Promise pending</text>
<text data-source="root.0.2.4" x="76.000" y="589.350" font-size="16" font-weight="400" fill="#111827">취소 제어: timeout 또는 client disconnect가 AbortController의 AbortSignal을 fetchJson()에 전달해 downstream 작업을 중단합니다.</text>
<text data-source="root.0.2.6.0" x="88.000" y="704.950" font-size="18" font-weight="700" fill="#111827">fulfilled</text>
<text data-source="root.0.2.6.0" x="88.000" y="738.350" font-size="16" font-weight="400" fill="#111827">정상 body 직렬화</text>
<text data-source="root.0.2.6.1" x="978.000" y="704.950" font-size="18" font-weight="700" fill="#111827">rejected</text>
<text data-source="root.0.2.6.1" x="978.000" y="738.350" font-size="16" font-weight="400" fill="#111827">error boundary가 안전한 status와 body로 매핑</text>
<text data-source="root.0.2.8" x="88.000" y="865.950" font-size="18" font-weight="700" fill="#111827">writeResponse()</text>
<text data-source="root.0.2.8" x="88.000" y="899.350" font-size="16" font-weight="400" fill="#111827">성공과 실패를 쓰는 유일한 writer</text>
<text data-source="root.0.2.2" x="980.000" y="445.550" font-size="16" font-weight="400" fill="#111827">await</text>
<text data-source="root.0.2.5" x="980.000" y="640.150" font-size="16" font-weight="400" fill="#111827">Promise settlement</text>
<text data-source="root.0.2.7" x="980.000" y="801.150" font-size="16" font-weight="400" fill="#111827">동일 writer로 합류</text>
<text data-source="root.0.3" x="64.000" y="956.950" font-size="16" font-weight="400" fill="#111827">rejected Promise 자체는 HTTP response가 아닙니다. 연결이 종료됐다면 더 쓰지 않고 정리합니다. timeout/abort가 없으면 Promise와 socket이 pending으로 남을 수 있습니다.</text>
</svg>
