<text data-source="root.0.1.1" x="424.000" y="529.750" font-size="22" font-weight="400" fill="#111827">전 외부 호출</text>
<text data-source="root.0.1.3" x="892.000" y="529.750" font-size="22" font-weight="400" fill="#111827">receive 진입</text>
