<text data-source="root.0.1.4" x="1056.000" y="580.800" font-size="22" font-weight="400" fill="#111827">vault.balance &gt;= 1 ETH</text>
<text data-source="root.0.1.6" x="1524.000" y="523.550" font-size="28" font-weight="700" fill="#111827">withdraw again</text>
<text data-source="root.0.1.6" x="1524.000" y="565.950" font-size="22" font-weight="400" fill="#111827">nested call이 withdraw를</text>
<text data-source="root.0.1.6" x="1524.000" y="595.650" font-size="22" font-weight="400" fill="#111827">반복 호출</text>
