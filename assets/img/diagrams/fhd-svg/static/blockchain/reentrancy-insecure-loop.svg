<text data-source="root.0.0" x="64.000" y="434.950" font-size="36" font-weight="700" fill="#111827">balance를 지우기 전에 보내면 receive가 withdraw를 다시 부릅니다</text>
<text data-source="root.0.1.0" x="120.000" y="538.400" font-size="28" font-weight="700" fill="#111827">withdraw()</text>
<text data-source="root.0.1.0" x="120.000" y="580.800" font-size="22" font-weight="400" fill="#111827">balance가 아직 1 ETH</text>
