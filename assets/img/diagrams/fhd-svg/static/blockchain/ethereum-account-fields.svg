<text data-source="root.0.2" x="64.000" y="666.850" font-size="22" font-weight="400" fill="#111827">address는 Script 잠금 이름이 아니라 상태 트리에서 account object를 찾는 key입니다. 이번 랩은 codeHash와 storageRoot 바이트 자체는 덤프하지 않았습니다.</text>
