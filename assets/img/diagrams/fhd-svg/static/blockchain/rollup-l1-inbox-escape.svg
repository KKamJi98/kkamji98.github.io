<text data-source="root.0.0" x="64.000" y="441.450" font-size="36" font-weight="700" fill="#111827">L1 inbox 제출은 sequencer 검열을 피하는 탈출 경로입니다</text>
<text data-source="root.0.1.0" x="120.000" y="538.400" font-size="28" font-weight="700" fill="#111827">user</text>
<text data-source="root.0.1.0" x="120.000" y="580.800" font-size="22" font-weight="400" fill="#111827">sequencer RPC 우회</text>
<text data-source="root.0.1.2" x="744.000" y="538.400" font-size="28" font-weight="700" fill="#111827">L1 inbox</text>
<text data-source="root.0.1.2" x="744.000" y="580.800" font-size="22" font-weight="400" fill="#111827">포함될 때까지 대기</text>
<text data-source="root.0.1.4" x="1368.000" y="538.400" font-size="28" font-weight="700" fill="#111827">sequencer include</text>
<text data-source="root.0.1.4" x="1368.000" y="580.800" font-size="22" font-weight="400" fill="#111827">제한 시간 내 포함 또는 무효</text>
<text data-source="root.0.1.1" x="580.000" y="529.750" font-size="22" font-weight="400" fill="#111827">L1에 직접 제출</text>
<text data-source="root.0.1.3" x="1204.000" y="500.050" font-size="22" font-weight="400" fill="#111827">제한 시간 내</text>
<text data-source="root.0.1.3" x="1204.000" y="529.750" font-size="22" font-weight="400" fill="#111827">포함</text>
<text data-source="root.0.2" x="64.000" y="666.850" font-size="22" font-weight="400" fill="#111827">sequencer RPC가 침묵해도 L1 inbox 기록은 남고, sequencer는 제한 시간 안에 처리해야 합니다.</text>
