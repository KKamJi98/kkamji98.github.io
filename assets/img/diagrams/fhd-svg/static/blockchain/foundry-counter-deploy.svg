<text data-source="root.0.1.3" x="1204.000" y="529.750" font-size="22" font-weight="400" fill="#111827">call</text>
<text data-source="root.0.2" x="64.000" y="696.550" font-size="22" font-weight="400" fill="#111827">EOA의 code는 0x이고 Counter address에는 실행 bytecode가 있습니다. increment()가 storage 값을 0에서 1로 바꿉니다.</text>
