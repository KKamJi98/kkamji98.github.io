<text data-source="root.0.1.0" x="120.000" y="580.800" font-size="22" font-weight="400" fill="#111827">0xf39Fd6e5, code 0x</text>
<text data-source="root.0.1.2" x="744.000" y="538.400" font-size="28" font-weight="700" fill="#111827">Counter 0xe7f1725E</text>
<text data-source="root.0.1.2" x="744.000" y="580.800" font-size="22" font-weight="400" fill="#111827">bytecode at address, 964 hex</text>
<text data-source="root.0.1.4" x="1368.000" y="538.400" font-size="28" font-weight="700" fill="#111827">number storage</text>
<text data-source="root.0.1.4" x="1368.000" y="580.800" font-size="22" font-weight="400" fill="#111827">0 then increment to 1, gas 43482</text>
<text data-source="root.0.1.1" x="580.000" y="470.350" font-size="22" font-weight="400" fill="#111827">contract-</text>
<text data-source="root.0.1.1" x="580.000" y="500.050" font-size="22" font-weight="400" fill="#111827">creation</text>
