<text data-source="root.0.0" x="64.000" y="229.000" font-size="36" font-weight="700" fill="#111827">sibling hash를 합쳐 Merkle Root까지 올라갑니다</text>
<text data-source="root.0.1.0.0" x="112.000" y="341.600" font-size="28" font-weight="700" fill="#111827">검증 대상</text>
<text data-source="root.0.1.0.1" x="136.000" y="427.400" font-size="28" font-weight="700" fill="#111827">tx hash</text>
<text data-source="root.0.1.0.1" x="136.000" y="469.800" font-size="22" font-weight="400" fill="#111827">index 3, 32 bytes</text>
<text data-source="root.0.1.1.0" x="996.000" y="341.600" font-size="28" font-weight="700" fill="#111827">proof 입력</text>
<text data-source="root.0.1.1.1" x="1020.000" y="427.400" font-size="28" font-weight="700" fill="#111827">sibling hash</text>
<text data-source="root.0.1.1.1" x="1020.000" y="469.800" font-size="22" font-weight="400" fill="#111827">one hop on the proof</text>
<text data-source="root.0.3.0" x="144.000" y="735.200" font-size="28" font-weight="700" fill="#111827">parent hash</text>
<text data-source="root.0.3.0" x="144.000" y="777.600" font-size="22" font-weight="400" fill="#111827">hash(leaf || sibling)</text>
<text data-source="root.0.3.2" x="1056.000" y="735.200" font-size="28" font-weight="700" fill="#111827">Merkle Root</text>
<text data-source="root.0.3.2" x="1056.000" y="777.600" font-size="22" font-weight="400" fill="#111827">header에 이 값만 저장</text>
