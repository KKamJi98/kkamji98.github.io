<text data-source="root.0.4" x="64.000" y="879.300" font-size="22" font-weight="400" fill="#111827">6 transaction 예제는 sibling hash 3개, 96 bytes로 root를 대조합니다. 전체 transaction 목록을 들고 다니지 않아도 됩니다.</text>
<text data-source="root.0.2" x="980.000" y="611.500" font-size="22" font-weight="400" fill="#111827">leaf와 sibling을 concat 후 hash</text>
