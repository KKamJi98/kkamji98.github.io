<text data-source="root.0.1.6" x="1524.000" y="461.400" font-size="22" font-weight="400" fill="#111827">confirmations = 0</text>
<text data-source="root.0.1.8" x="120.000" y="667.650" font-size="28" font-weight="700" fill="#111827">block</text>
<text data-source="root.0.1.8" x="120.000" y="710.050" font-size="22" font-weight="400" fill="#111827">miner가 fee를 회수</text>
<text data-source="root.0.1.10" x="588.000" y="667.650" font-size="28" font-weight="700" fill="#111827">confirmed UTXOs</text>
<text data-source="root.0.1.10" x="588.000" y="710.050" font-size="22" font-weight="400" fill="#111827">새 output이 set에 추가</text>
