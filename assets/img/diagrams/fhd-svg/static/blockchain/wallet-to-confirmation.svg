<text data-source="root.0.2" x="64.000" y="796.100" font-size="22" font-weight="400" fill="#111827">mempool에서는 confirmation이 0이고 UI balance는 움직일 수 있지만, UTXO set은 block 편입 때까지 바뀌지 않습니다.</text>
