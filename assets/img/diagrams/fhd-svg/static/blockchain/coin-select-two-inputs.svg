<text data-source="root.0.0" x="64.000" y="135.700" font-size="36" font-weight="700" fill="#111827">coin selection은 UTXO를 통째로 입력으로 고릅니다</text>
<text data-source="root.0.1.0" x="108.000" y="236.300" font-size="24" font-weight="700" fill="#111827">UTXO 30</text>
<text data-source="root.0.1.0" x="108.000" y="275.500" font-size="20" font-weight="400" fill="#111827">selected</text>
<text data-source="root.0.1.1" x="990.000" y="236.300" font-size="24" font-weight="700" fill="#111827">UTXO 25</text>
<text data-source="root.0.1.1" x="990.000" y="275.500" font-size="20" font-weight="400" fill="#111827">selected</text>
<text data-source="root.0.3.0" x="140.000" y="493.500" font-size="24" font-weight="700" fill="#111827">selected inputs</text>
<text data-source="root.0.3.0" x="140.000" y="532.700" font-size="20" font-weight="400" fill="#111827">30 + 25가 필요한 금액과 fee를 충족</text>
<text data-source="root.0.3.2" x="1052.000" y="493.500" font-size="24" font-weight="700" fill="#111827">new transaction</text>
<text data-source="root.0.3.2" x="1052.000" y="532.700" font-size="20" font-weight="400" fill="#111827">vin[0]와 vin[1], 각 outpoint 전체 소비</text>
<text data-source="root.0.3.1" x="892.000" y="485.600" font-size="20" font-weight="400" fill="#111827">vin 생성</text>
<text data-source="root.0.5.0.0" x="108.000" y="750.700" font-size="24" font-weight="700" fill="#111827">payment</text>
<text data-source="root.0.5.0.1" x="128.000" y="823.100" font-size="24" font-weight="700" fill="#111827">vout payment</text>
<text data-source="root.0.5.0.1" x="128.000" y="862.300" font-size="20" font-weight="400" fill="#111827">recipient에게 보내는 금액</text>
<text data-source="root.0.5.1.0" x="990.000" y="750.700" font-size="24" font-weight="700" fill="#111827">change</text>
<text data-source="root.0.5.1.1" x="1010.000" y="823.100" font-size="24" font-weight="700" fill="#111827">vout change</text>
<text data-source="root.0.5.1.1" x="1010.000" y="862.300" font-size="20" font-weight="400" fill="#111827">remainder - fee, 새 outpoint</text>
<text data-source="root.0.6" x="64.000" y="973.300" font-size="20" font-weight="400" fill="#111827">선택하지 않은 UTXO는 그대로 남습니다. 30과 25는 coin selection 규칙을 설명하는 예시입니다.</text>
<text data-source="root.0.2" x="980.000" y="382.500" font-size="20" font-weight="400" fill="#111827">send + fee를 덮도록 선택</text>
<text data-source="root.0.4" x="980.000" y="639.700" font-size="20" font-weight="400" fill="#111827">새 vout 두 개로 분할</text>
