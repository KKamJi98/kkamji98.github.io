<text data-source="root.0.0" x="64.000" y="309.050" font-size="36" font-weight="700" fill="#111827">Software life cycle은 Operation의 피드백으로 다시 시작합니다</text>
<text data-source="root.0.1" x="64.000" y="367.650" font-size="22" font-weight="400" fill="#111827">각 phase가 다음 phase의 입력이 되고, production에서 얻은 관측이 다음 Requirements를 만듭니다.</text>
<text data-source="root.0.2.0" x="120.000" y="451.350" font-size="28" font-weight="700" fill="#111827">Requirements</text>
<text data-source="root.0.2.0" x="120.000" y="493.750" font-size="22" font-weight="400" fill="#111827">software가 해야 할 일을</text>
<text data-source="root.0.2.0" x="120.000" y="523.450" font-size="22" font-weight="400" fill="#111827">정의합니다.</text>
<text data-source="root.0.2.2" x="588.000" y="451.350" font-size="28" font-weight="700" fill="#111827">Design</text>
<text data-source="root.0.2.2" x="588.000" y="493.750" font-size="22" font-weight="400" fill="#111827">요구사항을 구현할 구조를</text>
<text data-source="root.0.2.2" x="588.000" y="523.450" font-size="22" font-weight="400" fill="#111827">정합니다.</text>
<text data-source="root.0.2.4" x="1056.000" y="451.350" font-size="28" font-weight="700" fill="#111827">Implementation</text>
<text data-source="root.0.2.4" x="1056.000" y="493.750" font-size="22" font-weight="400" fill="#111827">설계한 동작을 code로</text>
<text data-source="root.0.2.4" x="1056.000" y="523.450" font-size="22" font-weight="400" fill="#111827">만듭니다.</text>
<text data-source="root.0.2.6" x="1524.000" y="451.350" font-size="28" font-weight="700" fill="#111827">Testing</text>
<text data-source="root.0.2.6" x="1524.000" y="493.750" font-size="22" font-weight="400" fill="#111827">요청한 동작을 실제로</text>
<text data-source="root.0.2.6" x="1524.000" y="523.450" font-size="22" font-weight="400" fill="#111827">충족하는지 확인합니다.</text>
<text data-source="root.0.2.8" x="120.000" y="703.150" font-size="28" font-weight="700" fill="#111827">Operation</text>
<text data-source="root.0.2.8" x="120.000" y="745.550" font-size="22" font-weight="400" fill="#111827">운영 관측이 다음 cycle의</text>
<text data-source="root.0.2.8" x="120.000" y="775.250" font-size="22" font-weight="400" fill="#111827">입력이 됩니다.</text>
<text data-source="root.0.2.10" x="588.000" y="703.150" font-size="28" font-weight="700" fill="#111827">Next Requirements</text>
<text data-source="root.0.2.10" x="588.000" y="745.550" font-size="22" font-weight="400" fill="#111827">Operation에서 배운 내용을</text>
<text data-source="root.0.2.10" x="588.000" y="775.250" font-size="22" font-weight="400" fill="#111827">반영해 다시 시작합니다.</text>
<text data-source="root.0.2.1" x="424.000" y="457.550" font-size="22" font-weight="400" fill="#111827">구조 설계</text>
<text data-source="root.0.2.3" x="892.000" y="457.550" font-size="22" font-weight="400" fill="#111827">코드 작성</text>
<text data-source="root.0.2.5" x="1360.000" y="457.550" font-size="22" font-weight="400" fill="#111827">요구사항 검증</text>
<text data-source="root.0.2.7" x="104.000" y="595.150" font-size="22" font-weight="400" fill="#111827">production 배포</text>
<text data-source="root.0.2.9" x="424.000" y="679.650" font-size="22" font-weight="400" fill="#111827">production</text>
<text data-source="root.0.2.9" x="424.000" y="709.350" font-size="22" font-weight="400" fill="#111827">feedback</text>
