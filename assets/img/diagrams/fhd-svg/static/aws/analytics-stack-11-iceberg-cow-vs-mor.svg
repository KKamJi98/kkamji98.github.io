<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="ec65b8ac96e20aaf103c4b82b364b3bfa5fcbd91ef042bb01e03a136bc574f74">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-source="root.0.2.0" x="64.000" y="340.450" width="884.000" height="365.700" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.2.1" x="972.000" y="340.450" width="884.000" height="525.400" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.2.1.1" x="996.000" y="426.250" width="836.000" height="126.100" rx="16" fill="none" stroke="#64748b" stroke-width="2"/>
<rect data-node="root.0.2.0.1.0" x="120.000" y="464.300" width="314.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.0.1.2" x="578.000" y="464.300" width="314.000" height="126.100" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.2.1.1.0" x="996.000" y="426.250" width="406.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.1.1.1" x="1426.000" y="426.250" width="406.000" height="126.100" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect data-node="root.0.2.1.3" x="996.000" y="662.050" width="836.000" height="126.100" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<path data-edge="root.0.2.0.1.1" data-from="root.0.2.0.1.0" data-to="root.0.2.0.1.2" d="M 446.000 527.350 L 566.000 527.350" fill="none" stroke="#475569" stroke-width="3"><title>DELETE 대상 행을 제외해 rewrite</title></path>
<polygon data-arrowhead="root.0.2.0.1.1" points="566.000,527.350 556.000,533.350 556.000,521.350" fill="#475569"/>
<path data-edge="root.0.2.1.2" data-from="root.0.2.1.1" data-to="root.0.2.1.3" d="M 1414.000 564.350 L 1414.000 650.050" fill="none" stroke="#475569" stroke-width="3"><title>read-time merge</title></path>
<polygon data-arrowhead="root.0.2.1.2" points="1414.000,650.050 1408.000,640.050 1420.000,640.050" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="250.150" font-size="36" font-weight="700" fill="#111827">Copy-on-Write는 write에서, Merge-on-Read는 read에서 비용을 낸다</text>
<text data-source="root.0.1" x="64.000" y="308.750" font-size="22" font-weight="400" fill="#111827">같은 DELETE 작업을 비교합니다. 두 방식의 query result는 같으며, write mode와 지원 범위는 엔진 및 테이블 포맷 버전에 따라 다릅니다.</text>
<text data-source="root.0.2.0.0" x="88.000" y="392.450" font-size="28" font-weight="700" fill="#111827">Copy-on-Write</text>
<text data-source="root.0.2.0.1.0" x="144.000" y="516.300" font-size="28" font-weight="700" fill="#111827">data file A</text>
<text data-source="root.0.2.0.1.0" x="144.000" y="558.700" font-size="22" font-weight="400" fill="#111827">rows 1..n</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="516.300" font-size="28" font-weight="700" fill="#111827">new data file A&#x27;</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="558.700" font-size="22" font-weight="400" fill="#111827">old file leaves the snapshot</text>
<text data-source="root.0.2.0.1.1" x="438.000" y="448.250" font-size="22" font-weight="400" fill="#111827">DELETE 대상</text>
<text data-source="root.0.2.0.1.1" x="438.000" y="477.950" font-size="22" font-weight="400" fill="#111827">행을 제외해</text>
<text data-source="root.0.2.0.1.1" x="438.000" y="507.650" font-size="22" font-weight="400" fill="#111827">rewrite</text>
<text data-source="root.0.2.0.2" x="88.000" y="674.450" font-size="22" font-weight="400" fill="#111827">Fast reads, costly writes. Read-heavy table에 적합합니다.</text>
<text data-source="root.0.2.1.0" x="996.000" y="392.450" font-size="28" font-weight="700" fill="#111827">Merge-on-Read</text>
<text data-source="root.0.2.1.1.0" x="1020.000" y="478.250" font-size="28" font-weight="700" fill="#111827">data file A</text>
<text data-source="root.0.2.1.1.0" x="1020.000" y="520.650" font-size="22" font-weight="400" fill="#111827">원본을 유지</text>
<text data-source="root.0.2.1.1.1" x="1450.000" y="478.250" font-size="28" font-weight="700" fill="#111827">delete file</text>
<text data-source="root.0.2.1.1.1" x="1450.000" y="520.650" font-size="22" font-weight="400" fill="#111827">position or equality deletes</text>
<text data-source="root.0.2.1.3" x="1020.000" y="714.050" font-size="28" font-weight="700" fill="#111827">merged read</text>
<text data-source="root.0.2.1.3" x="1020.000" y="756.450" font-size="22" font-weight="400" fill="#111827">DELETE marker를 적용해 삭제된 행을 제외</text>
<text data-source="root.0.2.1.4" x="996.000" y="834.150" font-size="22" font-weight="400" fill="#111827">Fast writes, read-time merge cost. Frequent updates와 CDC에 적합합니다.</text>
<text data-source="root.0.2.1.2" x="1434.000" y="614.350" font-size="22" font-weight="400" fill="#111827">read-time merge</text>
</svg>
