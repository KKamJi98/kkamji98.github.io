<text data-source="root.0.0" x="64.000" y="300.700" font-size="36" font-weight="700" fill="#111827">Athena query의 길목마다 권한 gate가 선다</text>
<text data-source="root.0.1.0" x="120.000" y="427.350" font-size="28" font-weight="700" fill="#111827">Client</text>
<text data-source="root.0.1.0" x="120.000" y="469.750" font-size="22" font-weight="400" fill="#111827">SQL 제출</text>
<text data-source="root.0.1.2" x="744.000" y="412.500" font-size="28" font-weight="700" fill="#111827">StartQueryExecution</text>
<text data-source="root.0.1.2" x="744.000" y="454.900" font-size="22" font-weight="400" fill="#111827">workgroup result location and scan</text>
<text data-source="root.0.1.2" x="744.000" y="484.600" font-size="22" font-weight="400" fill="#111827">limit policy</text>
<text data-source="root.0.1.4" x="1368.000" y="427.350" font-size="28" font-weight="700" fill="#111827">Glue Data Catalog 조회</text>
<text data-source="root.0.1.4" x="1368.000" y="469.750" font-size="22" font-weight="400" fill="#111827">schema, S3 LOCATION, partitions</text>
<text data-source="root.0.1.6" x="120.000" y="687.500" font-size="28" font-weight="700" fill="#111827">S3 or S3 Tables data scan</text>
<text data-source="root.0.1.6" x="120.000" y="729.900" font-size="22" font-weight="400" fill="#111827">partition filter로 scan량 축소</text>
<text data-source="root.0.1.8" x="744.000" y="687.500" font-size="28" font-weight="700" fill="#111827">query result location (S3)</text>
<text data-source="root.0.1.8" x="744.000" y="729.900" font-size="22" font-weight="400" fill="#111827">결과 기록 후 client에 반환</text>
<text data-source="root.0.1.1" x="580.000" y="418.700" font-size="22" font-weight="400" fill="#111827">IAM</text>
<text data-source="root.0.1.3" x="1204.000" y="359.300" font-size="22" font-weight="400" fill="#111827">IAM plus</text>
<text data-source="root.0.1.3" x="1204.000" y="389.000" font-size="22" font-weight="400" fill="#111827">Lake</text>
<text data-source="root.0.1.3" x="1204.000" y="418.700" font-size="22" font-weight="400" fill="#111827">Formation</text>
<text data-source="root.0.1.5" x="104.000" y="579.500" font-size="22" font-weight="400" fill="#111827">IAM; S3 Tables는 LF도 평가</text>
<text data-source="root.0.1.7" x="580.000" y="678.850" font-size="22" font-weight="400" fill="#111827">IAM</text>
<text data-source="root.0.2" x="64.000" y="807.600" font-size="22" font-weight="400" fill="#111827">각 길목의 gate가 모두 Allow여야 query가 끝까지 진행됩니다. Athena는 data를 보관하지 않습니다.</text>
