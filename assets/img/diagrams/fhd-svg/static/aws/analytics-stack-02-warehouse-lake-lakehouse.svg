<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="0185722bd4e940110050f41887d1e82cf7792f17b823076a6e54f5ff2aae78b2">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-source="root.0.2.0" x="64.000" y="332.050" width="581.333" height="499.100" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.2.1" x="669.333" y="332.050" width="581.333" height="505.800" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.2.2" x="1274.667" y="332.050" width="581.333" height="542.200" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-node="root.0.2.0.1.0" x="88.000" y="417.850" width="533.333" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.0.1.1" x="88.000" y="567.950" width="533.333" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.1.1.0" x="693.333" y="417.850" width="533.333" height="162.500" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.1.1.1" x="693.333" y="604.350" width="533.333" height="126.100" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect data-node="root.0.2.2.1.0" x="1298.667" y="417.850" width="533.333" height="162.500" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.2.2.1.1" x="1298.667" y="604.350" width="533.333" height="162.500" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text data-source="root.0.0" x="64.000" y="241.750" font-size="36" font-weight="700" fill="#111827">Lakehouse는 lake storage에 warehouse 보장을 더한다</text>
<text data-source="root.0.1" x="64.000" y="300.350" font-size="22" font-weight="400" fill="#111827">세 패러다임의 경계는 스키마를 적용하는 시점과 storage layer의 transaction 지원입니다.</text>
<text data-source="root.0.2.0.0" x="88.000" y="384.050" font-size="28" font-weight="700" fill="#111827">Data Warehouse</text>
<text data-source="root.0.2.0.1.0" x="112.000" y="469.850" font-size="28" font-weight="700" fill="#111827">Amazon Redshift</text>
<text data-source="root.0.2.0.1.0" x="112.000" y="512.250" font-size="22" font-weight="400" fill="#111827">정형 분석용 columnar MPP</text>
<text data-source="root.0.2.0.1.1" x="112.000" y="619.950" font-size="28" font-weight="700" fill="#111827">schema-on-write</text>
<text data-source="root.0.2.0.1.1" x="112.000" y="662.350" font-size="22" font-weight="400" fill="#111827">구조화된 데이터만 적재; 빠른 쿼리와 강한</text>
<text data-source="root.0.2.0.1.1" x="112.000" y="692.050" font-size="22" font-weight="400" fill="#111827">거버넌스</text>
<text data-source="root.0.2.0.2" x="88.000" y="769.750" font-size="22" font-weight="400" fill="#111827">스토리지 비용과 스키마 변경의 경직성이</text>
<text data-source="root.0.2.0.2" x="88.000" y="799.450" font-size="22" font-weight="400" fill="#111827">trade-off입니다.</text>
<text data-source="root.0.2.1.0" x="693.333" y="384.050" font-size="28" font-weight="700" fill="#111827">Data Lake</text>
<text data-source="root.0.2.1.1.0" x="717.333" y="469.850" font-size="28" font-weight="700" fill="#111827">Amazon S3 plus Glue plus</text>
<text data-source="root.0.2.1.1.0" x="717.333" y="506.250" font-size="28" font-weight="700" fill="#111827">Athena</text>
<text data-source="root.0.2.1.1.0" x="717.333" y="548.650" font-size="22" font-weight="400" fill="#111827">원본을 다양한 형식으로 저장</text>
<text data-source="root.0.2.1.1.1" x="717.333" y="656.350" font-size="28" font-weight="700" fill="#111827">schema-on-read</text>
<text data-source="root.0.2.1.1.1" x="717.333" y="698.750" font-size="22" font-weight="400" fill="#111827">저비용과 유연성; 관리가 없으면 data swamp</text>
<text data-source="root.0.2.1.2" x="693.333" y="776.450" font-size="22" font-weight="400" fill="#111827">파일 자체에는 ACID transaction과 강한</text>
<text data-source="root.0.2.1.2" x="693.333" y="806.150" font-size="22" font-weight="400" fill="#111827">governance가 없습니다.</text>
<text data-source="root.0.2.2.0" x="1298.667" y="384.050" font-size="28" font-weight="700" fill="#111827">Data Lakehouse</text>
<text data-source="root.0.2.2.1.0" x="1322.667" y="469.850" font-size="28" font-weight="700" fill="#111827">S3 Tables plus Athena plus</text>
<text data-source="root.0.2.2.1.0" x="1322.667" y="506.250" font-size="28" font-weight="700" fill="#111827">Lake Formation</text>
<text data-source="root.0.2.2.1.0" x="1322.667" y="548.650" font-size="22" font-weight="400" fill="#111827">관리형 Iceberg table storage와 governance</text>
<text data-source="root.0.2.2.1.1" x="1322.667" y="656.350" font-size="28" font-weight="700" fill="#111827">lake storage plus warehouse</text>
<text data-source="root.0.2.2.1.1" x="1322.667" y="692.750" font-size="28" font-weight="700" fill="#111827">features</text>
<text data-source="root.0.2.2.1.1" x="1322.667" y="735.150" font-size="22" font-weight="400" fill="#111827">ACID, schema evolution, transactions</text>
<text data-source="root.0.2.2.2" x="1298.667" y="812.850" font-size="22" font-weight="400" fill="#111827">새 storage engine이 아니라 Apache Iceberg table</text>
<text data-source="root.0.2.2.2" x="1298.667" y="842.550" font-size="22" font-weight="400" fill="#111827">format이 기능을 제공합니다.</text>
</svg>
