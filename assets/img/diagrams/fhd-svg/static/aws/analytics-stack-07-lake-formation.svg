<text data-source="root.0.1.5" x="1353.588" y="389.000" font-size="22" font-weight="400" fill="#111827">authorization</text>
<text data-source="root.0.1.7" x="104.000" y="571.150" font-size="22" font-weight="400" fill="#111827">등록된 role을 assume</text>
