<text data-source="root.0.0" x="64.000" y="249.650" font-size="36" font-weight="700" fill="#111827">IAM과 Lake Formation은 같은 query에 별도 gate를 둔다</text>
<text data-source="root.0.1.0" x="120.000" y="379.450" font-size="28" font-weight="700" fill="#111827">analytics-</text>
<text data-source="root.0.1.0" x="120.000" y="415.850" font-size="28" font-weight="700" fill="#111827">workload-role</text>
<text data-source="root.0.1.0" x="120.000" y="458.250" font-size="22" font-weight="400" fill="#111827">query principal</text>
<text data-source="root.0.1.2" x="594.412" y="397.650" font-size="28" font-weight="700" fill="#111827">Amazon Athena</text>
<text data-source="root.0.1.2" x="594.412" y="440.050" font-size="22" font-weight="400" fill="#111827">query engine</text>
<text data-source="root.0.1.4" x="1068.824" y="338.250" font-size="28" font-weight="700" fill="#111827">IAM gate</text>
<text data-source="root.0.1.4" x="1068.824" y="380.650" font-size="22" font-weight="400" fill="#111827">athena:*, glue:Get* on</text>
<text data-source="root.0.1.4" x="1068.824" y="410.350" font-size="22" font-weight="400" fill="#111827">target and ancestor</text>
<text data-source="root.0.1.4" x="1068.824" y="440.050" font-size="22" font-weight="400" fill="#111827">ARN;</text>
<text data-source="root.0.1.4" x="1068.824" y="469.750" font-size="22" font-weight="400" fill="#111827">lakeformation:</text>
<text data-source="root.0.1.4" x="1068.824" y="499.450" font-size="22" font-weight="400" fill="#111827">GetDataAccess</text>
<text data-source="root.0.1.6" x="1543.235" y="349.750" font-size="28" font-weight="700" fill="#111827">Lake Formation</text>
<text data-source="root.0.1.6" x="1543.235" y="386.150" font-size="28" font-weight="700" fill="#111827">gate</text>
<text data-source="root.0.1.6" x="1543.235" y="428.550" font-size="22" font-weight="400" fill="#111827">database와 table에</text>
<text data-source="root.0.1.6" x="1543.235" y="458.250" font-size="22" font-weight="400" fill="#111827">SELECT, DESCRIBE</text>
<text data-source="root.0.1.6" x="1543.235" y="487.950" font-size="22" font-weight="400" fill="#111827">grant</text>
<text data-source="root.0.1.8" x="120.000" y="679.150" font-size="28" font-weight="700" fill="#111827">Registered role</text>
<text data-source="root.0.1.8" x="120.000" y="721.550" font-size="22" font-weight="400" fill="#111827">Lake Formation이 data</text>
<text data-source="root.0.1.8" x="120.000" y="751.250" font-size="22" font-weight="400" fill="#111827">access credential을</text>
<text data-source="root.0.1.8" x="120.000" y="780.950" font-size="22" font-weight="400" fill="#111827">vending</text>
<text data-source="root.0.1.10" x="594.412" y="708.850" font-size="28" font-weight="700" fill="#111827">S3 Tables data</text>
<text data-source="root.0.1.10" x="594.412" y="751.250" font-size="22" font-weight="400" fill="#111827">실제 테이블 objects</text>
<text data-source="root.0.1.1" x="404.765" y="389.000" font-size="22" font-weight="400" fill="#111827">query 제출</text>
<text data-source="root.0.1.3" x="879.176" y="359.300" font-size="22" font-weight="400" fill="#111827">API</text>
