<text data-source="root.0.2" x="64.000" y="858.650" font-size="22" font-weight="400" fill="#111827">IAM Allow만 있고 Lake Formation grant가 없으면 데이터 gate에서 AccessDenied가 반환됩니다. 두 gate가 모두 Allow여야 합니다.</text>
