<text data-source="root.0.0" x="64.000" y="142.750" font-size="36" font-weight="700" fill="#111827">VPC Lattice 하나가 세 account의 Service Network가 된다</text>
<text data-source="root.0.1.0" x="120.000" y="239.700" font-size="28" font-weight="700" fill="#111827">Client EC2</text>
<text data-source="root.0.1.0" x="120.000" y="282.100" font-size="22" font-weight="400" fill="#111827">Account 1, VPC A; service-a FQDN 호출</text>
<text data-source="root.0.1.2" x="1056.000" y="239.700" font-size="28" font-weight="700" fill="#111827">Amazon VPC Lattice</text>
<text data-source="root.0.1.2" x="1056.000" y="282.100" font-size="22" font-weight="400" fill="#111827">Service Network; link-local endpoint로 진입</text>
<text data-source="root.0.1.4.0.0" x="120.000" y="470.150" font-size="28" font-weight="700" fill="#111827">Account 2 - VPC B</text>
<text data-source="root.0.1.4.0.1.0" x="144.000" y="555.950" font-size="28" font-weight="700" fill="#111827">Service A (billing)</text>
<text data-source="root.0.1.4.0.1.0" x="144.000" y="598.350" font-size="22" font-weight="400" fill="#111827">HTTP :80; /api/* rule</text>
<text data-source="root.0.1.4.0.1.2" x="144.000" y="791.750" font-size="28" font-weight="700" fill="#111827">Target Group A</text>
<text data-source="root.0.1.4.0.1.2" x="144.000" y="834.150" font-size="22" font-weight="400" fill="#111827">EC2 targets; AZ affinity, round</text>
<text data-source="root.0.1.4.0.1.2" x="144.000" y="863.850" font-size="22" font-weight="400" fill="#111827">robin</text>
<text data-source="root.0.1.4.0.1.1" x="308.000" y="692.050" font-size="22" font-weight="400" fill="#111827">listener rule</text>
<text data-source="root.0.1.4.1.0" x="528.000" y="470.150" font-size="28" font-weight="700" fill="#111827">Account 3 - VPC C</text>
<text data-source="root.0.1.4.1.1.0" x="552.000" y="555.950" font-size="28" font-weight="700" fill="#111827">Service B (payment)</text>
<text data-source="root.0.1.4.1.1.0" x="552.000" y="598.350" font-size="22" font-weight="400" fill="#111827">HTTPS :443; /pay/* rule</text>
<text data-source="root.0.1.4.1.1.2" x="552.000" y="791.750" font-size="28" font-weight="700" fill="#111827">Target Group B</text>
<text data-source="root.0.1.4.1.1.2" x="552.000" y="834.150" font-size="22" font-weight="400" fill="#111827">EC2 targets; overlapping</text>
<text data-source="root.0.1.4.1.1.2" x="552.000" y="863.850" font-size="22" font-weight="400" fill="#111827">CIDR는 auto NAT</text>
<text data-source="root.0.1.4.1.1.1" x="716.000" y="692.050" font-size="22" font-weight="400" fill="#111827">listener rule</text>
<text data-source="root.0.1.1" x="892.000" y="201.350" font-size="22" font-weight="400" fill="#111827">Route 53</text>
<text data-source="root.0.1.1" x="892.000" y="231.050" font-size="22" font-weight="400" fill="#111827">Resolver</text>
<text data-source="root.0.1.3" x="104.000" y="362.150" font-size="22" font-weight="400" fill="#111827">VPC Association으로 route</text>
<text data-source="root.0.2" x="64.000" y="965.550" font-size="22" font-weight="400" fill="#111827">AWS RAM으로 Service Network를 공유하고 각 VPC를 association합니다. VPC Peering과 Transit Gateway 없이 cross-account 연결이 됩니다.</text>
