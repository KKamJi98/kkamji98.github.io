<text data-source="root.0.0" x="64.000" y="118.750" font-size="36" font-weight="700" fill="#111827">VPC Lattice 하나가 세 account의 Service Network가 된다</text>
<text data-source="root.0.1.0" x="120.000" y="215.700" font-size="28" font-weight="700" fill="#111827">Client EC2</text>
<text data-source="root.0.1.0" x="120.000" y="258.100" font-size="22" font-weight="400" fill="#111827">Account 1, VPC A; service-a FQDN 호출</text>
<text data-source="root.0.1.2" x="1056.000" y="215.700" font-size="28" font-weight="700" fill="#111827">Amazon VPC Lattice</text>
<text data-source="root.0.1.2" x="1056.000" y="258.100" font-size="22" font-weight="400" fill="#111827">Service Network; link-local endpoint로 진입</text>
<text data-source="root.0.1.4.0.0" x="612.000" y="470.150" font-size="28" font-weight="700" fill="#111827">Account 2 - VPC B</text>
<text data-source="root.0.1.4.0.1.0" x="636.000" y="555.950" font-size="28" font-weight="700" fill="#111827">Service A (billing)</text>
<text data-source="root.0.1.4.0.1.0" x="636.000" y="598.350" font-size="22" font-weight="400" fill="#111827">HTTP :80; /api/* rule</text>
<text data-source="root.0.1.4.0.1.2" x="636.000" y="791.750" font-size="28" font-weight="700" fill="#111827">Target Group A</text>
<text data-source="root.0.1.4.0.1.2" x="636.000" y="834.150" font-size="22" font-weight="400" fill="#111827">EC2 targets; AZ affinity,</text>
<text data-source="root.0.1.4.0.1.2" x="636.000" y="863.850" font-size="22" font-weight="400" fill="#111827">round robin</text>
<text data-source="root.0.1.4.0.1.1" x="788.000" y="692.050" font-size="22" font-weight="400" fill="#111827">listener rule</text>
<text data-source="root.0.1.4.1.0" x="996.000" y="470.150" font-size="28" font-weight="700" fill="#111827">Account 3 - VPC C</text>
<text data-source="root.0.1.4.1.1.0" x="1020.000" y="555.950" font-size="28" font-weight="700" fill="#111827">Service B (payment)</text>
<text data-source="root.0.1.4.1.1.0" x="1020.000" y="598.350" font-size="22" font-weight="400" fill="#111827">HTTPS :443; /pay/* rule</text>
<text data-source="root.0.1.4.1.1.2" x="1020.000" y="791.750" font-size="28" font-weight="700" fill="#111827">Target Group B</text>
<text data-source="root.0.1.4.1.1.2" x="1020.000" y="834.150" font-size="22" font-weight="400" fill="#111827">EC2 targets; overlapping</text>
<text data-source="root.0.1.4.1.1.2" x="1020.000" y="863.850" font-size="22" font-weight="400" fill="#111827">CIDR는 auto NAT</text>
<text data-source="root.0.1.4.1.1.1" x="1172.000" y="692.050" font-size="22" font-weight="400" fill="#111827">listener rule</text>
<text data-source="root.0.1.1" x="892.000" y="177.350" font-size="22" font-weight="400" fill="#111827">Route 53</text>
<text data-source="root.0.1.1" x="892.000" y="207.050" font-size="22" font-weight="400" fill="#111827">Resolver</text>
<text data-source="root.0.1.3" x="972.000" y="338.150" font-size="22" font-weight="400" fill="#111827">VPC Association으로 route</text>
<text data-source="root.0.2" x="64.000" y="989.550" font-size="22" font-weight="400" fill="#111827">AWS RAM으로 Service Network를 공유하고 각 VPC를 association합니다. VPC Peering과 Transit Gateway 없이 cross-account 연결이 됩니다.</text>
