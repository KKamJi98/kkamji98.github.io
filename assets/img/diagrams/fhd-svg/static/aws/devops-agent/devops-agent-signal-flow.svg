<path data-edge="root.0.4" data-from="root.0.3" data-to="root.0.5" d="M 960.000 549.450 L 960.000 635.150" fill="none" stroke="#475569" stroke-width="3"><title>조사 결과와 제안</title></path>
<polygon data-arrowhead="root.0.4" points="960.000,635.150 954.000,625.150 966.000,625.150" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="138.950" font-size="36" font-weight="700" fill="#111827">DevOps Agent는 신호를 모으는 도구 위에서 조사한다</text>
<text data-source="root.0.1.0" x="88.000" y="227.550" font-size="28" font-weight="700" fill="#111827">CloudWatch</text>
<text data-source="root.0.1.0" x="88.000" y="269.950" font-size="22" font-weight="400" fill="#111827">metrics, logs, alarms</text>
<text data-source="root.0.1.1" x="693.333" y="227.550" font-size="28" font-weight="700" fill="#111827">Grafana and Datadog</text>
<text data-source="root.0.1.1" x="693.333" y="269.950" font-size="22" font-weight="400" fill="#111827">read-only, one-way telemetry</text>
<text data-source="root.0.1.2" x="1298.667" y="227.550" font-size="28" font-weight="700" fill="#111827">Workloads</text>
<text data-source="root.0.1.2" x="1298.667" y="269.950" font-size="22" font-weight="400" fill="#111827">pod logs and cluster events; kubectl exec 없음</text>
<text data-source="root.0.3" x="88.000" y="463.350" font-size="28" font-weight="700" fill="#111827">DevOps Agent</text>
<text data-source="root.0.3" x="88.000" y="505.750" font-size="22" font-weight="400" fill="#111827">alarm이 발생하면 영향 범위와 근본 원인을 조사</text>
<text data-source="root.0.5.0" x="88.000" y="699.150" font-size="28" font-weight="700" fill="#111827">Incident report</text>
<text data-source="root.0.5.0" x="88.000" y="741.550" font-size="22" font-weight="400" fill="#111827">free text; typed fields 아님</text>
<text data-source="root.0.5.1" x="996.000" y="699.150" font-size="28" font-weight="700" fill="#111827">Human approval</text>
<text data-source="root.0.5.1" x="996.000" y="741.550" font-size="22" font-weight="400" fill="#111827">production change 전에 명시적 승인 필요</text>
<text data-source="root.0.5.2" x="88.000" y="849.250" font-size="28" font-weight="700" fill="#111827">Journal</text>
<text data-source="root.0.5.2" x="88.000" y="891.650" font-size="22" font-weight="400" fill="#111827">모든 단계 기록; entries immutable</text>
<text data-source="root.0.6" x="64.000" y="969.350" font-size="22" font-weight="400" fill="#111827">Journal은 조사 결과와 별도로 모든 추론과 행동을 기록하는 audit path입니다.</text>
<text data-source="root.0.2" x="980.000" y="363.650" font-size="22" font-weight="400" fill="#111827">alarm과 telemetry 입력</text>
<text data-source="root.0.4" x="980.000" y="599.450" font-size="22" font-weight="400" fill="#111827">조사 결과와 제안</text>
</svg>
