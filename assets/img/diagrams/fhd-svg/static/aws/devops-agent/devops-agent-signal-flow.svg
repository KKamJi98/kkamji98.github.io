<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="722e748aebac0fcd70eab8468a3e0b2bad4e18f717f05e6429e73d4f651fe664">
