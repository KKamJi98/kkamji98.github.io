<text data-source="root.0.0" x="64.000" y="109.850" font-size="36" font-weight="700" fill="#111827">Secrets Manager 값은 env var가 아니라 Pod의 mounted file이 된다</text>
<text data-source="root.0.1.0" x="80.000" y="174.450" font-size="20" font-weight="700" fill="#111827">EKS worker node</text>
<text data-source="root.0.1.1.0" x="96.000" y="233.450" font-size="20" font-weight="700" fill="#111827">Pod</text>
<text data-source="root.0.1.1.0" x="96.000" y="269.450" font-size="18" font-weight="400" fill="#111827">SecretProviderClass volume 선언</text>
<text data-source="root.0.1.1.2" x="96.000" y="416.050" font-size="20" font-weight="700" fill="#111827">Secrets Store CSI driver</text>
<text data-source="root.0.1.1.2" x="96.000" y="452.050" font-size="18" font-weight="400" fill="#111827">node마다 DaemonSet으로 실행</text>
<text data-source="root.0.1.1.4" x="96.000" y="598.650" font-size="20" font-weight="700" fill="#111827">AWS provider (ASCP)</text>
<text data-source="root.0.1.1.4" x="96.000" y="634.650" font-size="18" font-weight="400" fill="#111827">IRSA role을 assume</text>
<text data-source="root.0.1.1.5" x="96.000" y="708.950" font-size="20" font-weight="700" fill="#111827">Mounted secret file</text>
<text data-source="root.0.1.1.5" x="96.000" y="744.950" font-size="18" font-weight="400" fill="#111827">CSI driver가 tmpfs volume을 mount하고 ASCP가 secret 값을 제공; rotation 활성화 시 주기적 갱신</text>
<text data-source="root.0.1.1.1" x="980.000" y="341.750" font-size="18" font-weight="400" fill="#111827">volume mount</text>
<text data-source="root.0.1.1.3" x="980.000" y="524.350" font-size="18" font-weight="400" fill="#111827">AWS provider 호출</text>
<text data-source="root.0.3" x="80.000" y="907.550" font-size="20" font-weight="700" fill="#111827">AWS Secrets Manager</text>
<text data-source="root.0.3" x="80.000" y="943.550" font-size="18" font-weight="400" fill="#111827">secret value 반환</text>
<text data-source="root.0.4" x="64.000" y="999.850" font-size="18" font-weight="400" fill="#111827">Pod가 AWS credential을 직접 보유하지 않습니다. Fargate node group은 이 구성을 지원하지 않습니다.</text>
<text data-source="root.0.2" x="980.000" y="833.250" font-size="18" font-weight="400" fill="#111827">ASCP의 GetSecretValue 요청 / secret value 반환</text>
