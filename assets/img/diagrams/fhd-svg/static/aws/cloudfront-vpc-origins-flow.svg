<text data-source="root.0.0" x="64.000" y="117.800" font-size="36" font-weight="700" fill="#111827">CloudFront VPC Origins는 origin을 private subnet 안에 둔다</text>
<text data-source="root.0.1.0" x="120.000" y="214.750" font-size="28" font-weight="700" fill="#111827">Viewer</text>
<text data-source="root.0.1.0" x="120.000" y="257.150" font-size="22" font-weight="400" fill="#111827">public internet</text>
<text data-source="root.0.1.2" x="1056.000" y="214.750" font-size="28" font-weight="700" fill="#111827">Amazon CloudFront</text>
<text data-source="root.0.1.2" x="1056.000" y="257.150" font-size="22" font-weight="400" fill="#111827">edge location; WAF와 TLS terminate</text>
<text data-source="root.0.1.4.0" x="120.000" y="445.200" font-size="28" font-weight="700" fill="#111827">AWS Region</text>
<text data-source="root.0.1.4.1.0" x="144.000" y="531.000" font-size="28" font-weight="700" fill="#111827">VPC</text>
<text data-source="root.0.1.4.1.1.0" x="168.000" y="616.800" font-size="28" font-weight="700" fill="#111827">Private subnet - no route to an internet gateway</text>
<text data-source="root.0.1.4.1.1.1.0" x="224.000" y="702.600" font-size="28" font-weight="700" fill="#111827">VPC origin</text>
<text data-source="root.0.1.4.1.1.1.0" x="224.000" y="739.000" font-size="28" font-weight="700" fill="#111827">ENI</text>
<text data-source="root.0.1.4.1.1.1.0" x="224.000" y="781.400" font-size="22" font-weight="400" fill="#111827">service-managed;</text>
<text data-source="root.0.1.4.1.1.1.0" x="224.000" y="811.100" font-size="22" font-weight="400" fill="#111827">free IPv4 address</text>
<text data-source="root.0.1.4.1.1.1.0" x="224.000" y="840.800" font-size="22" font-weight="400" fill="#111827">1개 필요</text>
<text data-source="root.0.1.4.1.1.1.2" x="588.000" y="705.950" font-size="28" font-weight="700" fill="#111827">Origin</text>
<text data-source="root.0.1.4.1.1.1.2" x="588.000" y="748.350" font-size="22" font-weight="400" fill="#111827">internal ALB, NLB</text>
<text data-source="root.0.1.4.1.1.1.2" x="588.000" y="778.050" font-size="22" font-weight="400" fill="#111827">or EC2;</text>
<text data-source="root.0.1.4.1.1.1.2" x="588.000" y="807.750" font-size="22" font-weight="400" fill="#111827">service-managed</text>
<text data-source="root.0.1.4.1.1.1.2" x="588.000" y="837.450" font-size="22" font-weight="400" fill="#111827">SG가 연결됨</text>
<text data-source="root.0.1.4.1.1.1.1" x="424.000" y="682.450" font-size="22" font-weight="400" fill="#111827">private</text>
<text data-source="root.0.1.4.1.1.1.1" x="424.000" y="712.150" font-size="22" font-weight="400" fill="#111827">subnet 내부</text>
<text data-source="root.0.1.4.1.1.1.1" x="424.000" y="741.850" font-size="22" font-weight="400" fill="#111827">전달</text>
<text data-source="root.0.1.1" x="892.000" y="176.400" font-size="22" font-weight="400" fill="#111827">viewer</text>
<text data-source="root.0.1.1" x="892.000" y="206.100" font-size="22" font-weight="400" fill="#111827">request</text>
<text data-source="root.0.1.3" x="104.000" y="337.200" font-size="22" font-weight="400" fill="#111827">AWS backbone private path</text>
<text data-source="root.0.2" x="64.000" y="990.500" font-size="22" font-weight="400" fill="#111827">Origin은 public IP 없이 동작합니다. Internet Gateway는 VPC 준비 조건일 뿐, CloudFront에서 origin으로 가는 경로에는 사용되지 않습니다.</text>
</svg>
