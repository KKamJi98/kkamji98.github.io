<text data-source="root.0.0" x="64.000" y="229.950" font-size="36" font-weight="700" fill="#111827">Web ACL은 rule group이 쓰는 WCU가 아니라 만든 capacity를 센다</text>
<text data-source="root.0.1.0.0" x="88.000" y="318.550" font-size="28" font-weight="700" fill="#111827">capacity 300으로 만든 rule group</text>
<text data-source="root.0.1.0.1" x="112.000" y="404.350" font-size="28" font-weight="700" fill="#111827">rule group 안의 rule</text>
<text data-source="root.0.1.0.1" x="112.000" y="446.750" font-size="22" font-weight="400" fill="#111827">CheckCapacity 60 WCU</text>
<text data-source="root.0.1.0.2" x="112.000" y="554.450" font-size="28" font-weight="700" fill="#111827">Web ACL에 잡히는 값</text>
<text data-source="root.0.1.0.2" x="112.000" y="596.850" font-size="22" font-weight="400" fill="#111827">capacity 300 WCU</text>
<text data-source="root.0.1.0.3" x="112.000" y="704.550" font-size="28" font-weight="700" fill="#111827">관리형 6개와 합계</text>
<text data-source="root.0.1.0.3" x="112.000" y="746.950" font-size="22" font-weight="400" fill="#111827">1,375 + 300 = 1,675</text>
<text data-source="root.0.1.0.3" x="112.000" y="776.650" font-size="22" font-weight="400" fill="#111827">100만 건당 $0.80</text>
<text data-source="root.0.1.1.0" x="996.000" y="318.550" font-size="28" font-weight="700" fill="#111827">capacity 80으로 다시 만든 rule group</text>
<text data-source="root.0.1.1.1" x="1020.000" y="404.350" font-size="28" font-weight="700" fill="#111827">rule group 안의 rule</text>
<text data-source="root.0.1.1.1" x="1020.000" y="446.750" font-size="22" font-weight="400" fill="#111827">같은 60 WCU</text>
<text data-source="root.0.1.1.2" x="1020.000" y="554.450" font-size="28" font-weight="700" fill="#111827">Web ACL에 잡히는 값</text>
<text data-source="root.0.1.1.2" x="1020.000" y="596.850" font-size="22" font-weight="400" fill="#111827">capacity 80 WCU</text>
<text data-source="root.0.1.1.3" x="1020.000" y="704.550" font-size="28" font-weight="700" fill="#111827">관리형 6개와 합계</text>
<text data-source="root.0.1.1.3" x="1020.000" y="746.950" font-size="22" font-weight="400" fill="#111827">1,375 + 80 = 1,455</text>
<text data-source="root.0.1.1.3" x="1020.000" y="776.650" font-size="22" font-weight="400" fill="#111827">100만 건당 $0.60</text>
<text data-source="root.0.2" x="64.000" y="878.350" font-size="22" font-weight="400" fill="#111827">capacity는 만든 뒤 바꿀 수 없다. 줄이려면 새 rule group을 만들고 Web ACL의 참조를 옮긴다.</text>
</svg>
