<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="b7acdb8f1e4ab4a979c9b91542a80a5e2eabbadcd7aad6c6f9b7e5cfde925cbb">
