<text data-source="root.0.0" x="64.000" y="229.950" font-size="36" font-weight="700" fill="#111827">CONTAINS 7개를 정규식 1개로 바꾸면 80 WCU가 13 WCU가 된다</text>
<text data-source="root.0.1.0.0" x="88.000" y="318.550" font-size="28" font-weight="700" fill="#111827">바꾸기 전: 80 WCU</text>
<text data-source="root.0.1.0.1" x="112.000" y="404.350" font-size="28" font-weight="700" fill="#111827">CONTAINS x 7</text>
<text data-source="root.0.1.0.1" x="112.000" y="446.750" font-size="22" font-weight="400" fill="#111827">python-requests/ ... libwww-perl/</text>
<text data-source="root.0.1.0.1" x="112.000" y="476.450" font-size="22" font-weight="400" fill="#111827">7 x 10 = 70 WCU</text>
<text data-source="root.0.1.0.2" x="112.000" y="584.150" font-size="28" font-weight="700" fill="#111827">LOWERCASE</text>
<text data-source="root.0.1.0.2" x="112.000" y="626.550" font-size="22" font-weight="400" fill="#111827">같은 변환 7개를 1회로 계산: 10 WCU</text>
<text data-source="root.0.1.0.3" x="112.000" y="734.250" font-size="28" font-weight="700" fill="#111827">CheckCapacity</text>
<text data-source="root.0.1.0.3" x="112.000" y="776.650" font-size="22" font-weight="400" fill="#111827">80 WCU, 변환을 따로 세면 140</text>
<text data-source="root.0.1.1.0" x="996.000" y="318.550" font-size="28" font-weight="700" fill="#111827">바꾼 뒤: 13 WCU</text>
<text data-source="root.0.1.1.1" x="1020.000" y="404.350" font-size="28" font-weight="700" fill="#111827">REGEX x 1</text>
<text data-source="root.0.1.1.1" x="1020.000" y="446.750" font-size="22" font-weight="400" fill="#111827">python-requests/|...|libwww-perl/</text>
<text data-source="root.0.1.1.1" x="1020.000" y="476.450" font-size="22" font-weight="400" fill="#111827">3 WCU, 토큰이 늘어도 3</text>
<text data-source="root.0.1.1.2" x="1020.000" y="584.150" font-size="28" font-weight="700" fill="#111827">LOWERCASE</text>
<text data-source="root.0.1.1.2" x="1020.000" y="626.550" font-size="22" font-weight="400" fill="#111827">판정을 지키려고 유지: 10 WCU</text>
<text data-source="root.0.1.1.3" x="1020.000" y="734.250" font-size="28" font-weight="700" fill="#111827">CheckCapacity</text>
<text data-source="root.0.1.1.3" x="1020.000" y="776.650" font-size="22" font-weight="400" fill="#111827">13 WCU, 정규식 길이 74자</text>
<text data-source="root.0.2" x="64.000" y="878.350" font-size="22" font-weight="400" fill="#111827">앵커 없는 정규식은 부분 문자열 검색이라 CONTAINS와 판정이 같다. 무작위 문자열 20만 개 비교에서 판정 차이는 0건이었다.</text>
</svg>
