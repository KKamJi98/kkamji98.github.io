<text data-source="root.0.2" x="64.000" y="773.400" font-size="22" font-weight="400" fill="#111827">UA는 Chrome/118의 18, CH는 Sec-CH-UA v=&quot;146&quot;의 46을 7비트로 쓴 값이다. 1/0은 Sec-CH-UA 비트가 1이고 UA 비트가 0인 쌍, 0/1은 그 반대다.</text>
<text data-source="root.0.3" x="64.000" y="827.100" font-size="22" font-weight="400" fill="#111827">14쌍을 OR로 묶었으므로 하나만 매칭돼도 ua-spoof:version label이 붙는다. 버전이 같으면 7비트가 모두 같아 매칭되는 쌍이 없다.</text>
