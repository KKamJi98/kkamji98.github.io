<text data-source="root.0.0" x="64.000" y="275.300" font-size="36" font-weight="700" fill="#111827">탐지 룰은 label만 붙이고 차단은 마지막 룰 하나가 한다</text>
<text data-source="root.0.1.0" x="120.000" y="363.900" font-size="28" font-weight="700" fill="#111827">Block 40~52</text>
<text data-source="root.0.1.0" x="120.000" y="406.300" font-size="22" font-weight="400" fill="#111827">IP set, UA 블랙리스트</text>
<text data-source="root.0.1.0" x="120.000" y="436.000" font-size="22" font-weight="400" fill="#111827">JA4, 관리형 룰 그룹</text>
<text data-source="root.0.1.0" x="120.000" y="465.700" font-size="22" font-weight="400" fill="#111827">매칭되면 종결</text>
<text data-source="root.0.1.2" x="594.000" y="363.900" font-size="28" font-weight="700" fill="#111827">Challenge 80</text>
<text data-source="root.0.1.2" x="594.000" y="406.300" font-size="22" font-weight="400" fill="#111827">의심 ASN</text>
<text data-source="root.0.1.2" x="594.000" y="436.000" font-size="22" font-weight="400" fill="#111827">토큰이 없으면</text>
<text data-source="root.0.1.2" x="594.000" y="465.700" font-size="22" font-weight="400" fill="#111827">202로 종결</text>
<text data-source="root.0.1.4" x="1068.000" y="363.900" font-size="28" font-weight="700" fill="#111827">Count 91~97</text>
<text data-source="root.0.1.4" x="1068.000" y="406.300" font-size="22" font-weight="400" fill="#111827">ua-spoof:version</text>
<text data-source="root.0.1.4" x="1068.000" y="436.000" font-size="22" font-weight="400" fill="#111827">ua-spoof:platform</text>
<text data-source="root.0.1.4" x="1068.000" y="465.700" font-size="22" font-weight="400" fill="#111827">allow:crawler</text>
<text data-source="root.0.1.6" x="1542.000" y="363.900" font-size="28" font-weight="700" fill="#111827">Block 99</text>
<text data-source="root.0.1.6" x="1542.000" y="406.300" font-size="22" font-weight="400" fill="#111827">ua-spoof: 있음</text>
<text data-source="root.0.1.6" x="1542.000" y="436.000" font-size="22" font-weight="400" fill="#111827">AND NOT allow:crawler</text>
<text data-source="root.0.1.6" x="1542.000" y="465.700" font-size="22" font-weight="400" fill="#111827">label match 2개, 2 WCU</text>
<text data-source="root.0.1.1" x="414.000" y="384.950" font-size="22" font-weight="400" fill="#111827">통과</text>
<text data-source="root.0.1.3" x="888.000" y="384.950" font-size="22" font-weight="400" fill="#111827">통과</text>
<text data-source="root.0.1.5" x="1362.000" y="384.950" font-size="22" font-weight="400" fill="#111827">label 읽기</text>
<text data-source="root.0.2.0" x="88.000" y="573.400" font-size="28" font-weight="700" fill="#111827">판정을 한 룰에 모으면 얻는 것</text>
<text data-source="root.0.2.1.0" x="112.000" y="659.200" font-size="28" font-weight="700" fill="#111827">예외는 한 곳</text>
<text data-source="root.0.2.1.0" x="112.000" y="701.600" font-size="22" font-weight="400" fill="#111827">검증된 크롤러 조건을</text>
<text data-source="root.0.2.1.0" x="112.000" y="731.300" font-size="22" font-weight="400" fill="#111827">룰마다 반복하지 않는다</text>
<text data-source="root.0.2.1.1" x="701.333" y="659.200" font-size="28" font-weight="700" fill="#111827">전환은 한 번</text>
<text data-source="root.0.2.1.1" x="701.333" y="701.600" font-size="22" font-weight="400" fill="#111827">Block과 롤백 모두</text>
<text data-source="root.0.2.1.1" x="701.333" y="731.300" font-size="22" font-weight="400" fill="#111827">룰 99의 action 변경</text>
<text data-source="root.0.2.1.2" x="1290.667" y="659.200" font-size="28" font-weight="700" fill="#111827">label별 지표</text>
<text data-source="root.0.2.1.2" x="1290.667" y="701.600" font-size="22" font-weight="400" fill="#111827">통과한 요청만 세어</text>
<text data-source="root.0.2.1.2" x="1290.667" y="731.300" font-size="22" font-weight="400" fill="#111827">오탐 검토 대상이 바로 나온다</text>
<text data-source="root.0.3" x="64.000" y="833.000" font-size="22" font-weight="400" fill="#111827">label은 먼저 평가된 rule이 붙인 것만 보이므로 탐지 룰의 priority 숫자가 판정 룰보다 작아야 한다.</text>
