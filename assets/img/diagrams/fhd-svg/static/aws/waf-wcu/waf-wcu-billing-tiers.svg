<text data-source="root.0.0" x="64.000" y="229.950" font-size="36" font-weight="700" fill="#111827">1,500 WCU를 넘으면 Web ACL의 모든 요청 단가가 오른다</text>
<text data-source="root.0.1.0" x="120.000" y="318.550" font-size="28" font-weight="700" fill="#111827">1,500 WCU 이하</text>
<text data-source="root.0.1.0" x="120.000" y="360.950" font-size="22" font-weight="400" fill="#111827">100만 건당 $0.60</text>
<text data-source="root.0.1.0" x="120.000" y="390.650" font-size="22" font-weight="400" fill="#111827">월 3억 건: $180</text>
<text data-source="root.0.1.2" x="594.000" y="318.550" font-size="28" font-weight="700" fill="#111827">1,501~2,000 WCU</text>
<text data-source="root.0.1.2" x="594.000" y="360.950" font-size="22" font-weight="400" fill="#111827">100만 건당 $0.80</text>
<text data-source="root.0.1.2" x="594.000" y="390.650" font-size="22" font-weight="400" fill="#111827">월 3억 건: $240</text>
<text data-source="root.0.1.4" x="1068.000" y="318.550" font-size="28" font-weight="700" fill="#111827">2,001~2,500 WCU</text>
<text data-source="root.0.1.4" x="1068.000" y="360.950" font-size="22" font-weight="400" fill="#111827">100만 건당 $1.00</text>
<text data-source="root.0.1.4" x="1068.000" y="390.650" font-size="22" font-weight="400" fill="#111827">월 3억 건: $300</text>
<text data-source="root.0.1.6" x="1542.000" y="318.550" font-size="28" font-weight="700" fill="#111827">4,501~5,000 WCU</text>
<text data-source="root.0.1.6" x="1542.000" y="360.950" font-size="22" font-weight="400" fill="#111827">100만 건당 $2.00</text>
<text data-source="root.0.1.6" x="1542.000" y="390.650" font-size="22" font-weight="400" fill="#111827">월 3억 건: $600</text>
<text data-source="root.0.1.1" x="414.000" y="324.750" font-size="22" font-weight="400" fill="#111827">1 WCU 초과</text>
<text data-source="root.0.1.3" x="888.000" y="324.750" font-size="22" font-weight="400" fill="#111827">+500 WCU</text>
<text data-source="root.0.1.5" x="1362.000" y="324.750" font-size="22" font-weight="400" fill="#111827">최대까지</text>
<text data-source="root.0.2" x="64.000" y="468.350" font-size="22" font-weight="400" fill="#111827">1,500을 넘으면 500 WCU 구간마다 100만 건당 $0.20이 더해진다. 가산 요금은 새 rule에 매칭된 요청이 아니라 Web ACL이 검사하는 전체 요청에 붙는다.</text>
<text data-source="root.0.3.0" x="88.000" y="552.050" font-size="28" font-weight="700" fill="#111827">관리형 룰 그룹 6개만으로 1,375 WCU, custom rule 예산은 125 WCU</text>
