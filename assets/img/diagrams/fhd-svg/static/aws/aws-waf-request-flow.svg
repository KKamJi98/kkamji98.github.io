<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 900.000 368.650 L 1020.000 368.650" fill="none" stroke="#475569" stroke-width="3"><title>지원된 front door로 진입</title></path>
<polygon data-arrowhead="root.0.1.1" points="1020.000,368.650 1010.000,374.650 1010.000,362.650" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 1836.000 368.650 L 1848.000 368.650 L 1848.000 488.050 L 72.000 488.050 L 72.000 668.850 L 84.000 668.850" fill="none" stroke="#475569" stroke-width="3"><title>priority 순서로 검사</title></path>
<polygon data-arrowhead="root.0.1.3" points="84.000,668.850 74.000,674.850 74.000,662.850" fill="#475569"/>
<path data-edge="root.0.1.5" data-from="root.0.1.4" data-to="root.0.1.6" d="M 900.000 668.850 L 1020.000 668.850" fill="none" stroke="#475569" stroke-width="3"><title>action 결과</title></path>
<polygon data-arrowhead="root.0.1.5" points="1020.000,668.850 1010.000,674.850 1010.000,662.850" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="260.650" font-size="36" font-weight="700" fill="#111827">AWS WAF는 origin이 아니라 entry point에서 request를 평가한다</text>
<text data-source="root.0.1.0" x="120.000" y="357.600" font-size="28" font-weight="700" fill="#111827">Client</text>
<text data-source="root.0.1.0" x="120.000" y="400.000" font-size="22" font-weight="400" fill="#111827">HTTP(S) request</text>
<text data-source="root.0.1.2" x="1056.000" y="357.600" font-size="28" font-weight="700" fill="#111827">CloudFront, ALB or API Gateway</text>
<text data-source="root.0.1.2" x="1056.000" y="400.000" font-size="22" font-weight="400" fill="#111827">Web ACL을 associate할 수 있는 entry point</text>
<text data-source="root.0.1.4" x="120.000" y="657.800" font-size="28" font-weight="700" fill="#111827">AWS WAF Web ACL</text>
<text data-source="root.0.1.4" x="120.000" y="700.200" font-size="22" font-weight="400" fill="#111827">Allow, Block, Count, CAPTCHA; 미종료 시 default action</text>
<text data-source="root.0.1.6.0.0" x="1056.000" y="588.050" font-size="28" font-weight="700" fill="#111827">Allow</text>
<text data-source="root.0.1.6.0.1" x="1080.000" y="673.850" font-size="28" font-weight="700" fill="#111827">Application origin</text>
<text data-source="root.0.1.6.0.1" x="1080.000" y="716.250" font-size="22" font-weight="400" fill="#111827">EC2, NLB, EKS; entry point를</text>
<text data-source="root.0.1.6.0.1" x="1080.000" y="745.950" font-size="22" font-weight="400" fill="#111827">통해서만 도달</text>
<text data-source="root.0.1.6.1.0" x="1464.000" y="588.050" font-size="28" font-weight="700" fill="#111827">Block</text>
<text data-source="root.0.1.6.1.1" x="1488.000" y="673.850" font-size="28" font-weight="700" fill="#111827">Blocked</text>
<text data-source="root.0.1.6.1.1" x="1488.000" y="716.250" font-size="22" font-weight="400" fill="#111827">origin에 도달하기 전 403</text>
<text data-source="root.0.1.1" x="892.000" y="319.250" font-size="22" font-weight="400" fill="#111827">지원된 front</text>
<text data-source="root.0.1.1" x="892.000" y="348.950" font-size="22" font-weight="400" fill="#111827">door로 진입</text>
<text data-source="root.0.1.3" x="104.000" y="480.050" font-size="22" font-weight="400" fill="#111827">priority 순서로 검사</text>
<text data-source="root.0.1.5" x="892.000" y="649.150" font-size="22" font-weight="400" fill="#111827">action 결과</text>
<text data-source="root.0.2" x="64.000" y="847.650" font-size="22" font-weight="400" fill="#111827">EC2, NLB, EKS Pod에는 Web ACL을 직접 연결할 수 없습니다. public origin이 entry point를 우회하지 않도록 제한해야 합니다.</text>
</svg>
