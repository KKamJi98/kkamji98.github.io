<text data-source="root.0.0" x="64.000" y="199.150" font-size="36" font-weight="700" fill="#111827">Partition pruning은 Athena가 열 S3 prefix 수를 결정한다</text>
<text data-source="root.0.1.0" x="88.000" y="287.750" font-size="28" font-weight="700" fill="#111827">SQL query</text>
<text data-source="root.0.1.0" x="88.000" y="330.150" font-size="22" font-weight="400" fill="#111827">WHERE dt, region, hour</text>
<text data-source="root.0.1.1" x="996.000" y="287.750" font-size="28" font-weight="700" fill="#111827">Metadata 선택</text>
<text data-source="root.0.1.1" x="996.000" y="330.150" font-size="22" font-weight="400" fill="#111827">Glue Data Catalog의 registered partition list 또는 Athena partition projection의 date,</text>
<text data-source="root.0.1.1" x="996.000" y="359.850" font-size="22" font-weight="400" fill="#111827">enum, integer rules</text>
<text data-source="root.0.3" x="88.000" y="553.250" font-size="28" font-weight="700" fill="#111827">Athena planning</text>
<text data-source="root.0.3" x="88.000" y="595.650" font-size="22" font-weight="400" fill="#111827">partition list 조회 또는 projection 계산으로 prefix 선택</text>
<text data-source="root.0.5" x="88.000" y="789.050" font-size="28" font-weight="700" fill="#111827">S3 prefixes scanned</text>
<text data-source="root.0.5" x="88.000" y="831.450" font-size="22" font-weight="400" fill="#111827">선택된 locations만 읽음</text>
<text data-source="root.0.6" x="64.000" y="909.150" font-size="22" font-weight="400" fill="#111827">Partition projection은 Athena 기능이며 등록 partition list를 조회하지 않습니다. Redshift Spectrum 같은 다른 engine은 catalog partition을 읽습니다.</text>
<text data-source="root.0.2" x="980.000" y="453.550" font-size="22" font-weight="400" fill="#111827">SQL predicate와 설정된 metadata를 함께 입력</text>
