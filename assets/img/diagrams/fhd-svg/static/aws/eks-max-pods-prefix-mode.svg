<text data-source="root.0.0" x="64.000" y="109.550" font-size="36" font-weight="700" fill="#111827">Prefix mode는 ENI slot 하나가 건네는 IP 수를 키운다</text>
<text data-source="root.0.1.0" x="88.000" y="198.150" font-size="28" font-weight="700" fill="#111827">EKS worker node</text>
<text data-source="root.0.1.1.0" x="144.000" y="292.300" font-size="28" font-weight="700" fill="#111827">Pod requests an IP</text>
<text data-source="root.0.1.1.0" x="144.000" y="334.700" font-size="22" font-weight="400" fill="#111827">scheduler가 Pod 배치</text>
<text data-source="root.0.1.1.2" x="1056.000" y="292.300" font-size="28" font-weight="700" fill="#111827">Amazon VPC CNI</text>
<text data-source="root.0.1.1.2" x="1056.000" y="334.700" font-size="22" font-weight="400" fill="#111827">ipamd가 IP 자원을 관리</text>
<text data-source="root.0.1.1.4.0.0" x="144.000" y="522.750" font-size="28" font-weight="700" fill="#111827">Secondary IP mode</text>
<text data-source="root.0.1.1.4.0.1" x="168.000" y="608.550" font-size="28" font-weight="700" fill="#111827">ENI slot = one IP</text>
<text data-source="root.0.1.1.4.0.1" x="168.000" y="650.950" font-size="22" font-weight="400" fill="#111827">각 Pod에 secondary IP 하나</text>
<text data-source="root.0.1.1.4.1.0" x="540.000" y="522.750" font-size="28" font-weight="700" fill="#111827">Prefix delegation</text>
<text data-source="root.0.1.1.4.1.1" x="564.000" y="608.550" font-size="28" font-weight="700" fill="#111827">ENI prefix</text>
<text data-source="root.0.1.1.4.1.1" x="564.000" y="650.950" font-size="22" font-weight="400" fill="#111827">slot마다 /28 prefix = 16 IPs</text>
<text data-source="root.0.1.1.6" x="1056.000" y="577.650" font-size="28" font-weight="700" fill="#111827">Node IP capacity</text>
<text data-source="root.0.1.1.6" x="1056.000" y="620.050" font-size="22" font-weight="400" fill="#111827">prefix mode에서 address pool이 크게 증가</text>
<text data-source="root.0.1.1.8" x="144.000" y="854.650" font-size="28" font-weight="700" fill="#111827">max-pods</text>
<text data-source="root.0.1.1.8" x="144.000" y="897.050" font-size="22" font-weight="400" fill="#111827">t4g.small 계산값 146, low-CPU ceiling은 110</text>
<text data-source="root.0.1.1.1" x="892.000" y="253.950" font-size="22" font-weight="400" fill="#111827">warm</text>
<text data-source="root.0.1.1.1" x="892.000" y="283.650" font-size="22" font-weight="400" fill="#111827">pool에서 할당</text>
<text data-source="root.0.1.1.3" x="128.000" y="414.750" font-size="22" font-weight="400" fill="#111827">address mode 선택</text>
<text data-source="root.0.1.1.5" x="892.000" y="539.300" font-size="22" font-weight="400" fill="#111827">ENIs x slots x</text>
<text data-source="root.0.1.1.5" x="892.000" y="569.000" font-size="22" font-weight="400" fill="#111827">address 수</text>
<text data-source="root.0.1.1.7" x="128.000" y="746.650" font-size="22" font-weight="400" fill="#111827">kubelet admission limit</text>
<text data-source="root.0.2" x="64.000" y="998.750" font-size="22" font-weight="400" fill="#111827">Prefix mode를 켜도 kubelet의 max-pods 설정은 별도로 갱신해야 하며, 실제 반영에는 node replacement가 필요합니다.</text>
</svg>
