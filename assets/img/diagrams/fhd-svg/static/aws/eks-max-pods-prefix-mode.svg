<path data-edge="root.0.1.1.1" data-from="root.0.1.1.0" data-to="root.0.1.1.2" d="M 900.000 300.600 L 1020.000 300.600" fill="none" stroke="#475569" stroke-width="3"><title>warm pool에서 할당</title></path>
