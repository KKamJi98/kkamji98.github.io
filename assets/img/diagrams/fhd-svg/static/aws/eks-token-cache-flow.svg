<polygon data-arrowhead="root.0.1.5" points="1020.000,664.800 1010.000,670.800 1010.000,658.800" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="198.300" font-size="36" font-weight="700" fill="#111827">Wrapper가 없으면 모든 kubectl 호출이 새 EKS token을 발급한다</text>
<text data-source="root.0.1.0" x="116.000" y="285.800" font-size="24" font-weight="700" fill="#111827">kubectl</text>
<text data-source="root.0.1.0" x="116.000" y="325.000" font-size="20" font-weight="400" fill="#111827">~/.kube/config의 exec block을 읽음</text>
<text data-source="root.0.1.2" x="1052.000" y="285.800" font-size="24" font-weight="700" fill="#111827">kubeconfig exec credential</text>
<text data-source="root.0.1.2" x="1052.000" y="325.000" font-size="20" font-weight="400" fill="#111827">기본값은 매번 AWS CLI 실행</text>
<text data-source="root.0.1.4" x="116.000" y="653.700" font-size="24" font-weight="700" fill="#111827">eks-token-cache.sh</text>
<text data-source="root.0.1.4" x="116.000" y="692.900" font-size="20" font-weight="400" fill="#111827">cluster와 profile별 cache; remaining validity 확인</text>
<text data-source="root.0.1.6.0.0" x="1052.000" y="502.900" font-size="24" font-weight="700" fill="#111827">Cache still valid</text>
<text data-source="root.0.1.6.0.1.0" x="1072.000" y="575.300" font-size="24" font-weight="700" fill="#111827">Cached ExecCredential</text>
<text data-source="root.0.1.6.0.1.0" x="1072.000" y="614.500" font-size="20" font-weight="400" fill="#111827">expiration 전이면 token 재사용</text>
<text data-source="root.0.1.6.0.1.2" x="1072.000" y="784.500" font-size="24" font-weight="700" fill="#111827">EKS API server</text>
<text data-source="root.0.1.6.0.1.2" x="1072.000" y="823.700" font-size="20" font-weight="400" fill="#111827">token 검증 후 RBAC 적용</text>
<text data-source="root.0.1.6.0.1.1" x="1245.000" y="697.500" font-size="20" font-weight="400" fill="#111827">AWS call 없음</text>
<text data-source="root.0.1.6.1.0" x="1458.000" y="502.900" font-size="24" font-weight="700" fill="#111827">Miss or near expiry</text>
<text data-source="root.0.1.6.1.1.0" x="1478.000" y="575.300" font-size="24" font-weight="700" fill="#111827">aws eks get-token</text>
<text data-source="root.0.1.6.1.1.0" x="1478.000" y="614.500" font-size="20" font-weight="400" fill="#111827">cache write; 만료 60초 전 갱신</text>
<text data-source="root.0.1.6.1.1.2" x="1478.000" y="784.500" font-size="24" font-weight="700" fill="#111827">EKS API server</text>
<text data-source="root.0.1.6.1.1.2" x="1478.000" y="823.700" font-size="20" font-weight="400" fill="#111827">token 검증 후 RBAC 적용</text>
<text data-source="root.0.1.6.1.1.1" x="1651.000" y="697.500" font-size="20" font-weight="400" fill="#111827">새 token 전달</text>
<text data-source="root.0.1.1" x="892.000" y="250.900" font-size="20" font-weight="400" fill="#111827">매 invocation</text>
<text data-source="root.0.1.1" x="892.000" y="277.900" font-size="20" font-weight="400" fill="#111827">실행</text>
<text data-source="root.0.1.3" x="104.000" y="402.900" font-size="20" font-weight="400" fill="#111827">cache lookup</text>
<text data-source="root.0.1.5" x="892.000" y="618.800" font-size="20" font-weight="400" fill="#111827">유효성에 따라</text>
<text data-source="root.0.1.5" x="892.000" y="645.800" font-size="20" font-weight="400" fill="#111827">분기</text>
<text data-source="root.0.2" x="64.000" y="910.700" font-size="20" font-weight="400" fill="#111827">EKS token은 발급 후 약 15분 유효합니다. Cache miss에서만 STS/EKS API 호출 비용과 지연이 발생합니다.</text>
</svg>
