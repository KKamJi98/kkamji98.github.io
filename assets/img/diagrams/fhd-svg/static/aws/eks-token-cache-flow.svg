<path data-edge="root.0.1.6.0.1.1" data-from="root.0.1.6.0.1.0" data-to="root.0.1.6.0.1.2" d="M 1225.000 653.500 L 1225.000 728.500" fill="none" stroke="#475569" stroke-width="3"><title>AWS call 없음</title></path>
