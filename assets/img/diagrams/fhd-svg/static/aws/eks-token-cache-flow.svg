<text data-source="root.0.0" x="64.000" y="131.700" font-size="36" font-weight="700" fill="#111827">Wrapper가 없으면 모든 kubectl 호출이 새 EKS token을 발급한다</text>
<text data-source="root.0.1.0" x="116.000" y="219.200" font-size="24" font-weight="700" fill="#111827">kubectl</text>
<text data-source="root.0.1.0" x="116.000" y="258.400" font-size="20" font-weight="400" fill="#111827">~/.kube/config의 exec block을 읽음</text>
<text data-source="root.0.1.2" x="1052.000" y="219.200" font-size="24" font-weight="700" fill="#111827">kubeconfig exec credential</text>
<text data-source="root.0.1.2" x="1052.000" y="258.400" font-size="20" font-weight="400" fill="#111827">기본값은 매번 AWS CLI 실행</text>
<text data-source="root.0.1.4" x="116.000" y="653.700" font-size="24" font-weight="700" fill="#111827">eks-token-cache.sh</text>
<text data-source="root.0.1.4" x="116.000" y="692.900" font-size="20" font-weight="400" fill="#111827">cluster와 profile별 cache; remaining validity 확인</text>
<text data-source="root.0.1.6.0.0" x="1076.000" y="460.300" font-size="24" font-weight="700" fill="#111827">Cache still valid</text>
<text data-source="root.0.1.6.0.1.0" x="1096.000" y="532.700" font-size="24" font-weight="700" fill="#111827">Cached</text>
<text data-source="root.0.1.6.0.1.0" x="1096.000" y="563.900" font-size="24" font-weight="700" fill="#111827">ExecCredential</text>
<text data-source="root.0.1.6.0.1.0" x="1096.000" y="603.100" font-size="20" font-weight="400" fill="#111827">expiration 전이면 token</text>
<text data-source="root.0.1.6.0.1.0" x="1096.000" y="630.100" font-size="20" font-weight="400" fill="#111827">재사용</text>
<text data-source="root.0.1.6.0.1.2" x="1096.000" y="827.100" font-size="24" font-weight="700" fill="#111827">EKS API server</text>
<text data-source="root.0.1.6.0.1.2" x="1096.000" y="866.300" font-size="20" font-weight="400" fill="#111827">token 검증 후 RBAC 적용</text>
<text data-source="root.0.1.6.0.1.1" x="1257.000" y="713.100" font-size="20" font-weight="400" fill="#111827">AWS call</text>
<text data-source="root.0.1.6.0.1.1" x="1257.000" y="740.100" font-size="20" font-weight="400" fill="#111827">없음</text>
<text data-source="root.0.1.6.1.0" x="1458.000" y="460.300" font-size="24" font-weight="700" fill="#111827">Miss or near expiry</text>
<text data-source="root.0.1.6.1.1.0" x="1478.000" y="532.700" font-size="24" font-weight="700" fill="#111827">aws eks get-token</text>
<text data-source="root.0.1.6.1.1.0" x="1478.000" y="571.900" font-size="20" font-weight="400" fill="#111827">cache write; 만료 60초 전</text>
<text data-source="root.0.1.6.1.1.0" x="1478.000" y="598.900" font-size="20" font-weight="400" fill="#111827">갱신</text>
<text data-source="root.0.1.6.1.1.2" x="1478.000" y="795.900" font-size="24" font-weight="700" fill="#111827">EKS API server</text>
<text data-source="root.0.1.6.1.1.2" x="1478.000" y="835.100" font-size="20" font-weight="400" fill="#111827">token 검증 후 RBAC 적용</text>
<text data-source="root.0.1.6.1.1.1" x="1639.000" y="681.900" font-size="20" font-weight="400" fill="#111827">새 token</text>
<text data-source="root.0.1.6.1.1.1" x="1639.000" y="708.900" font-size="20" font-weight="400" fill="#111827">전달</text>
<text data-source="root.0.1.1" x="892.000" y="184.300" font-size="20" font-weight="400" fill="#111827">매 invocation</text>
<text data-source="root.0.1.1" x="892.000" y="211.300" font-size="20" font-weight="400" fill="#111827">실행</text>
<text data-source="root.0.1.3" x="104.000" y="336.300" font-size="20" font-weight="400" fill="#111827">cache lookup</text>
<text data-source="root.0.1.5" x="892.000" y="618.800" font-size="20" font-weight="400" fill="#111827">유효성에 따라</text>
<text data-source="root.0.1.5" x="892.000" y="645.800" font-size="20" font-weight="400" fill="#111827">분기</text>
<text data-source="root.0.2" x="64.000" y="977.300" font-size="20" font-weight="400" fill="#111827">EKS token은 발급 후 약 15분 유효합니다. Cache miss에서만 STS/EKS API 호출 비용과 지연이 발생합니다.</text>
</svg>
