<text data-source="root.0.3" x="64.000" y="874.300" font-size="22" font-weight="400" fill="#111827">Glue는 데이터 전달 hop이 아닙니다. 등록 테이블 접근에는 IAM과 Lake Formation 권한이 모두 필요합니다.</text>
