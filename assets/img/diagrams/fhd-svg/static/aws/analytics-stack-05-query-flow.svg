<text data-source="root.0.0" x="64.000" y="178.900" font-size="36" font-weight="700" fill="#111827">Athena는 Glue를 묻고 S3를 읽고 결과도 S3에 쓴다</text>
<text data-source="root.0.1.0" x="120.000" y="267.500" font-size="28" font-weight="700" fill="#111827">Query author</text>
<text data-source="root.0.1.0" x="120.000" y="309.900" font-size="22" font-weight="400" fill="#111827">submits SQL</text>
<text data-source="root.0.1.2" x="1095.814" y="267.500" font-size="28" font-weight="700" fill="#111827">Amazon Athena</text>
<text data-source="root.0.1.2" x="1095.814" y="309.900" font-size="22" font-weight="400" fill="#111827">query engine; data를 보관하지 않음</text>
<text data-source="root.0.1.4.0.0" x="631.907" y="513.600" font-size="28" font-weight="700" fill="#111827">Metadata</text>
<text data-source="root.0.1.4.0.1" x="655.907" y="599.400" font-size="28" font-weight="700" fill="#111827">Glue Data</text>
<text data-source="root.0.1.4.0.1" x="655.907" y="635.800" font-size="28" font-weight="700" fill="#111827">Catalog</text>
<text data-source="root.0.1.4.0.1" x="655.907" y="678.200" font-size="22" font-weight="400" fill="#111827">schema, S3</text>
<text data-source="root.0.1.4.0.1" x="655.907" y="707.900" font-size="22" font-weight="400" fill="#111827">LOCATION,</text>
<text data-source="root.0.1.4.0.1" x="655.907" y="737.600" font-size="22" font-weight="400" fill="#111827">partitions</text>
<text data-source="root.0.1.4.1.0" x="874.636" y="513.600" font-size="28" font-weight="700" fill="#111827">Data scan</text>
<text data-source="root.0.1.4.1.1" x="898.636" y="599.400" font-size="28" font-weight="700" fill="#111827">Amazon</text>
<text data-source="root.0.1.4.1.1" x="898.636" y="635.800" font-size="28" font-weight="700" fill="#111827">S3</text>
<text data-source="root.0.1.4.1.1" x="898.636" y="678.200" font-size="22" font-weight="400" fill="#111827">Catalog가</text>
<text data-source="root.0.1.4.1.1" x="898.636" y="707.900" font-size="22" font-weight="400" fill="#111827">알려준</text>
<text data-source="root.0.1.4.1.1" x="898.636" y="737.600" font-size="22" font-weight="400" fill="#111827">data files</text>
<text data-source="root.0.1.4.2.0" x="1117.364" y="513.600" font-size="28" font-weight="700" fill="#111827">Result write</text>
<text data-source="root.0.1.4.2.1" x="1141.364" y="599.400" font-size="28" font-weight="700" fill="#111827">Results</text>
<text data-source="root.0.1.4.2.1" x="1141.364" y="635.800" font-size="28" font-weight="700" fill="#111827">bucket</text>
<text data-source="root.0.1.4.2.1" x="1141.364" y="672.200" font-size="28" font-weight="700" fill="#111827">(S3)</text>
<text data-source="root.0.1.4.2.1" x="1141.364" y="714.600" font-size="22" font-weight="400" fill="#111827">결과를 먼저</text>
<text data-source="root.0.1.4.2.1" x="1141.364" y="744.300" font-size="22" font-weight="400" fill="#111827">기록하고</text>
<text data-source="root.0.1.4.2.1" x="1141.364" y="774.000" font-size="22" font-weight="400" fill="#111827">client가</text>
<text data-source="root.0.1.4.2.1" x="1141.364" y="803.700" font-size="22" font-weight="400" fill="#111827">여기서 읽음</text>
<text data-source="root.0.1.1" x="852.186" y="258.850" font-size="22" font-weight="400" fill="#111827">StartQueryExecution</text>
<text data-source="root.0.1.3" x="972.000" y="381.600" font-size="22" font-weight="400" fill="#111827">Athena가 세 요청을 구동</text>
<text data-source="root.0.2" x="64.000" y="929.400" font-size="22" font-weight="400" fill="#111827">세 갈래는 서로의 순차 hop이 아닙니다. Athena가 metadata 조회, data scan, result write를 각각 수행합니다.</text>
