<text data-source="root.0.0" x="64.000" y="113.850" font-size="36" font-weight="700" fill="#111827">S3 Tables는 일반 Glue database보다 한 단계 깊은 catalog를 만든다</text>
<text data-source="root.0.1.0" x="108.000" y="464.100" font-size="18" font-weight="700" fill="#111827">Default catalog</text>
<text data-source="root.0.1.0" x="108.000" y="497.500" font-size="16" font-weight="400" fill="#111827">AwsDataCatalog</text>
<text data-source="root.0.1.2.0.0" x="1068.000" y="192.450" font-size="18" font-weight="700" fill="#111827">Regular Glue path</text>
<text data-source="root.0.1.2.0.1.0" x="1080.000" y="240.750" font-size="18" font-weight="700" fill="#111827">logs_db</text>
<text data-source="root.0.1.2.0.1.0" x="1080.000" y="274.150" font-size="16" font-weight="400" fill="#111827">default catalog에 직접 속한 database</text>
<text data-source="root.0.1.2.1.0" x="1446.000" y="192.450" font-size="18" font-weight="700" fill="#111827">S3 Tables federated path</text>
<text data-source="root.0.1.2.1.1.0" x="1458.000" y="240.750" font-size="18" font-weight="700" fill="#111827">s3tablescatalog</text>
<text data-source="root.0.1.2.1.1.0" x="1458.000" y="274.150" font-size="16" font-weight="400" fill="#111827">federated catalog</text>
<text data-source="root.0.1.2.1.1.2" x="1458.000" y="401.750" font-size="18" font-weight="700" fill="#111827">amzn-s3-demo-bucket</text>
<text data-source="root.0.1.2.1.1.2" x="1458.000" y="435.150" font-size="16" font-weight="400" fill="#111827">table bucket</text>
<text data-source="root.0.1.2.1.1.4" x="1458.000" y="562.750" font-size="18" font-weight="700" fill="#111827">sales_db</text>
<text data-source="root.0.1.2.1.1.4" x="1458.000" y="596.150" font-size="16" font-weight="400" fill="#111827">namespace</text>
<text data-source="root.0.1.2.1.1.6" x="1458.000" y="723.750" font-size="18" font-weight="700" fill="#111827">orders</text>
<text data-source="root.0.1.2.1.1.6" x="1458.000" y="757.150" font-size="16" font-weight="400" fill="#111827">table</text>
<text data-source="root.0.1.1" x="892.000" y="457.000" font-size="16" font-weight="400" fill="#111827">두 경로로 분기</text>
<text data-source="root.0.2.0" x="76.000" y="852.750" font-size="18" font-weight="700" fill="#111827">Regular database ARN</text>
<text data-source="root.0.2.0" x="76.000" y="886.150" font-size="16" font-weight="400" fill="#111827">arn:aws:glue:REGION:ACCOUNT:database/logs_db</text>
<text data-source="root.0.2.1" x="677.333" y="852.750" font-size="18" font-weight="700" fill="#111827">S3 Tables native ARN</text>
<text data-source="root.0.2.1" x="677.333" y="886.150" font-size="16" font-weight="400" fill="#111827">arn:aws:s3tables:REGION:ACCOUNT:bucket/{bucket}</text>
<text data-source="root.0.2.1" x="677.333" y="907.750" font-size="16" font-weight="400" fill="#111827">arn:aws:s3tables:REGION:ACCOUNT:bucket/{bucket}/table/{table-id}</text>
<text data-source="root.0.2.2" x="1278.667" y="852.750" font-size="18" font-weight="700" fill="#111827">Federated Glue ARN</text>
<text data-source="root.0.2.2" x="1278.667" y="886.150" font-size="16" font-weight="400" fill="#111827">arn:aws:glue:REGION:ACCOUNT:catalog/s3tablescatalog/{bucket}</text>
<text data-source="root.0.2.2" x="1278.667" y="907.750" font-size="16" font-weight="400" fill="#111827">arn:aws:glue:REGION:ACCOUNT:database/s3tablescatalog/{bucket}/{db}</text>
<text data-source="root.0.2.2" x="1278.667" y="929.350" font-size="16" font-weight="400" fill="#111827">arn:aws:glue:REGION:ACCOUNT:table/s3tablescatalog/{bucket}/{db}/{table}</text>
<text data-source="root.0.2.2" x="1278.667" y="950.950" font-size="16" font-weight="400" fill="#111827">Lake Formation Catalog Id: ACCOUNT:s3tablescatalog/{bucket}</text>
<text data-source="root.0.3" x="64.000" y="996.550" font-size="16" font-weight="400" fill="#111827">federated 경로가 깊어진 만큼 policy는 target뿐 아니라 ancestor ARN도 허용해야 합니다.</text>
