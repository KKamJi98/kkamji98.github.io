<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="3426735afb51e0ac771925d63dd93aed5172e3fe2564335b636295c5b589aef0">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-node="root.0.1.0" x="96.000" y="360.500" width="480.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.2" x="720.000" y="360.500" width="480.000" height="126.100" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect data-node="root.0.1.4" x="1344.000" y="360.500" width="480.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.6" x="408.000" y="635.500" width="480.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.8" x="1032.000" y="620.650" width="480.000" height="155.800" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 588.000 423.550 L 708.000 423.550" fill="none" stroke="#475569" stroke-width="3"><title>pre-install hook 실행 후 wait</title></path>
<polygon data-arrowhead="root.0.1.1" points="708.000,423.550 698.000,429.550 698.000,417.550" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 1212.000 423.550 L 1332.000 423.550" fill="none" stroke="#475569" stroke-width="3"><title>성공하면 다음 단계</title></path>
<polygon data-arrowhead="root.0.1.3" points="1332.000,423.550 1322.000,429.550 1322.000,417.550" fill="#475569"/>
<path data-edge="root.0.1.5" data-from="root.0.1.4" data-to="root.0.1.6" d="M 1584.000 498.600 L 1584.000 572.650 L 648.000 572.650 L 648.000 623.500" fill="none" stroke="#475569" stroke-width="3"><title>post-install hook 실행 후 wait</title></path>
<polygon data-arrowhead="root.0.1.5" points="648.000,623.500 642.000,613.500 654.000,613.500" fill="#475569"/>
<path data-edge="root.0.1.7" data-from="root.0.1.6" data-to="root.0.1.8" d="M 900.000 698.550 L 1020.000 698.550" fill="none" stroke="#475569" stroke-width="3"><title>hook 완료</title></path>
<polygon data-arrowhead="root.0.1.7" points="1020.000,698.550 1010.000,704.550 1010.000,692.550" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="285.850" font-size="36" font-weight="700" fill="#111827">Helm hook은 release 앞뒤에서 별도 resource로 실행된다</text>
<text data-source="root.0.1.0" x="120.000" y="412.500" font-size="28" font-weight="700" fill="#111827">helm install</text>
<text data-source="root.0.1.0" x="120.000" y="454.900" font-size="22" font-weight="400" fill="#111827">release 작업을 시작합니다.</text>
<text data-source="root.0.1.2" x="744.000" y="412.500" font-size="28" font-weight="700" fill="#111827">Pre-install hook</text>
<text data-source="root.0.1.2" x="744.000" y="454.900" font-size="22" font-weight="400" fill="#111827">Job이 성공해야 chart manifest를 적용합니다.</text>
<text data-source="root.0.1.4" x="1368.000" y="412.500" font-size="28" font-weight="700" fill="#111827">Release resources</text>
<text data-source="root.0.1.4" x="1368.000" y="454.900" font-size="22" font-weight="400" fill="#111827">chart가 렌더링한 manifest를 적용합니다.</text>
<text data-source="root.0.1.6" x="432.000" y="687.500" font-size="28" font-weight="700" fill="#111827">Post-install hook</text>
<text data-source="root.0.1.6" x="432.000" y="729.900" font-size="22" font-weight="400" fill="#111827">resource가 생성된 뒤 Job을 실행합니다.</text>
<text data-source="root.0.1.8" x="1056.000" y="672.650" font-size="28" font-weight="700" fill="#111827">Release deployed</text>
<text data-source="root.0.1.8" x="1056.000" y="715.050" font-size="22" font-weight="400" fill="#111827">hook resource는 release resource에</text>
<text data-source="root.0.1.8" x="1056.000" y="744.750" font-size="22" font-weight="400" fill="#111827">포함되지 않습니다.</text>
<text data-source="root.0.1.1" x="580.000" y="344.450" font-size="22" font-weight="400" fill="#111827">pre-install</text>
<text data-source="root.0.1.1" x="580.000" y="374.150" font-size="22" font-weight="400" fill="#111827">hook 실행 후</text>
<text data-source="root.0.1.1" x="580.000" y="403.850" font-size="22" font-weight="400" fill="#111827">wait</text>
<text data-source="root.0.1.3" x="1204.000" y="374.150" font-size="22" font-weight="400" fill="#111827">성공하면 다음</text>
<text data-source="root.0.1.3" x="1204.000" y="403.850" font-size="22" font-weight="400" fill="#111827">단계</text>
<text data-source="root.0.1.5" x="660.000" y="564.650" font-size="22" font-weight="400" fill="#111827">post-install hook 실행 후 wait</text>
<text data-source="root.0.1.7" x="892.000" y="678.850" font-size="22" font-weight="400" fill="#111827">hook 완료</text>
<text data-source="root.0.2" x="64.000" y="822.450" font-size="22" font-weight="400" fill="#111827">Pre-install을 포함한 hook이 실패하면 다음 phase로 진행하지 않습니다. hook은 별도 resource이며 release manifest와 수명이 다를 수 있습니다.</text>
</svg>
