<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 432.000 408.700 L 552.000 408.700" fill="none" stroke="#475569" stroke-width="3"><title>pre-install hook 실행 후 wait</title></path>
<polygon data-arrowhead="root.0.1.1" points="552.000,408.700 542.000,414.700 542.000,402.700" fill="#475569"/>
