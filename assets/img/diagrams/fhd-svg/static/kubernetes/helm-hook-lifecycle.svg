<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="3426735afb51e0ac771925d63dd93aed5172e3fe2564335b636295c5b589aef0">
