<path data-edge="root.0.1.7" data-from="root.0.1.6" data-to="root.0.1.8" d="M 1836.000 408.700 L 1848.000 408.700 L 1848.000 557.800 L 72.000 557.800 L 72.000 698.550 L 84.000 698.550" fill="none" stroke="#475569" stroke-width="3"><title>hook 완료</title></path>
<polygon data-arrowhead="root.0.1.7" points="84.000,698.550 74.000,704.550 74.000,692.550" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="271.000" font-size="36" font-weight="700" fill="#111827">Helm hook은 release 앞뒤에서 별도 resource로 실행된다</text>
<text data-source="root.0.1.0" x="120.000" y="397.650" font-size="28" font-weight="700" fill="#111827">helm install</text>
<text data-source="root.0.1.0" x="120.000" y="440.050" font-size="22" font-weight="400" fill="#111827">release 작업을 시작합니다.</text>
<text data-source="root.0.1.2" x="588.000" y="382.800" font-size="28" font-weight="700" fill="#111827">Pre-install hook</text>
<text data-source="root.0.1.2" x="588.000" y="425.200" font-size="22" font-weight="400" fill="#111827">Job이 성공해야 chart</text>
<text data-source="root.0.1.2" x="588.000" y="454.900" font-size="22" font-weight="400" fill="#111827">manifest를 적용합니다.</text>
<text data-source="root.0.1.4" x="1056.000" y="382.800" font-size="28" font-weight="700" fill="#111827">Release resources</text>
<text data-source="root.0.1.4" x="1056.000" y="425.200" font-size="22" font-weight="400" fill="#111827">chart가 렌더링한 manifest를</text>
<text data-source="root.0.1.4" x="1056.000" y="454.900" font-size="22" font-weight="400" fill="#111827">적용합니다.</text>
<text data-source="root.0.1.6" x="1524.000" y="382.800" font-size="28" font-weight="700" fill="#111827">Post-install hook</text>
<text data-source="root.0.1.6" x="1524.000" y="425.200" font-size="22" font-weight="400" fill="#111827">resource가 생성된 뒤 Job을</text>
<text data-source="root.0.1.6" x="1524.000" y="454.900" font-size="22" font-weight="400" fill="#111827">실행합니다.</text>
<text data-source="root.0.1.8" x="120.000" y="657.800" font-size="28" font-weight="700" fill="#111827">Release deployed</text>
<text data-source="root.0.1.8" x="120.000" y="700.200" font-size="22" font-weight="400" fill="#111827">hook resource는 release</text>
<text data-source="root.0.1.8" x="120.000" y="729.900" font-size="22" font-weight="400" fill="#111827">resource에 포함되지</text>
<text data-source="root.0.1.8" x="120.000" y="759.600" font-size="22" font-weight="400" fill="#111827">않습니다.</text>
<text data-source="root.0.1.1" x="424.000" y="329.600" font-size="22" font-weight="400" fill="#111827">pre-install</text>
<text data-source="root.0.1.1" x="424.000" y="359.300" font-size="22" font-weight="400" fill="#111827">hook 실행 후</text>
<text data-source="root.0.1.1" x="424.000" y="389.000" font-size="22" font-weight="400" fill="#111827">wait</text>
<text data-source="root.0.1.3" x="892.000" y="359.300" font-size="22" font-weight="400" fill="#111827">성공하면 다음</text>
<text data-source="root.0.1.3" x="892.000" y="389.000" font-size="22" font-weight="400" fill="#111827">단계</text>
<text data-source="root.0.1.5" x="1360.000" y="329.600" font-size="22" font-weight="400" fill="#111827">post-install</text>
<text data-source="root.0.1.5" x="1360.000" y="359.300" font-size="22" font-weight="400" fill="#111827">hook 실행 후</text>
<text data-source="root.0.1.5" x="1360.000" y="389.000" font-size="22" font-weight="400" fill="#111827">wait</text>
<text data-source="root.0.1.7" x="104.000" y="549.800" font-size="22" font-weight="400" fill="#111827">hook 완료</text>
<text data-source="root.0.2" x="64.000" y="837.300" font-size="22" font-weight="400" fill="#111827">Pre-install을 포함한 hook이 실패하면 다음 phase로 진행하지 않습니다. hook은 별도 resource이며 release manifest와 수명이 다를 수 있습니다.</text>
</svg>
