<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="568f98ac0c88b4bd135439b1ebd495090ec311a56d39dab4a79ee5e766798b3e">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-node="root.0.1.0" x="96.000" y="360.500" width="480.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.2" x="720.000" y="345.650" width="480.000" height="155.800" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect data-node="root.0.1.4" x="1344.000" y="345.650" width="480.000" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.6" x="408.000" y="650.350" width="480.000" height="155.800" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.1.8" x="1032.000" y="665.200" width="480.000" height="126.100" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 588.000 423.550 L 708.000 423.550" fill="none" stroke="#475569" stroke-width="3"><title>short-lived token 전달</title></path>
<polygon data-arrowhead="root.0.1.1" points="708.000,423.550 698.000,429.550 698.000,417.550" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 1212.000 423.550 L 1332.000 423.550" fill="none" stroke="#475569" stroke-width="3"><title>private network에서 registration 요청</title></path>
<polygon data-arrowhead="root.0.1.3" points="1332.000,423.550 1322.000,429.550 1322.000,417.550" fill="#475569"/>
<path data-edge="root.0.1.5" data-from="root.0.1.4" data-to="root.0.1.6" d="M 1584.000 513.450 L 1584.000 602.350 L 648.000 602.350 L 648.000 638.350" fill="none" stroke="#475569" stroke-width="3"><title>Node object 등록</title></path>
<polygon data-arrowhead="root.0.1.5" points="648.000,638.350 642.000,628.350 654.000,628.350" fill="#475569"/>
<path data-edge="root.0.1.7" data-from="root.0.1.6" data-to="root.0.1.8" d="M 900.000 728.250 L 1020.000 728.250" fill="none" stroke="#475569" stroke-width="3"><title>scheduler가 node 사용</title></path>
<polygon data-arrowhead="root.0.1.7" points="1020.000,728.250 1010.000,734.250 1010.000,722.250" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="256.150" font-size="36" font-weight="700" fill="#111827">MicroK8s worker는 control plane이 만든 token으로 join한다</text>
<text data-source="root.0.1.0" x="120.000" y="412.500" font-size="28" font-weight="700" fill="#111827">MicroK8s control plane</text>
<text data-source="root.0.1.0" x="120.000" y="454.900" font-size="22" font-weight="400" fill="#111827">microk8s add-node로 join 정보를 발급합니다.</text>
<text data-source="root.0.1.2" x="744.000" y="397.650" font-size="28" font-weight="700" fill="#111827">Join command</text>
<text data-source="root.0.1.2" x="744.000" y="440.050" font-size="22" font-weight="400" fill="#111827">microk8s join ... --worker가 token을</text>
<text data-source="root.0.1.2" x="744.000" y="469.750" font-size="22" font-weight="400" fill="#111827">운반합니다.</text>
<text data-source="root.0.1.4" x="1368.000" y="397.650" font-size="28" font-weight="700" fill="#111827">Worker node</text>
<text data-source="root.0.1.4" x="1368.000" y="440.050" font-size="22" font-weight="400" fill="#111827">microk8s join을 실행하고 workload 역할로</text>
<text data-source="root.0.1.4" x="1368.000" y="469.750" font-size="22" font-weight="400" fill="#111827">참여합니다.</text>
<text data-source="root.0.1.6" x="432.000" y="702.350" font-size="28" font-weight="700" fill="#111827">Cluster registration</text>
<text data-source="root.0.1.6" x="432.000" y="744.750" font-size="22" font-weight="400" fill="#111827">cluster에 Node object가 나타나고 Ready를</text>
<text data-source="root.0.1.6" x="432.000" y="774.450" font-size="22" font-weight="400" fill="#111827">확인합니다.</text>
<text data-source="root.0.1.8" x="1056.000" y="717.200" font-size="28" font-weight="700" fill="#111827">Scheduled workloads</text>
<text data-source="root.0.1.8" x="1056.000" y="759.600" font-size="22" font-weight="400" fill="#111827">worker가 Pod 실행 capacity를 제공합니다.</text>
<text data-source="root.0.1.1" x="580.000" y="374.150" font-size="22" font-weight="400" fill="#111827">short-lived</text>
<text data-source="root.0.1.1" x="580.000" y="403.850" font-size="22" font-weight="400" fill="#111827">token 전달</text>
<text data-source="root.0.1.3" x="1204.000" y="314.750" font-size="22" font-weight="400" fill="#111827">private</text>
<text data-source="root.0.1.3" x="1204.000" y="344.450" font-size="22" font-weight="400" fill="#111827">network에서</text>
<text data-source="root.0.1.3" x="1204.000" y="374.150" font-size="22" font-weight="400" fill="#111827">registration</text>
<text data-source="root.0.1.3" x="1204.000" y="403.850" font-size="22" font-weight="400" fill="#111827">요청</text>
<text data-source="root.0.1.5" x="660.000" y="594.350" font-size="22" font-weight="400" fill="#111827">Node object 등록</text>
<text data-source="root.0.1.7" x="892.000" y="678.850" font-size="22" font-weight="400" fill="#111827">scheduler가</text>
<text data-source="root.0.1.7" x="892.000" y="708.550" font-size="22" font-weight="400" fill="#111827">node 사용</text>
<text data-source="root.0.2" x="64.000" y="852.150" font-size="22" font-weight="400" fill="#111827">stale token은 registration 단계에서 실패합니다. worker 추가는 workload capacity를 늘리지만 control plane HA나 datastore quorum을 늘리지는 않습니다.</text>
</svg>
