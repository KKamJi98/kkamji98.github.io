<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="af960f2e0a12379dbb0332ec9d2801f51623e7c3620736fe43a4cfb7006cffd6">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-source="root.0.2.0" x="64.000" y="288.200" width="884.000" height="642.900" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.2.1" x="972.000" y="288.200" width="884.000" height="371.400" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-node="root.0.1" x="64.000" y="138.100" width="1792.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.0.1.0" x="120.000" y="388.850" width="314.000" height="185.500" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.2.0.1.2" x="578.000" y="374.000" width="314.000" height="215.200" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.0.1.4" x="120.000" y="685.200" width="314.000" height="221.900" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.1.1.0" x="1028.000" y="426.900" width="314.000" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.1.1.2" x="1486.000" y="412.050" width="314.000" height="185.500" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<path data-edge="root.0.2.0.1.1" data-from="root.0.2.0.1.0" data-to="root.0.2.0.1.2" d="M 446.000 481.600 L 566.000 481.600" fill="none" stroke="#475569" stroke-width="3"><title>flow log 기록</title></path>
<polygon data-arrowhead="root.0.2.0.1.1" points="566.000,481.600 556.000,487.600 556.000,475.600" fill="#475569"/>
<path data-edge="root.0.2.0.1.3" data-from="root.0.2.0.1.2" data-to="root.0.2.0.1.4" d="M 904.000 481.600 L 916.000 481.600 L 916.000 637.200 L 96.000 637.200 L 96.000 796.150 L 108.000 796.150" fill="none" stroke="#475569" stroke-width="3"><title>별도 로그 수집기가 파일을 읽음</title></path>
<polygon data-arrowhead="root.0.2.0.1.3" points="108.000,796.150 98.000,802.150 98.000,790.150" fill="#475569"/>
<path data-edge="root.0.2.1.1.1" data-from="root.0.2.1.1.0" data-to="root.0.2.1.1.2" d="M 1354.000 504.800 L 1474.000 504.800" fill="none" stroke="#475569" stroke-width="3"><title>Hubble metrics endpoint를 scrape 요청</title></path>
<polygon data-arrowhead="root.0.2.1.1.1" points="1474.000,504.800 1464.000,510.800 1464.000,498.800" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="101.500" font-size="36" font-weight="700" fill="#111827">Hubble exporter는 flow log를 파일로 내보냅니다</text>
<text data-source="root.0.1" x="88.000" y="190.100" font-size="28" font-weight="700" fill="#111827">Cilium agent / Hubble flow events</text>
<text data-source="root.0.1" x="88.000" y="232.500" font-size="22" font-weight="400" fill="#111827">node마다 DaemonSet Pod 하나; eBPF observation point의 network flow를 관측</text>
<text data-source="root.0.2.0.0" x="88.000" y="340.200" font-size="28" font-weight="700" fill="#111827">Flow log export</text>
<text data-source="root.0.2.0.1.0" x="144.000" y="440.850" font-size="28" font-weight="700" fill="#111827">Hubble exporter</text>
<text data-source="root.0.2.0.1.0" x="144.000" y="483.250" font-size="22" font-weight="400" fill="#111827">agent 안에서 filter와 field</text>
<text data-source="root.0.2.0.1.0" x="144.000" y="512.950" font-size="22" font-weight="400" fill="#111827">mask를 적용해 보존할</text>
<text data-source="root.0.2.0.1.0" x="144.000" y="542.650" font-size="22" font-weight="400" fill="#111827">flow를 선택</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="426.000" font-size="28" font-weight="700" fill="#111827">로그 파일</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="468.400" font-size="22" font-weight="400" fill="#111827">예:</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="498.100" font-size="22" font-weight="400" fill="#111827">/var/run/cilium/hubble/</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="527.800" font-size="22" font-weight="400" fill="#111827">events.log; rotation과</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="557.500" font-size="22" font-weight="400" fill="#111827">size limit 적용</text>
<text data-source="root.0.2.0.1.4" x="144.000" y="737.200" font-size="28" font-weight="700" fill="#111827">외부 로그</text>
<text data-source="root.0.2.0.1.4" x="144.000" y="773.600" font-size="28" font-weight="700" fill="#111827">파이프라인</text>
<text data-source="root.0.2.0.1.4" x="144.000" y="816.000" font-size="22" font-weight="400" fill="#111827">Loki, Elasticsearch 등의</text>
<text data-source="root.0.2.0.1.4" x="144.000" y="845.700" font-size="22" font-weight="400" fill="#111827">수집과 장기 저장은 별도</text>
<text data-source="root.0.2.0.1.4" x="144.000" y="875.400" font-size="22" font-weight="400" fill="#111827">구성</text>
<text data-source="root.0.2.0.1.1" x="438.000" y="461.900" font-size="22" font-weight="400" fill="#111827">flow log 기록</text>
<text data-source="root.0.2.0.1.3" x="128.000" y="629.200" font-size="22" font-weight="400" fill="#111827">별도 로그 수집기가 파일을 읽음</text>
<text data-source="root.0.2.1.0" x="996.000" y="340.200" font-size="28" font-weight="700" fill="#111827">별도의 metrics 수집</text>
<text data-source="root.0.2.1.1.0" x="1052.000" y="478.900" font-size="28" font-weight="700" fill="#111827">Prometheus</text>
<text data-source="root.0.2.1.1.0" x="1052.000" y="521.300" font-size="22" font-weight="400" fill="#111827">flow metric을 주기적으로</text>
<text data-source="root.0.2.1.1.0" x="1052.000" y="551.000" font-size="22" font-weight="400" fill="#111827">수집하고 저장</text>
<text data-source="root.0.2.1.1.2" x="1510.000" y="464.050" font-size="28" font-weight="700" fill="#111827">Metrics endpoint</text>
<text data-source="root.0.2.1.1.2" x="1510.000" y="506.450" font-size="22" font-weight="400" fill="#111827">Hubble metrics 기능의</text>
<text data-source="root.0.2.1.1.2" x="1510.000" y="536.150" font-size="22" font-weight="400" fill="#111827">endpoint; flow log</text>
<text data-source="root.0.2.1.1.2" x="1510.000" y="565.850" font-size="22" font-weight="400" fill="#111827">exporter 출력이 아님</text>
<text data-source="root.0.2.1.1.1" x="1346.000" y="396.000" font-size="22" font-weight="400" fill="#111827">Hubble</text>
<text data-source="root.0.2.1.1.1" x="1346.000" y="425.700" font-size="22" font-weight="400" fill="#111827">metrics</text>
<text data-source="root.0.2.1.1.1" x="1346.000" y="455.400" font-size="22" font-weight="400" fill="#111827">endpoint를</text>
<text data-source="root.0.2.1.1.1" x="1346.000" y="485.100" font-size="22" font-weight="400" fill="#111827">scrape 요청</text>
<text data-source="root.0.3" x="64.000" y="977.100" font-size="22" font-weight="400" fill="#111827">agent memory의 ring buffer는 유한합니다. flow log를 장기 보존하려면 파일 export와 별도 보관 구성을 사용합니다. Static 또는 Dynamic 설정으로 filter와 field mask를</text>
<text data-source="root.0.3" x="64.000" y="1006.800" font-size="22" font-weight="400" fill="#111827">조정하며, Dynamic 설정은 재시작 없이 변경할 수 있습니다.</text>
</svg>
