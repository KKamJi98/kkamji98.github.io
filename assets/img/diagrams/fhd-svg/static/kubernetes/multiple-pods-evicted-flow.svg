<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="526676e47c8ce17f65c309a02bf8626f4ddb4ed93c2b33ba9cc145bcf277f911">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-node="root.0.1.0" x="96.000" y="322.450" width="480.000" height="155.800" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect data-node="root.0.1.2" x="720.000" y="337.300" width="480.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.4" x="1344.000" y="307.600" width="480.000" height="185.500" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect data-node="root.0.1.6" x="96.000" y="694.900" width="480.000" height="126.100" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect data-node="root.0.1.8" x="720.000" y="680.050" width="480.000" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.10" x="1344.000" y="680.050" width="480.000" height="155.800" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 588.000 400.350 L 708.000 400.350" fill="none" stroke="#475569" stroke-width="3"><title>node-level resource 회수</title></path>
<polygon data-arrowhead="root.0.1.1" points="708.000,400.350 698.000,406.350 698.000,394.350" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 1212.000 400.350 L 1332.000 400.350" fill="none" stroke="#475569" stroke-width="3"><title>회수만으로 pressure가 해소되지 않으면 Pod eviction</title></path>
<polygon data-arrowhead="root.0.1.3" points="1332.000,400.350 1322.000,406.350 1322.000,394.350" fill="#475569"/>
<path data-edge="root.0.1.5" data-from="root.0.1.4" data-to="root.0.1.6" d="M 1584.000 505.100 L 1584.000 608.850 L 336.000 608.850 L 336.000 682.900" fill="none" stroke="#475569" stroke-width="3"><title>Pod 종료 처리</title></path>
<polygon data-arrowhead="root.0.1.5" points="336.000,682.900 330.000,672.900 342.000,672.900" fill="#475569"/>
<path data-edge="root.0.1.7" data-from="root.0.1.6" data-to="root.0.1.8" d="M 588.000 757.950 L 708.000 757.950" fill="none" stroke="#475569" stroke-width="3"><title>controller가 재생성할 수 있음</title></path>
<polygon data-arrowhead="root.0.1.7" points="708.000,757.950 698.000,763.950 698.000,751.950" fill="#475569"/>
<path data-edge="root.0.1.9" data-from="root.0.1.8" data-to="root.0.1.10" d="M 1212.000 757.950 L 1332.000 757.950" fill="none" stroke="#475569" stroke-width="3"><title>disk를 회수한 뒤 복구</title></path>
<polygon data-arrowhead="root.0.1.9" points="1332.000,757.950 1322.000,763.950 1322.000,751.950" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="203.250" font-size="36" font-weight="700" fill="#111827">Disk pressure가 node를 unhealthy로 만들기 전에 kubelet이 Pod를 evict한다</text>
<text data-source="root.0.1.0" x="120.000" y="374.450" font-size="28" font-weight="700" fill="#111827">Node disk pressure</text>
<text data-source="root.0.1.0" x="120.000" y="416.850" font-size="22" font-weight="400" fill="#111827">nodefs 또는 imagefs가 threshold를</text>
<text data-source="root.0.1.0" x="120.000" y="446.550" font-size="22" font-weight="400" fill="#111827">넘습니다.</text>
<text data-source="root.0.1.2" x="744.000" y="389.300" font-size="28" font-weight="700" fill="#111827">Node-level reclamation</text>
<text data-source="root.0.1.2" x="744.000" y="431.700" font-size="22" font-weight="400" fill="#111827">미사용 image와 종료된 container를 회수</text>
<text data-source="root.0.1.4" x="1368.000" y="359.600" font-size="28" font-weight="700" fill="#111827">kubelet eviction</text>
<text data-source="root.0.1.4" x="1368.000" y="402.000" font-size="22" font-weight="400" fill="#111827">회수할 filesystem의 사용량, requests</text>
<text data-source="root.0.1.4" x="1368.000" y="431.700" font-size="22" font-weight="400" fill="#111827">초과 여부와 Pod priority로 candidate를</text>
<text data-source="root.0.1.4" x="1368.000" y="461.400" font-size="22" font-weight="400" fill="#111827">판단합니다.</text>
<text data-source="root.0.1.6" x="120.000" y="746.900" font-size="28" font-weight="700" fill="#111827">Evicted Pods</text>
<text data-source="root.0.1.6" x="120.000" y="789.300" font-size="22" font-weight="400" fill="#111827">phase는 Failed, reason은 Evicted입니다.</text>
<text data-source="root.0.1.8" x="744.000" y="732.050" font-size="28" font-weight="700" fill="#111827">Workload impact</text>
<text data-source="root.0.1.8" x="744.000" y="774.450" font-size="22" font-weight="400" fill="#111827">capacity가 부족하면 새 replica도 대기할</text>
<text data-source="root.0.1.8" x="744.000" y="804.150" font-size="22" font-weight="400" fill="#111827">수 있습니다.</text>
<text data-source="root.0.1.10" x="1368.000" y="732.050" font-size="28" font-weight="700" fill="#111827">Cleanup and recovery</text>
<text data-source="root.0.1.10" x="1368.000" y="774.450" font-size="22" font-weight="400" fill="#111827">disk를 reclaim하고 threshold와</text>
<text data-source="root.0.1.10" x="1368.000" y="804.150" font-size="22" font-weight="400" fill="#111827">monitoring을 다시 점검합니다.</text>
<text data-source="root.0.1.1" x="580.000" y="321.250" font-size="22" font-weight="400" fill="#111827">node-level</text>
<text data-source="root.0.1.1" x="580.000" y="350.950" font-size="22" font-weight="400" fill="#111827">resource</text>
<text data-source="root.0.1.1" x="580.000" y="380.650" font-size="22" font-weight="400" fill="#111827">회수</text>
<text data-source="root.0.1.3" x="1204.000" y="261.850" font-size="22" font-weight="400" fill="#111827">회수만으로</text>
<text data-source="root.0.1.3" x="1204.000" y="291.550" font-size="22" font-weight="400" fill="#111827">pressure가</text>
<text data-source="root.0.1.3" x="1204.000" y="321.250" font-size="22" font-weight="400" fill="#111827">해소되지</text>
<text data-source="root.0.1.3" x="1204.000" y="350.950" font-size="22" font-weight="400" fill="#111827">않으면 Pod</text>
<text data-source="root.0.1.3" x="1204.000" y="380.650" font-size="22" font-weight="400" fill="#111827">eviction</text>
<text data-source="root.0.1.5" x="348.000" y="600.850" font-size="22" font-weight="400" fill="#111827">Pod 종료 처리</text>
<text data-source="root.0.1.7" x="580.000" y="678.850" font-size="22" font-weight="400" fill="#111827">controller가</text>
<text data-source="root.0.1.7" x="580.000" y="708.550" font-size="22" font-weight="400" fill="#111827">재생성할 수</text>
<text data-source="root.0.1.7" x="580.000" y="738.250" font-size="22" font-weight="400" fill="#111827">있음</text>
<text data-source="root.0.1.9" x="1204.000" y="678.850" font-size="22" font-weight="400" fill="#111827">disk를</text>
<text data-source="root.0.1.9" x="1204.000" y="708.550" font-size="22" font-weight="400" fill="#111827">회수한 뒤</text>
<text data-source="root.0.1.9" x="1204.000" y="738.250" font-size="22" font-weight="400" fill="#111827">복구</text>
<text data-source="root.0.2" x="64.000" y="905.050" font-size="22" font-weight="400" fill="#111827">Eviction은 scheduler나 controller가 요청하는 작업이 아니라 kubelet의 node-local 결정입니다. image GC가 공간을 회수하지 못하면 같은 순환이 반복될 수 있습니다.</text>
</svg>
