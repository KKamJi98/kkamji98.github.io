<path data-edge="root.0.2.7" data-from="root.0.2.6" data-to="root.0.2.8" d="M 1836.000 435.550 L 1848.000 435.550 L 1848.000 576.300 L 72.000 576.300 L 72.000 702.200 L 84.000 702.200" fill="none" stroke="#475569" stroke-width="3"><title>NotRequired 적용 성공: 재시작 없음</title></path>
<polygon data-arrowhead="root.0.2.7" points="84.000,702.200 74.000,708.200 74.000,696.200" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="252.500" font-size="36" font-weight="700" fill="#111827">In-place resize는 Pod를 재생성하지 않고 container resource를 바꾼다</text>
<text data-source="root.0.1" x="64.000" y="311.100" font-size="22" font-weight="400" fill="#111827">Kubernetes v1.33: 적용 가능한 NotRequired resize의 성공 경로입니다. 요청이 거부되거나 node 자원 부족으로 지연될 수 있습니다.</text>
<text data-source="root.0.2.0" x="120.000" y="409.650" font-size="28" font-weight="700" fill="#111827">Resource patch</text>
<text data-source="root.0.2.0" x="120.000" y="452.050" font-size="22" font-weight="400" fill="#111827">resize subresource에 새</text>
<text data-source="root.0.2.0" x="120.000" y="481.750" font-size="22" font-weight="400" fill="#111827">request와 limit을 제출합니다.</text>
<text data-source="root.0.2.2" x="588.855" y="409.650" font-size="28" font-weight="700" fill="#111827">API server</text>
<text data-source="root.0.2.2" x="588.855" y="452.050" font-size="22" font-weight="400" fill="#111827">resize policy와 resource</text>
<text data-source="root.0.2.2" x="588.855" y="481.750" font-size="22" font-weight="400" fill="#111827">변경을 검증합니다.</text>
<text data-source="root.0.2.4" x="1057.710" y="394.800" font-size="28" font-weight="700" fill="#111827">kubelet</text>
<text data-source="root.0.2.4" x="1057.710" y="437.200" font-size="22" font-weight="400" fill="#111827">현재 node에서 적용 가능</text>
<text data-source="root.0.2.4" x="1057.710" y="466.900" font-size="22" font-weight="400" fill="#111827">여부를 판단하고 새 값을</text>
<text data-source="root.0.2.4" x="1057.710" y="496.600" font-size="22" font-weight="400" fill="#111827">적용합니다.</text>
<text data-source="root.0.2.6" x="1526.565" y="409.650" font-size="28" font-weight="700" fill="#111827">Container resources</text>
<text data-source="root.0.2.6" x="1526.565" y="452.050" font-size="22" font-weight="400" fill="#111827">container cgroup 값이 in</text>
<text data-source="root.0.2.6" x="1526.565" y="481.750" font-size="22" font-weight="400" fill="#111827">place로 갱신됩니다.</text>
<text data-source="root.0.2.8" x="120.000" y="676.300" font-size="28" font-weight="700" fill="#111827">Pod identity 유지</text>
<text data-source="root.0.2.8" x="120.000" y="718.700" font-size="22" font-weight="400" fill="#111827">같은 Pod 이름, node, IP에서</text>
<text data-source="root.0.2.8" x="120.000" y="748.400" font-size="22" font-weight="400" fill="#111827">container가 계속 실행됩니다.</text>
<text data-source="root.0.2.1" x="421.435" y="415.850" font-size="22" font-weight="400" fill="#111827">API validation</text>
<text data-source="root.0.2.3" x="890.290" y="386.150" font-size="22" font-weight="400" fill="#111827">node 변경</text>
<text data-source="root.0.2.3" x="890.290" y="415.850" font-size="22" font-weight="400" fill="#111827">전달</text>
<text data-source="root.0.2.5" x="1359.145" y="386.150" font-size="22" font-weight="400" fill="#111827">cgroup limits</text>
<text data-source="root.0.2.5" x="1359.145" y="415.850" font-size="22" font-weight="400" fill="#111827">update</text>
<text data-source="root.0.2.7" x="104.000" y="568.300" font-size="22" font-weight="400" fill="#111827">NotRequired 적용 성공: 재시작 없음</text>
<text data-source="root.0.3" x="64.000" y="826.100" font-size="22" font-weight="400" fill="#111827">RestartContainer 정책이면 container를 재시작해 적용하되 Pod는 재생성하지 않습니다. v1.33에서 memory limit 감소에는 memory의 resizePolicy[*].restartPolicy: RestartContainer가</text>
<text data-source="root.0.3" x="64.000" y="855.800" font-size="22" font-weight="400" fill="#111827">필요합니다.</text>
</svg>
