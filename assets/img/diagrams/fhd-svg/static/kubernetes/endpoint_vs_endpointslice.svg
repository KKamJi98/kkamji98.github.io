<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="9434226f84bc7775743c77636121833b132041f822550f33c3a567ba57e36dd7">
