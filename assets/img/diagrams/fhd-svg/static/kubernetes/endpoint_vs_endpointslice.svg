<rect data-node="root.0.2.1.1.4.1" x="1286.667" y="727.600" width="252.667" height="137.200" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.1.1.4.2" x="1559.333" y="727.600" width="252.667" height="137.200" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<path data-edge="root.0.2.0.1.1" data-from="root.0.2.0.1.0" data-to="root.0.2.0.1.2" d="M 447.000 367.300 L 567.000 367.300" fill="none" stroke="#475569" stroke-width="3"><title>single object</title></path>
<polygon data-arrowhead="root.0.2.0.1.1" points="567.000,367.300 557.000,373.300 557.000,361.300" fill="#475569"/>
<path data-edge="root.0.2.0.1.3" data-from="root.0.2.0.1.2" data-to="root.0.2.0.1.4" d="M 910.000 367.300 L 922.000 367.300 L 922.000 497.400 L 92.000 497.400 L 92.000 614.000 L 104.000 614.000" fill="none" stroke="#475569" stroke-width="3"><title>full list</title></path>
<polygon data-arrowhead="root.0.2.0.1.3" points="104.000,614.000 94.000,620.000 94.000,608.000" fill="#475569"/>
<path data-edge="root.0.2.1.1.1" data-from="root.0.2.1.1.0" data-to="root.0.2.1.1.2" d="M 1413.000 407.400 L 1413.000 482.400" fill="none" stroke="#475569" stroke-width="3"><title>slice set</title></path>
<polygon data-arrowhead="root.0.2.1.1.1" points="1413.000,482.400 1407.000,472.400 1419.000,472.400" fill="#475569"/>
<path data-edge="root.0.2.1.1.3" data-from="root.0.2.1.1.2" data-to="root.0.2.1.1.4" d="M 1413.000 616.600 L 1413.000 691.600" fill="none" stroke="#475569" stroke-width="3"><title>변경된 slice 단위로 갱신</title></path>
<polygon data-arrowhead="root.0.2.1.1.3" points="1413.000,691.600 1407.000,681.600 1419.000,681.600" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="133.200" font-size="36" font-weight="700" fill="#111827">EndpointSlice는 하나의 큰 Endpoints 객체를 여러 slice로 나눈다</text>
<text data-source="root.0.1" x="64.000" y="185.800" font-size="20" font-weight="400" fill="#111827">Kubernetes v1.33에서 core/v1 Endpoints는 deprecated 되었고, discovery.k8s.io/v1 EndpointSlice가 대규모 Service discovery의 기본 경로입니다.</text>
<text data-source="root.0.2.0.0" x="84.000" y="256.800" font-size="24" font-weight="700" fill="#111827">Endpoints (deprecated)</text>
<text data-source="root.0.2.0.1.0" x="136.000" y="342.700" font-size="24" font-weight="700" fill="#111827">Service</text>
<text data-source="root.0.2.0.1.0" x="136.000" y="381.900" font-size="20" font-weight="400" fill="#111827">selector로 backend Pod를</text>
<text data-source="root.0.2.0.1.0" x="136.000" y="408.900" font-size="20" font-weight="400" fill="#111827">선택합니다.</text>
<text data-source="root.0.2.0.1.2" x="599.000" y="329.200" font-size="24" font-weight="700" fill="#111827">Endpoints object</text>
<text data-source="root.0.2.0.1.2" x="599.000" y="368.400" font-size="20" font-weight="400" fill="#111827">이 1,000개 예시는 한 Service의</text>
<text data-source="root.0.2.0.1.2" x="599.000" y="395.400" font-size="20" font-weight="400" fill="#111827">address를 단일 객체에</text>
<text data-source="root.0.2.0.1.2" x="599.000" y="422.400" font-size="20" font-weight="400" fill="#111827">나열합니다.</text>
<text data-source="root.0.2.0.1.4" x="136.000" y="589.400" font-size="24" font-weight="700" fill="#111827">Pod-1 IP ... Pod-1000 IP</text>
<text data-source="root.0.2.0.1.4" x="136.000" y="628.600" font-size="20" font-weight="400" fill="#111827">작은 변경도 큰 객체 전체</text>
<text data-source="root.0.2.0.1.4" x="136.000" y="655.600" font-size="20" font-weight="400" fill="#111827">update가 됩니다.</text>
<text data-source="root.0.2.0.1.1" x="439.000" y="348.300" font-size="20" font-weight="400" fill="#111827">single object</text>
<text data-source="root.0.2.0.1.3" x="124.000" y="489.400" font-size="20" font-weight="400" fill="#111827">full list</text>
<text data-source="root.0.2.0.2" x="84.000" y="722.600" font-size="20" font-weight="400" fill="#111827">API Server, etcd와 kube-proxy가 큰 객체와 full update를 함께 처리해야 합니다.</text>
<text data-source="root.0.2.1.0" x="990.000" y="256.800" font-size="24" font-weight="700" fill="#111827">EndpointSlice</text>
<text data-source="root.0.2.1.1.0" x="1010.000" y="329.200" font-size="24" font-weight="700" fill="#111827">Service</text>
<text data-source="root.0.2.1.1.0" x="1010.000" y="368.400" font-size="20" font-weight="400" fill="#111827">같은 selector로 backend Pod를 선택합니다.</text>
<text data-source="root.0.2.1.1.2" x="1010.000" y="538.400" font-size="24" font-weight="700" fill="#111827">EndpointSlice objects</text>
<text data-source="root.0.2.1.1.2" x="1010.000" y="577.600" font-size="20" font-weight="400" fill="#111827">기본 최대 100 endpoints/slice입니다. 실제 배치는 연속 번호나 고정 크기가 아닙니다.</text>
<text data-source="root.0.2.1.1.4.0" x="1034.000" y="771.600" font-size="24" font-weight="700" fill="#111827">Slice-1</text>
<text data-source="root.0.2.1.1.4.0" x="1034.000" y="810.800" font-size="20" font-weight="400" fill="#111827">예: Pod-1 ... Pod-100 IP</text>
<text data-source="root.0.2.1.1.4.1" x="1306.667" y="771.600" font-size="24" font-weight="700" fill="#111827">Slice-2</text>
<text data-source="root.0.2.1.1.4.1" x="1306.667" y="810.800" font-size="20" font-weight="400" fill="#111827">예: Pod-101 ...</text>
<text data-source="root.0.2.1.1.4.1" x="1306.667" y="837.800" font-size="20" font-weight="400" fill="#111827">Pod-200 IP</text>
<text data-source="root.0.2.1.1.4.2" x="1579.333" y="771.600" font-size="24" font-weight="700" fill="#111827">Slice-3</text>
<text data-source="root.0.2.1.1.4.2" x="1579.333" y="810.800" font-size="20" font-weight="400" fill="#111827">예: Pod-201 ...</text>
<text data-source="root.0.2.1.1.4.2" x="1579.333" y="837.800" font-size="20" font-weight="400" fill="#111827">Pod-300 IP</text>
<text data-source="root.0.2.1.1.1" x="1433.000" y="451.400" font-size="20" font-weight="400" fill="#111827">slice set</text>
<text data-source="root.0.2.1.1.3" x="1433.000" y="660.600" font-size="20" font-weight="400" fill="#111827">변경된 slice 단위로 갱신</text>
<text data-source="root.0.2.1.2" x="990.000" y="928.800" font-size="20" font-weight="400" fill="#111827">앞의 세 slice만 표시한 개념 예시이며 나머지는 생략했습니다. addressType과 zone,</text>
<text data-source="root.0.2.1.2" x="990.000" y="955.800" font-size="20" font-weight="400" fill="#111827">node metadata도 함께 담습니다.</text>
</svg>
