<polygon data-arrowhead="root.0.1.5" points="1495.938,352.650 1485.938,358.650 1485.938,346.650" fill="#475569"/>
<path data-edge="root.0.2" data-from="root.0.1" data-to="root.0.3" d="M 960.000 499.600 L 960.000 585.300" fill="none" stroke="#475569" stroke-width="3"><title>match 결과에 따라 분기</title></path>
<polygon data-arrowhead="root.0.2" points="960.000,585.300 954.000,575.300 966.000,575.300" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="181.100" font-size="36" font-weight="700" fill="#111827">NGINX ingress controller가 backend 전에 Basic Auth를 확인한다</text>
<text data-source="root.0.1.0" x="144.000" y="326.750" font-size="28" font-weight="700" fill="#111827">Browser</text>
<text data-source="root.0.1.0" x="144.000" y="369.150" font-size="22" font-weight="400" fill="#111827">인증 실패 뒤 401을 받고</text>
<text data-source="root.0.1.0" x="144.000" y="398.850" font-size="22" font-weight="400" fill="#111827">다시 입력합니다.</text>
<text data-source="root.0.1.2" x="606.646" y="293.700" font-size="28" font-weight="700" fill="#111827">Authorization</text>
<text data-source="root.0.1.2" x="606.646" y="330.100" font-size="28" font-weight="700" fill="#111827">header</text>
<text data-source="root.0.1.2" x="606.646" y="372.500" font-size="22" font-weight="400" fill="#111827">Basic credential이</text>
<text data-source="root.0.1.2" x="606.646" y="402.200" font-size="22" font-weight="400" fill="#111827">담긴 HTTP</text>
<text data-source="root.0.1.2" x="606.646" y="431.900" font-size="22" font-weight="400" fill="#111827">header입니다.</text>
<text data-source="root.0.1.4" x="1069.292" y="293.700" font-size="28" font-weight="700" fill="#111827">NGINX ingress</text>
<text data-source="root.0.1.4" x="1069.292" y="330.100" font-size="28" font-weight="700" fill="#111827">controller</text>
<text data-source="root.0.1.4" x="1069.292" y="372.500" font-size="22" font-weight="400" fill="#111827">auth-type와</text>
<text data-source="root.0.1.4" x="1069.292" y="402.200" font-size="22" font-weight="400" fill="#111827">auth-secret을</text>
<text data-source="root.0.1.4" x="1069.292" y="431.900" font-size="22" font-weight="400" fill="#111827">읽습니다.</text>
<text data-source="root.0.1.6" x="1531.938" y="326.750" font-size="28" font-weight="700" fill="#111827">Auth Secret</text>
<text data-source="root.0.1.6" x="1531.938" y="369.150" font-size="22" font-weight="400" fill="#111827">auth key의 htpasswd</text>
<text data-source="root.0.1.6" x="1531.938" y="398.850" font-size="22" font-weight="400" fill="#111827">형식 값을 사용합니다.</text>
<text data-source="root.0.1.1" x="416.062" y="303.250" font-size="22" font-weight="400" fill="#111827">Authorization</text>
<text data-source="root.0.1.1" x="416.062" y="332.950" font-size="22" font-weight="400" fill="#111827">header 전송</text>
<text data-source="root.0.1.3" x="878.708" y="303.250" font-size="22" font-weight="400" fill="#111827">annotation</text>
<text data-source="root.0.1.3" x="878.708" y="332.950" font-size="22" font-weight="400" fill="#111827">규칙 적용</text>
<text data-source="root.0.1.5" x="1341.354" y="303.250" font-size="22" font-weight="400" fill="#111827">htpasswd와</text>
<text data-source="root.0.1.5" x="1341.354" y="332.950" font-size="22" font-weight="400" fill="#111827">credential 비교</text>
<text data-source="root.0.3.0.0" x="112.000" y="673.300" font-size="28" font-weight="700" fill="#111827">credential match</text>
<text data-source="root.0.3.0.1.0" x="136.000" y="759.100" font-size="28" font-weight="700" fill="#111827">Backend service</text>
<text data-source="root.0.3.0.1.0" x="136.000" y="801.500" font-size="22" font-weight="400" fill="#111827">인증이 맞을 때만 request를 전달받습니다.</text>
<text data-source="root.0.3.1.0" x="996.000" y="673.300" font-size="28" font-weight="700" fill="#111827">credential mismatch</text>
<text data-source="root.0.3.1.1.0" x="1020.000" y="759.100" font-size="28" font-weight="700" fill="#111827">401 Unauthorized</text>
<text data-source="root.0.3.1.1.0" x="1020.000" y="801.500" font-size="22" font-weight="400" fill="#111827">Browser가 다시 prompt하며 backend에는 header가 전달되지 않습니다.</text>
<text data-source="root.0.4" x="64.000" y="927.200" font-size="22" font-weight="400" fill="#111827">Basic Auth는 encoding이므로 TLS와 Secret 접근 제어를 함께 적용해야 합니다.</text>
<text data-source="root.0.2" x="980.000" y="549.600" font-size="22" font-weight="400" fill="#111827">match 결과에 따라 분기</text>
</svg>
