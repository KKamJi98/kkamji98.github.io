<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 424.062 352.650 L 570.646 352.650" fill="none" stroke="#475569" stroke-width="3"><title>Authorization header 전송</title></path>
<polygon data-arrowhead="root.0.1.1" points="570.646,352.650 560.646,358.650 560.646,346.650" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 886.708 352.650 L 1033.292 352.650" fill="none" stroke="#475569" stroke-width="3"><title>annotation 규칙 적용</title></path>
