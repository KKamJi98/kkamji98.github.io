<text data-source="root.0.0" x="64.000" y="127.600" font-size="36" font-weight="700" fill="#111827">External Secrets Operator가 외부 값을 Kubernetes Secret으로 동기화합니다</text>
<text data-source="root.0.1" x="76.000" y="182.200" font-size="18" font-weight="700" fill="#111827">AWS Secrets Manager</text>
<text data-source="root.0.1" x="76.000" y="215.600" font-size="16" font-weight="400" fill="#111827">외부 secret value 저장소</text>
<text data-source="root.0.3.0" x="76.000" y="343.200" font-size="18" font-weight="700" fill="#111827">Kubernetes Cluster</text>
<text data-source="root.0.3.1" x="88.000" y="391.500" font-size="18" font-weight="700" fill="#111827">External Secrets Operator</text>
<text data-source="root.0.3.1" x="88.000" y="424.900" font-size="16" font-weight="400" fill="#111827">ExternalSecret 리소스를 관찰하고 값을 동기화합니다.</text>
<text data-source="root.0.3.2" x="88.000" y="484.500" font-size="18" font-weight="700" fill="#111827">ClusterSecretStore</text>
<text data-source="root.0.3.2" x="88.000" y="517.900" font-size="16" font-weight="400" fill="#111827">cluster 범위의 provider와 인증 설정. namespace a/b의 ExternalSecret이 참조하는 공유 설정.</text>
<text data-source="root.0.3.3.0.0" x="88.000" y="577.500" font-size="18" font-weight="700" fill="#111827">namespace a</text>
<text data-source="root.0.3.3.0.1" x="100.000" y="625.800" font-size="18" font-weight="700" fill="#111827">ExternalSecret</text>
<text data-source="root.0.3.3.0.1" x="100.000" y="659.200" font-size="16" font-weight="400" fill="#111827">대상 key와 생성할 Secret을 선언. 같은 namespace의 SecretStore 또는 ClusterSecretStore를 참조.</text>
<text data-source="root.0.3.3.0.2" x="100.000" y="718.800" font-size="18" font-weight="700" fill="#111827">SecretStore</text>
<text data-source="root.0.3.3.0.2" x="100.000" y="752.200" font-size="16" font-weight="400" fill="#111827">namespace a의 provider와 인증 설정. namespace b에서는 참조할 수 없음.</text>
<text data-source="root.0.3.3.0.4" x="100.000" y="879.800" font-size="18" font-weight="700" fill="#111827">Kubernetes Secret</text>
<text data-source="root.0.3.3.0.4" x="100.000" y="913.200" font-size="16" font-weight="400" fill="#111827">namespace a에 생성 또는 갱신</text>
<text data-source="root.0.3.3.0.3" x="535.000" y="815.000" font-size="16" font-weight="400" fill="#111827">Operator가 읽은 값으로 reconcile</text>
<text data-source="root.0.3.3.1.0" x="978.000" y="577.500" font-size="18" font-weight="700" fill="#111827">namespace b</text>
<text data-source="root.0.3.3.1.1" x="990.000" y="625.800" font-size="18" font-weight="700" fill="#111827">ExternalSecret</text>
<text data-source="root.0.3.3.1.1" x="990.000" y="659.200" font-size="16" font-weight="400" fill="#111827">공유 ClusterSecretStore를 참조할 수 있음.</text>
<text data-source="root.0.3.3.1.3" x="990.000" y="786.800" font-size="18" font-weight="700" fill="#111827">Kubernetes Secret</text>
<text data-source="root.0.3.3.1.3" x="990.000" y="820.200" font-size="16" font-weight="400" fill="#111827">namespace b에 생성 또는 갱신</text>
<text data-source="root.0.3.3.1.2" x="1425.000" y="722.000" font-size="16" font-weight="400" fill="#111827">Operator가 읽은 값으로 reconcile</text>
<text data-source="root.0.3.4" x="76.000" y="970.800" font-size="16" font-weight="400" fill="#111827">ClusterExternalSecret은 cluster 범위이며 selector에 맞는 namespace에 ExternalSecret을 생성합니다. Secret은 각 ExternalSecret이 속한 namespace에만 생성됩니다.</text>
<text data-source="root.0.2" x="980.000" y="278.400" font-size="16" font-weight="400" fill="#111827">Operator의 provider read / secret value 반환</text>
</svg>
