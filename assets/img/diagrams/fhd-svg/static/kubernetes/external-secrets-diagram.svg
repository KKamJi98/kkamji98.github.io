<path data-edge="root.0.3.3.0.3" data-from="root.0.3.3.0.2" data-to="root.0.3.3.0.4" d="M 515.000 781.800 L 515.000 837.800" fill="none" stroke="#475569" stroke-width="3"><title>Operator가 읽은 값으로 reconcile</title></path>
