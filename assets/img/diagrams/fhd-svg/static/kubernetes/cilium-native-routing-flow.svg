<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="d0891264563adfc29c2d6ee25b2e79b0e68e11c08d29c2e7c72ac5c450417aca">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-node="root.0.1.0" x="96.000" y="345.650" width="310.331" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.2" x="568.557" y="345.650" width="310.331" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.4" x="1041.113" y="330.800" width="310.331" height="185.500" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect data-node="root.0.1.6" x="1513.669" y="345.650" width="310.331" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.8" x="96.000" y="612.300" width="310.331" height="155.800" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 418.331 423.550 L 556.557 423.550" fill="none" stroke="#475569" stroke-width="3"><title>Pod CIDR 조회</title></path>
<polygon data-arrowhead="root.0.1.1" points="556.557,423.550 546.557,429.550 546.557,417.550" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 890.887 423.550 L 1029.113 423.550" fill="none" stroke="#475569" stroke-width="3"><title>underlay route 확인</title></path>
<polygon data-arrowhead="root.0.1.3" points="1029.113,423.550 1019.113,429.550 1019.113,417.550" fill="#475569"/>
<path data-edge="root.0.1.5" data-from="root.0.1.4" data-to="root.0.1.6" d="M 1363.444 423.550 L 1501.669 423.550" fill="none" stroke="#475569" stroke-width="3"><title>encapsulation 없이 전달</title></path>
<polygon data-arrowhead="root.0.1.5" points="1501.669,423.550 1491.669,429.550 1491.669,417.550" fill="#475569"/>
<path data-edge="root.0.1.7" data-from="root.0.1.6" data-to="root.0.1.8" d="M 1836.000 423.550 L 1848.000 423.550 L 1848.000 564.300 L 72.000 564.300 L 72.000 690.200 L 84.000 690.200" fill="none" stroke="#475569" stroke-width="3"><title>source IP 유지</title></path>
<polygon data-arrowhead="root.0.1.7" points="84.000,690.200 74.000,696.200 74.000,684.200" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="294.200" font-size="36" font-weight="700" fill="#111827">Cilium Native Routing은 Pod CIDR 경로가 있어야 한다</text>
<text data-source="root.0.1.0" x="120.000" y="397.650" font-size="28" font-weight="700" fill="#111827">Source Pod</text>
<text data-source="root.0.1.0" x="120.000" y="440.050" font-size="22" font-weight="400" fill="#111827">Pod IP를 그대로 담은</text>
<text data-source="root.0.1.0" x="120.000" y="469.750" font-size="22" font-weight="400" fill="#111827">packet이 시작됩니다.</text>
<text data-source="root.0.1.2" x="592.557" y="397.650" font-size="28" font-weight="700" fill="#111827">Cilium routing table</text>
<text data-source="root.0.1.2" x="592.557" y="440.050" font-size="22" font-weight="400" fill="#111827">node별 Pod CIDR 경로를</text>
<text data-source="root.0.1.2" x="592.557" y="469.750" font-size="22" font-weight="400" fill="#111827">확인합니다.</text>
<text data-source="root.0.1.4" x="1065.113" y="382.800" font-size="28" font-weight="700" fill="#111827">Static route or BGP</text>
<text data-source="root.0.1.4" x="1065.113" y="425.200" font-size="22" font-weight="400" fill="#111827">경로가 없으면 packet은</text>
<text data-source="root.0.1.4" x="1065.113" y="454.900" font-size="22" font-weight="400" fill="#111827">drop되고 tunnel로 숨겨지지</text>
<text data-source="root.0.1.4" x="1065.113" y="484.600" font-size="22" font-weight="400" fill="#111827">않습니다.</text>
<text data-source="root.0.1.6" x="1537.669" y="397.650" font-size="28" font-weight="700" fill="#111827">Remote node</text>
<text data-source="root.0.1.6" x="1537.669" y="440.050" font-size="22" font-weight="400" fill="#111827">unencapsulated packet을</text>
<text data-source="root.0.1.6" x="1537.669" y="469.750" font-size="22" font-weight="400" fill="#111827">수신합니다.</text>
<text data-source="root.0.1.8" x="120.000" y="664.300" font-size="28" font-weight="700" fill="#111827">Destination Pod</text>
<text data-source="root.0.1.8" x="120.000" y="706.700" font-size="22" font-weight="400" fill="#111827">end to end에서 원본 source</text>
<text data-source="root.0.1.8" x="120.000" y="736.400" font-size="22" font-weight="400" fill="#111827">IP가 보존됩니다.</text>
<text data-source="root.0.1.1" x="410.331" y="403.850" font-size="22" font-weight="400" fill="#111827">Pod CIDR 조회</text>
<text data-source="root.0.1.3" x="882.887" y="374.150" font-size="22" font-weight="400" fill="#111827">underlay route</text>
<text data-source="root.0.1.3" x="882.887" y="403.850" font-size="22" font-weight="400" fill="#111827">확인</text>
<text data-source="root.0.1.5" x="1355.444" y="374.150" font-size="22" font-weight="400" fill="#111827">encapsulation</text>
<text data-source="root.0.1.5" x="1355.444" y="403.850" font-size="22" font-weight="400" fill="#111827">없이 전달</text>
<text data-source="root.0.1.7" x="104.000" y="556.300" font-size="22" font-weight="400" fill="#111827">source IP 유지</text>
<text data-source="root.0.2" x="64.000" y="814.100" font-size="22" font-weight="400" fill="#111827">Native Routing은 node 바깥의 라우팅을 대신하지 않습니다. Static route 또는 BGP가 각 Pod CIDR을 underlay에 알려야 합니다.</text>
</svg>
