<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="fead7f5d488aaabab0b319375fdf396ee250fd627a05d77361401e28b9f39818">
