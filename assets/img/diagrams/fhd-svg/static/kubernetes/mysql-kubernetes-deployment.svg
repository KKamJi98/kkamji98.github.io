<rect data-node="root.0.4.2" x="736.000" y="695.200" width="448.000" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.4.4" x="1376.000" y="710.050" width="448.000" height="126.100" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<path data-edge="root.0.4.1" data-from="root.0.4.0" data-to="root.0.4.2" d="M 556.000 773.100 L 724.000 773.100" fill="none" stroke="#475569" stroke-width="3"><title>노출 관계: Pod를 Service로 제공</title></path>
<polygon data-arrowhead="root.0.4.1" points="724.000,773.100 714.000,779.100 714.000,767.100" fill="#475569"/>
<path data-edge="root.0.4.3" data-from="root.0.4.2" data-to="root.0.4.4" d="M 1196.000 773.100 L 1364.000 773.100" fill="none" stroke="#475569" stroke-width="3"><title>노출 관계: Client에 Service 주소 제공</title></path>
<polygon data-arrowhead="root.0.4.3" points="1364.000,773.100 1354.000,779.100 1354.000,767.100" fill="#475569"/>
<path data-edge="root.0.3" data-from="root.0.2" data-to="root.0.4.0" d="M 960.000 597.500 L 960.000 640.350 L 320.000 640.350 L 320.000 683.200" fill="none" stroke="#475569" stroke-width="3"><title>두 입력을 Pod에 주입하고 mount</title></path>
<polygon data-arrowhead="root.0.3" points="320.000,683.200 314.000,673.200 326.000,673.200" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="211.300" font-size="36" font-weight="700" fill="#111827">MySQL Pod은 설정, Secret, volume이 연결된 뒤 Service로 제공된다</text>
<text data-source="root.0.1" x="64.000" y="269.900" font-size="22" font-weight="400" fill="#111827">ConfigMap과 Secret은 설정과 자격 증명을, PVC는 data directory를 제공합니다. 두 입력은 Pod spec에 직접 값을 굽지 않고 Pod에 주입되거나 mount됩니다.</text>
<text data-source="root.0.2.0.0" x="112.000" y="377.600" font-size="28" font-weight="700" fill="#111827">설정과 자격 증명</text>
<text data-source="root.0.2.0.1.0" x="136.000" y="463.400" font-size="28" font-weight="700" fill="#111827">ConfigMap and Secret</text>
<text data-source="root.0.2.0.1.0" x="136.000" y="505.800" font-size="22" font-weight="400" fill="#111827">server config와 password를 분리해 보관합니다.</text>
<text data-source="root.0.2.1.0" x="996.000" y="377.600" font-size="28" font-weight="700" fill="#111827">영속 데이터</text>
<text data-source="root.0.2.1.1.0" x="1020.000" y="463.400" font-size="28" font-weight="700" fill="#111827">PersistentVolumeClaim</text>
<text data-source="root.0.2.1.1.0" x="1020.000" y="505.800" font-size="22" font-weight="400" fill="#111827">MySQL data directory를 보존합니다.</text>
<text data-source="root.0.4.0" x="120.000" y="747.200" font-size="28" font-weight="700" fill="#111827">MySQL Pod</text>
<text data-source="root.0.4.0" x="120.000" y="789.600" font-size="22" font-weight="400" fill="#111827">ConfigMap, Secret, PVC를 모두 연결한 뒤</text>
<text data-source="root.0.4.0" x="120.000" y="819.300" font-size="22" font-weight="400" fill="#111827">시작합니다.</text>
<text data-source="root.0.4.2" x="760.000" y="747.200" font-size="28" font-weight="700" fill="#111827">Service</text>
<text data-source="root.0.4.2" x="760.000" y="789.600" font-size="22" font-weight="400" fill="#111827">cluster 안에서 접근할 고정 주소를</text>
<text data-source="root.0.4.2" x="760.000" y="819.300" font-size="22" font-weight="400" fill="#111827">제공합니다.</text>
<text data-source="root.0.4.4" x="1400.000" y="762.050" font-size="28" font-weight="700" fill="#111827">Client</text>
<text data-source="root.0.4.4" x="1400.000" y="804.450" font-size="22" font-weight="400" fill="#111827">Service 이름으로 MySQL에 접속합니다.</text>
<text data-source="root.0.4.1" x="556.000" y="723.700" font-size="22" font-weight="400" fill="#111827">노출 관계: Pod를</text>
<text data-source="root.0.4.1" x="556.000" y="753.400" font-size="22" font-weight="400" fill="#111827">Service로 제공</text>
<text data-source="root.0.4.3" x="1188.000" y="723.700" font-size="22" font-weight="400" fill="#111827">노출 관계: Client에</text>
<text data-source="root.0.4.3" x="1188.000" y="753.400" font-size="22" font-weight="400" fill="#111827">Service 주소 제공</text>
<text data-source="root.0.5" x="64.000" y="897.000" font-size="22" font-weight="400" fill="#111827">위 화살표는 설정 주입과 서비스 노출 관계입니다. 실제 접속 요청은 Client에서 Service 이름을 거쳐 MySQL Pod로 향합니다.</text>
<text data-source="root.0.3" x="980.000" y="647.500" font-size="22" font-weight="400" fill="#111827">두 입력을 Pod에 주입하고 mount</text>
</svg>
