<text data-source="root.0.0" x="64.000" y="157.000" font-size="36" font-weight="700" fill="#111827">eBPF hook은 file과 network 경로의 여러 kernel 지점에 붙는다</text>
<text data-source="root.0.1" x="64.000" y="197.600" font-size="16" font-weight="400" fill="#111827">Process는 user space에 있고, Linux Kernel 안의 syscall, VFS, socket, TCP/IP와 device 경계에서 eBPF 프로그램이 실행될 수 있습니다.</text>
<text data-source="root.0.2.0.0" x="76.000" y="245.200" font-size="18" font-weight="700" fill="#111827">File I/O path</text>
<text data-source="root.0.2.0.1.0" x="88.000" y="293.500" font-size="18" font-weight="700" fill="#111827">Process</text>
<text data-source="root.0.2.0.1.0" x="88.000" y="326.900" font-size="16" font-weight="400" fill="#111827">write()와 read()를 호출합니다.</text>
<text data-source="root.0.2.0.1.2.0" x="88.000" y="454.500" font-size="18" font-weight="700" fill="#111827">Linux Kernel</text>
<text data-source="root.0.2.0.1.2.1.0" x="132.000" y="502.800" font-size="18" font-weight="700" fill="#111827">Syscall hook</text>
<text data-source="root.0.2.0.1.2.1.0" x="132.000" y="536.200" font-size="16" font-weight="400" fill="#111827">syscall 지점에서 eBPF를 실행합니다.</text>
<text data-source="root.0.2.0.1.2.1.2" x="593.000" y="502.800" font-size="18" font-weight="700" fill="#111827">File Descriptor</text>
<text data-source="root.0.2.0.1.2.1.2" x="593.000" y="536.200" font-size="16" font-weight="400" fill="#111827">열린 파일을 kernel 객체와 연결합니다.</text>
<text data-source="root.0.2.0.1.2.1.4" x="132.000" y="690.600" font-size="18" font-weight="700" fill="#111827">VFS hook</text>
<text data-source="root.0.2.0.1.2.1.4" x="132.000" y="724.000" font-size="16" font-weight="400" fill="#111827">VFS 계층에서 file 동작을 관찰하거나</text>
<text data-source="root.0.2.0.1.2.1.4" x="132.000" y="745.600" font-size="16" font-weight="400" fill="#111827">제어합니다.</text>
<text data-source="root.0.2.0.1.2.1.6" x="593.000" y="679.800" font-size="18" font-weight="700" fill="#111827">Block Device hook</text>
<text data-source="root.0.2.0.1.2.1.6" x="593.000" y="713.200" font-size="16" font-weight="400" fill="#111827">block layer가 storage 요청을 처리하고</text>
<text data-source="root.0.2.0.1.2.1.6" x="593.000" y="734.800" font-size="16" font-weight="400" fill="#111827">device 경계에서 eBPF가 관찰할 수</text>
<text data-source="root.0.2.0.1.2.1.6" x="593.000" y="756.400" font-size="16" font-weight="400" fill="#111827">있습니다.</text>
<text data-source="root.0.2.0.1.2.1.1" x="441.000" y="495.700" font-size="16" font-weight="400" fill="#111827">descriptor lookup</text>
<text data-source="root.0.2.0.1.2.1.3" x="128.000" y="593.800" font-size="16" font-weight="400" fill="#111827">filesystem path</text>
<text data-source="root.0.2.0.1.2.1.5" x="441.000" y="694.300" font-size="16" font-weight="400" fill="#111827">device I/O</text>
<text data-source="root.0.2.0.1.4" x="88.000" y="896.000" font-size="18" font-weight="700" fill="#111827">Storage</text>
<text data-source="root.0.2.0.1.4" x="88.000" y="929.400" font-size="16" font-weight="400" fill="#111827">write 경로는 내려가고 read 결과는 반대 방향으로 돌아옵니다.</text>
<text data-source="root.0.2.0.1.1" x="529.000" y="389.700" font-size="16" font-weight="400" fill="#111827">system call 경계</text>
<text data-source="root.0.2.0.1.3" x="529.000" y="831.200" font-size="16" font-weight="400" fill="#111827">storage access</text>
<text data-source="root.0.2.1.0" x="978.000" y="245.200" font-size="18" font-weight="700" fill="#111827">Network I/O path</text>
<text data-source="root.0.2.1.1.0" x="990.000" y="293.500" font-size="18" font-weight="700" fill="#111827">Process</text>
<text data-source="root.0.2.1.1.0" x="990.000" y="326.900" font-size="16" font-weight="400" fill="#111827">sendmsg()와 recvmsg()를 호출합니다.</text>
<text data-source="root.0.2.1.1.2.0" x="990.000" y="454.500" font-size="18" font-weight="700" fill="#111827">Linux Kernel</text>
<text data-source="root.0.2.1.1.2.1.0" x="1034.000" y="502.800" font-size="18" font-weight="700" fill="#111827">Syscall hook</text>
<text data-source="root.0.2.1.1.2.1.0" x="1034.000" y="536.200" font-size="16" font-weight="400" fill="#111827">socket system call에서 eBPF를 실행합니다.</text>
<text data-source="root.0.2.1.1.2.1.2" x="1495.000" y="502.800" font-size="18" font-weight="700" fill="#111827">Sockets hook</text>
<text data-source="root.0.2.1.1.2.1.2" x="1495.000" y="536.200" font-size="16" font-weight="400" fill="#111827">socket 계층의 송수신 이벤트를 봅니다.</text>
<text data-source="root.0.2.1.1.2.1.4" x="1034.000" y="690.600" font-size="18" font-weight="700" fill="#111827">TCP/IP hook</text>
<text data-source="root.0.2.1.1.2.1.4" x="1034.000" y="724.000" font-size="16" font-weight="400" fill="#111827">TCP/IP 처리 중 packet 상태를 관찰합니다.</text>
<text data-source="root.0.2.1.1.2.1.6" x="1495.000" y="679.800" font-size="18" font-weight="700" fill="#111827">Network Device hook</text>
<text data-source="root.0.2.1.1.2.1.6" x="1495.000" y="713.200" font-size="16" font-weight="400" fill="#111827">network device ingress와 egress를</text>
<text data-source="root.0.2.1.1.2.1.6" x="1495.000" y="734.800" font-size="16" font-weight="400" fill="#111827">처리합니다.</text>
<text data-source="root.0.2.1.1.2.1.1" x="1343.000" y="495.700" font-size="16" font-weight="400" fill="#111827">socket lookup</text>
<text data-source="root.0.2.1.1.2.1.3" x="1030.000" y="593.800" font-size="16" font-weight="400" fill="#111827">protocol path</text>
<text data-source="root.0.2.1.1.2.1.5" x="1343.000" y="683.500" font-size="16" font-weight="400" fill="#111827">device boundary</text>
<text data-source="root.0.2.1.1.4" x="990.000" y="874.400" font-size="18" font-weight="700" fill="#111827">Network</text>
<text data-source="root.0.2.1.1.4" x="990.000" y="907.800" font-size="16" font-weight="400" fill="#111827">송신과 수신 모두 kernel hook을 통과할 수 있습니다.</text>
<text data-source="root.0.2.1.1.1" x="1431.000" y="389.700" font-size="16" font-weight="400" fill="#111827">system call 경계</text>
<text data-source="root.0.2.1.1.3" x="1431.000" y="809.600" font-size="16" font-weight="400" fill="#111827">network access</text>
</svg>
