<path data-edge="root.0.2.1.1.3" data-from="root.0.2.1.1.2" data-to="root.0.2.1.1.4" d="M 1411.000 776.400 L 1411.000 832.400" fill="none" stroke="#475569" stroke-width="3"><title>network access</title></path>
