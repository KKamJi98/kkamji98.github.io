<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="3014c336fb1e03298e769eab47cb8d3cfb4833d8709ca912b844669574cc3aa0">
