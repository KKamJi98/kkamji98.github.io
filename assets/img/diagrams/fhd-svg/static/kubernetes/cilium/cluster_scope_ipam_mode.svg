<path data-edge="root.0.1.7" data-from="root.0.1.6" data-to="root.0.1.8" d="M 895.529 698.550 L 1024.471 698.550" fill="none" stroke="#475569" stroke-width="3"><title>allocate Pod IPs</title></path>
<polygon data-arrowhead="root.0.1.7" points="1024.471,698.550 1014.471,704.550 1014.471,692.550" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="285.850" font-size="36" font-weight="700" fill="#111827">Cluster Scope IPAM은 operator가 node별 PodCIDR을 나누고 agent가 Pod IP를 할당한다</text>
<text data-source="root.0.1.0" x="120.000" y="397.650" font-size="28" font-weight="700" fill="#111827">Cluster Scope IP Pool</text>
<text data-source="root.0.1.0" x="120.000" y="440.050" font-size="22" font-weight="400" fill="#111827">cluster 전체 주소 풀에서 node별</text>
<text data-source="root.0.1.0" x="120.000" y="469.750" font-size="22" font-weight="400" fill="#111827">subnet을 선택한다.</text>
<text data-source="root.0.1.2" x="746.980" y="412.500" font-size="28" font-weight="700" fill="#111827">Cilium Operator</text>
<text data-source="root.0.1.2" x="746.980" y="454.900" font-size="22" font-weight="400" fill="#111827">node별 PodCIDR을 중앙에서 배정한다.</text>
<text data-source="root.0.1.4" x="1373.961" y="412.500" font-size="28" font-weight="700" fill="#111827">v2.CiliumNode: node1</text>
<text data-source="root.0.1.4" x="1373.961" y="454.900" font-size="22" font-weight="400" fill="#111827">spec.ipam.podCIDRs: 10.1.1.0/24</text>
<text data-source="root.0.1.6" x="433.490" y="672.650" font-size="28" font-weight="700" fill="#111827">Cilium Agent</text>
<text data-source="root.0.1.6" x="433.490" y="715.050" font-size="22" font-weight="400" fill="#111827">할당받은 node subnet 안에서</text>
<text data-source="root.0.1.6" x="433.490" y="744.750" font-size="22" font-weight="400" fill="#111827">host-scope allocator를 실행한다.</text>
<text data-source="root.0.1.8" x="1060.471" y="687.500" font-size="28" font-weight="700" fill="#111827">Pods on node1</text>
<text data-source="root.0.1.8" x="1060.471" y="729.900" font-size="22" font-weight="400" fill="#111827">10.1.1.1 and 10.1.1.2</text>
<text data-source="root.0.1.1" x="574.039" y="374.150" font-size="22" font-weight="400" fill="#111827">operator</text>
<text data-source="root.0.1.1" x="574.039" y="403.850" font-size="22" font-weight="400" fill="#111827">allocation</text>
<text data-source="root.0.1.3" x="1201.020" y="344.450" font-size="22" font-weight="400" fill="#111827">update</text>
<text data-source="root.0.1.3" x="1201.020" y="374.150" font-size="22" font-weight="400" fill="#111827">CiliumNode</text>
<text data-source="root.0.1.3" x="1201.020" y="403.850" font-size="22" font-weight="400" fill="#111827">CRD</text>
<text data-source="root.0.1.5" x="658.510" y="564.650" font-size="22" font-weight="400" fill="#111827">agent reads node CIDR</text>
<text data-source="root.0.1.7" x="887.529" y="649.150" font-size="22" font-weight="400" fill="#111827">allocate</text>
<text data-source="root.0.1.7" x="887.529" y="678.850" font-size="22" font-weight="400" fill="#111827">Pod IPs</text>
<text data-source="root.0.2" x="64.000" y="822.450" font-size="22" font-weight="400" fill="#111827">v2.CiliumNode의 podCIDRs가 operator와 agent 사이의 allocation boundary다. 이 모드는 Kubernetes v1.Node의 PodCIDR 할당에 의존하지 않는다.</text>
</svg>
