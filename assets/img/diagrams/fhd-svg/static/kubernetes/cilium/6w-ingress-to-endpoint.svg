<polygon data-arrowhead="root.0.1.1.5" points="1482.000,290.700 1472.000,296.700 1472.000,284.700" fill="#475569"/>
<path data-edge="root.0.2.0.1.1" data-from="root.0.2.0.1.0" data-to="root.0.2.0.1.2" d="M 449.000 480.300 L 569.000 480.300" fill="none" stroke="#475569" stroke-width="3"><title>decapsulate and route</title></path>
<polygon data-arrowhead="root.0.2.0.1.1" points="569.000,480.300 559.000,486.300 559.000,474.300" fill="#475569"/>
<path data-edge="root.0.2.2.1.1" data-from="root.0.2.2.1.0" data-to="root.0.2.2.1.2" d="M 449.000 663.000 L 569.000 663.000" fill="none" stroke="#475569" stroke-width="3"><title>optional netfilter path</title></path>
<polygon data-arrowhead="root.0.2.2.1.1" points="569.000,663.000 559.000,669.000 559.000,657.000" fill="#475569"/>
