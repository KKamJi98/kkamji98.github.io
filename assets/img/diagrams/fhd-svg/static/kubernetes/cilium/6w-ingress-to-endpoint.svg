<path data-edge="root.0.1.1.1" data-from="root.0.1.1.0" data-to="root.0.1.1.2" d="M 438.000 290.700 L 558.000 290.700" fill="none" stroke="#475569" stroke-width="3"><title>routing mode에 따른 처리</title></path>
<polygon data-arrowhead="root.0.1.1.1" points="558.000,290.700 548.000,296.700 548.000,284.700" fill="#475569"/>
