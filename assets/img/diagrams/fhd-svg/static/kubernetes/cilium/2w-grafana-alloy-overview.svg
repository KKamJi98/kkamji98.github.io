<polygon data-arrowhead="root.0.6" points="960.000,772.650 954.000,762.650 966.000,762.650" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="156.450" font-size="36" font-weight="700" fill="#111827">Grafana Alloy는 push와 pull telemetry를 한 파이프라인으로 모은다</text>
<text data-source="root.0.1.0" x="76.000" y="211.050" font-size="18" font-weight="700" fill="#111827">Applications and infrastructure</text>
<text data-source="root.0.1.1.0" x="88.000" y="259.350" font-size="18" font-weight="700" fill="#111827">Application telemetry</text>
<text data-source="root.0.1.1.0" x="88.000" y="292.750" font-size="16" font-weight="400" fill="#111827">.NET, Java, Go 애플리케이션이 logs, metrics, traces, profiling 데이터를 보낸다.</text>
<text data-source="root.0.1.1.1" x="978.000" y="259.350" font-size="18" font-weight="700" fill="#111827">Infrastructure signals</text>
<text data-source="root.0.1.1.1" x="978.000" y="292.750" font-size="16" font-weight="400" fill="#111827">Kubernetes, Kafka, Hubble 같은 인프라가 수집 대상이 된다.</text>
<text data-source="root.0.3.0.0" x="76.000" y="432.350" font-size="18" font-weight="700" fill="#111827">Push telemetry</text>
<text data-source="root.0.3.0.1" x="88.000" y="480.650" font-size="18" font-weight="700" fill="#111827">Client push</text>
<text data-source="root.0.3.0.1" x="88.000" y="514.050" font-size="16" font-weight="400" fill="#111827">SDK 또는 exporter가 Alloy endpoint로 telemetry를 전송한다.</text>
<text data-source="root.0.3.1.0" x="978.000" y="432.350" font-size="18" font-weight="700" fill="#111827">Pull telemetry</text>
<text data-source="root.0.3.1.1" x="990.000" y="480.650" font-size="18" font-weight="700" fill="#111827">Target scrape</text>
<text data-source="root.0.3.1.1" x="990.000" y="514.050" font-size="16" font-weight="400" fill="#111827">Alloy가 Prometheus target이나 Kubernetes endpoint를 주기적으로 읽는다.</text>
<text data-source="root.0.5" x="76.000" y="653.650" font-size="18" font-weight="700" fill="#111827">Grafana Alloy</text>
<text data-source="root.0.5" x="76.000" y="687.050" font-size="16" font-weight="400" fill="#111827">수집한 신호를 transform하고 pipeline 규칙에 따라 목적지별로 write한다.</text>
<text data-source="root.0.7.0.0" x="76.000" y="814.650" font-size="18" font-weight="700" fill="#111827">Storage backends</text>
<text data-source="root.0.7.0.1" x="88.000" y="862.950" font-size="18" font-weight="700" fill="#111827">Grafana Cloud 또는 신호별 backend</text>
<text data-source="root.0.7.0.1" x="88.000" y="896.350" font-size="16" font-weight="400" fill="#111827">metrics: Mimir / Prometheus, logs: Loki, traces: Tempo, profiles: Pyroscope</text>
<text data-source="root.0.7.1.0" x="978.000" y="814.650" font-size="18" font-weight="700" fill="#111827">Optional downstream collectors</text>
<text data-source="root.0.7.1.1" x="990.000" y="862.950" font-size="18" font-weight="700" fill="#111827">다른 Alloy / OpenTelemetry Collector</text>
<text data-source="root.0.7.1.1" x="990.000" y="896.350" font-size="16" font-weight="400" fill="#111827">필요하면 중간 collector로 보내 추가 처리 후 호환 storage backend에 저장한다.</text>
<text data-source="root.0.8" x="64.000" y="953.950" font-size="16" font-weight="400" fill="#111827">Alloy는 Collect, Transform, Write를 맡는 수집 계층입니다. 알림 규칙 평가는 downstream backend 또는 alerting system의 역할입니다.</text>
<text data-source="root.0.2" x="980.000" y="367.550" font-size="16" font-weight="400" fill="#111827">telemetry 수집</text>
<text data-source="root.0.4" x="980.000" y="588.850" font-size="16" font-weight="400" fill="#111827">Collect and Transform</text>
<text data-source="root.0.6" x="980.000" y="749.850" font-size="16" font-weight="400" fill="#111827">route telemetry</text>
</svg>
