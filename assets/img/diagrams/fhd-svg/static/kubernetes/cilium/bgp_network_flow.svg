<polygon data-arrowhead="root.0.1.0.1.17" points="569.500,906.050 559.500,912.050 559.500,900.050" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="135.200" font-size="36" font-weight="700" fill="#111827">eBPF hook은 Linux networking stack의 여러 지점에 붙는다</text>
<text data-source="root.0.1.0.0" x="74.000" y="183.800" font-size="16" font-weight="700" fill="#111827">Linux networking stack</text>
<text data-source="root.0.1.0.1.0" x="116.000" y="225.400" font-size="16" font-weight="700" fill="#111827">Process</text>
<text data-source="root.0.1.0.1.0" x="116.000" y="256.200" font-size="14" font-weight="400" fill="#111827">여러 user process가 network call을 만듭니다.</text>
<text data-source="root.0.1.0.1.2" x="591.500" y="225.400" font-size="16" font-weight="700" fill="#111827">System Call Interface</text>
<text data-source="root.0.1.0.1.2" x="591.500" y="256.200" font-size="14" font-weight="400" fill="#111827">user space와 kernel 경계입니다.</text>
<text data-source="root.0.1.0.1.4" x="116.000" y="393.100" font-size="16" font-weight="700" fill="#111827">Sockets</text>
<text data-source="root.0.1.0.1.4" x="116.000" y="423.900" font-size="14" font-weight="400" fill="#111827">connection과 socket state를 다룹니다.</text>
<text data-source="root.0.1.0.1.6" x="591.500" y="393.100" font-size="16" font-weight="700" fill="#111827">TCP / UDP / Raw</text>
<text data-source="root.0.1.0.1.6" x="591.500" y="423.900" font-size="14" font-weight="400" fill="#111827">transport protocol별 처리를 거칩니다.</text>
<text data-source="root.0.1.0.1.8" x="116.000" y="560.800" font-size="16" font-weight="700" fill="#111827">Netfilter</text>
<text data-source="root.0.1.0.1.8" x="116.000" y="591.600" font-size="14" font-weight="400" fill="#111827">kernel packet filtering 계층입니다.</text>
<text data-source="root.0.1.0.1.10" x="591.500" y="560.800" font-size="16" font-weight="700" fill="#111827">IPv4 / IPv6</text>
<text data-source="root.0.1.0.1.10" x="591.500" y="591.600" font-size="14" font-weight="400" fill="#111827">network layer에서 주소를 처리합니다.</text>
<text data-source="root.0.1.0.1.12" x="116.000" y="728.500" font-size="16" font-weight="700" fill="#111827">Ethernet</text>
<text data-source="root.0.1.0.1.12" x="116.000" y="759.300" font-size="14" font-weight="400" fill="#111827">frame을 link layer로 내립니다.</text>
<text data-source="root.0.1.0.1.14" x="591.500" y="728.500" font-size="16" font-weight="700" fill="#111827">Traffic Shaping</text>
<text data-source="root.0.1.0.1.14" x="591.500" y="759.300" font-size="14" font-weight="400" fill="#111827">전송 traffic을 제어합니다.</text>
<text data-source="root.0.1.0.1.16" x="116.000" y="896.200" font-size="16" font-weight="700" fill="#111827">Netdevice / Drivers</text>
<text data-source="root.0.1.0.1.16" x="116.000" y="927.000" font-size="14" font-weight="400" fill="#111827">network device와 driver로 전달합니다.</text>
<text data-source="root.0.1.0.1.18" x="591.500" y="896.200" font-size="16" font-weight="700" fill="#111827">HW / Bridge / OVS</text>
<text data-source="root.0.1.0.1.18" x="591.500" y="927.000" font-size="14" font-weight="400" fill="#111827">물리 장치와 virtual switch입니다.</text>
<text data-source="root.0.1.0.1.1" x="441.500" y="218.350" font-size="14" font-weight="400" fill="#111827">system call</text>
<text data-source="root.0.1.0.1.3" x="114.000" y="311.100" font-size="14" font-weight="400" fill="#111827">socket API</text>
<text data-source="root.0.1.0.1.5" x="441.500" y="386.050" font-size="14" font-weight="400" fill="#111827">transport 처리</text>
<text data-source="root.0.1.0.1.7" x="114.000" y="478.800" font-size="14" font-weight="400" fill="#111827">packet filter</text>
<text data-source="root.0.1.0.1.9" x="441.500" y="553.750" font-size="14" font-weight="400" fill="#111827">IP routing</text>
<text data-source="root.0.1.0.1.11" x="114.000" y="646.500" font-size="14" font-weight="400" fill="#111827">link 처리</text>
<text data-source="root.0.1.0.1.13" x="441.500" y="721.450" font-size="14" font-weight="400" fill="#111827">traffic control</text>
<text data-source="root.0.1.0.1.15" x="114.000" y="814.200" font-size="14" font-weight="400" fill="#111827">device path</text>
<text data-source="root.0.1.0.1.17" x="441.500" y="889.150" font-size="14" font-weight="400" fill="#111827">hardware 전달</text>
<text data-source="root.0.1.1.0" x="975.000" y="183.800" font-size="16" font-weight="700" fill="#111827">eBPF hook points</text>
<text data-source="root.0.1.1.1.0.0.0" x="985.000" y="225.400" font-size="16" font-weight="700" fill="#111827">Attachment layer</text>
<text data-source="root.0.1.1.1.0.0.1" x="1425.500" y="225.400" font-size="16" font-weight="700" fill="#111827">eBPF hook</text>
<text data-source="root.0.1.1.1.1.0.0" x="985.000" y="276.200" font-size="16" font-weight="700" fill="#111827">System Call Interface</text>
<text data-source="root.0.1.1.1.1.0.1" x="1425.500" y="276.200" font-size="16" font-weight="700" fill="#111827">Syscall tracing hooks</text>
<text data-source="root.0.1.1.1.1.0.1" x="1425.500" y="307.000" font-size="14" font-weight="400" fill="#111827">tracepoints / kprobes로 syscall 이벤트를 관찰합니다.</text>
<text data-source="root.0.1.1.1.1.1.0" x="985.000" y="357.900" font-size="16" font-weight="700" fill="#111827">Sockets</text>
<text data-source="root.0.1.1.1.1.1.1" x="1425.500" y="357.900" font-size="16" font-weight="700" fill="#111827">BPF Sockmap and Sockops</text>
<text data-source="root.0.1.1.1.1.1.1" x="1425.500" y="388.700" font-size="14" font-weight="400" fill="#111827">socket 경로와 connection 동작에 개입합니다.</text>
<text data-source="root.0.1.1.1.1.2.0" x="985.000" y="439.600" font-size="16" font-weight="700" fill="#111827">cgroup boundary</text>
<text data-source="root.0.1.1.1.1.2.1" x="1425.500" y="439.600" font-size="16" font-weight="700" fill="#111827">BPF cGroups</text>
<text data-source="root.0.1.1.1.1.2.1" x="1425.500" y="470.400" font-size="14" font-weight="400" fill="#111827">cgroup 기준으로 network policy를 적용합니다.</text>
<text data-source="root.0.1.1.1.1.3.0" x="985.000" y="521.300" font-size="16" font-weight="700" fill="#111827">Traffic Shaping</text>
<text data-source="root.0.1.1.1.1.3.1" x="1425.500" y="521.300" font-size="16" font-weight="700" fill="#111827">BPF TC hooks</text>
<text data-source="root.0.1.1.1.1.3.1" x="1425.500" y="552.100" font-size="14" font-weight="400" fill="#111827">TC 계층에서 packet을 처리합니다.</text>
<text data-source="root.0.1.1.1.1.4.0" x="985.000" y="603.000" font-size="16" font-weight="700" fill="#111827">Netdevice / Drivers</text>
<text data-source="root.0.1.1.1.1.4.1" x="1425.500" y="603.000" font-size="16" font-weight="700" fill="#111827">BPF XDP</text>
<text data-source="root.0.1.1.1.1.4.1" x="1425.500" y="633.800" font-size="14" font-weight="400" fill="#111827">device와 driver에 가까운 지점입니다.</text>
<text data-source="root.0.2" x="64.000" y="975.900" font-size="14" font-weight="400" fill="#111827">각 hook은 독립된 attachment 위치이며 순차 실행 단계가 아닙니다. bpf()는 program 로드와 map 조작을 위한 별도 제어 API이지 packet 처리 hook이 아닙니다.</text>
</svg>
