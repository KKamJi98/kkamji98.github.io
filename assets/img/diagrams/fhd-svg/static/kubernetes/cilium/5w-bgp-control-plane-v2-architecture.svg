<path data-edge="root.0.1.2" data-from="root.0.1.1" data-to="root.0.1.3" d="M 504.000 393.450 L 504.000 449.450" fill="none" stroke="#475569" stroke-width="3"><title>Operator가 선택된 node의 설정으로 반영</title></path>
<polygon data-arrowhead="root.0.1.2" points="504.000,449.450 498.000,439.450 510.000,439.450" fill="#475569"/>
<path data-edge="root.0.1.4" data-from="root.0.1.3" data-to="root.0.1.5" d="M 504.000 554.450 L 504.000 610.450" fill="none" stroke="#475569" stroke-width="3"><title>node의 Cilium agent가 reconcile</title></path>
<polygon data-arrowhead="root.0.1.4" points="504.000,610.450 498.000,600.450 510.000,600.450" fill="#475569"/>
<path data-edge="root.0.3" data-from="root.0.2" data-to="root.0.4" d="M 1836.000 465.000 L 1848.000 465.000 L 1848.000 769.050 L 72.000 769.050 L 72.000 857.550 L 84.000 857.550" fill="none" stroke="#475569" stroke-width="3"><title>node의 BGP instance가 선택된 route를 Peers에 광고</title></path>
<polygon data-arrowhead="root.0.3" points="84.000,857.550 74.000,863.550 74.000,851.550" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="184.350" font-size="36" font-weight="700" fill="#111827">Cilium BGPv2는 선언한 CRD를 BGP 인스턴스와 광고로 연결한다</text>
<text data-source="root.0.1.0" x="108.000" y="238.950" font-size="18" font-weight="700" fill="#111827">선언과 node별 설정</text>
<text data-source="root.0.1.1.0" x="120.000" y="287.250" font-size="18" font-weight="700" fill="#111827">CiliumBGPClusterConfig</text>
<text data-source="root.0.1.1.0" x="120.000" y="320.650" font-size="16" font-weight="400" fill="#111827">nodeSelector로 node를 선택; BGP instance의</text>
<text data-source="root.0.1.1.0" x="120.000" y="342.250" font-size="16" font-weight="400" fill="#111827">localASN과 peers의 peerASN, peerAddress,</text>
<text data-source="root.0.1.1.0" x="120.000" y="363.850" font-size="16" font-weight="400" fill="#111827">peerConfigRef 선언</text>
<text data-source="root.0.1.1.1" x="522.000" y="287.250" font-size="18" font-weight="700" fill="#111827">CiliumBGPNodeConfigOverride</text>
<text data-source="root.0.1.1.1" x="522.000" y="320.650" font-size="16" font-weight="400" fill="#111827">리소스 이름이 node 이름과 일치해야 함; instance와</text>
<text data-source="root.0.1.1.1" x="522.000" y="342.250" font-size="16" font-weight="400" fill="#111827">peer 이름에 맞춰 node별 예외 설정</text>
<text data-source="root.0.1.3" x="120.000" y="491.450" font-size="18" font-weight="700" fill="#111827">CiliumBGPNodeConfig</text>
<text data-source="root.0.1.3" x="120.000" y="524.850" font-size="16" font-weight="400" fill="#111827">Operator가 생성하는 node별 BGP instance와 peer 설정</text>
<text data-source="root.0.1.5" x="120.000" y="652.450" font-size="18" font-weight="700" fill="#111827">BGP Instance / BGP Node Instance</text>
<text data-source="root.0.1.5" x="120.000" y="685.850" font-size="16" font-weight="400" fill="#111827">node에서 BGP session을 실행하는 runtime; 별도의 두 직렬 datapath가 아님</text>
<text data-source="root.0.1.2" x="524.000" y="426.650" font-size="16" font-weight="400" fill="#111827">Operator가 선택된 node의 설정으로 반영</text>
<text data-source="root.0.1.4" x="524.000" y="587.650" font-size="16" font-weight="400" fill="#111827">node의 Cilium agent가 reconcile</text>
<text data-source="root.0.2.0.0" x="1020.000" y="238.950" font-size="18" font-weight="700" fill="#111827">Peer 설정 참조</text>
<text data-source="root.0.2.0.1" x="1032.000" y="287.250" font-size="18" font-weight="700" fill="#111827">CiliumBGPPeerConfig</text>
<text data-source="root.0.2.0.1" x="1032.000" y="320.650" font-size="16" font-weight="400" fill="#111827">공통 timers, transport, graceful restart와 address</text>
<text data-source="root.0.2.0.1" x="1032.000" y="342.250" font-size="16" font-weight="400" fill="#111827">families 설정</text>
<text data-source="root.0.2.0.2" x="1020.000" y="387.850" font-size="16" font-weight="400" fill="#111827">ClusterConfig의 peers가 peerConfigRef.name으로</text>
<text data-source="root.0.2.0.2" x="1020.000" y="409.450" font-size="16" font-weight="400" fill="#111827">참조합니다. remote ASN과 주소는 ClusterConfig의</text>
<text data-source="root.0.2.0.2" x="1020.000" y="431.050" font-size="16" font-weight="400" fill="#111827">peerASN과 peerAddress입니다.</text>
<text data-source="root.0.2.0.3" x="1032.000" y="478.650" font-size="18" font-weight="700" fill="#111827">Peers</text>
<text data-source="root.0.2.0.3" x="1032.000" y="512.050" font-size="16" font-weight="400" fill="#111827">node의 BGP instance가 선택된 외부 router와</text>
<text data-source="root.0.2.0.3" x="1032.000" y="533.650" font-size="16" font-weight="400" fill="#111827">session을 구성</text>
<text data-source="root.0.2.1.0" x="1434.000" y="238.950" font-size="18" font-weight="700" fill="#111827">Advertisement 선택</text>
<text data-source="root.0.2.1.1" x="1446.000" y="287.250" font-size="18" font-weight="700" fill="#111827">CiliumBGPAdvertisement</text>
<text data-source="root.0.2.1.1" x="1446.000" y="320.650" font-size="16" font-weight="400" fill="#111827">PeerConfig의 families.advertisements label</text>
<text data-source="root.0.2.1.1" x="1446.000" y="342.250" font-size="16" font-weight="400" fill="#111827">selector로 선택되는 광고 정의</text>
<text data-source="root.0.2.1.2" x="1434.000" y="387.850" font-size="16" font-weight="400" fill="#111827">advertisementType과 필요한 label selector로 아래</text>
<text data-source="root.0.2.1.2" x="1434.000" y="409.450" font-size="16" font-weight="400" fill="#111827">route 대상을 선택합니다. 설정 참조는 packet 전달</text>
<text data-source="root.0.2.1.2" x="1434.000" y="431.050" font-size="16" font-weight="400" fill="#111827">경로가 아닙니다.</text>
<text data-source="root.0.2.1.3.0" x="1446.000" y="478.650" font-size="18" font-weight="700" fill="#111827">CiliumPodIPPool</text>
<text data-source="root.0.2.1.3.0" x="1446.000" y="512.050" font-size="16" font-weight="400" fill="#111827">선택된 Pod IP pool의</text>
<text data-source="root.0.2.1.3.0" x="1446.000" y="533.650" font-size="16" font-weight="400" fill="#111827">할당 route</text>
<text data-source="root.0.2.1.3.1" x="1641.000" y="478.650" font-size="18" font-weight="700" fill="#111827">PodCIDR</text>
<text data-source="root.0.2.1.3.1" x="1641.000" y="512.050" font-size="16" font-weight="400" fill="#111827">node에 할당된 Pod</text>
<text data-source="root.0.2.1.3.1" x="1641.000" y="533.650" font-size="16" font-weight="400" fill="#111827">CIDR route</text>
<text data-source="root.0.2.1.3.2" x="1446.000" y="593.250" font-size="18" font-weight="700" fill="#111827">Service routes</text>
<text data-source="root.0.2.1.3.2" x="1446.000" y="626.650" font-size="16" font-weight="400" fill="#111827">선택된 Service의</text>
<text data-source="root.0.2.1.3.2" x="1446.000" y="648.250" font-size="16" font-weight="400" fill="#111827">LoadBalancerIP,</text>
<text data-source="root.0.2.1.3.2" x="1446.000" y="669.850" font-size="16" font-weight="400" fill="#111827">ExternalIP, ClusterIP</text>
<text data-source="root.0.2.1.3.2" x="1446.000" y="691.450" font-size="16" font-weight="400" fill="#111827">route</text>
<text data-source="root.0.4" x="108.000" y="847.050" font-size="18" font-weight="700" fill="#111827">External BGP routes</text>
<text data-source="root.0.4" x="108.000" y="880.450" font-size="16" font-weight="400" fill="#111827">Pod CIDR과 선택된 Service IP route를 외부 peer에 광고</text>
<text data-source="root.0.5" x="64.000" y="926.050" font-size="16" font-weight="400" fill="#111827">BGPv2는 control plane에서 route를 교환합니다. 외부에서 온 BGP route를 node kernel FIB에 넣지 않으며 Pod와 Service 전달은 Cilium eBPF datapath가 처리합니다.</text>
<text data-source="root.0.3" x="104.000" y="761.050" font-size="16" font-weight="400" fill="#111827">node의 BGP instance가 선택된 route를 Peers에 광고</text>
</svg>
