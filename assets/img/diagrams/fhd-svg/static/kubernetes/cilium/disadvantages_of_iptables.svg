<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="42dfec90f0e42f3ab4111ea87c43721246309f31012a7233634ffaf6b5ee9590">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-source="root.0.1.0" x="64.000" y="194.500" width="886.000" height="332.800" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.1.1" x="970.000" y="194.500" width="886.000" height="463.000" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.1.2" x="64.000" y="677.500" width="886.000" height="229.600" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-node="root.0.1.0.1.0" x="84.000" y="266.900" width="846.000" height="110.200" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect data-node="root.0.1.0.1.1" x="84.000" y="397.100" width="846.000" height="110.200" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.1.1.0" x="990.000" y="266.900" width="846.000" height="110.200" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect data-node="root.0.1.1.1.1" x="990.000" y="397.100" width="846.000" height="110.200" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.1.1.2" x="990.000" y="527.300" width="846.000" height="110.200" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.2.1.0" x="116.000" y="749.900" width="319.000" height="137.200" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.2.1.2" x="579.000" y="749.900" width="319.000" height="137.200" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<path data-edge="root.0.1.2.1.1" data-from="root.0.1.2.1.0" data-to="root.0.1.2.1.2" d="M 447.000 818.500 L 567.000 818.500" fill="none" stroke="#475569" stroke-width="3"><title>resource pressure</title></path>
<polygon data-arrowhead="root.0.1.2.1.1" points="567.000,818.500 557.000,824.500 557.000,812.500" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="161.900" font-size="36" font-weight="700" fill="#111827">Legacy iptables는 규칙 변경과 순차 평가로 cluster 확장 비용이 커진다</text>
<text data-source="root.0.1.0.0" x="84.000" y="238.500" font-size="24" font-weight="700" fill="#111827">Rule management</text>
<text data-source="root.0.1.0.1.0" x="104.000" y="310.900" font-size="24" font-weight="700" fill="#111827">Single transaction update</text>
<text data-source="root.0.1.0.1.0" x="104.000" y="350.100" font-size="20" font-weight="400" fill="#111827">작은 변경도 전체 rule set을 다시 만들고 갱신한다.</text>
<text data-source="root.0.1.0.1.1" x="104.000" y="441.100" font-size="24" font-weight="700" fill="#111827">IP and port churn</text>
<text data-source="root.0.1.0.1.1" x="104.000" y="480.300" font-size="20" font-weight="400" fill="#111827">새 IP나 port가 생길 때 rule과 chain을 추가로 바꾼다.</text>
<text data-source="root.0.1.1.0" x="990.000" y="238.500" font-size="24" font-weight="700" fill="#111827">Packet evaluation</text>
<text data-source="root.0.1.1.1.0" x="1010.000" y="310.900" font-size="24" font-weight="700" fill="#111827">Linked-list chains</text>
<text data-source="root.0.1.1.1.0" x="1010.000" y="350.100" font-size="20" font-weight="400" fill="#111827">ACL을 순차적으로 탐색하므로 연산이 O(n)으로 늘어난다.</text>
<text data-source="root.0.1.1.1.1" x="1010.000" y="441.100" font-size="24" font-weight="700" fill="#111827">IP and port rules</text>
<text data-source="root.0.1.1.1.1" x="1010.000" y="480.300" font-size="20" font-weight="400" fill="#111827">주소와 port 중심의 L3/L4 match를 수행한다.</text>
<text data-source="root.0.1.1.1.2" x="1010.000" y="571.300" font-size="24" font-weight="700" fill="#111827">L7 blind spot</text>
<text data-source="root.0.1.1.1.2" x="1010.000" y="610.500" font-size="20" font-weight="400" fill="#111827">HTTP나 DNS 같은 application protocol 내용을 이해하지 못한다.</text>
<text data-source="root.0.1.2.0" x="84.000" y="721.500" font-size="24" font-weight="700" fill="#111827">Kubernetes scale impact</text>
<text data-source="root.0.1.2.1.0" x="136.000" y="793.900" font-size="24" font-weight="700" fill="#111827">Many Services and Pods</text>
<text data-source="root.0.1.2.1.0" x="136.000" y="833.100" font-size="20" font-weight="400" fill="#111827">동적 endpoint가 늘수록 rule</text>
<text data-source="root.0.1.2.1.0" x="136.000" y="860.100" font-size="20" font-weight="400" fill="#111827">count와 update churn이 커진다.</text>
<text data-source="root.0.1.2.1.2" x="599.000" y="793.900" font-size="24" font-weight="700" fill="#111827">CPU and memory usage</text>
<text data-source="root.0.1.2.1.2" x="599.000" y="833.100" font-size="20" font-weight="400" fill="#111827">대규모 cluster에서 system</text>
<text data-source="root.0.1.2.1.2" x="599.000" y="860.100" font-size="20" font-weight="400" fill="#111827">resource 소비가 높아진다.</text>
<text data-source="root.0.1.2.1.1" x="439.000" y="772.500" font-size="20" font-weight="400" fill="#111827">resource</text>
<text data-source="root.0.1.2.1.1" x="439.000" y="799.500" font-size="20" font-weight="400" fill="#111827">pressure</text>
<text data-source="root.0.2" x="64.000" y="947.100" font-size="20" font-weight="400" fill="#111827">Service 수와 rule 변경이 많거나 traffic이 무거우면 latency가 예측하기 어려워지고 성능이 떨어질 수 있다.</text>
</svg>
