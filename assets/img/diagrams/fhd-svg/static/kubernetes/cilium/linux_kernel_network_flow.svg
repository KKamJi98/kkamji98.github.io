<path data-edge="root.0.1.0.1.1" data-from="root.0.1.0.1.0" data-to="root.0.1.0.1.2" d="M 446.000 346.750 L 566.000 346.750" fill="none" stroke="#475569" stroke-width="3"><title>process call</title></path>
<polygon data-arrowhead="root.0.1.0.1.1" points="566.000,346.750 556.000,352.750 556.000,340.750" fill="#475569"/>
<path data-edge="root.0.1.0.1.3" data-from="root.0.1.0.1.2" data-to="root.0.1.0.1.4" d="M 904.000 346.750 L 916.000 346.750 L 916.000 490.850 L 96.000 490.850 L 96.000 616.750 L 108.000 616.750" fill="none" stroke="#475569" stroke-width="3"><title>Syscall</title></path>
<polygon data-arrowhead="root.0.1.0.1.3" points="108.000,616.750 98.000,622.750 98.000,610.750" fill="#475569"/>
<path data-edge="root.0.1.0.1.5" data-from="root.0.1.0.1.4" data-to="root.0.1.0.1.6" d="M 446.000 616.750 L 566.000 616.750" fill="none" stroke="#475569" stroke-width="3"><title>kernel network path</title></path>
<polygon data-arrowhead="root.0.1.0.1.5" points="566.000,616.750 556.000,622.750 556.000,610.750" fill="#475569"/>
<path data-edge="root.0.1.1.1.1" data-from="root.0.1.1.1.0" data-to="root.0.1.1.1.2" d="M 1354.000 328.550 L 1474.000 328.550" fill="none" stroke="#475569" stroke-width="3"><title>process to syscall</title></path>
<polygon data-arrowhead="root.0.1.1.1.1" points="1474.000,328.550 1464.000,334.550 1464.000,322.550" fill="#475569"/>
<path data-edge="root.0.1.1.1.3" data-from="root.0.1.1.1.2" data-to="root.0.1.1.1.4" d="M 1812.000 328.550 L 1824.000 328.550 L 1824.000 454.450 L 1004.000 454.450 L 1004.000 580.350 L 1016.000 580.350" fill="none" stroke="#475569" stroke-width="3"><title>network stack</title></path>
<polygon data-arrowhead="root.0.1.1.1.3" points="1016.000,580.350 1006.000,586.350 1006.000,574.350" fill="#475569"/>
<path data-edge="root.0.1.1.1.5" data-from="root.0.1.1.1.4" data-to="root.0.1.1.1.6" d="M 1354.000 580.350 L 1474.000 580.350" fill="none" stroke="#475569" stroke-width="3"><title>transport path</title></path>
<polygon data-arrowhead="root.0.1.1.1.5" points="1474.000,580.350 1464.000,586.350 1464.000,574.350" fill="#475569"/>
<path data-edge="root.0.1.1.1.7" data-from="root.0.1.1.1.6" data-to="root.0.1.1.1.8" d="M 1812.000 580.350 L 1824.000 580.350 L 1824.000 706.250 L 1004.000 706.250 L 1004.000 832.150 L 1016.000 832.150" fill="none" stroke="#475569" stroke-width="3"><title>device path</title></path>
<polygon data-arrowhead="root.0.1.1.1.7" points="1016.000,832.150 1006.000,838.150 1006.000,826.150" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="128.250" font-size="36" font-weight="700" fill="#111827">eBPF는 Linux kernel network path의 계층별 hook에서 동작한다</text>
<text data-source="root.0.1.0.0" x="88.000" y="216.850" font-size="28" font-weight="700" fill="#111827">Traditional path</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="302.650" font-size="28" font-weight="700" fill="#111827">User-Space</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="339.050" font-size="28" font-weight="700" fill="#111827">Networking</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="381.450" font-size="22" font-weight="400" fill="#111827">application이 kernel API를</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="411.150" font-size="22" font-weight="400" fill="#111827">호출합니다.</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="320.850" font-size="28" font-weight="700" fill="#111827">Process</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="363.250" font-size="22" font-weight="400" fill="#111827">network request를</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="392.950" font-size="22" font-weight="400" fill="#111827">생성합니다.</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="590.850" font-size="28" font-weight="700" fill="#111827">Sockets</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="633.250" font-size="22" font-weight="400" fill="#111827">socket state와</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="662.950" font-size="22" font-weight="400" fill="#111827">connection을 처리합니다.</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="590.850" font-size="28" font-weight="700" fill="#111827">Network Device</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="633.250" font-size="22" font-weight="400" fill="#111827">device로 packet을</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="662.950" font-size="22" font-weight="400" fill="#111827">전달합니다.</text>
<text data-source="root.0.1.0.1.1" x="438.000" y="327.050" font-size="22" font-weight="400" fill="#111827">process call</text>
<text data-source="root.0.1.0.1.3" x="128.000" y="482.850" font-size="22" font-weight="400" fill="#111827">Syscall</text>
<text data-source="root.0.1.0.1.5" x="438.000" y="567.350" font-size="22" font-weight="400" fill="#111827">kernel</text>
<text data-source="root.0.1.0.1.5" x="438.000" y="597.050" font-size="22" font-weight="400" fill="#111827">network path</text>
<text data-source="root.0.1.1.0" x="996.000" y="216.850" font-size="28" font-weight="700" fill="#111827">eBPF path</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="302.650" font-size="28" font-weight="700" fill="#111827">Process</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="345.050" font-size="22" font-weight="400" fill="#111827">같은 application</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="374.750" font-size="22" font-weight="400" fill="#111827">request에서 시작합니다.</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="302.650" font-size="28" font-weight="700" fill="#111827">Syscall</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="345.050" font-size="22" font-weight="400" fill="#111827">eBPF hook이 system call</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="374.750" font-size="22" font-weight="400" fill="#111827">지점에 붙습니다.</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="554.450" font-size="28" font-weight="700" fill="#111827">Sockets</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="596.850" font-size="22" font-weight="400" fill="#111827">기존 socket 계층을</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="626.550" font-size="22" font-weight="400" fill="#111827">통과합니다.</text>
<text data-source="root.0.1.1.1.6" x="1510.000" y="554.450" font-size="28" font-weight="700" fill="#111827">TCP/IP</text>
<text data-source="root.0.1.1.1.6" x="1510.000" y="596.850" font-size="22" font-weight="400" fill="#111827">선택된 TCP/IP 지점에서</text>
<text data-source="root.0.1.1.1.6" x="1510.000" y="626.550" font-size="22" font-weight="400" fill="#111827">eBPF를 실행합니다.</text>
<text data-source="root.0.1.1.1.8" x="1052.000" y="806.250" font-size="28" font-weight="700" fill="#111827">Network Device</text>
<text data-source="root.0.1.1.1.8" x="1052.000" y="848.650" font-size="22" font-weight="400" fill="#111827">device 지점에서도 eBPF가</text>
<text data-source="root.0.1.1.1.8" x="1052.000" y="878.350" font-size="22" font-weight="400" fill="#111827">packet을 관찰합니다.</text>
<text data-source="root.0.1.1.1.1" x="1346.000" y="279.150" font-size="22" font-weight="400" fill="#111827">process to</text>
<text data-source="root.0.1.1.1.1" x="1346.000" y="308.850" font-size="22" font-weight="400" fill="#111827">syscall</text>
<text data-source="root.0.1.1.1.3" x="1036.000" y="446.450" font-size="22" font-weight="400" fill="#111827">network stack</text>
<text data-source="root.0.1.1.1.5" x="1346.000" y="530.950" font-size="22" font-weight="400" fill="#111827">transport</text>
<text data-source="root.0.1.1.1.5" x="1346.000" y="560.650" font-size="22" font-weight="400" fill="#111827">path</text>
<text data-source="root.0.1.1.1.7" x="1036.000" y="698.250" font-size="22" font-weight="400" fill="#111827">device path</text>
<text data-source="root.0.2" x="64.000" y="980.050" font-size="22" font-weight="400" fill="#111827">eBPF는 기존 계층을 없애지 않고 Syscall, TCP/IP, Network Device 같은 선택 지점에 attach되어 policy 적용과 관측을 수행합니다.</text>
</svg>
