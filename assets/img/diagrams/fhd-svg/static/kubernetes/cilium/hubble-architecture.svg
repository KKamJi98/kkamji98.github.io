<text data-source="root.0.0" x="64.000" y="116.450" font-size="36" font-weight="700" fill="#111827">Hubble는 node-local flow를 Relay와 observability 도구로 전달한다</text>
<text data-source="root.0.1.0" x="76.000" y="171.050" font-size="18" font-weight="700" fill="#111827">Node-local Hubble API</text>
<text data-source="root.0.1.1.0.0" x="88.000" y="219.350" font-size="18" font-weight="700" fill="#111827">Node 1</text>
<text data-source="root.0.1.1.0.1.0" x="132.000" y="267.650" font-size="18" font-weight="700" fill="#111827">Pods (3)</text>
<text data-source="root.0.1.1.0.1.0" x="132.000" y="301.050" font-size="16" font-weight="400" fill="#111827">workload flow가 node 안에서 발생합니다.</text>
<text data-source="root.0.1.1.0.1.2" x="599.000" y="267.650" font-size="18" font-weight="700" fill="#111827">cilium + BPF</text>
<text data-source="root.0.1.1.0.1.2" x="599.000" y="301.050" font-size="16" font-weight="400" fill="#111827">network event와 identity를 수집합니다.</text>
<text data-source="root.0.1.1.0.1.4" x="132.000" y="444.650" font-size="18" font-weight="700" fill="#111827">Hubble API</text>
<text data-source="root.0.1.1.0.1.4" x="132.000" y="478.050" font-size="16" font-weight="400" fill="#111827">이 node의 flow를 제공합니다.</text>
<text data-source="root.0.1.1.0.1.1" x="447.000" y="260.550" font-size="16" font-weight="400" fill="#111827">eBPF observation</text>
<text data-source="root.0.1.1.0.1.3" x="128.000" y="358.650" font-size="16" font-weight="400" fill="#111827">node-local flow</text>
<text data-source="root.0.1.1.1.0" x="978.000" y="219.350" font-size="18" font-weight="700" fill="#111827">Node 2</text>
<text data-source="root.0.1.1.1.1.0" x="1022.000" y="267.650" font-size="18" font-weight="700" fill="#111827">Pods (3)</text>
<text data-source="root.0.1.1.1.1.0" x="1022.000" y="301.050" font-size="16" font-weight="400" fill="#111827">두 번째 node의 workload flow입니다.</text>
<text data-source="root.0.1.1.1.1.2" x="1489.000" y="267.650" font-size="18" font-weight="700" fill="#111827">cilium + BPF</text>
<text data-source="root.0.1.1.1.1.2" x="1489.000" y="301.050" font-size="16" font-weight="400" fill="#111827">동일한 방식으로 event를 수집합니다.</text>
<text data-source="root.0.1.1.1.1.4" x="1022.000" y="444.650" font-size="18" font-weight="700" fill="#111827">Hubble API</text>
<text data-source="root.0.1.1.1.1.4" x="1022.000" y="478.050" font-size="16" font-weight="400" fill="#111827">이 node의 flow를 제공합니다.</text>
<text data-source="root.0.1.1.1.1.1" x="1337.000" y="260.550" font-size="16" font-weight="400" fill="#111827">eBPF observation</text>
<text data-source="root.0.1.1.1.1.3" x="1018.000" y="358.650" font-size="16" font-weight="400" fill="#111827">node-local flow</text>
<text data-source="root.0.3.0.0" x="100.000" y="653.650" font-size="18" font-weight="700" fill="#111827">Local flow API</text>
<text data-source="root.0.3.0.1.0" x="144.000" y="701.950" font-size="18" font-weight="700" fill="#111827">Node-local Hubble API</text>
<text data-source="root.0.3.0.1.0" x="144.000" y="735.350" font-size="16" font-weight="400" fill="#111827">로컬 Unix socket으로 flow 제공</text>
<text data-source="root.0.3.0.1.2" x="144.000" y="878.950" font-size="18" font-weight="700" fill="#111827">Hubble CLI</text>
<text data-source="root.0.3.0.1.2" x="144.000" y="912.350" font-size="16" font-weight="400" fill="#111827">Relay 없이 해당 node flow 조회</text>
<text data-source="root.0.3.0.1.1" x="140.000" y="792.950" font-size="16" font-weight="400" fill="#111827">직접 조회</text>
<text data-source="root.0.3.1.0" x="685.333" y="653.650" font-size="18" font-weight="700" fill="#111827">Flow metrics</text>
<text data-source="root.0.3.1.1.0" x="729.333" y="701.950" font-size="18" font-weight="700" fill="#111827">Node Hubble metrics endpoint</text>
<text data-source="root.0.3.1.1.0" x="729.333" y="735.350" font-size="16" font-weight="400" fill="#111827">활성화된 metrics를 hubble-metrics Service endpoints로 노출</text>
<text data-source="root.0.3.1.1.2" x="729.333" y="878.950" font-size="18" font-weight="700" fill="#111827">Prometheus / Grafana</text>
<text data-source="root.0.3.1.1.2" x="729.333" y="912.350" font-size="16" font-weight="400" fill="#111827">metrics 저장 및 시각화. Relay를 거치지 않음</text>
<text data-source="root.0.3.1.1.1" x="725.333" y="792.950" font-size="16" font-weight="400" fill="#111827">Prometheus가 node endpoint scrape</text>
<text data-source="root.0.3.2.0" x="1270.667" y="653.650" font-size="18" font-weight="700" fill="#111827">Cluster-wide flow API</text>
<text data-source="root.0.3.2.1.0" x="1314.667" y="701.950" font-size="18" font-weight="700" fill="#111827">Hubble Relay (optional)</text>
<text data-source="root.0.3.2.1.0" x="1314.667" y="735.350" font-size="16" font-weight="400" fill="#111827">여러 node의 Hubble API에 연결해 flow 집계</text>
<text data-source="root.0.3.2.1.2" x="1314.667" y="878.950" font-size="18" font-weight="700" fill="#111827">Hubble CLI / Hubble UI</text>
<text data-source="root.0.3.2.1.2" x="1314.667" y="912.350" font-size="16" font-weight="400" fill="#111827">cluster-wide flow와 service map 조회</text>
<text data-source="root.0.3.2.1.1" x="1310.667" y="792.950" font-size="16" font-weight="400" fill="#111827">집계 flow 조회</text>
<text data-source="root.0.4" x="64.000" y="993.950" font-size="16" font-weight="400" fill="#111827">Flow API와 metrics endpoint는 서로 다른 인터페이스입니다. Prometheus의 Hubble flow metrics scrape 경로는 Relay 집계와 독립적입니다.</text>
<text data-source="root.0.2" x="980.000" y="564.850" font-size="16" font-weight="400" fill="#111827">node-local Hubble에서 세 소비 경로로 분기</text>
</svg>
