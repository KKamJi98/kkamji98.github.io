<text data-source="root.0.0" x="64.000" y="172.400" font-size="36" font-weight="700" fill="#111827">L4 policy는 source identity와 TCP port를 검사한다</text>
<text data-source="root.0.1.0" x="88.000" y="261.000" font-size="28" font-weight="700" fill="#111827">namespace=default</text>
<text data-source="root.0.1.1" x="88.000" y="316.800" font-size="22" font-weight="400" fill="#111827">Ingress Network Policy: tiefighter to deathstar allow tcp/80</text>
<text data-source="root.0.1.2.0.0" x="112.000" y="400.500" font-size="28" font-weight="700" fill="#111827">Allowed</text>
<text data-source="root.0.1.2.0.1.0" x="168.000" y="486.300" font-size="28" font-weight="700" fill="#111827">tiefighter</text>
<text data-source="root.0.1.2.0.1.0" x="168.000" y="528.700" font-size="22" font-weight="400" fill="#111827">org=empire,</text>
<text data-source="root.0.1.2.0.1.0" x="168.000" y="558.400" font-size="22" font-weight="400" fill="#111827">class=tiefighter</text>
<text data-source="root.0.1.2.0.1.2" x="614.000" y="486.300" font-size="28" font-weight="700" fill="#111827">deathstar</text>
<text data-source="root.0.1.2.0.1.2" x="614.000" y="528.700" font-size="22" font-weight="400" fill="#111827">org=empire,</text>
<text data-source="root.0.1.2.0.1.2" x="614.000" y="558.400" font-size="22" font-weight="400" fill="#111827">class=deathstar</text>
<text data-source="root.0.1.2.0.1.4" x="168.000" y="738.100" font-size="28" font-weight="700" fill="#111827">Ingress accepted</text>
<text data-source="root.0.1.2.0.1.4" x="168.000" y="780.500" font-size="22" font-weight="400" fill="#111827">L4 rule의 identity와 port</text>
<text data-source="root.0.1.2.0.1.4" x="168.000" y="810.200" font-size="22" font-weight="400" fill="#111827">조건을 만족합니다.</text>
<text data-source="root.0.1.2.0.1.1" x="450.000" y="492.500" font-size="22" font-weight="400" fill="#111827">TCP/80</text>
<text data-source="root.0.1.2.0.1.3" x="152.000" y="630.100" font-size="22" font-weight="400" fill="#111827">allow</text>
<text data-source="root.0.1.2.1.0" x="996.000" y="400.500" font-size="28" font-weight="700" fill="#111827">Denied</text>
<text data-source="root.0.1.2.1.1.0" x="1052.000" y="501.150" font-size="28" font-weight="700" fill="#111827">xwing</text>
<text data-source="root.0.1.2.1.1.0" x="1052.000" y="543.550" font-size="22" font-weight="400" fill="#111827">org=alliance, class=xwing</text>
<text data-source="root.0.1.2.1.1.2" x="1498.000" y="486.300" font-size="28" font-weight="700" fill="#111827">deathstar</text>
<text data-source="root.0.1.2.1.1.2" x="1498.000" y="528.700" font-size="22" font-weight="400" fill="#111827">org=empire,</text>
<text data-source="root.0.1.2.1.1.2" x="1498.000" y="558.400" font-size="22" font-weight="400" fill="#111827">class=deathstar</text>
<text data-source="root.0.1.2.1.1.4" x="1052.000" y="738.100" font-size="28" font-weight="700" fill="#111827">Ingress blocked</text>
<text data-source="root.0.1.2.1.1.4" x="1052.000" y="780.500" font-size="22" font-weight="400" fill="#111827">port가 같아도 source</text>
<text data-source="root.0.1.2.1.1.4" x="1052.000" y="810.200" font-size="22" font-weight="400" fill="#111827">identity가 rule과 다릅니다.</text>
<text data-source="root.0.1.2.1.1.1" x="1334.000" y="492.500" font-size="22" font-weight="400" fill="#111827">TCP/80</text>
<text data-source="root.0.1.2.1.1.3" x="1036.000" y="630.100" font-size="22" font-weight="400" fill="#111827">identity mismatch</text>
<text data-source="root.0.2" x="64.000" y="935.900" font-size="22" font-weight="400" fill="#111827">L4 규칙은 HTTP method나 URL path를 검사하지 않으며, 이 조건은 L7 규칙에서 별도로 적용됩니다.</text>
</svg>
