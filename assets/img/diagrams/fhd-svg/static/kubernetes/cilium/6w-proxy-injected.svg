<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="cefe253c3de09330f4eeb0aad18c0034aa9847f240464d26b29e2b5f77c747d3">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-node="root.0.1.0" x="96.000" y="456.700" width="314.504" height="185.500" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.2" x="567.165" y="456.700" width="314.504" height="185.500" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.1.4" x="1038.331" y="456.700" width="314.504" height="185.500" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.1.6" x="1509.496" y="471.550" width="314.504" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 422.504 549.450 L 555.165 549.450" fill="none" stroke="#475569" stroke-width="3"><title>sidecar interception</title></path>
<polygon data-arrowhead="root.0.1.1" points="555.165,549.450 545.165,555.450 545.165,543.450" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 893.669 549.450 L 1026.331 549.450" fill="none" stroke="#475569" stroke-width="3"><title>proxied application traffic</title></path>
<polygon data-arrowhead="root.0.1.3" points="1026.331,549.450 1016.331,555.450 1016.331,543.450" fill="#475569"/>
<path data-edge="root.0.1.5" data-from="root.0.1.4" data-to="root.0.1.6" d="M 1364.835 549.450 L 1497.496 549.450" fill="none" stroke="#475569" stroke-width="3"><title>deliver locally</title></path>
<polygon data-arrowhead="root.0.1.5" points="1497.496,549.450 1487.496,555.450 1487.496,543.450" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="411.750" font-size="36" font-weight="700" fill="#111827">Sidecar proxy가 두 application 사이의 traffic을 가로채 전달한다</text>
<text data-source="root.0.1.0" x="120.000" y="508.700" font-size="28" font-weight="700" fill="#111827">Application A</text>
<text data-source="root.0.1.0" x="120.000" y="551.100" font-size="22" font-weight="400" fill="#111827">application code는</text>
<text data-source="root.0.1.0" x="120.000" y="580.800" font-size="22" font-weight="400" fill="#111827">service mesh 기능을 직접</text>
<text data-source="root.0.1.0" x="120.000" y="610.500" font-size="22" font-weight="400" fill="#111827">구현하지 않는다.</text>
<text data-source="root.0.1.2" x="591.165" y="508.700" font-size="28" font-weight="700" fill="#111827">Proxy A</text>
<text data-source="root.0.1.2" x="591.165" y="551.100" font-size="22" font-weight="400" fill="#111827">Pod에 주입된 Sidecar</text>
<text data-source="root.0.1.2" x="591.165" y="580.800" font-size="22" font-weight="400" fill="#111827">Container가 outbound</text>
<text data-source="root.0.1.2" x="591.165" y="610.500" font-size="22" font-weight="400" fill="#111827">traffic을 받는다.</text>
<text data-source="root.0.1.4" x="1062.331" y="508.700" font-size="28" font-weight="700" fill="#111827">Proxy B</text>
<text data-source="root.0.1.4" x="1062.331" y="551.100" font-size="22" font-weight="400" fill="#111827">대상 Pod의 Sidecar</text>
<text data-source="root.0.1.4" x="1062.331" y="580.800" font-size="22" font-weight="400" fill="#111827">Container가 inbound</text>
<text data-source="root.0.1.4" x="1062.331" y="610.500" font-size="22" font-weight="400" fill="#111827">traffic을 처리한다.</text>
<text data-source="root.0.1.6" x="1533.496" y="523.550" font-size="28" font-weight="700" fill="#111827">Application B</text>
<text data-source="root.0.1.6" x="1533.496" y="565.950" font-size="22" font-weight="400" fill="#111827">proxy가 확인하고 전달한</text>
<text data-source="root.0.1.6" x="1533.496" y="595.650" font-size="22" font-weight="400" fill="#111827">요청을 처리한다.</text>
<text data-source="root.0.1.1" x="414.504" y="500.050" font-size="22" font-weight="400" fill="#111827">sidecar</text>
<text data-source="root.0.1.1" x="414.504" y="529.750" font-size="22" font-weight="400" fill="#111827">interception</text>
<text data-source="root.0.1.3" x="885.669" y="470.350" font-size="22" font-weight="400" fill="#111827">proxied</text>
<text data-source="root.0.1.3" x="885.669" y="500.050" font-size="22" font-weight="400" fill="#111827">application</text>
<text data-source="root.0.1.3" x="885.669" y="529.750" font-size="22" font-weight="400" fill="#111827">traffic</text>
<text data-source="root.0.1.5" x="1356.835" y="529.750" font-size="22" font-weight="400" fill="#111827">deliver locally</text>
<text data-source="root.0.2" x="64.000" y="696.550" font-size="22" font-weight="400" fill="#111827">각 application에는 sidecar proxy가 있고, iptables rule은 application traffic을 local sidecar로 redirect한 뒤 proxy 사이의 경로로 전달한다.</text>
</svg>
