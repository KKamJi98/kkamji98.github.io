<text data-source="root.0.0" x="64.000" y="184.800" font-size="36" font-weight="700" fill="#111827">Cilium은 label 집합을 cluster 전역 numeric identity로 조회한다</text>
<text data-source="root.0.1.0" x="80.000" y="249.400" font-size="20" font-weight="700" fill="#111827">Label to Identity map</text>
<text data-source="root.0.1.1.0.0.0" x="96.000" y="308.400" font-size="20" font-weight="700" fill="#111827">Security labels</text>
<text data-source="root.0.1.1.0.0.1" x="984.000" y="308.400" font-size="20" font-weight="700" fill="#111827">Identity</text>
<text data-source="root.0.1.1.1.0.0" x="96.000" y="382.400" font-size="20" font-weight="700" fill="#111827">role=frontend</text>
<text data-source="root.0.1.1.1.0.1" x="984.000" y="382.400" font-size="20" font-weight="700" fill="#111827">10</text>
<text data-source="root.0.1.1.1.1.0" x="96.000" y="456.400" font-size="20" font-weight="700" fill="#111827">role=backend</text>
<text data-source="root.0.1.1.1.1.1" x="984.000" y="456.400" font-size="20" font-weight="700" fill="#111827">20</text>
<text data-source="root.0.1.1.1.2.0" x="96.000" y="530.400" font-size="20" font-weight="700" fill="#111827">role=backend, user=joe</text>
<text data-source="root.0.1.1.1.2.1" x="984.000" y="530.400" font-size="20" font-weight="700" fill="#111827">30</text>
<text data-source="root.0.2.0" x="112.000" y="621.700" font-size="20" font-weight="700" fill="#111827">정확한 label 집합: {role=backend}</text>
<text data-source="root.0.2.0" x="112.000" y="657.700" font-size="18" font-weight="400" fill="#111827">Cilium이 전체 security label 집합에 해당하는 numeric</text>
<text data-source="root.0.2.0" x="112.000" y="682.000" font-size="18" font-weight="400" fill="#111827">identity를 조회한다.</text>
<text data-source="root.0.2.2" x="736.000" y="633.850" font-size="20" font-weight="700" fill="#111827">Key-Value Store</text>
<text data-source="root.0.2.2" x="736.000" y="669.850" font-size="18" font-weight="400" fill="#111827">label 집합과 numeric identity 매핑을 보관한다.</text>
<text data-source="root.0.2.4" x="1360.000" y="621.700" font-size="20" font-weight="700" fill="#111827">Identity 20</text>
<text data-source="root.0.2.4" x="1360.000" y="657.700" font-size="18" font-weight="400" fill="#111827">정확히 role=backend만 포함한 집합의 cluster-wide</text>
<text data-source="root.0.2.4" x="1360.000" y="682.000" font-size="18" font-weight="400" fill="#111827">identity</text>
<text data-source="root.0.2.1" x="580.000" y="626.700" font-size="18" font-weight="400" fill="#111827">lookup</text>
<text data-source="root.0.2.3" x="1204.000" y="602.400" font-size="18" font-weight="400" fill="#111827">response:</text>
<text data-source="root.0.2.3" x="1204.000" y="626.700" font-size="18" font-weight="400" fill="#111827">identity 20</text>
<text data-source="root.0.3.0" x="80.000" y="757.600" font-size="20" font-weight="700" fill="#111827">Endpoint identities</text>
<text data-source="root.0.3.1.0" x="96.000" y="816.600" font-size="20" font-weight="700" fill="#111827">Node A</text>
<text data-source="root.0.3.1.0" x="96.000" y="852.600" font-size="18" font-weight="400" fill="#111827">Identity 10, role=frontend</text>
<text data-source="root.0.3.1.1" x="688.000" y="816.600" font-size="20" font-weight="700" fill="#111827">Node B</text>
<text data-source="root.0.3.1.1" x="688.000" y="852.600" font-size="18" font-weight="400" fill="#111827">Identity 10, role=frontend</text>
<text data-source="root.0.3.1.2" x="1280.000" y="816.600" font-size="20" font-weight="700" fill="#111827">Node C</text>
<text data-source="root.0.3.1.2" x="1280.000" y="852.600" font-size="18" font-weight="400" fill="#111827">Identity 20, role=backend</text>
<text data-source="root.0.4" x="64.000" y="924.900" font-size="18" font-weight="400" fill="#111827">더 구체적인 label 집합인 role=backend와 user=joe는 별도 Identity 30을 만들 수 있다. 이 예시의 정확한 집합 조회는 Identity 20입니다. 정책 selector role=backend는 Identity 20과 30 모두에 일치합니다. 숫자는 예시 매핑입니다.</text>
