<text data-source="root.0.0" x="64.000" y="104.200" font-size="36" font-weight="700" fill="#111827">Kubernetes cluster node는 공통 underlay network에 연결된다</text>
<text data-source="root.0.1.0" x="88.000" y="192.800" font-size="28" font-weight="700" fill="#111827">Underlay network 192.168.10.0/24</text>
<text data-source="root.0.1.1.0" x="112.000" y="278.600" font-size="28" font-weight="700" fill="#111827">Kubernetes cluster boundary</text>
<text data-source="root.0.1.1.1.0" x="136.000" y="364.400" font-size="28" font-weight="700" fill="#111827">k8s-ctr</text>
<text data-source="root.0.1.1.1.0" x="136.000" y="406.800" font-size="22" font-weight="400" fill="#111827">eth1 192.168.10.100</text>
<text data-source="root.0.1.1.1.1" x="996.000" y="364.400" font-size="28" font-weight="700" fill="#111827">k8s-w1</text>
<text data-source="root.0.1.1.1.1" x="996.000" y="406.800" font-size="22" font-weight="400" fill="#111827">eth1 192.168.10.101</text>
<text data-source="root.0.1.3" x="112.000" y="624.200" font-size="28" font-weight="700" fill="#111827">router</text>
<text data-source="root.0.1.3" x="112.000" y="666.600" font-size="22" font-weight="400" fill="#111827">eth1 192.168.10.200, cluster member가 아닌 외부 router입니다.</text>
<text data-source="root.0.1.2" x="980.000" y="524.500" font-size="22" font-weight="400" fill="#111827">same L2 underlay</text>
<text data-source="root.0.3" x="88.000" y="884.000" font-size="28" font-weight="700" fill="#111827">Corporate network 10.10.0.0/16</text>
<text data-source="root.0.3" x="88.000" y="926.400" font-size="22" font-weight="400" fill="#111827">router가 cluster 밖의 상위 network와 연결합니다.</text>
<text data-source="root.0.4" x="64.000" y="1004.100" font-size="22" font-weight="400" fill="#111827">192.168.20.0/24 interface는 구성되어 있지만 이 cluster 경로에서는 사용하지 않습니다.</text>
<text data-source="root.0.2" x="980.000" y="784.300" font-size="22" font-weight="400" fill="#111827">upstream corporate network</text>
