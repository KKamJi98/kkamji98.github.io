<polygon data-arrowhead="root.0.2.1.3" points="1327.688,698.250 1317.688,704.250 1317.688,692.250" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="179.550" font-size="36" font-weight="700" fill="#111827">Cilium Ingress 정책은 source와 destination identity를 두 경계에서 확인한다</text>
<text data-source="root.0.1.0" x="88.000" y="268.150" font-size="28" font-weight="700" fill="#111827">External client</text>
<text data-source="root.0.1.0" x="88.000" y="310.550" font-size="22" font-weight="400" fill="#111827">cluster 밖에서 들어오는 요청은 world identity입니다.</text>
<text data-source="root.0.2.0" x="88.000" y="503.950" font-size="28" font-weight="700" fill="#111827">Kubernetes cluster</text>
<text data-source="root.0.2.1.0" x="144.000" y="672.350" font-size="28" font-weight="700" fill="#111827">Load Balancer</text>
<text data-source="root.0.2.1.0" x="144.000" y="714.750" font-size="22" font-weight="400" fill="#111827">Kubernetes Service가 외부 요청을 cluster로</text>
<text data-source="root.0.2.1.0" x="144.000" y="744.450" font-size="22" font-weight="400" fill="#111827">받습니다.</text>
<text data-source="root.0.2.1.2" x="753.844" y="672.350" font-size="28" font-weight="700" fill="#111827">Ingress</text>
<text data-source="root.0.2.1.2" x="753.844" y="714.750" font-size="22" font-weight="400" fill="#111827">Envoy를 거쳐 backend로 보내는 트래픽의</text>
<text data-source="root.0.2.1.2" x="753.844" y="744.450" font-size="22" font-weight="400" fill="#111827">source identity는 ingress입니다.</text>
<text data-source="root.0.2.1.4" x="1363.688" y="657.500" font-size="28" font-weight="700" fill="#111827">productpage-app Pod</text>
<text data-source="root.0.2.1.4" x="1363.688" y="699.900" font-size="22" font-weight="400" fill="#111827">destination identity가 productpage인</text>
<text data-source="root.0.2.1.4" x="1363.688" y="729.600" font-size="22" font-weight="400" fill="#111827">backend입니다. source는 ingress로</text>
<text data-source="root.0.2.1.4" x="1363.688" y="759.300" font-size="22" font-weight="400" fill="#111827">평가합니다.</text>
<text data-source="root.0.2.1.1" x="584.312" y="589.450" font-size="22" font-weight="400" fill="#111827">첫 정책 경계:</text>
<text data-source="root.0.2.1.1" x="584.312" y="619.150" font-size="22" font-weight="400" fill="#111827">source world,</text>
<text data-source="root.0.2.1.1" x="584.312" y="648.850" font-size="22" font-weight="400" fill="#111827">destination</text>
<text data-source="root.0.2.1.1" x="584.312" y="678.550" font-size="22" font-weight="400" fill="#111827">ingress</text>
<text data-source="root.0.2.1.3" x="1194.156" y="559.750" font-size="22" font-weight="400" fill="#111827">두 번째 정책</text>
<text data-source="root.0.2.1.3" x="1194.156" y="589.450" font-size="22" font-weight="400" fill="#111827">경계: source</text>
<text data-source="root.0.2.1.3" x="1194.156" y="619.150" font-size="22" font-weight="400" fill="#111827">ingress,</text>
<text data-source="root.0.2.1.3" x="1194.156" y="648.850" font-size="22" font-weight="400" fill="#111827">destination</text>
<text data-source="root.0.2.1.3" x="1194.156" y="678.550" font-size="22" font-weight="400" fill="#111827">productpage</text>
<text data-source="root.0.3" x="64.000" y="928.750" font-size="22" font-weight="400" fill="#111827">정책 집행 지점은 world에서 ingress로 들어오는 경계와 ingress에서 backend로 나가는 경계에 각각 있습니다.</text>
<text data-source="root.0.1.1" x="84.000" y="388.250" font-size="22" font-weight="400" fill="#111827">world identity로 진입</text>
</svg>
