<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.2" d="M 960.000 354.250 L 960.000 397.100 L 960.000 397.100 L 960.000 439.950" fill="none" stroke="#475569" stroke-width="3"><title>world identity로 진입</title></path>
