<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="22190417b57d1784afb227f1b07377dfcc57595c7c792d066773b403b11386c7">
