<polygon data-arrowhead="root.0.3.1.1.3" points="1004.000,829.700 994.000,835.700 994.000,823.700" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="122.100" font-size="36" font-weight="700" fill="#111827">kube-proxy replacement은 Service datapath 책임을 Cilium eBPF로 옮긴다</text>
<text data-source="root.0.1" x="64.000" y="168.700" font-size="18" font-weight="400" fill="#111827">같은 Service 요청이라도 기존 경로는 kube-proxy가 만든 iptables와 host stack을 거치고, replacement 경로는 Cilium eBPF가 endpoint lookup과 forwarding을 맡습니다.</text>
<text data-source="root.0.2.0" x="80.000" y="227.000" font-size="20" font-weight="700" fill="#111827">Pod A request</text>
<text data-source="root.0.2.0" x="80.000" y="263.000" font-size="18" font-weight="400" fill="#111827">curl이 Service ClusterIP로 요청을 보냅니다.</text>
<text data-source="root.0.3.0.0" x="80.000" y="409.600" font-size="20" font-weight="700" fill="#111827">기존 kube-proxy path</text>
<text data-source="root.0.3.0.1.0" x="128.000" y="468.600" font-size="20" font-weight="700" fill="#111827">Pod A socket와 veth</text>
<text data-source="root.0.3.0.1.0" x="128.000" y="504.600" font-size="18" font-weight="400" fill="#111827">Pod 네트워크에서 host 쪽으로</text>
<text data-source="root.0.3.0.1.0" x="128.000" y="528.900" font-size="18" font-weight="400" fill="#111827">나옵니다.</text>
<text data-source="root.0.3.0.1.2" x="596.000" y="468.600" font-size="20" font-weight="700" fill="#111827">kube-proxy iptables</text>
<text data-source="root.0.3.0.1.2" x="596.000" y="504.600" font-size="18" font-weight="400" fill="#111827">Service와 endpoint를 DNAT</text>
<text data-source="root.0.3.0.1.2" x="596.000" y="528.900" font-size="18" font-weight="400" fill="#111827">rule로 연결합니다.</text>
<text data-source="root.0.3.0.1.4" x="128.000" y="683.200" font-size="20" font-weight="700" fill="#111827">Linux routing와 FORWARD</text>
<text data-source="root.0.3.0.1.4" x="128.000" y="719.200" font-size="18" font-weight="400" fill="#111827">PREROUTING, FORWARD,</text>
<text data-source="root.0.3.0.1.4" x="128.000" y="743.500" font-size="18" font-weight="400" fill="#111827">POSTROUTING chain을</text>
<text data-source="root.0.3.0.1.4" x="128.000" y="767.800" font-size="18" font-weight="400" fill="#111827">통과합니다.</text>
<text data-source="root.0.3.0.1.6" x="596.000" y="695.350" font-size="20" font-weight="700" fill="#111827">Pod B endpoint</text>
<text data-source="root.0.3.0.1.6" x="596.000" y="731.350" font-size="18" font-weight="400" fill="#111827">반대쪽 veth와 socket으로</text>
<text data-source="root.0.3.0.1.6" x="596.000" y="755.650" font-size="18" font-weight="400" fill="#111827">도착합니다.</text>
<text data-source="root.0.3.0.1.1" x="440.000" y="473.600" font-size="18" font-weight="400" fill="#111827">DNAT 규칙 조회</text>
<text data-source="root.0.3.0.1.3" x="120.000" y="591.200" font-size="18" font-weight="400" fill="#111827">host stack traversal</text>
<text data-source="root.0.3.0.1.5" x="440.000" y="700.350" font-size="18" font-weight="400" fill="#111827">endpoint 전달</text>
<text data-source="root.0.3.1.0" x="984.000" y="409.600" font-size="20" font-weight="700" fill="#111827">Cilium eBPF replacement</text>
<text data-source="root.0.3.1.1.0" x="1032.000" y="518.050" font-size="20" font-weight="700" fill="#111827">Pod A Service request</text>
<text data-source="root.0.3.1.1.0" x="1032.000" y="554.050" font-size="18" font-weight="400" fill="#111827">Service 주소에 대한 요청이며 적용</text>
<text data-source="root.0.3.1.1.0" x="1032.000" y="578.350" font-size="18" font-weight="400" fill="#111827">hook은 구성에 따라 다릅니다.</text>
<text data-source="root.0.3.1.1.2" x="1500.000" y="468.600" font-size="20" font-weight="700" fill="#111827">Cilium eBPF service</text>
<text data-source="root.0.3.1.1.2" x="1500.000" y="494.600" font-size="20" font-weight="700" fill="#111827">datapath</text>
<text data-source="root.0.3.1.1.2" x="1500.000" y="530.600" font-size="18" font-weight="400" fill="#111827">기본 socket-LB는 socket에서</text>
<text data-source="root.0.3.1.1.2" x="1500.000" y="554.900" font-size="18" font-weight="400" fill="#111827">backend를 선택합니다. Pod</text>
<text data-source="root.0.3.1.1.2" x="1500.000" y="579.200" font-size="18" font-weight="400" fill="#111827">namespace 우회 구성은</text>
<text data-source="root.0.3.1.1.2" x="1500.000" y="603.500" font-size="18" font-weight="400" fill="#111827">tc/veth에서 Service lookup을</text>
<text data-source="root.0.3.1.1.2" x="1500.000" y="627.800" font-size="18" font-weight="400" fill="#111827">수행합니다.</text>
<text data-source="root.0.3.1.1.4" x="1032.000" y="782.100" font-size="20" font-weight="700" fill="#111827">Pod B endpoint</text>
<text data-source="root.0.3.1.1.4" x="1032.000" y="818.100" font-size="18" font-weight="400" fill="#111827">kube-proxy의 Service NAT를</text>
<text data-source="root.0.3.1.1.4" x="1032.000" y="842.400" font-size="18" font-weight="400" fill="#111827">대체하지만 모든 host</text>
<text data-source="root.0.3.1.1.4" x="1032.000" y="866.700" font-size="18" font-weight="400" fill="#111827">networking을 우회하지는</text>
<text data-source="root.0.3.1.1.4" x="1032.000" y="891.000" font-size="18" font-weight="400" fill="#111827">않습니다.</text>
<text data-source="root.0.3.1.1.1" x="1344.000" y="498.750" font-size="18" font-weight="400" fill="#111827">kernel service</text>
<text data-source="root.0.3.1.1.1" x="1344.000" y="523.050" font-size="18" font-weight="400" fill="#111827">lookup</text>
<text data-source="root.0.3.1.1.3" x="1024.000" y="690.100" font-size="18" font-weight="400" fill="#111827">host 작업을 줄여 전달</text>
<text data-source="root.0.3.1.2" x="984.000" y="947.300" font-size="18" font-weight="400" fill="#111827">socketLB.hostNamespaceOnly=true는 Pod namespace의 socket rewrite 대신 tc/veth fallback을</text>
<text data-source="root.0.3.1.2" x="984.000" y="971.600" font-size="18" font-weight="400" fill="#111827">사용합니다. socket과 veth를 필수 연속 LB 단계로 읽으면 안 됩니다.</text>
<text data-source="root.0.2.1" x="84.000" y="319.300" font-size="18" font-weight="400" fill="#111827">Service endpoint 선택</text>
</svg>
