<path data-edge="root.0.2.1" data-from="root.0.2.0" data-to="root.0.3" d="M 960.000 297.300 L 960.000 329.450 L 960.000 329.450 L 960.000 361.600" fill="none" stroke="#475569" stroke-width="3"><title>Service endpoint 선택</title></path>
