<path data-edge="root.0.2.1" data-from="root.0.2.0" data-to="root.0.2.2" d="M 432.000 245.800 L 552.000 245.800" fill="none" stroke="#475569" stroke-width="3"><title>host forwarding</title></path>
<polygon data-arrowhead="root.0.2.1" points="552.000,245.800 542.000,251.800 542.000,239.800" fill="#475569"/>
<path data-edge="root.0.2.3" data-from="root.0.2.2" data-to="root.0.2.4" d="M 900.000 245.800 L 1020.000 245.800" fill="none" stroke="#475569" stroke-width="3"><title>endpoint policy</title></path>
<polygon data-arrowhead="root.0.2.3" points="1020.000,245.800 1010.000,251.800 1010.000,239.800" fill="#475569"/>
<path data-edge="root.0.2.5" data-from="root.0.2.4" data-to="root.0.2.6" d="M 1368.000 245.800 L 1488.000 245.800" fill="none" stroke="#475569" stroke-width="3"><title>deliver</title></path>
<polygon data-arrowhead="root.0.2.5" points="1488.000,245.800 1478.000,251.800 1478.000,239.800" fill="#475569"/>
