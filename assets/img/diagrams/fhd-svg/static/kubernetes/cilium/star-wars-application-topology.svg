<text data-source="root.0.0" x="64.000" y="106.300" font-size="36" font-weight="700" fill="#111827">Star Wars Demo는 label 정책으로 착륙 요청을 나눕니다</text>
<text data-source="root.0.1" x="64.000" y="164.900" font-size="22" font-weight="400" fill="#111827">세 서비스는 모두 namespace=default에 있고, deathstar Service는 HTTP port 80에서 두 replica로 요청을 전달합니다.</text>
<text data-source="root.0.2.0" x="88.000" y="248.600" font-size="28" font-weight="700" fill="#111827">namespace=default</text>
<text data-source="root.0.2.1.0.0" x="112.000" y="334.400" font-size="28" font-weight="700" fill="#111827">허용 경로: Empire</text>
<text data-source="root.0.2.1.0.1.0" x="168.000" y="438.400" font-size="28" font-weight="700" fill="#111827">tiefighter</text>
<text data-source="root.0.2.1.0.1.0" x="168.000" y="480.800" font-size="22" font-weight="400" fill="#111827">org=empire,</text>
<text data-source="root.0.2.1.0.1.0" x="168.000" y="510.500" font-size="22" font-weight="400" fill="#111827">class=tiefighter</text>
<text data-source="root.0.2.1.0.1.2" x="614.000" y="420.200" font-size="28" font-weight="700" fill="#111827">HTTP landing</text>
<text data-source="root.0.2.1.0.1.2" x="614.000" y="456.600" font-size="28" font-weight="700" fill="#111827">request</text>
<text data-source="root.0.2.1.0.1.2" x="614.000" y="499.000" font-size="22" font-weight="400" fill="#111827">POST</text>
<text data-source="root.0.2.1.0.1.2" x="614.000" y="528.700" font-size="22" font-weight="400" fill="#111827">/v1/request-landing</text>
<text data-source="root.0.2.1.0.1.4" x="168.000" y="708.400" font-size="28" font-weight="700" fill="#111827">deathstar</text>
<text data-source="root.0.2.1.0.1.4" x="168.000" y="744.800" font-size="28" font-weight="700" fill="#111827">Service</text>
<text data-source="root.0.2.1.0.1.4" x="168.000" y="787.200" font-size="22" font-weight="400" fill="#111827">selector가</text>
<text data-source="root.0.2.1.0.1.4" x="168.000" y="816.900" font-size="22" font-weight="400" fill="#111827">class=deathstar Pod 두</text>
<text data-source="root.0.2.1.0.1.4" x="168.000" y="846.600" font-size="22" font-weight="400" fill="#111827">개로 load</text>
<text data-source="root.0.2.1.0.1.4" x="168.000" y="876.300" font-size="22" font-weight="400" fill="#111827">balance합니다.</text>
<text data-source="root.0.2.1.0.1.6" x="614.000" y="738.100" font-size="28" font-weight="700" fill="#111827">deathstar</text>
<text data-source="root.0.2.1.0.1.6" x="614.000" y="774.500" font-size="28" font-weight="700" fill="#111827">replicas</text>
<text data-source="root.0.2.1.0.1.6" x="614.000" y="816.900" font-size="22" font-weight="400" fill="#111827">두 Pod가 착륙 요청을</text>
<text data-source="root.0.2.1.0.1.6" x="614.000" y="846.600" font-size="22" font-weight="400" fill="#111827">처리합니다.</text>
<text data-source="root.0.2.1.0.1.1" x="450.000" y="414.900" font-size="22" font-weight="400" fill="#111827">request</text>
<text data-source="root.0.2.1.0.1.1" x="450.000" y="444.600" font-size="22" font-weight="400" fill="#111827">issued</text>
<text data-source="root.0.2.1.0.1.3" x="152.000" y="600.400" font-size="22" font-weight="400" fill="#111827">L3/L4 정책 일치</text>
<text data-source="root.0.2.1.0.1.5" x="450.000" y="732.800" font-size="22" font-weight="400" fill="#111827">Service port</text>
<text data-source="root.0.2.1.0.1.5" x="450.000" y="762.500" font-size="22" font-weight="400" fill="#111827">80</text>
<text data-source="root.0.2.1.1.0" x="996.000" y="334.400" font-size="28" font-weight="700" fill="#111827">차단 경로: Alliance</text>
<text data-source="root.0.2.1.1.1.0" x="1052.000" y="438.400" font-size="28" font-weight="700" fill="#111827">xwing</text>
<text data-source="root.0.2.1.1.1.0" x="1052.000" y="480.800" font-size="22" font-weight="400" fill="#111827">org=alliance,</text>
<text data-source="root.0.2.1.1.1.0" x="1052.000" y="510.500" font-size="22" font-weight="400" fill="#111827">class=xwing</text>
<text data-source="root.0.2.1.1.1.2" x="1498.000" y="420.200" font-size="28" font-weight="700" fill="#111827">HTTP landing</text>
<text data-source="root.0.2.1.1.1.2" x="1498.000" y="456.600" font-size="28" font-weight="700" fill="#111827">request</text>
<text data-source="root.0.2.1.1.1.2" x="1498.000" y="499.000" font-size="22" font-weight="400" fill="#111827">POST</text>
<text data-source="root.0.2.1.1.1.2" x="1498.000" y="528.700" font-size="22" font-weight="400" fill="#111827">/v1/request-landing</text>
<text data-source="root.0.2.1.1.1.4" x="1052.000" y="708.400" font-size="28" font-weight="700" fill="#111827">Cilium policy</text>
<text data-source="root.0.2.1.1.1.4" x="1052.000" y="744.800" font-size="28" font-weight="700" fill="#111827">verdict</text>
<text data-source="root.0.2.1.1.1.4" x="1052.000" y="787.200" font-size="22" font-weight="400" fill="#111827">Empire label 조건을</text>
<text data-source="root.0.2.1.1.1.4" x="1052.000" y="816.900" font-size="22" font-weight="400" fill="#111827">만족하지 않아 deathstar</text>
<text data-source="root.0.2.1.1.1.4" x="1052.000" y="846.600" font-size="22" font-weight="400" fill="#111827">접근을 deny합니다.</text>
<text data-source="root.0.2.1.1.1.1" x="1334.000" y="414.900" font-size="22" font-weight="400" fill="#111827">request</text>
<text data-source="root.0.2.1.1.1.1" x="1334.000" y="444.600" font-size="22" font-weight="400" fill="#111827">issued</text>
<text data-source="root.0.2.1.1.1.3" x="1036.000" y="600.400" font-size="22" font-weight="400" fill="#111827">정책 조건 불일치</text>
<text data-source="root.0.3" x="64.000" y="1002.000" font-size="22" font-weight="400" fill="#111827">L7 정책을 추가하면 허용된 tiefighter도 HTTP method나 path 조건을 더 확인할 수 있고, Hubble이 allow와 deny verdict를 관찰합니다.</text>
</svg>
