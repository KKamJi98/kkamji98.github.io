<polygon data-arrowhead="root.0.1.2.1.1.1.1.1" points="1643.000,730.100 1637.000,720.100 1649.000,720.100" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="176.700" font-size="36" font-weight="700" fill="#111827">L7 policy는 identity와 HTTP method, path를 함께 검사한다</text>
<text data-source="root.0.1.0" x="84.000" y="253.300" font-size="24" font-weight="700" fill="#111827">namespace=default</text>
<text data-source="root.0.1.1" x="84.000" y="301.700" font-size="20" font-weight="400" fill="#111827">Ingress Network Policy: tiefighter to deathstar allow tcp/80, HTTP POST /v1/request-landing</text>
<text data-source="root.0.1.2.0.0" x="104.000" y="372.700" font-size="24" font-weight="700" fill="#111827">Allowed request</text>
<text data-source="root.0.1.2.0.1.0" x="156.000" y="460.700" font-size="24" font-weight="700" fill="#111827">tiefighter</text>
<text data-source="root.0.1.2.0.1.0" x="156.000" y="499.900" font-size="20" font-weight="400" fill="#111827">org=empire,</text>
<text data-source="root.0.1.2.0.1.0" x="156.000" y="526.900" font-size="20" font-weight="400" fill="#111827">class=tiefighter</text>
<text data-source="root.0.1.2.0.1.2" x="609.000" y="445.100" font-size="24" font-weight="700" fill="#111827">HTTP POST</text>
<text data-source="root.0.1.2.0.1.2" x="609.000" y="476.300" font-size="24" font-weight="700" fill="#111827">/v1/request-landing</text>
<text data-source="root.0.1.2.0.1.2" x="609.000" y="515.500" font-size="20" font-weight="400" fill="#111827">L7 rule이 method와 path를</text>
<text data-source="root.0.1.2.0.1.2" x="609.000" y="542.500" font-size="20" font-weight="400" fill="#111827">모두 만족합니다.</text>
<text data-source="root.0.1.2.0.1.4" x="382.500" y="709.500" font-size="24" font-weight="700" fill="#111827">deathstar</text>
<text data-source="root.0.1.2.0.1.4" x="382.500" y="748.700" font-size="20" font-weight="400" fill="#111827">org=empire,</text>
<text data-source="root.0.1.2.0.1.4" x="382.500" y="775.700" font-size="20" font-weight="400" fill="#111827">class=deathstar</text>
<text data-source="root.0.1.2.0.1.1" x="449.000" y="439.300" font-size="20" font-weight="400" fill="#111827">TCP/80 and</text>
<text data-source="root.0.1.2.0.1.1" x="449.000" y="466.300" font-size="20" font-weight="400" fill="#111827">POST path</text>
<text data-source="root.0.1.2.0.1.3" x="529.000" y="609.500" font-size="20" font-weight="400" fill="#111827">allow</text>
<text data-source="root.0.1.2.1.0" x="990.000" y="372.700" font-size="24" font-weight="700" fill="#111827">Denied requests</text>
<text data-source="root.0.1.2.1.1.0.0" x="1010.000" y="445.100" font-size="24" font-weight="700" fill="#111827">Method and path mismatch</text>
<text data-source="root.0.1.2.1.1.0.1.0" x="1030.000" y="517.500" font-size="24" font-weight="700" fill="#111827">tiefighter</text>
<text data-source="root.0.1.2.1.1.0.1.0" x="1030.000" y="556.700" font-size="20" font-weight="400" fill="#111827">org=empire, class=tiefighter</text>
<text data-source="root.0.1.2.1.1.0.1.2" x="1030.000" y="753.700" font-size="24" font-weight="700" fill="#111827">deathstar: denied</text>
<text data-source="root.0.1.2.1.1.0.1.2" x="1030.000" y="792.900" font-size="20" font-weight="400" fill="#111827">method 또는 path가 허용 rule과</text>
<text data-source="root.0.1.2.1.1.0.1.2" x="1030.000" y="819.900" font-size="20" font-weight="400" fill="#111827">다릅니다.</text>
<text data-source="root.0.1.2.1.1.0.1.1" x="1240.000" y="639.700" font-size="20" font-weight="400" fill="#111827">HTTP PUT</text>
<text data-source="root.0.1.2.1.1.0.1.1" x="1240.000" y="666.700" font-size="20" font-weight="400" fill="#111827">/v1/exhaust-port</text>
<text data-source="root.0.1.2.1.1.1.0" x="1490.000" y="445.100" font-size="24" font-weight="700" fill="#111827">Source identity</text>
<text data-source="root.0.1.2.1.1.1.0" x="1490.000" y="476.300" font-size="24" font-weight="700" fill="#111827">mismatch</text>
<text data-source="root.0.1.2.1.1.1.1.0" x="1510.000" y="549.900" font-size="24" font-weight="700" fill="#111827">xwing</text>
<text data-source="root.0.1.2.1.1.1.1.0" x="1510.000" y="589.100" font-size="20" font-weight="400" fill="#111827">org=alliance, class=xwing</text>
<text data-source="root.0.1.2.1.1.1.1.2" x="1510.000" y="786.100" font-size="24" font-weight="700" fill="#111827">deathstar: denied</text>
<text data-source="root.0.1.2.1.1.1.1.2" x="1510.000" y="825.300" font-size="20" font-weight="400" fill="#111827">source identity가 정책의</text>
<text data-source="root.0.1.2.1.1.1.1.2" x="1510.000" y="852.300" font-size="20" font-weight="400" fill="#111827">empire 조건과 다릅니다.</text>
<text data-source="root.0.1.2.1.1.1.1.1" x="1663.000" y="672.100" font-size="20" font-weight="400" fill="#111827">TCP/80</text>
<text data-source="root.0.1.2.1.1.1.1.1" x="1663.000" y="699.100" font-size="20" font-weight="400" fill="#111827">request</text>
</svg>
