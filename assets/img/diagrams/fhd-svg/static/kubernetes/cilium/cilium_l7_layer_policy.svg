<text data-source="root.0.0" x="64.000" y="163.200" font-size="36" font-weight="700" fill="#111827">L7 policy는 identity와 HTTP method, path를 함께 검사한다</text>
<text data-source="root.0.1.0" x="84.000" y="239.800" font-size="24" font-weight="700" fill="#111827">namespace=default</text>
<text data-source="root.0.1.1" x="84.000" y="288.200" font-size="20" font-weight="400" fill="#111827">Ingress Network Policy: tiefighter to deathstar allow tcp/80, HTTP POST /v1/request-landing</text>
<text data-source="root.0.1.2.0.0" x="104.000" y="359.200" font-size="24" font-weight="700" fill="#111827">Allowed request</text>
<text data-source="root.0.1.2.0.1.0" x="156.000" y="447.200" font-size="24" font-weight="700" fill="#111827">tiefighter</text>
<text data-source="root.0.1.2.0.1.0" x="156.000" y="486.400" font-size="20" font-weight="400" fill="#111827">org=empire,</text>
<text data-source="root.0.1.2.0.1.0" x="156.000" y="513.400" font-size="20" font-weight="400" fill="#111827">class=tiefighter</text>
<text data-source="root.0.1.2.0.1.2" x="609.000" y="431.600" font-size="24" font-weight="700" fill="#111827">HTTP POST</text>
<text data-source="root.0.1.2.0.1.2" x="609.000" y="462.800" font-size="24" font-weight="700" fill="#111827">/v1/request-landing</text>
<text data-source="root.0.1.2.0.1.2" x="609.000" y="502.000" font-size="20" font-weight="400" fill="#111827">L7 rule이 method와 path를</text>
<text data-source="root.0.1.2.0.1.2" x="609.000" y="529.000" font-size="20" font-weight="400" fill="#111827">모두 만족합니다.</text>
<text data-source="root.0.1.2.0.1.4" x="156.000" y="696.000" font-size="24" font-weight="700" fill="#111827">deathstar</text>
<text data-source="root.0.1.2.0.1.4" x="156.000" y="735.200" font-size="20" font-weight="400" fill="#111827">org=empire,</text>
<text data-source="root.0.1.2.0.1.4" x="156.000" y="762.200" font-size="20" font-weight="400" fill="#111827">class=deathstar</text>
<text data-source="root.0.1.2.0.1.1" x="449.000" y="425.800" font-size="20" font-weight="400" fill="#111827">TCP/80 and</text>
<text data-source="root.0.1.2.0.1.1" x="449.000" y="452.800" font-size="20" font-weight="400" fill="#111827">POST path</text>
<text data-source="root.0.1.2.0.1.3" x="144.000" y="596.000" font-size="20" font-weight="400" fill="#111827">allow</text>
<text data-source="root.0.1.2.1.0" x="990.000" y="359.200" font-size="24" font-weight="700" fill="#111827">Denied requests</text>
<text data-source="root.0.1.2.1.1.0.0" x="1010.000" y="431.600" font-size="24" font-weight="700" fill="#111827">Method and path</text>
<text data-source="root.0.1.2.1.1.0.0" x="1010.000" y="462.800" font-size="24" font-weight="700" fill="#111827">mismatch</text>
<text data-source="root.0.1.2.1.1.0.1.0" x="1030.000" y="536.400" font-size="24" font-weight="700" fill="#111827">tiefighter</text>
<text data-source="root.0.1.2.1.1.0.1.0" x="1030.000" y="575.600" font-size="20" font-weight="400" fill="#111827">org=empire, class=tiefighter</text>
<text data-source="root.0.1.2.1.1.0.1.2" x="1030.000" y="799.600" font-size="24" font-weight="700" fill="#111827">deathstar: denied</text>
<text data-source="root.0.1.2.1.1.0.1.2" x="1030.000" y="838.800" font-size="20" font-weight="400" fill="#111827">method 또는 path가 허용 rule과</text>
<text data-source="root.0.1.2.1.1.0.1.2" x="1030.000" y="865.800" font-size="20" font-weight="400" fill="#111827">다릅니다.</text>
<text data-source="root.0.1.2.1.1.0.1.1" x="1211.500" y="658.600" font-size="20" font-weight="400" fill="#111827">HTTP PUT</text>
<text data-source="root.0.1.2.1.1.0.1.1" x="1211.500" y="685.600" font-size="20" font-weight="400" fill="#111827">/v1/exhaust-</text>
<text data-source="root.0.1.2.1.1.0.1.1" x="1211.500" y="712.600" font-size="20" font-weight="400" fill="#111827">port</text>
<text data-source="root.0.1.2.1.1.1.0" x="1433.000" y="431.600" font-size="24" font-weight="700" fill="#111827">Source identity mismatch</text>
<text data-source="root.0.1.2.1.1.1.1.0" x="1453.000" y="504.000" font-size="24" font-weight="700" fill="#111827">xwing</text>
<text data-source="root.0.1.2.1.1.1.1.0" x="1453.000" y="543.200" font-size="20" font-weight="400" fill="#111827">org=alliance, class=xwing</text>
<text data-source="root.0.1.2.1.1.1.1.2" x="1453.000" y="740.200" font-size="24" font-weight="700" fill="#111827">deathstar: denied</text>
<text data-source="root.0.1.2.1.1.1.1.2" x="1453.000" y="779.400" font-size="20" font-weight="400" fill="#111827">source identity가 정책의 empire</text>
<text data-source="root.0.1.2.1.1.1.1.2" x="1453.000" y="806.400" font-size="20" font-weight="400" fill="#111827">조건과 다릅니다.</text>
<text data-source="root.0.1.2.1.1.1.1.1" x="1634.500" y="626.200" font-size="20" font-weight="400" fill="#111827">TCP/80</text>
<text data-source="root.0.1.2.1.1.1.1.1" x="1634.500" y="653.200" font-size="20" font-weight="400" fill="#111827">request</text>
</svg>
