<path data-edge="root.0.1.2.0.1.1" data-from="root.0.1.2.0.1.0" data-to="root.0.1.2.0.1.2" d="M 457.000 485.300 L 577.000 485.300" fill="none" stroke="#475569" stroke-width="3"><title>TCP/80 and POST path</title></path>
