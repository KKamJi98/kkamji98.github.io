<text data-source="root.0.0" x="64.000" y="156.000" font-size="36" font-weight="700" fill="#111827">Cilium의 control input은 kernel BPF program으로 내려간다</text>
<text data-source="root.0.1.0" x="74.000" y="204.600" font-size="16" font-weight="700" fill="#111827">Cilium layer</text>
<text data-source="root.0.1.1.0.0" x="116.000" y="246.200" font-size="16" font-weight="700" fill="#111827">Orchestration systems</text>
<text data-source="root.0.1.1.0.0" x="116.000" y="277.000" font-size="14" font-weight="400" fill="#111827">resource와 status를 Cilium Plugins와 교환합니다.</text>
<text data-source="root.0.1.1.0.2" x="596.500" y="246.200" font-size="16" font-weight="700" fill="#111827">Cilium Plugins</text>
<text data-source="root.0.1.1.0.2" x="596.500" y="277.000" font-size="14" font-weight="400" fill="#111827">orchestration API를 daemon 입력으로 전달합니다.</text>
<text data-source="root.0.1.1.0.1" x="446.500" y="239.150" font-size="14" font-weight="400" fill="#111827">plugin event</text>
<text data-source="root.0.1.1.1" x="975.000" y="246.200" font-size="16" font-weight="700" fill="#111827">Cilium CLI</text>
<text data-source="root.0.1.1.1" x="975.000" y="277.000" font-size="14" font-weight="400" fill="#111827">운영자의 상태 조회와 정책 명령입니다.</text>
<text data-source="root.0.1.1.2" x="84.000" y="327.900" font-size="16" font-weight="700" fill="#111827">Policy Repository</text>
<text data-source="root.0.1.1.2" x="84.000" y="358.700" font-size="14" font-weight="400" fill="#111827">적용할 network policy의 원천입니다.</text>
<text data-source="root.0.1.3" x="84.000" y="475.600" font-size="16" font-weight="700" fill="#111827">Cilium Daemon</text>
<text data-source="root.0.1.3" x="84.000" y="506.400" font-size="14" font-weight="400" fill="#111827">Code Generation으로 node datapath와 정책을 구성하고 상태 조회를 처리합니다.</text>
<text data-source="root.0.1.4" x="84.000" y="557.300" font-size="16" font-weight="700" fill="#111827">Cilium Monitor</text>
<text data-source="root.0.1.4" x="84.000" y="588.100" font-size="14" font-weight="400" fill="#111827">datapath event 관찰. 구성 입력 경로와 구분합니다.</text>
<text data-source="root.0.1.2" x="980.000" y="416.150" font-size="14" font-weight="400" fill="#111827">독립 구성 입력</text>
<text data-source="root.0.3.0" x="74.000" y="715.000" font-size="16" font-weight="700" fill="#111827">Linux kernel data plane</text>
<text data-source="root.0.3.1" x="84.000" y="756.600" font-size="16" font-weight="700" fill="#111827">BPF Programs</text>
<text data-source="root.0.3.1" x="84.000" y="787.400" font-size="14" font-weight="400" fill="#111827">여러 network path에 적용하는 program 집합</text>
<text data-source="root.0.3.3.0" x="84.000" y="904.300" font-size="16" font-weight="700" fill="#111827">eth0</text>
<text data-source="root.0.3.3.0" x="84.000" y="935.100" font-size="14" font-weight="400" fill="#111827">host network interface에서 packet을 처리합니다.</text>
<text data-source="root.0.3.3.1" x="975.000" y="904.300" font-size="16" font-weight="700" fill="#111827">Containers</text>
<text data-source="root.0.3.3.1" x="975.000" y="935.100" font-size="14" font-weight="400" fill="#111827">각 workload network path에 policy와 관측을 적용합니다.</text>
<text data-source="root.0.3.2" x="980.000" y="844.850" font-size="14" font-weight="400" fill="#111827">host interface와 workload hook에 독립 fan-out</text>
<text data-source="root.0.2" x="980.000" y="655.550" font-size="14" font-weight="400" fill="#111827">bytecode injection</text>
</svg>
