<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 960.000 244.750 L 960.000 309.050" fill="none" stroke="#475569" stroke-width="3"><title>Operator 설치 후 MongoDBCommunity CR 적용</title></path>
<polygon data-arrowhead="root.0.1.1" points="960.000,309.050 954.000,299.050 966.000,299.050" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 960.000 427.350 L 960.000 491.650" fill="none" stroke="#475569" stroke-width="3"><title>workload 관리</title></path>
<polygon data-arrowhead="root.0.1.3" points="960.000,491.650 954.000,481.650 966.000,481.650" fill="#475569"/>
<path data-edge="root.0.1.5" data-from="root.0.1.4" data-to="root.0.1.6" d="M 960.000 609.950 L 960.000 674.250" fill="none" stroke="#475569" stroke-width="3"><title>ordinal별 Pod 생성</title></path>
<polygon data-arrowhead="root.0.1.5" points="960.000,674.250 954.000,664.250 966.000,664.250" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="109.850" font-size="36" font-weight="700" fill="#111827">StatefulSet이 MongoDB Pod마다 stable name과 volume을 붙인다</text>
<text data-source="root.0.1.0" x="80.000" y="174.450" font-size="20" font-weight="700" fill="#111827">Helm release</text>
<text data-source="root.0.1.0" x="80.000" y="210.450" font-size="18" font-weight="400" fill="#111827">community-operator chart로 MongoDB Community Operator를 배포합니다.</text>
<text data-source="root.0.1.2" x="80.000" y="357.050" font-size="20" font-weight="700" fill="#111827">MongoDB Community Operator</text>
<text data-source="root.0.1.2" x="80.000" y="393.050" font-size="18" font-weight="400" fill="#111827">MongoDBCommunity에 선언한 topology를 reconcile합니다.</text>
<text data-source="root.0.1.4" x="80.000" y="539.650" font-size="20" font-weight="700" fill="#111827">StatefulSet</text>
<text data-source="root.0.1.4" x="80.000" y="575.650" font-size="18" font-weight="400" fill="#111827">ordered rollout과 stable identity를 관리합니다.</text>
<text data-source="root.0.1.6" x="80.000" y="722.250" font-size="20" font-weight="700" fill="#111827">MongoDB Pod</text>
<text data-source="root.0.1.6" x="80.000" y="758.250" font-size="18" font-weight="400" fill="#111827">mongodb-0, mongodb-1처럼 이름이 유지됩니다.</text>
<text data-source="root.0.1.7.0.0" x="80.000" y="832.550" font-size="20" font-weight="700" fill="#111827">Pod별 영속 저장소</text>
<text data-source="root.0.1.7.0.1" x="96.000" y="891.550" font-size="20" font-weight="700" fill="#111827">PersistentVolumeClaim</text>
<text data-source="root.0.1.7.0.1" x="96.000" y="927.550" font-size="18" font-weight="400" fill="#111827">volumeClaimTemplate으로 replica마다 생성되어 ordinal의 data와 연결됩니다.</text>
<text data-source="root.0.1.7.1.0" x="984.000" y="832.550" font-size="20" font-weight="700" fill="#111827">Pod member discovery</text>
<text data-source="root.0.1.7.1.1" x="1000.000" y="891.550" font-size="20" font-weight="700" fill="#111827">Headless Service</text>
<text data-source="root.0.1.7.1.1" x="1000.000" y="927.550" font-size="18" font-weight="400" fill="#111827">MongoDB replica member의 안정된 DNS 이름을 제공하며, PVC를 거치는 경로가 아닙니다.</text>
<text data-source="root.0.1.1" x="980.000" y="282.750" font-size="18" font-weight="400" fill="#111827">Operator 설치 후 MongoDBCommunity CR 적용</text>
<text data-source="root.0.1.3" x="980.000" y="465.350" font-size="18" font-weight="400" fill="#111827">workload 관리</text>
<text data-source="root.0.1.5" x="980.000" y="647.950" font-size="18" font-weight="400" fill="#111827">ordinal별 Pod 생성</text>
<text data-source="root.0.2" x="64.000" y="999.850" font-size="18" font-weight="400" fill="#111827">volumeClaimTemplate은 restart와 reschedule 뒤에도 특정 ordinal의 data를 유지하도록 PVC를 묶습니다.</text>
</svg>
