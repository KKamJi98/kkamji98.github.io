<path data-edge="root.0.2.0.1.5" data-from="root.0.2.0.1.4" data-to="root.0.2.0.1.6" d="M 446.000 807.350 L 566.000 807.350" fill="none" stroke="#475569" stroke-width="3"><title>등록된 provider로 복호화</title></path>
<polygon data-arrowhead="root.0.2.0.1.5" points="566.000,807.350 556.000,813.350 556.000,801.350" fill="#475569"/>
<path data-edge="root.0.2.1.1.1" data-from="root.0.2.1.1.0" data-to="root.0.2.1.1.2" d="M 1354.000 383.850 L 1474.000 383.850" fill="none" stroke="#475569" stroke-width="3"><title>기본 저장 경로</title></path>
<polygon data-arrowhead="root.0.2.1.1.1" points="1474.000,383.850 1464.000,389.850 1464.000,377.850" fill="#475569"/>
<path data-edge="root.0.2.1.1.3" data-from="root.0.2.1.1.2" data-to="root.0.2.1.1.4" d="M 1812.000 383.850 L 1824.000 383.850 L 1824.000 509.750 L 1004.000 509.750 L 1004.000 635.650 L 1016.000 635.650" fill="none" stroke="#475569" stroke-width="3"><title>Base64 encoding만 적용</title></path>
<polygon data-arrowhead="root.0.2.1.1.3" points="1016.000,635.650 1006.000,641.650 1006.000,629.650" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="129.850" font-size="36" font-weight="700" fill="#111827">EncryptionConfiguration이 로드되어야 Secret이 at rest에서 암호화된다</text>
<text data-source="root.0.1" x="64.000" y="188.450" font-size="22" font-weight="400" fill="#111827">기본 Secret 저장은 Base64 encoding이며 encryption이 아닙니다. API server에 설정을 연결한 경로에서만 새 write가 ciphertext가 됩니다.</text>
<text data-source="root.0.2.0.0" x="88.000" y="272.150" font-size="28" font-weight="700" fill="#111827">EncryptionConfiguration 적용</text>
<text data-source="root.0.2.0.1.0" x="144.000" y="447.050" font-size="28" font-weight="700" fill="#111827">Secret manifest</text>
<text data-source="root.0.2.0.1.0" x="144.000" y="489.450" font-size="22" font-weight="400" fill="#111827">kubectl apply로 제출</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="357.950" font-size="28" font-weight="700" fill="#111827">API server</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="400.350" font-size="22" font-weight="400" fill="#111827">--encryption-provider-</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="430.050" font-size="22" font-weight="400" fill="#111827">config로</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="459.750" font-size="22" font-weight="400" fill="#111827">EncryptionConfiguration</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="489.450" font-size="22" font-weight="400" fill="#111827">로드. 이 예제의 첫 provider</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="519.150" font-size="22" font-weight="400" fill="#111827">aescbc가 write 암호화,</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="548.850" font-size="22" font-weight="400" fill="#111827">identity는 평문 read</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="578.550" font-size="22" font-weight="400" fill="#111827">fallback</text>
<text data-source="root.0.2.0.1.4" x="144.000" y="781.450" font-size="28" font-weight="700" fill="#111827">etcd</text>
<text data-source="root.0.2.0.1.4" x="144.000" y="823.850" font-size="22" font-weight="400" fill="#111827">at rest 값이</text>
<text data-source="root.0.2.0.1.4" x="144.000" y="853.550" font-size="22" font-weight="400" fill="#111827">ciphertext입니다.</text>
<text data-source="root.0.2.0.1.6" x="602.000" y="766.600" font-size="28" font-weight="700" fill="#111827">Read and decrypt</text>
<text data-source="root.0.2.0.1.6" x="602.000" y="809.000" font-size="22" font-weight="400" fill="#111827">API server가 등록된</text>
<text data-source="root.0.2.0.1.6" x="602.000" y="838.700" font-size="22" font-weight="400" fill="#111827">provider로 읽기를</text>
<text data-source="root.0.2.0.1.6" x="602.000" y="868.400" font-size="22" font-weight="400" fill="#111827">복호화합니다.</text>
<text data-source="root.0.2.0.1.1" x="438.000" y="438.400" font-size="22" font-weight="400" fill="#111827">설정 경로 사용</text>
<text data-source="root.0.2.0.1.3" x="128.000" y="650.250" font-size="22" font-weight="400" fill="#111827">ciphertext 저장</text>
<text data-source="root.0.2.0.1.5" x="438.000" y="728.250" font-size="22" font-weight="400" fill="#111827">등록된</text>
<text data-source="root.0.2.0.1.5" x="438.000" y="757.950" font-size="22" font-weight="400" fill="#111827">provider로</text>
<text data-source="root.0.2.0.1.5" x="438.000" y="787.650" font-size="22" font-weight="400" fill="#111827">복호화</text>
<text data-source="root.0.2.1.0" x="996.000" y="272.150" font-size="28" font-weight="700" fill="#111827">설정이 없을 때</text>
<text data-source="root.0.2.1.1.0" x="1052.000" y="372.800" font-size="28" font-weight="700" fill="#111827">Secret manifest</text>
<text data-source="root.0.2.1.1.0" x="1052.000" y="415.200" font-size="22" font-weight="400" fill="#111827">같은 Secret 제출</text>
<text data-source="root.0.2.1.1.2" x="1510.000" y="357.950" font-size="28" font-weight="700" fill="#111827">API server</text>
<text data-source="root.0.2.1.1.2" x="1510.000" y="400.350" font-size="22" font-weight="400" fill="#111827">encryption provider 설정</text>
<text data-source="root.0.2.1.1.2" x="1510.000" y="430.050" font-size="22" font-weight="400" fill="#111827">없음</text>
<text data-source="root.0.2.1.1.4" x="1052.000" y="609.750" font-size="28" font-weight="700" fill="#111827">etcd</text>
<text data-source="root.0.2.1.1.4" x="1052.000" y="652.150" font-size="22" font-weight="400" fill="#111827">값을 decode하면 원문을</text>
<text data-source="root.0.2.1.1.4" x="1052.000" y="681.850" font-size="22" font-weight="400" fill="#111827">확인할 수 있습니다.</text>
<text data-source="root.0.2.1.1.1" x="1346.000" y="364.150" font-size="22" font-weight="400" fill="#111827">기본 저장 경로</text>
<text data-source="root.0.2.1.1.3" x="1036.000" y="501.750" font-size="22" font-weight="400" fill="#111827">Base64 encoding만 적용</text>
<text data-source="root.0.3" x="64.000" y="978.450" font-size="22" font-weight="400" fill="#111827">설정을 추가해도 이미 저장된 Secret은 자동으로 바뀌지 않으므로 다시 써서 암호화해야 합니다.</text>
</svg>
