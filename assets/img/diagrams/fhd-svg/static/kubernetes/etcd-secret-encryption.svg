<path data-edge="root.0.2.0.1.1" data-from="root.0.2.0.1.0" data-to="root.0.2.0.1.2" d="M 446.000 458.100 L 566.000 458.100" fill="none" stroke="#475569" stroke-width="3"><title>설정 경로 사용</title></path>
<polygon data-arrowhead="root.0.2.0.1.1" points="566.000,458.100 556.000,464.100 556.000,452.100" fill="#475569"/>
<path data-edge="root.0.2.0.1.3" data-from="root.0.2.0.1.2" data-to="root.0.2.0.1.4" d="M 904.000 458.100 L 916.000 458.100 L 916.000 658.250 L 96.000 658.250 L 96.000 807.350 L 108.000 807.350" fill="none" stroke="#475569" stroke-width="3"><title>ciphertext 저장</title></path>
