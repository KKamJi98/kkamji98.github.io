<polygon data-arrowhead="root.0.4" points="960.000,803.200 954.000,793.200 966.000,793.200" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="166.200" font-size="36" font-weight="700" fill="#111827">Thanos는 Prometheus query를 장기 block storage와 합칩니다</text>
<text data-source="root.0.1.0" x="112.000" y="230.800" font-size="20" font-weight="700" fill="#111827">PromQL clients</text>
<text data-source="root.0.1.0" x="112.000" y="266.800" font-size="18" font-weight="400" fill="#111827">Grafana와 외부 HTTP query clients</text>
<text data-source="root.0.1.2" x="1048.000" y="230.800" font-size="20" font-weight="700" fill="#111827">Thanos Query Frontend</text>
<text data-source="root.0.1.2" x="1048.000" y="266.800" font-size="18" font-weight="400" fill="#111827">cache와 query splitting</text>
<text data-source="root.0.1.4" x="112.000" y="434.550" font-size="20" font-weight="700" fill="#111827">Thanos Query</text>
<text data-source="root.0.1.4" x="112.000" y="470.550" font-size="18" font-weight="400" fill="#111827">Store API 결과를 merge</text>
<text data-source="root.0.1.6.0" x="1048.000" y="422.400" font-size="20" font-weight="700" fill="#111827">Thanos Store Gateway</text>
<text data-source="root.0.1.6.0" x="1048.000" y="458.400" font-size="18" font-weight="400" fill="#111827">Object storage의 장기 block read</text>
<text data-source="root.0.1.6.1" x="1452.000" y="422.400" font-size="20" font-weight="700" fill="#111827">Thanos Sidecar</text>
<text data-source="root.0.1.6.1" x="1452.000" y="458.400" font-size="18" font-weight="400" fill="#111827">Prometheus Server local TSDB 조회와 block</text>
<text data-source="root.0.1.6.1" x="1452.000" y="482.700" font-size="18" font-weight="400" fill="#111827">upload</text>
<text data-source="root.0.1.1" x="892.000" y="223.650" font-size="18" font-weight="400" fill="#111827">HTTP query</text>
<text data-source="root.0.1.3" x="104.000" y="329.100" font-size="18" font-weight="400" fill="#111827">Prometheus query API</text>
<text data-source="root.0.1.5" x="892.000" y="403.100" font-size="18" font-weight="400" fill="#111827">gRPC Store API</text>
<text data-source="root.0.1.5" x="892.000" y="427.400" font-size="18" font-weight="400" fill="#111827">fan-out</text>
<text data-source="root.0.2.0" x="80.000" y="558.300" font-size="20" font-weight="700" fill="#111827">Prometheus Server</text>
<text data-source="root.0.2.0" x="80.000" y="594.300" font-size="18" font-weight="400" fill="#111827">exporter scrape, local TSDB; Sidecar가 같은 Pod에 배치</text>
<text data-source="root.0.2.1" x="984.000" y="558.300" font-size="20" font-weight="700" fill="#111827">Object storage</text>
<text data-source="root.0.2.1" x="984.000" y="594.300" font-size="18" font-weight="400" fill="#111827">S3, GCS 또는 Minio. Sidecar와 Ruler가 upload, Store Gateway가 read</text>
<text data-source="root.0.3.0" x="80.000" y="668.600" font-size="20" font-weight="700" fill="#111827">Thanos Compactor</text>
<text data-source="root.0.3.0" x="80.000" y="704.600" font-size="18" font-weight="400" fill="#111827">Object storage block을 read/write하며 compaction, downsample, retention 수행</text>
<text data-source="root.0.3.1" x="984.000" y="668.600" font-size="20" font-weight="700" fill="#111827">Thanos Ruler</text>
<text data-source="root.0.3.1" x="984.000" y="704.600" font-size="18" font-weight="400" fill="#111827">Thanos Query의 query API로 recording/alert rule 평가. 기본 모드는 local TSDB와 bucket upload 사용</text>
<text data-source="root.0.5" x="80.000" y="851.200" font-size="20" font-weight="700" fill="#111827">External Alertmanager</text>
<text data-source="root.0.5" x="80.000" y="887.200" font-size="18" font-weight="400" fill="#111827">외부 알림 채널로 전달</text>
<text data-source="root.0.6" x="64.000" y="943.500" font-size="18" font-weight="400" fill="#111827">저장소와 local TSDB, Compactor 작업 상태를 모두 stateless로 간주하지 않습니다. Ruler의 선택적 remote-write 모드는 별도 구성입니다.</text>
<text data-source="root.0.4" x="980.000" y="776.900" font-size="18" font-weight="400" fill="#111827">Ruler의 firing alert만 전달</text>
</svg>
