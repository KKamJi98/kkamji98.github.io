<polygon data-arrowhead="root.0.2.1.1.1" points="1020.000,883.600 1010.000,889.600 1010.000,877.600" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="157.300" font-size="36" font-weight="700" fill="#111827">VirtualBox Kubernetes 실습은 NAT와 private network를 분리합니다</text>
<text data-source="root.0.1" x="64.000" y="209.900" font-size="20" font-weight="400" fill="#111827">Vagrant로 만든 세 VM은 모두 NAT eth0=10.0.2.15를 공유하고, 노드 간 통신과 Kubernetes 주소는 private eth1를 사용합니다.</text>
<text data-source="root.0.2.0.0" x="84.000" y="280.900" font-size="24" font-weight="700" fill="#111827">Kubernetes Cluster</text>
<text data-source="root.0.2.0.1" x="84.000" y="329.300" font-size="20" font-weight="400" fill="#111827">kubeadm Pod CIDR: 10.244.0.0/16. CNI를 설치하기 전에는 모든 노드가 NotReady입니다.</text>
<text data-source="root.0.2.0.2.0.0" x="104.000" y="400.300" font-size="24" font-weight="700" fill="#111827">cilium-m1</text>
<text data-source="root.0.2.0.2.0.1.0" x="124.000" y="472.700" font-size="24" font-weight="700" fill="#111827">eth0 NAT</text>
<text data-source="root.0.2.0.2.0.1.0" x="124.000" y="511.900" font-size="20" font-weight="400" fill="#111827">10.0.2.15, default route</text>
<text data-source="root.0.2.0.2.0.1.1" x="399.333" y="472.700" font-size="24" font-weight="700" fill="#111827">eth1</text>
<text data-source="root.0.2.0.2.0.1.1" x="399.333" y="511.900" font-size="20" font-weight="400" fill="#111827">192.168.10.100, control</text>
<text data-source="root.0.2.0.2.0.1.1" x="399.333" y="538.900" font-size="20" font-weight="400" fill="#111827">plane</text>
<text data-source="root.0.2.0.2.1.0" x="694.667" y="400.300" font-size="24" font-weight="700" fill="#111827">cilium-w1</text>
<text data-source="root.0.2.0.2.1.1.0" x="714.667" y="472.700" font-size="24" font-weight="700" fill="#111827">eth0 NAT</text>
<text data-source="root.0.2.0.2.1.1.0" x="714.667" y="511.900" font-size="20" font-weight="400" fill="#111827">10.0.2.15, default route</text>
<text data-source="root.0.2.0.2.1.1.1" x="990.000" y="472.700" font-size="24" font-weight="700" fill="#111827">eth1</text>
<text data-source="root.0.2.0.2.1.1.1" x="990.000" y="511.900" font-size="20" font-weight="400" fill="#111827">192.168.10.101, worker</text>
<text data-source="root.0.2.0.2.2.0" x="1285.333" y="400.300" font-size="24" font-weight="700" fill="#111827">cilium-w2</text>
<text data-source="root.0.2.0.2.2.1.0" x="1305.333" y="472.700" font-size="24" font-weight="700" fill="#111827">eth0 NAT</text>
<text data-source="root.0.2.0.2.2.1.0" x="1305.333" y="511.900" font-size="20" font-weight="400" fill="#111827">10.0.2.15, default route</text>
<text data-source="root.0.2.0.2.2.1.1" x="1580.667" y="472.700" font-size="24" font-weight="700" fill="#111827">eth1</text>
<text data-source="root.0.2.0.2.2.1.1" x="1580.667" y="511.900" font-size="20" font-weight="400" fill="#111827">192.168.10.102, worker</text>
<text data-source="root.0.2.0.3" x="104.000" y="649.900" font-size="24" font-weight="700" fill="#111827">VirtualBox Private Network</text>
<text data-source="root.0.2.0.3" x="104.000" y="689.100" font-size="20" font-weight="400" fill="#111827">192.168.10.0/24에서 VM 간 통신과 API advertise가 이뤄집니다.</text>
<text data-source="root.0.2.1.0" x="84.000" y="800.100" font-size="24" font-weight="700" fill="#111827">Node address selection</text>
<text data-source="root.0.2.1.1.0" x="136.000" y="872.500" font-size="24" font-weight="700" fill="#111827">kubelet default route</text>
<text data-source="root.0.2.1.1.0" x="136.000" y="911.700" font-size="20" font-weight="400" fill="#111827">worker가 default route의 eth0 주소를 고르면 INTERNAL-IP가 10.0.2.15가 됩니다.</text>
<text data-source="root.0.2.1.1.2" x="1052.000" y="872.500" font-size="24" font-weight="700" fill="#111827">JoinConfiguration --node-ip</text>
<text data-source="root.0.2.1.1.2" x="1052.000" y="911.700" font-size="20" font-weight="400" fill="#111827">각 worker를 192.168.10.101, 192.168.10.102로 고정합니다.</text>
<text data-source="root.0.2.1.1.1" x="892.000" y="864.600" font-size="20" font-weight="400" fill="#111827">명시적 node IP</text>
</svg>
