<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="bd94a373833aab555830c37b5060955d8daa65b8b2132c75005b0c7f78f84f7b">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-source="root.0.1.4" x="96.000" y="386.950" width="786.979" height="203.800" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.2" x="64.000" y="614.750" width="1792.000" height="319.300" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-node="root.0.1.0" x="96.000" y="164.850" width="786.979" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.2" x="1037.021" y="164.850" width="786.979" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.4.0" x="120.000" y="410.950" width="357.490" height="155.800" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.1.4.1" x="501.490" y="410.950" width="357.490" height="155.800" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect data-node="root.0.2.1.0" x="88.000" y="700.550" width="860.000" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.1.1" x="972.000" y="700.550" width="860.000" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 894.979 227.900 L 1025.021 227.900" fill="none" stroke="#475569" stroke-width="3"><title>API request</title></path>
<polygon data-arrowhead="root.0.1.1" points="1025.021,227.900 1015.021,233.900 1015.021,221.900" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 1836.000 227.900 L 1848.000 227.900 L 1848.000 338.950 L 72.000 338.950 L 72.000 488.850 L 84.000 488.850" fill="none" stroke="#475569" stroke-width="3"><title>authorization 결과</title></path>
<polygon data-arrowhead="root.0.1.3" points="84.000,488.850 74.000,494.850 74.000,482.850" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="128.250" font-size="36" font-weight="700" fill="#111827">RoleBinding이 subject를 verbs 권한에 연결한다</text>
<text data-source="root.0.1.0" x="120.000" y="216.850" font-size="28" font-weight="700" fill="#111827">User or ServiceAccount</text>
<text data-source="root.0.1.0" x="120.000" y="259.250" font-size="22" font-weight="400" fill="#111827">request를 보내는 subject입니다.</text>
<text data-source="root.0.1.2" x="1061.021" y="216.850" font-size="28" font-weight="700" fill="#111827">API server</text>
<text data-source="root.0.1.2" x="1061.021" y="259.250" font-size="22" font-weight="400" fill="#111827">매 요청마다 subject, namespace, resource와 verb를 RBAC 규칙과 대조합니다.</text>
<text data-source="root.0.1.4.0" x="144.000" y="462.950" font-size="28" font-weight="700" fill="#111827">Allowed resource action</text>
<text data-source="root.0.1.4.0" x="144.000" y="505.350" font-size="22" font-weight="400" fill="#111827">binding으로 허용된 resource와</text>
<text data-source="root.0.1.4.0" x="144.000" y="535.050" font-size="22" font-weight="400" fill="#111827">verb를 실행합니다.</text>
<text data-source="root.0.1.4.1" x="525.490" y="462.950" font-size="28" font-weight="700" fill="#111827">Denied</text>
<text data-source="root.0.1.4.1" x="525.490" y="505.350" font-size="22" font-weight="400" fill="#111827">요청을 허용하는 권한이 없으면</text>
<text data-source="root.0.1.4.1" x="525.490" y="535.050" font-size="22" font-weight="400" fill="#111827">거부합니다.</text>
<text data-source="root.0.1.1" x="886.979" y="208.200" font-size="22" font-weight="400" fill="#111827">API request</text>
<text data-source="root.0.1.3" x="104.000" y="330.950" font-size="22" font-weight="400" fill="#111827">authorization 결과</text>
<text data-source="root.0.2.0" x="88.000" y="666.750" font-size="28" font-weight="700" fill="#111827">RoleBinding: 요청 hop이 아닌 권한 연결</text>
<text data-source="root.0.2.1.0" x="112.000" y="752.550" font-size="28" font-weight="700" fill="#111827">subjects</text>
<text data-source="root.0.2.1.0" x="112.000" y="794.950" font-size="22" font-weight="400" fill="#111827">위 User 또는 ServiceAccount를 참조합니다.</text>
<text data-source="root.0.2.1.1" x="996.000" y="752.550" font-size="28" font-weight="700" fill="#111827">roleRef</text>
<text data-source="root.0.2.1.1" x="996.000" y="794.950" font-size="22" font-weight="400" fill="#111827">Role 또는 ClusterRole을 참조합니다. Role은 resource에 허용할 verbs를 정의하지만</text>
<text data-source="root.0.2.1.1" x="996.000" y="824.650" font-size="22" font-weight="400" fill="#111827">단독으로는 권한을 주지 않습니다.</text>
<text data-source="root.0.2.2" x="88.000" y="902.350" font-size="22" font-weight="400" fill="#111827">API server는 이 binding의 subject와 roleRef가 가리키는 규칙을 인가 판단에 사용합니다.</text>
<text data-source="root.0.3" x="64.000" y="980.050" font-size="22" font-weight="400" fill="#111827">RoleBinding은 namespace 범위에 묶입니다. 다른 namespace까지 권한을 넓히려면 별도의 binding 범위를 설계해야 합니다.</text>
</svg>
