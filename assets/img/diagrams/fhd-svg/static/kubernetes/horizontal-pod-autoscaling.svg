<rect data-node="root.0.1.8" x="96.000" y="635.500" width="324.000" height="155.800" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 432.000 408.700 L 552.000 408.700" fill="none" stroke="#475569" stroke-width="3"><title>주기적으로 metric read</title></path>
<polygon data-arrowhead="root.0.1.1" points="552.000,408.700 542.000,414.700 542.000,402.700" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 900.000 408.700 L 1020.000 408.700" fill="none" stroke="#475569" stroke-width="3"><title>current replicas x current/target</title></path>
<polygon data-arrowhead="root.0.1.3" points="1020.000,408.700 1010.000,414.700 1010.000,402.700" fill="#475569"/>
<path data-edge="root.0.1.5" data-from="root.0.1.4" data-to="root.0.1.6" d="M 1368.000 408.700 L 1488.000 408.700" fill="none" stroke="#475569" stroke-width="3"><title>scale subresource patch</title></path>
<polygon data-arrowhead="root.0.1.5" points="1488.000,408.700 1478.000,414.700 1478.000,402.700" fill="#475569"/>
<path data-edge="root.0.1.7" data-from="root.0.1.6" data-to="root.0.1.8" d="M 1836.000 408.700 L 1848.000 408.700 L 1848.000 587.500 L 72.000 587.500 L 72.000 713.400 L 84.000 713.400" fill="none" stroke="#475569" stroke-width="3"><title>replica 추가 또는 제거</title></path>
<polygon data-arrowhead="root.0.1.7" points="84.000,713.400 74.000,719.400 74.000,707.400" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="241.300" font-size="36" font-weight="700" fill="#111827">HPA loop은 metric을 읽고 replica 수를 계산해 workload를 patch한다</text>
<text data-source="root.0.1.0" x="120.000" y="382.800" font-size="28" font-weight="700" fill="#111827">Metrics Server</text>
<text data-source="root.0.1.0" x="120.000" y="425.200" font-size="22" font-weight="400" fill="#111827">metrics.k8s.io를 제공해야</text>
<text data-source="root.0.1.0" x="120.000" y="454.900" font-size="22" font-weight="400" fill="#111827">합니다.</text>
<text data-source="root.0.1.2" x="588.000" y="382.800" font-size="28" font-weight="700" fill="#111827">HPA controller</text>
<text data-source="root.0.1.2" x="588.000" y="425.200" font-size="22" font-weight="400" fill="#111827">fixed interval마다 target과</text>
<text data-source="root.0.1.2" x="588.000" y="454.900" font-size="22" font-weight="400" fill="#111827">현재 값을 비교합니다.</text>
<text data-source="root.0.1.4" x="1056.000" y="367.950" font-size="28" font-weight="700" fill="#111827">Desired replica count</text>
<text data-source="root.0.1.4" x="1056.000" y="410.350" font-size="22" font-weight="400" fill="#111827">HPA controller가 현재</text>
<text data-source="root.0.1.4" x="1056.000" y="440.050" font-size="22" font-weight="400" fill="#111827">replica 수와 metric 비율로</text>
<text data-source="root.0.1.4" x="1056.000" y="469.750" font-size="22" font-weight="400" fill="#111827">계산한 목표 replica 수입니다.</text>
<text data-source="root.0.1.6" x="1524.000" y="382.800" font-size="28" font-weight="700" fill="#111827">Deployment</text>
<text data-source="root.0.1.6" x="1524.000" y="425.200" font-size="22" font-weight="400" fill="#111827">scale subresource가</text>
<text data-source="root.0.1.6" x="1524.000" y="454.900" font-size="22" font-weight="400" fill="#111827">변경됩니다.</text>
<text data-source="root.0.1.8" x="120.000" y="687.500" font-size="28" font-weight="700" fill="#111827">Pods</text>
<text data-source="root.0.1.8" x="120.000" y="729.900" font-size="22" font-weight="400" fill="#111827">계산된 수에 맞춰 Pod가</text>
<text data-source="root.0.1.8" x="120.000" y="759.600" font-size="22" font-weight="400" fill="#111827">늘거나 줄어듭니다.</text>
<text data-source="root.0.1.1" x="424.000" y="359.300" font-size="22" font-weight="400" fill="#111827">주기적으로</text>
<text data-source="root.0.1.1" x="424.000" y="389.000" font-size="22" font-weight="400" fill="#111827">metric read</text>
<text data-source="root.0.1.3" x="892.000" y="299.900" font-size="22" font-weight="400" fill="#111827">current</text>
<text data-source="root.0.1.3" x="892.000" y="329.600" font-size="22" font-weight="400" fill="#111827">replicas x</text>
<text data-source="root.0.1.3" x="892.000" y="359.300" font-size="22" font-weight="400" fill="#111827">current/targe</text>
<text data-source="root.0.1.3" x="892.000" y="389.000" font-size="22" font-weight="400" fill="#111827">t</text>
<text data-source="root.0.1.5" x="1360.000" y="329.600" font-size="22" font-weight="400" fill="#111827">scale</text>
<text data-source="root.0.1.5" x="1360.000" y="359.300" font-size="22" font-weight="400" fill="#111827">subresource</text>
<text data-source="root.0.1.5" x="1360.000" y="389.000" font-size="22" font-weight="400" fill="#111827">patch</text>
<text data-source="root.0.1.7" x="104.000" y="579.500" font-size="22" font-weight="400" fill="#111827">replica 추가 또는 제거</text>
<text data-source="root.0.2" x="64.000" y="837.300" font-size="22" font-weight="400" fill="#111827">이 그림은 CPU와 메모리 resource metric을 사용하는 HPA 경로입니다. 고정 주기로 반복되며 Metrics Server가 보고하지 않으면 해당 target이 &lt;unknown&gt;으로 남아 그 metric으로 scale할 수</text>
<text data-source="root.0.2" x="64.000" y="867.000" font-size="22" font-weight="400" fill="#111827">없습니다.</text>
</svg>
