<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="7702d771f180aa6cc8499b3aff9cce38cbe337011b34e13c08fc9b292e163f0f">
