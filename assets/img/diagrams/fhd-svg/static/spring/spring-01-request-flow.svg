<text data-source="root.0.0" x="64.000" y="143.850" font-size="36" font-weight="700" fill="#111827">Spring MVC 요청 한 건의 처리 경로</text>
<text data-source="root.0.1.0" x="108.000" y="543.000" font-size="18" font-weight="700" fill="#111827">Client</text>
<text data-source="root.0.1.0" x="108.000" y="576.400" font-size="16" font-weight="400" fill="#111827">HTTP request</text>
<text data-source="root.0.1.2.0" x="1044.000" y="198.450" font-size="18" font-weight="700" fill="#111827">JVM process: java -jar app.jar</text>
<text data-source="root.0.1.2.1.0" x="1088.000" y="246.750" font-size="18" font-weight="700" fill="#111827">Embedded Tomcat</text>
<text data-source="root.0.1.2.1.0" x="1088.000" y="270.150" font-size="18" font-weight="700" fill="#111827">connector</text>
<text data-source="root.0.1.2.1.0" x="1088.000" y="303.550" font-size="16" font-weight="400" fill="#111827">:8080에서 연결 수락</text>
<text data-source="root.0.1.2.1.2" x="1512.000" y="258.450" font-size="18" font-weight="700" fill="#111827">Servlet container</text>
<text data-source="root.0.1.2.1.2" x="1512.000" y="291.850" font-size="16" font-weight="400" fill="#111827">요청마다 worker thread 1개 할당</text>
<text data-source="root.0.1.2.1.4" x="1088.000" y="461.850" font-size="18" font-weight="700" fill="#111827">Filter chain</text>
<text data-source="root.0.1.2.1.4" x="1088.000" y="495.250" font-size="16" font-weight="400" fill="#111827">security, logging, encoding 처리</text>
<text data-source="root.0.1.2.1.6" x="1512.000" y="461.850" font-size="18" font-weight="700" fill="#111827">DispatcherServlet</text>
<text data-source="root.0.1.2.1.6" x="1512.000" y="495.250" font-size="16" font-weight="400" fill="#111827">front controller, / 경로에 매핑</text>
<text data-source="root.0.1.2.1.8" x="1088.000" y="664.350" font-size="18" font-weight="700" fill="#111827">HandlerMapping and</text>
<text data-source="root.0.1.2.1.8" x="1088.000" y="687.750" font-size="18" font-weight="700" fill="#111827">HandlerAdapter</text>
<text data-source="root.0.1.2.1.8" x="1088.000" y="721.150" font-size="16" font-weight="400" fill="#111827">handler 탐색 후 인자 바인딩</text>
<text data-source="root.0.1.2.1.10" x="1512.000" y="653.550" font-size="18" font-weight="700" fill="#111827">Controller, Service,</text>
<text data-source="root.0.1.2.1.10" x="1512.000" y="676.950" font-size="18" font-weight="700" fill="#111827">Repository</text>
<text data-source="root.0.1.2.1.10" x="1512.000" y="710.350" font-size="16" font-weight="400" fill="#111827">모든 bean이 같은 thread에서</text>
<text data-source="root.0.1.2.1.10" x="1512.000" y="731.950" font-size="16" font-weight="400" fill="#111827">실행</text>
<text data-source="root.0.1.2.1.12" x="1088.000" y="875.550" font-size="18" font-weight="700" fill="#111827">HttpMessageConverter</text>
<text data-source="root.0.1.2.1.12" x="1088.000" y="908.950" font-size="16" font-weight="400" fill="#111827">반환 값을 JSON으로 직렬화</text>
<text data-source="root.0.1.2.1.1" x="1360.000" y="251.350" font-size="16" font-weight="400" fill="#111827">worker 1개 배정</text>
<text data-source="root.0.1.2.1.3" x="1084.000" y="361.150" font-size="16" font-weight="400" fill="#111827">공통 전처리</text>
<text data-source="root.0.1.2.1.5" x="1360.000" y="433.150" font-size="16" font-weight="400" fill="#111827">front controller</text>
<text data-source="root.0.1.2.1.5" x="1360.000" y="454.750" font-size="16" font-weight="400" fill="#111827">진입</text>
<text data-source="root.0.1.2.1.7" x="1084.000" y="567.550" font-size="16" font-weight="400" fill="#111827">handler 탐색과 호출</text>
<text data-source="root.0.1.2.1.9" x="1360.000" y="668.950" font-size="16" font-weight="400" fill="#111827">bean 로직 실행</text>
<text data-source="root.0.1.2.1.11" x="1084.000" y="789.550" font-size="16" font-weight="400" fill="#111827">JSON 직렬화</text>
<text data-source="root.0.1.1" x="892.000" y="535.900" font-size="16" font-weight="400" fill="#111827">HTTP 전달</text>
<text data-source="root.0.2" x="64.000" y="966.550" font-size="16" font-weight="400" fill="#111827">worker thread는 I/O 대기를 포함해 요청 전체가 끝날 때까지 점유됩니다.</text>
