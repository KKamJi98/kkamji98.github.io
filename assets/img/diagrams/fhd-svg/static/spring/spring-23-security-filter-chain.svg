<text data-source="root.0.0" x="64.000" y="100.000" font-size="36" font-weight="700" fill="#111827">Spring Security는 컨트롤러 앞단의 필터 체인에서 끝납니다</text>
<text data-source="root.0.1.0" x="112.000" y="268.300" font-size="22" font-weight="700" fill="#111827">HTTP 요청</text>
<text data-source="root.0.1.2" x="736.000" y="268.300" font-size="22" font-weight="700" fill="#111827">서블릿 컨테이너 필터 체인</text>
<text data-source="root.0.1.4" x="1360.000" y="238.000" font-size="22" font-weight="700" fill="#111827">DelegatingFilterProxy</text>
<text data-source="root.0.1.4" x="1360.000" y="274.600" font-size="18" font-weight="400" fill="#111827">Servlet container와 Spring ApplicationContext를</text>
<text data-source="root.0.1.4" x="1360.000" y="298.900" font-size="18" font-weight="400" fill="#111827">연결</text>
<text data-source="root.0.1.6" x="112.000" y="455.200" font-size="22" font-weight="700" fill="#111827">FilterChainProxy</text>
<text data-source="root.0.1.6" x="112.000" y="491.800" font-size="18" font-weight="400" fill="#111827">현재 요청에 맞는 SecurityFilterChain을 선택</text>
<text data-source="root.0.1.8" x="736.000" y="455.200" font-size="22" font-weight="700" fill="#111827">SecurityFilterChain</text>
<text data-source="root.0.1.8" x="736.000" y="491.800" font-size="18" font-weight="400" fill="#111827">보안 필터들, 인증 다음 인가</text>
<text data-source="root.0.1.1" x="580.000" y="242.300" font-size="18" font-weight="400" fill="#111827">servlet 진입</text>
<text data-source="root.0.1.3" x="1204.000" y="242.300" font-size="18" font-weight="400" fill="#111827">위임</text>
<text data-source="root.0.1.5" x="104.000" y="361.200" font-size="18" font-weight="400" fill="#111827">보안 필터 선택</text>
<text data-source="root.0.1.7" x="580.000" y="447.350" font-size="18" font-weight="400" fill="#111827">필터 실행</text>
<text data-source="root.0.1.9.0.0" x="80.000" y="830.000" font-size="22" font-weight="700" fill="#111827">통과</text>
<text data-source="root.0.1.9.0.1.0" x="96.000" y="891.700" font-size="22" font-weight="700" fill="#111827">DispatcherServlet과 컨트롤러</text>
<text data-source="root.0.1.9.0.1.0" x="96.000" y="928.300" font-size="18" font-weight="400" fill="#111827">보안 검사를 통과한 요청만 앱 코드에 도달</text>
<text data-source="root.0.1.9.1.0" x="984.000" y="830.000" font-size="22" font-weight="700" fill="#111827">거부</text>
<text data-source="root.0.1.9.1.1.0" x="1000.000" y="891.700" font-size="22" font-weight="700" fill="#111827">요청 거부</text>
<text data-source="root.0.1.9.1.1.0" x="1000.000" y="928.300" font-size="18" font-weight="400" fill="#111827">401 또는 403 응답으로 종료, DispatcherServlet에 도달하지 않음</text>
<text data-source="security-result.0.meaning" x="428.000" y="766.000" font-size="14" font-weight="400" fill="#111827">통과</text>
<text data-source="security-result.1.meaning" x="1332.000" y="766.000" font-size="14" font-weight="400" fill="#111827">거부</text>
</svg>
