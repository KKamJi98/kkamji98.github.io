<rect data-node="root.0.1.1.1.0" x="1028.000" y="340.150" width="314.000" height="162.500" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.1.1.2" x="1486.000" y="325.300" width="314.000" height="192.200" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.1.1.4" x="1257.000" y="613.500" width="314.000" height="192.200" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<path data-edge="root.0.1.0.1.1" data-from="root.0.1.0.1.0" data-to="root.0.1.0.1.2" d="M 446.000 451.100 L 566.000 451.100" fill="none" stroke="#475569" stroke-width="3"><title>한 번에 조회</title></path>
<polygon data-arrowhead="root.0.1.0.1.1" points="566.000,451.100 556.000,457.100 556.000,445.100" fill="#475569"/>
<path data-edge="root.0.1.1.1.1" data-from="root.0.1.1.1.0" data-to="root.0.1.1.1.2" d="M 1354.000 421.400 L 1474.000 421.400" fill="none" stroke="#475569" stroke-width="3"><title>IN 절로 묶음</title></path>
<polygon data-arrowhead="root.0.1.1.1.1" points="1474.000,421.400 1464.000,427.400 1464.000,415.400" fill="#475569"/>
<path data-edge="root.0.1.1.1.3" data-from="root.0.1.1.1.2" data-to="root.0.1.1.1.4" d="M 1643.000 529.500 L 1643.000 565.500 L 1414.000 565.500 L 1414.000 601.500" fill="none" stroke="#475569" stroke-width="3"><title>조회 수 제한</title></path>
<polygon data-arrowhead="root.0.1.1.1.3" points="1414.000,601.500 1408.000,591.500 1420.000,591.500" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="202.900" font-size="36" font-weight="700" fill="#111827">N+1 해결: JOIN FETCH와 batch fetching</text>
<text data-source="root.0.1.0.0" x="88.000" y="291.500" font-size="28" font-weight="700" fill="#111827">Solution A: JOIN FETCH</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="377.300" font-size="28" font-weight="700" fill="#111827">JOIN FETCH</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="413.700" font-size="28" font-weight="700" fill="#111827">query</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="456.100" font-size="22" font-weight="400" fill="#111827">SELECT o FROM Order o</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="485.800" font-size="22" font-weight="400" fill="#111827">JOIN FETCH o.items,</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="515.500" font-size="22" font-weight="400" fill="#111827">부모와 children을 같은</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="545.200" font-size="22" font-weight="400" fill="#111827">조회 계획에 포함</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="425.200" font-size="28" font-weight="700" fill="#111827">one query</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="467.600" font-size="22" font-weight="400" fill="#111827">N+1을 조인 한 번으로</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="497.300" font-size="22" font-weight="400" fill="#111827">축소, 보통 우선 검토</text>
<text data-source="root.0.1.0.1.1" x="438.000" y="431.400" font-size="22" font-weight="400" fill="#111827">한 번에 조회</text>
<text data-source="root.0.1.1.0" x="996.000" y="291.500" font-size="28" font-weight="700" fill="#111827">Solution B: batch fetching (@BatchSize = k)</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="392.150" font-size="28" font-weight="700" fill="#111827">One parent</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="428.550" font-size="28" font-weight="700" fill="#111827">query</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="470.950" font-size="22" font-weight="400" fill="#111827">Order 목록을 먼저 조회</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="377.300" font-size="28" font-weight="700" fill="#111827">WHERE order_id</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="413.700" font-size="28" font-weight="700" fill="#111827">IN (...)</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="456.100" font-size="22" font-weight="400" fill="#111827">LAZY 연관을 최대 k개</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="485.800" font-size="22" font-weight="400" fill="#111827">단위로 초기화</text>
<text data-source="root.0.1.1.1.4" x="1281.000" y="665.500" font-size="28" font-weight="700" fill="#111827">1 + ceil(N / k)</text>
<text data-source="root.0.1.1.1.4" x="1281.000" y="701.900" font-size="28" font-weight="700" fill="#111827">queries</text>
<text data-source="root.0.1.1.1.4" x="1281.000" y="744.300" font-size="22" font-weight="400" fill="#111827">추가 조회는 남지만 페이지</text>
<text data-source="root.0.1.1.1.4" x="1281.000" y="774.000" font-size="22" font-weight="400" fill="#111827">단위로 bounded</text>
<text data-source="root.0.1.1.1.1" x="1346.000" y="401.700" font-size="22" font-weight="400" fill="#111827">IN 절로 묶음</text>
<text data-source="root.0.1.1.1.3" x="1426.000" y="557.500" font-size="22" font-weight="400" fill="#111827">조회 수 제한</text>
<text data-source="root.0.2" x="64.000" y="875.700" font-size="22" font-weight="400" fill="#111827">EntityGraph는 같은 fetch plan을 선언하고, DTO projection은 엔티티 자체를 로드하지 않는 선택지입니다. 컬렉션 JOIN FETCH와 paging은 결과 행과 메모리 사용량을</text>
<text data-source="root.0.2" x="64.000" y="905.400" font-size="22" font-weight="400" fill="#111827">함께 점검합니다.</text>
</svg>
