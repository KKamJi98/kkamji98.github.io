<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="56eb6cc66c95b8c918364bcf3bd371dd959a80929e167277cddd1d32336b635d">
