<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="d4394275696ff769175a3d25cff1222cf91326abde81793f3236d53c91299d81">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-source="root.0.1" x="64.000" y="275.050" width="1792.000" height="244.800" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.2" x="64.000" y="535.850" width="1792.000" height="293.400" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-node="root.0.1.1.0" x="112.000" y="371.800" width="469.333" height="94.300" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.1.1.2" x="725.333" y="371.800" width="469.333" height="94.300" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.1.1.4" x="1338.667" y="371.800" width="469.333" height="94.300" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.1.0" x="112.000" y="656.900" width="776.000" height="94.300" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.1.2" x="1032.000" y="656.900" width="776.000" height="94.300" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<path data-edge="root.0.1.1.1" data-from="root.0.1.1.0" data-to="root.0.1.1.2" d="M 593.333 418.950 L 713.333 418.950" fill="none" stroke="#475569" stroke-width="3"><title>onNext, onComplete, onError</title></path>
<polygon data-arrowhead="root.0.1.1.1" points="713.333,418.950 703.333,424.950 703.333,412.950" fill="#475569"/>
<path data-edge="root.0.1.1.3" data-from="root.0.1.1.2" data-to="root.0.1.1.4" d="M 1206.667 418.950 L 1326.667 418.950" fill="none" stroke="#475569" stroke-width="3"><title>변환된 signal을 downstream으로 전달</title></path>
<polygon data-arrowhead="root.0.1.1.3" points="1326.667,418.950 1316.667,424.950 1316.667,412.950" fill="#475569"/>
<path data-edge="root.0.2.1.1" data-from="root.0.2.1.0" data-to="root.0.2.1.2" d="M 900.000 704.050 L 1020.000 704.050" fill="none" stroke="#475569" stroke-width="3"><title>operators를 거쳐 upstream으로 request 또는 cancel 전달</title></path>
<polygon data-arrowhead="root.0.2.1.1" points="1020.000,704.050 1010.000,710.050 1010.000,698.050" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="246.450" font-size="36" font-weight="700" fill="#111827">Mono와 Flux의 lazy flow, 그리고 backpressure</text>
<text data-source="root.0.1.0" x="80.000" y="311.050" font-size="20" font-weight="700" fill="#111827">구독 후 downstream signal</text>
<text data-source="root.0.1.1.0" x="128.000" y="407.800" font-size="20" font-weight="700" fill="#111827">Publisher</text>
<text data-source="root.0.1.1.0" x="128.000" y="443.800" font-size="18" font-weight="400" fill="#111827">Mono 0..1 or Flux 0..N</text>
<text data-source="root.0.1.1.2" x="741.333" y="407.800" font-size="20" font-weight="700" fill="#111827">Operators</text>
<text data-source="root.0.1.1.2" x="741.333" y="443.800" font-size="18" font-weight="400" fill="#111827">map, filter, flatMap; assembly에서는 계획만 구성</text>
<text data-source="root.0.1.1.4" x="1354.667" y="407.800" font-size="20" font-weight="700" fill="#111827">Subscriber</text>
<text data-source="root.0.1.1.4" x="1354.667" y="443.800" font-size="18" font-weight="400" fill="#111827">onNext, onComplete, onError 수신</text>
<text data-source="root.0.1.1.1" x="585.333" y="352.050" font-size="18" font-weight="400" fill="#111827">onNext,</text>
<text data-source="root.0.1.1.1" x="585.333" y="376.350" font-size="18" font-weight="400" fill="#111827">onComplete,</text>
<text data-source="root.0.1.1.1" x="585.333" y="400.650" font-size="18" font-weight="400" fill="#111827">onError</text>
<text data-source="root.0.1.1.3" x="1198.667" y="352.050" font-size="18" font-weight="400" fill="#111827">변환된 signal을</text>
<text data-source="root.0.1.1.3" x="1198.667" y="376.350" font-size="18" font-weight="400" fill="#111827">downstream으로</text>
<text data-source="root.0.1.1.3" x="1198.667" y="400.650" font-size="18" font-weight="400" fill="#111827">전달</text>
<text data-source="root.0.2.0" x="80.000" y="571.850" font-size="20" font-weight="700" fill="#111827">반대 방향의 demand와 취소</text>
<text data-source="root.0.2.1.0" x="128.000" y="692.900" font-size="20" font-weight="700" fill="#111827">Subscriber의 Subscription</text>
<text data-source="root.0.2.1.0" x="128.000" y="728.900" font-size="18" font-weight="400" fill="#111827">onSubscribe로 받은 계약의 request(n)과 cancel 호출</text>
<text data-source="root.0.2.1.2" x="1048.000" y="692.900" font-size="20" font-weight="700" fill="#111827">Publisher / upstream 단계</text>
<text data-source="root.0.2.1.2" x="1048.000" y="728.900" font-size="18" font-weight="400" fill="#111827">요청된 demand 한도 안에서 onNext 발행</text>
<text data-source="root.0.2.1.1" x="892.000" y="612.850" font-size="18" font-weight="400" fill="#111827">operators를 거쳐</text>
<text data-source="root.0.2.1.1" x="892.000" y="637.150" font-size="18" font-weight="400" fill="#111827">upstream으로</text>
<text data-source="root.0.2.1.1" x="892.000" y="661.450" font-size="18" font-weight="400" fill="#111827">request 또는</text>
<text data-source="root.0.2.1.1" x="892.000" y="685.750" font-size="18" font-weight="400" fill="#111827">cancel 전달</text>
<text data-source="root.0.3" x="64.000" y="863.250" font-size="18" font-weight="400" fill="#111827">subscribe()가 조립한 flow의 실행을 시작합니다. Subscription은 signal이 통과하는 별도 처리 단계가 아니라 각 구독의 request(n)과 cancel 계약입니다.</text>
</svg>
