<text data-source="root.0.0" x="64.000" y="332.550" font-size="36" font-weight="700" fill="#111827">Spring 시리즈 읽기 순서</text>
<text data-source="root.0.1.0" x="120.000" y="421.150" font-size="28" font-weight="700" fill="#111827">Series 1: 요청 경로</text>
<text data-source="root.0.1.0" x="120.000" y="463.550" font-size="22" font-weight="400" fill="#111827">HTTP 도착, container dispatch,</text>
<text data-source="root.0.1.0" x="120.000" y="493.250" font-size="22" font-weight="400" fill="#111827">bean 실행</text>
<text data-source="root.0.1.2" x="744.000" y="421.150" font-size="28" font-weight="700" fill="#111827">Series 2: JVM과 메모리</text>
<text data-source="root.0.1.2" x="744.000" y="463.550" font-size="22" font-weight="400" fill="#111827">process memory, heap과 native,</text>
<text data-source="root.0.1.2" x="744.000" y="493.250" font-size="22" font-weight="400" fill="#111827">container limit</text>
<text data-source="root.0.1.4" x="1368.000" y="436.000" font-size="28" font-weight="700" fill="#111827">Series 3: 두 동시성 경로</text>
<text data-source="root.0.1.4" x="1368.000" y="478.400" font-size="22" font-weight="400" fill="#111827">thread-per-request와 event loop</text>
<text data-source="root.0.1.6" x="120.000" y="691.150" font-size="28" font-weight="700" fill="#111827">Series 4: 데이터 계층</text>
<text data-source="root.0.1.6" x="120.000" y="733.550" font-size="22" font-weight="400" fill="#111827">persistence context, entity states, N+1</text>
<text data-source="root.0.1.8" x="744.000" y="672.950" font-size="28" font-weight="700" fill="#111827">Series 5 (optional):</text>
<text data-source="root.0.1.8" x="744.000" y="709.350" font-size="28" font-weight="700" fill="#111827">빌드와 보안</text>
<text data-source="root.0.1.8" x="744.000" y="751.750" font-size="22" font-weight="400" fill="#111827">fat jar, BOM, filter chain, authn과 authz</text>
<text data-source="root.0.1.10" x="1368.000" y="676.300" font-size="28" font-weight="700" fill="#111827">Capstone: 실제 incident</text>
<text data-source="root.0.1.10" x="1368.000" y="718.700" font-size="22" font-weight="400" fill="#111827">Boot 4 on JDK 25 with G1: high Old</text>
<text data-source="root.0.1.10" x="1368.000" y="748.400" font-size="22" font-weight="400" fill="#111827">generation은 leak인가?</text>
<text data-source="root.0.1.1" x="580.000" y="397.650" font-size="22" font-weight="400" fill="#111827">한 계층</text>
<text data-source="root.0.1.1" x="580.000" y="427.350" font-size="22" font-weight="400" fill="#111827">아래로</text>
<text data-source="root.0.1.3" x="1204.000" y="397.650" font-size="22" font-weight="400" fill="#111827">실행 기반</text>
<text data-source="root.0.1.3" x="1204.000" y="427.350" font-size="22" font-weight="400" fill="#111827">확장</text>
<text data-source="root.0.1.5" x="348.000" y="564.950" font-size="22" font-weight="400" fill="#111827">데이터 계층으로</text>
