<text data-source="root.0.1.4" x="1056.000" y="478.400" font-size="22" font-weight="400" fill="#111827">event loop</text>
<text data-source="root.0.1.6" x="1524.000" y="369.900" font-size="28" font-weight="700" fill="#111827">Series 4: 데이터</text>
