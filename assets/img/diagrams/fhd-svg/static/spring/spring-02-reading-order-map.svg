<text data-source="root.0.1.6" x="1524.000" y="478.400" font-size="22" font-weight="400" fill="#111827">entity states, N+1</text>
<text data-source="root.0.1.8" x="120.000" y="658.100" font-size="28" font-weight="700" fill="#111827">Series 5</text>
<text data-source="root.0.1.8" x="120.000" y="694.500" font-size="28" font-weight="700" fill="#111827">(optional): 빌드와</text>
