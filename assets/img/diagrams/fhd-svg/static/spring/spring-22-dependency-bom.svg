<text data-source="root.0.0" x="64.000" y="434.950" font-size="36" font-weight="700" fill="#111827">BOM이 생략한 dependency 버전을 결정하는 흐름</text>
<text data-source="root.0.1.0" x="120.000" y="523.550" font-size="28" font-weight="700" fill="#111827">declared dependencies</text>
<text data-source="root.0.1.0" x="120.000" y="565.950" font-size="22" font-weight="400" fill="#111827">spring-boot-starter-web 등은 version을</text>
<text data-source="root.0.1.0" x="120.000" y="595.650" font-size="22" font-weight="400" fill="#111827">생략해 선언</text>
<text data-source="root.0.1.2" x="747.472" y="523.550" font-size="28" font-weight="700" fill="#111827">spring-boot-dependencies BOM</text>
<text data-source="root.0.1.2" x="747.472" y="565.950" font-size="22" font-weight="400" fill="#111827">properties로 호환되는 library version 집합을</text>
<text data-source="root.0.1.2" x="747.472" y="595.650" font-size="22" font-weight="400" fill="#111827">관리</text>
<text data-source="root.0.1.4" x="1374.944" y="523.550" font-size="28" font-weight="700" fill="#111827">resolved dependency tree</text>
<text data-source="root.0.1.4" x="1374.944" y="565.950" font-size="22" font-weight="400" fill="#111827">서로 호환되는 버전으로 해석된 일관된 의존성</text>
<text data-source="root.0.1.4" x="1374.944" y="595.650" font-size="22" font-weight="400" fill="#111827">집합</text>
<text data-source="root.0.1.1" x="573.056" y="500.050" font-size="22" font-weight="400" fill="#111827">dependency</text>
<text data-source="root.0.1.1" x="573.056" y="529.750" font-size="22" font-weight="400" fill="#111827">management</text>
<text data-source="root.0.1.3" x="1200.528" y="500.050" font-size="22" font-weight="400" fill="#111827">직접 및 전이</text>
<text data-source="root.0.1.3" x="1200.528" y="529.750" font-size="22" font-weight="400" fill="#111827">의존성 정렬</text>
<text data-source="root.0.2" x="64.000" y="673.350" font-size="22" font-weight="400" fill="#111827">BOM이 제공하는 검증된 버전 집합이 충돌과 불일치를 줄이며, 개별 version override는 이 보장 범위를 벗어날 수 있습니다.</text>
