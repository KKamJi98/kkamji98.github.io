<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="e9ace222836a5b6ba799d9796416a4f3c64d0c6f6f6b31395bc2548ee07b85a7">
