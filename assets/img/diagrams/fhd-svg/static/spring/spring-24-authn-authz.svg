<text data-source="root.0.0" x="64.000" y="172.800" font-size="36" font-weight="700" fill="#111827">Authentication 이후 Authorization을 판단하는 순서</text>
<text data-source="root.0.1.0.0" x="120.000" y="261.400" font-size="28" font-weight="700" fill="#111827">Authentication: 누구인가</text>
<text data-source="root.0.1.0.1.0" x="176.000" y="347.200" font-size="28" font-weight="700" fill="#111827">credentials</text>
<text data-source="root.0.1.0.1.0" x="176.000" y="389.600" font-size="22" font-weight="400" fill="#111827">Authentication 입력</text>
<text data-source="root.0.1.0.1.2" x="176.000" y="569.300" font-size="28" font-weight="700" fill="#111827">AuthenticationManager</text>
<text data-source="root.0.1.0.1.2" x="176.000" y="611.700" font-size="22" font-weight="400" fill="#111827">인증 수행</text>
<text data-source="root.0.1.0.1.4" x="176.000" y="791.400" font-size="28" font-weight="700" fill="#111827">인증된 Authentication</text>
<text data-source="root.0.1.0.1.4" x="176.000" y="833.800" font-size="22" font-weight="400" fill="#111827">principal과 authorities를 SecurityContext에 저장</text>
<text data-source="root.0.1.0.1.1" x="160.000" y="461.300" font-size="22" font-weight="400" fill="#111827">인증 요청</text>
<text data-source="root.0.1.0.1.3" x="160.000" y="683.400" font-size="22" font-weight="400" fill="#111827">성공</text>
<text data-source="root.0.1.2.0" x="1081.809" y="303.100" font-size="28" font-weight="700" fill="#111827">Authorization: 무엇을 허용</text>
<text data-source="root.0.1.2.1.0" x="1137.809" y="388.900" font-size="28" font-weight="700" fill="#111827">AuthorizationFilter</text>
<text data-source="root.0.1.2.1.2" x="1137.809" y="569.300" font-size="28" font-weight="700" fill="#111827">authorities와 접근 규칙 비교</text>
<text data-source="root.0.1.2.1.4" x="1137.809" y="749.700" font-size="28" font-weight="700" fill="#111827">허용 또는 거부</text>
<text data-source="root.0.1.2.1.4" x="1137.809" y="792.100" font-size="22" font-weight="400" fill="#111827">거부 시 403 Forbidden</text>
<text data-source="root.0.1.2.1.1" x="1121.809" y="461.300" font-size="22" font-weight="400" fill="#111827">권한 비교</text>
<text data-source="root.0.1.2.1.3" x="1121.809" y="641.700" font-size="22" font-weight="400" fill="#111827">판단 결과</text>
<text data-source="root.0.1.1" x="866.191" y="470.350" font-size="22" font-weight="400" fill="#111827">SecurityContext</text>
<text data-source="root.0.1.1" x="866.191" y="500.050" font-size="22" font-weight="400" fill="#111827">의 authorities</text>
<text data-source="root.0.1.1" x="866.191" y="529.750" font-size="22" font-weight="400" fill="#111827">전달</text>
<text data-source="root.0.2" x="64.000" y="935.500" font-size="22" font-weight="400" fill="#111827">인증이 먼저 완료되어야 Authorization이 비교할 권한을 얻습니다. 미인증은 401, 인증됐지만 권한이 없으면 403입니다.</text>
</svg>
