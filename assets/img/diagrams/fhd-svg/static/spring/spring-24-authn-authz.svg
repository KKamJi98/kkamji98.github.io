<polygon data-arrowhead="root.0.1.1" points="1020.000,554.850 1010.000,560.850 1010.000,548.850" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="377.300" font-size="36" font-weight="700" fill="#111827">Authentication 이후 Authorization을 판단하는 순서</text>
<text data-source="root.0.1.0.0" x="106.000" y="425.900" font-size="16" font-weight="700" fill="#111827">Authentication: 누구인가</text>
<text data-source="root.0.1.0.1.0" x="148.000" y="467.500" font-size="16" font-weight="700" fill="#111827">credentials</text>
<text data-source="root.0.1.0.1.0" x="148.000" y="498.300" font-size="14" font-weight="400" fill="#111827">Authentication 입력</text>
<text data-source="root.0.1.0.1.2" x="574.000" y="467.500" font-size="16" font-weight="700" fill="#111827">AuthenticationManager</text>
<text data-source="root.0.1.0.1.2" x="574.000" y="498.300" font-size="14" font-weight="400" fill="#111827">인증 수행</text>
<text data-source="root.0.1.0.1.4" x="148.000" y="635.200" font-size="16" font-weight="700" fill="#111827">인증된 Authentication</text>
<text data-source="root.0.1.0.1.4" x="148.000" y="666.000" font-size="14" font-weight="400" fill="#111827">principal과 authorities를</text>
<text data-source="root.0.1.0.1.4" x="148.000" y="684.900" font-size="14" font-weight="400" fill="#111827">SecurityContext에 저장</text>
<text data-source="root.0.1.0.1.1" x="424.000" y="460.450" font-size="14" font-weight="400" fill="#111827">인증 요청</text>
<text data-source="root.0.1.0.1.3" x="146.000" y="553.200" font-size="14" font-weight="400" fill="#111827">성공</text>
<text data-source="root.0.1.2.0" x="1042.000" y="440.300" font-size="16" font-weight="700" fill="#111827">Authorization: 무엇을 허용</text>
<text data-source="root.0.1.2.1.0" x="1084.000" y="492.400" font-size="16" font-weight="700" fill="#111827">AuthorizationFilter</text>
<text data-source="root.0.1.2.1.2" x="1510.000" y="492.400" font-size="16" font-weight="700" fill="#111827">authorities와 접근 규칙 비교</text>
<text data-source="root.0.1.2.1.4" x="1084.000" y="639.700" font-size="16" font-weight="700" fill="#111827">허용 또는 거부</text>
<text data-source="root.0.1.2.1.4" x="1084.000" y="670.500" font-size="14" font-weight="400" fill="#111827">거부 시 403 Forbidden</text>
<text data-source="root.0.1.2.1.1" x="1360.000" y="469.900" font-size="14" font-weight="400" fill="#111827">권한 비교</text>
<text data-source="root.0.1.2.1.3" x="1082.000" y="557.700" font-size="14" font-weight="400" fill="#111827">판단 결과</text>
<text data-source="root.0.1.1" x="892.000" y="519.050" font-size="14" font-weight="400" fill="#111827">SecurityContext의</text>
<text data-source="root.0.1.1" x="892.000" y="537.950" font-size="14" font-weight="400" fill="#111827">authorities 전달</text>
<text data-source="root.0.2" x="64.000" y="733.800" font-size="14" font-weight="400" fill="#111827">인증이 먼저 완료되어야 Authorization이 비교할 권한을 얻습니다. 미인증은 401, 인증됐지만 권한이 없으면 403입니다.</text>
</svg>
