<polygon data-arrowhead="root.0.1.7" points="1020.000,675.350 1010.000,681.350 1010.000,669.350" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="309.050" font-size="36" font-weight="700" fill="#111827">Spring Boot 빌드와 실행 가능 jar</text>
<text data-source="root.0.1.0" x="120.000" y="397.650" font-size="28" font-weight="700" fill="#111827">src</text>
<text data-source="root.0.1.0" x="120.000" y="440.050" font-size="22" font-weight="400" fill="#111827">src/main/java와 build file,</text>
<text data-source="root.0.1.0" x="120.000" y="469.750" font-size="22" font-weight="400" fill="#111827">Gradle 또는 Maven</text>
<text data-source="root.0.1.2" x="744.000" y="412.500" font-size="28" font-weight="700" fill="#111827">compile and test</text>
<text data-source="root.0.1.2" x="744.000" y="454.900" font-size="22" font-weight="400" fill="#111827">소스 컴파일과 테스트 실행</text>
<text data-source="root.0.1.4" x="1368.000" y="412.500" font-size="28" font-weight="700" fill="#111827">package: Spring Boot plugin</text>
<text data-source="root.0.1.4" x="1368.000" y="454.900" font-size="22" font-weight="400" fill="#111827">Gradle bootJar 또는 Maven repackage</text>
<text data-source="root.0.1.6" x="432.000" y="649.450" font-size="28" font-weight="700" fill="#111827">executable fat jar</text>
<text data-source="root.0.1.6" x="432.000" y="691.850" font-size="22" font-weight="400" fill="#111827">BOOT-INF/classes, BOOT-INF/lib,</text>
<text data-source="root.0.1.6" x="432.000" y="721.550" font-size="22" font-weight="400" fill="#111827">JarLauncher를 포함</text>
<text data-source="root.0.1.8" x="1056.000" y="649.450" font-size="28" font-weight="700" fill="#111827">java -jar app.jar</text>
<text data-source="root.0.1.8" x="1056.000" y="691.850" font-size="22" font-weight="400" fill="#111827">앱과 모든 의존성을 하나의</text>
<text data-source="root.0.1.8" x="1056.000" y="721.550" font-size="22" font-weight="400" fill="#111827">archive에서 시작</text>
<text data-source="root.0.1.1" x="580.000" y="403.850" font-size="22" font-weight="400" fill="#111827">빌드 단계</text>
<text data-source="root.0.1.3" x="1204.000" y="403.850" font-size="22" font-weight="400" fill="#111827">package</text>
<text data-source="root.0.1.5" x="660.000" y="541.450" font-size="22" font-weight="400" fill="#111827">repackage</text>
<text data-source="root.0.1.7" x="892.000" y="655.650" font-size="22" font-weight="400" fill="#111827">실행</text>
<text data-source="root.0.2" x="64.000" y="799.250" font-size="22" font-weight="400" fill="#111827">fat jar는 애플리케이션과 모든 dependency를 함께 담기 때문에 Spring Boot 전용 classloader와 launcher를 사용합니다.</text>
</svg>
