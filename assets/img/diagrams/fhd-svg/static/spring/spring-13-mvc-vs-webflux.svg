<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="934ab5add20cba9b281186655e4f5c31ba0cffc51b3275261113a2aa7410cdf8">
