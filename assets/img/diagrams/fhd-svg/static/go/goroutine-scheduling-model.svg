<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="4a6d23b2382bab7894589cceb991dc1bacee4473c1563cc976042133785f4ad6">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-node="root.0.2.0" x="96.000" y="391.000" width="467.204" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.2" x="726.398" y="391.000" width="467.204" height="126.100" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.4" x="1356.796" y="376.150" width="467.204" height="155.800" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.2.6" x="411.199" y="651.150" width="467.204" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.8" x="1041.597" y="651.150" width="467.204" height="155.800" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<path data-edge="root.0.2.1" data-from="root.0.2.0" data-to="root.0.2.2" d="M 575.204 454.050 L 714.398 454.050" fill="none" stroke="#475569" stroke-width="3"><title>실행 단위 생성</title></path>
<polygon data-arrowhead="root.0.2.1" points="714.398,454.050 704.398,460.050 704.398,448.050" fill="#475569"/>
<path data-edge="root.0.2.3" data-from="root.0.2.2" data-to="root.0.2.4" d="M 1205.602 454.050 L 1344.796 454.050" fill="none" stroke="#475569" stroke-width="3"><title>G, M, P와 work stealing</title></path>
<polygon data-arrowhead="root.0.2.3" points="1344.796,454.050 1334.796,460.050 1334.796,448.050" fill="#475569"/>
<path data-edge="root.0.2.5" data-from="root.0.2.4" data-to="root.0.2.6" d="M 1590.398 543.950 L 1590.398 579.950 L 644.801 579.950 L 644.801 639.150" fill="none" stroke="#475569" stroke-width="3"><title>blocking thread는 park</title></path>
<polygon data-arrowhead="root.0.2.5" points="644.801,639.150 638.801,629.150 650.801,629.150" fill="#475569"/>
<path data-edge="root.0.2.7" data-from="root.0.2.6" data-to="root.0.2.8" d="M 890.403 729.050 L 1029.597 729.050" fill="none" stroke="#475569" stroke-width="3"><title>GOMAXPROCS 범위 안에서 병렬 실행</title></path>
<polygon data-arrowhead="root.0.2.7" points="1029.597,729.050 1019.597,735.050 1019.597,723.050" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="285.850" font-size="36" font-weight="700" fill="#111827">Go scheduler는 많은 goroutine을 적은 OS thread에 배치합니다</text>
<text data-source="root.0.1" x="64.000" y="344.450" font-size="22" font-weight="400" fill="#111827">blocking syscall로 한 thread가 park되면 scheduler가 남은 goroutine을 다른 thread에 배치해 실행을 이어갑니다.</text>
<text data-source="root.0.2.0" x="120.000" y="443.000" font-size="28" font-weight="700" fill="#111827">Go program</text>
<text data-source="root.0.2.0" x="120.000" y="485.400" font-size="22" font-weight="400" fill="#111827">go 키워드로 goroutine을 계속 생성합니다.</text>
<text data-source="root.0.2.2" x="750.398" y="443.000" font-size="28" font-weight="700" fill="#111827">Goroutines</text>
<text data-source="root.0.2.2" x="750.398" y="485.400" font-size="22" font-weight="400" fill="#111827">각각 작은 stack을 가진 많은 작업입니다.</text>
<text data-source="root.0.2.4" x="1380.796" y="428.150" font-size="28" font-weight="700" fill="#111827">Go scheduler</text>
<text data-source="root.0.2.4" x="1380.796" y="470.550" font-size="22" font-weight="400" fill="#111827">goroutine을 실행 가능한 thread에</text>
<text data-source="root.0.2.4" x="1380.796" y="500.250" font-size="22" font-weight="400" fill="#111827">multiplex합니다.</text>
<text data-source="root.0.2.6" x="435.199" y="703.150" font-size="28" font-weight="700" fill="#111827">OS threads</text>
<text data-source="root.0.2.6" x="435.199" y="745.550" font-size="22" font-weight="400" fill="#111827">goroutine 수보다 훨씬 적은 OS thread가</text>
<text data-source="root.0.2.6" x="435.199" y="775.250" font-size="22" font-weight="400" fill="#111827">동작합니다.</text>
<text data-source="root.0.2.8" x="1065.597" y="703.150" font-size="28" font-weight="700" fill="#111827">CPU cores</text>
<text data-source="root.0.2.8" x="1065.597" y="745.550" font-size="22" font-weight="400" fill="#111827">실제로 동시에 실행할 수 있는 core 수가</text>
<text data-source="root.0.2.8" x="1065.597" y="775.250" font-size="22" font-weight="400" fill="#111827">병렬성을 제한합니다.</text>
<text data-source="root.0.2.1" x="567.204" y="434.350" font-size="22" font-weight="400" fill="#111827">실행 단위 생성</text>
<text data-source="root.0.2.3" x="1197.602" y="404.650" font-size="22" font-weight="400" fill="#111827">G, M, P와</text>
<text data-source="root.0.2.3" x="1197.602" y="434.350" font-size="22" font-weight="400" fill="#111827">work stealing</text>
<text data-source="root.0.2.5" x="656.801" y="571.950" font-size="22" font-weight="400" fill="#111827">blocking thread는 park</text>
<text data-source="root.0.2.7" x="882.403" y="649.950" font-size="22" font-weight="400" fill="#111827">GOMAXPROCS</text>
<text data-source="root.0.2.7" x="882.403" y="679.650" font-size="22" font-weight="400" fill="#111827">범위 안에서</text>
<text data-source="root.0.2.7" x="882.403" y="709.350" font-size="22" font-weight="400" fill="#111827">병렬 실행</text>
</svg>
