<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="4a6d23b2382bab7894589cceb991dc1bacee4473c1563cc976042133785f4ad6">
