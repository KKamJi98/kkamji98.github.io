<path data-edge="root.0.4" data-from="root.0.1" data-to="root.0.3" d="M 360.000 337.000 L 360.000 418.000" fill="none" stroke="#475569" stroke-width="3"><title>dev workspace가 metastore에 연결</title></path>
<polygon data-arrowhead="root.0.4" points="360.000,418.000 354.000,408.000 366.000,408.000" fill="#475569"/>
<path data-edge="root.0.5" data-from="root.0.2" data-to="root.0.3" d="M 1680.000 337.000 L 1680.000 418.000" fill="none" stroke="#475569" stroke-width="3"><title>prod workspace가 metastore에 연결</title></path>
<polygon data-arrowhead="root.0.5" points="1680.000,418.000 1674.000,408.000 1686.000,408.000" fill="#475569"/>
<path data-edge="root.0.6" data-from="root.0.3.2" data-to="root.0.2" d="M 560.000 588.000 L 560.000 380.000 L 1460.000 380.000 L 1460.000 337.000" fill="none" stroke="#475569" stroke-width="3"><title>workspace-catalog binding으로 catalog main을 prod에만 묶음</title></path>
<polygon data-arrowhead="root.0.6" points="1460.000,337.000 1466.000,347.000 1454.000,347.000" fill="#475569"/>
<path data-edge="root.0.8" data-from="root.0.3.2" data-to="root.0.3.3" d="M 607.000 688.000 L 688.000 688.000" fill="none" stroke="#475569" stroke-width="3"><title>catalog가 schema를 포함</title></path>
<polygon data-arrowhead="root.0.8" points="688.000,688.000 678.000,694.000 678.000,682.000" fill="#475569"/>
<path data-edge="root.0.9" data-from="root.0.3.3" data-to="root.0.3.4" d="M 1232.000 688.000 L 1313.000 688.000" fill="none" stroke="#475569" stroke-width="3"><title>schema가 table을 포함</title></path>
<polygon data-arrowhead="root.0.9" points="1313.000,688.000 1303.000,694.000 1303.000,682.000" fill="#475569"/>
<text data-source="root.0.0" x="60.000" y="86.000" font-size="36" font-weight="700" fill="#111827">GRANT는 metastore 범위에서 유효하고, binding이 catalog를 workspace에 묶습니다</text>
<text data-source="root.0.1" x="108.000" y="208.000" font-size="30" font-weight="700" fill="#111827">Workspace dev</text>
<text data-source="root.0.1" x="108.000" y="253.000" font-size="24" font-weight="400" fill="#111827">GRANT가 있어도</text>
<text data-source="root.0.1" x="108.000" y="285.400" font-size="24" font-weight="400" fill="#111827">catalog main 접근 거부</text>
<text data-source="root.0.2" x="1308.000" y="208.000" font-size="30" font-weight="700" fill="#111827">Workspace prod</text>
<text data-source="root.0.2" x="1308.000" y="253.000" font-size="24" font-weight="400" fill="#111827">binding된 catalog main을</text>
<text data-source="root.0.2" x="1308.000" y="285.400" font-size="24" font-weight="400" fill="#111827">GRANT대로 사용</text>
<text data-source="root.0.3.2" x="103.000" y="658.000" font-size="30" font-weight="700" fill="#111827">catalog main</text>
<text data-source="root.0.3.2" x="103.000" y="703.000" font-size="24" font-weight="400" fill="#111827">USE CATALOG</text>
<text data-source="root.0.3.2" x="103.000" y="735.400" font-size="24" font-weight="400" fill="#111827">binding 대상: prod</text>
<text data-source="root.0.3.3" x="728.000" y="658.000" font-size="30" font-weight="700" fill="#111827">schema sales</text>
<text data-source="root.0.3.3" x="728.000" y="703.000" font-size="24" font-weight="400" fill="#111827">USE SCHEMA</text>
<text data-source="root.0.3.3" x="728.000" y="735.400" font-size="24" font-weight="400" fill="#111827">SELECT, 아래 테이블에 상속</text>
<text data-source="root.0.3.4" x="1353.000" y="658.000" font-size="30" font-weight="700" fill="#111827">table orders</text>
<text data-source="root.0.3.4" x="1353.000" y="703.000" font-size="24" font-weight="400" fill="#111827">Parquet와 _delta_log</text>
<text data-source="root.0.3.4" x="1353.000" y="735.400" font-size="24" font-weight="400" fill="#111827">S3 external location</text>
<text data-source="root.0.3.0" x="75.000" y="485.000" font-size="30" font-weight="700" fill="#111827">Metastore, region당 1개</text>
<text data-source="root.0.3.1" x="75.000" y="534.000" font-size="24" font-weight="400" fill="#111827">data-readers group에 준 GRANT</text>
<text data-source="root.0.7" x="700.000" y="364.000" font-size="24" font-weight="400" fill="#111827">workspace-catalog binding</text>
<text data-source="root.0.10" x="60.000" y="909.000" font-size="24" font-weight="400" fill="#111827">binding이 없으면 같은 metastore를 쓰는 모든 workspace에서 GRANT가 그대로 유효합니다</text>
</svg>
