<path data-edge="root.0.2.7" data-from="root.0.2.6" data-to="root.0.2.8" d="M 1836.000 312.200 L 1848.000 312.200 L 1848.000 431.650 L 72.000 431.650 L 72.000 526.800 L 84.000 526.800" fill="none" stroke="#475569" stroke-width="3"><title>허용된 요청</title></path>
