<polygon data-arrowhead="root.0.1.1" points="960.000,297.700 954.000,287.700 966.000,287.700" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="124.100" font-size="36" font-weight="700" fill="#111827">인증서 설치 위치가 발급 경로를 가른다</text>
<text data-source="root.0.1.0" x="76.000" y="178.700" font-size="18" font-weight="700" fill="#111827">TLS 인증서가 설치될 위치</text>
<text data-source="root.0.1.0" x="76.000" y="212.100" font-size="16" font-weight="400" fill="#111827">공인 신뢰와 내부 PKI 중 필요한 범위를 먼저 확인</text>
<text data-source="root.0.1.2.0.0" x="76.000" y="339.700" font-size="18" font-weight="700" fill="#111827">AWS 통합 서비스</text>
<text data-source="root.0.1.2.0.1.0" x="120.000" y="388.000" font-size="18" font-weight="700" fill="#111827">ACM 일반 공인 인증서</text>
<text data-source="root.0.1.2.0.1.0" x="120.000" y="421.400" font-size="16" font-weight="400" fill="#111827">private key는 AWS가 보유하며 반출 불가</text>
<text data-source="root.0.1.2.0.1.2" x="120.000" y="565.000" font-size="18" font-weight="700" fill="#111827">ELB, CloudFront, API Gateway</text>
<text data-source="root.0.1.2.0.1.2" x="120.000" y="598.400" font-size="16" font-weight="400" fill="#111827">CloudFront는 us-east-1 인증서 필요, 갱신과 재바인딩은 ACM 담당</text>
<text data-source="root.0.1.2.1.0" x="677.333" y="339.700" font-size="18" font-weight="700" fill="#111827">자체 관리 서버</text>
<text data-source="root.0.1.2.1.1.0" x="721.333" y="388.000" font-size="18" font-weight="700" fill="#111827">exportable public certificate</text>
<text data-source="root.0.1.2.1.1.0" x="721.333" y="421.400" font-size="16" font-weight="400" fill="#111827">요청 때만 지정, 유효기간 198일, 인증서 자체 과금</text>
<text data-source="root.0.1.2.1.1.2" x="721.333" y="565.000" font-size="18" font-weight="700" fill="#111827">EC2, 컨테이너, 온프레미스</text>
<text data-source="root.0.1.2.1.1.2" x="721.333" y="598.400" font-size="16" font-weight="400" fill="#111827">passphrase로 암호화된 key를 export하고 재배포는 사용자가 담당</text>
<text data-source="root.0.1.2.2.0" x="1278.667" y="339.700" font-size="18" font-weight="700" fill="#111827">ACME client</text>
<text data-source="root.0.1.2.2.1.0" x="1322.667" y="388.000" font-size="18" font-weight="700" fill="#111827">ACM ACME 경로</text>
<text data-source="root.0.1.2.2.1.0" x="1322.667" y="421.400" font-size="16" font-weight="400" fill="#111827">Certbot 또는 cert-manager가 key를 생성하고 보유</text>
<text data-source="root.0.1.2.2.1.2" x="1322.667" y="565.000" font-size="18" font-weight="700" fill="#111827">자체 관리 인프라</text>
<text data-source="root.0.1.2.2.1.2" x="1322.667" y="598.400" font-size="16" font-weight="400" fill="#111827">ACM inventory에는 보이지만 AWS 통합 서비스에 바인딩 불가</text>
<text data-source="root.0.1.2.3.0" x="76.000" y="670.000" font-size="18" font-weight="700" fill="#111827">내부 PKI</text>
<text data-source="root.0.1.2.3.1.0" x="120.000" y="718.300" font-size="18" font-weight="700" fill="#111827">AWS Private CA</text>
<text data-source="root.0.1.2.3.1.0" x="120.000" y="751.700" font-size="16" font-weight="400" fill="#111827">사설 CA 계층이며 공인 신뢰 체인은 아님</text>
<text data-source="root.0.1.2.3.1.2" x="120.000" y="895.300" font-size="18" font-weight="700" fill="#111827">내부 서비스와 client 인증</text>
<text data-source="root.0.1.2.3.1.2" x="120.000" y="928.700" font-size="16" font-weight="400" fill="#111827">사설 인증서를 export해 자체 배포</text>
<text data-source="root.0.1.3" x="64.000" y="986.300" font-size="16" font-weight="400" fill="#111827">인증서는 리전 리소스이므로 리전 간 복사가 되지 않습니다. 각 리전에서 요청하거나 import해야 합니다.</text>
<text data-source="root.0.1.1" x="980.000" y="274.900" font-size="16" font-weight="400" fill="#111827">요구사항에 따라 선택</text>
<text data-source="root.0.1.2.0.1.1.meaning" x="88.000" y="470.100" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.2.1.1.1.meaning" x="689.333" y="470.100" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.2.2.1.1.meaning" x="1290.667" y="470.100" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.2.3.1.1.meaning" x="88.000" y="800.400" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
