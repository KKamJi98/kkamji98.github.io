<text data-source="root.0.1.2.1.1.1" x="990.000" y="890.700" font-size="20" font-weight="400" fill="#111827">Prod, Staging 계정을 직접 구성</text>
<text data-source="root.0.1.3" x="64.000" y="1001.700" font-size="20" font-weight="400" fill="#111827">4.0은 서비스 통합 없이도 생성할 수 있습니다. 활성화한 통합의 계정은 같은 parent OU에 둡니다. Infrastructure와 Workloads OU는 직접 설계합니다.</text>
