<text data-source="root.0.0" x="64.000" y="107.300" font-size="36" font-weight="700" fill="#111827">Control Tower 기본 계정 구성과 Landing Zone 4.0</text>
<text data-source="root.0.1.0" x="84.000" y="183.900" font-size="24" font-weight="700" fill="#111827">AWS Control Tower</text>
<text data-source="root.0.1.0" x="84.000" y="223.100" font-size="20" font-weight="400" fill="#111827">Organizations, Service Catalog, IAM Identity Center를 오케스트레이션</text>
<text data-source="root.0.1.2.0.0" x="108.000" y="417.100" font-size="24" font-weight="700" fill="#111827">3.3 이하의 기본 구성 예시</text>
<text data-source="root.0.1.2.0.1.0.0" x="128.000" y="489.500" font-size="24" font-weight="700" fill="#111827">Security OU</text>
<text data-source="root.0.1.2.0.1.0.1" x="128.000" y="537.900" font-size="20" font-weight="400" fill="#111827">4.0은 OU 생성을 강제하거나 관리하지 않음</text>
<text data-source="root.0.1.2.0.1.0.2.0.0" x="148.000" y="608.900" font-size="24" font-weight="700" fill="#111827">Log archive 계정</text>
<text data-source="root.0.1.2.0.1.0.2.0.0" x="148.000" y="648.100" font-size="20" font-weight="400" fill="#111827">4.0은 선택한 통합과 계정 설정 확인</text>
<text data-source="root.0.1.2.0.1.0.2.0.1" x="559.000" y="608.900" font-size="24" font-weight="700" fill="#111827">Audit 계정</text>
<text data-source="root.0.1.2.0.1.0.2.0.1" x="559.000" y="648.100" font-size="20" font-weight="400" fill="#111827">4.0은 선택한 통합과 계정 설정 확인</text>
<text data-source="root.0.1.2.0.1.1" x="990.000" y="489.500" font-size="24" font-weight="700" fill="#111827">Sandbox OU</text>
<text data-source="root.0.1.2.0.1.1" x="990.000" y="528.700" font-size="20" font-weight="400" fill="#111827">이전 기본 설정의 선택적 OU</text>
<text data-source="root.0.1.2.1.0" x="108.000" y="779.100" font-size="24" font-weight="700" fill="#111827">직접 생성해야 하는 영역</text>
