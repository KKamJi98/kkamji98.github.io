<path data-edge="root.0.1.0.1.1" data-from="root.0.1.0.1.0" data-to="root.0.1.0.1.2" d="M 508.000 346.750 L 508.000 411.050" fill="none" stroke="#475569" stroke-width="3"><title>제약별 거절 조건</title></path>
<polygon data-arrowhead="root.0.1.0.1.1" points="508.000,411.050 502.000,401.050 514.000,401.050" fill="#475569"/>
<path data-edge="root.0.1.0.1.3" data-from="root.0.1.0.1.2" data-to="root.0.1.0.1.4" d="M 508.000 601.650 L 508.000 665.950" fill="none" stroke="#475569" stroke-width="3"><title>제약 내 요청</title></path>
<polygon data-arrowhead="root.0.1.0.1.3" points="508.000,665.950 502.000,655.950 514.000,655.950" fill="#475569"/>
<path data-edge="root.0.1.1.1.1" data-from="root.0.1.1.1.0" data-to="root.0.1.1.1.2" d="M 1352.000 299.750 L 1472.000 299.750" fill="none" stroke="#475569" stroke-width="3"><title>큐에서 처리 시도</title></path>
<polygon data-arrowhead="root.0.1.1.1.1" points="1472.000,299.750 1462.000,305.750 1462.000,293.750" fill="#475569"/>
<path data-edge="root.0.1.1.1.3" data-from="root.0.1.1.1.2" data-to="root.0.1.1.1.4" d="M 1820.000 299.750 L 1832.000 299.750 L 1832.000 407.050 L 992.000 407.050 L 992.000 526.500 L 1004.000 526.500" fill="none" stroke="#475569" stroke-width="3"><title>처리 시 throttling 429 / system 5xx</title></path>
<polygon data-arrowhead="root.0.1.1.1.3" points="1004.000,526.500 994.000,532.500 994.000,520.500" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="152.850" font-size="36" font-weight="700" fill="#111827">동기 호출 제한과 비동기 큐 처리 제한을 구분한다</text>
<text data-source="root.0.1.0.0" x="80.000" y="217.450" font-size="20" font-weight="700" fill="#111827">동기 호출: 호출자가 결과를 기다림</text>
<text data-source="root.0.1.0.1.0" x="96.000" y="276.450" font-size="20" font-weight="700" fill="#111827">Synchronous invoke</text>
<text data-source="root.0.1.0.1.0" x="96.000" y="312.450" font-size="18" font-weight="400" fill="#111827">RPS, 가용 동시성, 환경 확장 제약을 함께 만족해야 함</text>
<text data-source="root.0.1.0.1.2.0" x="120.000" y="483.050" font-size="20" font-weight="700" fill="#111827">RPS 제한</text>
<text data-source="root.0.1.0.1.2.0" x="120.000" y="519.050" font-size="18" font-weight="400" fill="#111827">계정 및 함수의 동기 RPS 한도: 관련 동시성</text>
<text data-source="root.0.1.0.1.2.0" x="120.000" y="543.350" font-size="18" font-weight="400" fill="#111827">한도의 10배. 초과 시 호출자에게 429</text>
<text data-source="root.0.1.0.1.2.1" x="532.000" y="483.050" font-size="20" font-weight="700" fill="#111827">동시성 / 스케일 제한</text>
<text data-source="root.0.1.0.1.2.1" x="532.000" y="519.050" font-size="18" font-weight="400" fill="#111827">가용 동시성 부족 또는 확장 속도로 수요를 못</text>
<text data-source="root.0.1.0.1.2.1" x="532.000" y="543.350" font-size="18" font-weight="400" fill="#111827">따라가면 호출자에게 429</text>
<text data-source="root.0.1.0.1.4" x="96.000" y="713.950" font-size="20" font-weight="700" fill="#111827">실행 후 결과 반환</text>
<text data-source="root.0.1.0.1.4" x="96.000" y="749.950" font-size="18" font-weight="400" fill="#111827">기존 환경 재사용, provisioned 환경 또는 새 환경 사용</text>
<text data-source="root.0.1.0.1.1" x="528.000" y="384.750" font-size="18" font-weight="400" fill="#111827">제약별 거절 조건</text>
<text data-source="root.0.1.0.1.3" x="528.000" y="639.650" font-size="18" font-weight="400" fill="#111827">제약 내 요청</text>
<text data-source="root.0.1.1.0" x="984.000" y="217.450" font-size="20" font-weight="700" fill="#111827">비동기 호출: 수락된 이벤트의 처리</text>
<text data-source="root.0.1.1.1.0" x="1032.000" y="276.450" font-size="20" font-weight="700" fill="#111827">Accepted async event</text>
<text data-source="root.0.1.1.1.0" x="1032.000" y="312.450" font-size="18" font-weight="400" fill="#111827">Lambda 내부 큐에 수락된 이벤트가</text>
<text data-source="root.0.1.1.1.0" x="1032.000" y="336.750" font-size="18" font-weight="400" fill="#111827">대상</text>
<text data-source="root.0.1.1.1.2" x="1500.000" y="276.450" font-size="20" font-weight="700" fill="#111827">가용 동시성 / 환경 확장</text>
<text data-source="root.0.1.1.1.2" x="1500.000" y="312.450" font-size="18" font-weight="400" fill="#111827">동기와 같은 RPS 게이트를 적용하지</text>
<text data-source="root.0.1.1.1.2" x="1500.000" y="336.750" font-size="18" font-weight="400" fill="#111827">않음</text>
<text data-source="root.0.1.1.1.4" x="1032.000" y="491.050" font-size="20" font-weight="700" fill="#111827">큐로 반환 후 재시도</text>
<text data-source="root.0.1.1.1.4" x="1032.000" y="527.050" font-size="18" font-weight="400" fill="#111827">기본 최대 6시간 재시도. 처리 시 429는</text>
<text data-source="root.0.1.1.1.4" x="1032.000" y="551.350" font-size="18" font-weight="400" fill="#111827">원래 호출자에게 동기 반환하는 경로가</text>
<text data-source="root.0.1.1.1.4" x="1032.000" y="575.650" font-size="18" font-weight="400" fill="#111827">아님</text>
<text data-source="root.0.1.1.1.1" x="1344.000" y="281.450" font-size="18" font-weight="400" fill="#111827">큐에서 처리 시도</text>
<text data-source="root.0.1.1.1.3" x="1024.000" y="399.050" font-size="18" font-weight="400" fill="#111827">처리 시 throttling 429 / system 5xx</text>
<text data-source="root.0.2.0" x="80.000" y="840.250" font-size="20" font-weight="700" fill="#111827">Reserved concurrency</text>
<text data-source="root.0.2.0" x="80.000" y="876.250" font-size="18" font-weight="400" fill="#111827">함수용 용량 예약이자 최대 동시 실행 수. 최소 실행 환경 수나 사전 초기화가</text>
<text data-source="root.0.2.0" x="80.000" y="900.550" font-size="18" font-weight="400" fill="#111827">아님</text>
<text data-source="root.0.2.1" x="682.667" y="840.250" font-size="20" font-weight="700" fill="#111827">Provisioned concurrency</text>
<text data-source="root.0.2.1" x="682.667" y="876.250" font-size="18" font-weight="400" fill="#111827">사전 초기화된 유료 환경. reserved 설정이 있으면 그 값을 넘을 수 없음</text>
<text data-source="root.0.2.2" x="1285.333" y="840.250" font-size="20" font-weight="700" fill="#111827">확장 속도와 미예약 pool</text>
<text data-source="root.0.2.2" x="1285.333" y="876.250" font-size="18" font-weight="400" fill="#111827">함수별 10초당 최대 1,000 환경 확장. 계정 한도에서 최소 100은 미예약</text>
<text data-source="root.0.2.2" x="1285.333" y="900.550" font-size="18" font-weight="400" fill="#111827">함수용으로 남김</text>
<text data-source="root.0.3" x="64.000" y="956.850" font-size="18" font-weight="400" fill="#111827">비동기 lane은 이벤트 수락 이후 처리 경로입니다. 이벤트 수락 자체가 항상 성공한다는 뜻은 아니며, 만료와 실패 처리는 비동기 설정에 따릅니다.</text>
</svg>
