<text data-source="root.0.0" x="64.000" y="102.700" font-size="36" font-weight="700" fill="#111827">Spot 신호는 도착 시점에 따라 대응이 달라집니다</text>
<text data-source="root.0.1" x="84.000" y="179.300" font-size="24" font-weight="700" fill="#111827">EC2가 Spot 용량을 회수</text>
<text data-source="root.0.1" x="84.000" y="218.500" font-size="20" font-weight="400" fill="#111827">capacity, price, constraints 중 하나로 중단 시작</text>
<text data-source="root.0.3.0.0" x="84.000" y="388.500" font-size="24" font-weight="700" fill="#111827">선제 교체</text>
<text data-source="root.0.3.0.1.0" x="136.000" y="474.400" font-size="24" font-weight="700" fill="#111827">rebalance</text>
<text data-source="root.0.3.0.1.0" x="136.000" y="505.600" font-size="24" font-weight="700" fill="#111827">recommendation</text>
<text data-source="root.0.3.0.1.0" x="136.000" y="544.800" font-size="20" font-weight="400" fill="#111827">보통 2분 통지보다 먼저 오며</text>
<text data-source="root.0.3.0.1.0" x="136.000" y="571.800" font-size="20" font-weight="400" fill="#111827">동시에 올 수도 있음</text>
<text data-source="root.0.3.0.1.2" x="600.174" y="460.900" font-size="24" font-weight="700" fill="#111827">ASG Capacity</text>
<text data-source="root.0.3.0.1.2" x="600.174" y="492.100" font-size="24" font-weight="700" fill="#111827">Rebalancing</text>
<text data-source="root.0.3.0.1.2" x="600.174" y="531.300" font-size="20" font-weight="400" fill="#111827">새 인스턴스가 health</text>
<text data-source="root.0.3.0.1.2" x="600.174" y="558.300" font-size="20" font-weight="400" fill="#111827">check를 통과한 뒤 기존</text>
<text data-source="root.0.3.0.1.2" x="600.174" y="585.300" font-size="20" font-weight="400" fill="#111827">인스턴스 종료</text>
<text data-source="root.0.3.0.1.4" x="136.000" y="752.300" font-size="24" font-weight="700" fill="#111827">선제 교체 완료</text>
<text data-source="root.0.3.0.1.4" x="136.000" y="791.500" font-size="20" font-weight="400" fill="#111827">중단 전에 대체 인스턴스가</text>
<text data-source="root.0.3.0.1.4" x="136.000" y="818.500" font-size="20" font-weight="400" fill="#111827">준비됨</text>
<text data-source="root.0.3.0.1.1" x="437.826" y="468.600" font-size="20" font-weight="400" fill="#111827">Capacity</text>
<text data-source="root.0.3.0.1.1" x="437.826" y="495.600" font-size="20" font-weight="400" fill="#111827">Rebalancing</text>
<text data-source="root.0.3.0.1.3" x="124.000" y="652.300" font-size="20" font-weight="400" fill="#111827">desired capacity 최대 10% 초과</text>
<text data-source="root.0.3.1.0" x="990.000" y="388.500" font-size="24" font-weight="700" fill="#111827">종료 직전 정리</text>
<text data-source="root.0.3.1.1.0" x="1042.000" y="485.300" font-size="24" font-weight="700" fill="#111827">2분 중단 통지</text>
<text data-source="root.0.3.1.1.0" x="1042.000" y="524.500" font-size="20" font-weight="400" fill="#111827">stop과 terminate 대상,</text>
<text data-source="root.0.3.1.1.0" x="1042.000" y="551.500" font-size="20" font-weight="400" fill="#111827">hibernate는 즉시 시작</text>
<text data-source="root.0.3.1.1.2" x="1505.000" y="469.700" font-size="24" font-weight="700" fill="#111827">이벤트와 메타데이터</text>
<text data-source="root.0.3.1.1.2" x="1505.000" y="500.900" font-size="24" font-weight="700" fill="#111827">폴링</text>
<text data-source="root.0.3.1.1.2" x="1505.000" y="540.100" font-size="20" font-weight="400" fill="#111827">instance-action을 5초 주기로</text>
<text data-source="root.0.3.1.1.2" x="1505.000" y="567.100" font-size="20" font-weight="400" fill="#111827">확인, best effort</text>
<text data-source="root.0.3.1.1.4" x="1042.000" y="742.900" font-size="24" font-weight="700" fill="#111827">설정한 중단 동작</text>
<text data-source="root.0.3.1.1.4" x="1042.000" y="782.100" font-size="20" font-weight="400" fill="#111827">terminate, stop, hibernate,</text>
<text data-source="root.0.3.1.1.4" x="1042.000" y="809.100" font-size="20" font-weight="400" fill="#111827">persistent에서는 Terminate</text>
<text data-source="root.0.3.1.1.4" x="1042.000" y="836.100" font-size="20" font-weight="400" fill="#111827">불가</text>
<text data-source="root.0.3.1.1.1" x="1345.000" y="436.900" font-size="20" font-weight="400" fill="#111827">EventBridge</text>
<text data-source="root.0.3.1.1.1" x="1345.000" y="463.900" font-size="20" font-weight="400" fill="#111827">또는</text>
<text data-source="root.0.3.1.1.1" x="1345.000" y="490.900" font-size="20" font-weight="400" fill="#111827">metadata</text>
<text data-source="root.0.3.1.1.3" x="1030.000" y="642.900" font-size="20" font-weight="400" fill="#111827">2분 안에 정리</text>
<text data-source="root.0.4" x="84.000" y="947.100" font-size="24" font-weight="700" fill="#111827">중단 빈도 완화</text>
<text data-source="root.0.4" x="84.000" y="986.300" font-size="20" font-weight="400" fill="#111827">attribute-based instance type selection으로 pool을 넓히고 price-capacity-optimized를 사용합니다. Capacity Rebalancing 자체는 중단율을 낮추지 않습니다.</text>
<text data-source="root.0.2" x="980.000" y="301.500" font-size="20" font-weight="400" fill="#111827">두 신호로 분기</text>
</svg>
