<text data-source="root.0.0" x="64.000" y="160.850" font-size="36" font-weight="700" fill="#111827">CloudFront origin failover 조건</text>
<text data-source="root.0.1.0" x="112.000" y="561.150" font-size="20" font-weight="700" fill="#111827">Viewer request</text>
<text data-source="root.0.1.0" x="112.000" y="597.150" font-size="18" font-weight="400" fill="#111827">메서드에 따라 origin group 경로가 갈림</text>
<text data-source="root.0.1.2.0.0" x="1048.000" y="225.450" font-size="20" font-weight="700" fill="#111827">GET, HEAD, OPTIONS</text>
<text data-source="root.0.1.2.0.1.0" x="1064.000" y="284.450" font-size="20" font-weight="700" fill="#111827">CloudFront</text>
<text data-source="root.0.1.2.0.1.0" x="1064.000" y="320.450" font-size="18" font-weight="400" fill="#111827">항상 primary origin으로 먼저 전달</text>
<text data-source="root.0.1.2.0.1.2" x="1064.000" y="467.050" font-size="20" font-weight="700" fill="#111827">Primary origin</text>
<text data-source="root.0.1.2.0.1.2" x="1064.000" y="503.050" font-size="18" font-weight="400" fill="#111827">상태 코드 또는 timeout 반환</text>
<text data-source="root.0.1.2.0.1.4" x="1064.000" y="673.950" font-size="20" font-weight="700" fill="#111827">Failover 상태 코드 조건</text>
<text data-source="root.0.1.2.0.1.4" x="1064.000" y="709.950" font-size="18" font-weight="400" fill="#111827">400, 403, 404, 416, 429, 500-504 중</text>
<text data-source="root.0.1.2.0.1.4" x="1064.000" y="734.250" font-size="18" font-weight="400" fill="#111827">설정값</text>
<text data-source="root.0.1.2.0.1.6" x="1064.000" y="880.850" font-size="20" font-weight="700" fill="#111827">Secondary origin</text>
<text data-source="root.0.1.2.0.1.6" x="1064.000" y="916.850" font-size="18" font-weight="400" fill="#111827">조건을 만족한 읽기 요청만 수신</text>
<text data-source="root.0.1.2.0.1.3" x="1246.000" y="575.350" font-size="18" font-weight="400" fill="#111827">설정된 failover</text>
<text data-source="root.0.1.2.0.1.3" x="1246.000" y="599.650" font-size="18" font-weight="400" fill="#111827">code인가</text>
<text data-source="root.0.1.2.1.0" x="1452.000" y="225.450" font-size="20" font-weight="700" fill="#111827">POST, PUT</text>
<text data-source="root.0.1.2.1.1.0" x="1468.000" y="284.450" font-size="20" font-weight="700" fill="#111827">쓰기 요청</text>
<text data-source="root.0.1.2.1.1.0" x="1468.000" y="320.450" font-size="18" font-weight="400" fill="#111827">origin group failover 대상 메서드가</text>
<text data-source="root.0.1.2.1.1.0" x="1468.000" y="344.750" font-size="18" font-weight="400" fill="#111827">아님</text>
<text data-source="root.0.1.2.1.1.2" x="1468.000" y="491.350" font-size="20" font-weight="700" fill="#111827">별도 이중화 필요</text>
<text data-source="root.0.1.2.1.1.2" x="1468.000" y="527.350" font-size="18" font-weight="400" fill="#111827">쓰기 실패는 CloudFront origin</text>
<text data-source="root.0.1.2.1.1.2" x="1468.000" y="551.650" font-size="18" font-weight="400" fill="#111827">failover로 전환되지 않음</text>
