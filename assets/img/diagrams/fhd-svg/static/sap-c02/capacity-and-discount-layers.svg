<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 900.000 476.850 L 1020.000 476.850" fill="none" stroke="#475569" stroke-width="3"><title>요구를 층으로 분리</title></path>
<polygon data-arrowhead="root.0.1.1" points="1020.000,476.850 1010.000,482.850 1010.000,470.850" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="156.600" font-size="36" font-weight="700" fill="#111827">요금 할인과 용량 확보는 다른 층이다</text>
<text data-source="root.0.1.0.0" x="108.000" y="455.550" font-size="18" font-weight="700" fill="#111827">할인 요구</text>
<text data-source="root.0.1.0.0" x="108.000" y="488.950" font-size="16" font-weight="400" fill="#111827">1년 또는 3년 유지될 baseline 지출을 줄임</text>
<text data-source="root.0.1.0.1" x="510.000" y="455.550" font-size="18" font-weight="700" fill="#111827">용량 요구</text>
<text data-source="root.0.1.0.1" x="510.000" y="488.950" font-size="16" font-weight="400" fill="#111827">특정 시각 AZ 용량을 확보해</text>
<text data-source="root.0.1.0.1" x="510.000" y="510.550" font-size="16" font-weight="400" fill="#111827">InsufficientInstanceCapacity를 피함</text>
<text data-source="root.0.1.2.0.0" x="1044.000" y="211.200" font-size="18" font-weight="700" fill="#111827">요금 할인 층: 용량 예약 없음</text>
<text data-source="root.0.1.2.0.1.0" x="1056.000" y="259.500" font-size="18" font-weight="700" fill="#111827">Compute Savings</text>
<text data-source="root.0.1.2.0.1.0" x="1056.000" y="282.900" font-size="18" font-weight="700" fill="#111827">Plans</text>
<text data-source="root.0.1.2.0.1.0" x="1056.000" y="316.300" font-size="16" font-weight="400" fill="#111827">최대 66%, family, size,</text>
<text data-source="root.0.1.2.0.1.0" x="1056.000" y="337.900" font-size="16" font-weight="400" fill="#111827">Region, OS, tenancy 무관,</text>
<text data-source="root.0.1.2.0.1.0" x="1056.000" y="359.500" font-size="16" font-weight="400" fill="#111827">Fargate와 Lambda 포함</text>
<text data-source="root.0.1.2.0.1.1" x="1316.000" y="259.500" font-size="18" font-weight="700" fill="#111827">EC2 Instance Savings</text>
<text data-source="root.0.1.2.0.1.1" x="1316.000" y="282.900" font-size="18" font-weight="700" fill="#111827">Plans</text>
<text data-source="root.0.1.2.0.1.1" x="1316.000" y="316.300" font-size="16" font-weight="400" fill="#111827">최대 72%, Region과 instance</text>
<text data-source="root.0.1.2.0.1.1" x="1316.000" y="337.900" font-size="16" font-weight="400" fill="#111827">family 고정, Fargate와</text>
<text data-source="root.0.1.2.0.1.1" x="1316.000" y="359.500" font-size="16" font-weight="400" fill="#111827">Lambda 제외</text>
<text data-source="root.0.1.2.0.1.2" x="1576.000" y="259.500" font-size="18" font-weight="700" fill="#111827">Regional RI</text>
<text data-source="root.0.1.2.0.1.2" x="1576.000" y="292.900" font-size="16" font-weight="400" fill="#111827">AZ 유연성, 용량 예약 없음;</text>
<text data-source="root.0.1.2.0.1.2" x="1576.000" y="314.500" font-size="16" font-weight="400" fill="#111827">size 유연성은 Amazon</text>
<text data-source="root.0.1.2.0.1.2" x="1576.000" y="336.100" font-size="16" font-weight="400" fill="#111827">Linux/Unix와 default</text>
<text data-source="root.0.1.2.0.1.2" x="1576.000" y="357.700" font-size="16" font-weight="400" fill="#111827">tenancy 조건</text>
<text data-source="root.0.1.2.1.0" x="1044.000" y="431.100" font-size="18" font-weight="700" fill="#111827">용량 확보 층: 할인 없음</text>
<text data-source="root.0.1.2.1.1.0" x="1056.000" y="479.400" font-size="18" font-weight="700" fill="#111827">On-Demand Capacity Reservation</text>
<text data-source="root.0.1.2.1.1.0" x="1056.000" y="512.800" font-size="16" font-weight="400" fill="#111827">즉시형은 약정 없이 취소 가능하지만 미사용도</text>
<text data-source="root.0.1.2.1.1.0" x="1056.000" y="534.400" font-size="16" font-weight="400" fill="#111827">On-Demand 한도 소모</text>
<text data-source="root.0.1.2.1.1.1" x="1446.000" y="479.400" font-size="18" font-weight="700" fill="#111827">Capacity Blocks for ML</text>
<text data-source="root.0.1.2.1.1.1" x="1446.000" y="512.800" font-size="16" font-weight="400" fill="#111827">지정 날짜 GPU 클러스터, placement group</text>
<text data-source="root.0.1.2.1.1.1" x="1446.000" y="534.400" font-size="16" font-weight="400" fill="#111827">미지원</text>
<text data-source="root.0.1.2.2.0" x="1044.000" y="606.000" font-size="18" font-weight="700" fill="#111827">Zonal RI: 요금 할인과 지정 AZ 용량 예약</text>
<text data-source="root.0.1.2.2.1" x="1056.000" y="654.300" font-size="18" font-weight="700" fill="#111827">Zonal scope Reserved Instance</text>
<text data-source="root.0.1.2.2.1" x="1056.000" y="687.700" font-size="16" font-weight="400" fill="#111827">지정 AZ 용량 예약과 요금 할인을 동시에 제공, AZ와 size 유연성 없음</text>
<text data-source="root.0.1.2.2.2" x="1044.000" y="733.300" font-size="16" font-weight="400" fill="#111827">ODCR 위에는 Savings Plans 요금을 겹칠 수 있지만 zonal RI 할인은 ODCR에 적용되지 않습니다. Spot</text>
<text data-source="root.0.1.2.2.2" x="1044.000" y="754.900" font-size="16" font-weight="400" fill="#111827">사용분에는 Savings Plans가 적용되지 않습니다.</text>
<text data-source="root.0.1.1" x="892.000" y="437.650" font-size="16" font-weight="400" fill="#111827">요구를 층으로</text>
<text data-source="root.0.1.1" x="892.000" y="459.250" font-size="16" font-weight="400" fill="#111827">분리</text>
<text data-source="root.0.2.0" x="76.000" y="814.500" font-size="18" font-weight="700" fill="#111827">RI offering class: scope와 독립된 분류</text>
<text data-source="root.0.2.1.0" x="88.000" y="862.800" font-size="18" font-weight="700" fill="#111827">Convertible RI</text>
<text data-source="root.0.2.1.0" x="88.000" y="896.200" font-size="16" font-weight="400" fill="#111827">최대 66%, exchange 가능, Marketplace 매도 불가</text>
<text data-source="root.0.2.1.1" x="978.000" y="862.800" font-size="18" font-weight="700" fill="#111827">Standard RI</text>
<text data-source="root.0.2.1.1" x="978.000" y="896.200" font-size="16" font-weight="400" fill="#111827">최대 72%, exchange 불가, Marketplace 매도 가능</text>
<text data-source="root.0.2.2" x="76.000" y="941.800" font-size="16" font-weight="400" fill="#111827">Standard와 Convertible 모두 regional 또는 zonal scope를 선택합니다. 위의 할인 전용 층은 regional RI에 해당합니다.</text>
</svg>
