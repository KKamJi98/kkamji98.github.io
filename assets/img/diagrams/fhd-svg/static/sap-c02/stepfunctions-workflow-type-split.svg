<text data-source="root.0.0" x="64.000" y="127.900" font-size="36" font-weight="700" fill="#111827">Step Functions 실행 의미가 워크플로 타입을 가릅니다</text>
<text data-source="root.0.1.0" x="120.000" y="254.550" font-size="28" font-weight="700" fill="#111827">Workflow trigger</text>
<text data-source="root.0.1.0" x="120.000" y="296.950" font-size="22" font-weight="400" fill="#111827">request 또는 event</text>
<text data-source="root.0.1.2" x="1056.000" y="254.550" font-size="28" font-weight="700" fill="#111827">워크플로 타입 선택</text>
<text data-source="root.0.1.2" x="1056.000" y="296.950" font-size="22" font-weight="400" fill="#111827">state machine 생성 뒤에는 타입 변경 불가</text>
<text data-source="root.0.1.1" x="892.000" y="186.500" font-size="22" font-weight="400" fill="#111827">execution</text>
<text data-source="root.0.1.1" x="892.000" y="216.200" font-size="22" font-weight="400" fill="#111827">semantics</text>
<text data-source="root.0.1.1" x="892.000" y="245.900" font-size="22" font-weight="400" fill="#111827">우선</text>
<text data-source="root.0.3.0.0" x="88.000" y="528.400" font-size="28" font-weight="700" fill="#111827">Standard</text>
<text data-source="root.0.3.0.1.0" x="144.000" y="614.200" font-size="28" font-weight="700" fill="#111827">Standard 실행</text>
<text data-source="root.0.3.0.1.0" x="144.000" y="656.600" font-size="22" font-weight="400" fill="#111827">exactly-once, 최대 1년, .sync와 callback</text>
<text data-source="root.0.3.0.1.2" x="144.000" y="836.300" font-size="28" font-weight="700" fill="#111827">Long or non-idempotent task</text>
<text data-source="root.0.3.0.1.2" x="144.000" y="878.700" font-size="22" font-weight="400" fill="#111827">.sync 또는 waitForTaskToken</text>
<text data-source="root.0.3.0.1.1" x="128.000" y="728.300" font-size="22" font-weight="400" fill="#111827">긴 작업 또는 비멱등</text>
<text data-source="root.0.3.1.0" x="693.333" y="528.400" font-size="28" font-weight="700" fill="#111827">Asynchronous Express</text>
<text data-source="root.0.3.1.1.0" x="749.333" y="614.200" font-size="28" font-weight="700" fill="#111827">Asynchronous Express</text>
<text data-source="root.0.3.1.1.0" x="749.333" y="656.600" font-size="22" font-weight="400" fill="#111827">at-least-once, 최대 5분</text>
<text data-source="root.0.3.1.1.2" x="749.333" y="836.300" font-size="28" font-weight="700" fill="#111827">Idempotent task</text>
<text data-source="root.0.3.1.1.2" x="749.333" y="878.700" font-size="22" font-weight="400" fill="#111827">high-rate event processing</text>
<text data-source="root.0.3.1.1.1" x="733.333" y="728.300" font-size="22" font-weight="400" fill="#111827">멱등 처리</text>
<text data-source="root.0.3.2.0" x="1298.667" y="528.400" font-size="28" font-weight="700" fill="#111827">Synchronous Express</text>
<text data-source="root.0.3.2.1.0" x="1354.667" y="614.200" font-size="28" font-weight="700" fill="#111827">Synchronous Express</text>
<text data-source="root.0.3.2.1.0" x="1354.667" y="656.600" font-size="22" font-weight="400" fill="#111827">at-most-once, 최대 5분</text>
<text data-source="root.0.3.2.1.2" x="1354.667" y="836.300" font-size="28" font-weight="700" fill="#111827">Short request task</text>
<text data-source="root.0.3.2.1.2" x="1354.667" y="878.700" font-size="22" font-weight="400" fill="#111827">synchronous response</text>
<text data-source="root.0.3.2.1.1" x="1338.667" y="728.300" font-size="22" font-weight="400" fill="#111827">짧은 동기 응답</text>
<text data-source="root.0.4" x="64.000" y="980.400" font-size="22" font-weight="400" fill="#111827">결제처럼 중복이 허용되지 않으면 Standard를 선택합니다. Express는 .sync와 waitForTaskToken 통합을 지원하지 않습니다.</text>
<text data-source="root.0.2" x="980.000" y="428.700" font-size="22" font-weight="400" fill="#111827">세 실행 경로</text>
</svg>
