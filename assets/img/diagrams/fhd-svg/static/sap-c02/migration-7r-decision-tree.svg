<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 900.000 258.400 L 1020.000 258.400" fill="none" stroke="#475569" stroke-width="3"><title>1. 아직 사용 중인가</title></path>
<polygon data-arrowhead="root.0.1.1" points="1020.000,258.400 1010.000,264.400 1010.000,252.400" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 1836.000 258.400 L 1848.000 258.400 L 1848.000 415.350 L 72.000 415.350 L 72.000 560.150 L 84.000 560.150" fill="none" stroke="#475569" stroke-width="3"><title>retire가 아니면</title></path>
