<polygon data-arrowhead="root.0.1.7" points="84.000,874.050 74.000,880.050 74.000,868.050" fill="#475569"/>
<path data-edge="root.0.1.9" data-from="root.0.1.8" data-to="root.0.1.10" d="M 900.000 874.050 L 1020.000 874.050" fill="none" stroke="#475569" stroke-width="3"><title>서버 단위 이동</title></path>
<polygon data-arrowhead="root.0.1.9" points="1020.000,874.050 1010.000,880.050 1010.000,868.050" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="120.850" font-size="36" font-weight="700" fill="#111827">7R 결정은 다섯 질문의 순서로 좁힌다</text>
<text data-source="root.0.1.0" x="112.000" y="247.250" font-size="20" font-weight="700" fill="#111827">포트폴리오 평가 완료</text>
<text data-source="root.0.1.0" x="112.000" y="283.250" font-size="18" font-weight="400" fill="#111827">사용률, 의존성, 라이선스, 소유자를 수집한 뒤 평가를 시작한다.</text>
<text data-source="root.0.1.2.0" x="1048.000" y="185.450" font-size="20" font-weight="700" fill="#111827">1. 아직 쓰이고 있는가</text>
<text data-source="root.0.1.2.1.0" x="1064.000" y="244.450" font-size="20" font-weight="700" fill="#111827">retire</text>
<text data-source="root.0.1.2.1.0" x="1064.000" y="280.450" font-size="18" font-weight="400" fill="#111827">평균 CPU와 메모리 5% 미만 zombie,</text>
<text data-source="root.0.1.2.1.0" x="1064.000" y="304.750" font-size="18" font-weight="400" fill="#111827">5-20% idle 또는 최근 90일 inbound</text>
<text data-source="root.0.1.2.1.0" x="1064.000" y="329.050" font-size="18" font-weight="400" fill="#111827">connection 없음.</text>
<text data-source="root.0.1.2.1.1" x="1452.000" y="244.450" font-size="20" font-weight="700" fill="#111827">계속 평가</text>
<text data-source="root.0.1.2.1.1" x="1452.000" y="280.450" font-size="18" font-weight="400" fill="#111827">사용 중이면 클라우드 등가물 질문으로</text>
<text data-source="root.0.1.2.1.1" x="1452.000" y="304.750" font-size="18" font-weight="400" fill="#111827">간다.</text>
<text data-source="root.0.1.4.0" x="112.000" y="499.350" font-size="20" font-weight="700" fill="#111827">클라우드 등가물</text>
<text data-source="root.0.1.4.1.0" x="128.000" y="558.350" font-size="20" font-weight="700" fill="#111827">retain</text>
<text data-source="root.0.1.4.1.0" x="128.000" y="594.350" font-size="18" font-weight="400" fill="#111827">mainframe, IBM AS/400, Oracle Solaris</text>
<text data-source="root.0.1.4.1.0" x="128.000" y="618.650" font-size="18" font-weight="400" fill="#111827">또는 데이터 residency 규제.</text>
<text data-source="root.0.1.4.1.1" x="516.000" y="558.350" font-size="20" font-weight="700" fill="#111827">계속 평가</text>
<text data-source="root.0.1.4.1.1" x="516.000" y="594.350" font-size="18" font-weight="400" fill="#111827">등가물이 있으면 상용 대체 가능성을</text>
<text data-source="root.0.1.4.1.1" x="516.000" y="618.650" font-size="18" font-weight="400" fill="#111827">확인한다.</text>
<text data-source="root.0.1.6.0" x="1048.000" y="499.350" font-size="20" font-weight="700" fill="#111827">상용 제품으로 대체 가능한가</text>
<text data-source="root.0.1.6.1.0" x="1064.000" y="558.350" font-size="20" font-weight="700" fill="#111827">repurchase</text>
<text data-source="root.0.1.6.1.0" x="1064.000" y="594.350" font-size="18" font-weight="400" fill="#111827">라이선스에서 SaaS로 바꾸며 교육,</text>
<text data-source="root.0.1.6.1.0" x="1064.000" y="618.650" font-size="18" font-weight="400" fill="#111827">데이터 이전, AD 통합, 네트워킹은 남는다.</text>
<text data-source="root.0.1.6.1.1" x="1452.000" y="558.350" font-size="20" font-weight="700" fill="#111827">계속 평가</text>
<text data-source="root.0.1.6.1.1" x="1452.000" y="594.350" font-size="18" font-weight="400" fill="#111827">대체하지 않으면 이동 단위를 확인한다.</text>
<text data-source="root.0.1.8.0" x="112.000" y="813.250" font-size="20" font-weight="700" fill="#111827">이동 단위가 서버인가 플랫폼인가</text>
<text data-source="root.0.1.8.1.0" x="128.000" y="872.250" font-size="20" font-weight="700" fill="#111827">relocate</text>
<text data-source="root.0.1.8.1.0" x="128.000" y="908.250" font-size="18" font-weight="400" fill="#111827">플랫폼 전체 또는 다른 VPC, Region,</text>
<text data-source="root.0.1.8.1.0" x="128.000" y="932.550" font-size="18" font-weight="400" fill="#111827">계정으로 이동한다. 아키텍처는 그대로다.</text>
<text data-source="root.0.1.8.1.1" x="516.000" y="872.250" font-size="20" font-weight="700" fill="#111827">계속 평가</text>
<text data-source="root.0.1.8.1.1" x="516.000" y="908.250" font-size="18" font-weight="400" fill="#111827">서버 단위라면 변경 범위를 확인한다.</text>
<text data-source="root.0.1.10.0" x="1048.000" y="788.950" font-size="20" font-weight="700" fill="#111827">옮기면서 무엇을 바꾸는가</text>
<text data-source="root.0.1.10.1.0" x="1064.000" y="847.950" font-size="20" font-weight="700" fill="#111827">rehost</text>
<text data-source="root.0.1.10.1.0" x="1064.000" y="883.950" font-size="18" font-weight="400" fill="#111827">아무것도 바꾸지 않는다.</text>
<text data-source="root.0.1.10.1.0" x="1064.000" y="908.250" font-size="18" font-weight="400" fill="#111827">MGN, Cloud Migration</text>
<text data-source="root.0.1.10.1.0" x="1064.000" y="932.550" font-size="18" font-weight="400" fill="#111827">Factory, VM</text>
<text data-source="root.0.1.10.1.0" x="1064.000" y="956.850" font-size="18" font-weight="400" fill="#111827">Import/Export.</text>
<text data-source="root.0.1.10.1.1" x="1322.667" y="847.950" font-size="20" font-weight="700" fill="#111827">replatform</text>
<text data-source="root.0.1.10.1.1" x="1322.667" y="883.950" font-size="18" font-weight="400" fill="#111827">플랫폼만 바꾼다. SQL</text>
<text data-source="root.0.1.10.1.1" x="1322.667" y="908.250" font-size="18" font-weight="400" fill="#111827">Server를 RDS로,</text>
<text data-source="root.0.1.10.1.1" x="1322.667" y="932.550" font-size="18" font-weight="400" fill="#111827">Graviton 전환,</text>
<text data-source="root.0.1.10.1.1" x="1322.667" y="956.850" font-size="18" font-weight="400" fill="#111827">App2Container.</text>
<text data-source="root.0.1.10.1.2" x="1581.333" y="847.950" font-size="20" font-weight="700" fill="#111827">refactor</text>
<text data-source="root.0.1.10.1.2" x="1581.333" y="883.950" font-size="18" font-weight="400" fill="#111827">코드를 다시 쓴다. 대규모</text>
<text data-source="root.0.1.10.1.2" x="1581.333" y="908.250" font-size="18" font-weight="400" fill="#111827">마이그레이션에서는</text>
<text data-source="root.0.1.10.1.2" x="1581.333" y="932.550" font-size="18" font-weight="400" fill="#111827">권장되지 않는다.</text>
<text data-source="root.0.1.1" x="892.000" y="215.800" font-size="18" font-weight="400" fill="#111827">1. 아직 사용</text>
<text data-source="root.0.1.1" x="892.000" y="240.100" font-size="18" font-weight="400" fill="#111827">중인가</text>
<text data-source="root.0.1.3" x="104.000" y="407.350" font-size="18" font-weight="400" fill="#111827">retire가 아니면</text>
<text data-source="root.0.1.5" x="892.000" y="541.850" font-size="18" font-weight="400" fill="#111827">retain이 아니면</text>
<text data-source="root.0.1.7" x="104.000" y="696.950" font-size="18" font-weight="400" fill="#111827">repurchase가 아니면</text>
<text data-source="root.0.1.9" x="892.000" y="855.750" font-size="18" font-weight="400" fill="#111827">서버 단위 이동</text>
</svg>
