<polygon data-arrowhead="root.0.1.1.2" points="1414.000,548.150 1408.000,538.150 1420.000,538.150" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="201.950" font-size="36" font-weight="700" fill="#111827">permission set은 대상 계정의 IAM role로 구체화된다</text>
<text data-source="root.0.1.0.0" x="88.000" y="290.550" font-size="28" font-weight="700" fill="#111827">사전 setup / provisioning</text>
<text data-source="root.0.1.0.1" x="112.000" y="376.350" font-size="28" font-weight="700" fill="#111827">외부 IdP: SCIM</text>
<text data-source="root.0.1.0.1" x="112.000" y="418.750" font-size="22" font-weight="400" fill="#111827">사용자와 그룹을 Identity Center에 미리 provisioning</text>
<text data-source="root.0.1.0.2" x="112.000" y="526.450" font-size="28" font-weight="700" fill="#111827">Permission set</text>
<text data-source="root.0.1.0.2" x="112.000" y="568.850" font-size="22" font-weight="400" fill="#111827">정책 묶음과 사용자/그룹, 대상 AWS 계정 할당</text>
<text data-source="root.0.1.1.0" x="996.000" y="290.550" font-size="28" font-weight="700" fill="#111827">매 로그인 runtime</text>
<text data-source="root.0.1.1.1" x="1020.000" y="376.350" font-size="28" font-weight="700" fill="#111827">구성원</text>
<text data-source="root.0.1.1.1" x="1020.000" y="418.750" font-size="22" font-weight="400" fill="#111827">AWS access portal 로그인</text>
<text data-source="root.0.1.1.3" x="1020.000" y="612.150" font-size="28" font-weight="700" fill="#111827">IAM Identity Center</text>
<text data-source="root.0.1.1.3" x="1020.000" y="654.550" font-size="22" font-weight="400" fill="#111827">인증 신원을 사전 provisioning된 identity와 매칭</text>
<text data-source="root.0.1.1.2" x="1434.000" y="512.450" font-size="22" font-weight="400" fill="#111827">외부 IdP의 SAML 2.0 인증</text>
<text data-source="root.0.2" x="64.000" y="756.250" font-size="22" font-weight="400" fill="#111827">Setup은 아래 계정 role을 provisioning합니다. 로그인은 할당된 기존 role을 선택해 세션을 얻으며 role을 매번 생성하지 않습니다.</text>
<text data-source="root.0.3.0" x="88.000" y="839.950" font-size="28" font-weight="700" fill="#111827">Prod 계정의 IAM role</text>
<text data-source="root.0.3.0" x="88.000" y="882.350" font-size="22" font-weight="400" fill="#111827">permission set이 provisioning한 role; 허용된 사용자의 role session 대상</text>
<text data-source="root.0.3.1" x="996.000" y="839.950" font-size="28" font-weight="700" fill="#111827">Dev 계정의 IAM role</text>
<text data-source="root.0.3.1" x="996.000" y="882.350" font-size="22" font-weight="400" fill="#111827">같은 permission set의 별도 account role</text>
</svg>
