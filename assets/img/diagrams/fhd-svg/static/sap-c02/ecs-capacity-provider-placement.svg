<rect data-node="root.0.2.2.1.1.5.0" x="1446.000" y="755.450" width="177.000" height="81.000" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.2.2.1.1.5.1" x="1635.000" y="755.450" width="177.000" height="102.600" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<path data-edge="root.0.2.2.1.1.1" data-from="root.0.2.2.1.1.0" data-to="root.0.2.2.1.1.2" d="M 1629.000 390.250 L 1629.000 446.250" fill="none" stroke="#475569" stroke-width="3"><title>먼저</title></path>
<polygon data-arrowhead="root.0.2.2.1.1.1" points="1629.000,446.250 1623.000,436.250 1635.000,436.250" fill="#475569"/>
