<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="3eeea05d12eb264e78c66a7cf7a966d47c1384b65af13680141f1d5200aeaef5">
