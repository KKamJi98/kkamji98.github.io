<text data-source="root.0.0" x="64.000" y="194.200" font-size="36" font-weight="700" fill="#111827">Private subnet 트래픽의 경로별 과금</text>
<text data-source="root.0.1.0" x="108.000" y="559.800" font-size="18" font-weight="700" fill="#111827">Private subnet의 EC2와 ECS</text>
<text data-source="root.0.1.0" x="108.000" y="593.200" font-size="16" font-weight="400" fill="#111827">같은 AZ의 private IP 통신은 전송 과금 없음</text>
<text data-source="root.0.1.2.0.0" x="1044.000" y="248.800" font-size="18" font-weight="700" fill="#111827">인터넷 egress</text>
<text data-source="root.0.1.2.0.1.0" x="1056.000" y="297.100" font-size="18" font-weight="700" fill="#111827">NAT Gateway</text>
<text data-source="root.0.1.2.0.1.0" x="1056.000" y="330.500" font-size="16" font-weight="400" fill="#111827">시간당 요금과 처리 GB 요금</text>
<text data-source="root.0.1.2.0.1.2" x="1056.000" y="458.100" font-size="18" font-weight="700" fill="#111827">인터넷</text>
<text data-source="root.0.1.2.0.1.2" x="1056.000" y="491.500" font-size="16" font-weight="400" fill="#111827">월 100 GB까지 무료, China와</text>
<text data-source="root.0.1.2.0.1.2" x="1056.000" y="513.100" font-size="16" font-weight="400" fill="#111827">GovCloud 제외</text>
<text data-source="root.0.1.2.1.0" x="1312.000" y="248.800" font-size="18" font-weight="700" fill="#111827">Gateway endpoint</text>
<text data-source="root.0.1.2.1.1.0" x="1324.000" y="297.100" font-size="18" font-weight="700" fill="#111827">Gateway endpoint</text>
<text data-source="root.0.1.2.1.1.0" x="1324.000" y="330.500" font-size="16" font-weight="400" fill="#111827">추가 요금 없음, route table</text>
<text data-source="root.0.1.2.1.1.0" x="1324.000" y="352.100" font-size="16" font-weight="400" fill="#111827">prefix list로 라우팅</text>
<text data-source="root.0.1.2.1.1.2" x="1324.000" y="479.700" font-size="18" font-weight="700" fill="#111827">같은 리전 S3와 DynamoDB</text>
<text data-source="root.0.1.2.1.1.2" x="1324.000" y="513.100" font-size="16" font-weight="400" fill="#111827">gateway endpoint가 지원하는</text>
<text data-source="root.0.1.2.1.1.2" x="1324.000" y="534.700" font-size="16" font-weight="400" fill="#111827">두 서비스</text>
<text data-source="root.0.1.2.2.0" x="1580.000" y="248.800" font-size="18" font-weight="700" fill="#111827">Interface endpoint</text>
<text data-source="root.0.1.2.2.1.0" x="1592.000" y="297.100" font-size="18" font-weight="700" fill="#111827">Interface endpoint</text>
<text data-source="root.0.1.2.2.1.0" x="1592.000" y="330.500" font-size="16" font-weight="400" fill="#111827">AZ별 provisioned 시간 요금과</text>
<text data-source="root.0.1.2.2.1.0" x="1592.000" y="352.100" font-size="16" font-weight="400" fill="#111827">처리 GB 요금</text>
<text data-source="root.0.1.2.2.1.2" x="1592.000" y="479.700" font-size="18" font-weight="700" fill="#111827">그 밖의 AWS 서비스</text>
<text data-source="root.0.1.2.2.1.2" x="1592.000" y="513.100" font-size="16" font-weight="400" fill="#111827">ECR, Secrets Manager, KMS</text>
<text data-source="root.0.1.2.2.1.2" x="1592.000" y="534.700" font-size="16" font-weight="400" fill="#111827">등</text>
<text data-source="root.0.1.2.3.0" x="1044.000" y="606.300" font-size="18" font-weight="700" fill="#111827">경계 통과</text>
<text data-source="root.0.1.2.3.1.0" x="1056.000" y="654.600" font-size="18" font-weight="700" fill="#111827">다른 AZ 또는 다른 리전</text>
<text data-source="root.0.1.2.3.1.0" x="1056.000" y="688.000" font-size="16" font-weight="400" fill="#111827">AZ와 리전 경계를 넘는 전송</text>
<text data-source="root.0.1.2.3.1.2" x="1056.000" y="815.600" font-size="18" font-weight="700" fill="#111827">교차 AZ와 리전 간 전송 요금</text>
<text data-source="root.0.1.2.3.1.2" x="1056.000" y="849.000" font-size="16" font-weight="400" fill="#111827">같은 리전 VPC peering이 AZ를</text>
<text data-source="root.0.1.2.3.1.2" x="1056.000" y="870.600" font-size="16" font-weight="400" fill="#111827">넘으면 양방향 $0.01/GB</text>
<text data-source="root.0.1.2.4.0" x="1312.000" y="606.300" font-size="18" font-weight="700" fill="#111827">CloudFront 전송</text>
<text data-source="root.0.1.2.4.1.0" x="1324.000" y="654.600" font-size="18" font-weight="700" fill="#111827">CloudFront</text>
<text data-source="root.0.1.2.4.1.0" x="1324.000" y="688.000" font-size="16" font-weight="400" fill="#111827">AWS origin에서 CloudFront로</text>
<text data-source="root.0.1.2.4.1.0" x="1324.000" y="709.600" font-size="16" font-weight="400" fill="#111827">가는 전송은 면제</text>
<text data-source="root.0.1.2.4.1.2" x="1324.000" y="837.200" font-size="18" font-weight="700" fill="#111827">Viewer</text>
<text data-source="root.0.1.2.4.1.2" x="1324.000" y="870.600" font-size="16" font-weight="400" fill="#111827">CloudFront에서 viewer로</text>
<text data-source="root.0.1.2.4.1.2" x="1324.000" y="892.200" font-size="16" font-weight="400" fill="#111827">나가는 전송은 과금</text>
<text data-source="root.0.1.1" x="892.000" y="552.700" font-size="16" font-weight="400" fill="#111827">다섯 경로 중 선택</text>
<text data-source="root.0.1.2.0.1.1.meaning" x="1180.000" y="392.650" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.2.1.1.1.meaning" x="1448.000" y="414.250" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.2.2.1.1.meaning" x="1716.000" y="414.250" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.2.3.1.1.meaning" x="1180.000" y="750.150" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.2.4.1.1.meaning" x="1448.000" y="771.750" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
