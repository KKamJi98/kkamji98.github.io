<text data-source="root.0.0" x="64.000" y="136.000" font-size="36" font-weight="700" fill="#111827">Private subnet 트래픽의 경로별 과금</text>
<text data-source="root.0.1.0" x="108.000" y="559.800" font-size="18" font-weight="700" fill="#111827">Private subnet의 EC2와 ECS</text>
<text data-source="root.0.1.0" x="108.000" y="593.200" font-size="16" font-weight="400" fill="#111827">같은 AZ의 private IP 통신은 전송 과금 없음</text>
<text data-source="root.0.1.2.0.0" x="1068.000" y="214.600" font-size="18" font-weight="700" fill="#111827">인터넷 egress</text>
<text data-source="root.0.1.2.0.1.0" x="1080.000" y="262.900" font-size="18" font-weight="700" fill="#111827">NAT Gateway</text>
<text data-source="root.0.1.2.0.1.0" x="1080.000" y="296.300" font-size="16" font-weight="400" fill="#111827">시간당 요금과 처리</text>
<text data-source="root.0.1.2.0.1.0" x="1080.000" y="317.900" font-size="16" font-weight="400" fill="#111827">GB 요금</text>
<text data-source="root.0.1.2.0.1.2" x="1080.000" y="445.500" font-size="18" font-weight="700" fill="#111827">인터넷</text>
<text data-source="root.0.1.2.0.1.2" x="1080.000" y="478.900" font-size="16" font-weight="400" fill="#111827">월 100 GB까지 무료,</text>
<text data-source="root.0.1.2.0.1.2" x="1080.000" y="500.500" font-size="16" font-weight="400" fill="#111827">China와 GovCloud 제외</text>
<text data-source="root.0.1.2.1.0" x="1320.000" y="214.600" font-size="18" font-weight="700" fill="#111827">Gateway endpoint</text>
<text data-source="root.0.1.2.1.1.0" x="1332.000" y="262.900" font-size="18" font-weight="700" fill="#111827">Gateway endpoint</text>
<text data-source="root.0.1.2.1.1.0" x="1332.000" y="296.300" font-size="16" font-weight="400" fill="#111827">추가 요금 없음, route</text>
<text data-source="root.0.1.2.1.1.0" x="1332.000" y="317.900" font-size="16" font-weight="400" fill="#111827">table prefix list로 라우팅</text>
<text data-source="root.0.1.2.1.1.2" x="1332.000" y="445.500" font-size="18" font-weight="700" fill="#111827">같은 리전 S3와</text>
<text data-source="root.0.1.2.1.1.2" x="1332.000" y="468.900" font-size="18" font-weight="700" fill="#111827">DynamoDB</text>
<text data-source="root.0.1.2.1.1.2" x="1332.000" y="502.300" font-size="16" font-weight="400" fill="#111827">gateway endpoint가</text>
<text data-source="root.0.1.2.1.1.2" x="1332.000" y="523.900" font-size="16" font-weight="400" fill="#111827">지원하는 두 서비스</text>
<text data-source="root.0.1.2.2.0" x="1572.000" y="214.600" font-size="18" font-weight="700" fill="#111827">Interface endpoint</text>
<text data-source="root.0.1.2.2.1.0" x="1584.000" y="262.900" font-size="18" font-weight="700" fill="#111827">Interface endpoint</text>
<text data-source="root.0.1.2.2.1.0" x="1584.000" y="296.300" font-size="16" font-weight="400" fill="#111827">AZ별 provisioned 시간</text>
<text data-source="root.0.1.2.2.1.0" x="1584.000" y="317.900" font-size="16" font-weight="400" fill="#111827">요금과 처리 GB 요금</text>
<text data-source="root.0.1.2.2.1.2" x="1584.000" y="445.500" font-size="18" font-weight="700" fill="#111827">그 밖의 AWS 서비스</text>
<text data-source="root.0.1.2.2.1.2" x="1584.000" y="478.900" font-size="16" font-weight="400" fill="#111827">ECR, Secrets Manager,</text>
<text data-source="root.0.1.2.2.1.2" x="1584.000" y="500.500" font-size="16" font-weight="400" fill="#111827">KMS 등</text>
<text data-source="root.0.1.2.3.0" x="1068.000" y="595.500" font-size="18" font-weight="700" fill="#111827">경계 통과</text>
<text data-source="root.0.1.2.3.1.0" x="1080.000" y="643.800" font-size="18" font-weight="700" fill="#111827">다른 AZ 또는 다른 리전</text>
<text data-source="root.0.1.2.3.1.0" x="1080.000" y="677.200" font-size="16" font-weight="400" fill="#111827">AZ와 리전 경계를 넘는</text>
<text data-source="root.0.1.2.3.1.0" x="1080.000" y="698.800" font-size="16" font-weight="400" fill="#111827">전송</text>
<text data-source="root.0.1.2.3.1.2" x="1080.000" y="826.400" font-size="18" font-weight="700" fill="#111827">교차 AZ와 리전 간</text>
<text data-source="root.0.1.2.3.1.2" x="1080.000" y="849.800" font-size="18" font-weight="700" fill="#111827">전송 요금</text>
<text data-source="root.0.1.2.3.1.2" x="1080.000" y="883.200" font-size="16" font-weight="400" fill="#111827">같은 리전 VPC peering이</text>
<text data-source="root.0.1.2.3.1.2" x="1080.000" y="904.800" font-size="16" font-weight="400" fill="#111827">AZ를 넘으면</text>
<text data-source="root.0.1.2.3.1.2" x="1080.000" y="926.400" font-size="16" font-weight="400" fill="#111827">양방향 $0.01/GB</text>
<text data-source="root.0.1.2.4.0" x="1320.000" y="595.500" font-size="18" font-weight="700" fill="#111827">CloudFront 전송</text>
<text data-source="root.0.1.2.4.1.0" x="1332.000" y="643.800" font-size="18" font-weight="700" fill="#111827">CloudFront</text>
<text data-source="root.0.1.2.4.1.0" x="1332.000" y="677.200" font-size="16" font-weight="400" fill="#111827">AWS origin에서</text>
<text data-source="root.0.1.2.4.1.0" x="1332.000" y="698.800" font-size="16" font-weight="400" fill="#111827">CloudFront로 가는</text>
<text data-source="root.0.1.2.4.1.0" x="1332.000" y="720.400" font-size="16" font-weight="400" fill="#111827">전송은 면제</text>
<text data-source="root.0.1.2.4.1.2" x="1332.000" y="848.000" font-size="18" font-weight="700" fill="#111827">Viewer</text>
<text data-source="root.0.1.2.4.1.2" x="1332.000" y="881.400" font-size="16" font-weight="400" fill="#111827">CloudFront에서</text>
<text data-source="root.0.1.2.4.1.2" x="1332.000" y="903.000" font-size="16" font-weight="400" fill="#111827">viewer로 나가는</text>
<text data-source="root.0.1.2.4.1.2" x="1332.000" y="924.600" font-size="16" font-weight="400" fill="#111827">전송은 과금</text>
<text data-source="root.0.1.1" x="892.000" y="552.700" font-size="16" font-weight="400" fill="#111827">다섯 경로 중 선택</text>
