<text data-source="root.0.1.0.1.7" x="128.000" y="678.400" font-size="22" font-weight="400" fill="#111827">다음 lifecycle 전환</text>
<text data-source="root.0.1.0.1.9" x="438.000" y="756.400" font-size="22" font-weight="400" fill="#111827">Deep</text>
<text data-source="root.0.1.0.1.9" x="438.000" y="786.100" font-size="22" font-weight="400" fill="#111827">Archive</text>
<text data-source="root.0.1.0.1.9" x="438.000" y="815.800" font-size="22" font-weight="400" fill="#111827">전환만 가능</text>
<text data-source="root.0.1.1.0" x="996.000" y="190.300" font-size="28" font-weight="700" fill="#111827">상위 클래스로 복원</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="276.100" font-size="28" font-weight="700" fill="#111827">Glacier Deep</text>
