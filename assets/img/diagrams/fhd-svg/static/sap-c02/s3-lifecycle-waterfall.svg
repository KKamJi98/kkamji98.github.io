<text data-source="root.0.1.1.1.0" x="1052.000" y="354.900" font-size="22" font-weight="400" fill="#111827">lifecycle 규칙으로</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="384.600" font-size="22" font-weight="400" fill="#111827">빠져나갈 수 없음</text>
<text data-source="root.0.1.1.1.2" x="1530.000" y="276.100" font-size="28" font-weight="700" fill="#111827">복원된 객체를</text>
