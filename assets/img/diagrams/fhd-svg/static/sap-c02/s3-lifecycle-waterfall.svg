<text data-source="root.0.0" x="64.000" y="101.700" font-size="36" font-weight="700" fill="#111827">S3 lifecycle 전환은 단방향이고 복원은 별도 경로입니다</text>
<text data-source="root.0.1.0.0" x="88.000" y="190.300" font-size="28" font-weight="700" fill="#111827">lifecycle 전환 사슬</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="276.100" font-size="28" font-weight="700" fill="#111827">lifecycle 규칙</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="318.500" font-size="22" font-weight="400" fill="#111827">128 KB 미만은 size filter</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="348.200" font-size="22" font-weight="400" fill="#111827">없이는 전환되지 않음</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="290.950" font-size="28" font-weight="700" fill="#111827">S3 Standard</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="333.350" font-size="22" font-weight="400" fill="#111827">최소 저장 기간 없음</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="531.250" font-size="28" font-weight="700" fill="#111827">Standard-IA</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="573.650" font-size="22" font-weight="400" fill="#111827">최소 30일, 최소 과금</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="603.350" font-size="22" font-weight="400" fill="#111827">128 KB</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="527.900" font-size="28" font-weight="700" fill="#111827">Glacier Instant</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="564.300" font-size="28" font-weight="700" fill="#111827">Retrieval</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="606.700" font-size="22" font-weight="400" fill="#111827">최소 90일, 밀리초 액세스</text>
<text data-source="root.0.1.0.1.8" x="144.000" y="791.400" font-size="28" font-weight="700" fill="#111827">Glacier Flexible</text>
<text data-source="root.0.1.0.1.8" x="144.000" y="827.800" font-size="28" font-weight="700" fill="#111827">Retrieval</text>
<text data-source="root.0.1.0.1.8" x="144.000" y="870.200" font-size="22" font-weight="400" fill="#111827">최소 90일, archive</text>
<text data-source="root.0.1.0.1.8" x="144.000" y="899.900" font-size="22" font-weight="400" fill="#111827">read에는 restore 필요</text>
<text data-source="root.0.1.0.1.10" x="602.000" y="806.250" font-size="28" font-weight="700" fill="#111827">Glacier Deep</text>
<text data-source="root.0.1.0.1.10" x="602.000" y="842.650" font-size="28" font-weight="700" fill="#111827">Archive</text>
<text data-source="root.0.1.0.1.10" x="602.000" y="885.050" font-size="22" font-weight="400" fill="#111827">최소 180일, lifecycle 종점</text>
<text data-source="root.0.1.0.1.1" x="438.000" y="282.300" font-size="22" font-weight="400" fill="#111827">규칙 적용</text>
<text data-source="root.0.1.0.1.3" x="128.000" y="419.900" font-size="22" font-weight="400" fill="#111827">30일 조건</text>
