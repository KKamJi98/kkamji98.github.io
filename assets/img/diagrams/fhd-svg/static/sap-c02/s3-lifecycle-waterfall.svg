<text data-source="root.0.1.1.1.2" x="1530.000" y="354.900" font-size="22" font-weight="400" fill="#111827">상위 클래스로 덮어쓰는</text>
<text data-source="root.0.1.1.1.2" x="1530.000" y="384.600" font-size="22" font-weight="400" fill="#111827">별도 작업</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="564.300" font-size="28" font-weight="700" fill="#111827">S3 Standard</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="606.700" font-size="22" font-weight="400" fill="#111827">lifecycle 사슬과 별개의</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="636.400" font-size="22" font-weight="400" fill="#111827">복귀 결과</text>
<text data-source="root.0.1.1.1.1" x="1326.000" y="300.500" font-size="22" font-weight="400" fill="#111827">RestoreObject</text>
<text data-source="root.0.1.1.1.3" x="1036.000" y="456.300" font-size="22" font-weight="400" fill="#111827">대상 클래스 지정</text>
<text data-source="root.0.2" x="64.000" y="1006.600" font-size="22" font-weight="400" fill="#111827">연속 전환은 각 클래스의 최소 저장 기간을 누적해 평가합니다. Deep Archive의 복귀는 restore 후 copy로만 만들 수 있습니다.</text>
