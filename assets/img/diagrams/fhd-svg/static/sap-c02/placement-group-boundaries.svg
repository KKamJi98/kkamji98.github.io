<path data-edge="root.0.1.0.1.1" data-from="root.0.1.0.1.0" data-to="root.0.1.0.1.2" d="M 601.333 355.400 L 613.333 355.400 L 613.333 466.450 L 96.000 466.450 L 96.000 592.350 L 108.000 592.350" fill="none" stroke="#475569" stroke-width="3"><title>한 AZ에 배치</title></path>
<polygon data-arrowhead="root.0.1.0.1.1" points="108.000,592.350 98.000,598.350 98.000,586.350" fill="#475569"/>
<path data-edge="root.0.1.0.1.3" data-from="root.0.1.0.1.2" data-to="root.0.1.0.1.4" d="M 601.333 592.350 L 613.333 592.350 L 613.333 718.250 L 96.000 718.250 L 96.000 844.150 L 108.000 844.150" fill="none" stroke="#475569" stroke-width="3"><title>AZ 경계</title></path>
<polygon data-arrowhead="root.0.1.0.1.3" points="108.000,844.150 98.000,850.150 98.000,838.150" fill="#475569"/>
<path data-edge="root.0.1.1.1.1" data-from="root.0.1.1.1.0" data-to="root.0.1.1.1.2" d="M 960.000 430.450 L 960.000 516.150" fill="none" stroke="#475569" stroke-width="3"><title>여러 AZ 가능</title></path>
<polygon data-arrowhead="root.0.1.1.1.1" points="960.000,516.150 954.000,506.150 966.000,506.150" fill="#475569"/>
<path data-edge="root.0.1.2.1.1" data-from="root.0.1.2.1.0" data-to="root.0.1.2.1.2" d="M 1565.333 430.450 L 1565.333 516.150" fill="none" stroke="#475569" stroke-width="3"><title>여러 AZ 가능</title></path>
<polygon data-arrowhead="root.0.1.2.1.1" points="1565.333,516.150 1559.333,506.150 1571.333,506.150" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="169.950" font-size="36" font-weight="700" fill="#111827">배치 전략마다 넘지 못하는 경계가 다르다</text>
<text data-source="root.0.1.0.0" x="88.000" y="258.550" font-size="28" font-weight="700" fill="#111827">cluster placement group</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="344.350" font-size="28" font-weight="700" fill="#111827">저지연과 고대역</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="386.750" font-size="22" font-weight="400" fill="#111827">MPI, HPC, 대형 배치와 EFA에 맞춘다.</text>
<text data-source="root.0.1.0.1.2" x="144.000" y="566.450" font-size="28" font-weight="700" fill="#111827">Availability Zone A</text>
<text data-source="root.0.1.0.1.2" x="144.000" y="608.850" font-size="22" font-weight="400" fill="#111827">그룹 안 single-flow 최대 10 Gbps. Capacity</text>
<text data-source="root.0.1.0.1.2" x="144.000" y="638.550" font-size="22" font-weight="400" fill="#111827">Reservation을 만들 수 있다.</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="818.250" font-size="28" font-weight="700" fill="#111827">단일 AZ 경계</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="860.650" font-size="22" font-weight="400" fill="#111827">다른 AZ로는 갈 수 없다. 같은 리전 peered</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="890.350" font-size="22" font-weight="400" fill="#111827">VPC는 예외적으로 걸칠 수 있다.</text>
<text data-source="root.0.1.0.1.1" x="128.000" y="458.450" font-size="22" font-weight="400" fill="#111827">한 AZ에 배치</text>
<text data-source="root.0.1.0.1.3" x="128.000" y="710.250" font-size="22" font-weight="400" fill="#111827">AZ 경계</text>
<text data-source="root.0.1.1.0" x="693.333" y="258.550" font-size="28" font-weight="700" fill="#111827">partition placement group</text>
<text data-source="root.0.1.1.1.0" x="717.333" y="344.350" font-size="28" font-weight="700" fill="#111827">랙 단위 장애 격리</text>
<text data-source="root.0.1.1.1.0" x="717.333" y="386.750" font-size="22" font-weight="400" fill="#111827">HDFS, HBase, Cassandra, Kafka 복제본을 분리한다.</text>
<text data-source="root.0.1.1.1.2.0" x="741.333" y="604.150" font-size="28" font-weight="700" fill="#111827">AZ A</text>
<text data-source="root.0.1.1.1.2.0" x="741.333" y="646.550" font-size="22" font-weight="400" fill="#111827">partition 1,</text>
<text data-source="root.0.1.1.1.2.0" x="741.333" y="676.250" font-size="22" font-weight="400" fill="#111827">partition 2. AZ당</text>
<text data-source="root.0.1.1.1.2.0" x="741.333" y="705.950" font-size="22" font-weight="400" fill="#111827">최대 7개이며</text>
<text data-source="root.0.1.1.1.2.0" x="741.333" y="735.650" font-size="22" font-weight="400" fill="#111827">Dedicated</text>
<text data-source="root.0.1.1.1.2.0" x="741.333" y="765.350" font-size="22" font-weight="400" fill="#111827">Instances면 2개다.</text>
<text data-source="root.0.1.1.1.2.1" x="996.000" y="604.150" font-size="28" font-weight="700" fill="#111827">AZ B</text>
<text data-source="root.0.1.1.1.2.1" x="996.000" y="646.550" font-size="22" font-weight="400" fill="#111827">같은 그룹의</text>
<text data-source="root.0.1.1.1.2.1" x="996.000" y="676.250" font-size="22" font-weight="400" fill="#111827">partition 1을 둘</text>
<text data-source="root.0.1.1.1.2.1" x="996.000" y="705.950" font-size="22" font-weight="400" fill="#111827">수 있다.</text>
<text data-source="root.0.1.1.1.3" x="693.333" y="867.050" font-size="22" font-weight="400" fill="#111827">인스턴스가 메타데이터에서 파티션 번호를 읽어 복제본을</text>
<text data-source="root.0.1.1.1.3" x="693.333" y="896.750" font-size="22" font-weight="400" fill="#111827">분산한다.</text>
<text data-source="root.0.1.1.1.1" x="980.000" y="480.450" font-size="22" font-weight="400" fill="#111827">여러 AZ 가능</text>
<text data-source="root.0.1.2.0" x="1298.667" y="258.550" font-size="28" font-weight="700" fill="#111827">rack-level spread</text>
<text data-source="root.0.1.2.1.0" x="1322.667" y="344.350" font-size="28" font-weight="700" fill="#111827">인스턴스 단위 하드웨어 분리</text>
<text data-source="root.0.1.2.1.0" x="1322.667" y="386.750" font-size="22" font-weight="400" fill="#111827">소수의 핵심 인스턴스를 서로 다른 랙에 둔다.</text>
<text data-source="root.0.1.2.1.2.0" x="1346.667" y="604.150" font-size="28" font-weight="700" fill="#111827">AZ A</text>
<text data-source="root.0.1.2.1.2.0" x="1346.667" y="646.550" font-size="22" font-weight="400" fill="#111827">running 인스턴스</text>
<text data-source="root.0.1.2.1.2.0" x="1346.667" y="676.250" font-size="22" font-weight="400" fill="#111827">최대 7대.</text>
<text data-source="root.0.1.2.1.2.1" x="1601.333" y="604.150" font-size="28" font-weight="700" fill="#111827">AZ B</text>
<text data-source="root.0.1.2.1.2.1" x="1601.333" y="646.550" font-size="22" font-weight="400" fill="#111827">3개 AZ면 그룹 전체</text>
<text data-source="root.0.1.2.1.2.1" x="1601.333" y="676.250" font-size="22" font-weight="400" fill="#111827">21대까지다.</text>
<text data-source="root.0.1.2.1.3" x="1298.667" y="777.950" font-size="22" font-weight="400" fill="#111827">Dedicated Instances는 지원하지 않는다.</text>
<text data-source="root.0.1.2.1.1" x="1585.333" y="480.450" font-size="22" font-weight="400" fill="#111827">여러 AZ 가능</text>
</svg>
