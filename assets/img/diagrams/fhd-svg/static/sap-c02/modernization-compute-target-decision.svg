<text data-source="root.0.0" x="64.000" y="163.100" font-size="36" font-weight="700" fill="#111827">실행 시간과 OS 제어로 컴퓨트를 고른다</text>
<text data-source="root.0.1.0" x="88.000" y="251.700" font-size="28" font-weight="700" fill="#111827">기존 워크로드</text>
<text data-source="root.0.1.0" x="88.000" y="294.100" font-size="22" font-weight="400" fill="#111827">실행 시간, 상태 보유 여부, 런타임 요구를 먼저 기록한다.</text>
<text data-source="root.0.2.0.0" x="88.000" y="487.500" font-size="28" font-weight="700" fill="#111827">짧은 이벤트와 무상태</text>
<text data-source="root.0.2.0.1.0" x="144.000" y="573.300" font-size="28" font-weight="700" fill="#111827">15분 이내 함수</text>
<text data-source="root.0.2.0.1.0" x="144.000" y="615.700" font-size="22" font-weight="400" fill="#111827">호출당 최대 900초, 무상태로 처리한다.</text>
<text data-source="root.0.2.0.1.2" x="144.000" y="795.400" font-size="28" font-weight="700" fill="#111827">AWS Lambda</text>
<text data-source="root.0.2.0.1.2" x="144.000" y="837.800" font-size="22" font-weight="400" fill="#111827">이벤트 기반 함수. 메모리는 최대 10,240MB다.</text>
<text data-source="root.0.2.0.1.1" x="128.000" y="687.400" font-size="22" font-weight="400" fill="#111827">이벤트 실행</text>
<text data-source="root.0.2.1.0" x="693.333" y="487.500" font-size="28" font-weight="700" fill="#111827">장시간 또는 상태 보유</text>
<text data-source="root.0.2.1.1.0" x="749.333" y="573.300" font-size="28" font-weight="700" fill="#111827">컨테이너 작업</text>
<text data-source="root.0.2.1.1.0" x="749.333" y="615.700" font-size="22" font-weight="400" fill="#111827">15분을 넘길 수 있고 실행 중 메모리 상태를</text>
<text data-source="root.0.2.1.1.0" x="749.333" y="645.400" font-size="22" font-weight="400" fill="#111827">유지한다.</text>
<text data-source="root.0.2.1.1.2" x="749.333" y="825.100" font-size="28" font-weight="700" fill="#111827">AWS Fargate</text>
<text data-source="root.0.2.1.1.2" x="749.333" y="867.500" font-size="22" font-weight="400" fill="#111827">ECS 컨테이너. 실행 시간 하드 리밋이 없고</text>
<text data-source="root.0.2.1.1.2" x="749.333" y="897.200" font-size="22" font-weight="400" fill="#111827">최대 244GiB 메모리다.</text>
<text data-source="root.0.2.1.1.1" x="733.333" y="717.100" font-size="22" font-weight="400" fill="#111827">태스크 실행</text>
<text data-source="root.0.2.2.0" x="1298.667" y="487.500" font-size="28" font-weight="700" fill="#111827">OS 또는 특수 런타임</text>
<text data-source="root.0.2.2.1.0" x="1354.667" y="573.300" font-size="28" font-weight="700" fill="#111827">호스트 수준 제어</text>
<text data-source="root.0.2.2.1.0" x="1354.667" y="615.700" font-size="22" font-weight="400" fill="#111827">커널, 드라이버, 패치 레벨, 특수 파일 시스템이</text>
<text data-source="root.0.2.2.1.0" x="1354.667" y="645.400" font-size="22" font-weight="400" fill="#111827">필요하다.</text>
<text data-source="root.0.2.2.1.2" x="1354.667" y="825.100" font-size="28" font-weight="700" fill="#111827">Amazon EC2</text>
<text data-source="root.0.2.2.1.2" x="1354.667" y="867.500" font-size="22" font-weight="400" fill="#111827">운영체제와 런타임을 직접 관리하는 컴퓨트다.</text>
<text data-source="root.0.2.2.1.1" x="1338.667" y="717.100" font-size="22" font-weight="400" fill="#111827">직접 관리</text>
<text data-source="root.0.1.1" x="84.000" y="371.800" font-size="22" font-weight="400" fill="#111827">제약 판정: 15분, 메모리, OS 접근, 상시 실행</text>
</svg>
