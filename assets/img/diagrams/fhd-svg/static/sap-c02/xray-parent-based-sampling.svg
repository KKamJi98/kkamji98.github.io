<polygon data-arrowhead="root.0.1.1.7" points="1020.000,561.450 1010.000,567.450 1010.000,555.450" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="153.900" font-size="36" font-weight="700" fill="#111827">sampling 결정은 trace 진입 서비스에서 한 번만 일어납니다</text>
<text data-source="root.0.1.0" x="88.000" y="242.500" font-size="28" font-weight="700" fill="#111827">parent-based trace 경로</text>
<text data-source="root.0.1.1.0" x="144.000" y="328.300" font-size="28" font-weight="700" fill="#111827">클라이언트 요청</text>
<text data-source="root.0.1.1.0" x="144.000" y="370.700" font-size="22" font-weight="400" fill="#111827">trace가 시작되는 지점</text>
<text data-source="root.0.1.1.2" x="752.000" y="328.300" font-size="28" font-weight="700" fill="#111827">서비스 A</text>
<text data-source="root.0.1.1.2" x="752.000" y="370.700" font-size="22" font-weight="400" fill="#111827">sampled 여부를 결정하고 하위로 전파</text>
<text data-source="root.0.1.1.4" x="1360.000" y="328.300" font-size="28" font-weight="700" fill="#111827">서비스 B</text>
<text data-source="root.0.1.1.4" x="1360.000" y="370.700" font-size="22" font-weight="400" fill="#111827">부모 결정을 그대로 따름</text>
<text data-source="root.0.1.1.6" x="448.000" y="550.400" font-size="28" font-weight="700" fill="#111827">서비스 C</text>
<text data-source="root.0.1.1.6" x="448.000" y="592.800" font-size="22" font-weight="400" fill="#111827">부모 결정을 그대로 따름</text>
<text data-source="root.0.1.1.8" x="1056.000" y="550.400" font-size="28" font-weight="700" fill="#111827">수집된 trace</text>
<text data-source="root.0.1.1.8" x="1056.000" y="592.800" font-size="22" font-weight="400" fill="#111827">진입 rule이 정한 비율만큼 남음</text>
<text data-source="root.0.1.1.1" x="588.000" y="319.650" font-size="22" font-weight="400" fill="#111827">진입</text>
<text data-source="root.0.1.1.3" x="1196.000" y="319.650" font-size="22" font-weight="400" fill="#111827">부모 결정 전파</text>
<text data-source="root.0.1.1.5" x="668.000" y="442.400" font-size="22" font-weight="400" fill="#111827">부모 결정 전파</text>
<text data-source="root.0.1.1.7" x="892.000" y="541.750" font-size="22" font-weight="400" fill="#111827">수집 비율 유지</text>
<text data-source="root.0.2.0.0" x="88.000" y="724.500" font-size="28" font-weight="700" fill="#111827">A의 결정 입력</text>
<text data-source="root.0.2.0.1" x="112.000" y="810.300" font-size="28" font-weight="700" fill="#111827">진입 sampling rule</text>
<text data-source="root.0.2.0.1" x="112.000" y="852.700" font-size="22" font-weight="400" fill="#111827">reservoir 1, fixed rate 5%, priority 1에서 9999</text>
<text data-source="root.0.2.1.0" x="693.333" y="724.500" font-size="28" font-weight="700" fill="#111827">sampling API 호출</text>
<text data-source="root.0.2.1.1" x="717.333" y="810.300" font-size="28" font-weight="700" fill="#111827">CloudWatch agent proxy</text>
<text data-source="root.0.2.1.1" x="717.333" y="852.700" font-size="22" font-weight="400" fill="#111827">SDK와 ADOT가 TCP 2000으로 호출</text>
<text data-source="root.0.2.2.0" x="1298.667" y="724.500" font-size="28" font-weight="700" fill="#111827">C에만 둔 rule</text>
<text data-source="root.0.2.2.1" x="1322.667" y="810.300" font-size="28" font-weight="700" fill="#111827">fixed rate 100%</text>
<text data-source="root.0.2.2.1" x="1322.667" y="852.700" font-size="22" font-weight="400" fill="#111827">이미 내려진 parent 결정을 바꾸지 못함</text>
<text data-source="root.0.3" x="64.000" y="954.400" font-size="22" font-weight="400" fill="#111827">진입 rule과 sampling proxy는 서비스 A의 결정 입력입니다. C에만 둔 100% rule은 이미 선택된 parent 결정을 뒤집지 못하므로 비율을 바꾸려면 A의 매칭 rule을 수정해야 합니다.</text>
</svg>
