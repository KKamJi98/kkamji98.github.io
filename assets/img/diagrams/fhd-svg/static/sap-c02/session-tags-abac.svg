<path data-edge="root.0.4" data-from="root.0.3" data-to="root.0.5" d="M 960.000 743.950 L 960.000 808.250" fill="none" stroke="#475569" stroke-width="3"><title>조건 평가</title></path>
<polygon data-arrowhead="root.0.4" points="960.000,808.250 954.000,798.250 966.000,798.250" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="113.150" font-size="36" font-weight="700" fill="#111827">session tag는 aws:PrincipalTag가 되어 리소스 태그와 비교됩니다</text>
<text data-source="root.0.1.0.0" x="104.000" y="201.750" font-size="20" font-weight="700" fill="#111827">Principal 입력</text>
<text data-source="root.0.1.0.1.0" x="152.000" y="260.750" font-size="20" font-weight="700" fill="#111827">IdP 속성</text>
<text data-source="root.0.1.0.1.0" x="152.000" y="296.750" font-size="18" font-weight="400" fill="#111827">SAML attribute 또는 JWT claim</text>
<text data-source="root.0.1.0.1.2" x="608.000" y="260.750" font-size="20" font-weight="700" fill="#111827">session tag</text>
<text data-source="root.0.1.0.1.2" x="608.000" y="296.750" font-size="18" font-weight="400" fill="#111827">최대 50개, key 128자, value 256자</text>
<text data-source="root.0.1.0.1.4" x="152.000" y="451.050" font-size="20" font-weight="700" fill="#111827">aws:PrincipalTag</text>
<text data-source="root.0.1.0.1.4" x="152.000" y="487.050" font-size="18" font-weight="400" fill="#111827">session tag에서 전달</text>
<text data-source="root.0.1.0.1.1" x="452.000" y="253.600" font-size="18" font-weight="400" fill="#111827">sts:TagSession</text>
<text data-source="root.0.1.0.1.3" x="144.000" y="359.050" font-size="18" font-weight="400" fill="#111827">request context</text>
<text data-source="root.0.1.1.0" x="984.000" y="201.750" font-size="20" font-weight="700" fill="#111827">독립된 Resource 입력</text>
<text data-source="root.0.1.1.1" x="1000.000" y="260.750" font-size="20" font-weight="700" fill="#111827">aws:ResourceTag</text>
<text data-source="root.0.1.1.1" x="1000.000" y="296.750" font-size="18" font-weight="400" fill="#111827">접근 대상 리소스에 별도로 설정된 태그</text>
<text data-source="root.0.3" x="80.000" y="673.650" font-size="20" font-weight="700" fill="#111827">정책 Condition</text>
<text data-source="root.0.3" x="80.000" y="709.650" font-size="18" font-weight="400" fill="#111827">aws:PrincipalTag와 aws:ResourceTag 비교</text>
<text data-source="root.0.5.0" x="104.000" y="880.250" font-size="20" font-weight="700" fill="#111827">일치</text>
<text data-source="root.0.5.0" x="104.000" y="916.250" font-size="18" font-weight="400" fill="#111827">이 Allow 조건 충족. 다른 정책의 Deny와 권한 경계도 적용</text>
<text data-source="root.0.5.1" x="984.000" y="880.250" font-size="20" font-weight="700" fill="#111827">불일치</text>
<text data-source="root.0.5.1" x="984.000" y="916.250" font-size="18" font-weight="400" fill="#111827">이 조건으로 Allow되지 않음</text>
<text data-source="root.0.6" x="64.000" y="996.550" font-size="18" font-weight="400" fill="#111827">trust policy에 sts:TagSession이 없으면 태그 누락이 아니라 AssumeRole 호출 자체가 실패합니다.</text>
<text data-source="root.0.2" x="980.000" y="599.350" font-size="18" font-weight="400" fill="#111827">두 독립 입력을 비교</text>
<text data-source="root.0.4" x="980.000" y="781.950" font-size="18" font-weight="400" fill="#111827">조건 평가</text>
</svg>
