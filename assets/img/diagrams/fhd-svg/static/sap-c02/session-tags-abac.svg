<path data-edge="root.0.1.0.1.1" data-from="root.0.1.0.1.0" data-to="root.0.1.0.1.2" d="M 460.000 271.900 L 580.000 271.900" fill="none" stroke="#475569" stroke-width="3"><title>sts:TagSession</title></path>
