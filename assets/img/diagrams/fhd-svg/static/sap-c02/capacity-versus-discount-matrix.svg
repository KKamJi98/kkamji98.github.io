<text data-source="root.0.0" x="64.000" y="251.800" font-size="36" font-weight="700" fill="#111827">용량 보장과 요금 할인 선택표</text>
<text data-source="root.0.1.0" x="112.000" y="416.350" font-size="20" font-weight="700" fill="#111827">워크로드 요구</text>
<text data-source="root.0.1.0" x="112.000" y="452.350" font-size="18" font-weight="400" fill="#111827">용량 보장과 장기 할인 중 필요한 축을 먼저 분리</text>
<text data-source="root.0.1.2.0.0" x="1048.000" y="316.400" font-size="20" font-weight="700" fill="#111827">지정 AZ 용량 보장</text>
<text data-source="root.0.1.2.0.1.0" x="1064.000" y="375.400" font-size="20" font-weight="700" fill="#111827">On-Demand</text>
<text data-source="root.0.1.2.0.1.0" x="1064.000" y="401.400" font-size="20" font-weight="700" fill="#111827">Capacity</text>
<text data-source="root.0.1.2.0.1.0" x="1064.000" y="427.400" font-size="20" font-weight="700" fill="#111827">Reservation</text>
<text data-source="root.0.1.2.0.1.0" x="1064.000" y="463.400" font-size="18" font-weight="400" fill="#111827">할인 없이 즉시</text>
<text data-source="root.0.1.2.0.1.0" x="1064.000" y="487.700" font-size="18" font-weight="400" fill="#111827">용량 확보,</text>
<text data-source="root.0.1.2.0.1.0" x="1064.000" y="512.000" font-size="18" font-weight="400" fill="#111827">미사용도 과금</text>
<text data-source="root.0.1.2.1.0" x="1452.000" y="316.400" font-size="20" font-weight="700" fill="#111827">장기 요금 할인</text>
<text data-source="root.0.1.2.1.1.0" x="1468.000" y="375.400" font-size="20" font-weight="700" fill="#111827">Savings Plans</text>
<text data-source="root.0.1.2.1.1.0" x="1468.000" y="411.400" font-size="18" font-weight="400" fill="#111827">시간당 금액 약정,</text>
<text data-source="root.0.1.2.1.1.0" x="1468.000" y="435.700" font-size="18" font-weight="400" fill="#111827">취소와 교환 불가,</text>
<text data-source="root.0.1.2.1.1.0" x="1468.000" y="460.000" font-size="18" font-weight="400" fill="#111827">용량 보장 없음</text>
<text data-source="root.0.1.2.1.1.1" x="1654.000" y="375.400" font-size="20" font-weight="700" fill="#111827">Regional</text>
<text data-source="root.0.1.2.1.1.1" x="1654.000" y="401.400" font-size="20" font-weight="700" fill="#111827">Reserved</text>
<text data-source="root.0.1.2.1.1.1" x="1654.000" y="427.400" font-size="20" font-weight="700" fill="#111827">Instance</text>
<text data-source="root.0.1.2.1.1.1" x="1654.000" y="463.400" font-size="18" font-weight="400" fill="#111827">AZ 유연성과</text>
<text data-source="root.0.1.2.1.1.1" x="1654.000" y="487.700" font-size="18" font-weight="400" fill="#111827">purchase</text>
<text data-source="root.0.1.2.1.1.1" x="1654.000" y="512.000" font-size="18" font-weight="400" fill="#111827">queuing, 용량</text>
<text data-source="root.0.1.2.1.1.1" x="1654.000" y="536.300" font-size="18" font-weight="400" fill="#111827">예약 없음</text>
<text data-source="root.0.1.4.0.0" x="112.000" y="706.600" font-size="20" font-weight="700" fill="#111827">단일 선택</text>
<text data-source="root.0.1.4.0.1" x="128.000" y="765.600" font-size="20" font-weight="700" fill="#111827">Zonal Reserved Instance</text>
<text data-source="root.0.1.4.0.1" x="128.000" y="801.600" font-size="18" font-weight="400" fill="#111827">지정 AZ 용량과 할인, AZ와 size 고정,</text>
<text data-source="root.0.1.4.0.1" x="128.000" y="825.900" font-size="18" font-weight="400" fill="#111827">purchase queuing 없음</text>
<text data-source="root.0.1.4.1.0" x="516.000" y="706.600" font-size="20" font-weight="700" fill="#111827">조합 선택</text>
<text data-source="root.0.1.4.1.1" x="532.000" y="765.600" font-size="20" font-weight="700" fill="#111827">ODCR 위에 커밋을 겹친다</text>
<text data-source="root.0.1.4.1.1" x="532.000" y="801.600" font-size="18" font-weight="400" fill="#111827">Capacity Reservation이 용량을, Savings</text>
<text data-source="root.0.1.4.1.1" x="532.000" y="825.900" font-size="18" font-weight="400" fill="#111827">Plans 또는 Regional RI가 할인을 맡음</text>
<text data-source="root.0.1.3" x="104.000" y="614.600" font-size="18" font-weight="400" fill="#111827">두 축이 모두 필요하면 아래 중 하나</text>
<text data-source="root.0.1.1.meaning" x="904.000" y="410.600" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
</svg>
