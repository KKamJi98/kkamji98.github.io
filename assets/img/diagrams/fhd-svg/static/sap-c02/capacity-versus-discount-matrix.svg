<text data-source="root.0.0" x="64.000" y="191.650" font-size="36" font-weight="700" fill="#111827">용량 보장과 요금 할인 선택표</text>
<text data-source="root.0.1.0" x="112.000" y="380.200" font-size="20" font-weight="700" fill="#111827">워크로드 요구</text>
<text data-source="root.0.1.0" x="112.000" y="416.200" font-size="18" font-weight="400" fill="#111827">용량 보장과 장기 할인 중 필요한 축을 먼저 분리</text>
<text data-source="root.0.1.2.0.0" x="1072.000" y="280.250" font-size="20" font-weight="700" fill="#111827">지정 AZ 용량 보장</text>
<text data-source="root.0.1.2.0.1.0" x="1088.000" y="339.250" font-size="20" font-weight="700" fill="#111827">On-Demand</text>
<text data-source="root.0.1.2.0.1.0" x="1088.000" y="365.250" font-size="20" font-weight="700" fill="#111827">Capacity</text>
<text data-source="root.0.1.2.0.1.0" x="1088.000" y="391.250" font-size="20" font-weight="700" fill="#111827">Reservation</text>
<text data-source="root.0.1.2.0.1.0" x="1088.000" y="427.250" font-size="18" font-weight="400" fill="#111827">할인 없이 즉시</text>
<text data-source="root.0.1.2.0.1.0" x="1088.000" y="451.550" font-size="18" font-weight="400" fill="#111827">용량 확보,</text>
<text data-source="root.0.1.2.0.1.0" x="1088.000" y="475.850" font-size="18" font-weight="400" fill="#111827">미사용도 과금</text>
<text data-source="root.0.1.2.1.0" x="1452.000" y="280.250" font-size="20" font-weight="700" fill="#111827">장기 요금 할인</text>
<text data-source="root.0.1.2.1.1.0" x="1468.000" y="339.250" font-size="20" font-weight="700" fill="#111827">Savings Plans</text>
<text data-source="root.0.1.2.1.1.0" x="1468.000" y="375.250" font-size="18" font-weight="400" fill="#111827">시간당 금액</text>
<text data-source="root.0.1.2.1.1.0" x="1468.000" y="399.550" font-size="18" font-weight="400" fill="#111827">약정, 취소와</text>
<text data-source="root.0.1.2.1.1.0" x="1468.000" y="423.850" font-size="18" font-weight="400" fill="#111827">교환 불가, 용량</text>
<text data-source="root.0.1.2.1.1.0" x="1468.000" y="448.150" font-size="18" font-weight="400" fill="#111827">보장 없음</text>
<text data-source="root.0.1.2.1.1.1" x="1642.000" y="339.250" font-size="20" font-weight="700" fill="#111827">Regional</text>
<text data-source="root.0.1.2.1.1.1" x="1642.000" y="365.250" font-size="20" font-weight="700" fill="#111827">Reserved</text>
<text data-source="root.0.1.2.1.1.1" x="1642.000" y="391.250" font-size="20" font-weight="700" fill="#111827">Instance</text>
<text data-source="root.0.1.2.1.1.1" x="1642.000" y="427.250" font-size="18" font-weight="400" fill="#111827">AZ 유연성과</text>
<text data-source="root.0.1.2.1.1.1" x="1642.000" y="451.550" font-size="18" font-weight="400" fill="#111827">purchase</text>
<text data-source="root.0.1.2.1.1.1" x="1642.000" y="475.850" font-size="18" font-weight="400" fill="#111827">queuing, 용량</text>
<text data-source="root.0.1.2.1.1.1" x="1642.000" y="500.150" font-size="18" font-weight="400" fill="#111827">예약 없음</text>
<text data-source="root.0.1.4.0.0" x="136.000" y="718.450" font-size="20" font-weight="700" fill="#111827">단일 선택</text>
<text data-source="root.0.1.4.0.1" x="152.000" y="777.450" font-size="20" font-weight="700" fill="#111827">Zonal Reserved Instance</text>
<text data-source="root.0.1.4.0.1" x="152.000" y="813.450" font-size="18" font-weight="400" fill="#111827">지정 AZ 용량과 할인, AZ와 size 고정,</text>
<text data-source="root.0.1.4.0.1" x="152.000" y="837.750" font-size="18" font-weight="400" fill="#111827">purchase queuing 없음</text>
<text data-source="root.0.1.4.1.0" x="516.000" y="718.450" font-size="20" font-weight="700" fill="#111827">조합 선택</text>
<text data-source="root.0.1.4.1.1" x="532.000" y="777.450" font-size="20" font-weight="700" fill="#111827">ODCR 위에 커밋을 겹친다</text>
<text data-source="root.0.1.4.1.1" x="532.000" y="813.450" font-size="18" font-weight="400" fill="#111827">Capacity Reservation이 용량을,</text>
<text data-source="root.0.1.4.1.1" x="532.000" y="837.750" font-size="18" font-weight="400" fill="#111827">Savings Plans 또는 Regional RI가</text>
<text data-source="root.0.1.4.1.1" x="532.000" y="862.050" font-size="18" font-weight="400" fill="#111827">할인을 맡음</text>
<text data-source="root.0.1.3" x="104.000" y="602.450" font-size="18" font-weight="400" fill="#111827">두 축이 모두 필요하면 아래 중 하나</text>
<text data-source="root.0.1.1.meaning" x="904.000" y="374.450" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
</svg>
