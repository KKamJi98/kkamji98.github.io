<text data-source="root.0.0" x="64.000" y="119.100" font-size="36" font-weight="700" fill="#111827">EFO는 컨슈머별 샤드 처리량을 분리한다</text>
<text data-source="root.0.1" x="64.000" y="171.700" font-size="20" font-weight="400" fill="#111827">공유 GetRecords는 샤드당 2 MB/s를 컨슈머들이 나누고, EFO는 각 컨슈머에 2 MB/s와 약 70 ms 전파 지연을 전용으로 제공합니다.</text>
<text data-source="root.0.2.0" x="116.000" y="242.700" font-size="24" font-weight="700" fill="#111827">Producer</text>
<text data-source="root.0.2.0" x="116.000" y="281.900" font-size="20" font-weight="400" fill="#111827">PutRecord 또는 PutRecords로 이벤트를 씁니다.</text>
<text data-source="root.0.2.2" x="1052.000" y="242.700" font-size="24" font-weight="700" fill="#111827">Kinesis Data Stream</text>
<text data-source="root.0.2.2" x="1052.000" y="281.900" font-size="20" font-weight="400" fill="#111827">shard가 처리량 단위입니다.</text>
<text data-source="root.0.2.4.0.0" x="608.000" y="472.900" font-size="24" font-weight="700" fill="#111827">공유 처리량</text>
<text data-source="root.0.2.4.0.1.0" x="628.000" y="545.300" font-size="24" font-weight="700" fill="#111827">Shared throughput</text>
<text data-source="root.0.2.4.0.1.0" x="628.000" y="584.500" font-size="20" font-weight="400" fill="#111827">GetRecords pull, 샤드당</text>
<text data-source="root.0.2.4.0.1.0" x="628.000" y="611.500" font-size="20" font-weight="400" fill="#111827">2 MB/s 총량을 모든</text>
<text data-source="root.0.2.4.0.1.0" x="628.000" y="638.500" font-size="20" font-weight="400" fill="#111827">컨슈머가 나눕니다.</text>
<text data-source="root.0.2.4.0.1.1.0" x="628.000" y="729.500" font-size="24" font-weight="700" fill="#111827">Consumer 1</text>
<text data-source="root.0.2.4.0.1.1.0" x="628.000" y="768.700" font-size="20" font-weight="400" fill="#111827">shared read path</text>
<text data-source="root.0.2.4.0.1.1.1" x="628.000" y="859.700" font-size="24" font-weight="700" fill="#111827">Consumer 5</text>
<text data-source="root.0.2.4.0.1.1.1" x="628.000" y="898.900" font-size="20" font-weight="400" fill="#111827">컨슈머 5개에서 전파 지연 약</text>
<text data-source="root.0.2.4.0.1.1.1" x="628.000" y="925.900" font-size="20" font-weight="400" fill="#111827">1,000 ms</text>
<text data-source="root.0.2.4.1.0" x="990.000" y="472.900" font-size="24" font-weight="700" fill="#111827">Enhanced fan-out</text>
<text data-source="root.0.2.4.1.1.0" x="990.000" y="521.300" font-size="20" font-weight="400" fill="#111827">SubscribeToShard HTTP/2</text>
<text data-source="root.0.2.4.1.1.0" x="990.000" y="548.300" font-size="20" font-weight="400" fill="#111827">push로 전달합니다.</text>
<text data-source="root.0.2.4.1.1.1.0" x="1010.000" y="619.300" font-size="24" font-weight="700" fill="#111827">Consumer 1</text>
<text data-source="root.0.2.4.1.1.1.0" x="1010.000" y="658.500" font-size="20" font-weight="400" fill="#111827">2 MB/s 전용, 약 70 ms</text>
<text data-source="root.0.2.4.1.1.1.1" x="1010.000" y="749.500" font-size="24" font-weight="700" fill="#111827">Consumer 5</text>
<text data-source="root.0.2.4.1.1.1.1" x="1010.000" y="788.700" font-size="20" font-weight="400" fill="#111827">2 MB/s 전용, 약 70 ms</text>
<text data-source="root.0.2.1" x="892.000" y="234.800" font-size="20" font-weight="400" fill="#111827">샤드에 기록</text>
<text data-source="root.0.2.3" x="972.000" y="348.900" font-size="20" font-weight="400" fill="#111827">두 읽기 모델</text>
</svg>
