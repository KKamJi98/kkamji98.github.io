<text data-source="root.0.0" x="64.000" y="156.600" font-size="36" font-weight="700" fill="#111827">EFO는 컨슈머별 샤드 처리량을 분리한다</text>
<text data-source="root.0.1" x="64.000" y="209.200" font-size="20" font-weight="400" fill="#111827">공유 GetRecords는 샤드당 2 MB/s를 컨슈머들이 나누고, EFO는 각 컨슈머에 2 MB/s와 약 70 ms 전파 지연을 전용으로 제공합니다.</text>
<text data-source="root.0.2.0" x="116.000" y="280.200" font-size="24" font-weight="700" fill="#111827">Producer</text>
<text data-source="root.0.2.0" x="116.000" y="319.400" font-size="20" font-weight="400" fill="#111827">PutRecord 또는 PutRecords로 이벤트를 씁니다.</text>
<text data-source="root.0.2.2" x="1052.000" y="280.200" font-size="24" font-weight="700" fill="#111827">Kinesis Data Stream</text>
<text data-source="root.0.2.2" x="1052.000" y="319.400" font-size="20" font-weight="400" fill="#111827">shard가 처리량 단위입니다.</text>
<text data-source="root.0.2.4.0.0" x="116.000" y="486.400" font-size="24" font-weight="700" fill="#111827">공유 처리량</text>
<text data-source="root.0.2.4.0.1.0" x="136.000" y="558.800" font-size="24" font-weight="700" fill="#111827">Shared throughput</text>
<text data-source="root.0.2.4.0.1.0" x="136.000" y="598.000" font-size="20" font-weight="400" fill="#111827">GetRecords pull, 샤드당 2 MB/s</text>
<text data-source="root.0.2.4.0.1.0" x="136.000" y="625.000" font-size="20" font-weight="400" fill="#111827">총량을 모든 컨슈머가 나눕니다.</text>
<text data-source="root.0.2.4.0.1.1.0" x="136.000" y="716.000" font-size="24" font-weight="700" fill="#111827">Consumer 1</text>
<text data-source="root.0.2.4.0.1.1.0" x="136.000" y="755.200" font-size="20" font-weight="400" fill="#111827">shared read path</text>
<text data-source="root.0.2.4.0.1.1.1" x="136.000" y="846.200" font-size="24" font-weight="700" fill="#111827">Consumer 5</text>
<text data-source="root.0.2.4.0.1.1.1" x="136.000" y="885.400" font-size="20" font-weight="400" fill="#111827">컨슈머 5개에서 전파 지연 약</text>
<text data-source="root.0.2.4.0.1.1.1" x="136.000" y="912.400" font-size="20" font-weight="400" fill="#111827">1,000 ms</text>
<text data-source="root.0.2.4.1.0" x="522.000" y="486.400" font-size="24" font-weight="700" fill="#111827">Enhanced fan-out</text>
<text data-source="root.0.2.4.1.1.0" x="522.000" y="534.800" font-size="20" font-weight="400" fill="#111827">SubscribeToShard HTTP/2 push로</text>
<text data-source="root.0.2.4.1.1.0" x="522.000" y="561.800" font-size="20" font-weight="400" fill="#111827">전달합니다.</text>
<text data-source="root.0.2.4.1.1.1.0" x="542.000" y="632.800" font-size="24" font-weight="700" fill="#111827">Consumer 1</text>
<text data-source="root.0.2.4.1.1.1.0" x="542.000" y="672.000" font-size="20" font-weight="400" fill="#111827">2 MB/s 전용, 약 70 ms</text>
<text data-source="root.0.2.4.1.1.1.1" x="542.000" y="763.000" font-size="24" font-weight="700" fill="#111827">Consumer 5</text>
<text data-source="root.0.2.4.1.1.1.1" x="542.000" y="802.200" font-size="20" font-weight="400" fill="#111827">2 MB/s 전용, 약 70 ms</text>
<text data-source="root.0.2.1" x="892.000" y="272.300" font-size="20" font-weight="400" fill="#111827">샤드에 기록</text>
<text data-source="root.0.2.3" x="104.000" y="386.400" font-size="20" font-weight="400" fill="#111827">두 읽기 모델</text>
