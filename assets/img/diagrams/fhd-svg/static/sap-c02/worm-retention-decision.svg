<path data-edge="root.0.3.0.3" data-from="root.0.3.0.2" data-to="root.0.3.0.4" d="M 521.500 691.000 L 521.500 743.000" fill="none" stroke="#475569" stroke-width="3"><title>새 버전은 별도 기록</title></path>
