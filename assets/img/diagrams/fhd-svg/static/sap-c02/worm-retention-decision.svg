<polygon data-arrowhead="root.0.2" points="960.000,381.100 954.000,371.100 966.000,371.100" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="222.800" font-size="36" font-weight="700" fill="#111827">보존 대상이 객체인지 recovery point인지가 WORM 수단을 정합니다</text>
<text data-source="root.0.1" x="74.000" y="271.400" font-size="16" font-weight="700" fill="#111827">변경 불가 보존 요구</text>
<text data-source="root.0.1" x="74.000" y="302.200" font-size="14" font-weight="400" fill="#111827">규제 기간과 운영자 우회 허용 여부를 먼저 결정</text>
<text data-source="root.0.3.0.0" x="98.000" y="443.100" font-size="16" font-weight="700" fill="#111827">S3 객체 버전</text>
<text data-source="root.0.3.0.1.0" x="108.000" y="484.700" font-size="16" font-weight="700" fill="#111827">S3 Object Lock</text>
<text data-source="root.0.3.0.1.0" x="108.000" y="515.500" font-size="14" font-weight="400" fill="#111827">versioning이 켜진 버킷의 object version 대상</text>
<text data-source="root.0.3.0.2.0" x="132.000" y="590.400" font-size="16" font-weight="700" fill="#111827">compliance mode</text>
<text data-source="root.0.3.0.2.0" x="132.000" y="621.200" font-size="14" font-weight="400" fill="#111827">보존 기간 중 root도 삭제 불가, 모드</text>
<text data-source="root.0.3.0.2.0" x="132.000" y="640.100" font-size="14" font-weight="400" fill="#111827">변경과 기간 단축 불가</text>
<text data-source="root.0.3.0.2.1" x="401.667" y="590.400" font-size="16" font-weight="700" fill="#111827">governance mode</text>
<text data-source="root.0.3.0.2.1" x="401.667" y="621.200" font-size="14" font-weight="400" fill="#111827">s3:BypassGovernanceRetention과</text>
<text data-source="root.0.3.0.2.1" x="401.667" y="640.100" font-size="14" font-weight="400" fill="#111827">요청 header 필요</text>
<text data-source="root.0.3.0.2.2" x="671.333" y="590.400" font-size="16" font-weight="700" fill="#111827">legal hold</text>
<text data-source="root.0.3.0.2.2" x="671.333" y="621.200" font-size="14" font-weight="400" fill="#111827">만료일 없이 별도 해제까지 유지</text>
<text data-source="root.0.3.0.4" x="108.000" y="781.000" font-size="16" font-weight="700" fill="#111827">새 버전과 delete marker</text>
<text data-source="root.0.3.0.4" x="108.000" y="811.800" font-size="14" font-weight="400" fill="#111827">version ID 없는 DELETE는 delete marker를 남길 수 있음</text>
<text data-source="root.0.3.0.3" x="541.500" y="721.550" font-size="14" font-weight="400" fill="#111827">새 버전은 별도 기록</text>
<text data-source="root.0.3.1.0" x="975.000" y="443.100" font-size="16" font-weight="700" fill="#111827">AWS Backup recovery point</text>
<text data-source="root.0.3.1.1.0" x="985.000" y="484.700" font-size="16" font-weight="700" fill="#111827">Backup Vault Lock</text>
<text data-source="root.0.3.1.1.0" x="985.000" y="515.500" font-size="14" font-weight="400" fill="#111827">vault의 recovery point 대상</text>
<text data-source="root.0.3.1.2.0.0" x="985.000" y="566.400" font-size="16" font-weight="700" fill="#111827">compliance mode</text>
<text data-source="root.0.3.1.2.0.1.0" x="995.000" y="608.000" font-size="16" font-weight="700" fill="#111827">grace time</text>
<text data-source="root.0.3.1.2.0.1.0" x="995.000" y="638.800" font-size="14" font-weight="400" fill="#111827">ChangeableForDays 지정, 최소 3일</text>
<text data-source="root.0.3.1.2.0.1.2" x="995.000" y="755.700" font-size="16" font-weight="700" fill="#111827">되돌릴 수 없는 구간</text>
<text data-source="root.0.3.1.2.0.1.2" x="995.000" y="786.500" font-size="14" font-weight="400" fill="#111827">lock 변경 불가, recovery point는 보존 기간 전에 변경 및</text>
<text data-source="root.0.3.1.2.0.1.2" x="995.000" y="805.400" font-size="14" font-weight="400" fill="#111827">삭제 불가</text>
<text data-source="root.0.3.1.2.0.1.1" x="1204.250" y="696.250" font-size="14" font-weight="400" fill="#111827">grace 종료</text>
<text data-source="root.0.3.1.2.1.0" x="1413.500" y="566.400" font-size="16" font-weight="700" fill="#111827">governance mode</text>
<text data-source="root.0.3.1.2.1.1.0" x="1423.500" y="608.000" font-size="16" font-weight="700" fill="#111827">ChangeableForDays 생략</text>
<text data-source="root.0.3.1.2.1.1.0" x="1423.500" y="638.800" font-size="14" font-weight="400" fill="#111827">IAM 권한자가 lock을 제거할 수 있음</text>
<text data-source="root.0.4" x="64.000" y="888.300" font-size="14" font-weight="400" fill="#111827">S3 객체의 WORM은 Object Lock, AWS Backup 사본의 조기 삭제 방지는 Vault Lock입니다. grace time 뒤 immutable 상태가 되는 것은 Backup Vault Lock의 compliance mode입니다. S3 compliance는 설정된 보존 기간 동안 적용되며, legal hold는 그 기간과 독립입니다.</text>
<text data-source="root.0.2" x="980.000" y="359.650" font-size="14" font-weight="400" fill="#111827">보존 대상 확인</text>
</svg>
