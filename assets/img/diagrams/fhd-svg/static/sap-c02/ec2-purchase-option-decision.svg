<path data-edge="root.0.2.2.0.1.1" data-from="root.0.2.2.0.1.0" data-to="root.0.2.2.0.1.2" d="M 509.500 468.800 L 509.500 520.800" fill="none" stroke="#475569" stroke-width="3"><title>라이선스와 tenancy 요구에 따라 분기</title></path>
<polygon data-arrowhead="root.0.2.2.0.1.1" points="509.500,520.800 503.500,510.800 515.500,510.800" fill="#475569"/>
<path data-edge="root.0.2.2.1.1.1.1.1" data-from="root.0.2.2.1.1.1.1.0" data-to="root.0.2.2.1.1.1.1.2" d="M 1630.750 550.500 L 1630.750 602.500" fill="none" stroke="#475569" stroke-width="3"><title>약정 여부</title></path>
<polygon data-arrowhead="root.0.2.2.1.1.1.1.1" points="1630.750,602.500 1624.750,592.500 1636.750,592.500" fill="#475569"/>
<path data-edge="root.0.2.1" data-from="root.0.2.0" data-to="root.0.2.2" d="M 960.000 279.500 L 960.000 331.500" fill="none" stroke="#475569" stroke-width="3"><title>요구별 질문</title></path>
<polygon data-arrowhead="root.0.2.1" points="960.000,331.500 954.000,321.500 966.000,321.500" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="144.300" font-size="36" font-weight="700" fill="#111827">구매 옵션은 세 가지 질문에서 갈린다</text>
<text data-source="root.0.1" x="64.000" y="180.900" font-size="14" font-weight="400" fill="#111827">중단 허용도, 약정 가능 기간, 라이선스 단위를 따로 판단합니다. 특정 AZ 용량 보장은 이 질문들 위에 겹치는 별도 축입니다.</text>
<text data-source="root.0.2.0" x="74.000" y="221.800" font-size="16" font-weight="700" fill="#111827">워크로드 요구</text>
<text data-source="root.0.2.0" x="74.000" y="252.600" font-size="14" font-weight="400" fill="#111827">중단 허용도와 약정 기간과 라이선스 단위를 분리합니다.</text>
<text data-source="root.0.2.2.0.0" x="74.000" y="369.500" font-size="16" font-weight="700" fill="#111827">라이선스 단위</text>
<text data-source="root.0.2.2.0.1.0" x="84.000" y="411.100" font-size="16" font-weight="700" fill="#111827">물리 소켓과 코어 단위 라이선스인가</text>
<text data-source="root.0.2.2.0.1.0" x="84.000" y="441.900" font-size="14" font-weight="400" fill="#111827">감사와 host affinity가 필요한지 확인합니다.</text>
<text data-source="root.0.2.2.0.1.2.0" x="84.000" y="558.800" font-size="16" font-weight="700" fill="#111827">Dedicated Host</text>
<text data-source="root.0.2.2.0.1.2.0" x="84.000" y="589.600" font-size="14" font-weight="400" fill="#111827">물리 단위 라이선스가 필요하면 선택. 소켓과 코어와 host ID가 보이며</text>
<text data-source="root.0.2.2.0.1.2.0" x="84.000" y="608.500" font-size="14" font-weight="400" fill="#111827">placement group에는 넣을 수 없습니다.</text>
<text data-source="root.0.2.2.0.1.2.1" x="524.500" y="558.800" font-size="16" font-weight="700" fill="#111827">Dedicated Instance</text>
<text data-source="root.0.2.2.0.1.2.1" x="524.500" y="589.600" font-size="14" font-weight="400" fill="#111827">단일 테넌시만 필요할 때 사용합니다. BYOL은 제한된 라이선스만</text>
<text data-source="root.0.2.2.0.1.2.1" x="524.500" y="608.500" font-size="14" font-weight="400" fill="#111827">됩니다.</text>
<text data-source="root.0.2.2.0.1.1" x="529.500" y="499.350" font-size="14" font-weight="400" fill="#111827">라이선스와 tenancy 요구에 따라 분기</text>
<text data-source="root.0.2.2.1.0" x="975.000" y="369.500" font-size="16" font-weight="700" fill="#111827">중단과 약정</text>
<text data-source="root.0.2.2.1.1.0" x="985.000" y="411.100" font-size="16" font-weight="700" fill="#111827">2분 통지로 중단을 견디는가</text>
<text data-source="root.0.2.2.1.1.0" x="985.000" y="441.900" font-size="14" font-weight="400" fill="#111827">stateless이고 체크포인트가 있는 작업인지 확인합니다.</text>
<text data-source="root.0.2.2.1.1.1.0" x="985.000" y="492.800" font-size="16" font-weight="700" fill="#111827">Spot</text>
<text data-source="root.0.2.2.1.1.1.0" x="985.000" y="523.600" font-size="14" font-weight="400" fill="#111827">중단을 허용하면 선택합니다. 가격과 회수는 EC2가 조정합니다.</text>
<text data-source="root.0.2.2.1.1.1.1.0" x="1425.500" y="492.800" font-size="16" font-weight="700" fill="#111827">중단을 견디지 못함</text>
<text data-source="root.0.2.2.1.1.1.1.0" x="1425.500" y="523.600" font-size="14" font-weight="400" fill="#111827">약정 가능 여부를 다음 질문으로 넘깁니다.</text>
<text data-source="root.0.2.2.1.1.1.1.2" x="1425.500" y="640.500" font-size="16" font-weight="700" fill="#111827">1년 또는 3년 지출을 약정할 수 있는가</text>
<text data-source="root.0.2.2.1.1.1.1.2" x="1425.500" y="671.300" font-size="14" font-weight="400" fill="#111827">구매 후 약정은 취소할 수 없습니다.</text>
<text data-source="root.0.2.2.1.1.1.1.3.0" x="1425.500" y="722.200" font-size="16" font-weight="700" fill="#111827">Savings Plans 또는</text>
<text data-source="root.0.2.2.1.1.1.1.3.0" x="1425.500" y="743.000" font-size="16" font-weight="700" fill="#111827">Regional Reserved</text>
<text data-source="root.0.2.2.1.1.1.1.3.0" x="1425.500" y="763.800" font-size="16" font-weight="700" fill="#111827">Instances</text>
<text data-source="root.0.2.2.1.1.1.1.3.0" x="1425.500" y="794.600" font-size="14" font-weight="400" fill="#111827">요금 할인만 주며 용량을</text>
<text data-source="root.0.2.2.1.1.1.1.3.0" x="1425.500" y="813.500" font-size="14" font-weight="400" fill="#111827">예약하지 않습니다.</text>
<text data-source="root.0.2.2.1.1.1.1.3.1" x="1645.750" y="722.200" font-size="16" font-weight="700" fill="#111827">On-Demand</text>
<text data-source="root.0.2.2.1.1.1.1.3.1" x="1645.750" y="753.000" font-size="14" font-weight="400" fill="#111827">약정 없는 기준 가격으로</text>
<text data-source="root.0.2.2.1.1.1.1.3.1" x="1645.750" y="771.900" font-size="14" font-weight="400" fill="#111827">변동분과 검증 구간을 담습니다.</text>
<text data-source="root.0.2.2.1.1.1.1.1" x="1650.750" y="581.050" font-size="14" font-weight="400" fill="#111827">약정 여부</text>
<text data-source="root.0.2.3.0" x="74.000" y="874.400" font-size="16" font-weight="700" fill="#111827">특정 AZ 용량 보장이 필요하면 별도로 겹친다</text>
<text data-source="root.0.2.3.1" x="84.000" y="916.000" font-size="16" font-weight="700" fill="#111827">On-Demand Capacity Reservation 또는 zonal RI</text>
<text data-source="root.0.2.3.1" x="84.000" y="946.800" font-size="14" font-weight="400" fill="#111827">용량을 보장하는 축입니다. ODCR 위에는 Savings Plans 요금이 적용될 수 있습니다.</text>
<text data-source="root.0.2.1" x="980.000" y="310.050" font-size="14" font-weight="400" fill="#111827">요구별 질문</text>
</svg>
