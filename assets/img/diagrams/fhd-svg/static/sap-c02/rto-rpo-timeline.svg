<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="fe68323fffe6db2ce7f3d4b79e8f7378a1f9be46806a3f9ccc39efceabbb639e">
