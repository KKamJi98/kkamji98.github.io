<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 432.000 348.500 L 552.000 348.500" fill="none" stroke="#475569" stroke-width="3"><title>허용 데이터 손실 시간</title></path>
<polygon data-arrowhead="root.0.1.1" points="552.000,348.500 542.000,354.500 542.000,342.500" fill="#475569"/>
<path data-edge="root.0.1.3" data-from="root.0.1.2" data-to="root.0.1.4" d="M 900.000 348.500 L 1020.000 348.500" fill="none" stroke="#475569" stroke-width="3"><title>재해 발생 시점</title></path>
<polygon data-arrowhead="root.0.1.3" points="1020.000,348.500 1010.000,354.500 1010.000,342.500" fill="#475569"/>
<path data-edge="root.0.1.5" data-from="root.0.1.4" data-to="root.0.1.6" d="M 1368.000 348.500 L 1488.000 348.500" fill="none" stroke="#475569" stroke-width="3"><title>허용 서비스 중단 시간</title></path>
<polygon data-arrowhead="root.0.1.5" points="1488.000,348.500 1478.000,354.500 1478.000,342.500" fill="#475569"/>
<path data-edge="root.0.1.7" data-from="root.0.1.6" data-to="root.0.1.8" d="M 1836.000 348.500 L 1848.000 348.500 L 1848.000 474.400 L 72.000 474.400 L 72.000 585.450 L 84.000 585.450" fill="none" stroke="#475569" stroke-width="3"><title>정상 트래픽 복귀</title></path>
<polygon data-arrowhead="root.0.1.7" points="84.000,585.450 74.000,591.450 74.000,579.450" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="234.000" font-size="36" font-weight="700" fill="#111827">RPO는 재해 이전이고 RTO는 재해 이후다</text>
<text data-source="root.0.1.0" x="120.000" y="322.600" font-size="28" font-weight="700" fill="#111827">마지막 복구 가능 지점</text>
<text data-source="root.0.1.0" x="120.000" y="365.000" font-size="22" font-weight="400" fill="#111827">복제나 백업이 확보한 마지막</text>
<text data-source="root.0.1.0" x="120.000" y="394.700" font-size="22" font-weight="400" fill="#111827">일관 상태다.</text>
<text data-source="root.0.1.2" x="588.000" y="322.600" font-size="28" font-weight="700" fill="#111827">RPO 구간</text>
<text data-source="root.0.1.2" x="588.000" y="365.000" font-size="22" font-weight="400" fill="#111827">재해 이전에 잃어도 된다고</text>
<text data-source="root.0.1.2" x="588.000" y="394.700" font-size="22" font-weight="400" fill="#111827">정한 시간이다.</text>
<text data-source="root.0.1.4" x="1056.000" y="322.600" font-size="28" font-weight="700" fill="#111827">재해 발생</text>
<text data-source="root.0.1.4" x="1056.000" y="365.000" font-size="22" font-weight="400" fill="#111827">장애를 인지한 시점이 아니라</text>
<text data-source="root.0.1.4" x="1056.000" y="394.700" font-size="22" font-weight="400" fill="#111827">실제 발생 시점이다.</text>
<text data-source="root.0.1.6" x="1524.000" y="322.600" font-size="28" font-weight="700" fill="#111827">RTO 구간</text>
<text data-source="root.0.1.6" x="1524.000" y="365.000" font-size="22" font-weight="400" fill="#111827">재해 이후 복구를 끝내야 하는</text>
<text data-source="root.0.1.6" x="1524.000" y="394.700" font-size="22" font-weight="400" fill="#111827">목표 시간이다.</text>
<text data-source="root.0.1.8" x="120.000" y="574.400" font-size="28" font-weight="700" fill="#111827">서비스 재개</text>
<text data-source="root.0.1.8" x="120.000" y="616.800" font-size="22" font-weight="400" fill="#111827">정상 요청을 다시 처리한다.</text>
<text data-source="root.0.1.1" x="424.000" y="299.100" font-size="22" font-weight="400" fill="#111827">허용 데이터</text>
<text data-source="root.0.1.1" x="424.000" y="328.800" font-size="22" font-weight="400" fill="#111827">손실 시간</text>
<text data-source="root.0.1.3" x="892.000" y="328.800" font-size="22" font-weight="400" fill="#111827">재해 발생 시점</text>
<text data-source="root.0.1.5" x="1360.000" y="299.100" font-size="22" font-weight="400" fill="#111827">허용 서비스</text>
<text data-source="root.0.1.5" x="1360.000" y="328.800" font-size="22" font-weight="400" fill="#111827">중단 시간</text>
<text data-source="root.0.1.7" x="104.000" y="466.400" font-size="22" font-weight="400" fill="#111827">정상 트래픽 복귀</text>
<text data-source="root.0.2.0" x="88.000" y="724.500" font-size="28" font-weight="700" fill="#111827">RPO의 실제 상한</text>
<text data-source="root.0.2.0" x="88.000" y="766.900" font-size="22" font-weight="400" fill="#111827">복제 수단이 정한다. Aurora Global은 초 단위, S3 RTC와 EFS replication은 15분 임계값,</text>
<text data-source="root.0.2.0" x="88.000" y="796.600" font-size="22" font-weight="400" fill="#111827">백업은 주기를 따른다.</text>
<text data-source="root.0.2.1" x="996.000" y="724.500" font-size="28" font-weight="700" fill="#111827">RTO의 실제 상한</text>
<text data-source="root.0.2.1" x="996.000" y="766.900" font-size="22" font-weight="400" fill="#111827">탐지와 판단, DNS 전파, 인스턴스 기동, 용량 확장 절차의 합이다.</text>
<text data-source="root.0.3" x="64.000" y="874.300" font-size="22" font-weight="400" fill="#111827">RPO 상자는 복제 수단과 연결되고 RTO 상자는 복구 절차와 연결된다.</text>
</svg>
