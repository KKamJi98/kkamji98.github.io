<text data-source="root.0.0" x="64.000" y="147.700" font-size="36" font-weight="700" fill="#111827">SQS 메시지는 성공하면 삭제되고 반복 실패하면 DLQ로 이동합니다</text>
<text data-source="root.0.1.0" x="140.000" y="261.800" font-size="24" font-weight="700" fill="#111827">Producer</text>
<text data-source="root.0.1.0" x="140.000" y="301.000" font-size="20" font-weight="400" fill="#111827">SendMessage</text>
<text data-source="root.0.1.2" x="601.725" y="261.800" font-size="24" font-weight="700" fill="#111827">Source queue</text>
<text data-source="root.0.1.2" x="601.725" y="301.000" font-size="20" font-weight="400" fill="#111827">retention 최대 14일</text>
<text data-source="root.0.1.4" x="1063.450" y="261.800" font-size="24" font-weight="700" fill="#111827">In-flight</text>
<text data-source="root.0.1.4" x="1063.450" y="301.000" font-size="20" font-weight="400" fill="#111827">visibility timeout 최대 12시간</text>
<text data-source="root.0.1.6" x="1525.175" y="248.300" font-size="24" font-weight="700" fill="#111827">Consumer</text>
<text data-source="root.0.1.6" x="1525.175" y="287.500" font-size="20" font-weight="400" fill="#111827">처리 성공 여부에 따라 다음</text>
<text data-source="root.0.1.6" x="1525.175" y="314.500" font-size="20" font-weight="400" fill="#111827">경로 선택</text>
<text data-source="root.0.1.1" x="418.825" y="253.900" font-size="20" font-weight="400" fill="#111827">메시지 보존</text>
<text data-source="root.0.1.3" x="880.550" y="253.900" font-size="20" font-weight="400" fill="#111827">ReceiveMessage</text>
<text data-source="root.0.1.5" x="1342.275" y="253.900" font-size="20" font-weight="400" fill="#111827">컨슈머가 처리</text>
<text data-source="root.0.3.0.0" x="108.000" y="532.500" font-size="24" font-weight="700" fill="#111827">성공</text>
<text data-source="root.0.3.0.1.0" x="128.000" y="604.900" font-size="24" font-weight="700" fill="#111827">DeleteMessage</text>
<text data-source="root.0.3.0.1.0" x="128.000" y="644.100" font-size="20" font-weight="400" fill="#111827">삭제 성공 후 메시지 제거</text>
<text data-source="root.0.3.1.0" x="696.000" y="532.500" font-size="24" font-weight="700" fill="#111827">재시도</text>
<text data-source="root.0.3.1.1.0" x="748.000" y="604.900" font-size="24" font-weight="700" fill="#111827">Retry</text>
<text data-source="root.0.3.1.1.0" x="748.000" y="644.100" font-size="20" font-weight="400" fill="#111827">visibility timeout 만료로 다시 보임</text>
<text data-source="root.0.3.1.1.2" x="748.000" y="811.100" font-size="24" font-weight="700" fill="#111827">Source queue</text>
<text data-source="root.0.3.1.1.2" x="748.000" y="850.300" font-size="20" font-weight="400" fill="#111827">maxReceiveCount 전까지 반복</text>
<text data-source="root.0.3.1.1.1" x="736.000" y="711.100" font-size="20" font-weight="400" fill="#111827">수신 횟수 증가</text>
<text data-source="root.0.3.2.0" x="1284.000" y="532.500" font-size="24" font-weight="700" fill="#111827">반복 실패</text>
<text data-source="root.0.3.2.1.0" x="1304.000" y="604.900" font-size="24" font-weight="700" fill="#111827">Dead-letter queue</text>
<text data-source="root.0.3.2.1.0" x="1304.000" y="644.100" font-size="20" font-weight="400" fill="#111827">maxReceiveCount 도달 시 이동</text>
<text data-source="root.0.4" x="64.000" y="961.300" font-size="20" font-weight="400" fill="#111827">visibility timeout 안에 DeleteMessage를 못 보내면 재수신됩니다. timeout을 처리 시간보다 짧게 잡으면 중복 전달이 생깁니다.</text>
<text data-source="root.0.2" x="980.000" y="421.500" font-size="20" font-weight="400" fill="#111827">처리 결과</text>
