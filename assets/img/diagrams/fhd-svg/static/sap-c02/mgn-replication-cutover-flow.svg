<path data-edge="root.0.2.2" data-from="root.0.2.1" data-to="root.0.2.3" d="M 960.000 505.350 L 960.000 569.650" fill="none" stroke="#475569" stroke-width="3"><title>복제 block을 staging EBS에 기록</title></path>
<polygon data-arrowhead="root.0.2.2" points="960.000,569.650 954.000,559.650 966.000,559.650" fill="#475569"/>
<path data-edge="root.0.3" data-from="root.0.2" data-to="root.0.4" d="M 960.000 703.950 L 960.000 768.250" fill="none" stroke="#475569" stroke-width="3"><title>staging snapshot으로 test 또는 cutover 기동</title></path>
<polygon data-arrowhead="root.0.3" points="960.000,768.250 954.000,758.250 966.000,758.250" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="126.150" font-size="36" font-weight="700" fill="#111827">MGN staging area에서 test와 cutover를 분리</text>
<text data-source="root.0.1.0" x="80.000" y="190.750" font-size="20" font-weight="700" fill="#111827">소스 경계: 온프레미스 또는 기존 클라우드</text>
<text data-source="root.0.1.1.0" x="96.000" y="249.750" font-size="20" font-weight="700" fill="#111827">소스 서버 / AWS Replication Agent</text>
<text data-source="root.0.1.1.0" x="96.000" y="285.750" font-size="18" font-weight="400" fill="#111827">물리, 가상, 클라우드 서버. replication server에 TCP 1500 연속 블록 복제</text>
<text data-source="root.0.1.1.1" x="984.000" y="249.750" font-size="20" font-weight="700" fill="#111827">MGN vCenter Client</text>
<text data-source="root.0.1.1.1" x="984.000" y="285.750" font-size="18" font-weight="400" fill="#111827">별도 agentless snapshot 경로. vCenter 6.7, 7.0, 8.0; CBT와 VDDK</text>
<text data-source="root.0.2.0" x="80.000" y="376.050" font-size="20" font-weight="700" fill="#111827">staging area subnet</text>
<text data-source="root.0.2.1" x="96.000" y="435.050" font-size="20" font-weight="700" fill="#111827">replication server</text>
<text data-source="root.0.2.1" x="96.000" y="471.050" font-size="18" font-weight="400" fill="#111827">Agent의 TCP 1500 수신. t3.small, 통상 볼륨 15개당 1대, 고정 IP 불가</text>
<text data-source="root.0.2.3" x="96.000" y="617.650" font-size="20" font-weight="700" fill="#111827">staging EBS 볼륨</text>
<text data-source="root.0.2.3" x="96.000" y="653.650" font-size="18" font-weight="400" fill="#111827">소스 볼륨과 같은 크기. agentless snapshot 경로도 이 staging 상태에 반영; 증분 스냅샷 5-7개</text>
<text data-source="root.0.2.2" x="980.000" y="543.350" font-size="18" font-weight="400" fill="#111827">복제 block을 staging EBS에 기록</text>
<text data-source="root.0.4.0" x="80.000" y="816.250" font-size="20" font-weight="700" fill="#111827">타깃 VPC</text>
<text data-source="root.0.4.1.0" x="96.000" y="875.250" font-size="20" font-weight="700" fill="#111827">test instance</text>
<text data-source="root.0.4.1.0" x="96.000" y="911.250" font-size="18" font-weight="400" fill="#111827">인수 테스트. 종료 뒤 재기동 가능</text>
<text data-source="root.0.4.1.1" x="984.000" y="875.250" font-size="20" font-weight="700" fill="#111827">cutover instance</text>
<text data-source="root.0.4.1.1" x="984.000" y="911.250" font-size="18" font-weight="400" fill="#111827">lag 0 확인과 소스 서비스 정지 후 기동</text>
<text data-source="root.0.5" x="64.000" y="983.550" font-size="18" font-weight="400" fill="#111827">Cutover 완료 뒤 finalize하고 복제 리소스를 정리하면 source server archive 상태가 됩니다. 그림의 volume 수치는 기본 EBS 경로 기준입니다.</text>
<text data-source="root.0.3" x="980.000" y="741.950" font-size="18" font-weight="400" fill="#111827">staging snapshot으로 test 또는 cutover 기동</text>
</svg>
