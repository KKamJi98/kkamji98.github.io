<polygon data-arrowhead="root.0.1.1.1.1" points="1474.000,463.100 1464.000,469.100 1464.000,457.100" fill="#475569"/>
<path data-edge="root.0.1.1.1.3" data-from="root.0.1.1.1.2" data-to="root.0.1.1.1.4" d="M 1812.000 463.100 L 1824.000 463.100 L 1824.000 622.050 L 1004.000 622.050 L 1004.000 766.150 L 1016.000 766.150" fill="none" stroke="#475569" stroke-width="3"><title>alarm health check</title></path>
<polygon data-arrowhead="root.0.1.1.1.3" points="1016.000,766.150 1006.000,772.150 1006.000,760.150" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="229.750" font-size="36" font-weight="700" fill="#111827">VPC 밖 checker는 private endpoint를 직접 검사하지 못한다</text>
<text data-source="root.0.1.0.0" x="88.000" y="318.350" font-size="28" font-weight="700" fill="#111827">직접 검사 경로</text>
<text data-source="root.0.1.0.1.0" x="112.000" y="404.150" font-size="28" font-weight="700" fill="#111827">Route 53 health checker</text>
<text data-source="root.0.1.0.1.0" x="112.000" y="446.550" font-size="22" font-weight="400" fill="#111827">VPC 밖에서 공개 엔드포인트를 검사한다.</text>
<text data-source="root.0.1.0.1.2" x="112.000" y="639.950" font-size="28" font-weight="700" fill="#111827">직접 검사 불가</text>
<text data-source="root.0.1.0.1.2" x="112.000" y="682.350" font-size="22" font-weight="400" fill="#111827">security group을 열어도 VPC 밖 경계는 바뀌지 않는다.</text>
<text data-source="root.0.1.0.1.3" x="88.000" y="760.050" font-size="22" font-weight="400" fill="#111827">private endpoint는 사설 IP만 가지므로 checker가 직접 연결할 수 없다.</text>
<text data-source="root.0.1.0.1.1" x="526.000" y="540.250" font-size="22" font-weight="400" fill="#111827">사설 IP 접근 시도</text>
<text data-source="root.0.1.1.0" x="996.000" y="318.350" font-size="28" font-weight="700" fill="#111827">CloudWatch alarm을 통한 간접 경로</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="404.150" font-size="28" font-weight="700" fill="#111827">private endpoint의</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="440.550" font-size="28" font-weight="700" fill="#111827">애플리케이션</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="482.950" font-size="22" font-weight="400" fill="#111827">애플리케이션 상태를</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="512.650" font-size="22" font-weight="400" fill="#111827">CloudWatch metric으로</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="542.350" font-size="22" font-weight="400" fill="#111827">게시한다.</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="422.350" font-size="28" font-weight="700" fill="#111827">CloudWatch alarm</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="464.750" font-size="22" font-weight="400" fill="#111827">metric을 판정해 healthy</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="494.450" font-size="22" font-weight="400" fill="#111827">또는 unhealthy 상태를</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="524.150" font-size="22" font-weight="400" fill="#111827">만든다.</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="722.050" font-size="28" font-weight="700" fill="#111827">Route 53 failover</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="758.450" font-size="28" font-weight="700" fill="#111827">record</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="800.850" font-size="22" font-weight="400" fill="#111827">간접 health 판정으로 응답</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="830.550" font-size="22" font-weight="400" fill="#111827">대상을 고른다.</text>
<text data-source="root.0.1.1.1.1" x="1346.000" y="413.700" font-size="22" font-weight="400" fill="#111827">metric data</text>
<text data-source="root.0.1.1.1.1" x="1346.000" y="443.400" font-size="22" font-weight="400" fill="#111827">stream</text>
<text data-source="root.0.1.1.1.3" x="1036.000" y="614.050" font-size="22" font-weight="400" fill="#111827">alarm health check</text>
</svg>
