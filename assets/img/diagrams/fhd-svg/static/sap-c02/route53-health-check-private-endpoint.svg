<path data-edge="root.0.1.0.1.1" data-from="root.0.1.0.1.0" data-to="root.0.1.0.1.2" d="M 506.000 490.250 L 506.000 575.950" fill="none" stroke="#475569" stroke-width="3"><title>사설 IP 접근 시도</title></path>
<polygon data-arrowhead="root.0.1.0.1.1" points="506.000,575.950 500.000,565.950 512.000,565.950" fill="#475569"/>
