<text data-source="root.0.0" x="64.000" y="105.600" font-size="36" font-weight="700" fill="#111827">전달 요구가 통합 서비스를 가른다</text>
<text data-source="root.0.1.0" x="84.000" y="182.200" font-size="24" font-weight="700" fill="#111827">모놀리스 모듈</text>
<text data-source="root.0.1.0" x="84.000" y="221.400" font-size="20" font-weight="400" fill="#111827">기존 동기 호출을 어떤 보장으로 분리할지 정한다.</text>
<text data-source="root.0.2.0.0" x="108.000" y="415.400" font-size="24" font-weight="700" fill="#111827">순서와 소비자별 버퍼</text>
<text data-source="root.0.2.0.1.0" x="160.000" y="487.800" font-size="24" font-weight="700" fill="#111827">FIFO 전달</text>
<text data-source="root.0.2.0.1.0" x="160.000" y="527.000" font-size="20" font-weight="400" fill="#111827">소비자마다 보존된 순서와 버퍼가 필요하다.</text>
<text data-source="root.0.2.0.1.2" x="160.000" y="694.000" font-size="24" font-weight="700" fill="#111827">SNS FIFO</text>
<text data-source="root.0.2.0.1.2" x="160.000" y="733.200" font-size="20" font-weight="400" fill="#111827">필터링과 팬아웃을 담당한다.</text>
<text data-source="root.0.2.0.1.4" x="160.000" y="900.200" font-size="24" font-weight="700" fill="#111827">SQS FIFO</text>
<text data-source="root.0.2.0.1.4" x="160.000" y="939.400" font-size="20" font-weight="400" fill="#111827">소비자별 보존과 순서를 보장한다.</text>
<text data-source="root.0.2.0.1.1" x="148.000" y="594.000" font-size="20" font-weight="400" fill="#111827">팬아웃</text>
<text data-source="root.0.2.0.1.3" x="148.000" y="800.200" font-size="20" font-weight="400" fill="#111827">소비자별 큐</text>
<text data-source="root.0.2.1.0" x="696.000" y="415.400" font-size="24" font-weight="700" fill="#111827">콘텐츠 기반 라우팅</text>
<text data-source="root.0.2.1.1.0" x="748.000" y="487.800" font-size="24" font-weight="700" fill="#111827">이벤트 패턴</text>
<text data-source="root.0.2.1.1.0" x="748.000" y="527.000" font-size="20" font-weight="400" fill="#111827">내용에 따라 서로 다른 대상이 필요하다.</text>
<text data-source="root.0.2.1.1.2" x="748.000" y="694.000" font-size="24" font-weight="700" fill="#111827">Amazon EventBridge</text>
<text data-source="root.0.2.1.1.2" x="748.000" y="733.200" font-size="20" font-weight="400" fill="#111827">rule로 이벤트를 대상에 라우팅한다.</text>
<text data-source="root.0.2.1.1.1" x="736.000" y="594.000" font-size="20" font-weight="400" fill="#111827">rule 매칭</text>
<text data-source="root.0.2.2.0" x="1284.000" y="415.400" font-size="24" font-weight="700" fill="#111827">긴 대기와 사람 승인</text>
<text data-source="root.0.2.2.1.0" x="1336.000" y="487.800" font-size="24" font-weight="700" fill="#111827">비멱등 작업</text>
<text data-source="root.0.2.2.1.0" x="1336.000" y="527.000" font-size="20" font-weight="400" fill="#111827">긴 실행과 콜백, 승인 단계가 필요하다.</text>
<text data-source="root.0.2.2.1.2" x="1336.000" y="694.000" font-size="24" font-weight="700" fill="#111827">Step Functions Standard</text>
<text data-source="root.0.2.2.1.2" x="1336.000" y="733.200" font-size="20" font-weight="400" fill="#111827">승인과 callback을 포함한 긴 워크플로다.</text>
<text data-source="root.0.2.2.1.1" x="1324.000" y="594.000" font-size="20" font-weight="400" fill="#111827">상태 있는 실행</text>
<text data-source="root.0.1.1" x="84.000" y="288.400" font-size="20" font-weight="400" fill="#111827">순서, 버퍼, 라우팅, 승인 요구 확인</text>
</svg>
