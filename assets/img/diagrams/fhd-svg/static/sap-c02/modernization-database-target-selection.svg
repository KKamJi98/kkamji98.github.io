<polygon data-arrowhead="root.0.2.3.1.1" points="1461.000,843.400 1451.000,849.400 1451.000,837.400" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="155.800" font-size="36" font-weight="700" fill="#111827">데이터 모델과 운영 제약으로 DB 타깃을 고른다</text>
<text data-source="root.0.1.0" x="84.000" y="232.400" font-size="24" font-weight="700" fill="#111827">기존 데이터베이스</text>
<text data-source="root.0.1.0" x="84.000" y="271.600" font-size="20" font-weight="400" fill="#111827">엔진, 스키마, 조인, 트랜잭션, 액세스 패턴을 확인한다.</text>
<text data-source="root.0.2.0.0" x="108.000" y="465.600" font-size="24" font-weight="700" fill="#111827">관계형 호환성이 핵심</text>
<text data-source="root.0.2.0.1.0" x="160.000" y="538.000" font-size="24" font-weight="700" fill="#111827">조인과 트랜잭션 유지</text>
<text data-source="root.0.2.0.1.0" x="160.000" y="577.200" font-size="20" font-weight="400" fill="#111827">기존 관계형 계약을</text>
<text data-source="root.0.2.0.1.0" x="160.000" y="604.200" font-size="20" font-weight="400" fill="#111827">보존한다.</text>
<text data-source="root.0.2.0.1.2" x="611.000" y="538.000" font-size="24" font-weight="700" fill="#111827">RDS 또는 Aurora</text>
<text data-source="root.0.2.0.1.2" x="611.000" y="577.200" font-size="20" font-weight="400" fill="#111827">관리형 관계형</text>
<text data-source="root.0.2.0.1.2" x="611.000" y="604.200" font-size="20" font-weight="400" fill="#111827">데이터베이스다.</text>
<text data-source="root.0.2.0.1.1" x="451.000" y="543.600" font-size="20" font-weight="400" fill="#111827">replatform</text>
<text data-source="root.0.2.1.0" x="990.000" y="465.600" font-size="24" font-weight="700" fill="#111827">액세스 패턴이 key-value</text>
<text data-source="root.0.2.1.1.0" x="1042.000" y="553.600" font-size="24" font-weight="700" fill="#111827">대규모 분산 처리</text>
<text data-source="root.0.2.1.1.0" x="1042.000" y="592.800" font-size="20" font-weight="400" fill="#111827">스키마를 key-value</text>
<text data-source="root.0.2.1.1.0" x="1042.000" y="619.800" font-size="20" font-weight="400" fill="#111827">모델로 다시 설계한다.</text>
<text data-source="root.0.2.1.1.2" x="1533.000" y="538.000" font-size="24" font-weight="700" fill="#111827">Amazon</text>
<text data-source="root.0.2.1.1.2" x="1533.000" y="569.200" font-size="24" font-weight="700" fill="#111827">DynamoDB</text>
<text data-source="root.0.2.1.1.2" x="1533.000" y="608.400" font-size="20" font-weight="400" fill="#111827">key-value 액세스</text>
<text data-source="root.0.2.1.1.2" x="1533.000" y="635.400" font-size="20" font-weight="400" fill="#111827">패턴에 맞춘다.</text>
<text data-source="root.0.2.1.1.1" x="1293.000" y="559.200" font-size="20" font-weight="400" fill="#111827">purpose-built DB</text>
<text data-source="root.0.2.2.0" x="108.000" y="746.400" font-size="24" font-weight="700" fill="#111827">검색과 분석이 핵심</text>
<text data-source="root.0.2.2.1.0" x="160.000" y="820.900" font-size="24" font-weight="700" fill="#111827">문서와 검색 인덱스</text>
<text data-source="root.0.2.2.1.0" x="160.000" y="860.100" font-size="20" font-weight="400" fill="#111827">검색 질의와 분석 요구를</text>
<text data-source="root.0.2.2.1.0" x="160.000" y="887.100" font-size="20" font-weight="400" fill="#111827">분리한다.</text>
<text data-source="root.0.2.2.1.2" x="611.000" y="818.800" font-size="24" font-weight="700" fill="#111827">Amazon</text>
<text data-source="root.0.2.2.1.2" x="611.000" y="850.000" font-size="24" font-weight="700" fill="#111827">OpenSearch</text>
<text data-source="root.0.2.2.1.2" x="611.000" y="889.200" font-size="20" font-weight="400" fill="#111827">검색과 분석을 전담한다.</text>
<text data-source="root.0.2.2.1.1" x="451.000" y="826.500" font-size="20" font-weight="400" fill="#111827">검색 엔진</text>
<text data-source="root.0.2.3.0" x="990.000" y="746.400" font-size="24" font-weight="700" fill="#111827">엔진 옵션과 OS 제어가 필요</text>
<text data-source="root.0.2.3.1.0" x="1042.000" y="818.800" font-size="24" font-weight="700" fill="#111827">관리형 지원 범위 밖</text>
<text data-source="root.0.2.3.1.0" x="1042.000" y="858.000" font-size="20" font-weight="400" fill="#111827">커널, 드라이버, 세부 엔진</text>
<text data-source="root.0.2.3.1.0" x="1042.000" y="885.000" font-size="20" font-weight="400" fill="#111827">옵션을 직접 제어해야 한다.</text>
<text data-source="root.0.2.3.1.2" x="1493.000" y="818.800" font-size="24" font-weight="700" fill="#111827">EC2 self-managed</text>
<text data-source="root.0.2.3.1.2" x="1493.000" y="858.000" font-size="20" font-weight="400" fill="#111827">rehost에 가까우며 패치와</text>
<text data-source="root.0.2.3.1.2" x="1493.000" y="885.000" font-size="20" font-weight="400" fill="#111827">백업 부담이 남는다.</text>
<text data-source="root.0.2.3.1.1" x="1333.000" y="824.400" font-size="20" font-weight="400" fill="#111827">운영 책임 유지</text>
<text data-source="root.0.1.1" x="84.000" y="338.600" font-size="20" font-weight="400" fill="#111827">요구사항 판정</text>
</svg>
