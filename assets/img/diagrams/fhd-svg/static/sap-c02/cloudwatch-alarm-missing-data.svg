<text data-source="root.0.0" x="64.000" y="100.000" font-size="36" font-weight="700" fill="#111827">CloudWatch alarm의 결측 처리 지점</text>
<text data-source="root.0.1.0" x="80.000" y="198.000" font-size="22" font-weight="700" fill="#111827">메트릭 데이터포인트</text>
<text data-source="root.0.1.0" x="80.000" y="234.600" font-size="18" font-weight="400" fill="#111827">고해상도 period는 10초 또는 30초, 그 외에는 60초</text>
<text data-source="root.0.1.0" x="80.000" y="258.900" font-size="18" font-weight="400" fill="#111827">배수</text>
<text data-source="root.0.1.2" x="720.000" y="198.000" font-size="22" font-weight="700" fill="#111827">Evaluation range 수집</text>
<text data-source="root.0.1.2" x="720.000" y="234.600" font-size="18" font-weight="400" fill="#111827">evaluation periods보다 넓은 구간을 수집</text>
<text data-source="root.0.1.4" x="1360.000" y="198.000" font-size="22" font-weight="700" fill="#111827">실제 데이터가 충분한가</text>
<text data-source="root.0.1.4" x="1360.000" y="234.600" font-size="18" font-weight="400" fill="#111827">evaluation periods 이상이면 결측 처리 설정을</text>
<text data-source="root.0.1.4" x="1360.000" y="258.900" font-size="18" font-weight="400" fill="#111827">사용하지 않음</text>
<text data-source="root.0.1.6.0.0" x="80.000" y="458.000" font-size="22" font-weight="700" fill="#111827">데이터포인트 충분</text>
<text data-source="root.0.1.6.0.1.0" x="96.000" y="519.700" font-size="22" font-weight="700" fill="#111827">M out of N 판정</text>
<text data-source="root.0.1.6.0.1.0" x="96.000" y="556.300" font-size="18" font-weight="400" fill="#111827">가장 오래된 breaching이 M기간 경과하고 이후 전부 breaching 또는 missing이면 ALARM, M개</text>
<text data-source="root.0.1.6.0.1.0" x="96.000" y="580.600" font-size="18" font-weight="400" fill="#111827">미만도 가능</text>
<text data-source="root.0.1.6.0.1.2.0" x="96.000" y="729.200" font-size="22" font-weight="700" fill="#111827">ALARM</text>
<text data-source="root.0.1.6.0.1.2.0" x="96.000" y="765.800" font-size="18" font-weight="400" fill="#111827">임계 초과 판정</text>
<text data-source="root.0.1.6.0.1.2.1" x="512.000" y="729.200" font-size="22" font-weight="700" fill="#111827">OK</text>
<text data-source="root.0.1.6.0.1.2.1" x="512.000" y="765.800" font-size="18" font-weight="400" fill="#111827">notBreaching 상태</text>
<text data-source="root.0.1.6.1.0" x="1024.000" y="458.000" font-size="22" font-weight="700" fill="#111827">데이터포인트 부족</text>
<text data-source="root.0.1.6.1.1.0" x="1040.000" y="519.700" font-size="22" font-weight="700" fill="#111827">결측 처리 설정</text>
<text data-source="root.0.1.6.1.1.0" x="1040.000" y="556.300" font-size="18" font-weight="400" fill="#111827">missing, notBreaching, breaching, ignore 중 선택</text>
<text data-source="root.0.1.6.1.1.2.0" x="1040.000" y="704.900" font-size="22" font-weight="700" fill="#111827">ALARM</text>
<text data-source="root.0.1.6.1.1.2.0" x="1040.000" y="741.500" font-size="18" font-weight="400" fill="#111827">breaching으로 채운 경우</text>
<text data-source="root.0.1.6.1.1.2.1" x="1317.333" y="704.900" font-size="22" font-weight="700" fill="#111827">OK</text>
<text data-source="root.0.1.6.1.1.2.1" x="1317.333" y="741.500" font-size="18" font-weight="400" fill="#111827">notBreaching으로 채운</text>
<text data-source="root.0.1.6.1.1.2.1" x="1317.333" y="765.800" font-size="18" font-weight="400" fill="#111827">경우</text>
<text data-source="root.0.1.6.1.1.2.2" x="1594.667" y="704.900" font-size="22" font-weight="700" fill="#111827">INSUFFICIENT_</text>
<text data-source="root.0.1.6.1.1.2.2" x="1594.667" y="733.500" font-size="22" font-weight="700" fill="#111827">DATA</text>
<text data-source="root.0.1.6.1.1.2.2" x="1594.667" y="770.100" font-size="18" font-weight="400" fill="#111827">기본 missing에서 전부</text>
<text data-source="root.0.1.6.1.1.2.2" x="1594.667" y="794.400" font-size="18" font-weight="400" fill="#111827">비었을 때</text>
<text data-source="root.0.1.6.1.1.3" x="1024.000" y="850.700" font-size="18" font-weight="400" fill="#111827">DynamoDB namespace만 기본값이 ignore입니다.</text>
<text data-source="root.0.1.8" x="80.000" y="966.000" font-size="22" font-weight="700" fill="#111827">Alarm action</text>
<text data-source="root.0.1.8" x="80.000" y="1002.600" font-size="18" font-weight="400" fill="#111827">상태 변경마다 1회, Auto Scaling action은 상태 유지 중 분당 반복</text>
<text data-source="root.0.1.5" x="960.000" y="394.000" font-size="18" font-weight="400" fill="#111827">분기</text>
<text data-source="root.0.1.7" x="700.000" y="868.000" font-size="18" font-weight="400" fill="#111827">ALARM 상태에서만</text>
<text data-source="root.0.1.1.meaning" x="560.000" y="203.700" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.3.meaning" x="1200.000" y="191.550" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.6.0.1.1.meaning" x="508.000" y="651.600" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.6.1.1.1.meaning" x="1452.000" y="627.300" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
