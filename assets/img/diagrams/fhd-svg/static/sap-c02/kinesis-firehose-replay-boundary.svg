<path data-edge="root.0.2.3" data-from="root.0.2.2" data-to="root.0.2.4" d="M 1836.000 308.450 L 1848.000 308.450 L 1848.000 419.500 L 72.000 419.500 L 72.000 554.550 L 84.000 554.550" fill="none" stroke="#475569" stroke-width="3"><title>전달 파이프라인</title></path>
