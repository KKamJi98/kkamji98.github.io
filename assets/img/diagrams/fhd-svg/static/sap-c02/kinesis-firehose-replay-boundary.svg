<polygon data-arrowhead="root.0.2.5" points="1020.000,554.550 1010.000,560.550 1010.000,548.550" fill="#475569"/>
<path data-edge="root.0.3.0.1.1" data-from="root.0.3.0.1.0" data-to="root.0.3.0.1.2" d="M 446.000 844.150 L 566.000 844.150" fill="none" stroke="#475569" stroke-width="3"><title>Replay</title></path>
<polygon data-arrowhead="root.0.3.0.1.1" points="566.000,844.150 556.000,850.150 556.000,838.150" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="155.100" font-size="36" font-weight="700" fill="#111827">재처리 경계는 Kinesis Data Streams 앞에 있다</text>
<text data-source="root.0.1" x="64.000" y="213.700" font-size="22" font-weight="400" fill="#111827">Kinesis Data Streams는 원본을 24시간에서 365일까지 보존하지만 Amazon Data Firehose는 목적지로 전달한 뒤 자체 replay를 제공하지 않습니다.</text>
<text data-source="root.0.2.0" x="120.000" y="297.400" font-size="28" font-weight="700" fill="#111827">Application source</text>
<text data-source="root.0.2.0" x="120.000" y="339.800" font-size="22" font-weight="400" fill="#111827">events</text>
<text data-source="root.0.2.2" x="1056.000" y="297.400" font-size="28" font-weight="700" fill="#111827">Kinesis Data Streams</text>
<text data-source="root.0.2.2" x="1056.000" y="339.800" font-size="22" font-weight="400" fill="#111827">retention 24 hours to 365 days</text>
<text data-source="root.0.2.4" x="120.000" y="543.500" font-size="28" font-weight="700" fill="#111827">Amazon Data Firehose</text>
<text data-source="root.0.2.4" x="120.000" y="585.900" font-size="22" font-weight="400" fill="#111827">buffer interval 60 to 900 seconds</text>
<text data-source="root.0.2.6.0" x="1080.000" y="543.500" font-size="28" font-weight="700" fill="#111827">Amazon S3</text>
<text data-source="root.0.2.6.0" x="1080.000" y="585.900" font-size="22" font-weight="400" fill="#111827">delivered objects</text>
<text data-source="root.0.2.6.1" x="1464.000" y="543.500" font-size="28" font-weight="700" fill="#111827">OpenSearch Service</text>
<text data-source="root.0.2.6.1" x="1464.000" y="585.900" font-size="22" font-weight="400" fill="#111827">delivered index records</text>
<text data-source="root.0.2.1" x="892.000" y="288.750" font-size="22" font-weight="400" fill="#111827">원본 보존</text>
<text data-source="root.0.2.3" x="104.000" y="411.500" font-size="22" font-weight="400" fill="#111827">전달 파이프라인</text>
<text data-source="root.0.2.5" x="892.000" y="534.850" font-size="22" font-weight="400" fill="#111827">목적지 전달</text>
<text data-source="root.0.3.0.0" x="88.000" y="717.600" font-size="28" font-weight="700" fill="#111827">재처리 가능한 구간</text>
<text data-source="root.0.3.0.1.0" x="144.000" y="803.400" font-size="28" font-weight="700" fill="#111827">보존된 stream record</text>
<text data-source="root.0.3.0.1.0" x="144.000" y="845.800" font-size="22" font-weight="400" fill="#111827">Kinesis Data Streams에서</text>
<text data-source="root.0.3.0.1.0" x="144.000" y="875.500" font-size="22" font-weight="400" fill="#111827">retention 기간 동안 다시</text>
<text data-source="root.0.3.0.1.0" x="144.000" y="905.200" font-size="22" font-weight="400" fill="#111827">읽습니다.</text>
<text data-source="root.0.3.0.1.2" x="602.000" y="818.250" font-size="28" font-weight="700" fill="#111827">Replay consumer</text>
<text data-source="root.0.3.0.1.2" x="602.000" y="860.650" font-size="22" font-weight="400" fill="#111827">retained stream records를</text>
<text data-source="root.0.3.0.1.2" x="602.000" y="890.350" font-size="22" font-weight="400" fill="#111827">읽어 재처리합니다.</text>
<text data-source="root.0.3.0.1.1" x="438.000" y="824.450" font-size="22" font-weight="400" fill="#111827">Replay</text>
<text data-source="root.0.3.1.0" x="996.000" y="717.600" font-size="28" font-weight="700" fill="#111827">Firehose 이후</text>
<text data-source="root.0.3.1.1" x="1020.000" y="803.400" font-size="28" font-weight="700" fill="#111827">Firehose 자체 replay 없음</text>
<text data-source="root.0.3.1.1" x="1020.000" y="845.800" font-size="22" font-weight="400" fill="#111827">전달 파이프라인은 저장소가 아니므로 재처리가 필요하면 앞의 stream을 읽습니다.</text>
</svg>
