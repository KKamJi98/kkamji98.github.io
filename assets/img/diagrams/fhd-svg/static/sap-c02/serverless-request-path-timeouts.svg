<text data-source="root.0.0" x="64.000" y="161.400" font-size="36" font-weight="700" fill="#111827">같은 요청도 경로마다 잘리는 층이 다릅니다</text>
<text data-source="root.0.1.0.0" x="88.000" y="250.000" font-size="28" font-weight="700" fill="#111827">API Gateway와 Lambda</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="350.650" font-size="28" font-weight="700" fill="#111827">클라이언트 요청</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="393.050" font-size="22" font-weight="400" fill="#111827">서버리스 경로</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="335.800" font-size="28" font-weight="700" fill="#111827">API Gateway</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="378.200" font-size="22" font-weight="400" fill="#111827">REST 29초 기본, HTTP API</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="407.900" font-size="22" font-weight="400" fill="#111827">30초, payload 10 MB</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="617.300" font-size="28" font-weight="700" fill="#111827">Lambda 함수</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="659.700" font-size="22" font-weight="400" fill="#111827">동기 payload 6 MB, 실행</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="689.400" font-size="22" font-weight="400" fill="#111827">상한 900초</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="587.600" font-size="28" font-weight="700" fill="#111827">두 번 잘림</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="630.000" font-size="22" font-weight="400" fill="#111827">29초에서 504, 함수는 최대</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="659.700" font-size="22" font-weight="400" fill="#111827">900초에서 강제 종료 20분</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="689.400" font-size="22" font-weight="400" fill="#111827">작업은 Step Functions 또는</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="719.100" font-size="22" font-weight="400" fill="#111827">Fargate로 분리</text>
<text data-source="root.0.1.0.1.1" x="438.000" y="342.000" font-size="22" font-weight="400" fill="#111827">통합 요청</text>
<text data-source="root.0.1.0.1.3" x="128.000" y="479.600" font-size="22" font-weight="400" fill="#111827">함수 호출</text>
<text data-source="root.0.1.0.1.5" x="438.000" y="623.500" font-size="22" font-weight="400" fill="#111827">20분 작업</text>
<text data-source="root.0.1.0.2.0" x="112.000" y="826.800" font-size="28" font-weight="700" fill="#111827">Gateway 상한</text>
<text data-source="root.0.1.0.2.0" x="112.000" y="869.200" font-size="22" font-weight="400" fill="#111827">Regional과 private REST API만 quota</text>
<text data-source="root.0.1.0.2.0" x="112.000" y="898.900" font-size="22" font-weight="400" fill="#111827">증설 요청 가능</text>
<text data-source="root.0.1.0.2.1" x="542.000" y="826.800" font-size="28" font-weight="700" fill="#111827">Lambda 상한</text>
<text data-source="root.0.1.0.2.1" x="542.000" y="869.200" font-size="22" font-weight="400" fill="#111827">900초 hard limit은 조정 불가</text>
<text data-source="root.0.1.1.0" x="996.000" y="250.000" font-size="28" font-weight="700" fill="#111827">ALB와 ECS 컨테이너</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="368.850" font-size="28" font-weight="700" fill="#111827">클라이언트 요청</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="411.250" font-size="22" font-weight="400" fill="#111827">컨테이너 비교 경로</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="335.800" font-size="28" font-weight="700" fill="#111827">Application Load</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="372.200" font-size="28" font-weight="700" fill="#111827">Balancer</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="414.600" font-size="22" font-weight="400" fill="#111827">HTTP 컨테이너 target으로</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="444.300" font-size="22" font-weight="400" fill="#111827">전달, idle timeout 조정</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="624.000" font-size="28" font-weight="700" fill="#111827">ECS 태스크</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="666.400" font-size="22" font-weight="400" fill="#111827">Fargate 조합표 또는 EC2</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="696.100" font-size="22" font-weight="400" fill="#111827">0.125에서 192 vCPU</text>
<text data-source="root.0.1.1.1.6" x="1510.000" y="624.000" font-size="28" font-weight="700" fill="#111827">실행 시간 상한 없음</text>
<text data-source="root.0.1.1.1.6" x="1510.000" y="666.400" font-size="22" font-weight="400" fill="#111827">용량, 패치, scale 정책을 직접</text>
<text data-source="root.0.1.1.1.6" x="1510.000" y="696.100" font-size="22" font-weight="400" fill="#111827">정함</text>
<text data-source="root.0.1.1.1.1" x="1346.000" y="360.200" font-size="22" font-weight="400" fill="#111827">ALB 전달</text>
<text data-source="root.0.1.1.1.3" x="1036.000" y="516.000" font-size="22" font-weight="400" fill="#111827">태스크 전달</text>
<text data-source="root.0.1.1.1.5" x="1346.000" y="630.200" font-size="22" font-weight="400" fill="#111827">직접 운영</text>
</svg>
