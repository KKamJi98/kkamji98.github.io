<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.2" d="M 960.000 246.100 L 960.000 278.250 L 960.000 278.250 L 960.000 310.400" fill="none" stroke="#475569" stroke-width="3"><title>시설 안 연결 방식 선택</title></path>
