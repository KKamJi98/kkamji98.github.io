<text data-source="root.0.0" x="64.000" y="111.200" font-size="36" font-weight="700" fill="#111827">Outposts rack과 server의 연결 경계를 비교한다</text>
<text data-source="root.0.1.0" x="80.000" y="175.800" font-size="20" font-weight="700" fill="#111827">온프레미스 네트워크</text>
<text data-source="root.0.1.0" x="80.000" y="211.800" font-size="18" font-weight="400" fill="#111827">공장 제어망 또는 사내 네트워크. rack과 server 모두 양방향 통신한다.</text>
<text data-source="root.0.2.0" x="80.000" y="358.400" font-size="20" font-weight="700" fill="#111827">고객이 확보하고 관리하는 시설</text>
<text data-source="root.0.2.1.0.0" x="96.000" y="417.400" font-size="20" font-weight="700" fill="#111827">rack 경로</text>
<text data-source="root.0.2.1.0.1.0" x="144.000" y="488.550" font-size="20" font-weight="700" fill="#111827">local gateway (LGW)</text>
<text data-source="root.0.2.1.0.1.0" x="144.000" y="524.550" font-size="18" font-weight="400" fill="#111827">rack 전용이며 IPv4만 지원한다.</text>
<text data-source="root.0.2.1.0.1.2" x="604.000" y="476.400" font-size="20" font-weight="700" fill="#111827">Outposts rack</text>
<text data-source="root.0.2.1.0.1.2" x="604.000" y="512.400" font-size="18" font-weight="400" fill="#111827">EC2, EBS, S3 on Outposts, EKS,</text>
<text data-source="root.0.2.1.0.1.2" x="604.000" y="536.700" font-size="18" font-weight="400" fill="#111827">ECS, RDS, EMR, ALB를 지원한다.</text>
<text data-source="root.0.2.1.0.1.1" x="448.000" y="481.400" font-size="18" font-weight="400" fill="#111827">VPC 연결</text>
<text data-source="root.0.2.1.1.0" x="984.000" y="417.400" font-size="20" font-weight="700" fill="#111827">server 경로</text>
<text data-source="root.0.2.1.1.1.0" x="1032.000" y="499.850" font-size="20" font-weight="700" fill="#111827">local network interface</text>
<text data-source="root.0.2.1.1.1.0" x="1032.000" y="525.850" font-size="20" font-weight="700" fill="#111827">(LNI)</text>
<text data-source="root.0.2.1.1.1.0" x="1032.000" y="561.850" font-size="18" font-weight="400" fill="#111827">Outpost subnet에서만 동작한다.</text>
<text data-source="root.0.2.1.1.1.2" x="1492.000" y="476.400" font-size="20" font-weight="700" fill="#111827">Outposts server</text>
<text data-source="root.0.2.1.1.1.2" x="1492.000" y="512.400" font-size="18" font-weight="400" fill="#111827">EC2와 ECS, VPC subnet까지</text>
<text data-source="root.0.2.1.1.1.2" x="1492.000" y="536.700" font-size="18" font-weight="400" fill="#111827">지원한다. EBS 없이 instance</text>
<text data-source="root.0.2.1.1.1.2" x="1492.000" y="561.000" font-size="18" font-weight="400" fill="#111827">store만 사용하며 신규 판매는</text>
<text data-source="root.0.2.1.1.1.2" x="1492.000" y="585.300" font-size="18" font-weight="400" fill="#111827">중단됐다.</text>
<text data-source="root.0.2.1.1.1.1" x="1336.000" y="505.700" font-size="18" font-weight="400" fill="#111827">VPC 연결</text>
<text data-source="root.0.4" x="80.000" y="763.900" font-size="20" font-weight="700" fill="#111827">service link</text>
<text data-source="root.0.4" x="80.000" y="799.900" font-size="18" font-weight="400" fill="#111827">암호화된 VPN 집합이며 홈 리전 control plane과 양방향으로 연결된다. IPv6는 지원하지 않는다.</text>
<text data-source="root.0.6" x="80.000" y="946.500" font-size="20" font-weight="700" fill="#111827">홈 리전 control plane</text>
<text data-source="root.0.6" x="80.000" y="982.500" font-size="18" font-weight="400" fill="#111827">Route 53 Resolver를 포함한 서비스 제어 지점이다.</text>
<text data-source="root.0.3" x="980.000" y="689.600" font-size="18" font-weight="400" fill="#111827">두 경로 모두 service link</text>
<text data-source="root.0.1.1" x="84.000" y="268.100" font-size="18" font-weight="400" fill="#111827">시설 안 연결 방식 선택</text>
<text data-source="root.0.5.meaning" x="980.000" y="870.900" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
</svg>
