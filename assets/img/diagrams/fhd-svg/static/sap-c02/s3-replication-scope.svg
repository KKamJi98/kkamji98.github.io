<polygon data-arrowhead="root.0.3.1.1.1" points="713.333,809.300 703.333,815.300 703.333,803.300" fill="#475569"/>
<path data-edge="root.0.2" data-from="root.0.1" data-to="root.0.3" d="M 960.000 340.650 L 960.000 426.350" fill="none" stroke="#475569" stroke-width="3"><title>복제 범위 선택</title></path>
<polygon data-arrowhead="root.0.2" points="960.000,426.350 954.000,416.350 966.000,416.350" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="165.950" font-size="36" font-weight="700" fill="#111827">live replication과 Batch Replication이 다루는 객체가 다릅니다</text>
<text data-source="root.0.1" x="88.000" y="254.550" font-size="28" font-weight="700" fill="#111827">원본 버킷</text>
<text data-source="root.0.1" x="88.000" y="296.950" font-size="22" font-weight="400" fill="#111827">source와 destination 모두 versioning 필요, Object Lock이면 대상에도 활성화</text>
<text data-source="root.0.3.0.0" x="88.000" y="490.350" font-size="28" font-weight="700" fill="#111827">live replication</text>
<text data-source="root.0.3.0.1.0" x="144.000" y="576.150" font-size="28" font-weight="700" fill="#111827">CRR 또는 SRR</text>
<text data-source="root.0.3.0.1.0" x="144.000" y="618.550" font-size="22" font-weight="400" fill="#111827">규칙 설정 뒤 생성 또는 갱신된 객체만</text>
<text data-source="root.0.3.0.1.2" x="144.000" y="798.250" font-size="28" font-weight="700" fill="#111827">대상 버킷</text>
<text data-source="root.0.3.0.1.2" x="144.000" y="840.650" font-size="22" font-weight="400" fill="#111827">versioning을 끄면 FAILED</text>
<text data-source="root.0.3.0.1.1" x="128.000" y="690.250" font-size="22" font-weight="400" fill="#111827">RTC는 15분 SLA</text>
<text data-source="root.0.3.1.0" x="693.333" y="490.350" font-size="28" font-weight="700" fill="#111827">Batch Replication</text>
<text data-source="root.0.3.1.1.0" x="749.333" y="576.150" font-size="28" font-weight="700" fill="#111827">S3 Batch Replication</text>
<text data-source="root.0.3.1.1.0" x="749.333" y="618.550" font-size="22" font-weight="400" fill="#111827">기존 객체, 실패 재시도, 복제본의 복제</text>
<text data-source="root.0.3.1.1.2" x="749.333" y="798.250" font-size="28" font-weight="700" fill="#111827">대상 버킷</text>
<text data-source="root.0.3.1.1.2" x="749.333" y="840.650" font-size="22" font-weight="400" fill="#111827">live와 같은 destination</text>
<text data-source="root.0.3.1.1.1" x="733.333" y="690.250" font-size="22" font-weight="400" fill="#111827">RTC SLA 없음</text>
<text data-source="root.0.3.2.0" x="1298.667" y="490.350" font-size="28" font-weight="700" fill="#111827">어느 경로도 처리하지 않음</text>
<text data-source="root.0.3.2.1.0" x="1322.667" y="576.150" font-size="28" font-weight="700" fill="#111827">복제 제외 항목</text>
<text data-source="root.0.3.2.1.0" x="1322.667" y="618.550" font-size="22" font-weight="400" fill="#111827">version ID를 지정한 DELETE, lifecycle이 만든 액션과</text>
<text data-source="root.0.3.2.1.0" x="1322.667" y="648.250" font-size="22" font-weight="400" fill="#111827">delete marker</text>
<text data-source="root.0.3.2.1.1" x="1322.667" y="755.950" font-size="28" font-weight="700" fill="#111827">버킷 레벨 항목과 Glacier 계열</text>
<text data-source="root.0.3.2.1.1" x="1322.667" y="798.350" font-size="22" font-weight="400" fill="#111827">서브리소스와 아카이브 티어 객체도 제외</text>
<text data-source="root.0.4" x="64.000" y="942.350" font-size="22" font-weight="400" fill="#111827">live replication은 규칙 설정 이전 객체를 보지 않습니다. 복제본의 복제와 실패 객체 재처리는 Batch Replication으로만 수행합니다.</text>
<text data-source="root.0.2" x="980.000" y="390.650" font-size="22" font-weight="400" fill="#111827">복제 범위 선택</text>
</svg>
