<path data-edge="root.0.3.0.1.1" data-from="root.0.3.0.1.0" data-to="root.0.3.0.1.2" d="M 370.667 655.400 L 370.667 741.100" fill="none" stroke="#475569" stroke-width="3"><title>RTC는 15분 SLA</title></path>
<polygon data-arrowhead="root.0.3.0.1.1" points="370.667,741.100 364.667,731.100 376.667,731.100" fill="#475569"/>
<path data-edge="root.0.3.1.1.1" data-from="root.0.3.1.1.0" data-to="root.0.3.1.1.2" d="M 960.000 655.400 L 960.000 741.100" fill="none" stroke="#475569" stroke-width="3"><title>RTC SLA 없음</title></path>
<polygon data-arrowhead="root.0.3.1.1.1" points="960.000,741.100 954.000,731.100 966.000,731.100" fill="#475569"/>
<path data-edge="root.0.2" data-from="root.0.1" data-to="root.0.3" d="M 960.000 309.800 L 960.000 395.500" fill="none" stroke="#475569" stroke-width="3"><title>복제 범위 선택</title></path>
<polygon data-arrowhead="root.0.2" points="960.000,395.500 954.000,385.500 966.000,385.500" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="135.100" font-size="36" font-weight="700" fill="#111827">live replication과 Batch Replication이 다루는 객체가 다릅니다</text>
<text data-source="root.0.1" x="88.000" y="223.700" font-size="28" font-weight="700" fill="#111827">원본 버킷</text>
<text data-source="root.0.1" x="88.000" y="266.100" font-size="22" font-weight="400" fill="#111827">source와 destination 모두 versioning 필요, Object Lock이면 대상에도 활성화</text>
<text data-source="root.0.3.0.0" x="112.000" y="483.500" font-size="28" font-weight="700" fill="#111827">live replication</text>
<text data-source="root.0.3.0.1.0" x="136.000" y="569.300" font-size="28" font-weight="700" fill="#111827">CRR 또는 SRR</text>
<text data-source="root.0.3.0.1.0" x="136.000" y="611.700" font-size="22" font-weight="400" fill="#111827">규칙 설정 뒤 생성 또는 갱신된 객체만</text>
<text data-source="root.0.3.0.1.2" x="136.000" y="805.100" font-size="28" font-weight="700" fill="#111827">대상 버킷</text>
<text data-source="root.0.3.0.1.2" x="136.000" y="847.500" font-size="22" font-weight="400" fill="#111827">versioning을 끄면 FAILED</text>
<text data-source="root.0.3.0.1.1" x="390.667" y="705.400" font-size="22" font-weight="400" fill="#111827">RTC는 15분 SLA</text>
<text data-source="root.0.3.1.0" x="701.333" y="483.500" font-size="28" font-weight="700" fill="#111827">Batch Replication</text>
<text data-source="root.0.3.1.1.0" x="725.333" y="569.300" font-size="28" font-weight="700" fill="#111827">S3 Batch Replication</text>
<text data-source="root.0.3.1.1.0" x="725.333" y="611.700" font-size="22" font-weight="400" fill="#111827">기존 객체, 실패 재시도, 복제본의 복제</text>
<text data-source="root.0.3.1.1.2" x="725.333" y="805.100" font-size="28" font-weight="700" fill="#111827">대상 버킷</text>
<text data-source="root.0.3.1.1.2" x="725.333" y="847.500" font-size="22" font-weight="400" fill="#111827">live와 같은 destination</text>
<text data-source="root.0.3.1.1.1" x="980.000" y="705.400" font-size="22" font-weight="400" fill="#111827">RTC SLA 없음</text>
<text data-source="root.0.3.2.0" x="1290.667" y="483.500" font-size="28" font-weight="700" fill="#111827">어느 경로도 처리하지 않음</text>
<text data-source="root.0.3.2.1.0" x="1314.667" y="569.300" font-size="28" font-weight="700" fill="#111827">복제 제외 항목</text>
<text data-source="root.0.3.2.1.0" x="1314.667" y="611.700" font-size="22" font-weight="400" fill="#111827">version ID를 지정한 DELETE, lifecycle이 만든</text>
<text data-source="root.0.3.2.1.0" x="1314.667" y="641.400" font-size="22" font-weight="400" fill="#111827">액션과 delete marker</text>
<text data-source="root.0.3.2.1.1" x="1314.667" y="749.100" font-size="28" font-weight="700" fill="#111827">버킷 레벨 항목과 Glacier 계열</text>
<text data-source="root.0.3.2.1.1" x="1314.667" y="791.500" font-size="22" font-weight="400" fill="#111827">서브리소스와 아카이브 티어 객체도 제외</text>
<text data-source="root.0.4" x="64.000" y="973.200" font-size="22" font-weight="400" fill="#111827">live replication은 규칙 설정 이전 객체를 보지 않습니다. 복제본의 복제와 실패 객체 재처리는 Batch Replication으로만 수행합니다.</text>
<text data-source="root.0.2" x="980.000" y="359.800" font-size="22" font-weight="400" fill="#111827">복제 범위 선택</text>
</svg>
