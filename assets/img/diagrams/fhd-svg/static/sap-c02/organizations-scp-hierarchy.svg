<rect data-node="root.0.1.2.2.1.2" x="1068.000" y="815.300" width="342.000" height="102.600" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<path data-edge="root.0.1.2.1.1.1" data-from="root.0.1.2.1.1.0" data-to="root.0.1.2.1.1.2" d="M 1617.000 318.400 L 1617.000 374.400" fill="none" stroke="#475569" stroke-width="3"><title>계정에 상속</title></path>
