<path data-edge="root.0.1.2.2.1.1" data-from="root.0.1.2.2.1.0" data-to="root.0.1.2.2.1.2" d="M 1239.000 747.300 L 1239.000 803.300" fill="none" stroke="#475569" stroke-width="3"><title>계정에 상속</title></path>
<polygon data-arrowhead="root.0.1.2.2.1.1" points="1239.000,803.300 1233.000,793.300 1245.000,793.300" fill="#475569"/>
<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 900.000 553.500 L 1020.000 553.500" fill="none" stroke="#475569" stroke-width="3"><title>Root에서 자식 경로로 분기</title></path>
<polygon data-arrowhead="root.0.1.1" points="1020.000,553.500 1010.000,559.500 1010.000,547.500" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="128.500" font-size="36" font-weight="700" fill="#111827">SCP는 경로의 모든 레벨에서 교집합으로 적용된다</text>
<text data-source="root.0.1.0.0" x="108.000" y="512.850" font-size="18" font-weight="700" fill="#111827">조직 Root</text>
<text data-source="root.0.1.0.1" x="120.000" y="561.150" font-size="18" font-weight="700" fill="#111827">Root SCP</text>
<text data-source="root.0.1.0.1" x="120.000" y="594.550" font-size="16" font-weight="400" fill="#111827">Root는 모든 OU와 계정에 내려가는 SCP 부착 지점이다.</text>
<text data-source="root.0.1.2.0.0" x="1068.000" y="207.100" font-size="18" font-weight="700" fill="#111827">management account 예외</text>
<text data-source="root.0.1.2.0.1" x="1080.000" y="255.400" font-size="18" font-weight="700" fill="#111827">management account</text>
<text data-source="root.0.1.2.0.1" x="1080.000" y="288.800" font-size="16" font-weight="400" fill="#111827">management account의 principal에는 SCP가</text>
<text data-source="root.0.1.2.0.1" x="1080.000" y="310.400" font-size="16" font-weight="400" fill="#111827">적용되지 않는다.</text>
<text data-source="root.0.1.2.1.0" x="1446.000" y="207.100" font-size="18" font-weight="700" fill="#111827">Security OU</text>
<text data-source="root.0.1.2.1.1.0" x="1458.000" y="255.400" font-size="18" font-weight="700" fill="#111827">Security OU SCP</text>
<text data-source="root.0.1.2.1.1.0" x="1458.000" y="288.800" font-size="16" font-weight="400" fill="#111827">OU 경로에 정책을 부착한다.</text>
<text data-source="root.0.1.2.1.1.2.0" x="1482.000" y="440.400" font-size="18" font-weight="700" fill="#111827">Audit 계정</text>
<text data-source="root.0.1.2.1.1.2.0" x="1482.000" y="473.800" font-size="16" font-weight="400" fill="#111827">Root와 Security</text>
<text data-source="root.0.1.2.1.1.2.0" x="1482.000" y="495.400" font-size="16" font-weight="400" fill="#111827">OU SCP가 모두</text>
<text data-source="root.0.1.2.1.1.2.0" x="1482.000" y="517.000" font-size="16" font-weight="400" fill="#111827">적용된다.</text>
<text data-source="root.0.1.2.1.1.2.1" x="1635.000" y="440.400" font-size="18" font-weight="700" fill="#111827">Log archive</text>
<text data-source="root.0.1.2.1.1.2.1" x="1635.000" y="463.800" font-size="18" font-weight="700" fill="#111827">계정</text>
<text data-source="root.0.1.2.1.1.2.1" x="1635.000" y="497.200" font-size="16" font-weight="400" fill="#111827">Root와 Security</text>
<text data-source="root.0.1.2.1.1.2.1" x="1635.000" y="518.800" font-size="16" font-weight="400" fill="#111827">OU SCP가 모두</text>
<text data-source="root.0.1.2.1.1.2.1" x="1635.000" y="540.400" font-size="16" font-weight="400" fill="#111827">적용된다.</text>
<text data-source="root.0.1.2.1.1.1" x="1637.000" y="351.600" font-size="16" font-weight="400" fill="#111827">계정에 상속</text>
<text data-source="root.0.1.2.2.0" x="1068.000" y="636.000" font-size="18" font-weight="700" fill="#111827">Workloads OU</text>
<text data-source="root.0.1.2.2.1.0" x="1080.000" y="684.300" font-size="18" font-weight="700" fill="#111827">Workloads OU SCP</text>
<text data-source="root.0.1.2.2.1.0" x="1080.000" y="717.700" font-size="16" font-weight="400" fill="#111827">운영 계정의 추가 제약을 정의한다.</text>
<text data-source="root.0.1.2.2.1.2" x="1080.000" y="845.300" font-size="18" font-weight="700" fill="#111827">Prod 계정</text>
<text data-source="root.0.1.2.2.1.2" x="1080.000" y="878.700" font-size="16" font-weight="400" fill="#111827">root user를 포함한 principal에도 SCP가</text>
<text data-source="root.0.1.2.2.1.2" x="1080.000" y="900.300" font-size="16" font-weight="400" fill="#111827">적용된다.</text>
<text data-source="root.0.1.2.2.1.1" x="1259.000" y="780.500" font-size="16" font-weight="400" fill="#111827">계정에 상속</text>
<text data-source="root.0.1.1" x="892.000" y="514.300" font-size="16" font-weight="400" fill="#111827">Root에서 자식</text>
<text data-source="root.0.1.1" x="892.000" y="535.900" font-size="16" font-weight="400" fill="#111827">경로로 분기</text>
<text data-source="root.0.2" x="64.000" y="981.900" font-size="16" font-weight="400" fill="#111827">실행 가능 권한은 Root, OU, 계정에 붙은 정책의 교집합으로 결정된다.</text>
</svg>
