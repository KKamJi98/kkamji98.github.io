<text data-source="root.0.0" x="64.000" y="174.250" font-size="36" font-weight="700" fill="#111827">운영 신호를 EventBridge 한 곳으로 모은다</text>
<text data-source="root.0.1.0.0" x="112.000" y="238.850" font-size="20" font-weight="700" fill="#111827">운영 신호의 출처</text>
<text data-source="root.0.1.0.1.0" x="128.000" y="297.850" font-size="20" font-weight="700" fill="#111827">CloudWatch alarm</text>
<text data-source="root.0.1.0.1.0" x="128.000" y="333.850" font-size="18" font-weight="400" fill="#111827">ALARM 전이. composite</text>
<text data-source="root.0.1.0.1.0" x="128.000" y="358.150" font-size="18" font-weight="400" fill="#111827">alarm도 같은 전이</text>
<text data-source="root.0.1.0.1.0" x="128.000" y="382.450" font-size="18" font-weight="400" fill="#111827">신호를 낸다.</text>
<text data-source="root.0.1.0.1.1" x="386.667" y="297.850" font-size="20" font-weight="700" fill="#111827">Config rule</text>
<text data-source="root.0.1.0.1.1" x="386.667" y="333.850" font-size="18" font-weight="400" fill="#111827">구성이 기준을 벗어난</text>
<text data-source="root.0.1.0.1.1" x="386.667" y="358.150" font-size="18" font-weight="400" fill="#111827">NON_COMPLIANT</text>
<text data-source="root.0.1.0.1.1" x="386.667" y="382.450" font-size="18" font-weight="400" fill="#111827">상태다.</text>
<text data-source="root.0.1.0.1.2" x="645.333" y="297.850" font-size="20" font-weight="700" fill="#111827">AWS Health 이벤트</text>
<text data-source="root.0.1.0.1.2" x="645.333" y="333.850" font-size="18" font-weight="400" fill="#111827">EventBridge 수신은 모든</text>
<text data-source="root.0.1.0.1.2" x="645.333" y="358.150" font-size="18" font-weight="400" fill="#111827">고객에게 무료다. Health</text>
<text data-source="root.0.1.0.1.2" x="645.333" y="382.450" font-size="18" font-weight="400" fill="#111827">API는 Business</text>
<text data-source="root.0.1.0.1.2" x="645.333" y="406.750" font-size="18" font-weight="400" fill="#111827">Support+ 이상이다.</text>
<text data-source="root.0.1.0.1.3" x="128.000" y="481.050" font-size="20" font-weight="700" fill="#111827">CloudTrail API</text>
<text data-source="root.0.1.0.1.3" x="128.000" y="507.050" font-size="20" font-weight="700" fill="#111827">이벤트</text>
<text data-source="root.0.1.0.1.3" x="128.000" y="543.050" font-size="18" font-weight="400" fill="#111827">평균 약 5분 안에</text>
<text data-source="root.0.1.0.1.3" x="128.000" y="567.350" font-size="18" font-weight="400" fill="#111827">전달되지만 보장 지연은</text>
<text data-source="root.0.1.0.1.3" x="128.000" y="591.650" font-size="18" font-weight="400" fill="#111827">아니다.</text>
<text data-source="root.0.1.2" x="1048.000" y="405.250" font-size="20" font-weight="700" fill="#111827">EventBridge rule</text>
<text data-source="root.0.1.2" x="1048.000" y="441.250" font-size="18" font-weight="400" fill="#111827">bus당 기본 300개 rule, rule당 target 5개로 고정되며 pattern은 최대 2,048자다.</text>
<text data-source="root.0.1.4.0" x="112.000" y="761.950" font-size="20" font-weight="700" fill="#111827">SSM Automation</text>
<text data-source="root.0.1.4.0" x="112.000" y="787.950" font-size="20" font-weight="700" fill="#111827">runbook</text>
<text data-source="root.0.1.4.0" x="112.000" y="823.950" font-size="18" font-weight="400" fill="#111827">승인 단계와 rate</text>
<text data-source="root.0.1.4.0" x="112.000" y="848.250" font-size="18" font-weight="400" fill="#111827">control을 넣어 무인</text>
<text data-source="root.0.1.4.0" x="112.000" y="872.550" font-size="18" font-weight="400" fill="#111827">교정으로 잇는다.</text>
<text data-source="root.0.1.4.1" x="381.333" y="761.950" font-size="20" font-weight="700" fill="#111827">SNS 토픽</text>
<text data-source="root.0.1.4.1" x="381.333" y="797.950" font-size="18" font-weight="400" fill="#111827">target 5개를 넘길 때 추가</text>
<text data-source="root.0.1.4.1" x="381.333" y="822.250" font-size="18" font-weight="400" fill="#111827">팬아웃 지점이 된다.</text>
<text data-source="root.0.1.4.2" x="650.667" y="761.950" font-size="20" font-weight="700" fill="#111827">OpsCenter OpsItem</text>
<text data-source="root.0.1.4.2" x="650.667" y="797.950" font-size="18" font-weight="400" fill="#111827">Open, In progress,</text>
<text data-source="root.0.1.4.2" x="650.667" y="822.250" font-size="18" font-weight="400" fill="#111827">Resolved 상태로</text>
<text data-source="root.0.1.4.2" x="650.667" y="846.550" font-size="18" font-weight="400" fill="#111827">추적한다. related</text>
<text data-source="root.0.1.4.2" x="650.667" y="870.850" font-size="18" font-weight="400" fill="#111827">resource 최대 100개와</text>
<text data-source="root.0.1.4.2" x="650.667" y="895.150" font-size="18" font-weight="400" fill="#111827">deduplication string을</text>
<text data-source="root.0.1.4.2" x="650.667" y="919.450" font-size="18" font-weight="400" fill="#111827">지원한다.</text>
<text data-source="root.0.1.1" x="892.000" y="373.800" font-size="18" font-weight="400" fill="#111827">event pattern</text>
<text data-source="root.0.1.1" x="892.000" y="398.100" font-size="18" font-weight="400" fill="#111827">매칭</text>
<text data-source="root.0.1.3" x="104.000" y="669.950" font-size="18" font-weight="400" fill="#111827">target으로 분기</text>
</svg>
