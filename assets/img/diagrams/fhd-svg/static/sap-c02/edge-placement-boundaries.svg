<polygon data-arrowhead="root.0.2.1.2" points="960.000,492.400 954.000,482.400 966.000,482.400" fill="#475569"/>
<path data-edge="root.0.2.2.2" data-from="root.0.2.2.1" data-to="root.0.2.2.3" d="M 1548.000 417.400 L 1548.000 492.400" fill="none" stroke="#475569" stroke-width="3"><title>LGW 또는 LNI</title></path>
<polygon data-arrowhead="root.0.2.2.2" points="1548.000,492.400 1542.000,482.400 1554.000,482.400" fill="#475569"/>
<path data-edge="root.0.3" data-from="root.0.2" data-to="root.0.4" d="M 960.000 799.600 L 960.000 874.600" fill="none" stroke="#475569" stroke-width="3"><title>공통 관리 경계</title></path>
<polygon data-arrowhead="root.0.3" points="960.000,874.600 954.000,864.600 966.000,864.600" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="119.200" font-size="36" font-weight="700" fill="#111827">엣지 배치는 시설 소유자와 진입 게이트웨이로 갈린다</text>
<text data-source="root.0.1" x="64.000" y="171.800" font-size="20" font-weight="400" fill="#111827">인터넷 사용자, 통신사 단말, 시설 내부 시스템의 진입 경로가 다르고 네 배치 모두 부모 리전 control plane에 묶여 관리됩니다.</text>
<text data-source="root.0.2.0.0" x="108.000" y="266.800" font-size="24" font-weight="700" fill="#111827">AWS가 운영하는 위치</text>
<text data-source="root.0.2.0.1" x="128.000" y="339.200" font-size="24" font-weight="700" fill="#111827">인터넷 사용자</text>
<text data-source="root.0.2.0.1" x="128.000" y="378.400" font-size="20" font-weight="400" fill="#111827">유선과 일반 모바일 회선에서 들어옵니다.</text>
<text data-source="root.0.2.0.3.0" x="152.000" y="572.400" font-size="24" font-weight="700" fill="#111827">리전 가용 영역</text>
<text data-source="root.0.2.0.3.0" x="152.000" y="611.600" font-size="20" font-weight="400" fill="#111827">internet gateway로</text>
<text data-source="root.0.2.0.3.0" x="152.000" y="638.600" font-size="20" font-weight="400" fill="#111827">진입합니다.</text>
<text data-source="root.0.2.0.3.1" x="402.000" y="572.400" font-size="24" font-weight="700" fill="#111827">Local Zone</text>
<text data-source="root.0.2.0.3.1" x="402.000" y="611.600" font-size="20" font-weight="400" fill="#111827">자체 인터넷과 Direct</text>
<text data-source="root.0.2.0.3.1" x="402.000" y="638.600" font-size="20" font-weight="400" fill="#111827">Connect를 쓰며</text>
<text data-source="root.0.2.0.3.1" x="402.000" y="665.600" font-size="20" font-weight="400" fill="#111827">zone마다 서비스가</text>
<text data-source="root.0.2.0.3.1" x="402.000" y="692.600" font-size="20" font-weight="400" fill="#111827">다릅니다.</text>
<text data-source="root.0.2.0.2" x="392.000" y="461.400" font-size="20" font-weight="400" fill="#111827">두 위치로 선택</text>
<text data-source="root.0.2.1.0" x="696.000" y="266.800" font-size="24" font-weight="700" fill="#111827">통신사 데이터센터</text>
<text data-source="root.0.2.1.1" x="716.000" y="339.200" font-size="24" font-weight="700" fill="#111827">통신사 네트워크 단말</text>
<text data-source="root.0.2.1.1" x="716.000" y="378.400" font-size="20" font-weight="400" fill="#111827">5G 단말처럼 통신사 네트워크 안에서만 진입합니다.</text>
<text data-source="root.0.2.1.3" x="716.000" y="548.400" font-size="24" font-weight="700" fill="#111827">Wavelength Zone</text>
<text data-source="root.0.2.1.3" x="716.000" y="587.600" font-size="20" font-weight="400" fill="#111827">일반 인터넷 inbound는 제공하지 않습니다.</text>
<text data-source="root.0.2.1.2" x="980.000" y="461.400" font-size="20" font-weight="400" fill="#111827">carrier gateway 전용</text>
<text data-source="root.0.2.2.0" x="1284.000" y="266.800" font-size="24" font-weight="700" fill="#111827">고객이 확보한 시설</text>
<text data-source="root.0.2.2.1" x="1304.000" y="339.200" font-size="24" font-weight="700" fill="#111827">시설 내부 시스템</text>
<text data-source="root.0.2.2.1" x="1304.000" y="378.400" font-size="20" font-weight="400" fill="#111827">공정 제어망과 데이터 레지던시 대상입니다.</text>
<text data-source="root.0.2.2.3" x="1304.000" y="548.400" font-size="24" font-weight="700" fill="#111827">Outposts</text>
<text data-source="root.0.2.2.3" x="1304.000" y="587.600" font-size="20" font-weight="400" fill="#111827">데이터가 고객 시설을 벗어나지 않도록 배치합니다.</text>
<text data-source="root.0.2.2.2" x="1568.000" y="461.400" font-size="20" font-weight="400" fill="#111827">LGW 또는 LNI</text>
<text data-source="root.0.4" x="84.000" y="930.600" font-size="24" font-weight="700" fill="#111827">부모 리전 control plane</text>
<text data-source="root.0.4" x="84.000" y="969.800" font-size="20" font-weight="400" fill="#111827">AZ, Local Zone, Wavelength Zone, Outposts 모두 부모 리전에 묶여 관리됩니다.</text>
<text data-source="root.0.3" x="980.000" y="843.600" font-size="20" font-weight="400" fill="#111827">공통 관리 경계</text>
</svg>
