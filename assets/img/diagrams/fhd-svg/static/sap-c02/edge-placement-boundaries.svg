<path data-edge="root.0.2.0.2" data-from="root.0.2.0.1" data-to="root.0.2.0.3" d="M 372.000 417.400 L 372.000 492.400" fill="none" stroke="#475569" stroke-width="3"><title>두 위치로 선택</title></path>
<polygon data-arrowhead="root.0.2.0.2" points="372.000,492.400 366.000,482.400 378.000,482.400" fill="#475569"/>
