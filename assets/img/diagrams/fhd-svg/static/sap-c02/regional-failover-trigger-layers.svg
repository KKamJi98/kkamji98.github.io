<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="9fbfacf4b308a87cf28b3f81c5a6641116e5037b37e8683b2735f5dcb0f7b0a8">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
<rect data-source="root.0.2" x="64.000" y="387.600" width="1792.000" height="409.400" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-source="root.0.2.0" x="88.000" y="411.600" width="860.000" height="302.000" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
