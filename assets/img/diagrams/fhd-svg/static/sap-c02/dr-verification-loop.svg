<path data-edge="root.0.2.9" data-from="root.0.2.8" data-to="root.0.2.10" d="M 900.000 935.850 L 1020.000 935.850" fill="none" stroke="#475569" stroke-width="3"><title>동일 목표로 다시 실행</title></path>
<polygon data-arrowhead="root.0.2.9" points="1020.000,935.850 1010.000,941.850 1010.000,929.850" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="119.550" font-size="36" font-weight="700" fill="#111827">복구 목표는 주입과 복원 검증을 거쳐야 숫자로 확인된다</text>
<text data-source="root.0.1" x="64.000" y="166.150" font-size="18" font-weight="400" fill="#111827">문서의 목표를 실제 실험으로 측정하고, 격차를 교정한 뒤 같은 기준으로 다시 검증합니다.</text>
<text data-source="root.0.2.0" x="112.000" y="377.550" font-size="20" font-weight="700" fill="#111827">복구 목표 확정</text>
<text data-source="root.0.2.0" x="112.000" y="413.550" font-size="18" font-weight="400" fill="#111827">워크로드마다 RTO와 RPO를 숫자로 고정합니다.</text>
<text data-source="root.0.2.2.0.0" x="1048.000" y="224.450" font-size="20" font-weight="700" fill="#111827">구성 평가와 복원</text>
<text data-source="root.0.2.2.0.1.0" x="1064.000" y="283.450" font-size="20" font-weight="700" fill="#111827">Resilience Hub 평가</text>
<text data-source="root.0.2.2.0.1.0" x="1064.000" y="319.450" font-size="18" font-weight="400" fill="#111827">현재 구성을 진단하고 Well-Architected</text>
<text data-source="root.0.2.2.0.1.0" x="1064.000" y="343.750" font-size="18" font-weight="400" fill="#111827">기반 개선을 권고합니다.</text>
<text data-source="root.0.2.2.0.1.2" x="1064.000" y="490.350" font-size="20" font-weight="700" fill="#111827">AWS Backup restore testing</text>
<text data-source="root.0.2.2.0.1.2" x="1064.000" y="526.350" font-size="18" font-weight="400" fill="#111827">복원 뒤 자동 삭제하며 검증은 API로</text>
<text data-source="root.0.2.2.0.1.2" x="1064.000" y="550.650" font-size="18" font-weight="400" fill="#111827">실행합니다.</text>
<text data-source="root.0.2.2.0.1.1" x="1246.000" y="416.050" font-size="18" font-weight="400" fill="#111827">스케줄 복원</text>
<text data-source="root.0.2.2.1.0" x="1452.000" y="224.450" font-size="20" font-weight="700" fill="#111827">장애 주입</text>
<text data-source="root.0.2.2.1.1.0" x="1468.000" y="283.450" font-size="20" font-weight="700" fill="#111827">FIS 실험</text>
<text data-source="root.0.2.2.1.1.0" x="1468.000" y="319.450" font-size="18" font-weight="400" fill="#111827">actions, targets, stop conditions로 실제</text>
<text data-source="root.0.2.2.1.1.0" x="1468.000" y="343.750" font-size="18" font-weight="400" fill="#111827">리소스에 액션을 수행합니다.</text>
<text data-source="root.0.2.4" x="112.000" y="720.950" font-size="20" font-weight="700" fill="#111827">관측과 판정</text>
<text data-source="root.0.2.4" x="112.000" y="756.950" font-size="18" font-weight="400" fill="#111827">stop condition alarm, 실제 소요 시간, 복원 성공 여부를 확인합니다.</text>
<text data-source="root.0.2.6" x="1048.000" y="720.950" font-size="20" font-weight="700" fill="#111827">목표 미달 격차</text>
<text data-source="root.0.2.6" x="1048.000" y="756.950" font-size="18" font-weight="400" fill="#111827">quota 미증설, 엔진 버전 불일치, 전환 미동작, 복원 실패를 기록합니다.</text>
<text data-source="root.0.2.8" x="112.000" y="924.700" font-size="20" font-weight="700" fill="#111827">교정</text>
<text data-source="root.0.2.8" x="112.000" y="960.700" font-size="18" font-weight="400" fill="#111827">quota와 복제 구성을 보완하고 전환 절차를 수정합니다.</text>
<text data-source="root.0.2.10" x="1032.000" y="941.700" font-size="18" font-weight="400" fill="#111827">교정 후 같은 FIS와 restore testing을 다시 돌려 RTO와 RPO 격차가 닫혔는지 확인합니다.</text>
<text data-source="root.0.2.1" x="892.000" y="346.100" font-size="18" font-weight="400" fill="#111827">평가와 실험을</text>
<text data-source="root.0.2.1" x="892.000" y="370.400" font-size="18" font-weight="400" fill="#111827">병렬 준비</text>
<text data-source="root.0.2.3" x="104.000" y="628.950" font-size="18" font-weight="400" fill="#111827">두 결과를 한곳에서 관측</text>
<text data-source="root.0.2.5" x="892.000" y="713.800" font-size="18" font-weight="400" fill="#111827">목표와 비교</text>
<text data-source="root.0.2.7" x="104.000" y="819.250" font-size="18" font-weight="400" fill="#111827">교정</text>
<text data-source="root.0.2.9" x="892.000" y="893.250" font-size="18" font-weight="400" fill="#111827">동일 목표로 다시</text>
<text data-source="root.0.2.9" x="892.000" y="917.550" font-size="18" font-weight="400" fill="#111827">실행</text>
</svg>
