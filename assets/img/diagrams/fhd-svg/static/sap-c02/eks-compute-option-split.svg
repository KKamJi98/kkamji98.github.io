<polygon data-arrowhead="root.0.2.1" points="1020.000,583.750 1010.000,589.750 1010.000,577.750" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="161.450" font-size="36" font-weight="700" fill="#111827">EKS 컴퓨트는 포기할 수 없는 요구 하나가 선택을 확정한다</text>
<text data-source="root.0.1" x="64.000" y="198.050" font-size="14" font-weight="400" fill="#111827">Windows와 custom CNI는 managed node group으로, 노드 운영 위임은 Auto Mode로, Pod별 VM 격리는 Fargate로, 자체 하드웨어는 Hybrid Nodes로 이어집니다.</text>
<text data-source="root.0.2.0" x="106.000" y="573.900" font-size="16" font-weight="700" fill="#111827">Pod 배치 요구</text>
<text data-source="root.0.2.0" x="106.000" y="604.700" font-size="14" font-weight="400" fill="#111827">포기할 수 없는 조건부터 확인합니다.</text>
<text data-source="root.0.2.2.0.0" x="1042.000" y="238.950" font-size="16" font-weight="700" fill="#111827">Windows와 custom CNI</text>
<text data-source="root.0.2.2.0.1.0" x="1052.000" y="280.550" font-size="16" font-weight="700" fill="#111827">Windows, custom AMI 와</text>
<text data-source="root.0.2.2.0.1.0" x="1052.000" y="301.350" font-size="16" font-weight="700" fill="#111827">CNI, launch template</text>
<text data-source="root.0.2.2.0.1.0" x="1052.000" y="322.150" font-size="16" font-weight="700" fill="#111827">부트스트랩</text>
<text data-source="root.0.2.2.0.1.0" x="1052.000" y="352.950" font-size="14" font-weight="400" fill="#111827">Pod별 security group(SGPP)은</text>
<text data-source="root.0.2.2.0.1.0" x="1052.000" y="371.850" font-size="14" font-weight="400" fill="#111827">Linux 전용입니다. Local Zone은</text>
<text data-source="root.0.2.2.0.1.0" x="1052.000" y="390.750" font-size="14" font-weight="400" fill="#111827">Auto Mode도 지원합니다.</text>
<text data-source="root.0.2.2.0.1.2" x="1052.000" y="507.650" font-size="16" font-weight="700" fill="#111827">managed node group</text>
<text data-source="root.0.2.2.0.1.2" x="1052.000" y="538.450" font-size="14" font-weight="400" fill="#111827">Windows, custom CNI, launch</text>
<text data-source="root.0.2.2.0.1.2" x="1052.000" y="557.350" font-size="14" font-weight="400" fill="#111827">template을 지원합니다.</text>
<text data-source="root.0.2.2.0.1.1" x="1180.667" y="448.200" font-size="14" font-weight="400" fill="#111827">지원 기능</text>
<text data-source="root.0.2.2.1.0" x="1309.333" y="238.950" font-size="16" font-weight="700" fill="#111827">노드 운영을 AWS에 위임</text>
<text data-source="root.0.2.2.1.1.0" x="1319.333" y="280.550" font-size="16" font-weight="700" fill="#111827">노드 운영을 AWS 에</text>
<text data-source="root.0.2.2.1.1.0" x="1319.333" y="301.350" font-size="16" font-weight="700" fill="#111827">넘긴다</text>
<text data-source="root.0.2.2.1.1.0" x="1319.333" y="332.150" font-size="14" font-weight="400" fill="#111827">오토스케일링과 CSI와 CNI를 직접</text>
<text data-source="root.0.2.2.1.1.0" x="1319.333" y="351.050" font-size="14" font-weight="400" fill="#111827">설치하지 않습니다.</text>
<text data-source="root.0.2.2.1.1.2" x="1319.333" y="467.950" font-size="16" font-weight="700" fill="#111827">EKS Auto Mode</text>
<text data-source="root.0.2.2.1.1.2" x="1319.333" y="498.750" font-size="14" font-weight="400" fill="#111827">Karpenter 기반이며 SSH와</text>
<text data-source="root.0.2.2.1.1.2" x="1319.333" y="517.650" font-size="14" font-weight="400" fill="#111827">SSM이 차단되고 노드는 최대</text>
<text data-source="root.0.2.2.1.1.2" x="1319.333" y="536.550" font-size="14" font-weight="400" fill="#111827">21일 후 교체됩니다.</text>
<text data-source="root.0.2.2.1.1.1" x="1448.000" y="408.500" font-size="14" font-weight="400" fill="#111827">관리형 노드</text>
<text data-source="root.0.2.2.2.0" x="1576.667" y="238.950" font-size="16" font-weight="700" fill="#111827">Pod마다 VM 경계</text>
<text data-source="root.0.2.2.2.1.0" x="1586.667" y="280.550" font-size="16" font-weight="700" fill="#111827">Pod 마다 VM 경계</text>
<text data-source="root.0.2.2.2.1.0" x="1586.667" y="311.350" font-size="14" font-weight="400" fill="#111827">DaemonSet과 privileged</text>
<text data-source="root.0.2.2.2.1.0" x="1586.667" y="330.250" font-size="14" font-weight="400" fill="#111827">container가 필요 없어야 합니다.</text>
<text data-source="root.0.2.2.2.1.2" x="1586.667" y="460.950" font-size="16" font-weight="700" fill="#111827">EKS Fargate</text>
<text data-source="root.0.2.2.2.1.2" x="1586.667" y="491.750" font-size="14" font-weight="400" fill="#111827">EBS mount, DaemonSet, GPU,</text>
<text data-source="root.0.2.2.2.1.2" x="1586.667" y="510.650" font-size="14" font-weight="400" fill="#111827">Arm, Windows를 지원하지</text>
<text data-source="root.0.2.2.2.1.2" x="1586.667" y="529.550" font-size="14" font-weight="400" fill="#111827">않습니다.</text>
<text data-source="root.0.2.2.2.1.1" x="1715.333" y="385.150" font-size="14" font-weight="400" fill="#111827">노드 없이</text>
<text data-source="root.0.2.2.2.1.1" x="1715.333" y="404.050" font-size="14" font-weight="400" fill="#111827">실행</text>
<text data-source="root.0.2.2.3.0" x="1042.000" y="618.250" font-size="16" font-weight="700" fill="#111827">노드를 자체 하드웨어에 둠</text>
<text data-source="root.0.2.2.3.1.0" x="1052.000" y="659.850" font-size="16" font-weight="700" fill="#111827">노드를 자체 하드웨어에</text>
<text data-source="root.0.2.2.3.1.0" x="1052.000" y="680.650" font-size="16" font-weight="700" fill="#111827">둔다</text>
<text data-source="root.0.2.2.3.1.0" x="1052.000" y="711.450" font-size="14" font-weight="400" fill="#111827">control plane은 AWS 리전에</text>
<text data-source="root.0.2.2.3.1.0" x="1052.000" y="730.350" font-size="14" font-weight="400" fill="#111827">남습니다.</text>
<text data-source="root.0.2.2.3.1.2" x="1052.000" y="861.050" font-size="16" font-weight="700" fill="#111827">Hybrid Nodes</text>
<text data-source="root.0.2.2.3.1.2" x="1052.000" y="891.850" font-size="14" font-weight="400" fill="#111827">EBS, EFS, S3 Files, FSx CSI가</text>
<text data-source="root.0.2.2.3.1.2" x="1052.000" y="910.750" font-size="14" font-weight="400" fill="#111827">모두 불가하며 NLB는 target type</text>
<text data-source="root.0.2.2.3.1.2" x="1052.000" y="929.650" font-size="14" font-weight="400" fill="#111827">ip만 됩니다.</text>
<text data-source="root.0.2.2.3.1.1" x="1180.667" y="785.250" font-size="14" font-weight="400" fill="#111827">외부 노드</text>
<text data-source="root.0.2.2.3.1.1" x="1180.667" y="804.150" font-size="14" font-weight="400" fill="#111827">등록</text>
<text data-source="root.0.2.1" x="892.000" y="566.850" font-size="14" font-weight="400" fill="#111827">요구별 경로</text>
</svg>
