<polygon data-arrowhead="root.0.2.1" points="1020.000,587.100 1010.000,593.100 1010.000,581.100" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="130.900" font-size="36" font-weight="700" fill="#111827">EKS 컴퓨트는 포기할 수 없는 요구 하나가 선택을 확정한다</text>
<text data-source="root.0.1" x="64.000" y="171.500" font-size="16" font-weight="400" fill="#111827">Windows와 custom CNI는 managed node group으로, 노드 운영 위임은 Auto Mode로, Pod별 VM 격리는 Fargate로, 자체 하드웨어는 Hybrid Nodes로 이어집니다.</text>
<text data-source="root.0.2.0" x="108.000" y="576.600" font-size="18" font-weight="700" fill="#111827">Pod 배치 요구</text>
<text data-source="root.0.2.0" x="108.000" y="610.000" font-size="16" font-weight="400" fill="#111827">포기할 수 없는 조건부터 확인합니다.</text>
<text data-source="root.0.2.2.0.0" x="1068.000" y="243.100" font-size="18" font-weight="700" fill="#111827">Windows와 custom CNI</text>
<text data-source="root.0.2.2.0.1.0" x="1080.000" y="291.400" font-size="18" font-weight="700" fill="#111827">Windows, custom AMI 와 CNI,</text>
<text data-source="root.0.2.2.0.1.0" x="1080.000" y="314.800" font-size="18" font-weight="700" fill="#111827">launch template 부트스트랩</text>
<text data-source="root.0.2.2.0.1.0" x="1080.000" y="348.200" font-size="16" font-weight="400" fill="#111827">Pod별 security group(SGPP)은 Linux</text>
<text data-source="root.0.2.2.0.1.0" x="1080.000" y="369.800" font-size="16" font-weight="400" fill="#111827">전용입니다. Local Zone은 Auto Mode도</text>
<text data-source="root.0.2.2.0.1.0" x="1080.000" y="391.400" font-size="16" font-weight="400" fill="#111827">지원합니다.</text>
<text data-source="root.0.2.2.0.1.2" x="1080.000" y="519.000" font-size="18" font-weight="700" fill="#111827">managed node group</text>
<text data-source="root.0.2.2.0.1.2" x="1080.000" y="552.400" font-size="16" font-weight="400" fill="#111827">Windows, custom CNI, launch</text>
<text data-source="root.0.2.2.0.1.2" x="1080.000" y="574.000" font-size="16" font-weight="400" fill="#111827">template을 지원합니다.</text>
<text data-source="root.0.2.2.0.1.1" x="1259.000" y="454.200" font-size="16" font-weight="400" fill="#111827">지원 기능</text>
<text data-source="root.0.2.2.1.0" x="1446.000" y="243.100" font-size="18" font-weight="700" fill="#111827">노드 운영을 AWS에 위임</text>
<text data-source="root.0.2.2.1.1.0" x="1458.000" y="291.400" font-size="18" font-weight="700" fill="#111827">노드 운영을 AWS 에 넘긴다</text>
<text data-source="root.0.2.2.1.1.0" x="1458.000" y="324.800" font-size="16" font-weight="400" fill="#111827">오토스케일링과 CSI와 CNI를</text>
<text data-source="root.0.2.2.1.1.0" x="1458.000" y="346.400" font-size="16" font-weight="400" fill="#111827">직접 설치하지 않습니다.</text>
<text data-source="root.0.2.2.1.1.2" x="1458.000" y="474.000" font-size="18" font-weight="700" fill="#111827">EKS Auto Mode</text>
<text data-source="root.0.2.2.1.1.2" x="1458.000" y="507.400" font-size="16" font-weight="400" fill="#111827">Karpenter 기반이며 SSH와 SSM이</text>
<text data-source="root.0.2.2.1.1.2" x="1458.000" y="529.000" font-size="16" font-weight="400" fill="#111827">차단되고 노드는 최대 21일 후 교체됩니다.</text>
<text data-source="root.0.2.2.1.1.1" x="1637.000" y="409.200" font-size="16" font-weight="400" fill="#111827">관리형 노드</text>
<text data-source="root.0.2.2.2.0" x="1068.000" y="645.600" font-size="18" font-weight="700" fill="#111827">Pod마다 VM 경계</text>
<text data-source="root.0.2.2.2.1.0" x="1080.000" y="693.900" font-size="18" font-weight="700" fill="#111827">Pod 마다 VM 경계</text>
<text data-source="root.0.2.2.2.1.0" x="1080.000" y="727.300" font-size="16" font-weight="400" fill="#111827">DaemonSet과 privileged container가</text>
<text data-source="root.0.2.2.2.1.0" x="1080.000" y="748.900" font-size="16" font-weight="400" fill="#111827">필요 없어야 합니다.</text>
<text data-source="root.0.2.2.2.1.2" x="1080.000" y="876.500" font-size="18" font-weight="700" fill="#111827">EKS Fargate</text>
<text data-source="root.0.2.2.2.1.2" x="1080.000" y="909.900" font-size="16" font-weight="400" fill="#111827">EBS mount, DaemonSet, GPU, Arm,</text>
<text data-source="root.0.2.2.2.1.2" x="1080.000" y="931.500" font-size="16" font-weight="400" fill="#111827">Windows를 지원하지 않습니다.</text>
<text data-source="root.0.2.2.2.1.1" x="1259.000" y="811.700" font-size="16" font-weight="400" fill="#111827">노드 없이 실행</text>
<text data-source="root.0.2.2.3.0" x="1446.000" y="645.600" font-size="18" font-weight="700" fill="#111827">노드를 자체 하드웨어에 둠</text>
<text data-source="root.0.2.2.3.1.0" x="1458.000" y="693.900" font-size="18" font-weight="700" fill="#111827">노드를 자체 하드웨어에 둔다</text>
<text data-source="root.0.2.2.3.1.0" x="1458.000" y="727.300" font-size="16" font-weight="400" fill="#111827">control plane은 AWS 리전에 남습니다.</text>
<text data-source="root.0.2.2.3.1.2" x="1458.000" y="854.900" font-size="18" font-weight="700" fill="#111827">Hybrid Nodes</text>
<text data-source="root.0.2.2.3.1.2" x="1458.000" y="888.300" font-size="16" font-weight="400" fill="#111827">EBS, EFS, S3 Files, FSx CSI가 모두</text>
<text data-source="root.0.2.2.3.1.2" x="1458.000" y="909.900" font-size="16" font-weight="400" fill="#111827">불가하며 NLB는 target type ip만 됩니다.</text>
<text data-source="root.0.2.2.3.1.1" x="1637.000" y="790.100" font-size="16" font-weight="400" fill="#111827">외부 노드 등록</text>
<text data-source="root.0.2.1" x="892.000" y="569.500" font-size="16" font-weight="400" fill="#111827">요구별 경로</text>
</svg>
