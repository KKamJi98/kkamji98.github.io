<rect data-source="root.0.2.2" x="64.000" y="529.300" width="888.000" height="462.200" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect data-node="root.0.2.0.1" x="80.000" y="252.400" width="856.000" height="94.300" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.2.0.2" x="80.000" y="362.700" width="856.000" height="94.300" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.1.1" x="984.000" y="252.400" width="856.000" height="94.300" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.1.2" x="984.000" y="362.700" width="856.000" height="94.300" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.2.1" x="80.000" y="588.300" width="856.000" height="94.300" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<rect data-node="root.0.2.2.2" x="80.000" y="698.600" width="856.000" height="94.300" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect data-node="root.0.2.2.3.1" x="80.000" y="881.200" width="856.000" height="94.300" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<path data-edge="root.0.2.2.3.0" data-from="root.0.2.2.1" data-to="root.0.2.2.3.1" d="M 948.000 635.450 L 960.000 635.450 L 960.000 928.350 L 948.000 928.350" fill="none" stroke="#475569" stroke-width="3"><title>CloudFront 캐시 미스일 때</title></path>
<polygon data-arrowhead="root.0.2.2.3.0" points="948.000,928.350 958.000,922.350 958.000,934.350" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="124.500" font-size="36" font-weight="700" fill="#111827">요청이 어디로 갈지는 세 계층에서 각각 결정된다</text>
<text data-source="root.0.1" x="64.000" y="171.100" font-size="18" font-weight="400" fill="#111827">이름 해석, 애니캐스트 연결, 엣지 캐시는 서로 다른 입력으로 목적지를 결정합니다. 아래는 선택 가능한 메커니즘의 비교이며 모든 요청이 세 서비스를 차례로 거치는 경로가 아닙니다.</text>
<text data-source="root.0.2.0.0" x="80.000" y="229.400" font-size="20" font-weight="700" fill="#111827">DNS 응답 계층</text>
<text data-source="root.0.2.0.1" x="96.000" y="288.400" font-size="20" font-weight="700" fill="#111827">Route 53 응답</text>
<text data-source="root.0.2.0.1" x="96.000" y="324.400" font-size="18" font-weight="400" fill="#111827">어느 리전의 주소를 응답할지 정합니다.</text>
<text data-source="root.0.2.0.2" x="96.000" y="398.700" font-size="20" font-weight="700" fill="#111827">라우팅 정책과 health check</text>
<text data-source="root.0.2.0.2" x="96.000" y="434.700" font-size="18" font-weight="400" fill="#111827">전환 지연은 TTL과 resolver 캐시가 만듭니다.</text>
<text data-source="root.0.2.0.3" x="80.000" y="491.000" font-size="18" font-weight="400" fill="#111827">클라이언트는 이름을 해석한 주소로 연결합니다.</text>
<text data-source="root.0.2.1.0" x="984.000" y="229.400" font-size="20" font-weight="700" fill="#111827">애니캐스트 IP 계층</text>
<text data-source="root.0.2.1.1" x="1000.000" y="288.400" font-size="20" font-weight="700" fill="#111827">Global Accelerator</text>
<text data-source="root.0.2.1.1" x="1000.000" y="324.400" font-size="18" font-weight="400" fill="#111827">고정 IP로 받고 캐시하지 않습니다.</text>
<text data-source="root.0.2.1.2" x="1000.000" y="398.700" font-size="20" font-weight="700" fill="#111827">traffic dial과 endpoint weight</text>
<text data-source="root.0.2.1.2" x="1000.000" y="434.700" font-size="18" font-weight="400" fill="#111827">기존 연결은 TCP idle timeout까지 현재 endpoint에 머뭅니다.</text>
<text data-source="root.0.2.1.3" x="984.000" y="491.000" font-size="18" font-weight="400" fill="#111827">선택된 endpoint로 연결을 전달합니다.</text>
<text data-source="root.0.2.2.0" x="80.000" y="565.300" font-size="20" font-weight="700" fill="#111827">엣지 캐시 계층</text>
<text data-source="root.0.2.2.1" x="96.000" y="624.300" font-size="20" font-weight="700" fill="#111827">CloudFront 엣지</text>
<text data-source="root.0.2.2.1" x="96.000" y="660.300" font-size="18" font-weight="400" fill="#111827">캐시 히트면 오리진에 가지 않습니다.</text>
<text data-source="root.0.2.2.2" x="96.000" y="734.600" font-size="20" font-weight="700" fill="#111827">캐시 키와 TTL과 origin group</text>
<text data-source="root.0.2.2.2" x="96.000" y="770.600" font-size="18" font-weight="400" fill="#111827">minimum TTL이 오리진 지시를 덮을 수 있습니다.</text>
<text data-source="root.0.2.2.3.1" x="96.000" y="917.200" font-size="20" font-weight="700" fill="#111827">리전 오리진</text>
<text data-source="root.0.2.2.3.1" x="96.000" y="953.200" font-size="18" font-weight="400" fill="#111827">CloudFront가 origin 요청을 전달합니다.</text>
<text data-source="root.0.2.2.3.0" x="100.000" y="826.900" font-size="18" font-weight="400" fill="#111827">CloudFront 캐시 미스일 때</text>
</svg>
