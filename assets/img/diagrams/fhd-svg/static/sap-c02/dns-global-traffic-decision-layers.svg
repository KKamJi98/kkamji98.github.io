<svg class="sd-fhd-artwork" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" data-source-sha256="9bf7fde533d84a7430359beb7d6d1a485214f9ed9f58984b741fcc3e8511e4a2">
<rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
