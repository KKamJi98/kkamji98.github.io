<text data-source="root.0.0" x="64.000" y="121.550" font-size="36" font-weight="700" fill="#111827">appliance mode가 요청과 응답의 AZ를 고정합니다</text>
<text data-source="root.0.1.0.0" x="88.000" y="210.150" font-size="28" font-weight="700" fill="#111827">appliance mode 끔</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="314.150" font-size="28" font-weight="700" fill="#111827">출발지 VPC AZ-a</text>
<text data-source="root.0.1.0.1.0" x="144.000" y="356.550" font-size="22" font-weight="400" fill="#111827">요청 방향</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="295.950" font-size="28" font-weight="700" fill="#111827">검사 어플라이언스</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="332.350" font-size="28" font-weight="700" fill="#111827">AZ-a</text>
<text data-source="root.0.1.0.1.2" x="602.000" y="374.750" font-size="22" font-weight="400" fill="#111827">여기서 세션 생성</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="572.650" font-size="28" font-weight="700" fill="#111827">목적지 VPC</text>
<text data-source="root.0.1.0.1.4" x="144.000" y="615.050" font-size="22" font-weight="400" fill="#111827">응답을 되돌려 보냄</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="554.450" font-size="28" font-weight="700" fill="#111827">검사 어플라이언스</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="590.850" font-size="28" font-weight="700" fill="#111827">AZ-b</text>
<text data-source="root.0.1.0.1.6" x="602.000" y="633.250" font-size="22" font-weight="400" fill="#111827">세션 테이블에 없는 패킷</text>
<text data-source="root.0.1.0.1.8" x="144.000" y="812.950" font-size="28" font-weight="700" fill="#111827">드롭</text>
<text data-source="root.0.1.0.1.8" x="144.000" y="855.350" font-size="22" font-weight="400" fill="#111827">같은 조합에서 성공과 실패가</text>
<text data-source="root.0.1.0.1.8" x="144.000" y="885.050" font-size="22" font-weight="400" fill="#111827">섞임</text>
<text data-source="root.0.1.0.1.1" x="438.000" y="305.500" font-size="22" font-weight="400" fill="#111827">요청 전달</text>
<text data-source="root.0.1.0.1.3" x="128.000" y="446.450" font-size="22" font-weight="400" fill="#111827">목적지로 전달</text>
<text data-source="root.0.1.0.1.5" x="438.000" y="534.300" font-size="22" font-weight="400" fill="#111827">응답이 다른</text>
<text data-source="root.0.1.0.1.5" x="438.000" y="564.000" font-size="22" font-weight="400" fill="#111827">AZ로 분산</text>
<text data-source="root.0.1.0.1.7" x="128.000" y="704.950" font-size="22" font-weight="400" fill="#111827">stateful 검사 실패</text>
<text data-source="root.0.1.1.0" x="996.000" y="210.150" font-size="28" font-weight="700" fill="#111827">appliance mode 켬</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="314.150" font-size="28" font-weight="700" fill="#111827">출발지 VPC AZ-a</text>
<text data-source="root.0.1.1.1.0" x="1052.000" y="356.550" font-size="22" font-weight="400" fill="#111827">요청과 응답이 같은 AZ</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="295.950" font-size="28" font-weight="700" fill="#111827">검사 어플라이언스</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="332.350" font-size="28" font-weight="700" fill="#111827">AZ-a</text>
<text data-source="root.0.1.1.1.2" x="1510.000" y="374.750" font-size="22" font-weight="400" fill="#111827">전체 세션이 같은 AZ</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="554.450" font-size="28" font-weight="700" fill="#111827">목적지 VPC</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="596.850" font-size="22" font-weight="400" fill="#111827">TGW를 여러 개 두면</text>
<text data-source="root.0.1.1.1.4" x="1052.000" y="626.550" font-size="22" font-weight="400" fill="#111827">stickiness가 깨질 수 있음</text>
<text data-source="root.0.1.1.1.1" x="1346.000" y="305.500" font-size="22" font-weight="400" fill="#111827">flow 고정</text>
<text data-source="root.0.1.1.1.3" x="1036.000" y="446.450" font-size="22" font-weight="400" fill="#111827">대칭 경로</text>
<text data-source="root.0.2" x="64.000" y="986.750" font-size="22" font-weight="400" fill="#111827">stateful appliance가 있는 VPC attachment에는 appliance mode가 필요합니다. 여러 TGW로 방향을 나누면 flow state를 공유하지 않아 같은 문제가 다시 생깁니다.</text>
