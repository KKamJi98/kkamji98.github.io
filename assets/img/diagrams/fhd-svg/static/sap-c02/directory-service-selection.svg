<text data-source="root.0.0" x="64.000" y="138.850" font-size="36" font-weight="700" fill="#111827">사용자 저장 위치로 Directory Service 선택</text>
<text data-source="root.0.1.0.0" x="76.000" y="193.450" font-size="18" font-weight="700" fill="#111827">온프레미스 AD 연동</text>
<text data-source="root.0.1.0.1" x="88.000" y="241.750" font-size="18" font-weight="700" fill="#111827">온프레미스 Active Directory</text>
<text data-source="root.0.1.0.1" x="88.000" y="275.150" font-size="16" font-weight="400" fill="#111827">기존 사용자가 저장된 출발점</text>
<text data-source="root.0.1.0.3.0.0" x="112.000" y="426.750" font-size="18" font-weight="700" fill="#111827">AWS Managed Microsoft AD</text>
<text data-source="root.0.1.0.3.0.1.0" x="156.000" y="475.050" font-size="18" font-weight="700" fill="#111827">실제 Windows Server AD</text>
<text data-source="root.0.1.0.3.0.1.0" x="156.000" y="508.450" font-size="16" font-weight="400" fill="#111827">온프레미스와 trust, schema</text>
<text data-source="root.0.1.0.3.0.1.0" x="156.000" y="530.050" font-size="16" font-weight="400" fill="#111827">extension 지원</text>
<text data-source="root.0.1.0.3.0.1.2" x="611.000" y="475.050" font-size="18" font-weight="700" fill="#111827">RDS for SQL Server</text>
<text data-source="root.0.1.0.3.0.1.2" x="611.000" y="508.450" font-size="16" font-weight="400" fill="#111827">세 선택지 중 Managed Microsoft</text>
<text data-source="root.0.1.0.3.0.1.2" x="611.000" y="530.050" font-size="16" font-weight="400" fill="#111827">AD만 지원</text>
<text data-source="root.0.1.0.3.1.0" x="978.000" y="426.750" font-size="18" font-weight="700" fill="#111827">AD Connector</text>
<text data-source="root.0.1.0.3.1.1.0" x="990.000" y="475.050" font-size="18" font-weight="700" fill="#111827">인증 프록시</text>
<text data-source="root.0.1.0.3.1.1.0" x="990.000" y="508.450" font-size="16" font-weight="400" fill="#111827">캐싱 없음, 사용자는 온프레미스에만 저장</text>
<text data-source="root.0.1.0.2" x="980.000" y="337.950" font-size="16" font-weight="400" fill="#111827">온프레미스 연동: trust 또는 인증 proxy</text>
<text data-source="root.0.1.1.0" x="76.000" y="637.650" font-size="18" font-weight="700" fill="#111827">Simple AD</text>
<text data-source="root.0.1.1.1" x="76.000" y="671.950" font-size="16" font-weight="400" fill="#111827">온프레미스 AD와 연결하지 않는 독립 AWS directory</text>
<text data-source="root.0.1.1.2.0" x="88.000" y="719.550" font-size="18" font-weight="700" fill="#111827">Samba 4 기반 directory</text>
<text data-source="root.0.1.1.2.0" x="88.000" y="752.950" font-size="16" font-weight="400" fill="#111827">신규 온보딩이 중단된 선택지</text>
<text data-source="root.0.1.3" x="76.000" y="892.550" font-size="18" font-weight="700" fill="#111827">EC2 Windows domain join</text>
<text data-source="root.0.1.3" x="76.000" y="925.950" font-size="16" font-weight="400" fill="#111827">Managed Microsoft AD, AD Connector, Simple AD 모두 지원</text>
<text data-source="root.0.1.4" x="64.000" y="971.550" font-size="16" font-weight="400" fill="#111827">Managed Microsoft AD만 온프레미스 forest와 trust를 맺고 RDS for SQL Server를 지원합니다. AD Connector는 사용자를 저장하지 않습니다.</text>
<text data-source="root.0.1.2" x="980.000" y="827.750" font-size="16" font-weight="400" fill="#111827">세 방식 모두 domain join 가능</text>
