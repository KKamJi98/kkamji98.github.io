<text data-source="root.0.0" x="64.000" y="146.600" font-size="36" font-weight="700" fill="#111827">CloudWatch Logs 로그 그룹 밖의 네 경로</text>
<text data-source="root.0.1.0" x="74.000" y="195.200" font-size="16" font-weight="700" fill="#111827">CloudWatch Logs 로그 그룹</text>
<text data-source="root.0.1.0" x="74.000" y="226.000" font-size="14" font-weight="400" fill="#111827">subscription filter 5개, metric filter 100개이며 조정 불가</text>
<text data-source="root.0.1.2.0.0" x="98.000" y="366.900" font-size="16" font-weight="700" fill="#111827">실시간 전달</text>
<text data-source="root.0.1.2.0.1.0" x="108.000" y="408.500" font-size="16" font-weight="700" fill="#111827">Subscription filter</text>
<text data-source="root.0.1.2.0.1.0" x="108.000" y="439.300" font-size="14" font-weight="400" fill="#111827">near-real-time push, base64 후 gzip, throttle 시 24시간 재시도</text>
<text data-source="root.0.1.2.0.1.2.0" x="132.000" y="580.200" font-size="16" font-weight="700" fill="#111827">Kinesis Data</text>
<text data-source="root.0.1.2.0.1.2.0" x="132.000" y="601.000" font-size="16" font-weight="700" fill="#111827">Streams</text>
<text data-source="root.0.1.2.0.1.2.0" x="132.000" y="631.800" font-size="14" font-weight="400" fill="#111827">소비자별 독립 읽기</text>
<text data-source="root.0.1.2.0.1.2.1" x="304.222" y="580.200" font-size="16" font-weight="700" fill="#111827">Lambda</text>
<text data-source="root.0.1.2.0.1.2.1" x="304.222" y="611.000" font-size="14" font-weight="400" fill="#111827">이벤트 단위 변환</text>
<text data-source="root.0.1.2.0.1.2.2" x="476.444" y="580.200" font-size="16" font-weight="700" fill="#111827">Data Firehose</text>
<text data-source="root.0.1.2.0.1.2.2" x="476.444" y="611.000" font-size="14" font-weight="400" fill="#111827">버퍼링 후 적재</text>
<text data-source="root.0.1.2.0.1.2.3" x="132.000" y="682.700" font-size="16" font-weight="700" fill="#111827">OpenSearch</text>
<text data-source="root.0.1.2.0.1.2.3" x="132.000" y="703.500" font-size="16" font-weight="700" fill="#111827">Service</text>
<text data-source="root.0.1.2.0.1.2.3" x="132.000" y="734.300" font-size="14" font-weight="400" fill="#111827">기존 Amazon ES 명칭</text>
<text data-source="root.0.1.2.1.0" x="682.667" y="366.900" font-size="16" font-weight="700" fill="#111827">메트릭 변환</text>
<text data-source="root.0.1.2.1.1.0" x="724.667" y="408.500" font-size="16" font-weight="700" fill="#111827">Metric filter</text>
<text data-source="root.0.1.2.1.1.0" x="724.667" y="439.300" font-size="14" font-weight="400" fill="#111827">이미 수집된 로그 패턴을 세어 메트릭으로 생성</text>
<text data-source="root.0.1.2.1.1.2" x="724.667" y="576.200" font-size="16" font-weight="700" fill="#111827">CloudWatch 메트릭과 alarm</text>
<text data-source="root.0.1.2.1.1.2" x="724.667" y="607.000" font-size="14" font-weight="400" fill="#111827">로그 발행 코드를 바꾸기 어려울 때 사용</text>
<text data-source="root.0.1.2.2.0" x="1267.333" y="366.900" font-size="16" font-weight="700" fill="#111827">배치 export</text>
<text data-source="root.0.1.2.2.1.0" x="1309.333" y="408.500" font-size="16" font-weight="700" fill="#111827">S3 export task</text>
<text data-source="root.0.1.2.2.1.0" x="1309.333" y="439.300" font-size="14" font-weight="400" fill="#111827">준비까지 최대 12시간, 계정당 동시 1개, 24시간 timeout</text>
<text data-source="root.0.1.2.2.1.2" x="1309.333" y="576.200" font-size="16" font-weight="700" fill="#111827">S3 버킷</text>
<text data-source="root.0.1.2.2.1.2" x="1309.333" y="607.000" font-size="14" font-weight="400" fill="#111827">AES-256와 SSE-KMS 지원, DSSE-KMS 미지원</text>
<text data-source="root.0.1.2.3.0" x="98.000" y="819.200" font-size="16" font-weight="700" fill="#111827">대화형 조회</text>
<text data-source="root.0.1.2.3.1.0" x="108.000" y="860.800" font-size="16" font-weight="700" fill="#111827">Logs Insights query</text>
<text data-source="root.0.1.2.3.1.0" x="108.000" y="891.600" font-size="14" font-weight="400" fill="#111827">계정당 동시 100개, 60분 timeout, 결과 조회 7일</text>
<text data-source="root.0.1.3" x="64.000" y="964.500" font-size="14" font-weight="400" fill="#111827">실시간 전달은 subscription filter만 제공하며 S3 export는 데이터가 준비될 때까지 기다리는 배치 경로입니다.</text>
<text data-source="root.0.1.1" x="980.000" y="283.450" font-size="14" font-weight="400" fill="#111827">사용 목적에 따라 선택</text>
