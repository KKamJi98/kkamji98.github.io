<text data-source="root.0.0" x="64.000" y="102.650" font-size="36" font-weight="700" fill="#111827">Auto Scaling 인스턴스 상태와 hook 대기 지점</text>
<text data-source="root.0.1.0" x="106.000" y="151.250" font-size="16" font-weight="700" fill="#111827">warm pool</text>
<text data-source="root.0.1.0" x="106.000" y="182.050" font-size="14" font-weight="400" fill="#111827">Stopped가 기본 권장, 기본 크기는 max capacity - desired capacity</text>
<text data-source="root.0.1.2" x="730.000" y="151.250" font-size="16" font-weight="700" fill="#111827">Pending</text>
<text data-source="root.0.1.2" x="730.000" y="182.050" font-size="14" font-weight="400" fill="#111827">scale out 또는 교체가 시작됨</text>
<text data-source="root.0.1.4" x="1354.000" y="151.250" font-size="16" font-weight="700" fill="#111827">Pending:Wait</text>
<text data-source="root.0.1.4" x="1354.000" y="182.050" font-size="14" font-weight="400" fill="#111827">launch lifecycle hook에서 bootstrap과 cache warming 수행</text>
<text data-source="root.0.1.6.0.0" x="74.000" y="298.950" font-size="16" font-weight="700" fill="#111827">CONTINUE: launch hook 통과</text>
<text data-source="root.0.1.6.0.1.0" x="116.000" y="340.550" font-size="16" font-weight="700" fill="#111827">InService</text>
<text data-source="root.0.1.6.0.1.0" x="116.000" y="371.350" font-size="14" font-weight="400" fill="#111827">health check grace period는 콘솔 300초, CLI와</text>
<text data-source="root.0.1.6.0.1.0" x="116.000" y="390.250" font-size="14" font-weight="400" fill="#111827">SDK 0초</text>
<text data-source="root.0.1.6.0.1.2" x="591.500" y="340.550" font-size="16" font-weight="700" fill="#111827">Terminating</text>
<text data-source="root.0.1.6.0.1.2" x="591.500" y="371.350" font-size="14" font-weight="400" fill="#111827">scale in, unhealthy 교체, refresh, lifetime</text>
<text data-source="root.0.1.6.0.1.2" x="591.500" y="390.250" font-size="14" font-weight="400" fill="#111827">만료가 진입시킴</text>
<text data-source="root.0.1.6.0.1.4" x="116.000" y="527.150" font-size="16" font-weight="700" fill="#111827">Terminating:Wait</text>
<text data-source="root.0.1.6.0.1.4" x="116.000" y="557.950" font-size="14" font-weight="400" fill="#111827">termination hook에서 connection draining과</text>
<text data-source="root.0.1.6.0.1.4" x="116.000" y="576.850" font-size="14" font-weight="400" fill="#111827">log 반출</text>
<text data-source="root.0.1.6.0.1.6" x="591.500" y="527.150" font-size="16" font-weight="700" fill="#111827">termination hook 결과</text>
<text data-source="root.0.1.6.0.1.6" x="591.500" y="557.950" font-size="14" font-weight="400" fill="#111827">best effort, timeout 또는 ABANDON이면 즉시</text>
<text data-source="root.0.1.6.0.1.6" x="591.500" y="576.850" font-size="14" font-weight="400" fill="#111827">종료</text>
<text data-source="root.0.1.6.0.1.8" x="116.000" y="713.750" font-size="16" font-weight="700" fill="#111827">Terminated</text>
<text data-source="root.0.1.6.0.1.8" x="116.000" y="744.550" font-size="14" font-weight="400" fill="#111827">ELB deregistration delay 기본 300초</text>
<text data-source="root.0.1.6.0.1.7" x="114.000" y="631.750" font-size="14" font-weight="400" fill="#111827">CONTINUE 또는 timeout</text>
<text data-source="root.0.1.6.1.0" x="975.000" y="298.950" font-size="16" font-weight="700" fill="#111827">launch 결과가 ABANDON</text>
<text data-source="root.0.1.6.1.1.0" x="1017.000" y="340.550" font-size="16" font-weight="700" fill="#111827">launch hook 결과</text>
<text data-source="root.0.1.6.1.1.0" x="1017.000" y="371.350" font-size="14" font-weight="400" fill="#111827">ABANDON 또는 heartbeat timeout 3600초 후</text>
<text data-source="root.0.1.6.1.1.0" x="1017.000" y="390.250" font-size="14" font-weight="400" fill="#111827">종료 경로</text>
<text data-source="root.0.1.6.1.1.2" x="1492.500" y="350.000" font-size="16" font-weight="700" fill="#111827">Terminated</text>
<text data-source="root.0.1.6.1.1.2" x="1492.500" y="380.800" font-size="14" font-weight="400" fill="#111827">서비스 투입 전에 인스턴스가 끝남</text>
<text data-source="root.0.1.7" x="74.000" y="805.450" font-size="16" font-weight="700" fill="#111827">unhealthy 신호 소스</text>
<text data-source="root.0.1.7" x="74.000" y="836.250" font-size="14" font-weight="400" fill="#111827">EC2 status check, ELB, VPC Lattice, EBS, custom health check가 Terminating으로 보냄</text>
<text data-source="root.0.1.8" x="64.000" y="875.150" font-size="14" font-weight="400" fill="#111827">termination hook은 best effort입니다. timeout 또는 ABANDON이면 즉시 종료로 진행합니다.</text>
<text data-source="root.0.1.5" x="980.000" y="224.950" font-size="14" font-weight="400" fill="#111827">launch hook 결과에 따라 분기</text>
<text data-source="root.0.2.0" x="74.000" y="916.050" font-size="16" font-weight="700" fill="#111827">Spot interruption</text>
<text data-source="root.0.2.1.0" x="116.000" y="957.650" font-size="16" font-weight="700" fill="#111827">Spot 중단</text>
<text data-source="root.0.2.1.0" x="116.000" y="988.450" font-size="14" font-weight="400" fill="#111827">2분 통지 후 회수하며 lifecycle hook 대기 없음</text>
<text data-source="root.0.2.1.2" x="1042.000" y="957.650" font-size="16" font-weight="700" fill="#111827">Terminated</text>
<text data-source="root.0.2.1.2" x="1042.000" y="988.450" font-size="14" font-weight="400" fill="#111827">Pending:Wait와 Terminating:Wait을 거치지 않음</text>
<text data-source="root.0.1.1.meaning" x="592.000" y="144.200" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.3.meaning" x="1216.000" y="144.200" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.6.0.1.1.meaning" x="453.500" y="342.950" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.6.0.1.3.meaning" x="86.000" y="436.250" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.6.0.1.5.meaning" x="453.500" y="529.550" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.6.1.1.1.meaning" x="1354.500" y="342.950" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.2.1.1.meaning" x="904.000" y="950.600" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
