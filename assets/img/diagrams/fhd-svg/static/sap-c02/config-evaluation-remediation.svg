<polygon data-arrowhead="root.0.1.0.1.2" points="1573.000,313.300 1567.000,303.300 1579.000,303.300" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="100.000" font-size="36" font-weight="700" fill="#111827">Config 평가와 SSM Automation 교정의 경계</text>
<text data-source="root.0.1.0.0.0" x="72.000" y="172.000" font-size="16" font-weight="700" fill="#111827">Detective 평가</text>
<text data-source="root.0.1.0.0.1" x="80.000" y="209.600" font-size="16" font-weight="700" fill="#111827">리소스 구성 변경</text>
<text data-source="root.0.1.0.0.1" x="80.000" y="240.400" font-size="14" font-weight="400" fill="#111827">생성, 수정, 삭제 이벤트</text>
<text data-source="root.0.1.0.0.3.0" x="112.000" y="349.300" font-size="16" font-weight="700" fill="#111827">Configuration recorder</text>
<text data-source="root.0.1.0.0.3.0" x="112.000" y="380.100" font-size="14" font-weight="400" fill="#111827">계정과 리전당 1개, continuous 또는 daily, global IAM 4종은 기본 제외</text>
<text data-source="root.0.1.0.0.3.2" x="734.000" y="349.300" font-size="16" font-weight="700" fill="#111827">Config rule 평가</text>
<text data-source="root.0.1.0.0.3.2" x="734.000" y="380.100" font-size="14" font-weight="400" fill="#111827">configuration change, periodic, hybrid trigger</text>
<text data-source="root.0.1.0.0.3.4.0.0" x="104.000" y="513.000" font-size="16" font-weight="700" fill="#111827">COMPLIANT</text>
<text data-source="root.0.1.0.0.3.4.0.1.0" x="112.000" y="550.600" font-size="16" font-weight="700" fill="#111827">준수 결과</text>
<text data-source="root.0.1.0.0.3.4.0.1.0" x="112.000" y="581.400" font-size="14" font-weight="400" fill="#111827">규칙을 준수한 결과</text>
<text data-source="root.0.1.0.0.3.4.1.0" x="666.000" y="513.000" font-size="16" font-weight="700" fill="#111827">NON_COMPLIANT</text>
<text data-source="root.0.1.0.0.3.4.1.1.0" x="706.000" y="550.600" font-size="16" font-weight="700" fill="#111827">교정 대상</text>
<text data-source="root.0.1.0.0.3.4.1.1.0" x="706.000" y="581.400" font-size="14" font-weight="400" fill="#111827">이 결과에서만 remediation 경로가 이어짐</text>
<text data-source="root.0.1.0.0.3.4.1.1.2" x="706.000" y="714.300" font-size="16" font-weight="700" fill="#111827">SSM Automation document</text>
<text data-source="root.0.1.0.0.3.4.1.1.2" x="706.000" y="745.100" font-size="14" font-weight="400" fill="#111827">재시도 횟수와 시간 창을 지정해 실제 변경 실행</text>
<text data-source="root.0.1.0.0.3.4.1.1.4" x="706.000" y="878.000" font-size="16" font-weight="700" fill="#111827">교정 완료</text>
<text data-source="root.0.1.0.0.3.4.1.1.4" x="706.000" y="908.800" font-size="14" font-weight="400" fill="#111827">periodic snapshot이면 COMPLIANT여도 재실행 가능, runbook은</text>
<text data-source="root.0.1.0.0.3.4.1.1.4" x="706.000" y="927.700" font-size="14" font-weight="400" fill="#111827">idempotent해야 함</text>
<text data-source="root.0.1.0.0.3.4.1.1.1" x="706.000" y="634.300" font-size="14" font-weight="400" fill="#111827">remediation 연결</text>
<text data-source="root.0.1.0.0.2" x="674.000" y="293.850" font-size="14" font-weight="400" fill="#111827">변경 기록</text>
<text data-source="root.0.1.0.1.0" x="1298.000" y="172.000" font-size="16" font-weight="700" fill="#111827">Proactive 평가</text>
<text data-source="root.0.1.0.1.1" x="1306.000" y="209.600" font-size="16" font-weight="700" fill="#111827">배포 예정 구성</text>
<text data-source="root.0.1.0.1.1" x="1306.000" y="240.400" font-size="14" font-weight="400" fill="#111827">아직 적용하지 않은 resource configuration</text>
<text data-source="root.0.1.0.1.3.0" x="1330.000" y="373.300" font-size="16" font-weight="700" fill="#111827">Proactive evaluation</text>
<text data-source="root.0.1.0.1.3.0" x="1330.000" y="404.100" font-size="14" font-weight="400" fill="#111827">배포 전에 구성 적합성을 평가</text>
<text data-source="root.0.1.0.1.3.2" x="1330.000" y="513.000" font-size="16" font-weight="700" fill="#111827">차단도 교정도 하지 않음</text>
<text data-source="root.0.1.0.1.3.2" x="1330.000" y="543.800" font-size="14" font-weight="400" fill="#111827">생성 차단에는 SCP 또는 CloudFormation Hooks가 필요</text>
<text data-source="root.0.1.0.1.2" x="1593.000" y="293.850" font-size="14" font-weight="400" fill="#111827">배포 전 평가 요청</text>
<text data-source="root.0.2" x="1298.000" y="636.700" font-size="16" font-weight="700" fill="#111827">그 밖의 평가 결과</text>
<text data-source="root.0.2" x="1298.000" y="667.500" font-size="14" font-weight="400" fill="#111827">ERROR와 NOT_APPLICABLE은 COMPLIANT와 구분하며 이 그림의 자동 교정 경로로</text>
<text data-source="root.0.2" x="1298.000" y="686.400" font-size="14" font-weight="400" fill="#111827">연결하지 않습니다.</text>
<text data-source="root.0.3.0" x="1298.000" y="747.300" font-size="16" font-weight="700" fill="#111827">독립된 read-only 집계</text>
<text data-source="root.0.3.1" x="1306.000" y="784.900" font-size="16" font-weight="700" fill="#111827">Config aggregator</text>
<text data-source="root.0.3.1" x="1306.000" y="815.700" font-size="14" font-weight="400" fill="#111827">read-only 집계, rule 배포와 snapshot 주입은 불가</text>
<text data-source="root.0.3.2" x="1298.000" y="850.600" font-size="14" font-weight="400" fill="#111827">계정과 리전의 구성 및 compliance 결과를 집계합니다. COMPLIANT 전용 단계도 교정</text>
<text data-source="root.0.3.2" x="1298.000" y="869.500" font-size="14" font-weight="400" fill="#111827">실행자도 아닙니다.</text>
<text data-source="root.0.1.0.0.3.1.meaning" x="598.000" y="342.250" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.0.0.3.4.1.1.3.meaning" x="678.000" y="789.100" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.0.0.3.3.meaning" x="658.000" y="412.100" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.0.1.3.1.meaning" x="1593.000" y="457.550" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
</svg>
