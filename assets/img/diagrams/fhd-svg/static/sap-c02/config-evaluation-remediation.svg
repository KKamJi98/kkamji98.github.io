<polygon data-arrowhead="root.0.1.0.1.2" points="1573.000,330.600 1567.000,320.600 1579.000,320.600" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="100.000" font-size="36" font-weight="700" fill="#111827">Config 평가와 SSM Automation 교정의 경계</text>
<text data-source="root.0.1.0.0.0" x="74.000" y="176.000" font-size="18" font-weight="700" fill="#111827">Detective 평가</text>
<text data-source="root.0.1.0.0.1" x="84.000" y="220.300" font-size="18" font-weight="700" fill="#111827">리소스 구성 변경</text>
<text data-source="root.0.1.0.0.1" x="84.000" y="251.700" font-size="14" font-weight="400" fill="#111827">생성, 수정, 삭제 이벤트</text>
<text data-source="root.0.1.0.0.3.0" x="116.000" y="370.600" font-size="18" font-weight="700" fill="#111827">Configuration recorder</text>
<text data-source="root.0.1.0.0.3.0" x="116.000" y="402.000" font-size="14" font-weight="400" fill="#111827">계정과 리전당 1개, continuous 또는 daily, global IAM 4종은 기본 제외</text>
<text data-source="root.0.1.0.0.3.2" x="736.000" y="370.600" font-size="18" font-weight="700" fill="#111827">Config rule 평가</text>
<text data-source="root.0.1.0.0.3.2" x="736.000" y="402.000" font-size="14" font-weight="400" fill="#111827">configuration change, periodic, hybrid trigger</text>
<text data-source="root.0.1.0.0.3.4.0.0" x="84.000" y="520.900" font-size="18" font-weight="700" fill="#111827">COMPLIANT</text>
<text data-source="root.0.1.0.0.3.4.0.1.0" x="94.000" y="565.200" font-size="18" font-weight="700" fill="#111827">준수 결과</text>
<text data-source="root.0.1.0.0.3.4.0.1.0" x="94.000" y="596.600" font-size="14" font-weight="400" fill="#111827">규칙을 준수한 결과</text>
<text data-source="root.0.1.0.0.3.4.1.0" x="669.000" y="520.900" font-size="18" font-weight="700" fill="#111827">NON_COMPLIANT</text>
<text data-source="root.0.1.0.0.3.4.1.1.0" x="711.000" y="565.200" font-size="18" font-weight="700" fill="#111827">교정 대상</text>
<text data-source="root.0.1.0.0.3.4.1.1.0" x="711.000" y="596.600" font-size="14" font-weight="400" fill="#111827">이 결과에서만 remediation 경로가 이어짐</text>
<text data-source="root.0.1.0.0.3.4.1.1.2" x="711.000" y="735.500" font-size="18" font-weight="700" fill="#111827">SSM Automation document</text>
<text data-source="root.0.1.0.0.3.4.1.1.2" x="711.000" y="766.900" font-size="14" font-weight="400" fill="#111827">재시도 횟수와 시간 창을 지정해 실제 변경 실행</text>
<text data-source="root.0.1.0.0.3.4.1.1.4" x="711.000" y="905.800" font-size="18" font-weight="700" fill="#111827">교정 완료</text>
<text data-source="root.0.1.0.0.3.4.1.1.4" x="711.000" y="937.200" font-size="14" font-weight="400" fill="#111827">periodic snapshot이면 COMPLIANT여도 재실행 가능, runbook은</text>
<text data-source="root.0.1.0.0.3.4.1.1.4" x="711.000" y="956.100" font-size="14" font-weight="400" fill="#111827">idempotent해야 함</text>
<text data-source="root.0.1.0.0.3.4.1.1.1" x="709.000" y="651.500" font-size="14" font-weight="400" fill="#111827">remediation 연결</text>
<text data-source="root.0.1.0.0.2" x="674.000" y="309.150" font-size="14" font-weight="400" fill="#111827">변경 기록</text>
<text data-source="root.0.1.0.1.0" x="1300.000" y="176.000" font-size="18" font-weight="700" fill="#111827">Proactive 평가</text>
<text data-source="root.0.1.0.1.1" x="1310.000" y="220.300" font-size="18" font-weight="700" fill="#111827">배포 예정 구성</text>
<text data-source="root.0.1.0.1.1" x="1310.000" y="251.700" font-size="14" font-weight="400" fill="#111827">아직 적용하지 않은 resource configuration</text>
<text data-source="root.0.1.0.1.3.0" x="1342.000" y="370.600" font-size="18" font-weight="700" fill="#111827">Proactive evaluation</text>
<text data-source="root.0.1.0.1.3.0" x="1342.000" y="402.000" font-size="14" font-weight="400" fill="#111827">배포 전에 구성 적합성을 평가</text>
<text data-source="root.0.1.0.1.3.2" x="1342.000" y="540.900" font-size="18" font-weight="700" fill="#111827">차단도 교정도 하지 않음</text>
<text data-source="root.0.1.0.1.3.2" x="1342.000" y="572.300" font-size="14" font-weight="400" fill="#111827">생성 차단에는 SCP 또는 CloudFormation Hooks가 필요</text>
<text data-source="root.0.1.0.1.2" x="1593.000" y="309.150" font-size="14" font-weight="400" fill="#111827">배포 전 평가 요청</text>
<text data-source="root.0.2" x="1300.000" y="649.200" font-size="18" font-weight="700" fill="#111827">그 밖의 평가 결과</text>
<text data-source="root.0.2" x="1300.000" y="680.600" font-size="14" font-weight="400" fill="#111827">ERROR와 NOT_APPLICABLE은 COMPLIANT와 구분하며 이 그림의 자동 교정 경로로</text>
<text data-source="root.0.2" x="1300.000" y="699.500" font-size="14" font-weight="400" fill="#111827">연결하지 않습니다.</text>
<text data-source="root.0.3.0" x="1300.000" y="766.400" font-size="18" font-weight="700" fill="#111827">독립된 read-only 집계</text>
<text data-source="root.0.3.1" x="1310.000" y="810.700" font-size="18" font-weight="700" fill="#111827">Config aggregator</text>
<text data-source="root.0.3.1" x="1310.000" y="842.100" font-size="14" font-weight="400" fill="#111827">read-only 집계, rule 배포와 snapshot 주입은 불가</text>
<text data-source="root.0.3.2" x="1300.000" y="881.000" font-size="14" font-weight="400" fill="#111827">계정과 리전의 구성 및 compliance 결과를 집계합니다. COMPLIANT 전용 단계도</text>
<text data-source="root.0.3.2" x="1300.000" y="899.900" font-size="14" font-weight="400" fill="#111827">교정 실행자도 아닙니다.</text>
<text data-source="root.0.1.0.0.3.1.meaning" x="598.000" y="362.850" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.0.0.3.4.1.1.3.meaning" x="681.000" y="812.900" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.0.0.3.3.meaning" x="658.000" y="438.000" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
<text data-source="root.0.1.0.1.3.1.meaning" x="1312.000" y="448.000" font-size="14" font-weight="400" fill="#111827">다음 단계</text>
</svg>
