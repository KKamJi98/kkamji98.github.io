<path data-edge="root.0.2" data-from="root.0.1" data-to="root.0.3" d="M 960.000 408.700 L 960.000 483.700" fill="none" stroke="#475569" stroke-width="3"><title>세 정책이 모두 허용한 교집합</title></path>
<polygon data-arrowhead="root.0.2" points="960.000,483.700 954.000,473.700 966.000,473.700" fill="#475569"/>
<path data-edge="root.0.4" data-from="root.0.3" data-to="root.0.5" d="M 960.000 617.900 L 960.000 692.900" fill="none" stroke="#475569" stroke-width="3"><title>API 호출 판정</title></path>
<polygon data-arrowhead="root.0.4" points="960.000,692.900 954.000,682.900 966.000,682.900" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="113.500" font-size="36" font-weight="700" fill="#111827">Identity policy로 부여한 권한과 적용되는 경계</text>
<text data-source="root.0.1.0.0" x="108.000" y="214.100" font-size="24" font-weight="700" fill="#111827">조직 경계</text>
<text data-source="root.0.1.0.1" x="128.000" y="286.500" font-size="24" font-weight="700" fill="#111827">SCP</text>
<text data-source="root.0.1.0.1" x="128.000" y="325.700" font-size="20" font-weight="400" fill="#111827">조직이 정한 최대 한도, 권한을 부여하지 않음</text>
<text data-source="root.0.1.1.0" x="696.000" y="214.100" font-size="24" font-weight="700" fill="#111827">principal 경계</text>
<text data-source="root.0.1.1.1" x="716.000" y="286.500" font-size="24" font-weight="700" fill="#111827">Permission boundary</text>
<text data-source="root.0.1.1.1" x="716.000" y="325.700" font-size="20" font-weight="400" fill="#111827">identity policy 권한의 최대 한도</text>
<text data-source="root.0.1.2.0" x="1284.000" y="214.100" font-size="24" font-weight="700" fill="#111827">권한 부여</text>
<text data-source="root.0.1.2.1" x="1304.000" y="286.500" font-size="24" font-weight="700" fill="#111827">Identity policy</text>
<text data-source="root.0.1.2.1" x="1304.000" y="325.700" font-size="20" font-weight="400" fill="#111827">실제 API 권한을 부여하는 정책</text>
<text data-source="root.0.3" x="84.000" y="539.700" font-size="24" font-weight="700" fill="#111827">유효 권한</text>
<text data-source="root.0.3" x="84.000" y="578.900" font-size="20" font-weight="400" fill="#111827">identity policy 경로의 단순화</text>
<text data-source="root.0.5.0.0" x="108.000" y="772.900" font-size="24" font-weight="700" fill="#111827">모두 허용</text>
<text data-source="root.0.5.0.1" x="128.000" y="845.300" font-size="24" font-weight="700" fill="#111827">허용</text>
<text data-source="root.0.5.0.1" x="128.000" y="884.500" font-size="20" font-weight="400" fill="#111827">API 호출 수행</text>
<text data-source="root.0.5.1.0" x="990.000" y="772.900" font-size="24" font-weight="700" fill="#111827">하나라도 제외</text>
<text data-source="root.0.5.1.1" x="1010.000" y="845.300" font-size="24" font-weight="700" fill="#111827">암묵적 거부</text>
<text data-source="root.0.5.1.1" x="1010.000" y="884.500" font-size="20" font-weight="400" fill="#111827">SCP만 허용해도 identity policy가 없으면 차단</text>
<text data-source="root.0.6" x="64.000" y="995.500" font-size="20" font-weight="400" fill="#111827">Resource policy의 직접 부여는 principal별 평가가 다릅니다. 적용되는 explicit deny와 SCP/RCP는 우회하지 못하며 session policy도 별도로 평가합니다.</text>
<text data-source="root.0.2" x="980.000" y="452.700" font-size="20" font-weight="400" fill="#111827">세 정책이 모두 허용한 교집합</text>
<text data-source="root.0.4" x="980.000" y="661.900" font-size="20" font-weight="400" fill="#111827">API 호출 판정</text>
</svg>
