<text data-source="root.0.0" x="64.000" y="147.900" font-size="36" font-weight="700" fill="#111827">ECR 이후 ECS와 EKS Fargate의 경계를 비교한다</text>
<text data-source="root.0.1.0" x="120.000" y="244.850" font-size="28" font-weight="700" fill="#111827">애플리케이션 소스</text>
<text data-source="root.0.1.0" x="120.000" y="287.250" font-size="22" font-weight="400" fill="#111827">Dockerfile과 런타임 정의에서 이미지를 만든다.</text>
<text data-source="root.0.1.2" x="1056.000" y="244.850" font-size="28" font-weight="700" fill="#111827">Amazon ECR</text>
<text data-source="root.0.1.2" x="1056.000" y="287.250" font-size="22" font-weight="400" fill="#111827">버전이 있는 공통 이미지 공급 경로다.</text>
<text data-source="root.0.1.1" x="892.000" y="206.500" font-size="22" font-weight="400" fill="#111827">이미지 push와</text>
<text data-source="root.0.1.1" x="892.000" y="236.200" font-size="22" font-weight="400" fill="#111827">scan</text>
<text data-source="root.0.2.0.0" x="88.000" y="489.000" font-size="28" font-weight="700" fill="#111827">ECS on Fargate</text>
<text data-source="root.0.2.0.1.0" x="144.000" y="574.800" font-size="28" font-weight="700" fill="#111827">ECS 선택</text>
<text data-source="root.0.2.0.1.0" x="144.000" y="617.200" font-size="22" font-weight="400" fill="#111827">IP target을 사용하며 Fargate</text>
<text data-source="root.0.2.0.1.0" x="144.000" y="646.900" font-size="22" font-weight="400" fill="#111827">Spot을 선택할 수 있다.</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="574.800" font-size="28" font-weight="700" fill="#111827">ECS Fargate 태스크</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="617.200" font-size="22" font-weight="400" fill="#111827">awsvpc ENI와 EBS, Fargate</text>
<text data-source="root.0.2.0.1.2" x="602.000" y="646.900" font-size="22" font-weight="400" fill="#111827">Spot을 사용할 수 있다.</text>
<text data-source="root.0.2.0.1.1" x="438.000" y="581.000" font-size="22" font-weight="400" fill="#111827">태스크 배치</text>
<text data-source="root.0.2.1.0" x="996.000" y="489.000" font-size="28" font-weight="700" fill="#111827">EKS on Fargate</text>
<text data-source="root.0.2.1.1.0" x="1052.000" y="574.800" font-size="28" font-weight="700" fill="#111827">EKS 선택</text>
<text data-source="root.0.2.1.1.0" x="1052.000" y="617.200" font-size="22" font-weight="400" fill="#111827">Fargate profile이 매칭되고</text>
<text data-source="root.0.2.1.1.0" x="1052.000" y="646.900" font-size="22" font-weight="400" fill="#111827">private subnet에서</text>
<text data-source="root.0.2.1.1.0" x="1052.000" y="676.600" font-size="22" font-weight="400" fill="#111827">실행한다.</text>
<text data-source="root.0.2.1.1.2" x="1510.000" y="574.800" font-size="28" font-weight="700" fill="#111827">EKS Fargate Pod</text>
<text data-source="root.0.2.1.1.2" x="1510.000" y="617.200" font-size="22" font-weight="400" fill="#111827">DaemonSet, EBS, GPU,</text>
<text data-source="root.0.2.1.1.2" x="1510.000" y="646.900" font-size="22" font-weight="400" fill="#111827">Fargate Spot을 지원하지</text>
<text data-source="root.0.2.1.1.2" x="1510.000" y="676.600" font-size="22" font-weight="400" fill="#111827">않는다.</text>
<text data-source="root.0.2.1.1.1" x="1346.000" y="595.850" font-size="22" font-weight="400" fill="#111827">Pod 배치</text>
<text data-source="root.0.4" x="88.000" y="894.000" font-size="28" font-weight="700" fill="#111827">IP target 서비스</text>
<text data-source="root.0.4" x="88.000" y="936.400" font-size="22" font-weight="400" fill="#111827">각 태스크 또는 Pod의 awsvpc ENI 주소를 대상에 등록한다.</text>
<text data-source="root.0.3" x="980.000" y="794.300" font-size="22" font-weight="400" fill="#111827">두 경로 모두 IP target으로 연결</text>
<text data-source="root.0.1.3" x="84.000" y="373.300" font-size="22" font-weight="400" fill="#111827">오케스트레이터 선택</text>
</svg>
