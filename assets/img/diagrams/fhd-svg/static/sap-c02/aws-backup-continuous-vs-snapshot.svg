<path data-edge="root.0.1.1" data-from="root.0.1.0" data-to="root.0.1.2" d="M 900.000 574.300 L 1020.000 574.300" fill="none" stroke="#475569" stroke-width="3"><title>plan에 두 종류 rule을 함께 둘 수 있음</title></path>
<polygon data-arrowhead="root.0.1.1" points="1020.000,574.300 1010.000,580.300 1010.000,568.300" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="151.500" font-size="36" font-weight="700" fill="#111827">AWS Backup rule별 보존 경로</text>
<text data-source="root.0.1.0" x="116.000" y="563.200" font-size="24" font-weight="700" fill="#111827">Backup plan</text>
<text data-source="root.0.1.0" x="116.000" y="602.400" font-size="20" font-weight="400" fill="#111827">리소스 1개당 continuous backup rule은 1개</text>
<text data-source="root.0.1.2.0.0" x="1076.000" y="252.100" font-size="24" font-weight="700" fill="#111827">Continuous backup</text>
<text data-source="root.0.1.2.0.1.0" x="1096.000" y="324.500" font-size="24" font-weight="700" fill="#111827">continuous backup rule</text>
<text data-source="root.0.1.2.0.1.0" x="1096.000" y="363.700" font-size="20" font-weight="400" fill="#111827">1초 정밀도, 최대 35일, 최초 full 뒤</text>
<text data-source="root.0.1.2.0.1.0" x="1096.000" y="390.700" font-size="20" font-weight="400" fill="#111827">transaction log 연결</text>
<text data-source="root.0.1.2.0.1.1" x="1096.000" y="481.700" font-size="24" font-weight="700" fill="#111827">warm storage에 유지</text>
<text data-source="root.0.1.2.0.1.1" x="1096.000" y="520.900" font-size="20" font-weight="400" fill="#111827">35일 상한이 cold 전환 최소 90일</text>
<text data-source="root.0.1.2.0.1.1" x="1096.000" y="547.900" font-size="20" font-weight="400" fill="#111827">조건과 충돌</text>
<text data-source="root.0.1.2.0.1.2" x="1096.000" y="638.900" font-size="24" font-weight="700" fill="#111827">RDS는 continuous</text>
<text data-source="root.0.1.2.0.1.2" x="1096.000" y="670.100" font-size="24" font-weight="700" fill="#111827">사본 불가</text>
<text data-source="root.0.1.2.0.1.2" x="1096.000" y="709.300" font-size="20" font-weight="400" fill="#111827">transaction log 복사 대신</text>
<text data-source="root.0.1.2.0.1.2" x="1096.000" y="736.300" font-size="20" font-weight="400" fill="#111827">snapshot을 만들어 복사</text>
<text data-source="root.0.1.2.1.0" x="1458.000" y="252.100" font-size="24" font-weight="700" fill="#111827">Snapshot backup</text>
<text data-source="root.0.1.2.1.1.0" x="1478.000" y="324.500" font-size="24" font-weight="700" fill="#111827">snapshot backup rule</text>
<text data-source="root.0.1.2.1.1.0" x="1478.000" y="363.700" font-size="20" font-weight="400" fill="#111827">최소 1시간 주기, 최장 100년 보존</text>
<text data-source="root.0.1.2.1.1.1" x="1478.000" y="454.700" font-size="24" font-weight="700" fill="#111827">cross-Region 및</text>
<text data-source="root.0.1.2.1.1.1" x="1478.000" y="485.900" font-size="24" font-weight="700" fill="#111827">cross-account copy</text>
<text data-source="root.0.1.2.1.1.1" x="1478.000" y="525.100" font-size="20" font-weight="400" fill="#111827">첫 복사는 full, 같은 vault와 key면</text>
<text data-source="root.0.1.2.1.1.1" x="1478.000" y="552.100" font-size="20" font-weight="400" fill="#111827">이후 incremental</text>
<text data-source="root.0.1.2.1.1.2" x="1478.000" y="643.100" font-size="24" font-weight="700" fill="#111827">cold storage 전환</text>
<text data-source="root.0.1.2.1.1.2" x="1478.000" y="682.300" font-size="20" font-weight="400" fill="#111827">지원 리소스에 한해 가능, RDS와</text>
<text data-source="root.0.1.2.1.1.2" x="1478.000" y="709.300" font-size="20" font-weight="400" fill="#111827">Aurora와 EC2와 S3는 지원</text>
<text data-source="root.0.1.2.1.1.2" x="1478.000" y="736.300" font-size="20" font-weight="400" fill="#111827">표시 없음</text>
<text data-source="root.0.1.2.1.1.3" x="1478.000" y="827.300" font-size="24" font-weight="700" fill="#111827">cold tier는 복사 불가</text>
<text data-source="root.0.1.2.1.1.3" x="1478.000" y="866.500" font-size="20" font-weight="400" fill="#111827">cross-Region copy 미지원, 최소</text>
<text data-source="root.0.1.2.1.1.3" x="1478.000" y="893.500" font-size="20" font-weight="400" fill="#111827">90일 보관</text>
<text data-source="root.0.1.1" x="892.000" y="501.300" font-size="20" font-weight="400" fill="#111827">plan에 두 종류</text>
<text data-source="root.0.1.1" x="892.000" y="528.300" font-size="20" font-weight="400" fill="#111827">rule을 함께 둘</text>
<text data-source="root.0.1.1" x="892.000" y="555.300" font-size="20" font-weight="400" fill="#111827">수 있음</text>
</svg>
