<path data-edge="root.0.1.0.1.1" data-from="root.0.1.0.1.0" data-to="root.0.1.0.1.2" d="M 614.667 278.750 L 626.667 278.750 L 626.667 373.900 L 88.000 373.900 L 88.000 469.050 L 100.000 469.050" fill="none" stroke="#475569" stroke-width="3"><title>route table prefix list</title></path>
