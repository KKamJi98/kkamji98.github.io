<polygon data-arrowhead="root.0.1.2.1.3" points="1305.333,659.350 1295.333,665.350 1295.333,653.350" fill="#475569"/>
<text data-source="root.0.0" x="64.000" y="144.000" font-size="36" font-weight="700" fill="#111827">S3 접근 경로는 출발지와 endpoint 구현으로 갈립니다</text>
<text data-source="root.0.1.0.0" x="80.000" y="208.600" font-size="20" font-weight="700" fill="#111827">VPC와 gateway endpoint</text>
<text data-source="root.0.1.0.1.0" x="128.000" y="267.600" font-size="20" font-weight="700" fill="#111827">EC2 인스턴스</text>
<text data-source="root.0.1.0.1.0" x="128.000" y="303.600" font-size="18" font-weight="400" fill="#111827">private subnet</text>
<text data-source="root.0.1.0.1.2" x="128.000" y="457.900" font-size="20" font-weight="700" fill="#111827">Gateway endpoint</text>
<text data-source="root.0.1.0.1.2" x="128.000" y="493.900" font-size="18" font-weight="400" fill="#111827">추가 요금 없음, S3 같은 리전만</text>
<text data-source="root.0.1.0.1.4" x="128.000" y="648.200" font-size="20" font-weight="700" fill="#111827">Amazon S3</text>
<text data-source="root.0.1.0.1.4" x="128.000" y="684.200" font-size="18" font-weight="400" fill="#111827">같은 리전 버킷</text>
<text data-source="root.0.1.0.1.1" x="120.000" y="365.900" font-size="18" font-weight="400" fill="#111827">route table prefix list</text>
<text data-source="root.0.1.0.1.3" x="120.000" y="556.200" font-size="18" font-weight="400" fill="#111827">endpoint route</text>
<text data-source="root.0.1.1.0" x="682.667" y="208.600" font-size="20" font-weight="700" fill="#111827">VPC와 interface endpoint</text>
<text data-source="root.0.1.1.1.0" x="730.667" y="267.600" font-size="20" font-weight="700" fill="#111827">EC2 인스턴스</text>
<text data-source="root.0.1.1.1.0" x="730.667" y="303.600" font-size="18" font-weight="400" fill="#111827">private subnet</text>
<text data-source="root.0.1.1.1.2" x="730.667" y="457.900" font-size="20" font-weight="700" fill="#111827">Interface endpoint</text>
<text data-source="root.0.1.1.1.2" x="730.667" y="493.900" font-size="18" font-weight="400" fill="#111827">AZ당 10에서 100 Gbps 자동 확장</text>
<text data-source="root.0.1.1.1.4" x="730.667" y="648.200" font-size="20" font-weight="700" fill="#111827">Amazon S3</text>
<text data-source="root.0.1.1.1.4" x="730.667" y="684.200" font-size="18" font-weight="400" fill="#111827">endpoint policy 적용 가능</text>
<text data-source="root.0.1.1.1.1" x="722.667" y="365.900" font-size="18" font-weight="400" fill="#111827">서브넷 ENI의 private IP</text>
<text data-source="root.0.1.1.1.3" x="722.667" y="556.200" font-size="18" font-weight="400" fill="#111827">PrivateLink 경로</text>
<text data-source="root.0.1.2.0" x="1285.333" y="208.600" font-size="20" font-weight="700" fill="#111827">온프레미스 출발</text>
<text data-source="root.0.1.2.1.0" x="1333.333" y="267.600" font-size="20" font-weight="700" fill="#111827">온프레미스 서버</text>
<text data-source="root.0.1.2.1.0" x="1333.333" y="303.600" font-size="18" font-weight="400" fill="#111827">Direct Connect 또는 VPN</text>
<text data-source="root.0.1.2.1.2" x="1333.333" y="457.900" font-size="20" font-weight="700" fill="#111827">Interface endpoint</text>
<text data-source="root.0.1.2.1.2" x="1333.333" y="493.900" font-size="18" font-weight="400" fill="#111827">VPC 밖 요청도 ENI로 수용</text>
<text data-source="root.0.1.2.1.4" x="1333.333" y="648.200" font-size="20" font-weight="700" fill="#111827">Amazon S3</text>
<text data-source="root.0.1.2.1.4" x="1333.333" y="684.200" font-size="18" font-weight="400" fill="#111827">같은 리전 버킷</text>
<text data-source="root.0.1.2.1.1" x="1325.333" y="365.900" font-size="18" font-weight="400" fill="#111827">private IP 도달</text>
<text data-source="root.0.1.2.1.3" x="1325.333" y="556.200" font-size="18" font-weight="400" fill="#111827">endpoint policy</text>
<text data-source="root.0.1.2.2.0" x="1301.333" y="758.500" font-size="20" font-weight="700" fill="#111827">Gateway endpoint</text>
<text data-source="root.0.1.2.2.0" x="1301.333" y="784.500" font-size="20" font-weight="700" fill="#111827">불가</text>
<text data-source="root.0.1.2.2.0" x="1301.333" y="820.500" font-size="18" font-weight="400" fill="#111827">VPC 밖에서는 route table</text>
<text data-source="root.0.1.2.2.0" x="1301.333" y="844.800" font-size="18" font-weight="400" fill="#111827">경로를 참조하지 못함</text>
<text data-source="root.0.1.2.2.1" x="1586.667" y="758.500" font-size="20" font-weight="700" fill="#111827">S3 public endpoint</text>
<text data-source="root.0.1.2.2.1" x="1586.667" y="794.500" font-size="18" font-weight="400" fill="#111827">public VIF로 도달하지만</text>
<text data-source="root.0.1.2.2.1" x="1586.667" y="818.800" font-size="18" font-weight="400" fill="#111827">endpoint policy는 없음</text>
<text data-source="root.0.1.2.3" x="1285.333" y="901.100" font-size="18" font-weight="400" fill="#111827">Gateway endpoint는 VPC route table 안에서만 동작합니다.</text>
<text data-source="root.0.1.2.3" x="1285.333" y="925.400" font-size="18" font-weight="400" fill="#111827">public VIF의 S3 public endpoint에는 endpoint policy가</text>
<text data-source="root.0.1.2.3" x="1285.333" y="949.700" font-size="18" font-weight="400" fill="#111827">적용되지 않습니다.</text>
</svg>
