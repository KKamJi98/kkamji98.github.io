<text data-source="root.0.1.2.0.1.2" x="1088.000" y="639.950" font-size="18" font-weight="400" fill="#111827">14종 리소스, 기본 14일</text>
<text data-source="root.0.1.2.0.1.2" x="1088.000" y="664.250" font-size="18" font-weight="400" fill="#111827">lookback, enhanced</text>
<text data-source="root.0.1.2.0.1.2" x="1088.000" y="688.550" font-size="18" font-weight="400" fill="#111827">metrics면 93일</text>
<text data-source="root.0.1.2.1.0" x="1325.333" y="263.450" font-size="20" font-weight="700" fill="#111827">EC2 rightsizing</text>
<text data-source="root.0.1.2.1.1.0" x="1341.333" y="322.450" font-size="20" font-weight="700" fill="#111827">Cost Explorer</text>
