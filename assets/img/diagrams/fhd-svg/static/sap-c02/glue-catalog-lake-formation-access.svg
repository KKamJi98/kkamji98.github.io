<text data-source="root.0.0" x="64.000" y="142.700" font-size="36" font-weight="700" fill="#111827">Lake Formation 권한은 분석 엔진별 지원 범위를 가진다</text>
<text data-source="root.0.1" x="64.000" y="189.300" font-size="18" font-weight="400" fill="#111827">Glue crawler가 메타데이터를 채우고 Lake Formation이 권한을 평가하지만, 모든 분석 엔진이 row와 cell 수준 필터를 지원하지는 않습니다.</text>
<text data-source="root.0.2.0" x="112.000" y="261.050" font-size="20" font-weight="700" fill="#111827">S3 data lake</text>
<text data-source="root.0.2.0" x="112.000" y="297.050" font-size="18" font-weight="400" fill="#111827">objects and partitions</text>
<text data-source="root.0.2.2" x="1048.000" y="261.050" font-size="20" font-weight="700" fill="#111827">Glue crawler</text>
<text data-source="root.0.2.2" x="1048.000" y="297.050" font-size="18" font-weight="400" fill="#111827">데이터 구조를 추론합니다.</text>
<text data-source="root.0.2.4" x="112.000" y="464.800" font-size="20" font-weight="700" fill="#111827">Glue Data Catalog</text>
<text data-source="root.0.2.4" x="112.000" y="500.800" font-size="18" font-weight="400" fill="#111827">database, table, partition metadata를 보관합니다.</text>
<text data-source="root.0.2.6" x="1048.000" y="464.800" font-size="20" font-weight="700" fill="#111827">Lake Formation</text>
<text data-source="root.0.2.6" x="1048.000" y="500.800" font-size="18" font-weight="400" fill="#111827">fine-grained authorization을 적용합니다.</text>
<text data-source="root.0.2.8.0.0" x="112.000" y="655.100" font-size="20" font-weight="700" fill="#111827">row와 cell 필터 지원</text>
<text data-source="root.0.2.8.0.1.0" x="128.000" y="714.100" font-size="20" font-weight="700" fill="#111827">Athena SQL</text>
<text data-source="root.0.2.8.0.1.0" x="128.000" y="750.100" font-size="18" font-weight="400" fill="#111827">table, column,</text>
<text data-source="root.0.2.8.0.1.0" x="128.000" y="774.400" font-size="18" font-weight="400" fill="#111827">row, cell reads</text>
<text data-source="root.0.2.8.0.1.1" x="314.000" y="714.100" font-size="20" font-weight="700" fill="#111827">Redshift</text>
<text data-source="root.0.2.8.0.1.1" x="314.000" y="740.100" font-size="20" font-weight="700" fill="#111827">Spectrum</text>
<text data-source="root.0.2.8.0.1.1" x="314.000" y="776.100" font-size="18" font-weight="400" fill="#111827">table, column,</text>
<text data-source="root.0.2.8.0.1.1" x="314.000" y="800.400" font-size="18" font-weight="400" fill="#111827">row, cell reads</text>
<text data-source="root.0.2.8.0.1.2" x="128.000" y="874.700" font-size="20" font-weight="700" fill="#111827">EMR Spark</text>
<text data-source="root.0.2.8.0.1.2" x="128.000" y="910.700" font-size="18" font-weight="400" fill="#111827">table, column,</text>
<text data-source="root.0.2.8.0.1.2" x="128.000" y="935.000" font-size="18" font-weight="400" fill="#111827">row, cell reads</text>
<text data-source="root.0.2.8.1.0" x="516.000" y="655.100" font-size="20" font-weight="700" fill="#111827">지원하지 않는 엔진</text>
<text data-source="root.0.2.8.1.1" x="532.000" y="714.100" font-size="20" font-weight="700" fill="#111827">Unsupported engine</text>
<text data-source="root.0.2.8.1.1" x="532.000" y="750.100" font-size="18" font-weight="400" fill="#111827">Athena Spark, EMR on EKS, EMR</text>
<text data-source="root.0.2.8.1.1" x="532.000" y="774.400" font-size="18" font-weight="400" fill="#111827">Serverless Hive는 이 경로의 row와</text>
<text data-source="root.0.2.8.1.1" x="532.000" y="798.700" font-size="18" font-weight="400" fill="#111827">cell 필터를 지원하지 않습니다.</text>
