<text data-source="root.0.0" x="64.000" y="207.250" font-size="36" font-weight="700" fill="#111827">Packer가 Golden AMI를 만드는 흐름</text>
<text data-source="root.0.1.0" x="88.000" y="295.850" font-size="28" font-weight="700" fill="#111827">1. 이미지 빌드</text>
<text data-source="root.0.1.1.0" x="228.000" y="381.650" font-size="28" font-weight="700" fill="#111827">HCL 템플릿</text>
<text data-source="root.0.1.1.0" x="228.000" y="424.050" font-size="22" font-weight="400" fill="#111827">source &quot;amazon-ebs&quot;와</text>
<text data-source="root.0.1.1.0" x="228.000" y="453.750" font-size="22" font-weight="400" fill="#111827">provisioner &quot;shell&quot; 정의</text>
<text data-source="root.0.1.1.2" x="844.000" y="381.650" font-size="28" font-weight="700" fill="#111827">임시 EC2</text>
<text data-source="root.0.1.1.2" x="844.000" y="424.050" font-size="22" font-weight="400" fill="#111827">Provisioner: Nginx 설치와</text>
<text data-source="root.0.1.1.2" x="844.000" y="453.750" font-size="22" font-weight="400" fill="#111827">설정 저장</text>
<text data-source="root.0.1.1.4" x="1460.000" y="381.650" font-size="28" font-weight="700" fill="#111827">Golden AMI</text>
<text data-source="root.0.1.1.4" x="1460.000" y="424.050" font-size="22" font-weight="400" fill="#111827">설치 결과를 담은 재사용 가능한</text>
<text data-source="root.0.1.1.4" x="1460.000" y="453.750" font-size="22" font-weight="400" fill="#111827">머신 이미지</text>
<text data-source="root.0.1.1.1" x="580.000" y="358.150" font-size="22" font-weight="400" fill="#111827">Builder가</text>
<text data-source="root.0.1.1.1" x="580.000" y="387.850" font-size="22" font-weight="400" fill="#111827">임시 EC2 생성</text>
<text data-source="root.0.1.1.3" x="1188.000" y="358.150" font-size="22" font-weight="400" fill="#111827">구성된 디스크</text>
<text data-source="root.0.1.1.3" x="1188.000" y="387.850" font-size="22" font-weight="400" fill="#111827">상태 캡처</text>
<text data-source="root.0.1.2" x="88.000" y="531.450" font-size="22" font-weight="400" fill="#111827">빌드가 끝나면 임시 인스턴스와 빌드 리소스를 정리합니다.</text>
<text data-source="root.0.3.0" x="88.000" y="724.850" font-size="28" font-weight="700" fill="#111827">2. 이미지 사용</text>
<text data-source="root.0.3.1.0" x="196.000" y="810.650" font-size="28" font-weight="700" fill="#111827">새 EC2 인스턴스들</text>
<text data-source="root.0.3.1.0" x="196.000" y="853.050" font-size="22" font-weight="400" fill="#111827">Golden AMI의 Ubuntu, Nginx, 설정 파일을 포함해 부팅합니다.</text>
<text data-source="root.0.2" x="980.000" y="625.150" font-size="22" font-weight="400" fill="#111827">Golden AMI를 배포에서 참조</text>
</svg>
