    <rect x="1350" y="654" width="370" height="84" rx="16" fill="#60a5fa"/>
  </g>
  <line x1="136" y1="900" x2="1770" y2="900" stroke="#e2e8f0" stroke-width="3"/>
  <text x="138" y="972" font-size="32" font-weight="500" letter-spacing="4" fill="#64748b">MODEL / ENGINE / SERVICE</text>
