<figure class="sd sd--flow" id="route-selection-order" aria-labelledby="route-selection-order-title">
  <figcaption class="sd-title" id="route-selection-order-title">경로 설치와 packet forwarding은 서로 다른 선택 과정입니다</figcaption>
<div class="sd-grid">
<section class="sd-lane"><div class="sd-lane-title">Control plane: prefix별 경로 설치</div>
<div class="sd-flow">
<div class="sd-node"><strong class="sd-label">Routing protocol metric</strong><span class="sd-detail">같은 protocol 안의 후보 비교: RIP hop 수, OSPF cost</span></div>
<div class="sd-arrow"><span class="sd-edge-label">protocol별 선택 경로를 제시</span></div>
<div class="sd-node"><strong class="sd-label">Administrative distance</strong><span class="sd-detail">같은 prefix를 제시한 서로 다른 출처의 로컬 선호도 비교</span></div>
<div class="sd-arrow"><span class="sd-edge-label">선택 경로 설치</span></div>
<div class="sd-node sd-node--accent"><strong class="sd-label">Routing / forwarding table</strong><span class="sd-detail">prefix별 next hop을 설치하며 동등 경로 처리도 반영</span></div>
</div>
</section>
<section class="sd-lane"><div class="sd-lane-title">Data plane: packet마다 lookup</div>
<div class="sd-flow">
<div class="sd-node"><strong class="sd-label">Destination IP</strong><span class="sd-detail">forwarding할 packet의 목적지</span></div>
<div class="sd-arrow"><span class="sd-edge-label">이미 설치된 table 조회</span></div>
<div class="sd-node sd-node--accent"><strong class="sd-label">Longest prefix match</strong><span class="sd-detail">일치하는 설치 경로 중 가장 긴 prefix 선택</span></div>
<div class="sd-arrow"><span class="sd-edge-label">선택한 route의 next hop 사용</span></div>
<div class="sd-node"><strong class="sd-label">Forward packet</strong><span class="sd-detail">해당 경로로 전달하며 AD나 protocol metric을 다시 경쟁시키지 않음</span></div>
</div>
</section>
</div>
<p class="sd-note">더 구체적인 설치 경로가 forwarding에서 우선합니다. 경로 설치의 세부 우선순위와 ECMP 처리는 장비 및 설정에 따라 다릅니다.</p>
</figure>
