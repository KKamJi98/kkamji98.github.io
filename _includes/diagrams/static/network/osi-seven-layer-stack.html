<figure class="sd sd--layers" id="osi-seven-layer-stack" aria-labelledby="osi-seven-layer-stack-title">
  <figcaption class="sd-title" id="osi-seven-layer-stack-title">OSI stack은 코드가 아니라 장애를 묻는 순서를 정합니다</figcaption>
  <p class="sd-intro">실제 TCP/IP stack은 여러 계층을 함께 구현할 수 있지만, L7에서 L1로 내려가는 순서가 증상과 책임 범위를 좁히는 기준이 됩니다.</p>

  <div class="sd-stack" aria-label="OSI seven layer stack">
    <section class="sd-band sd-band--accent" aria-labelledby="osi-seven-layer-stack-l7-title">
      <div class="sd-band-title" id="osi-seven-layer-stack-l7-title">L7 Application</div>
      <span class="sd-detail">HTTP, DNS, TLS handshake payloads</span>
    </section>
    <section class="sd-band" aria-labelledby="osi-seven-layer-stack-l6-title">
      <div class="sd-band-title" id="osi-seven-layer-stack-l6-title">L6 Presentation</div>
      <span class="sd-detail">encoding, serialisation, encryption</span>
    </section>
    <section class="sd-band" aria-labelledby="osi-seven-layer-stack-l5-title">
      <div class="sd-band-title" id="osi-seven-layer-stack-l5-title">L5 Session</div>
      <span class="sd-detail">dialogue setup, 유지, teardown</span>
    </section>
    <section class="sd-band" aria-labelledby="osi-seven-layer-stack-l4-title">
      <div class="sd-band-title" id="osi-seven-layer-stack-l4-title">L4 Transport</div>
      <span class="sd-detail">TCP와 UDP의 port, segment, 흐름 제어</span>
    </section>
    <section class="sd-band" aria-labelledby="osi-seven-layer-stack-l3-title">
      <div class="sd-band-title" id="osi-seven-layer-stack-l3-title">L3 Network</div>
      <span class="sd-detail">IP address, packet, routing</span>
    </section>
    <section class="sd-band" aria-labelledby="osi-seven-layer-stack-l2-title">
      <div class="sd-band-title" id="osi-seven-layer-stack-l2-title">L2 Data Link</div>
      <span class="sd-detail">Ethernet의 MAC address와 frame</span>
    </section>
    <section class="sd-band" aria-labelledby="osi-seven-layer-stack-l1-title">
      <div class="sd-band-title" id="osi-seven-layer-stack-l1-title">L1 Physical</div>
      <span class="sd-detail">electrical, optical, radio signal</span>
    </section>
  </div>

  <p class="sd-note">장비를 한 계층에만 고정하지 말고 실제로 처리하는 header와 policy를 확인합니다. 진단은 link와 IP에서 시작해 routing, port, DNS, TLS, HTTP 순으로 좁힐 수 있습니다.</p>
</figure>
