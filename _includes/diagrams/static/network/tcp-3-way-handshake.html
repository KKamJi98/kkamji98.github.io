<figure class="sd sd--sequence sd--fhd" id="tcp-3-way-handshake" aria-labelledby="tcp-3-way-handshake-title" data-canvas-width="1920" data-canvas-height="1080">
  <figcaption class="sd-title" id="tcp-3-way-handshake-title">세 TCP segment가 양쪽을 ESTABLISHED로 옮깁니다</figcaption><div class="sd-semantic-source">
  <p class="sd-intro">각 endpoint는 자기 sequence number가 확인된 것을 봐야 하므로 SYN, SYN plus ACK, 마지막 ACK의 세 단계가 필요합니다.</p>

  <div class="sd-flow" aria-label="TCP 3-way handshake 흐름">
    <div class="sd-node">
      <strong class="sd-label">SYN: client to server</strong>
      <span class="sd-detail"><code>client seq = x</code>. client는 <code>SYN-SENT</code>로 이동</span>
    </div>

    <div class="sd-arrow"><span class="sd-edge-label">server가 x + 1을 확인하고 자신의 sequence를 보냄</span></div>

    <div class="sd-node">
      <strong class="sd-label">SYN, ACK: server to client</strong>
      <span class="sd-detail"><code>server seq = y, ack = x + 1</code>. server는 <code>SYN-RECEIVED</code></span>
    </div>

    <div class="sd-arrow"><span class="sd-edge-label">client가 y + 1을 ACK</span></div>

    <div class="sd-node">
      <strong class="sd-label">ACK: client to server</strong>
      <span class="sd-detail"><code>ack = y + 1</code>. client는 <code>ESTABLISHED</code>로 이동</span>
    </div>

    <div class="sd-arrow"><span class="sd-edge-label">양쪽 endpoint의 sequence 확인 완료</span></div>

    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Both sides ESTABLISHED</strong>
      <span class="sd-detail">양방향 data transfer 시작 가능</span>
    </div>
  </div>

  <p class="sd-note">이 그림은 일반적인 연결 수립 순서입니다. 실제 경로에서는 retransmission, simultaneous open, 거절과 보안 장비 정책으로 상태 전이가 달라질 수 있습니다.</p>
</div>
