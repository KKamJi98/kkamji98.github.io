  <div class="sd-node sd-node--warning" id="dg-dev"><strong class="sd-label">Workspace dev</strong><span class="sd-detail">GRANT가 있어도<br>catalog main 접근 거부</span></div>

  <section class="sd-lane" id="dg-metastore">
    <div class="sd-lane-title" id="dg-metastore-title">Metastore, region당 1개</div>
    <p class="sd-note" id="dg-metastore-note">data-readers group에 준 GRANT</p>
    <div class="sd-node" id="dg-catalog"><strong class="sd-label">catalog main</strong><span class="sd-detail">USE CATALOG<br>binding 대상: prod</span></div>
    <div class="sd-node" id="dg-schema"><strong class="sd-label">schema sales</strong><span class="sd-detail">USE SCHEMA<br>SELECT, 아래 테이블에 상속</span></div>
    <div class="sd-node" id="dg-table"><strong class="sd-label">table orders</strong><span class="sd-detail">Parquet와 _delta_log<br>S3 external location</span></div>
  </section>
  <div class="sd-arrow" id="dg-dev-link" data-from="dg-dev" data-to="dg-metastore" aria-label="dev workspace가 metastore에 연결"></div>
  <div class="sd-arrow" id="dg-prod-link" data-from="dg-prod" data-to="dg-metastore" aria-label="prod workspace가 metastore에 연결"></div>
  <div class="sd-arrow" id="dg-binding" data-from="dg-catalog" data-to="dg-prod" aria-label="workspace-catalog binding으로 catalog main을 prod에만 묶음"></div>
  <p class="sd-note" id="dg-binding-note">workspace-catalog binding</p>
  <div class="sd-arrow" id="dg-contains-schema" data-from="dg-catalog" data-to="dg-schema" aria-label="catalog가 schema를 포함"></div>
  <div class="sd-arrow" id="dg-contains-table" data-from="dg-schema" data-to="dg-table" aria-label="schema가 table을 포함"></div>
  <p class="sd-note" id="dg-default">binding이 없으면 같은 metastore를 쓰는 모든 workspace에서 GRANT가 그대로 유효합니다</p>
</div>
