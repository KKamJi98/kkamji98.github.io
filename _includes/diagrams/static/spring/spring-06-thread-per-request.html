<figure class="sd sd--comparison" id="spring-06-thread-per-request" aria-labelledby="spring-06-thread-per-request-title">
  <figcaption class="sd-title" id="spring-06-thread-per-request-title">Thread-per-request: 요청마다 worker 하나를 점유 (Tomcat thread pool 기본 약 200)</figcaption>
  <table class="sd-table">
    <thead>
      <tr>
        <th scope="col">요청</th>
        <th scope="col">할당된 worker</th>
        <th scope="col">상태</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Request A</th>
        <td>worker-1</td>
        <td>I/O 대기 중에도 worker 점유</td>
      </tr>
      <tr>
        <th scope="row">Request B</th>
        <td>worker-2</td>
        <td>I/O 대기 중에도 worker 점유</td>
      </tr>
      <tr>
        <th scope="row">Request C</th>
        <td>worker-3</td>
        <td>I/O 대기 중에도 worker 점유</td>

        <th scope="row">Request D, E, ...</th>
