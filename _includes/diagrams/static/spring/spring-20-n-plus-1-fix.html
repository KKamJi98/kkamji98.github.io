<figure class="sd sd--comparison" id="sd-spring-20-n-plus-1-fix" aria-labelledby="sd-spring-20-title">
  <figcaption class="sd-title" id="sd-spring-20-title">N+1 해결: JOIN FETCH와 batch fetching</figcaption>
  <div class="sd-grid">
    <section class="sd-lane" aria-labelledby="sd-spring-20-join-title">
      <div class="sd-lane-title" id="sd-spring-20-join-title">Solution A: JOIN FETCH</div>
      <div class="sd-flow">
        <div class="sd-node sd-node--accent"><strong class="sd-label">JOIN FETCH query</strong><span class="sd-detail">SELECT o FROM Order o JOIN FETCH o.items, 부모와 children을 같은 조회 계획에 포함</span></div>
        <div class="sd-arrow"><span class="sd-edge-label">한 번에 조회</span></div>
        <div class="sd-node"><strong class="sd-label">one query</strong><span class="sd-detail">N+1을 조인 한 번으로 축소, 보통 우선 검토</span></div>
      </div>
    </section>
    <section class="sd-lane" aria-labelledby="sd-spring-20-batch-title">
      <div class="sd-lane-title" id="sd-spring-20-batch-title">Solution B: batch fetching (@BatchSize = k)</div>
      <div class="sd-flow">
        <div class="sd-node"><strong class="sd-label">One parent query</strong><span class="sd-detail">Order 목록을 먼저 조회</span></div>
        <div class="sd-arrow"><span class="sd-edge-label">IN 절로 묶음</span></div>
        <div class="sd-node"><strong class="sd-label">WHERE order_id IN (...)</strong><span class="sd-detail">LAZY 연관을 최대 k개 단위로 초기화</span></div>
        <div class="sd-arrow"><span class="sd-edge-label">조회 수 제한</span></div>
        <div class="sd-node sd-node--warning"><strong class="sd-label">1 + ceil(N / k) queries</strong><span class="sd-detail">추가 조회는 남지만 페이지 단위로 bounded</span></div>
      </div>
    </section>
  </div>
  <p class="sd-note">EntityGraph는 같은 fetch plan을 선언하고, DTO projection은 엔티티 자체를 로드하지 않는 선택지입니다. 컬렉션 JOIN FETCH와 paging은 결과 행과 메모리 사용량을 함께 점검합니다.</p>
</figure>
