<figure class="sd sd--flow" id="sd-spring-21-build-pipeline" aria-labelledby="sd-spring-21-title">
  <figcaption class="sd-title" id="sd-spring-21-title">Spring Boot 빌드와 실행 가능 jar</figcaption>
  <div class="sd-flow">
    <div class="sd-node"><strong class="sd-label">src</strong><span class="sd-detail">src/main/java와 build file, Gradle 또는 Maven</span></div>
    <div class="sd-arrow"><span class="sd-edge-label">빌드 단계</span></div>
    <div class="sd-node"><strong class="sd-label">compile and test</strong><span class="sd-detail">소스 컴파일과 테스트 실행</span></div>
    <div class="sd-arrow"><span class="sd-edge-label">package</span></div>
    <div class="sd-node sd-node--accent"><strong class="sd-label">package: Spring Boot plugin</strong><span class="sd-detail">Gradle bootJar 또는 Maven repackage</span></div>
    <div class="sd-arrow"><span class="sd-edge-label">repackage</span></div>
    <div class="sd-node"><strong class="sd-label">executable fat jar</strong><span class="sd-detail">BOOT-INF/classes, BOOT-INF/lib, JarLauncher를 포함</span></div>
    <div class="sd-arrow"><span class="sd-edge-label">실행</span></div>
    <div class="sd-node sd-node--accent"><strong class="sd-label">java -jar app.jar</strong><span class="sd-detail">앱과 모든 의존성을 하나의 archive에서 시작</span></div>
  </div>
  <p class="sd-note">fat jar는 애플리케이션과 모든 dependency를 함께 담기 때문에 Spring Boot 전용 classloader와 launcher를 사용합니다.</p>
</figure>
