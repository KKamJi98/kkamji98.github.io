<figure class="sd sd--flow" aria-labelledby="sap-c02-ops-event-routing-title">

  <div class="sd-stack">
    <section class="sd-lane sd-lane--muted">

        </div>
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">Config rule</strong>
