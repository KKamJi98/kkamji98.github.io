<figure class="sd sd--comparison" id="kms-cross-account-key-access" aria-labelledby="kms-cross-account-key-access-title">
  <figcaption class="sd-title" id="kms-cross-account-key-access-title">교차 계정 SSE-KMS 접근은 key policy의 위임이 있어야 성립한다</figcaption>
  <p class="sd-note">분석 계정 IAM policy와 데이터 계정 bucket policy 및 KMS key policy가 함께 허용되어야 합니다. 이 예시의 key policy 위임이 없으면 IAM의 kms:Decrypt Allow만으로는 부족합니다.</p>
  <div class="sd-flow">
    <section class="sd-lane">
      <div class="sd-lane-title">분석 계정 222222222222</div>
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">분석 role</strong>
        <span class="sd-detail">GetObject를 호출합니다.</span>
      </div>
      <p class="sd-note">부착된 IAM policy: s3:GetObject와 kms:Decrypt Allow</p>
    </section>
    <div class="sd-arrow">
      <span class="sd-edge-label">분석 role의 s3:GetObject 요청</span>
    </div>
    <section class="sd-lane">
      <div class="sd-lane-title">데이터 계정 111111111111</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">SSE-KMS 버킷</strong>
          <span class="sd-detail">객체마다 data key로 암호화합니다. bucket policy가 분석 role의 GetObject를 허용해야 합니다.</span>
        </div>
        <div class="sd-arrow">
          <span class="sd-edge-label">S3가 요청자를 대신해 KMS Decrypt 호출</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">customer managed key</strong>
          <span class="sd-detail">Decrypt 호출을 받습니다. key policy가 분석 계정 222222222222에 키 사용을 위임해야 합니다.</span>
        </div>
      </div>
    </section>
  </div>
  <section class="sd-lane">
    <div class="sd-lane-title">인가 결과</div>
    <div class="sd-grid">
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">복호화 성공</strong>
        <span class="sd-detail">key policy 위임과 IAM Allow 및 bucket policy가 모두 성립하는 경로입니다.</span>
      </div>
      <div class="sd-node sd-node--warning">
        <strong class="sd-label">AccessDenied</strong>
        <span class="sd-detail">이 예시에서 key policy 위임이 없으면 IAM Allow만으로 접근할 수 없습니다.</span>
      </div>
    </div>
  </section>
</figure>
