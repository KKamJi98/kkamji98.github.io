<figure class="sd sd--comparison" id="kms-cross-account-key-access" aria-labelledby="kms-cross-account-key-access-title">
  <figcaption class="sd-title" id="kms-cross-account-key-access-title">교차 계정 SSE-KMS 접근은 key policy의 위임이 있어야 성립한다</figcaption>
  <p class="sd-note">분석 계정 IAM policy와 데이터 계정 bucket policy와 KMS key policy가 함께 허용되어야 합니다. key policy의 위임이 없으면 IAM policy의 kms:Decrypt Allow만으로는 부족합니다.</p>

  <div class="sd-grid">
    <section class="sd-lane" aria-labelledby="kms-cross-account-key-access-analytics-title">
      <div class="sd-lane-title" id="kms-cross-account-key-access-analytics-title">분석 계정 222222222222</div>
      <div class="sd-flow">
        <div class="sd-node"><strong class="sd-label">IAM policy</strong><span class="sd-detail">s3:GetObject와 kms:Decrypt를 Allow합니다.</span></div>
        <div class="sd-arrow"><span class="sd-edge-label">principal에 부착</span></div>
        <div class="sd-node sd-node--accent"><strong class="sd-label">분석 role</strong><span class="sd-detail">GetObject를 호출합니다.</span></div>
      </div>
    </section>

    <section class="sd-lane" aria-labelledby="kms-cross-account-key-access-data-title">
      <div class="sd-lane-title" id="kms-cross-account-key-access-data-title">데이터 계정 111111111111</div>
      <div class="sd-flow">
        <div class="sd-node"><strong class="sd-label">bucket policy</strong><span class="sd-detail">분석 role의 GetObject를 허용합니다.</span></div>
        <div class="sd-arrow"><span class="sd-edge-label">버킷 경계</span></div>
        <div class="sd-node"><strong class="sd-label">SSE-KMS 버킷</strong><span class="sd-detail">객체마다 data key로 암호화합니다.</span></div>
        <div class="sd-arrow"><span class="sd-edge-label">Decrypt 요청</span></div>
        <div class="sd-node sd-node--warning"><strong class="sd-label">key policy</strong><span class="sd-detail">222 계정에 위임하는 문장이 있어야 합니다.</span></div>
        <div class="sd-arrow"><span class="sd-edge-label">키 사용</span></div>
        <div class="sd-node"><strong class="sd-label">customer managed key</strong><span class="sd-detail">Decrypt 호출을 받습니다.</span></div>
      </div>
    </section>
  </div>

  <div class="sd-arrow"><span class="sd-edge-label">두 계정의 정책을 모두 평가</span></div>
  <div class="sd-grid">
    <div class="sd-node sd-node--accent"><strong class="sd-label">복호화 성공</strong><span class="sd-detail">key policy 위임과 IAM Allow와 bucket policy가 모두 있을 때만 가능합니다.</span></div>
    <div class="sd-node sd-node--warning"><strong class="sd-label">AccessDenied</strong><span class="sd-detail">위임 문장이 없으면 IAM Allow가 무효가 됩니다.</span></div>
  </div>
</figure>
