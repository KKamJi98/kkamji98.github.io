<figure class="sd sd--comparison" id="sd-sap-c02-session-tags-abac" aria-labelledby="sd-title-session-tags-abac">
  <figcaption class="sd-title" id="sd-title-session-tags-abac">session tag는 aws:PrincipalTag가 되어 리소스 태그와 비교됩니다</figcaption>
  <div class="sd-grid">
  <section class="sd-band">
  <div class="sd-band-title">Principal 입력</div>
  <div class="sd-flow">
  <div class="sd-node">
  <strong class="sd-label">IdP 속성</strong>
  <span class="sd-detail">SAML attribute 또는 JWT claim</span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">sts:TagSession</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">session tag</strong>
  <span class="sd-detail">최대 50개, key 128자, value 256자</span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">request context</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">aws:PrincipalTag</strong>
  <span class="sd-detail">session tag에서 전달</span>
  </div>
  </div>
  </section>
  <section class="sd-band">
  <div class="sd-band-title">독립된 Resource 입력</div>
  <div class="sd-node">
  <strong class="sd-label">aws:ResourceTag</strong>
  <span class="sd-detail">접근 대상 리소스에 별도로 설정된 태그</span>
  </div>
  </section>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">두 독립 입력을 비교</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">정책 Condition</strong>
  <span class="sd-detail">aws:PrincipalTag와 aws:ResourceTag 비교</span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">조건 평가</span>
  </div>
  <div class="sd-grid">
  <div class="sd-node">
  <strong class="sd-label">일치</strong>
  <span class="sd-detail">이 Allow 조건 충족. 다른 정책의 Deny와 권한 경계도 적용</span>
  </div>
  <div class="sd-node sd-node--warning">
  <strong class="sd-label">불일치</strong>
  <span class="sd-detail">이 조건으로 Allow되지 않음</span>
  </div>
  </div>
  <p class="sd-note">trust policy에 sts:TagSession이 없으면 태그 누락이 아니라 AssumeRole 호출 자체가 실패합니다.</p>
</figure>
