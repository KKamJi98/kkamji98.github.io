<figure class="sd sd--comparison" id="sd-sap-c02-transfer-family-endpoint-types" aria-labelledby="sd-title-transfer-family-endpoint-types">
  <figcaption class="sd-title" id="sd-title-transfer-family-endpoint-types">Transfer Family endpoint 타입이 허용 프로토콜과 통제 수단을 정합니다</figcaption>
  <div class="sd-grid">
    <section class="sd-lane" aria-label="PUBLIC endpoint">
      <div class="sd-lane-title">PUBLIC</div>
      <div class="sd-stack">
        <div class="sd-node">
          <strong class="sd-label">PUBLIC endpoint</strong>
          <span class="sd-detail">security group과 Elastic IP를 지정할 수 없음</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">SFTP만</strong>
          <span class="sd-detail">FTP와 FTPS는 VPC endpoint 필요</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">S3 또는 EFS</strong>
          <span class="sd-detail">PUBLIC도 대상 저장소는 동일</span>
        </div>
      </div>
      <div class="sd-node sd-node--warning">
        <strong class="sd-label">고정 IP / source IP 제한</strong>
        <span class="sd-detail">PUBLIC은 source IP 제한과 고정 IP 요구를 만족하지 못함</span>
      </div>
    </section>
    <section class="sd-lane" aria-label="VPC Internet Facing endpoint">
      <div class="sd-lane-title">VPC Internet Facing</div>
      <div class="sd-stack">
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">VPC Internet Facing</strong>
          <span class="sd-detail">서브넷마다 Elastic IP, 최대 3개 AZ. security group으로 source 제한</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">SFTP와 FTPS만</strong>
          <span class="sd-detail">FTP는 허용하지 않음</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">S3 또는 EFS</strong>
          <span class="sd-detail">Transfer Family 대상, FSx는 대상 아님</span>
        </div>
      </div>
    </section>
    <section class="sd-lane" aria-label="VPC Internal endpoint">
      <div class="sd-lane-title">VPC Internal</div>
      <div class="sd-stack">
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">VPC Internal</strong>
          <span class="sd-detail">내부 접근, security group으로 source 제한. custom hostname은 지원하지 않음</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">FTP, SFTP, FTPS</strong>
          <span class="sd-detail">FTP/FTPS: 컨트롤 21, 데이터 8192-8200. SFTP: 기본 22</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">S3 또는 EFS</strong>
          <span class="sd-detail">Transfer Family 대상, FSx는 대상 아님</span>
        </div>
      </div>
    </section>
    <section class="sd-lane" aria-label="폐지된 VPC endpoint 타입">
      <div class="sd-lane-title">VPC_ENDPOINT</div>
      <div class="sd-stack">
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">VPC_ENDPOINT</strong>
          <span class="sd-detail">2021-05-19부터 신규 생성 불가</span>
        </div>
      </div>
    </section>
  </div>
  <p class="sd-note">고정 IP와 source IP 제한이 필요하면 VPC 타입을 선택합니다. 평문 FTP는 VPC Internal과 내부 접근 경로로만 받을 수 있습니다.</p>
</figure>
