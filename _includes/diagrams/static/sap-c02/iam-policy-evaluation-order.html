<figure class="sd sd--sequence" id="iam-policy-evaluation-order" aria-labelledby="iam-policy-evaluation-order-title">
  <figcaption class="sd-title" id="iam-policy-evaluation-order-title">IAM은 explicit Deny와 적용 가능한 정책의 권한을 평가한다</figcaption>
  <p class="sd-note">요청에 적용되는 정책만 평가합니다. 평가 순서는 정책 객체를 호출하는 request hop이 아니며 모든 정책 종류에서 각각 Allow를 받아야 한다는 뜻도 아닙니다.</p>
  <div class="sd-flow">
    <div class="sd-node">
      <strong class="sd-label">API 요청</strong>
      <span class="sd-detail">인증 후 request context를 만듭니다. 일반적인 기본값은 implicit deny이며 root user의 기본 권한은 별도입니다.</span>
    </div>
    <div class="sd-arrow">
      <span class="sd-edge-label">적용 정책에서 explicit Deny 확인</span>
    </div>
    <div class="sd-node sd-node--warning">
      <strong class="sd-label">1. Deny evaluation</strong>
      <span class="sd-detail">어느 적용 정책에든 explicit Deny가 있으면 즉시 거부합니다.</span>
    </div>
  </div>
  <section class="sd-lane">
    <div class="sd-lane-title">explicit Deny 없음: 적용 조건에 따른 평가</div>
    <div class="sd-node">
      <strong class="sd-label">2. RCP</strong>
      <span class="sd-detail">RCP가 활성화된 조직에서 지원 리소스에 적용합니다. 활성화 시 RCPFullAWSAccess가 자동 부착됩니다.</span>
    </div>
    <div class="sd-node">
      <strong class="sd-label">3. SCP</strong>
      <span class="sd-detail">적용 대상 계정의 principal 권한 상한입니다. management account에는 적용되지 않습니다.</span>
    </div>
    <div class="sd-node">
      <strong class="sd-label">4. resource-based policy</strong>
      <span class="sd-detail">리소스 정책이 권한을 준 principal ARN 종류와 동일 계정/교차 계정 여부에 따라 이후 결합이 달라집니다.</span>
    </div>
    <div class="sd-node">
      <strong class="sd-label">5. identity-based policy</strong>
      <span class="sd-detail">principal에 권한을 부여합니다. 동일 계정의 resource policy 허용과는 일반적으로 합집합이며 모든 요청에 별도 identity Allow가 필요한 것은 아닙니다.</span>
    </div>
    <div class="sd-node">
      <strong class="sd-label">6. permissions boundary</strong>
      <span class="sd-detail">부착된 user와 role의 상한입니다. 동일 계정에서 IAM user ARN 또는 session ARN에 직접 부여된 resource policy 권한의 implicit-deny 예외를 구분합니다.</span>
    </div>
    <div class="sd-node">
      <strong class="sd-label">7. session policy</strong>
      <span class="sd-detail">세션에 전달된 정책이 적용될 때 권한을 제한합니다. role ARN과 직접 부여된 session ARN의 차이를 구분합니다.</span>
    </div>
  </section>
  <div class="sd-grid">
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">허용</strong>
      <span class="sd-detail">해당 요청에 필요한 권한이 성립하고 적용되는 상한을 만족할 때만 허용합니다.</span>
    </div>
    <div class="sd-node sd-node--warning">
      <strong class="sd-label">거부</strong>
      <span class="sd-detail">적용 정책의 explicit Deny 또는 필요한 권한 부재에 따른 implicit deny입니다.</span>
    </div>
  </div>
  <p class="sd-note">role trust policy와 KMS key policy는 explicit Allow 요구를 별도로 확인합니다. 정책의 적용 여부와 principal 종류를 먼저 확정해야 합니다.</p>
</figure>
