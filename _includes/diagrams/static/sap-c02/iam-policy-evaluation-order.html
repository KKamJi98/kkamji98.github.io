<figure class="sd sd--sequence" id="iam-policy-evaluation-order" aria-labelledby="iam-policy-evaluation-order-title">
  <figcaption class="sd-title" id="iam-policy-evaluation-order-title">요청은 일곱 단계를 순서대로 통과해야 허용된다</figcaption>
  <p class="sd-note">1단계에서 모든 정책 타입의 explicit Deny를 먼저 찾습니다. 이후 단계에서 필요한 Allow가 없으면 implicit deny로 거부됩니다.</p>

  <div class="sd-flow" aria-label="IAM 정책 평가 순서">
    <div class="sd-node">
      <strong class="sd-label">API 요청</strong>
      <span class="sd-detail">기본값은 implicit deny입니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">request context</span></div>
    <div class="sd-node sd-node--warning">
      <strong class="sd-label">1. Deny evaluation</strong>
      <span class="sd-detail">여섯 정책 타입 전체에서 explicit Deny를 찾습니다.</span>
    </div>

    <div class="sd-grid">
      <section class="sd-lane" aria-labelledby="iam-policy-evaluation-order-denied-title">
        <div class="sd-lane-title" id="iam-policy-evaluation-order-denied-title">explicit Deny가 발견됨</div>
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">거부</strong>
          <span class="sd-detail">첫 단계에서 즉시 끝나며 뒤의 여섯 단계를 보지 않습니다.</span>
        </div>
      </section>
      <section class="sd-lane" aria-labelledby="iam-policy-evaluation-order-continue-title">
        <div class="sd-lane-title" id="iam-policy-evaluation-order-continue-title">explicit Deny 없음</div>
        <div class="sd-flow">
          <div class="sd-node"><strong class="sd-label">2. RCP</strong><span class="sd-detail">RCPFullAWSAccess가 항상 붙어 있습니다.</span></div>
          <div class="sd-arrow"><span class="sd-edge-label">조직 리소스 상한</span></div>
          <div class="sd-node"><strong class="sd-label">3. SCP</strong><span class="sd-detail">조직이 정한 계정 상한입니다.</span></div>
          <div class="sd-arrow"><span class="sd-edge-label">정책 결합</span></div>
          <div class="sd-node"><strong class="sd-label">4. resource-based policy</strong><span class="sd-detail">지목한 ARN 종류가 뒤 단계의 적용을 바꿉니다.</span></div>
          <div class="sd-arrow"><span class="sd-edge-label">principal 권한</span></div>
          <div class="sd-node"><strong class="sd-label">5. identity-based policy</strong><span class="sd-detail">권한을 실제로 부여하는 정책입니다.</span></div>
          <div class="sd-arrow"><span class="sd-edge-label">상한 확인</span></div>
          <div class="sd-node"><strong class="sd-label">6. permissions boundary</strong><span class="sd-detail">user와 role에만 적용되는 상한입니다.</span></div>
          <div class="sd-arrow"><span class="sd-edge-label">세션이면 추가 확인</span></div>
          <div class="sd-node"><strong class="sd-label">7. session policy</strong><span class="sd-detail">세션 principal만 평가합니다.</span></div>
          <div class="sd-arrow"><span class="sd-edge-label">모든 단계 통과</span></div>
          <div class="sd-node sd-node--accent"><strong class="sd-label">허용</strong><span class="sd-detail">일곱 단계를 모두 통과했습니다.</span></div>
        </div>
      </section>
    </div>
    <p class="sd-note">2단계 이후 어느 단계에서든 필요한 Allow가 없으면 explicit Deny와 같은 거부 결과가 되지만, 원인은 implicit deny입니다.</p>
  </div>
</figure>
