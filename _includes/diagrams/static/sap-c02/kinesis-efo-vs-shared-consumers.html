<figure class="sd sd--comparison" id="kinesis-efo-vs-shared-consumers" aria-labelledby="kinesis-efo-vs-shared-consumers-title">

  <p class="sd-note">공유 GetRecords는 샤드당 2 MB/s를 컨슈머들이 나누고, EFO는 각 컨슈머에 2 MB/s와 약 70 ms 전파 지연을 전용으로 제공합니다.</p>

  <div class="sd-flow" aria-label="Kinesis consumer 읽기 모델 비교">

    </div>

    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Kinesis Data Stream</strong>
      <span class="sd-detail">shard가 처리량 단위입니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">두 읽기 모델</span></div>

    <div class="sd-grid">
      <section class="sd-lane" aria-labelledby="kinesis-efo-vs-shared-consumers-shared-title">
        <div class="sd-lane-title" id="kinesis-efo-vs-shared-consumers-shared-title">공유 처리량</div>
        <div class="sd-flow">
          <div class="sd-node">
            <strong class="sd-label">Shared throughput</strong>
            <span class="sd-detail">GetRecords pull, 샤드당 2 MB/s 총량을 모든 컨슈머가 나눕니다.</span>
          </div>
          <div class="sd-grid">
            <div class="sd-node"><strong class="sd-label">Consumer 1</strong><span class="sd-detail">shared read path</span></div>

          </div>
        </div>
      </section>

        <div class="sd-flow">
