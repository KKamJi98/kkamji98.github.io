<figure class="sd sd--comparison sd--fhd" id="dx-vif-reach-scope" aria-labelledby="dx-vif-reach-scope-title" data-canvas-width="1920" data-canvas-height="1080">
  <figcaption class="sd-title" id="dx-vif-reach-scope-title">같은 회선 위의 VIF 세 종류가 도달하는 대상이 다르다</figcaption><div class="sd-semantic-source">
  <p class="sd-note">고객 라우터의 하나의 Direct Connect 연결에서 VIF가 종단하는 gateway가 갈라지고, 그 결과 MTU와 prefix와 SiteLink 범위가 달라집니다.</p>

  <div class="sd-flow" aria-label="Direct Connect VIF 도달 범위">
    <div class="sd-node">
      <strong class="sd-label">고객 라우터</strong>
      <span class="sd-detail">온프레미스의 고객 라우터이며 VIF마다 BGP 세션 하나를 맺습니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">전용 또는 hosted 회선</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Direct Connect 연결</strong>
      <span class="sd-detail">dedicated는 VIF 51개, hosted는 종류와 무관하게 1개입니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">세 VIF 유형으로 분기</span></div>

    <div class="sd-grid sd-grid--three">
      <section class="sd-lane" aria-labelledby="dx-vif-reach-scope-private-title">
        <div class="sd-lane-title" id="dx-vif-reach-scope-private-title">private VIF</div>
<p class="sd-note">VGW 직접 종단 또는 Direct Connect gateway 종단을 선택합니다. DX gateway 경로에서는 연결된 VGW를 통해 VPC에 도달하며 SiteLink도 DX gateway 연결 시 지원합니다.</p>
        <div class="sd-flow">
          <div class="sd-node">
            <strong class="sd-label">연결 조건</strong>
            <span class="sd-detail">MTU 1500 또는 9001, 수신 prefix 기본 100</span>
          </div>
          <div class="sd-arrow"><span class="sd-edge-label">private 연결</span></div>
          <div class="sd-node">
            <strong class="sd-label">Virtual private gateway</strong>
            <span class="sd-detail">이 실선은 VGW에 직접 연결하는 예시이며 VGW 하나는 VPC 하나에 attach합니다.</span>
          </div>
          <div class="sd-arrow"><span class="sd-edge-label">private IP</span></div>
          <div class="sd-node sd-node--accent">
            <strong class="sd-label">VPC</strong>
            <span class="sd-detail">VPC의 private IP에 도달합니다.</span>
          </div>
        </div>
      </section>

      <section class="sd-lane" aria-labelledby="dx-vif-reach-scope-public-title">
        <div class="sd-lane-title" id="dx-vif-reach-scope-public-title">public VIF</div>
        <div class="sd-flow">
          <div class="sd-node">
            <strong class="sd-label">연결 조건</strong>
            <span class="sd-detail">jumbo 미지원, prefix 1,000 고정, SiteLink 미지원</span>
          </div>
          <div class="sd-arrow"><span class="sd-edge-label">AWS public prefix</span></div>
          <div class="sd-node">
            <strong class="sd-label">AWS public prefix 전체</strong>
            <span class="sd-detail">S3, EC2 public IP, 서비스 API endpoint에 도달합니다.</span>
          </div>
        </div>
      </section>

      <section class="sd-lane" aria-labelledby="dx-vif-reach-scope-transit-title">
        <div class="sd-lane-title" id="dx-vif-reach-scope-transit-title">transit VIF</div>
        <div class="sd-flow">
          <div class="sd-node">
            <strong class="sd-label">연결 조건</strong>
            <span class="sd-detail">dedicated당 4개, MTU 1500 또는 8500</span>
          </div>
          <div class="sd-arrow"><span class="sd-edge-label">gateway 연결</span></div>
          <div class="sd-node">
            <strong class="sd-label">Direct Connect gateway</strong>
            <span class="sd-detail">gateway 연결 한도는 VGW 20개 또는 TGW 6개입니다. 이 transit VIF 경로에서는 TGW에 연결합니다.</span>
          </div>
          <div class="sd-arrow"><span class="sd-edge-label">attachment 범위</span></div>
          <div class="sd-node sd-node--accent">
            <strong class="sd-label">Transit Gateway</strong>
            <span class="sd-detail">연결된 attachment가 대상이며 실제 도달은 TGW route table과 allowed prefix 설정에 따릅니다.</span>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
