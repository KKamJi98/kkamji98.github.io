<figure class="sd sd--comparison" aria-labelledby="sap-c02-regional-failover-trigger-layers-title">
  <figcaption class="sd-title" id="sap-c02-regional-failover-trigger-layers-title">리전 전환을 만드는 계층과 만들지 못하는 계층</figcaption>
  <div class="sd-flow">
    <div class="sd-node sd-node--muted">
      <strong class="sd-label">클라이언트 요청</strong>

    </div>
    <div class="sd-arrow"><span class="sd-edge-label">전환 계층 비교</span></div>
  </div>

      <div class="sd-grid">
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">Route 53 health check failover</strong>

        </div>
