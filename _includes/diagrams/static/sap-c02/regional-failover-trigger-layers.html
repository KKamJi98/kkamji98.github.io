<figure class="sd sd--comparison sd--fhd" aria-labelledby="sap-c02-regional-failover-trigger-layers-title" data-canvas-width="1920" data-canvas-height="1080">
  <figcaption class="sd-title" id="sap-c02-regional-failover-trigger-layers-title">Control plane 장애 중 지속적 리전 대피 수단을 비교한다</figcaption><div class="sd-semantic-source">
  <div class="sd-flow">
    <div class="sd-node sd-node--muted">
      <strong class="sd-label">클라이언트 요청</strong>
      <span class="sd-detail">primary 장애와 control plane 조작 불가를 가정해 전환 경로를 비교한다.</span>
    </div>
    <div class="sd-arrow" data-connector-role="continuation"><span class="sd-edge-label">전환 계층 비교</span></div>
  </div>
  <div class="sd-grid">
    <section class="sd-lane sd-lane--accent">
      <span class="sd-lane-title">사전 구성된 data plane 기반 전환</span>
      <div class="sd-grid">
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">Route 53 health check failover</strong>
          <span class="sd-detail">data plane 동작. 클라이언트 DNS cache TTL만큼 지연될 수 있다.</span>
        </div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">ARC routing control</strong>
          <span class="sd-detail">RECOVERY_CONTROL health check를 on 또는 off로 바꾸는 data plane API.</span>
        </div>
      </div>
    </section>
    <section class="sd-lane sd-lane--warning">
      <span class="sd-lane-title">같은 대피 요건으로 볼 수 없는 수단</span>
      <div class="sd-grid">
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">Global Accelerator traffic dial</strong>
          <span class="sd-detail">리전 간 traffic 분배와 active-standby가 가능하나 dial 변경은 control plane operation이다.</span>
        </div>
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">CloudFront origin failover</strong>
          <span class="sd-detail">설정된 실패 조건의 GET / HEAD / OPTIONS를 secondary로 재시도한다. 이후 origin 요청은 primary부터 시도한다.</span>
        </div>
      </div>
    </section>
  </div>
  <p class="sd-note">본문의 리전 전환 불가 분류는 이 대피 요건으로 한정해야 합니다. GA도 리전 간 전환이 가능하고 CloudFront도 secondary origin에 도달할 수 있습니다.</p>
  <div class="sd-node sd-node--accent">
    <strong class="sd-label">DR 리전 엔드포인트</strong>
    <span class="sd-detail">도달 가능성과 control plane 비의존 지속 대피는 다른 조건이다. 애플리케이션과 데이터의 복구 준비도 별도로 필요하다.</span>
  </div>
</div>
