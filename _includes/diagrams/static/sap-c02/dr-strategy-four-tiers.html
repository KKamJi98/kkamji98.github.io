<figure class="sd sd--comparison" id="dr-strategy-four-tiers" aria-labelledby="dr-strategy-four-tiers-title">
  <figcaption class="sd-title" id="dr-strategy-four-tiers-title">DR 전략 4종은 추가 조치 없이 요청을 처리할 수 있는가에서 갈린다</figcaption>
  <div class="sd-grid">
  <div class="sd-node">
  <strong class="sd-label">1. backup and restore</strong>
  <span class="sd-detail">백업 사본만 유지. 재해 후 복원, 배포, 확장; control plane 작업 필요</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">2. pilot light</strong>
  <span class="sd-detail">데이터 복제와 꺼진 코어 인프라. 서버 기동, 비핵심 배포, 확장 필요. Elastic Disaster Recovery의 전략</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">3. warm standby</strong>
  <span class="sd-detail">축소 규모가 상시 가동. 전환 시 요청 처리 가능하고 프로덕션 용량 확장 필요</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">4. multi-site active/active</strong>
  <span class="sd-detail">두 사이트가 상시 요청 처리. 장애 시 남은 사이트로 traffic 처리; 같은 규모의 active/passive는 hot standby</span>
  </div>
  </div>
  <p class="sd-note">번호가 커질수록 일반적으로 유지 비용과 복잡도는 높고 복구 시간은 짧습니다. 데이터 손상은 모든 사이트에 복제될 수 있으므로 active/active도 백업이 필요합니다.</p>
</figure>
