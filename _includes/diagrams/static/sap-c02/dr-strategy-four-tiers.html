<figure class="sd sd--comparison" id="dr-strategy-four-tiers" aria-labelledby="dr-strategy-four-tiers-title">
  <figcaption class="sd-title" id="dr-strategy-four-tiers-title">DR 전략 4종은 추가 조치 없이 요청을 처리할 수 있는가에서 갈린다</figcaption>
  <p class="sd-note">왼쪽에서 오른쪽으로 갈수록 비용과 복잡도는 오르고 복구 시간은 내려갑니다. 앞의 두 전략은 전환 뒤 작업이 남고, 뒤의 두 전략은 이미 요청을 처리합니다.</p>

  <div class="sd-grid" aria-label="네 가지 DR 전략 비교">
    <section class="sd-lane" aria-labelledby="dr-strategy-four-tiers-bnr-title">
      <div class="sd-lane-title" id="dr-strategy-four-tiers-bnr-title">1. backup and restore</div>
      <div class="sd-flow">
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">backup and restore</strong>
          <span class="sd-detail">복원 자체가 control plane operation입니다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">DR 리전 상태</span></div>
        <div class="sd-node">
          <strong class="sd-label">DR 리전에 백업 사본만 있다</strong>
          <span class="sd-detail">복원과 배포와 확장을 재해 이후에 시작합니다.</span>
        </div>
      </div>
      <p class="sd-note">전환 후 추가 조치가 필요합니다.</p>
    </section>

    <section class="sd-lane" aria-labelledby="dr-strategy-four-tiers-pilot-title">
      <div class="sd-lane-title" id="dr-strategy-four-tiers-pilot-title">2. pilot light</div>
      <div class="sd-flow">
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">pilot light</strong>
          <span class="sd-detail">Elastic Disaster Recovery가 쓰는 전략입니다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">DR 리전 상태</span></div>
        <div class="sd-node">
          <strong class="sd-label">데이터 복제와 꺼진 코어 인프라</strong>
          <span class="sd-detail">서버 기동, 비핵심 인프라 배포, 확장이 남습니다.</span>
        </div>
      </div>
      <p class="sd-note">요청을 받기 전에 여러 control plane 작업이 남습니다.</p>
    </section>

    <section class="sd-lane" aria-labelledby="dr-strategy-four-tiers-warm-title">
      <div class="sd-lane-title" id="dr-strategy-four-tiers-warm-title">3. warm standby</div>
      <div class="sd-flow">
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">warm standby</strong>
          <span class="sd-detail">축소 용량으로 즉시 트래픽을 받습니다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">DR 리전 상태</span></div>
        <div class="sd-node">
          <strong class="sd-label">축소 규모가 상시 가동된다</strong>
          <span class="sd-detail">프로덕션 용량까지 확장하면 됩니다.</span>
        </div>
      </div>
      <p class="sd-note">추가 조치 없이 요청을 처리하고 확장만 남습니다.</p>
    </section>

    <section class="sd-lane" aria-labelledby="dr-strategy-four-tiers-multi-title">
      <div class="sd-lane-title" id="dr-strategy-four-tiers-multi-title">4. multi-site active/active</div>
      <div class="sd-flow">
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">multi-site active/active</strong>
          <span class="sd-detail">두 사이트가 모두 트래픽을 처리합니다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">DR 리전 상태</span></div>
        <div class="sd-node">
          <strong class="sd-label">프로덕션 전량이 상시 가동된다</strong>
          <span class="sd-detail">failover라는 개념 자체가 없습니다.</span>
        </div>
      </div>
      <p class="sd-note">같은 규모를 active/passive로 두면 hot standby입니다.</p>
    </section>
  </div>
</figure>
