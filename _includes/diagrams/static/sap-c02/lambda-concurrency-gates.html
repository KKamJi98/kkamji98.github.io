<figure class="sd sd--flow" id="lambda-concurrency-gates" aria-labelledby="lambda-concurrency-gates-title">
  <figcaption class="sd-title" id="lambda-concurrency-gates-title">요청이 스로틀되는 게이트는 세 군데다</figcaption>
  <p class="sd-note">동기와 비동기 호출은 rps 상한과 함수 동시성과 스케일 속도를 차례로 만납니다. 먼저 도달한 한계에서 429가 발생합니다.</p>

  <div class="sd-flow" aria-label="Lambda 동시성 게이트">
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">함수 호출</strong>
      <span class="sd-detail">동기와 비동기 모두 같은 게이트를 지납니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">초당 요청 수</span></div>
    <div class="sd-node">
      <strong class="sd-label">rps 게이트</strong>
      <span class="sd-detail">동시성 쿼터의 10배입니다. 기본 1,000이면 10,000 rps입니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">동시 실행 수</span></div>
    <div class="sd-node">
      <strong class="sd-label">함수 동시성</strong>
      <span class="sd-detail">reserved concurrency를 걸면 그 값이 상한이자 하한입니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">환경 생성 속도</span></div>
    <div class="sd-node">
      <strong class="sd-label">스케일 속도</strong>
      <span class="sd-detail">함수당 10초에 실행 환경 1,000개까지 늘립니다.</span>
    </div>
    <div class="sd-grid">
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">provisioned 실행 환경</strong>
        <span class="sd-detail">초기화가 끝난 환경이며 과금 대상이고 reserved를 넘지 못합니다.</span>
      </div>
      <div class="sd-node">
        <strong class="sd-label">새 실행 환경</strong>
        <span class="sd-detail">초기화부터 시작하므로 콜드 스타트가 발생합니다.</span>
      </div>
    </div>
  </div>

  <div class="sd-grid">
    <div class="sd-node sd-node--warning">
      <strong class="sd-label">429 TooManyRequestsException</strong>
      <span class="sd-detail">rps 또는 함수 동시성 게이트에서 먼저 거절됩니다. 동기는 호출자에게, 비동기는 큐로 되돌려 재시도합니다.</span>
    </div>
    <div class="sd-node">
      <strong class="sd-label">미예약 pool</strong>
      <span class="sd-detail">Lambda가 항상 100을 남기므로 기본 1,000에서 예약 총량은 900입니다.</span>
    </div>
  </div>
</figure>
