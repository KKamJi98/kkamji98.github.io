<figure class="sd sd--layers" id="dns-global-traffic-decision-layers" aria-labelledby="dns-global-traffic-decision-layers-title">
  <figcaption class="sd-title" id="dns-global-traffic-decision-layers-title">요청이 어디로 갈지는 세 계층에서 각각 결정된다</figcaption>
  <p class="sd-note">이름 해석, 애니캐스트 연결, 엣지 캐시는 서로 다른 입력으로 목적지를 결정합니다. 아래는 선택 가능한 메커니즘의 비교이며 모든 요청이 세 서비스를 차례로 거치는 경로가 아닙니다.</p>
  <div class="sd-grid">
    <section class="sd-lane">
      <div class="sd-lane-title">DNS 응답 계층</div>
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">Route 53 응답</strong>
        <span class="sd-detail">어느 리전의 주소를 응답할지 정합니다.</span>
      </div>
      <div class="sd-node">
        <strong class="sd-label">라우팅 정책과 health check</strong>
        <span class="sd-detail">전환 지연은 TTL과 resolver 캐시가 만듭니다.</span>
      </div>
      <p class="sd-note">클라이언트는 이름을 해석한 주소로 연결합니다.</p>
    </section>
    <section class="sd-lane">
      <div class="sd-lane-title">애니캐스트 IP 계층</div>
      <div class="sd-node">
        <strong class="sd-label">Global Accelerator</strong>
        <span class="sd-detail">고정 IP로 받고 캐시하지 않습니다.</span>
      </div>
      <div class="sd-node">
        <strong class="sd-label">traffic dial과 endpoint weight</strong>
        <span class="sd-detail">기존 연결은 TCP idle timeout까지 현재 endpoint에 머뭅니다.</span>
      </div>
      <p class="sd-note">선택된 endpoint로 연결을 전달합니다.</p>
    </section>
    <section class="sd-lane">
      <div class="sd-lane-title">엣지 캐시 계층</div>
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">CloudFront 엣지</strong>
        <span class="sd-detail">캐시 히트면 오리진에 가지 않습니다.</span>
      </div>
      <div class="sd-node">
        <strong class="sd-label">캐시 키와 TTL과 origin group</strong>
        <span class="sd-detail">minimum TTL이 오리진 지시를 덮을 수 있습니다.</span>
      </div>
      <div class="sd-flow">
        <div class="sd-arrow">
          <span class="sd-edge-label">CloudFront 캐시 미스일 때</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">리전 오리진</strong>
          <span class="sd-detail">CloudFront가 origin 요청을 전달합니다.</span>
        </div>
      </div>
    </section>
  </div>
</figure>
