<figure class="sd sd--layers" aria-labelledby="sap-c02-capacity-and-discount-layers-title">
  <figcaption class="sd-title" id="sap-c02-capacity-and-discount-layers-title">요금 할인과 용량 확보는 다른 층이다</figcaption>
  <div class="sd-flow">
    <div class="sd-grid">
      <div class="sd-node"><strong class="sd-label">할인 요구</strong><span class="sd-detail">1년 또는 3년 유지될 baseline 지출을 줄임</span></div>
      <div class="sd-node"><strong class="sd-label">용량 요구</strong><span class="sd-detail">특정 시각 AZ 용량을 확보해 InsufficientInstanceCapacity를 피함</span></div>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">요구를 층으로 분리</span></div>
    <div class="sd-stack">
      <section class="sd-band" aria-label="요금 할인 층">
        <div class="sd-band-title">요금 할인 층: 용량 예약 없음</div>
        <div class="sd-grid sd-grid--three">
          <div class="sd-node"><strong class="sd-label">Compute Savings Plans</strong><span class="sd-detail">최대 66%, family, size, Region, OS, tenancy 무관, Fargate와 Lambda 포함</span></div>
          <div class="sd-node"><strong class="sd-label">EC2 Instance Savings Plans</strong><span class="sd-detail">최대 72%, Region과 instance family 고정, Fargate와 Lambda 제외</span></div>
          <div class="sd-node"><strong class="sd-label">Regional RI</strong><span class="sd-detail">AZ 유연성, 용량 예약 없음; size 유연성은 Amazon Linux/Unix와 default tenancy 조건</span></div>
        </div>
      </section>
      <section class="sd-band" aria-label="용량 확보 층">
        <div class="sd-band-title">용량 확보 층: 할인 없음</div>
        <div class="sd-grid">
          <div class="sd-node"><strong class="sd-label">On-Demand Capacity Reservation</strong><span class="sd-detail">즉시형은 약정 없이 취소 가능하지만 미사용도 On-Demand 한도 소모</span></div>
          <div class="sd-node"><strong class="sd-label">Capacity Blocks for ML</strong><span class="sd-detail">지정 날짜 GPU 클러스터, placement group 미지원</span></div>
        </div>
      </section>
      <section class="sd-band" aria-label="할인과 용량을 함께 제공하는 층">
        <div class="sd-band-title">Zonal RI: 요금 할인과 지정 AZ 용량 예약</div>
        <div class="sd-node sd-node--accent"><strong class="sd-label">Zonal scope Reserved Instance</strong><span class="sd-detail">지정 AZ 용량 예약과 요금 할인을 동시에 제공, AZ와 size 유연성 없음</span></div>
        <div class="sd-note">ODCR 위에는 Savings Plans 요금을 겹칠 수 있지만 zonal RI 할인은 ODCR에 적용되지 않습니다. Spot 사용분에는 Savings Plans가 적용되지 않습니다.</div>
      </section>
    </div>
  </div>
<section class="sd-lane"><div class="sd-lane-title">RI offering class: scope와 독립된 분류</div>
<div class="sd-grid">
<div class="sd-node"><strong class="sd-label">Convertible RI</strong><span class="sd-detail">최대 66%, exchange 가능, Marketplace 매도 불가</span></div>
<div class="sd-node"><strong class="sd-label">Standard RI</strong><span class="sd-detail">최대 72%, exchange 불가, Marketplace 매도 가능</span></div>
</div>
<p class="sd-note">Standard와 Convertible 모두 regional 또는 zonal scope를 선택합니다. 위의 할인 전용 층은 regional RI에 해당합니다.</p>
</section>
</figure>
