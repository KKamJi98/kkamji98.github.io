<figure class="sd sd--flow" aria-labelledby="sap-c02-migration-wave-prerequisites-title">
  <figcaption class="sd-title" id="sap-c02-migration-wave-prerequisites-title">wave 실행 전에 공통 전제를 세운다</figcaption>

          <strong class="sd-label">landing zone</strong>

        </div>
        <div class="sd-node">
          <strong class="sd-label">클라우드 domain controller</strong>

        </div>
        <div class="sd-node">

        <div class="sd-node sd-node--warning">
