<figure class="sd sd--flow" aria-labelledby="sap-c02-mgn-replication-cutover-flow-title">
  <figcaption class="sd-title" id="sap-c02-mgn-replication-cutover-flow-title">MGN staging area에서 test와 cutover를 분리</figcaption>
  <section class="sd-band">

  <div class="sd-grid">
  <div class="sd-node">
  <strong class="sd-label">소스 서버 / AWS Replication Agent</strong>
  <span class="sd-detail">물리, 가상, 클라우드 서버. replication server에 TCP 1500 연속 블록 복제</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">MGN vCenter Client</strong>
  <span class="sd-detail">별도 agentless snapshot 경로. vCenter 6.7, 7.0, 8.0; CBT와 VDDK</span>
  </div>
  </div>
  </section>
  <section class="sd-band">
  <div class="sd-band-title">staging area subnet</div>
  <div class="sd-node">

  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">복제 block을 staging EBS에 기록</span>
  </div>
  <div class="sd-node sd-node--accent">
  <strong class="sd-label">staging EBS 볼륨</strong>

  </div>
  </section>
  <div class="sd-arrow">
  <span class="sd-edge-label">staging snapshot으로 test 또는 cutover 기동</span>
  </div>
  <section class="sd-band">
  <div class="sd-band-title">타깃 VPC</div>
  <div class="sd-grid">

  <div class="sd-node">
  <strong class="sd-label">cutover instance</strong>
  <span class="sd-detail">lag 0 확인과 소스 서비스 정지 후 기동</span>
  </div>
  </div>
  </section>
  <p class="sd-note">Cutover 완료 뒤 finalize하고 복제 리소스를 정리하면 source server archive 상태가 됩니다. 그림의 volume 수치는 기본 EBS 경로 기준입니다.</p>
