<figure class="sd sd--comparison" id="kms-key-material-origin" aria-labelledby="kms-key-material-origin-title">
  <figcaption class="sd-title" id="kms-key-material-origin-title">key material을 어디서 만드느냐가 이후 선택지를 잠근다</figcaption>
  <p class="sd-note">origin은 키 생성 시 정하며 이후 변경할 수 없습니다. 아래는 runtime 단계가 아니라 origin별 기능 비교입니다.</p>
  <div class="sd-grid sd-grid--three">
  <div class="sd-node">
  <strong class="sd-label">AWS_KMS origin</strong>
  <span class="sd-detail">KMS가 관리형 HSM에서 소재를 생성합니다. 자동 rotation 90-2560일: on-demand rotation, multi-Region, asymmetric, HMAC를 지원합니다.</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">EXTERNAL origin</strong>
  <span class="sd-detail">사용자가 만든 material을 import합니다. 자동 rotation 불가: on-demand rotation은 키당 25회이며 수동 교체가 필요합니다. multi-Region은 가능합니다.</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">CloudHSM key store</strong>
  <span class="sd-detail">내 계정의 전용 HSM cluster 안에서 생성합니다. 256-bit AES symmetric 만: rotation 과 multi-Region 과 asymmetric 과 imported material을 지원하지 않습니다. 서로 다른 AZ 의 active HSM 2개: 키 생성 조건이며 연결이 끊기면 암호 연산 자체가 멈춥니다.</span>
  </div>
  </div>
  <p class="sd-note">공통 호출 표면은 AWS KMS API입니다. rotation 지원은 key type 조건도 확인해야 합니다.</p>
</figure>
