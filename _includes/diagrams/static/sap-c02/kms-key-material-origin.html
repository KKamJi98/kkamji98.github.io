<figure class="sd sd--comparison" id="kms-key-material-origin" aria-labelledby="kms-key-material-origin-title">
  <figcaption class="sd-title" id="kms-key-material-origin-title">key material을 어디서 만드느냐가 이후 선택지를 잠근다</figcaption>
  <p class="sd-note">origin은 키 생성 시점에 정하고 나중에 바꿀 수 없습니다. rotation과 multi-Region key와 key type 선택지가 origin에서 갈립니다.</p>

  <div class="sd-flow" aria-label="KMS key material origin별 기능">
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">키 소재를 누가 만들고 어디에 두는가</strong>
      <span class="sd-detail">키 생성 시점에 한 번만 정합니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">origin 선택</span></div>
    <div class="sd-grid sd-grid--three">
      <section class="sd-lane" aria-labelledby="kms-key-material-origin-kms-title">
        <div class="sd-lane-title" id="kms-key-material-origin-kms-title">AWS_KMS origin</div>
        <div class="sd-flow">
          <div class="sd-node"><strong class="sd-label">AWS_KMS origin</strong><span class="sd-detail">KMS가 관리형 HSM에서 소재를 생성합니다.</span></div>
          <div class="sd-arrow"><span class="sd-edge-label">가장 넓은 선택</span></div>
          <div class="sd-node sd-node--accent"><strong class="sd-label">자동 rotation 90-2560일</strong><span class="sd-detail">on-demand rotation, multi-Region, asymmetric, HMAC를 지원합니다.</span></div>
        </div>
      </section>

      <section class="sd-lane" aria-labelledby="kms-key-material-origin-external-title">
        <div class="sd-lane-title" id="kms-key-material-origin-external-title">EXTERNAL origin</div>
        <div class="sd-flow">
          <div class="sd-node"><strong class="sd-label">EXTERNAL origin</strong><span class="sd-detail">사용자가 만든 material을 import합니다.</span></div>
          <div class="sd-arrow"><span class="sd-edge-label">수명 직접 관리</span></div>
          <div class="sd-node"><strong class="sd-label">자동 rotation 불가</strong><span class="sd-detail">on-demand rotation은 키당 25회이며 수동 교체가 필요합니다. multi-Region은 가능합니다.</span></div>
        </div>
      </section>

      <section class="sd-lane" aria-labelledby="kms-key-material-origin-cloudhsm-title">
        <div class="sd-lane-title" id="kms-key-material-origin-cloudhsm-title">CloudHSM key store</div>
        <div class="sd-flow">
          <div class="sd-node"><strong class="sd-label">CloudHSM key store</strong><span class="sd-detail">내 계정의 전용 HSM cluster 안에서 생성합니다.</span></div>
          <div class="sd-arrow"><span class="sd-edge-label">기능 제한</span></div>
          <div class="sd-node sd-node--warning"><strong class="sd-label">256-bit AES symmetric 만</strong><span class="sd-detail">rotation 과 multi-Region 과 asymmetric 과 imported material을 지원하지 않습니다.</span></div>
          <div class="sd-arrow"><span class="sd-edge-label">cluster 연결 필요</span></div>
          <div class="sd-node sd-node--warning"><strong class="sd-label">서로 다른 AZ 의 active HSM 2개</strong><span class="sd-detail">키 생성 조건이며 연결이 끊기면 암호 연산 자체가 멈춥니다.</span></div>
        </div>
      </section>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">공통 호출 표면</span></div>
    <div class="sd-node"><strong class="sd-label">AWS KMS API</strong><span class="sd-detail">origin과 무관하게 호출 형태는 같습니다.</span></div>
  </div>
</figure>
