<figure class="sd sd--flow" aria-labelledby="sap-c02-s3-lifecycle-transition-paths-title">
  <figcaption class="sd-title" id="sap-c02-s3-lifecycle-transition-paths-title">S3 lifecycle 전환은 한 방향으로만 흐른다</figcaption>
  <div class="sd-grid">
  <div class="sd-node">
  <strong class="sd-label">S3 Standard</strong>
  <span class="sd-detail">최소 보관 기간/과금 객체 크기 없음. 전환 대상: 아래 나머지 6개 class</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">Standard-IA</strong>
  <span class="sd-detail">최소 30일, 과금 128 KB. 전환 대상: Intelligent-Tiering, One Zone-IA, Glacier Instant Retrieval, Glacier Flexible Retrieval, Glacier Deep Archive</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">Intelligent-Tiering</strong>
  <span class="sd-detail">최소 보관 기간/과금 객체 크기 없음. Frequent/Infrequent Access는 One Zone-IA 또는 Glacier 3종으로 전환. Archive Instant Access는 Glacier 3종, Archive Access는 Flexible/Deep, Deep Archive Access는 Deep만 가능</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">One Zone-IA</strong>
  <span class="sd-detail">최소 30일, 과금 128 KB, 단일 AZ, 설계 가용성 99.5%. 전환 대상: Glacier Flexible Retrieval 또는 Glacier Deep Archive</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">Glacier Instant Retrieval</strong>
  <span class="sd-detail">최소 90일, 과금 128 KB, 밀리초 조회. 전환 대상: Glacier Flexible Retrieval 또는 Glacier Deep Archive</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">Glacier Flexible Retrieval</strong>
  <span class="sd-detail">최소 90일, 객체당 metadata overhead 40 KB. 전환 대상: Glacier Deep Archive</span>
  </div>
  <div class="sd-node sd-node--warning">
  <strong class="sd-label">Glacier Deep Archive</strong>
  <span class="sd-detail">최소 180일, 객체당 metadata overhead 40 KB. 나가는 lifecycle 전환 없음</span>
  </div>
  </div>
  <p class="sd-note">각 카드의 전환 대상은 독립적으로 선택할 수 있는 edge이며 모든 class를 순서대로 거치지 않습니다. Intelligent-Tiering의 Archive Instant Access tier와 Glacier Instant Retrieval storage class는 다릅니다. 보관 기간과 객체 크기 등 전환 제약도 확인해야 합니다.</p>
  <p class="sd-note">archive class에서 다른 class로 복구하려면 필요한 restore 뒤 copy를 사용합니다. 역방향 lifecycle 규칙은 없습니다.</p>
</figure>
