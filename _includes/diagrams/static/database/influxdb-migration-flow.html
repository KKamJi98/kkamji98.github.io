<figure class="sd sd--flow" id="influxdb-migration-flow" aria-labelledby="influxdb-migration-flow-title">
  <figcaption class="sd-title" id="influxdb-migration-flow-title">InfluxDB 마이그레이션은 export, 변환, import 순서입니다</figcaption>
  <p class="sd-note">Line Protocol 또는 backup으로 옮긴 뒤 bucket, measurement, tag와 field 이름을 새 환경에 맞춰 확인합니다.</p>

  <div class="sd-flow" aria-label="InfluxDB 마이그레이션 흐름">
    <div class="sd-node">
      <strong class="sd-label">Source InfluxDB</strong>
      <span class="sd-detail">기존 EC2에 있는 버전의 database입니다.</span>
    </div>

    <div class="sd-arrow"><span class="sd-edge-label">데이터 추출</span></div>

    <div class="sd-node">
      <strong class="sd-label">Export data</strong>
      <span class="sd-detail">Line Protocol 또는 backup으로 보존합니다.</span>
    </div>

    <div class="sd-arrow"><span class="sd-edge-label">스키마 차이 반영</span></div>

    <div class="sd-node sd-node--warning">
      <strong class="sd-label">Transform data</strong>
      <span class="sd-detail">bucket, measurement, tag와 field 이름을 변환합니다.</span>
    </div>

    <div class="sd-arrow"><span class="sd-edge-label">새 인스턴스에 기록</span></div>

    <div class="sd-node">
      <strong class="sd-label">Import data</strong>
      <span class="sd-detail">변환한 시계열 데이터를 target에 씁니다.</span>
    </div>

    <div class="sd-arrow"><span class="sd-edge-label">건수와 구간 확인</span></div>

    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Target InfluxDB</strong>
      <span class="sd-detail">cutover 전에 measurement와 데이터 건수를 검증합니다.</span>
    </div>
  </div>
</figure>
