<figure class="sd sd--flow" id="influxdb-migration-flow" aria-labelledby="influxdb-migration-flow-title">
  <figcaption class="sd-title" id="influxdb-migration-flow-title">InfluxDB 1.x EC2 이전: export, 파일 정리, import</figcaption>
  <p class="sd-note">v1.11.8 실습은 database 이름과 measurement, tag, field, timestamp를 유지한 채 Line Protocol로 옮깁니다.</p>

  <div class="sd-flow" aria-label="InfluxDB 마이그레이션 흐름">
    <div class="sd-node">
      <strong class="sd-label">Source InfluxDB</strong>
      <span class="sd-detail">기존 EC2의 InfluxDB v1.11.8 database</span>
    </div>

    <div class="sd-arrow"><span class="sd-edge-label">데이터 추출</span></div>

    <div class="sd-node">
      <strong class="sd-label">Export data</strong>
      <span class="sd-detail">influx_inspect export -lponly로 추출합니다.</span>
    </div>

    <div class="sd-arrow"><span class="sd-edge-label">export 파일 정리</span></div>

    <div class="sd-node sd-node--warning">
      <strong class="sd-label">Clean export file</strong>
      <span class="sd-detail">실습 스크립트는 CREATE DATABASE 행을 제거합니다. 데이터 이름은 바꾸지 않습니다.</span>
    </div>

    <div class="sd-arrow"><span class="sd-edge-label">새 인스턴스에 기록</span></div>

    <div class="sd-node">
      <strong class="sd-label">Import data</strong>
      <span class="sd-detail">target에 같은 이름의 database를 생성한 뒤 /write에 Line Protocol을 전송합니다.</span>
    </div>

    <div class="sd-arrow"><span class="sd-edge-label">건수와 구간 확인</span></div>

    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Target InfluxDB</strong>
      <span class="sd-detail">삭제 복원, 누락 구간과 덮어쓴 값의 복구를 Grafana로 비교합니다.</span>
    </div>
  </div>
</figure>
