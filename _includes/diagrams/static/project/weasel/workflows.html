<figure class="sd sd--comparison" id="sd-project-weasel-workflows" aria-labelledby="sd-title-project-weasel-workflows">
  <figcaption class="sd-title" id="sd-title-project-weasel-workflows">Frontend, Backend, Bedrock 사이의 문제 풀이와 저장</figcaption>
  <div class="sd-grid">
    <section class="sd-lane" aria-label="문제 풀이 왕복 흐름">
      <div class="sd-lane-title"><strong>문제 풀이</strong></div>
      <div class="sd-flow">
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">Frontend</strong>
          <span class="sd-detail">문제 입력</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">1. 문제 전달</span></div>
        <div class="sd-node">
          <strong class="sd-label">Backend</strong>
          <span class="sd-detail">요청 처리</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">2. API Call</span></div>

          <strong class="sd-label">Backend</strong>
          <span class="sd-detail">응답 조립</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">4. 결과 리턴</span></div>

        </div>
      </div>
    </section>
