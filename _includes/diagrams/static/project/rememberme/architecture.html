<figure class="sd sd--layers" id="rememberme-architecture" aria-labelledby="rememberme-architecture-title">
  <figcaption class="sd-title" id="rememberme-architecture-title">Remember Me는 CloudFront edge에서 API와 정적 자산을 나눕니다</figcaption>
  <p class="sd-note">DNS: client가 Route53에서 CloudFront 주소를 조회합니다. DNS는 HTTP forwarding hop이 아닙니다.</p>
  <div class="sd-node sd-node--warning">
  <strong class="sd-label">CloudFront + WAF</strong>
  <span class="sd-detail">하나의 edge에서 static/API 요청 분기</span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">static origin fetch 또는 API route</span>
  </div>
  <div class="sd-grid">
  <div class="sd-node">
  <strong class="sd-label">Amazon S3</strong>
  <span class="sd-detail">frontend 정적 파일 origin</span>
  </div>
  <section class="sd-band">
  <div class="sd-band-title">Serverless backend</div>
  <div class="sd-node">
  <strong class="sd-label">API Gateway + WAF</strong>
  <span class="sd-detail">API request rule과 integration</span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">Lambda integration</span>
  </div>
  <div class="sd-node sd-node--accent">
  <strong class="sd-label">AWS Lambda functions</strong>
  <span class="sd-detail">단어 목록과 퀴즈 처리</span>
  </div>
  <div class="sd-grid">
  <div class="sd-node">
  <strong class="sd-label">Parameter Store and Secrets Manager</strong>
  <span class="sd-detail">Lambda가 config와 secret read</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">MongoDB</strong>
  <span class="sd-detail">Lambda가 사용자 단어 data read/write</span>
  </div>
  </div>
  </section>
  </div>
  <section class="sd-band">
  <div class="sd-band-title">비용 알림</div>
  <div class="sd-flow">
  <div class="sd-node">
  <strong class="sd-label">AWS Budgets</strong>
  <span class="sd-detail">비용 threshold 감시</span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">SNS notification</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">AWS Chatbot</strong>
  <span class="sd-detail">Slack channel 형식 변환</span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">chat delivery</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">Slack</strong>
  <span class="sd-detail">운영자 비용 경고</span>
  </div>
  </div>
  </section>
  <p class="sd-note">HCP Terraform이 VPC와 위 serverless resources를 코드로 provisioning합니다.</p>
</figure>
