<figure class="sd sd--flow sd--fhd" id="kubernetes-graceful-shutdown" aria-labelledby="kubernetes-graceful-shutdown-title" data-canvas-width="1920" data-canvas-height="1080">
  <figcaption class="sd-title" id="kubernetes-graceful-shutdown-title">Pod 삭제는 EndpointSlice 갱신과 process 종료를 병행한다</figcaption><div class="sd-semantic-source">
  <p class="sd-note">kubelet의 process 종료와 control plane의 EndpointSlice 갱신은 병행됩니다. traffic 제외는 proxy 규칙 전파 후 반영되며 삭제 시점의 원자적 차단이 아닙니다.</p>

  <div class="sd-flow" aria-label="Pod graceful shutdown 공통 시작">
    <div class="sd-node sd-node--muted">
      <strong class="sd-label">API Server</strong>
      <span class="sd-detail">사용자 또는 controller가 Pod 삭제를 요청합니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">상태 변경 watch</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">kubelet와 control plane</strong>
      <span class="sd-detail">같은 삭제 상태를 보고 각자의 종료 경로를 시작합니다.</span>
    </div>
  </div>

  <div class="sd-grid" aria-label="traffic과 process 종료 경로">
    <section class="sd-lane" aria-labelledby="kubernetes-graceful-shutdown-traffic-title">
      <div class="sd-lane-title" id="kubernetes-graceful-shutdown-traffic-title">Traffic stop path</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">Control plane: EndpointSlice</strong>
          <span class="sd-detail"><code>terminating=true</code>, <code>ready=false</code>로 갱신하며 endpoint를 즉시 제거하지 않습니다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">EndpointSlice 변경 watch</span></div>
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">kube-proxy rule reconciliation</strong>
          <span class="sd-detail">iptables 또는 ipvs 규칙에 일반 traffic용 readiness 변경을 반영합니다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">비동기 dataplane 전파</span></div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">일반 신규 traffic에서 제외</strong>
          <span class="sd-detail">전파 지연 중 요청이나 기존 연결은 남을 수 있습니다. draining은 별도 고려 대상입니다.</span>
        </div>
      </div>
    </section>

    <section class="sd-lane" aria-labelledby="kubernetes-graceful-shutdown-process-title">
      <div class="sd-lane-title" id="kubernetes-graceful-shutdown-process-title">Process cleanup path</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">kubelet</strong>
          <span class="sd-detail">container lifecycle을 종료 절차로 전환합니다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">먼저 실행</span></div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">preStop hook</strong>
          <span class="sd-detail">설정되어 있으면 실행합니다. 이 시간도 grace budget에 포함됩니다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">hook 완료 후</span></div>
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">SIGTERM</strong>
          <span class="sd-detail">application이 남은 connection과 resource를 정리합니다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">정상 종료</span></div>
        <div class="sd-node">
          <strong class="sd-label">Pod exits</strong>
          <span class="sd-detail">graceful cleanup이 끝난 뒤 process가 종료됩니다.</span>
        </div>
      </div>
    </section>
  </div>

  <div class="sd-band">
    <div class="sd-band-title">terminationGracePeriodSeconds</div>
    <div class="sd-node sd-node--warning">
      <strong class="sd-label">최대 대기 시간</strong>
      <span class="sd-detail">preStop과 SIGTERM 처리 뒤에도 시간이 남지 않으면 kubelet이 <code>SIGKILL</code>로 강제 종료합니다.</span>
    </div>
  </div>
</div>
