<figure class="sd sd--flow" id="sd-kubernetes-in-place-pod-resource-resize" aria-labelledby="sd-kubernetes-in-place-pod-resource-resize-title">
  <figcaption class="sd-title" id="sd-kubernetes-in-place-pod-resource-resize-title">In-place resize는 Pod를 재생성하지 않고 container resource를 바꾼다</figcaption>
  <div class="sd-flow">
    <div class="sd-node">
      <strong class="sd-label">Resource patch</strong>
      <span class="sd-detail">resize subresource에 새 request와 limit을 제출합니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">API validation</span></div>
    <div class="sd-node">
      <strong class="sd-label">API server</strong>
      <span class="sd-detail">resize policy와 resource 변경을 검증합니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">node 변경 전달</span></div>
    <div class="sd-node">
      <strong class="sd-label">kubelet</strong>
      <span class="sd-detail">실행 중인 node에서 새 값을 적용합니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">cgroup limits update</span></div>
    <div class="sd-node">
      <strong class="sd-label">Container resources</strong>
      <span class="sd-detail">container cgroup 값이 in place로 갱신됩니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">restart와 reschedule 없음</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Pod keeps running</strong>
      <span class="sd-detail">Pod 이름, node, IP를 유지한 채 계속 실행됩니다.</span>
    </div>
  </div>
  <p class="sd-note">Memory limit 감소는 <code>resizePolicy: RestartContainer</code>가 없으면 무중단으로 적용되지 않습니다. 기능은 Kubernetes v1.33의 InPlacePodVerticalScaling 조건을 전제로 합니다.</p>
</figure>
