<figure class="sd sd--flow sd--fhd" id="sd-kubernetes-kubernetes-rbac-binding" aria-labelledby="sd-kubernetes-kubernetes-rbac-binding-title" data-canvas-width="1920" data-canvas-height="1080">
  <figcaption class="sd-title" id="sd-kubernetes-kubernetes-rbac-binding-title">RoleBinding이 subject를 verbs 권한에 연결한다</figcaption><div class="sd-semantic-source">
  <div class="sd-flow">
    <div class="sd-node">
      <strong class="sd-label">User or ServiceAccount</strong>
      <span class="sd-detail">request를 보내는 subject입니다.</span>
    </div>
    <div class="sd-arrow">
      <span class="sd-edge-label">API request</span>
    </div>
    <div class="sd-node">
      <strong class="sd-label">API server</strong>
      <span class="sd-detail">매 요청마다 subject, namespace, resource와 verb를 RBAC 규칙과 대조합니다.</span>
    </div>
    <div class="sd-arrow">
      <span class="sd-edge-label">authorization 결과</span>
    </div>
    <div class="sd-grid">
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">Allowed resource action</strong>
        <span class="sd-detail">binding으로 허용된 resource와 verb를 실행합니다.</span>
      </div>
      <div class="sd-node sd-node--warning">
        <strong class="sd-label">Denied</strong>
        <span class="sd-detail">요청을 허용하는 권한이 없으면 거부합니다.</span>
      </div>
    </div>
  </div>
  <section class="sd-lane">
    <div class="sd-lane-title">RoleBinding: 요청 hop이 아닌 권한 연결</div>
    <div class="sd-grid">
      <div class="sd-node">
        <strong class="sd-label">subjects</strong>
        <span class="sd-detail">위 User 또는 ServiceAccount를 참조합니다.</span>
      </div>
      <div class="sd-node">
        <strong class="sd-label">roleRef</strong>
        <span class="sd-detail">Role 또는 ClusterRole을 참조합니다. Role은 resource에 허용할 verbs를 정의하지만 단독으로는 권한을 주지 않습니다.</span>
      </div>
    </div>
    <p class="sd-note">API server는 이 binding의 subject와 roleRef가 가리키는 규칙을 인가 판단에 사용합니다.</p>
  </section>
  <p class="sd-note">RoleBinding은 namespace 범위에 묶입니다. 다른 namespace까지 권한을 넓히려면 별도의 binding 범위를 설계해야 합니다.</p>
</div>
