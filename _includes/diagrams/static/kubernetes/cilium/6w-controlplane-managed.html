<figure class="sd sd--layers sd--comparison" id="sd-kubernetes-cilium-6w-controlplane-managed" aria-labelledby="sd-kubernetes-cilium-6w-controlplane-managed-title">
  <figcaption class="sd-title" id="sd-kubernetes-cilium-6w-controlplane-managed-title">Control Plane은 proxy 설정을 관리하고 proxy는 application traffic을 전달한다</figcaption>
  <div class="sd-grid">
    <section class="sd-lane" aria-label="Application A data plane">
      <div class="sd-lane-title">Workload A</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">Application A</strong>
          <span class="sd-detail">서비스 mesh에 참여하는 workload</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">local interception</span></div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">Proxy A</strong>
          <span class="sd-detail">Data Plane에서 요청을 처리한다.</span>
        </div>
      </div>
    </section>
    <section class="sd-lane" aria-label="Application B data plane">
      <div class="sd-lane-title">Workload B</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">Application B</strong>
          <span class="sd-detail">proxy를 통해 요청을 받는 workload</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">local interception</span></div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">Proxy B</strong>
          <span class="sd-detail">Data Plane에서 응답을 전달한다.</span>
        </div>
      </div>
    </section>
  </div>
  <section class="sd-lane" aria-label="Proxy data plane traffic">
    <div class="sd-lane-title">Data Plane traffic</div>
    <div class="sd-flow">
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">Proxy A</strong>
        <span class="sd-detail">송신 application의 요청을 전달한다.</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">application traffic</span></div>
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">Proxy B</strong>
        <span class="sd-detail">수신 application으로 요청을 전달한다.</span>
      </div>
    </div>
  </section>
  <section class="sd-lane" aria-label="Control plane management path">
    <div class="sd-lane-title">Control Plane</div>
    <div class="sd-flow">
      <div class="sd-node sd-node--muted">
        <strong class="sd-label">Control Plane</strong>
        <span class="sd-detail">proxy 동작, 동적 설정, routing, mTLS와 동기화 상태를 중앙 관리한다.</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">configuration and hot reload</span></div>
      <div class="sd-grid">
        <div class="sd-node">
          <strong class="sd-label">Proxy A</strong>
          <span class="sd-detail">관리된 설정을 적용한다.</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">Proxy B</strong>
          <span class="sd-detail">관리된 설정을 적용한다.</span>
        </div>
      </div>
    </div>
  </section>
  <p class="sd-note">Proxy 사이의 application traffic은 Data Plane이고, Control Plane configuration은 두 proxy에 전달된다. 각 proxy는 sidecar 기반 Data Plane으로 동작한다.</p>
</figure>
