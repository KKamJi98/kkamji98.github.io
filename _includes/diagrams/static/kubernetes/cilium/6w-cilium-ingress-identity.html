<figure class="sd sd--layers sd--flow" id="sd-kubernetes-6w-cilium-ingress-identity" aria-labelledby="sd-kubernetes-6w-cilium-ingress-identity-title">
  <figcaption class="sd-title" id="sd-kubernetes-6w-cilium-ingress-identity-title">Cilium Ingress는 요청의 identity를 단계마다 바꾼다</figcaption>
  <div class="sd-flow">
    <div class="sd-node">
      <strong class="sd-label">External client</strong>
      <span class="sd-detail">cluster 밖에서 들어오는 요청은 <code>world</code> identity입니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">world identity로 진입</span></div>
  </div>
  <section class="sd-band" aria-labelledby="sd-kubernetes-6w-cilium-ingress-identity-cluster-title">
    <div class="sd-band-title" id="sd-kubernetes-6w-cilium-ingress-identity-cluster-title">Kubernetes cluster</div>
    <div class="sd-flow">
      <div class="sd-node">
        <strong class="sd-label">Load Balancer</strong>
        <span class="sd-detail">Kubernetes Service가 외부 요청을 cluster로 받습니다.</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">Ingress 경계에서 identity 전환</span></div>
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">Ingress</strong>
        <span class="sd-detail">Envoy 진입 뒤 요청 identity가 <code>ingress</code>가 됩니다.</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">backend identity로 전달</span></div>
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">productpage-app Pod</strong>
        <span class="sd-detail">backend workload의 <code>productpage</code> identity로 나갑니다.</span>
      </div>
    </div>
  </section>
  <p class="sd-note">정책 집행 지점은 <code>world</code>에서 <code>ingress</code>로 들어오는 경계와 <code>ingress</code>에서 backend로 나가는 경계에 각각 있습니다.</p>
</figure>
