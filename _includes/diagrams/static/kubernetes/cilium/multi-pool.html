<figure class="sd sd--comparison" id="kubernetes-cilium-multi-pool" aria-labelledby="kubernetes-cilium-multi-pool-title">
  <figcaption class="sd-title" id="kubernetes-cilium-multi-pool-title">Multi-Pool은 workload 선택과 CiliumNode CIDR 할당을 연결한다</figcaption>
  <p class="sd-note">Pod와 Namespace의 <code>ipam.cilium.io/ip-pool</code> 선택이 Cilium Agent의 주소 pool을 정하고, Cilium Operator가 필요한 PodCIDR을 CiliumNode에 할당합니다.</p>

  <div class="sd-grid" aria-label="Cilium Multi-Pool selection과 allocation">
    <section class="sd-lane" aria-labelledby="kubernetes-cilium-multi-pool-workload-title">
      <div class="sd-lane-title" id="kubernetes-cilium-multi-pool-workload-title">Workload selection on node1</div>
      <div class="sd-flow">
        <div class="sd-node sd-node--muted">
          <strong class="sd-label">Pod 또는 Namespace 선택</strong>
          <span class="sd-detail">annotation이 있으면 지정 pool을 찾고, 없으면 Namespace와 global default를 확인합니다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">pool lookup</span></div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">Cilium Agent</strong>
          <span class="sd-detail">node에 배정된 pool에서 Pod IP를 선택합니다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">개념 예시: allocated CIDR 안에서 할당</span></div>
        <div class="sd-grid sd-grid--three">
          <div class="sd-node">
            <strong class="sd-label">default</strong>
            <span class="sd-detail">Pod 1, 2, 3: 표시된 <code>10.0.10.0/24</code> 또는 <code>10.0.20.0/24</code> 안에서 할당</span>
          </div>
          <div class="sd-node">
            <strong class="sd-label">mars</strong>
            <span class="sd-detail">Pod 4, ...: 표시된 <code>172.16.8.0/27</code> 안에서 할당</span>
          </div>
          <div class="sd-node sd-node--warning">
            <strong class="sd-label">jupiter</strong>
            <span class="sd-detail">처음 요청되어 Pod n은 pending입니다.</span>
          </div>
        </div>
      </div>
    </section>

    <section class="sd-lane" aria-labelledby="kubernetes-cilium-multi-pool-operator-title">
      <div class="sd-lane-title" id="kubernetes-cilium-multi-pool-operator-title">CiliumNode와 Operator control</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">CiliumNode CRD requested</strong>
          <span class="sd-detail">default 64, mars 48, jupiter 8 주소가 필요하다고 기록합니다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">reconcile</span></div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">Cilium Operator</strong>
          <span class="sd-detail">requested pool을 보고 node에 PodCIDR을 배정합니다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">allocated CIDR</span></div>
        <div class="sd-node">
          <strong class="sd-label">CiliumNode CRD allocated</strong>
          <span class="sd-detail">default: <code>10.0.10.0/24</code>, <code>10.0.20.0/24</code>; mars: <code>172.16.8.0/27</code></span>
        </div>
      </div>
      <p class="sd-note">표시된 allocated는 현재 할당 상태입니다. mars의 추가 요청과 jupiter의 첫 요청은 reconcile을 기다리며, 새 CIDR은 아직 표시하지 않았습니다.</p>
    </section>
  </div>

  <div class="sd-band">
    <div class="sd-band-title">Pool lifecycle</div>
    <div class="sd-node">
      <strong class="sd-label">사용량에 맞춰 확장과 정리</strong>
      <span class="sd-detail">Agent는 추가 주소를 요청하고, 사용을 끝낸 PodCIDR을 반환합니다. 주소 범위는 개념 예시이며 실측 Pod IP가 아닙니다. 본문의 beta 및 tunnel/IPsec 제약은 버전이 명시되지 않아 현재 일반 제약으로 단정하지 않습니다.</span>
    </div>
  </div>
</figure>
