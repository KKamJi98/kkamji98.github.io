<figure class="sd sd--comparison" id="sd-kubernetes-6w-micro-service-architecture-complexity" aria-labelledby="sd-kubernetes-6w-micro-service-architecture-complexity-title">
  <figcaption class="sd-title" id="sd-kubernetes-6w-micro-service-architecture-complexity-title">Microservice가 늘수록 직접 연결의 운영 복잡도가 커진다</figcaption>
  <p class="sd-note">아래 EXAMPLE A, B, C는 특정 workload가 아닌 개념 예시입니다. 직접 호출이 늘수록 각 service가 retry, auth, traffic control, telemetry를 반복해서 관리해야 합니다.</p>
  <div class="sd-grid">

        <article class="sd-node">

        <article class="sd-node">
