<figure class="sd sd--layers sd--flow" id="sd-kubernetes-cilium-overview" aria-labelledby="sd-kubernetes-cilium-overview-title">
  <figcaption class="sd-title" id="sd-kubernetes-cilium-overview-title">Cilium의 control input은 kernel BPF program으로 내려간다</figcaption>
  <section class="sd-band">
    <div class="sd-band-title">Cilium layer</div>
    <div class="sd-grid">
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">Orchestration systems</strong>
          <span class="sd-detail">resource와 status를 Cilium Plugins와 교환합니다.</span>
        </div>
        <div class="sd-arrow">
          <span class="sd-edge-label">plugin event</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">Cilium Plugins</strong>
          <span class="sd-detail">orchestration API를 daemon 입력으로 전달합니다.</span>
        </div>
      </div>
      <div class="sd-node">
        <strong class="sd-label">Cilium CLI</strong>
        <span class="sd-detail">운영자의 상태 조회와 정책 명령입니다.</span>
      </div>
      <div class="sd-node">
        <strong class="sd-label">Policy Repository</strong>
        <span class="sd-detail">적용할 network policy의 원천입니다.</span>
      </div>
    </div>
    <div class="sd-arrow">
      <span class="sd-edge-label">독립 구성 입력</span>
    </div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Cilium Daemon</strong>
      <span class="sd-detail">Code Generation으로 node datapath와 정책을 구성하고 상태 조회를 처리합니다.</span>
    </div>
    <div class="sd-node">
      <strong class="sd-label">Cilium Monitor</strong>
      <span class="sd-detail">datapath event 관찰. 구성 입력 경로와 구분합니다.</span>
    </div>
  </section>
  <div class="sd-arrow">
    <span class="sd-edge-label">bytecode injection</span>
  </div>
  <section class="sd-band sd-band--accent">
    <div class="sd-band-title">Linux kernel data plane</div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">BPF Programs</strong>
      <span class="sd-detail">여러 network path에 적용하는 program 집합</span>
    </div>
    <div class="sd-arrow">
      <span class="sd-edge-label">host interface와 workload hook에 독립 fan-out</span>
    </div>
    <div class="sd-grid">
      <div class="sd-node">
        <strong class="sd-label">eth0</strong>
        <span class="sd-detail">host network interface에서 packet을 처리합니다.</span>
      </div>
      <div class="sd-node">
        <strong class="sd-label">Containers</strong>
        <span class="sd-detail">각 workload network path에 policy와 관측을 적용합니다.</span>
      </div>
    </div>
  </section>
</figure>
