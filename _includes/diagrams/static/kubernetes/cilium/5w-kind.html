<figure class="sd sd--layers" id="kind-architecture" aria-labelledby="kind-architecture-title">
  <figcaption class="sd-title" id="kind-architecture-title">kind의 node container 안에서 kubelet과 containerd가 Pod를 실행한다</figcaption>
<section class="sd-lane"><div class="sd-lane-title">Host: 기록된 Docker 기반 kind 실습</div>
<div class="sd-flow">
<div class="sd-node"><strong class="sd-label">kind CLI</strong><span class="sd-detail">node container 생성과 kubeadm bootstrap 구성</span></div>
<div class="sd-arrow"><span class="sd-edge-label">Docker engine에 생성 요청</span></div>
<div class="sd-node"><strong class="sd-label">Docker engine</strong><span class="sd-detail">control-plane 및 worker 역할의 node container 실행</span></div>
</div>
</section>
<div class="sd-arrow"><span class="sd-edge-label">node container 경계</span></div>
<section class="sd-lane"><div class="sd-lane-title">Node container</div>
<div class="sd-flow">
<div class="sd-node"><strong class="sd-label">systemd</strong><span class="sd-detail">node service인 kubelet과 containerd를 시작</span></div>
<div class="sd-arrow"><span class="sd-edge-label">service 시작</span></div>
<div class="sd-node sd-node--accent"><strong class="sd-label">kubelet + containerd</strong><span class="sd-detail">kubelet이 CRI로 containerd에 Pod container 실행 요청</span></div>
</div>
<div class="sd-grid sd-grid--three">
<section class="sd-lane"><div class="sd-lane-title">Control-plane node의 static Pods</div>
<div class="sd-node"><strong class="sd-label">kube-apiserver, etcd</strong><span class="sd-detail">kubeadm이 생성한 static Pod manifest를 kubelet이 관리</span></div>
<div class="sd-node"><strong class="sd-label">kube-controller-manager, kube-scheduler</strong><span class="sd-detail">같은 static Pod 방식. systemd가 직접 실행하는 control-plane service가 아님</span></div>
</section>
<section class="sd-lane"><div class="sd-lane-title">Network / DNS workloads</div>
<div class="sd-node"><strong class="sd-label">kube-proxy, kindnet</strong><span class="sd-detail">실습에 기록된 기본 Service 및 Pod network 구성</span></div>
<div class="sd-node"><strong class="sd-label">CoreDNS</strong><span class="sd-detail">cluster DNS workload. kubelet/runtime이 Pod를 실행</span></div>
</section>
<section class="sd-lane"><div class="sd-lane-title">Application workloads</div>
<div class="sd-node"><strong class="sd-label">User Pods</strong><span class="sd-detail">스케줄된 node의 kubelet/runtime이 실행</span></div>
</section>
</div>
</section>
<p class="sd-note">기록된 node runtime은 containerd 2.1.1이며 기본 CNI Pod는 kindnet입니다. 사용자 지정 CNI나 다른 host provider 구성과 구분합니다.</p>
</figure>
