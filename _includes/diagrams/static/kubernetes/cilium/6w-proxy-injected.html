<figure class="sd sd--flow" id="sd-kubernetes-cilium-6w-proxy-injected" aria-labelledby="sd-kubernetes-cilium-6w-proxy-injected-title">
  <figcaption class="sd-title" id="sd-kubernetes-cilium-6w-proxy-injected-title">Sidecar proxy가 두 application 사이의 traffic을 가로채 전달한다</figcaption>
  <div class="sd-flow">
    <div class="sd-node">
      <strong class="sd-label">Application A</strong>
      <span class="sd-detail">application code는 service mesh 기능을 직접 구현하지 않는다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">sidecar interception</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Proxy A</strong>
      <span class="sd-detail">Pod에 주입된 Sidecar Container가 outbound traffic을 받는다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">proxied application traffic</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Proxy B</strong>
      <span class="sd-detail">대상 Pod의 Sidecar Container가 inbound traffic을 처리한다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">deliver locally</span></div>
    <div class="sd-node">
      <strong class="sd-label">Application B</strong>
      <span class="sd-detail">proxy가 확인하고 전달한 요청을 처리한다.</span>
    </div>
  </div>
  <p class="sd-note">각 application에는 sidecar proxy가 있고, iptables rule은 application traffic을 local sidecar로 redirect한 뒤 proxy 사이의 경로로 전달한다.</p>
</figure>
