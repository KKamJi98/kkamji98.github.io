<figure class="sd sd--layers sd--flow" id="sd-kubernetes-cilium-6w-ingress-to-endpoint" aria-labelledby="sd-kubernetes-cilium-6w-ingress-to-endpoint-title">
  <figcaption class="sd-title" id="sd-kubernetes-cilium-6w-ingress-to-endpoint-title">Cilium ingress packet은 NIC hook에서 endpoint enforcement까지 흐른다</figcaption>
  <section class="sd-lane sd-lane--accent" aria-label="Conceptual ingress endpoint path">
    <div class="sd-lane-title">Local endpoint delivery (개념 경로)</div>
    <div class="sd-flow">
      <div class="sd-node">
        <strong class="sd-label">Network device / NIC</strong>
        <span class="sd-detail">network device가 ingress packet을 받는다.</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">routing mode에 따른 처리</span></div>
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">Host / overlay datapath</strong>
        <span class="sd-detail">host 또는 overlay 경로를 거쳐 로컬 endpoint로 전달한다. cilium_host 경유는 필수가 아니다.</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">endpoint hook</span></div>
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">Endpoint policy / delivery</strong>
        <span class="sd-detail">선택된 datapath의 endpoint 정책을 검사한다.</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">deliver to pod</span></div>
      <div class="sd-node">
        <strong class="sd-label">Endpoint / Pod</strong>
        <span class="sd-detail">정책 검사를 통과한 packet의 목적지</span>
      </div>
    </div>
  </section>
  <div class="sd-grid">
    <section class="sd-lane" aria-label="Overlay decapsulation path">
      <div class="sd-lane-title">Overlay mode</div>
      <div class="sd-flow">
        <div class="sd-node sd-node--muted">
          <strong class="sd-label">NIC</strong>
          <span class="sd-detail">tunnel packet이 node에 들어온다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">decapsulate and route</span></div>
        <div class="sd-node">
          <strong class="sd-label">Local endpoint delivery로 합류</strong>
          <span class="sd-detail">decapsulation 뒤 위의 endpoint 정책 검사와 Pod 전달 경로로 합류한다.</span>
        </div>
      </div>
    </section>
    <section class="sd-lane" aria-label="Optional XDP prefilter">
      <div class="sd-lane-title">Optional prefilter</div>
      <div class="sd-flow">
        <div class="sd-node sd-node--muted">
          <strong class="sd-label">XDP @ NIC / bpf_xdp</strong>
          <span class="sd-detail">TC load balancer보다 앞선 선택적 prefilter hook</span>
        </div>
      </div>
    </section>
    <section class="sd-lane" aria-label="Optional standalone load balancer path">
      <div class="sd-lane-title">Optional standalone load balancer</div>
      <div class="sd-flow">
        <div class="sd-node sd-node--muted">
          <strong class="sd-label">TC @ NIC / bpf_lb</strong>
          <span class="sd-detail">Standalone load balancer가 켜진 경우 service backend를 선택한다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">optional netfilter path</span></div>
        <div class="sd-node">
          <strong class="sd-label">PREROUTING and FORWARD</strong>
          <span class="sd-detail"><code>CILIUM_FORWARD</code>를 포함한 forwarding hook이다.</span>
        </div>
      </div>
    </section>
    <section class="sd-lane" aria-label="Optional L3 encryption path">
      <div class="sd-lane-title">Optional L3 encryption (IPsec 예시)</div>
      <div class="sd-flow">
        <div class="sd-node sd-node--muted">
          <strong class="sd-label">TC @ NIC / bpf_network</strong>
          <span class="sd-detail">L3 encryption 경계</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">xfrm and route</span></div>
        <div class="sd-node">
          <strong class="sd-label">Encrypted path</strong>
          <span class="sd-detail">IPsec 수신 패킷을 <code>xfrm</code>으로 복호화한 뒤 endpoint 전달 경로로 합류한다.</span>
        </div>
      </div>
    </section>
    <section class="sd-lane" aria-label="Optional L7 policy path">
      <div class="sd-lane-title">Optional L7 policy</div>
      <div class="sd-flow">
        <div class="sd-node sd-node--muted">
          <strong class="sd-label">PREROUTING</strong>
          <span class="sd-detail">L7 policy feature가 선택되면 userspace 경로를 연다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">INPUT</span></div>
        <div class="sd-node">
          <strong class="sd-label">Userspace proxy</strong>
          <span class="sd-detail">HTTP 같은 application protocol을 확인한다.</span>
        </div>
      </div>
    </section>
  </div>
  <p class="sd-note">그림의 hook 이름은 기존 TC/veth datapath의 선택 경로 예시이며, 버전과 routing/device mode에 따라 달라진다. Cilium 1.9부터의 eBPF host-routing은 상위 host stack을 우회할 수 있다. XDP, standalone LB, 암호화와 L7 proxy는 선택 기능이다.</p>
</figure>
