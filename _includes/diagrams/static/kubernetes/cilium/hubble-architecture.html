<figure class="sd sd--layers sd--comparison" id="sd-kubernetes-hubble-architecture" aria-labelledby="sd-kubernetes-hubble-architecture-title">
  <figcaption class="sd-title" id="sd-kubernetes-hubble-architecture-title">Hubble는 node-local flow를 Relay와 observability 도구로 전달한다</figcaption>
  <section class="sd-band" aria-labelledby="sd-kubernetes-hubble-architecture-nodes-title">
    <div class="sd-band-title" id="sd-kubernetes-hubble-architecture-nodes-title">Node-local Hubble API</div>
    <div class="sd-grid">
      <section class="sd-lane sd-lane--accent" aria-label="Node 1 Hubble path">
        <div class="sd-lane-title">Node 1</div>
        <div class="sd-flow">
          <div class="sd-node"><strong class="sd-label">Pods (3)</strong><span class="sd-detail">workload flow가 node 안에서 발생합니다.</span></div>
          <div class="sd-arrow"><span class="sd-edge-label">eBPF observation</span></div>
          <div class="sd-node"><strong class="sd-label">cilium + BPF</strong><span class="sd-detail">network event와 identity를 수집합니다.</span></div>
          <div class="sd-arrow"><span class="sd-edge-label">node-local flow</span></div>
          <div class="sd-node sd-node--accent"><strong class="sd-label">Hubble API</strong><span class="sd-detail">이 node의 flow를 제공합니다.</span></div>
        </div>
      </section>
      <section class="sd-lane" aria-label="Node 2 Hubble path">
        <div class="sd-lane-title">Node 2</div>
        <div class="sd-flow">
          <div class="sd-node"><strong class="sd-label">Pods (3)</strong><span class="sd-detail">두 번째 node의 workload flow입니다.</span></div>
          <div class="sd-arrow"><span class="sd-edge-label">eBPF observation</span></div>
          <div class="sd-node"><strong class="sd-label">cilium + BPF</strong><span class="sd-detail">동일한 방식으로 event를 수집합니다.</span></div>
          <div class="sd-arrow"><span class="sd-edge-label">node-local flow</span></div>
          <div class="sd-node sd-node--accent"><strong class="sd-label">Hubble API</strong><span class="sd-detail">이 node의 flow를 제공합니다.</span></div>
        </div>
      </section>
    </div>
  </section>
<div class="sd-arrow"><span class="sd-edge-label">node-local Hubble에서 세 소비 경로로 분기</span></div>
<div class="sd-grid sd-grid--three">
<section class="sd-lane"><div class="sd-lane-title">Local flow API</div>
<div class="sd-flow">
<div class="sd-node"><strong class="sd-label">Node-local Hubble API</strong><span class="sd-detail">로컬 Unix socket으로 flow 제공</span></div>
<div class="sd-arrow"><span class="sd-edge-label">직접 조회</span></div>
<div class="sd-node"><strong class="sd-label">Hubble CLI</strong><span class="sd-detail">Relay 없이 해당 node flow 조회</span></div>
</div>
</section>
<section class="sd-lane"><div class="sd-lane-title">Flow metrics</div>
<div class="sd-flow">
<div class="sd-node"><strong class="sd-label">Node Hubble metrics endpoint</strong><span class="sd-detail">활성화된 metrics를 <code>hubble-metrics</code> Service endpoints로 노출</span></div>
<div class="sd-arrow"><span class="sd-edge-label">Prometheus가 node endpoint scrape</span></div>
<div class="sd-node"><strong class="sd-label">Prometheus / Grafana</strong><span class="sd-detail">metrics 저장 및 시각화. Relay를 거치지 않음</span></div>
</div>
</section>
<section class="sd-lane"><div class="sd-lane-title">Cluster-wide flow API</div>
<div class="sd-flow">
<div class="sd-node sd-node--accent"><strong class="sd-label">Hubble Relay (optional)</strong><span class="sd-detail">여러 node의 Hubble API에 연결해 flow 집계</span></div>
<div class="sd-arrow"><span class="sd-edge-label">집계 flow 조회</span></div>
<div class="sd-node"><strong class="sd-label">Hubble CLI / Hubble UI</strong><span class="sd-detail">cluster-wide flow와 service map 조회</span></div>
</div>
</section>
</div>
<p class="sd-note">Flow API와 metrics endpoint는 서로 다른 인터페이스입니다. Prometheus의 Hubble flow metrics scrape 경로는 Relay 집계와 독립적입니다.</p>
</figure>
