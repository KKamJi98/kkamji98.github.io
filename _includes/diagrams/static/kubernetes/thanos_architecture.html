<figure class="sd sd--layers" id="thanos-architecture" aria-labelledby="thanos-architecture-title">
  <figcaption class="sd-title" id="thanos-architecture-title">Thanos는 Prometheus query를 장기 block storage와 합칩니다</figcaption>
  <div class="sd-flow">
  <div class="sd-node">
  <strong class="sd-label">PromQL clients</strong>
  <span class="sd-detail">Grafana와 외부 HTTP query clients</span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">HTTP query</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">Thanos Query Frontend</strong>
  <span class="sd-detail">cache와 query splitting</span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">Prometheus query API</span>
  </div>
  <div class="sd-node sd-node--accent">
  <strong class="sd-label">Thanos Query</strong>
  <span class="sd-detail">Store API 결과를 merge</span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">gRPC Store API fan-out</span>
  </div>
  <div class="sd-grid">
  <div class="sd-node">
  <strong class="sd-label">Thanos Store Gateway</strong>
  <span class="sd-detail">Object storage의 장기 block read</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">Thanos Sidecar</strong>
  <span class="sd-detail">Prometheus Server local TSDB 조회와 block upload</span>
  </div>
  </div>
  </div>
  <div class="sd-grid">
  <div class="sd-node">
  <strong class="sd-label">Prometheus Server</strong>
  <span class="sd-detail">exporter scrape, local TSDB; Sidecar가 같은 Pod에 배치</span>
  </div>
  <div class="sd-node sd-node--accent">
  <strong class="sd-label">Object storage</strong>
  <span class="sd-detail">S3, GCS 또는 Minio. Sidecar와 Ruler가 upload, Store Gateway가 read</span>
  </div>
  </div>
  <div class="sd-grid">
  <div class="sd-node">
  <strong class="sd-label">Thanos Compactor</strong>
  <span class="sd-detail">Object storage block을 read/write하며 compaction, downsample, retention 수행</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">Thanos Ruler</strong>
  <span class="sd-detail">Thanos Query의 query API로 recording/alert rule 평가. 기본 모드는 local TSDB와 bucket upload 사용</span>
  </div>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">Ruler의 firing alert만 전달</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">External Alertmanager</strong>
  <span class="sd-detail">외부 알림 채널로 전달</span>
  </div>
  <p class="sd-note">저장소와 local TSDB, Compactor 작업 상태를 모두 stateless로 간주하지 않습니다. Ruler의 선택적 remote-write 모드는 별도 구성입니다.</p>
</figure>
