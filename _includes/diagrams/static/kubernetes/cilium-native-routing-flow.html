<figure class="sd sd--flow" id="sd-kubernetes-cilium-native-routing-flow" aria-labelledby="sd-kubernetes-cilium-native-routing-flow-title">
  <figcaption class="sd-title" id="sd-kubernetes-cilium-native-routing-flow-title">Cilium Native Routing은 Pod CIDR 경로가 있어야 한다</figcaption>
  <div class="sd-flow">
    <div class="sd-node">
      <strong class="sd-label">Source Pod</strong>
      <span class="sd-detail">Pod IP를 그대로 담은 packet이 시작됩니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">Pod CIDR 조회</span></div>
    <div class="sd-node">
      <strong class="sd-label">Cilium routing table</strong>
      <span class="sd-detail">node별 Pod CIDR 경로를 확인합니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">underlay route 확인</span></div>
    <div class="sd-node sd-node--warning">
      <strong class="sd-label">Static route or BGP</strong>
      <span class="sd-detail">경로가 없으면 packet은 drop되고 tunnel로 숨겨지지 않습니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">encapsulation 없이 전달</span></div>
    <div class="sd-node">
      <strong class="sd-label">Remote node</strong>
      <span class="sd-detail">unencapsulated packet을 수신합니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">source IP 유지</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Destination Pod</strong>
      <span class="sd-detail">end to end에서 원본 source IP가 보존됩니다.</span>
    </div>
  </div>
  <p class="sd-note">Native Routing은 node 바깥의 라우팅을 대신하지 않습니다. Static route 또는 BGP가 각 Pod CIDR을 underlay에 알려야 합니다.</p>
</figure>
