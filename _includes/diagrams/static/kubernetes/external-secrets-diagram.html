<figure class="sd sd--comparison" id="external-secrets-diagram" aria-labelledby="external-secrets-diagram-title">
  <figcaption class="sd-title" id="external-secrets-diagram-title">External Secrets Operator가 외부 값을 Kubernetes Secret으로 동기화합니다</figcaption>
  <p class="sd-note">Operator는 AWS Secrets Manager를 읽고 CRD 설정에 따라 대상 namespace에 Secret을 생성하거나 갱신합니다.</p>

  <div class="sd-flow">
    <div class="sd-node sd-node--muted">
      <strong class="sd-label">AWS Secrets Manager</strong>
      <span class="sd-detail">외부 secret value 저장소</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">provider read and reconcile</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">External Secrets Operator</strong>
      <span class="sd-detail">ExternalSecret 리소스를 관찰하고 값을 동기화합니다.</span>
    </div>
  </div>

  <section class="sd-lane">
    <div class="sd-lane-title">Kubernetes Cluster</div>
    <div class="sd-grid">
      <section class="sd-lane">
        <div class="sd-lane-title">Namespace scope</div>
        <div class="sd-flow">
          <div class="sd-node">
            <strong class="sd-label">ExternalSecret CRD</strong>
            <span class="sd-detail">같은 namespace의 SecretStore와 대상 key를 선언합니다.</span>
          </div>
          <div class="sd-arrow"><span class="sd-edge-label">namespace-scoped reference</span></div>
          <div class="sd-node">
            <strong class="sd-label">SecretStore CRD</strong>
            <span class="sd-detail">provider와 인증 정보를 같은 namespace에 격리합니다.</span>
          </div>
          <div class="sd-arrow"><span class="sd-edge-label">operator sync</span></div>
          <div class="sd-node sd-node--accent">
            <strong class="sd-label">Kubernetes Secret</strong>
            <span class="sd-detail">ExternalSecret이 속한 namespace에만 생성됩니다.</span>
          </div>
        </div>
      </section>

      <section class="sd-lane">
        <div class="sd-lane-title">Cluster scope</div>
        <div class="sd-flow">
          <div class="sd-node">
            <strong class="sd-label">ClusterSecretStore CRD</strong>
            <span class="sd-detail">모든 namespace의 ExternalSecret이 참조할 수 있는 provider 설정입니다.</span>
          </div>
          <div class="sd-arrow"><span class="sd-edge-label">shared reference</span></div>
          <div class="sd-grid">
            <section class="sd-lane">
              <div class="sd-lane-title">namespace a</div>
              <div class="sd-flow">
                <div class="sd-node">
                  <strong class="sd-label">ExternalSecret</strong>
                  <span class="sd-detail">ClusterSecretStore를 참조합니다.</span>
                </div>
                <div class="sd-arrow"><span class="sd-edge-label">sync</span></div>
                <div class="sd-node sd-node--accent">
                  <strong class="sd-label">Secret</strong>
                  <span class="sd-detail">namespace a에 생성됩니다.</span>
                </div>
              </div>
            </section>
            <section class="sd-lane">
              <div class="sd-lane-title">namespace b</div>
              <div class="sd-flow">
                <div class="sd-node">
                  <strong class="sd-label">ExternalSecret</strong>
                  <span class="sd-detail">같은 ClusterSecretStore를 참조할 수 있습니다.</span>
                </div>
                <div class="sd-arrow"><span class="sd-edge-label">sync</span></div>
                <div class="sd-node sd-node--accent">
                  <strong class="sd-label">Secret</strong>
                  <span class="sd-detail">namespace b에 생성됩니다.</span>
                </div>
              </div>
            </section>
          </div>
          <p class="sd-note">ClusterExternalSecret을 쓰면 대상 selector에 위 ExternalSecret을 자동 생성할 수 있습니다.</p>
        </div>
      </section>
    </div>
  </section>

  <p class="sd-note">SecretStore와 ExternalSecret은 namespace 범위이고, ClusterSecretStore와 ClusterExternalSecret은 cluster 범위입니다. 범위를 섞으면 참조 또는 생성 대상이 달라집니다.</p>
</figure>
