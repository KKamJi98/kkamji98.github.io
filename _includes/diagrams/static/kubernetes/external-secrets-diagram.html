<figure class="sd sd--comparison" id="external-secrets-diagram" aria-labelledby="external-secrets-diagram-title">
  <figcaption class="sd-title" id="external-secrets-diagram-title">External Secrets Operator가 외부 값을 Kubernetes Secret으로 동기화합니다</figcaption>
  <div class="sd-node sd-node--muted">
    <strong class="sd-label">AWS Secrets Manager</strong>
    <span class="sd-detail">외부 secret value 저장소</span>
  </div>
  <div class="sd-arrow sd-arrow--both">
    <span class="sd-edge-label">Operator의 provider read / secret value 반환</span>
  </div>
  <section class="sd-band">
    <div class="sd-band-title">Kubernetes Cluster</div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">External Secrets Operator</strong>
      <span class="sd-detail">ExternalSecret 리소스를 관찰하고 값을 동기화합니다.</span>
    </div>
    <div class="sd-node">
      <strong class="sd-label">ClusterSecretStore</strong>
      <span class="sd-detail">cluster 범위의 provider와 인증 설정. namespace a/b의 ExternalSecret이 참조하는 공유 설정.</span>
    </div>
    <div class="sd-grid">
      <section class="sd-lane">
        <div class="sd-lane-title">namespace a</div>
        <div class="sd-node">
          <strong class="sd-label">ExternalSecret</strong>
          <span class="sd-detail">대상 key와 생성할 Secret을 선언. 같은 namespace의 SecretStore 또는 ClusterSecretStore를 참조.</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">SecretStore</strong>
          <span class="sd-detail">namespace a의 provider와 인증 설정. namespace b에서는 참조할 수 없음.</span>
        </div>
        <div class="sd-arrow">
          <span class="sd-edge-label">Operator가 읽은 값으로 reconcile</span>
        </div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">Kubernetes Secret</strong>
          <span class="sd-detail">namespace a에 생성 또는 갱신</span>
        </div>
      </section>
      <section class="sd-lane">
        <div class="sd-lane-title">namespace b</div>
        <div class="sd-node">
          <strong class="sd-label">ExternalSecret</strong>
          <span class="sd-detail">공유 ClusterSecretStore를 참조할 수 있음.</span>
        </div>
        <div class="sd-arrow">
          <span class="sd-edge-label">Operator가 읽은 값으로 reconcile</span>
        </div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">Kubernetes Secret</strong>
          <span class="sd-detail">namespace b에 생성 또는 갱신</span>
        </div>
      </section>
    </div>
    <p class="sd-note">ClusterExternalSecret은 cluster 범위이며 selector에 맞는 namespace에 ExternalSecret을 생성합니다. Secret은 각 ExternalSecret이 속한 namespace에만 생성됩니다.</p>
  </section>
</figure>
