<figure class="sd sd--layers sd--flow" id="sd-kubernetes-terminating-pod-troubleshooting" aria-labelledby="sd-kubernetes-terminating-pod-troubleshooting-title">
  <figcaption class="sd-title" id="sd-kubernetes-terminating-pod-troubleshooting-title">Terminating Pod은 API 상태와 node 종료를 나누어 조사한다</figcaption>
<div class="sd-flow">
<div class="sd-node"><strong class="sd-label">Pod deletion request</strong><span class="sd-detail"><code>deletionTimestamp</code>와 grace period 확인</span></div>
<div class="sd-arrow"><span class="sd-edge-label">원인별 조건부 진단</span></div>
</div>
<div class="sd-grid sd-grid--three">
<section class="sd-lane"><div class="sd-lane-title">Finalizers: 존재할 때</div>
<div class="sd-node"><strong class="sd-label">API metadata 확인</strong><span class="sd-detail">finalizer가 있으면 담당 controller의 cleanup과 제거 여부 조사. 모든 Pod에 존재하는 필수 gate가 아님</span></div>
</section>
<section class="sd-lane"><div class="sd-lane-title">Node / kubelet / runtime</div>
<div class="sd-node"><strong class="sd-label">종료 진행 상태 확인</strong><span class="sd-detail">node 도달 가능성, preStop, TERM, grace 만료 후 KILL 및 runtime 이벤트 조사</span></div>
</section>
<section class="sd-lane"><div class="sd-lane-title">Storage: 해당될 때</div>
<div class="sd-node"><strong class="sd-label">Unmount / detach 확인</strong><span class="sd-detail">volume 사용 시 관련 정리 상태 조사. Pod API 삭제와 detach 완료를 동일시하지 않음</span></div>
</section>
</div>
<div class="sd-grid">
<div class="sd-node sd-node--accent"><strong class="sd-label">Pod API object removal</strong><span class="sd-detail">일반 삭제와 finalizer 처리를 확인. 강제 삭제는 node 종료 확인 없이 API object를 제거할 수 있음</span></div>
<div class="sd-node sd-node--warning"><strong class="sd-label">실제 process / volume 상태</strong><span class="sd-detail">API object가 사라져도 process 종료나 volume detach 완료의 증거는 아님</span></div>
</div>
<p class="sd-note">본문에서 확인된 이벤트는 <code>ephemeral-storage</code> 부족이며 강제 삭제 경고도 기록되어 있습니다. Finalizer 또는 volume cleanup 지연이 실제 원인이었다는 증거는 없습니다.</p>
</figure>
