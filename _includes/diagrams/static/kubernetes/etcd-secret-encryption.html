<figure class="sd sd--comparison" id="sd-kubernetes-etcd-secret-encryption" aria-labelledby="sd-kubernetes-etcd-secret-encryption-title">
  <figcaption class="sd-title" id="sd-kubernetes-etcd-secret-encryption-title">EncryptionConfiguration이 로드되어야 Secret이 at rest에서 암호화된다</figcaption>
  <p class="sd-note">기본 Secret 저장은 Base64 encoding이며 encryption이 아닙니다. API server에 설정을 연결한 경로에서만 새 write가 ciphertext가 됩니다.</p>
  <div class="sd-grid">
    <section class="sd-lane sd-lane--accent" aria-label="암호화 설정이 적용된 경로">
      <div class="sd-lane-title">EncryptionConfiguration 적용</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">Secret manifest</strong>
          <span class="sd-detail"><code>kubectl apply</code>로 제출</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">설정 경로 사용</span></div>
        <div class="sd-node">
          <strong class="sd-label">API server</strong>
          <span class="sd-detail"><code>--encryption-provider-config</code>를 로드</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">첫 provider가 write 암호화</span></div>
        <div class="sd-node">
          <strong class="sd-label">EncryptionConfiguration</strong>
          <span class="sd-detail">첫 provider가 Secret write를 encrypt합니다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">ciphertext 저장</span></div>
        <div class="sd-node">
          <strong class="sd-label">etcd</strong>
          <span class="sd-detail">at rest 값이 ciphertext입니다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">등록된 provider로 복호화</span></div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">Read and decrypt</strong>
          <span class="sd-detail">listed provider 중 하나가 읽기를 복호화합니다.</span>
        </div>
      </div>
    </section>
    <section class="sd-lane sd-lane--warning" aria-label="암호화 설정이 없는 경로">
      <div class="sd-lane-title">설정이 없을 때</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">Secret manifest</strong>
          <span class="sd-detail">같은 Secret 제출</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">기본 저장 경로</span></div>
        <div class="sd-node">
          <strong class="sd-label">API server</strong>
          <span class="sd-detail">encryption provider 설정 없음</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">Base64 encoding만 적용</span></div>
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">etcd</strong>
          <span class="sd-detail">값을 decode하면 원문을 확인할 수 있습니다.</span>
        </div>
      </div>
    </section>
  </div>
  <p class="sd-note">설정을 추가해도 이미 저장된 Secret은 자동으로 바뀌지 않으므로 다시 써서 암호화해야 합니다.</p>
</figure>
