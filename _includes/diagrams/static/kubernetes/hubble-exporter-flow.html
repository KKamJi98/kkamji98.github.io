<figure class="sd sd--flow" id="sd-kubernetes-hubble-exporter-flow" aria-labelledby="sd-kubernetes-hubble-exporter-flow-title">
  <figcaption class="sd-title" id="sd-kubernetes-hubble-exporter-flow-title">Hubble exporter는 flow log를 파일로 내보냅니다</figcaption>
  <div class="sd-node"><strong class="sd-label">Cilium agent / Hubble flow events</strong><span class="sd-detail">node마다 DaemonSet Pod 하나; eBPF observation point의 network flow를 관측</span></div>
  <div class="sd-grid">
<section class="sd-lane"><div class="sd-lane-title">Flow log export</div>
<div class="sd-flow">
<div class="sd-node sd-node--accent"><strong class="sd-label">Hubble exporter</strong><span class="sd-detail">agent 안에서 filter와 field mask를 적용해 보존할 flow를 선택</span></div>
<div class="sd-arrow"><span class="sd-edge-label">flow log 기록</span></div>
<div class="sd-node"><strong class="sd-label">로그 파일</strong><span class="sd-detail">예: /var/run/cilium/hubble/events.log; rotation과 size limit 적용</span></div>
<div class="sd-arrow"><span class="sd-edge-label">별도 로그 수집기가 파일을 읽음</span></div>
<div class="sd-node"><strong class="sd-label">외부 로그 파이프라인</strong><span class="sd-detail">Loki, Elasticsearch 등의 수집과 장기 저장은 별도 구성</span></div>
</div>
</section>
<section class="sd-lane"><div class="sd-lane-title">별도의 metrics 수집</div>
<div class="sd-flow">
<div class="sd-node sd-node--muted"><strong class="sd-label">Prometheus</strong><span class="sd-detail">flow metric을 주기적으로 수집하고 저장</span></div>
<div class="sd-arrow"><span class="sd-edge-label">Hubble metrics endpoint를 scrape 요청</span></div>
<div class="sd-node"><strong class="sd-label">Metrics endpoint</strong><span class="sd-detail">Hubble metrics 기능의 endpoint; flow log exporter 출력이 아님</span></div>
</div>
</section>
</div>
  <p class="sd-note">agent memory의 ring buffer는 유한합니다. flow log를 장기 보존하려면 파일 export와 별도 보관 구성을 사용합니다. Static 또는 Dynamic 설정으로 filter와 field mask를 조정하며, Dynamic 설정은 재시작 없이 변경할 수 있습니다.</p>
</figure>
