<figure class="sd sd--flow sd--fhd" id="sd-waf-wcu-label-decision" aria-labelledby="sd-waf-wcu-label-decision-title" data-canvas-width="1920" data-canvas-height="1080">
  <figcaption class="sd-title" id="sd-waf-wcu-label-decision-title">탐지 rule은 label만 붙이고 차단은 마지막 rule 하나가 한다</figcaption><div class="sd-semantic-source">
  <div class="sd-flow">
    <div class="sd-node"><strong class="sd-label">종결 rule</strong><span class="sd-detail">관리형 룰 그룹<br>UA 도구 토큰 차단<br>매칭되면 종결</span></div>
    <div class="sd-arrow"><span class="sd-edge-label">통과</span></div>
    <div class="sd-node sd-node--accent"><strong class="sd-label">Count 탐지 4개</strong><span class="sd-detail">헤더 조건마다<br>example:bot:*<br>각 1 WCU</span></div>
    <div class="sd-arrow"><span class="sd-edge-label">통과</span></div>
    <div class="sd-node"><strong class="sd-label">Count 예외</strong><span class="sd-detail">UA 정규식 + ASN<br>example:allow:crawler<br>4 WCU, 한 번만</span></div>
    <div class="sd-arrow"><span class="sd-edge-label">label 읽기</span></div>
    <div class="sd-node sd-node--warning"><strong class="sd-label">Block 판정 1개</strong><span class="sd-detail">example:bot: 있음<br>AND NOT 예외 label<br>2 WCU</span></div>
  </div>
  <section class="sd-band">
    <span class="sd-band-title">예외를 rule마다 반복하면 20 WCU, 나누면 label 구성 1을 더해 11 WCU</span>
    <div class="sd-grid sd-grid--three">
      <div class="sd-node"><strong class="sd-label">예외는 한 곳</strong><span class="sd-detail">크롤러 조건을<br>한 rule에서만 평가한다</span></div>
      <div class="sd-node"><strong class="sd-label">전환은 한 번</strong><span class="sd-detail">Block과 롤백 모두<br>판정 rule의 action 변경</span></div>
      <div class="sd-node"><strong class="sd-label">label별 지표</strong><span class="sd-detail">통과한 요청만 세어<br>오탐 검토 대상이 바로 나온다</span></div>
    </div>
  </section>
  <p class="sd-note">label은 먼저 평가된 rule이 붙인 것만 보이므로 탐지 rule의 priority 숫자가 판정 rule보다 작아야 한다.</p>
</div>
