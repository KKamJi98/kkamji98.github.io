  <figcaption class="sd-title" id="sd-waf-wcu-billing-tiers-title">1,500 WCU를 넘으면 Web ACL의 모든 요청 단가가 오른다</figcaption><div class="sd-semantic-source">
  <div class="sd-flow">

    <div class="sd-arrow"><span class="sd-edge-label">1 WCU 초과</span></div>
    <div class="sd-node sd-node--warning"><strong class="sd-label">1,501~2,000 WCU</strong><span class="sd-detail">100만 건당 $0.80<br>월 3억 건: $240</span></div>

  </div>
  <p class="sd-note">1,500을 넘으면 500 WCU 구간마다 100만 건당 $0.20이 더해진다. 가산 요금은 새 룰에 매칭된 요청이 아니라 Web ACL이 검사하는 전체 요청에 붙는다.</p>
  <section class="sd-band">
    <span class="sd-band-title">관리형 룰 그룹 6개만으로 1,375 WCU, custom rule 예산은 125 WCU</span>

      <div class="sd-node"><strong class="sd-label">Linux OS</strong><span class="sd-detail">200 WCU</span></div>

      <div class="sd-node"><strong class="sd-label">Anonymous IP list</strong><span class="sd-detail">50 WCU</span></div>
    </div>
  </section>
</div>
