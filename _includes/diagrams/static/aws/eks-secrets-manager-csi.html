<figure class="sd sd--flow" id="sd-aws-eks-secrets-manager-csi" aria-labelledby="sd-title-aws-eks-secrets-manager-csi">
  <figcaption class="sd-title" id="sd-title-aws-eks-secrets-manager-csi">Secrets Manager 값은 env var가 아니라 Pod의 mounted file이 된다</figcaption>
  <section class="sd-lane" aria-label="EKS worker node">
    <div class="sd-lane-title">EKS worker node</div>
    <div class="sd-flow">
      <div class="sd-node">
        <strong class="sd-label">Pod</strong>
        <span class="sd-detail">SecretProviderClass volume 선언</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">volume mount</span></div>
      <div class="sd-node">
        <strong class="sd-label">Secrets Store CSI driver</strong>
        <span class="sd-detail">node마다 DaemonSet으로 실행</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">AWS provider 호출</span></div>
      <div class="sd-node">
        <strong class="sd-label">AWS provider (ASCP)</strong>
        <span class="sd-detail">IRSA role을 assume</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">GetSecretValue</span></div>
      <div class="sd-node">
        <strong class="sd-label">AWS Secrets Manager</strong>
        <span class="sd-detail">secret value 반환</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">tmpfs에 mount</span></div>
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">Mounted secret file</strong>
        <span class="sd-detail">read-only tmpfs; poll로 rotation</span>
      </div>
    </div>
  </section>
  <p class="sd-note">Pod가 AWS credential을 직접 보유하지 않습니다. Fargate node group은 이 구성을 지원하지 않습니다.</p>
</figure>
