<figure class="sd sd--flow" id="sd-aws-analytics-stack-07-lake-formation" aria-labelledby="sd-title-aws-analytics-stack-07-lake-formation">
  <figcaption class="sd-title" id="sd-title-aws-analytics-stack-07-lake-formation">IAM과 Lake Formation은 같은 query에 별도 gate를 둔다</figcaption>
  <div class="sd-flow">
    <div class="sd-node">
      <strong class="sd-label">analytics-workload-role</strong>
      <span class="sd-detail">query principal</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">query 제출</span></div>
    <div class="sd-node">
      <strong class="sd-label">Amazon Athena</strong>
      <span class="sd-detail">query engine</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">API authorization</span></div>
    <div class="sd-node">
      <strong class="sd-label">IAM gate</strong>
      <span class="sd-detail">athena:*, glue:Get* on target and ancestor ARN; lakeformation:GetDataAccess</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">data authorization</span></div>
    <div class="sd-node sd-node--warning">
      <strong class="sd-label">Lake Formation gate</strong>
      <span class="sd-detail">database와 table에 SELECT, DESCRIBE grant</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">등록된 role을 assume</span></div>
    <div class="sd-node">
      <strong class="sd-label">Registered role</strong>
      <span class="sd-detail">Lake Formation이 data access credential을 vending</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">underlying objects read</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">S3 Tables data</strong>
      <span class="sd-detail">실제 테이블 objects</span>
    </div>
  </div>
  <p class="sd-note">IAM Allow만 있고 Lake Formation grant가 없으면 데이터 gate에서 AccessDenied가 반환됩니다. 두 gate가 모두 Allow여야 합니다.</p>
</figure>
