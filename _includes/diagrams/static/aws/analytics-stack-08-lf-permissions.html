<figure class="sd sd--comparison" id="sd-aws-analytics-stack-08-lf-permissions" aria-labelledby="sd-title-aws-analytics-stack-08-lf-permissions">
  <figcaption class="sd-title" id="sd-title-aws-analytics-stack-08-lf-permissions">Catalog 계층마다 IAM action과 Lake Formation grant가 필요하다</figcaption>
  <div class="sd-stack">
    <section class="sd-band" aria-label="Permission matrix">
      <div class="sd-band-title">Permission matrix: catalog, database, table</div>
      <div class="sd-quality-records">
      <div class="sd-band sd-quality-record">
          <div class="sd-quality-field"><strong class="sd-label">Layer</strong><div class="sd-detail sd-band-title">catalog</div></div>
          <div class="sd-quality-field"><strong class="sd-label">IAM API authorization</strong><div class="sd-detail"><code>glue:GetCatalog</code>, <code>GetCatalogs</code><br>catalog/s3tablescatalog/{bucket} ARN</div></div>
          <div class="sd-quality-field"><strong class="sd-label">Lake Formation data authorization</strong><div class="sd-detail"><code>DESCRIBE</code><br>s3tablescatalog/{bucket}</div></div>
      </div>
      <div class="sd-band sd-quality-record">
          <div class="sd-quality-field"><strong class="sd-label">Layer</strong><div class="sd-detail sd-band-title">database</div></div>
          <div class="sd-quality-field"><strong class="sd-label">IAM API authorization</strong><div class="sd-detail"><code>glue:GetDatabase</code>, <code>GetDatabases</code><br>database/s3tablescatalog/{bucket}/{db} ARN</div></div>
          <div class="sd-quality-field"><strong class="sd-label">Lake Formation data authorization</strong><div class="sd-detail"><code>DESCRIBE</code><br>{db}</div></div>
      </div>
      <div class="sd-band sd-quality-record">
          <div class="sd-quality-field"><strong class="sd-label">Layer</strong><div class="sd-detail sd-band-title">table</div></div>
          <div class="sd-quality-field"><strong class="sd-label">IAM API authorization</strong><div class="sd-detail"><code>glue:GetTable</code>, <code>GetTables</code><br>table/s3tablescatalog/{bucket}/{db}/* ARN</div></div>
          <div class="sd-quality-field"><strong class="sd-label">Lake Formation data authorization</strong><div class="sd-detail"><code>SELECT</code>, <code>DESCRIBE</code><br>target table</div></div>
      </div>
    </div>
      <p class="sd-note"><code>lakeformation:GetDataAccess</code>는 query principal이 credential vending을 받을 수 있게 하는 IAM action입니다.</p>
    </section>
    <section class="sd-band" aria-label="Debugging timeline">
      <div class="sd-band-title">Debugging timeline: 권한을 한 계층씩 추가</div>
      <div class="sd-flow">
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">CATALOG_NOT_FOUND</strong>
          <span class="sd-detail">TABLE_NOT_FOUND</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">catalog 권한 추가</span></div>
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">glue:GetDatabases</strong>
          <span class="sd-detail">AccessDenied</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">database 권한 추가</span></div>
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">glue:GetTable</strong>
          <span class="sd-detail">AccessDenied</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">table 권한 추가</span></div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">query succeeds</strong>
          <span class="sd-detail">short name resolves</span>
        </div>
      </div>
    </section>
  </div>
</figure>
