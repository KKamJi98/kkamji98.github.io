      <div class="sd-flow">

          <strong class="sd-label">Data Warehouse</strong>
          <span class="sd-detail">1990s - schema-on-write, ETL</span>

        <div class="sd-arrow" aria-hidden="true"></div>
        <div class="sd-node">
          <strong class="sd-label">OLAP cubes and MPP appliances</strong>

        </div>
        <div class="sd-arrow" aria-hidden="true"></div>
        <div class="sd-node">
          <strong class="sd-label">Hadoop</strong>
          <span class="sd-detail">2006 - HDFS plus MapReduce</span>
        </div>
        <div class="sd-arrow" aria-hidden="true"></div>
        <div class="sd-node">
          <strong class="sd-label">Data Lake</strong>
          <span class="sd-detail">2010 - schema-on-read</span>
        </div>
        <div class="sd-arrow" aria-hidden="true"></div>
        <div class="sd-node">
          <strong class="sd-label">Cloud data warehouse</strong>
          <span class="sd-detail">2012 - Redshift managed warehouse; Snowflake separates storage and compute</span>

        <div class="sd-arrow" aria-hidden="true"></div>
        <div class="sd-node">
          <strong class="sd-label">Open table formats</strong>
          <span class="sd-detail">2017-19 - Iceberg, Delta Lake, Hudi</span>
        </div>
        <div class="sd-arrow" aria-hidden="true"></div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">Lakehouse</strong>
          <span class="sd-detail">2021 - table features on lake storage</span>

    </section>

        <div class="sd-node">

          <span class="sd-detail">2011 - batch layer plus speed layer</span>
        </div>
        <div class="sd-arrow" aria-hidden="true"></div>
        <div class="sd-node">
          <strong class="sd-label">Kappa architecture</strong>
          <span class="sd-detail">2014 - one stream processor</span>

        <div class="sd-arrow" aria-hidden="true"></div>
        <div class="sd-node">
          <strong class="sd-label">Data Mesh</strong>

    </section>
