<figure class="sd sd--comparison" id="sd-aws-analytics-stack-11-iceberg-cow-vs-mor" aria-labelledby="sd-title-aws-analytics-stack-11-iceberg-cow-vs-mor">
  <figcaption class="sd-title" id="sd-title-aws-analytics-stack-11-iceberg-cow-vs-mor">Copy-on-Write는 write에서, Merge-on-Read는 read에서 비용을 낸다</figcaption>
  <p class="sd-note">두 방식 모두 같은 query result를 만들며, workload 비용을 흡수하는 시점이 다릅니다.</p>
  <div class="sd-grid">
    <section class="sd-lane" aria-label="Copy-on-Write">
      <div class="sd-lane-title">Copy-on-Write</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">data file A</strong>
          <span class="sd-detail">rows 1..n</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">rewrite on update</span></div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">new data file A'</strong>
          <span class="sd-detail">old file leaves the snapshot</span>
        </div>
      </div>
      <p class="sd-note">Fast reads, costly writes. Read-heavy table에 적합합니다.</p>
    </section>
    <section class="sd-lane" aria-label="Merge-on-Read">
      <div class="sd-lane-title">Merge-on-Read</div>
      <div class="sd-grid">
        <div class="sd-node">
          <strong class="sd-label">data file A</strong>
          <span class="sd-detail">원본을 유지</span>
        </div>
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">delete file</strong>
          <span class="sd-detail">position or equality deletes</span>
        </div>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">read-time merge</span></div>
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">merged read</strong>
        <span class="sd-detail">DELETE와 UPDATE는 delete file을 append</span>
      </div>
      <p class="sd-note">Fast writes, read-time merge cost. Frequent updates와 CDC에 적합합니다.</p>
    </section>
  </div>
</figure>
