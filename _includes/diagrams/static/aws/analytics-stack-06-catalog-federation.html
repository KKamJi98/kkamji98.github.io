<figure class="sd sd--comparison" id="sd-aws-analytics-stack-06-catalog-federation" aria-labelledby="sd-title-aws-analytics-stack-06-catalog-federation">
  <figcaption class="sd-title" id="sd-title-aws-analytics-stack-06-catalog-federation">S3 Tables는 일반 Glue database보다 한 단계 깊은 catalog를 만든다</figcaption>
  <div class="sd-flow">
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Default catalog</strong>
      <span class="sd-detail">AwsDataCatalog</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">두 경로로 분기</span></div>
    <div class="sd-grid">
      <section class="sd-lane" aria-label="Regular Glue database path">
        <div class="sd-lane-title">Regular Glue path</div>
        <div class="sd-flow">
          <div class="sd-node"><strong class="sd-label">logs_db</strong><span class="sd-detail">default catalog에 직접 속한 database</span></div>
        </div>
      </section>
      <section class="sd-lane" aria-label="S3 Tables federated catalog path">
        <div class="sd-lane-title">S3 Tables federated path</div>
        <div class="sd-flow">
          <div class="sd-node"><strong class="sd-label">s3tablescatalog</strong><span class="sd-detail">federated catalog</span></div>
          <div class="sd-arrow" aria-hidden="true"></div>
          <div class="sd-node"><strong class="sd-label">amzn-s3-demo-bucket</strong><span class="sd-detail">table bucket</span></div>
          <div class="sd-arrow" aria-hidden="true"></div>
          <div class="sd-node"><strong class="sd-label">sales_db</strong><span class="sd-detail">namespace</span></div>
          <div class="sd-arrow" aria-hidden="true"></div>
          <div class="sd-node sd-node--accent"><strong class="sd-label">orders</strong><span class="sd-detail">table</span></div>
        </div>
      </section>
    </div>
  </div>
  <div class="sd-grid sd-grid--three">
    <div class="sd-node sd-node--muted">
      <strong class="sd-label">Regular database ARN</strong>
      <span class="sd-detail"><code>arn:aws:glue:REGION:ACCOUNT:database/logs_db</code></span>
    </div>
    <div class="sd-node sd-node--warning">
      <strong class="sd-label">S3 Tables native ARN</strong>
      <span class="sd-detail"><code>arn:aws:s3tables:REGION:ACCOUNT:bucket/{bucket}</code><br><code>arn:aws:s3tables:REGION:ACCOUNT:bucket/{bucket}/table/{table-id}</code></span>
    </div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Federated Glue ARN</strong>
      <span class="sd-detail"><code>arn:aws:glue:REGION:ACCOUNT:catalog/s3tablescatalog/{bucket}</code><br><code>arn:aws:glue:REGION:ACCOUNT:database/s3tablescatalog/{bucket}/{db}</code><br><code>arn:aws:glue:REGION:ACCOUNT:table/s3tablescatalog/{bucket}/{db}/{table}</code><br>Lake Formation Catalog Id: <code>ACCOUNT:s3tablescatalog/{bucket}</code></span>
    </div>
  </div>
  <p class="sd-note">federated 경로가 깊어진 만큼 policy는 target뿐 아니라 ancestor ARN도 허용해야 합니다.</p>
</figure>
