  <figcaption class="sd-title" id="sd-title-ci-cd-argocd-declarative-application">Argo CD Application이 Git 상태를 Cluster와 맞추는 흐름</figcaption><div class="sd-semantic-source">
  <div class="sd-flow">

    <div class="sd-arrow"><span class="sd-edge-label">Application에 source와 path 선언</span></div>
