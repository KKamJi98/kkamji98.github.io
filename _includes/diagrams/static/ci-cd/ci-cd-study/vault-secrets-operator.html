<figure class="sd sd--comparison" id="vault-secrets-operator" aria-labelledby="vault-secrets-operator-title">
  <figcaption class="sd-title" id="vault-secrets-operator-title">Vault Secrets Operator의 Kubernetes와 Vault 경계</figcaption>
  <div class="sd-grid">
    <section class="sd-lane">
      <div class="sd-lane-title">Kubernetes cluster boundary</div>
      <div class="sd-flow">
        <div class="sd-node sd-node--muted">
          <strong class="sd-label">Developer and kubectl</strong>
          <span class="sd-detail">VaultConnection, VaultAuth, secret 관련 CRD를 Kubernetes API에 선언한다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">apply resources</span></div>
        <div class="sd-node">
          <strong class="sd-label">Kubernetes API Server</strong>
          <span class="sd-detail">CRD watch와 Kubernetes Secret 저장의 진입점이며 etcd와 scheduler가 상태와 배치를 관리한다.</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">watch and reconcile</span></div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">Vault Secrets Operator Controller</strong>
          <span class="sd-detail">VaultAuth를 읽고 Vault 값을 Kubernetes Secret으로 동기화한다.</span>
        </div>
        <div class="sd-grid">
          <section class="sd-lane sd-lane--accent">
            <div class="sd-lane-title">Vault branch</div>
            <div class="sd-arrow"><span class="sd-edge-label">cross-boundary request</span></div>
            <div class="sd-node">
              <strong class="sd-label">Controller to external Vault API</strong>
              <span class="sd-detail">Operator가 Kubernetes Auth와 Policy를 통해 token과 secret data를 요청한다.</span>
            </div>
            <div class="sd-arrow sd-arrow--both"><span class="sd-edge-label">token and secret request / Vault token and data 반환</span></div>
          </section>
          <section class="sd-lane">
            <div class="sd-lane-title">Kubernetes Secret branch</div>
            <div class="sd-arrow"><span class="sd-edge-label">sync to API</span></div>
            <div class="sd-node">
              <strong class="sd-label">Kubernetes Secret</strong>
              <span class="sd-detail">Operator가 Vault의 static, dynamic, PKI 값을 native Secret으로 create 또는 update한다.</span>
            </div>
            <div class="sd-arrow"><span class="sd-edge-label">mount or env inject</span></div>
            <div class="sd-node sd-node--muted">
              <strong class="sd-label">Application Pod</strong>
              <span class="sd-detail">Pod는 Vault SDK 없이 동기화된 Secret을 읽는다.</span>
            </div>
            <div class="sd-arrow"><span class="sd-edge-label">use credential</span></div>
            <div class="sd-node">
              <strong class="sd-label">Database or application dependency</strong>
              <span class="sd-detail">애플리케이션이 Secret의 credential로 의존 대상에 연결한다.</span>
            </div>
          </section>
        </div>
      </div>
    </section>
    <section class="sd-lane sd-lane--accent">
      <div class="sd-lane-title">HashiCorp Vault boundary</div>
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">Vault API</strong>
        <span class="sd-detail">Kubernetes Auth와 Policy를 확인한 뒤 Operator 요청에 응답한다.</span>
      </div>
      <div class="sd-grid">
        <div class="sd-node">
          <strong class="sd-label">Kubernetes Auth and Policy</strong>
          <span class="sd-detail">ServiceAccount identity를 검증하고 허용된 secret path를 결정한다.</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">Secret Engine</strong>
          <span class="sd-detail">KV, Database, PKI 등의 static 또는 dynamic secret을 제공한다.</span>
        </div>
      </div>
      <p class="sd-note">이 boundary는 Kubernetes cluster 밖에 있다. Controller만 Vault API와 통신하고 Application Pod는 Kubernetes Secret만 읽는다.</p>
    </section>
  </div>
</figure>
