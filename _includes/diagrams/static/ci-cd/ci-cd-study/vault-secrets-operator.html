<figure class="sd sd--comparison" id="vault-secrets-operator" aria-labelledby="vault-secrets-operator-title">
  <figcaption class="sd-title" id="vault-secrets-operator-title">Vault Secrets Operator의 Kubernetes와 Vault 경계</figcaption>
  <div class="sd-node"><strong class="sd-label">Developer and kubectl</strong><span class="sd-detail">클러스터 밖에서 VaultConnection, VaultAuth, secret 관련 CRD를 선언</span></div>
  <div class="sd-arrow"><span class="sd-edge-label">apply resources</span></div>
  <section class="sd-lane" data-boundary="kubernetes">
    <div class="sd-lane-title">Kubernetes cluster / 제어 영역</div>
    <div class="sd-flow">
      <div class="sd-node"><strong class="sd-label">Kubernetes API Server</strong><span class="sd-detail">CRD watch와 Secret 저장의 진입점; etcd는 상태를, scheduler는 배치를 관리</span></div>
      <div class="sd-arrow"><span class="sd-edge-label">리소스 watch와 reconcile</span></div>
      <div class="sd-node sd-node--accent" id="vso-controller"><strong class="sd-label">Vault Secrets Operator Controller</strong><span class="sd-detail">VaultAuth로 인증하고 secret data를 받아 native Secret을 create 또는 update</span></div>
    </div>
  </section>
  <div class="sd-grid sd-grid--three">
    <div>
      <div class="sd-arrow sd-arrow--both" data-relation="controller-vault" data-from="vso-controller" data-to="vso-vault"><span class="sd-edge-label">Controller가 인증 / secret 요청<br />Vault가 token / data 반환</span></div>
      <section class="sd-lane" data-boundary="external">
        <div class="sd-lane-title">클러스터 밖 / HashiCorp Vault</div>
        <div class="sd-node sd-node--accent" id="vso-vault"><strong class="sd-label">Vault API</strong><span class="sd-detail">Operator 요청에 응답</span></div>
        <div class="sd-stack">
          <div class="sd-node"><strong class="sd-label">Kubernetes Auth and Policy</strong><span class="sd-detail">ServiceAccount identity 검증과 secret path 권한</span></div>
          <div class="sd-node"><strong class="sd-label">Secret Engine</strong><span class="sd-detail">KV, Database, PKI의 static 또는 dynamic secret</span></div>
        </div>
      </section>
    </div>
        <div>
          <div class="sd-arrow"><span class="sd-edge-label">Controller가 Secret A 동기화</span></div>
          <section class="sd-lane" data-boundary="kubernetes">
            <div class="sd-lane-title">Kubernetes cluster / Namespace A</div>
            <div class="sd-flow">
              <div class="sd-node"><strong class="sd-label">Kubernetes Secret A</strong><span class="sd-detail">Database 자격증명</span></div>
              <div class="sd-arrow"><span class="sd-edge-label">mount 또는 env 주입</span></div>
              <div class="sd-node" id="vso-pod-a"><strong class="sd-label">Application Pod A</strong><span class="sd-detail">Vault SDK 없이 native Secret 사용</span></div>
            </div>
          </section>
          <div class="sd-arrow" data-relation="pod-a-database" data-from="vso-pod-a" data-to="vso-database"><span class="sd-edge-label">Pod A가 동기화된 credential로 연결</span></div>
          <section class="sd-lane" data-boundary="external"><div class="sd-lane-title">클러스터 밖</div><div class="sd-node" id="vso-database"><strong class="sd-label">Database</strong></div></section>
        </div>
        <div>
          <div class="sd-arrow"><span class="sd-edge-label">Controller가 Secret B 동기화</span></div>
          <section class="sd-lane" data-boundary="kubernetes">
            <div class="sd-lane-title">Kubernetes cluster / Namespace B</div>
            <div class="sd-flow">
              <div class="sd-node"><strong class="sd-label">Kubernetes Secret B</strong><span class="sd-detail">Cloud 자격증명</span></div>
              <div class="sd-arrow"><span class="sd-edge-label">mount 또는 env 주입</span></div>
              <div class="sd-node" id="vso-pod-b"><strong class="sd-label">Application Pod B</strong><span class="sd-detail">Vault SDK 없이 native Secret 사용</span></div>
            </div>
          </section>
          <div class="sd-arrow" data-relation="pod-b-cloud" data-from="vso-pod-b" data-to="vso-cloud"><span class="sd-edge-label">Pod B가 동기화된 credential로 연결</span></div>
          <section class="sd-lane" data-boundary="external"><div class="sd-lane-title">클러스터 밖</div><div class="sd-node" id="vso-cloud"><strong class="sd-label">Cloud</strong></div></section>
        </div>
  </div>
  <p class="sd-note">제어 영역과 두 namespace는 같은 Kubernetes cluster에 속합니다. Vault API 통신은 Controller가, 외부 의존 대상 연결은 각 Pod가 담당합니다.</p>
</figure>
