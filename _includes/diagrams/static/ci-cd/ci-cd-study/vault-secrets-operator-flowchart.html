<figure class="sd sd--flow" id="vault-secrets-operator-flowchart" aria-labelledby="vault-secrets-operator-flowchart-title">
  <figcaption class="sd-title" id="vault-secrets-operator-flowchart-title">Vault Secrets Operator는 CRD를 감시해 Kubernetes Secret을 동기화한다</figcaption>
  <section class="sd-band">
  <div class="sd-band-title">Kubernetes cluster</div>
  <div class="sd-node">
  <strong class="sd-label">VaultSecret CRs</strong>
  <span class="sd-detail">VaultAuth, VaultStaticSecret, VaultDynamicSecret, VaultPKISecret</span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">Watch changes</span>
  </div>
  <div class="sd-node sd-node--accent">
  <strong class="sd-label">Vault Secrets Operator Controller Manager</strong>
  <span class="sd-detail">1. Vault 인증 후 secret read/generate. 2. 반환 data로 Kubernetes Secret create/update</span>
  </div>
  </section>
  <div class="sd-arrow sd-arrow--both">
  <span class="sd-edge-label">Controller의 Vault API 요청 / token, secret data, lease 반환</span>
  </div>
  <section class="sd-band">
  <div class="sd-band-title">HashiCorp Vault</div>
  <div class="sd-grid">
  <div class="sd-node">
  <strong class="sd-label">Auth Methods</strong>
  <span class="sd-detail">VaultAuth의 Kubernetes, AppRole 또는 JWT 설정</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">Secret Engines</strong>
  <span class="sd-detail">인증된 요청으로 static secret, dynamic credential 또는 PKI certificate 제공</span>
  </div>
  </div>
  </section>
  <p class="sd-note">Vault 반환 data가 있어야 Controller가 Kubernetes API에 동기화합니다. Vault가 Kubernetes에 직접 쓰지 않습니다.</p>
  <section class="sd-band">
  <div class="sd-band-title">Kubernetes sync 결과</div>
  <div class="sd-node">
  <strong class="sd-label">Kubernetes Secret</strong>
  <span class="sd-detail">Controller가 Vault 반환 data로 생성 또는 갱신</span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">Mount or env inject</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">Application Pod</strong>
  <span class="sd-detail">Vault SDK 없이 사용</span>
  </div>
  </section>
  <p class="sd-note">Static 값 변경, dynamic lease 갱신, PKI certificate 수명을 Controller가 관리합니다.</p>
</figure>
