<figure class="sd sd--flow" id="vault-secrets-operator-flowchart" aria-labelledby="vault-secrets-operator-flowchart-title">
  <figcaption class="sd-title" id="vault-secrets-operator-flowchart-title">Vault Secrets Operator는 CRD를 감시해 Kubernetes Secret을 동기화한다</figcaption>
  <div class="sd-flow">
    <div class="sd-node sd-node--muted">
      <strong class="sd-label">VaultSecret CRDs</strong>
      <span class="sd-detail">VaultAuth, VaultStaticSecret, VaultDynamicSecret, VaultPKISecret을 사용자가 선언한다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">Watch changes</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Vault Secrets Operator Controller Manager</strong>
      <span class="sd-detail">CRD 변경을 감지하고 Vault 인증, secret 읽기 또는 생성을 조정한다.</span>
    </div>
    <div class="sd-grid">
      <section class="sd-lane">
        <div class="sd-lane-title">Kubernetes cluster</div>
        <div class="sd-flow">
          <div class="sd-arrow"><span class="sd-edge-label">Controller sync branch</span></div>
          <div class="sd-node">
            <strong class="sd-label">Controller to Kubernetes API Server</strong>
            <span class="sd-detail">Controller가 인증 결과와 secret data로 native Secret을 create 또는 update한다.</span>
          </div>
          <div class="sd-arrow"><span class="sd-edge-label">Store</span></div>
          <div class="sd-node">
            <strong class="sd-label">Kubernetes Secret</strong>
            <span class="sd-detail">Application Pod가 읽을 수 있는 Secret object로 저장된다.</span>
          </div>
          <div class="sd-arrow"><span class="sd-edge-label">Mount or env inject</span></div>
          <div class="sd-node sd-node--muted">
            <strong class="sd-label">Application Pod</strong>
            <span class="sd-detail">Vault SDK 없이 Kubernetes Secret을 사용한다.</span>
          </div>
        </div>
      </section>
      <section class="sd-lane">
        <div class="sd-lane-title">HashiCorp Vault</div>
        <div class="sd-flow">
          <div class="sd-arrow"><span class="sd-edge-label">Controller auth branch</span></div>
          <div class="sd-node">
            <strong class="sd-label">Controller to Vault Auth Methods</strong>
            <span class="sd-detail">Kubernetes, AppRole, JWT 중 VaultAuth가 지정한 Auth Method를 사용한다.</span>
          </div>
          <div class="sd-arrow sd-arrow--both"><span class="sd-edge-label">token 요청 / Vault token 반환</span></div>
          <div class="sd-node">
            <strong class="sd-label">Read or Generate request</strong>
            <span class="sd-detail">인증된 Controller가 secret path를 조회하거나 dynamic credential과 certificate를 요청한다.</span>
          </div>
          <div class="sd-arrow"><span class="sd-edge-label">Secret Engine access</span></div>
          <div class="sd-node sd-node--accent">
            <strong class="sd-label">Secret Engines</strong>
            <span class="sd-detail">KV, Transit, PKI, Database, AWS 등이 static data, dynamic credential, certificate를 제공한다.</span>
          </div>
          <div class="sd-arrow sd-arrow--both"><span class="sd-edge-label">secret read or generate / secret data 반환</span></div>
          <div class="sd-node sd-node--muted">
            <strong class="sd-label">Controller receives data</strong>
            <span class="sd-detail">반환된 값과 lease 정보를 사용해 Kubernetes Secret sync를 계속한다.</span>
          </div>
        </div>
      </section>
    </div>
  </div>
  <p class="sd-note">Static secret은 값 변경을 동기화하고 dynamic secret은 lease를 갱신하며 PKI secret은 certificate 수명을 관리한다.</p>
</figure>
