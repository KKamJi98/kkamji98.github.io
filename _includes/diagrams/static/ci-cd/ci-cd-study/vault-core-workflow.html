<figure class="sd sd--flow" id="vault-core-workflow" aria-labelledby="vault-core-workflow-title">
  <figcaption class="sd-title" id="vault-core-workflow-title">Vault 요청은 Authenticate에서 Access까지 정책으로 이어진다</figcaption>
  <section class="sd-lane">
    <div class="sd-lane-title">Client to Vault core workflow</div>
    <div class="sd-flow">
      <div class="sd-node sd-node--muted">
        <strong class="sd-label">Client</strong>
        <span class="sd-detail">사람, 애플리케이션, 시스템이 identity와 credential을 제출한다.</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">identity 제출</span></div>
      <div class="sd-node">
        <strong class="sd-label">1 Authenticate</strong>
        <span class="sd-detail">LDAP, OIDC, Kubernetes, AWS IAM 같은 Auth Method가 신원을 확인한다.</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">로그인 중 Auth Method별 검증</span></div>
      <div class="sd-node">
        <strong class="sd-label">2 Validate</strong>
        <span class="sd-detail">로그인 시 필요한 신원 검증 후 policy가 연결된 client token을 반환한다.</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">이후 token으로 요청할 때마다 인가</span></div>
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">3 Authorize</strong>
        <span class="sd-detail">identity에 연결된 security policy가 요청 path와 허용 동작을 결정한다.</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">허용된 secret path 요청</span></div>
      <div class="sd-node">
        <strong class="sd-label">4 Access</strong>
        <span class="sd-detail">Secret Engine이 KV secret을 조회하거나 dynamic credential을 발급한다. Dynamic secret에는 lease를 등록하지만 KV 조회에는 등록하지 않는다.</span>
      </div>
    </div>
  </section>
  <p class="sd-note">Service token과 dynamic secret은 lease 수명 관리 대상입니다. Audit Device는 대부분의 요청과 응답을 기록하고 expiration manager는 lease 만료와 폐기를 처리합니다.</p>
</figure>
