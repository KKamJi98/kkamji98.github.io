<figure class="sd sd--comparison" id="jenkins-scripted-vs-declarative" aria-labelledby="jenkins-scripted-vs-declarative-title">
  <figcaption class="sd-title" id="jenkins-scripted-vs-declarative-title">Jenkins Scripted와 Declarative Pipeline 구조 비교</figcaption>
  <div class="sd-grid">
    <section class="sd-lane" aria-label="Scripted Pipeline 구조">
      <div class="sd-lane-title">Scripted</div>
      <div class="sd-node sd-node--warning">
        <strong class="sd-label">Node</strong>
        <span class="sd-detail">실행할 agent와 imperative 흐름</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">stage blocks</span></div>
      <div class="sd-stack">
        <div class="sd-band">
          <strong class="sd-band-title">Stage: Build</strong>
          <div class="sd-flow">
            <div class="sd-node"><strong class="sd-label">Step</strong><span class="sd-detail">build 작업</span></div>
            <div class="sd-arrow" aria-hidden="true"></div>
            <div class="sd-node"><strong class="sd-label">Step</strong><span class="sd-detail">추가 작업</span></div>
          </div>
        </div>
        <div class="sd-band">
          <strong class="sd-band-title">Stage: Test</strong>
          <div class="sd-flow">
            <div class="sd-node"><strong class="sd-label">Step</strong><span class="sd-detail">test 작업</span></div>
            <div class="sd-arrow" aria-hidden="true"></div>
            <div class="sd-node"><strong class="sd-label">Step</strong><span class="sd-detail">추가 작업</span></div>
          </div>
        </div>
      </div>
      <p class="sd-note">그림은 node 안에 흐름을 작성한 Scripted 예시입니다. stage block은 선택 사항입니다.</p>
    </section>
    <section class="sd-lane" aria-label="Declarative Pipeline 구조">
      <div class="sd-lane-title">Declarative</div>
      <div class="sd-node sd-node--accent">
        <strong class="sd-label">pipeline</strong>
        <span class="sd-detail">검증 가능한 선언형 root</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">directive와 stages</span></div>
      <div class="sd-stack">
        <div class="sd-band">
          <strong class="sd-band-title">Top-level directives</strong>
          <span class="sd-detail">agent, environment, tools, options, triggers, parameters, libraries</span>
        </div>
        <div class="sd-band">
          <strong class="sd-band-title">stages</strong>
          <div class="sd-node">
            <strong class="sd-label">stage</strong>
            <span class="sd-detail">일반 실행 stage: steps 안에 step DSL</span>
          </div>
        </div>
        <div class="sd-band">
          <strong class="sd-band-title">post</strong>
          <span class="sd-detail">pipeline-level post actions</span>
        </div>
      </div>
      <p class="sd-note">Declarative stage는 steps, stages, parallel, matrix 중 정확히 하나를 포함합니다. steps는 일반 실행 stage의 형태입니다.</p>
    </section>
  </div>
</figure>
