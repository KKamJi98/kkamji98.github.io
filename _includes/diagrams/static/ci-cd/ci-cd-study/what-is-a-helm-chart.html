<figure class="sd sd--flow" id="what-is-a-helm-chart" aria-labelledby="what-is-a-helm-chart-title">
  <figcaption class="sd-title" id="what-is-a-helm-chart-title">Helm Chart는 Kubernetes manifest를 정의하고 패키징해 release로 관리합니다</figcaption>
  <div class="sd-flow">
  <div class="sd-node">
  <strong class="sd-label">Chart files</strong>
  <span class="sd-detail">
  <code>Chart.yaml</code>, <code>values.yaml</code>, <code>templates/</code>, <code>charts/</code>
  </span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">
  <code>helm package</code>: source 보관</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">Chart package (.tgz)</strong>
  <span class="sd-detail">templates와 values를 포함한 버전 artifact; 아직 렌더링하지 않음</span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">
  <code>helm install</code> 또는 <code>helm upgrade</code>: 값 주입과 렌더링</span>
  </div>
  <div class="sd-node sd-node--accent">
  <strong class="sd-label">Kubernetes Release</strong>
  <span class="sd-detail">렌더링된 manifest를 클러스터에 적용</span>
  </div>
  </div>
  <p class="sd-note">로컬 Chart 디렉터리도 직접 설치할 수 있습니다. <code>helm template</code>은 설치 없이 렌더링합니다.</p>
  <section class="sd-band">
  <div class="sd-band-title">Release 관리 기능</div>
  <div class="sd-node">
  <strong class="sd-label">Manage</strong>
  <span class="sd-detail">
  <code>upgrade</code>, <code>rollback</code>, <code>helm test</code>
  </span>
  </div>
  </section>
</figure>
