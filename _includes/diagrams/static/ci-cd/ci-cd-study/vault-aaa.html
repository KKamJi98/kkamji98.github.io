<figure class="sd" id="vault-aaa" aria-labelledby="vault-aaa-title">
  <figcaption class="sd-title" id="vault-aaa-title">Vault 접근 제어의 AAA는 신원 확인, 권한 결정, 감사 추적입니다</figcaption>

  <div class="sd-grid sd-grid--three">
    <div class="sd-node">
      <strong class="sd-label">Authentication (인증)</strong>
      <span class="sd-detail">사용자 또는 workload가 누구인지 확인합니다.</span>
    </div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Authorization (인가)</strong>
      <span class="sd-detail">token과 policy로 path별 capability를 결정합니다.</span>
    </div>
    <div class="sd-node">
      <strong class="sd-label">Accounting / Auditing</strong>
      <span class="sd-detail">audit device가 요청과 응답을 기록해 책임성을 남깁니다.</span>
    </div>
  </div>

  <p class="sd-note">Vault에서는 Authentication이 token을 만들고, Authorization이 허용 범위를 정하며, Accounting이 사후 접근 경로를 증빙합니다.</p>
</figure>
