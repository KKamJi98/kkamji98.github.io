<figure class="sd sd--fhd" id="gitops-principles" aria-labelledby="gitops-principles-title" data-canvas-width="1920" data-canvas-height="1080">
  <figcaption class="sd-title" id="gitops-principles-title">GitOps는 선언, 버전, 자동 pull, 지속 조정의 네 원칙을 함께 지킵니다</figcaption><div class="sd-semantic-source">

  <div class="sd-grid">
    <div class="sd-node">
      <strong class="sd-label">1. Declarative</strong>
      <span class="sd-detail">실행 명령 대신 원하는 상태를 선언합니다.</span>
    </div>
    <div class="sd-node">
      <strong class="sd-label">2. Versioned and Immutable</strong>
      <span class="sd-detail">원하는 상태를 버전과 변경 이력으로 보존합니다.</span>
    </div>
    <div class="sd-node">
      <strong class="sd-label">3. Pulled Automatically</strong>
      <span class="sd-detail">에이전트가 source에서 변경을 자동으로 pull합니다.</span>
    </div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">4. Continuously Reconciled</strong>
      <span class="sd-detail">actual state를 관찰하고 desired state와 계속 맞춥니다.</span>
    </div>
  </div>

  <p class="sd-note">네 원칙이 함께 있어야 Git 저장소의 선언과 Kubernetes 클러스터 상태가 폐쇄 루프로 유지됩니다.</p>
</div>
