<figure class="sd sd--layers" id="sd-ci-cd-study-argocd-architecture-overview" aria-labelledby="sd-title-ci-cd-study-argocd-architecture-overview">
  <figcaption class="sd-title" id="sd-title-ci-cd-study-argocd-architecture-overview">Argo CD가 Git desired state를 여러 Kubernetes Cluster에 배포</figcaption>
  <div class="sd-grid">
  <div class="sd-node">
  <strong class="sd-label">Git repository</strong>
  <span class="sd-detail">search와 guestbook desired state. Webhook은 API Server에 변경 알림</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">User or CI/CD</strong>
  <span class="sd-detail">UI, CLI의 gRPC / REST 요청은 API Server가 수신</span>
  </div>
  </div>
  <section class="sd-band">
  <div class="sd-band-title">Argo CD control plane</div>
  <div class="sd-grid">
  <div class="sd-node">
  <strong class="sd-label">API Server</strong>
  <span class="sd-detail">인증, 상태 조회, Sync/Rollback와 사용자 action 요청</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">Repo Server</strong>
  <span class="sd-detail">Git revision과 path에서 manifest 생성</span>
  </div>
  </div>
  <p class="sd-note">Application Controller가 Repo Server에 manifest를 요청하고 반환된 desired state를 사용합니다.</p>
  <div class="sd-node sd-node--accent">
  <strong class="sd-label">Application Controller</strong>
  <span class="sd-detail">live state와 비교. Sync 시 PreSync, Sync, PostSync hook과 manifest apply 수행</span>
  </div>
  </section>
  <div class="sd-arrow">
  <span class="sd-edge-label">Controller가 선택된 Application destination에 적용</span>
  </div>
  <div class="sd-grid sd-grid--three">
  <div class="sd-node">
  <strong class="sd-label">dev</strong>
  </div>
  <div class="sd-node">
  <strong class="sd-label">staging</strong>
  </div>
  <div class="sd-node">
  <strong class="sd-label">us-west-1</strong>
  </div>
  <div class="sd-node">
  <strong class="sd-label">us-central-1</strong>
  </div>
  <div class="sd-node">
  <strong class="sd-label">us-east-1</strong>
  </div>
  </div>
  <p class="sd-note">Git 변경은 polling 또는 webhook으로 감지합니다. 자동 적용 여부는 sync policy에 따릅니다.</p>
</figure>
