<figure class="sd sd--sequence" id="vault-secrets-operator-sequence-diagram" aria-labelledby="vault-secrets-operator-sequence-diagram-title">
  <figcaption class="sd-title" id="vault-secrets-operator-sequence-diagram-title">Vault Secrets Operator의 secret 동기화 순서</figcaption>
  <section class="sd-lane">
    <div class="sd-lane-title">시간 순서와 메시지 방향</div>
    <div class="sd-flow">
      <div class="sd-node sd-node--muted">
        <div class="sd-detail">1. Apply resource</div>
        <strong class="sd-label">User to Kubernetes API Server</strong>
        <span class="sd-detail">VaultAuth와 VaultStaticSecret, VaultDynamicSecret 또는 VaultPKISecret 리소스를 apply한다.</span>
      </div>
      <div class="sd-arrow">
        <span class="sd-edge-label">다음 단계</span>
      </div>
      <div class="sd-node">
        <div class="sd-detail">2. Watch for changes</div>
        <strong class="sd-label">Kubernetes API watch / Vault Secrets Operator</strong>
        <span class="sd-detail">Operator가 CRD 변경을 watch하고 reconcile 대상으로 선택한다.</span>
      </div>
      <div class="sd-arrow">
        <span class="sd-edge-label">다음 단계</span>
      </div>
      <div class="sd-node">
        <div class="sd-detail">3. Authenticate using VaultAuth</div>
        <strong class="sd-label">Vault Secrets Operator to Vault API</strong>
        <span class="sd-detail">VaultAuth 설정의 Kubernetes, AppRole, JWT 인증으로 token을 요청한다.</span>
      </div>
      <div class="sd-arrow">
        <span class="sd-edge-label">다음 단계</span>
      </div>
      <div class="sd-node sd-node--accent">
        <div class="sd-detail">4. Vault token</div>
        <strong class="sd-label">Vault API to Vault Secrets Operator</strong>
        <span class="sd-detail">Vault token을 반환한다.</span>
      </div>
      <div class="sd-arrow">
        <span class="sd-edge-label">다음 단계</span>
      </div>
      <div class="sd-node">
        <div class="sd-detail">5. Read or Generate Secret</div>
        <strong class="sd-label">Vault Secrets Operator to Vault API</strong>
        <span class="sd-detail">KV, Database, PKI 엔진에서 값을 읽거나 dynamic credential과 certificate를 생성한다.</span>
      </div>
      <div class="sd-arrow">
        <span class="sd-edge-label">다음 단계</span>
      </div>
      <div class="sd-node sd-node--accent">
        <div class="sd-detail">6. Secret data</div>
        <strong class="sd-label">Vault API to Vault Secrets Operator</strong>
        <span class="sd-detail">secret data와 lease 또는 certificate 수명 정보를 반환한다.</span>
      </div>
      <div class="sd-arrow">
        <span class="sd-edge-label">다음 단계</span>
      </div>
      <div class="sd-node">
        <div class="sd-detail">7. Create or Update Kubernetes Secret</div>
        <strong class="sd-label">Vault Secrets Operator to Kubernetes API Server</strong>
        <span class="sd-detail">Operator가 native Kubernetes Secret을 생성하거나 최신 값으로 갱신한다.</span>
      </div>
      <div class="sd-arrow">
        <span class="sd-edge-label">다음 단계</span>
      </div>
      <div class="sd-node">
        <div class="sd-detail">8. Make Secret available</div>
        <strong class="sd-label">Kubernetes API Server to Application Pod</strong>
        <span class="sd-detail">Secret을 volume mount 또는 environment variable로 Pod에 주입한다.</span>
      </div>
      <div class="sd-arrow">
        <span class="sd-edge-label">다음 단계</span>
      </div>
      <div class="sd-node sd-node--muted">
        <div class="sd-detail">9. Consume Secret</div>
        <strong class="sd-label">Application Pod</strong>
        <span class="sd-detail">애플리케이션이 동기화된 Kubernetes Secret을 사용한다.</span>
      </div>
    </div>
  </section>
  <p class="sd-note">Operator가 Vault token과 lease 상태를 관리하므로 애플리케이션은 Vault API 호출을 직접 구현하지 않는다.</p>
</figure>
