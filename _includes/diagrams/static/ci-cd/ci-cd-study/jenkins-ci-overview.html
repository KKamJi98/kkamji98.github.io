<figure class="sd sd--flow" id="jenkins-ci-overview" aria-labelledby="jenkins-ci-overview-title">
  <figcaption class="sd-title" id="jenkins-ci-overview-title">Jenkins 이미지 빌드와 Kubernetes 수동 배포</figcaption>
  <div class="sd-flow">
    <div class="sd-node">
      <strong class="sd-label">Developer</strong>
      <span class="sd-detail">source code를 Git 저장소에 push</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">push</span></div>
    <div class="sd-node">
      <strong class="sd-label">Git source repository</strong>
      <span class="sd-detail">Jenkins가 가져올 source 보관</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">수동 빌드 실행 후 checkout</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">CI server (Jenkins)</strong>
      <span class="sd-detail">source checkout 후 container image를 build</span>
    </div>
  </div>
  <div class="sd-grid">
    <section class="sd-lane" aria-label="이미지 저장 경로">
      <div class="sd-lane-title">Image artifact</div>
      <div class="sd-arrow"><span class="sd-edge-label">Jenkins -&gt; Image artifact: image push</span></div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">Container image build</strong>
          <span class="sd-detail">Jenkins가 애플리케이션을 이미지로 패키징</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">image push</span></div>
        <div class="sd-node">
          <strong class="sd-label">Container image registry</strong>
          <span class="sd-detail">배포할 버전 이미지를 보관</span>
        </div>
      </div>
    </section>
    <section class="sd-lane" aria-label="실행 서버 배포 경로">
      <div class="sd-lane-title">Runtime deployment</div>
      <div class="sd-arrow"><span class="sd-edge-label">이미지 push 후 운영자가 수동 배포</span></div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">Operator: kubectl set image</strong>
          <span class="sd-detail">Deployment의 이미지 태그를 0.0.2로 변경</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">Deployment rollout</span></div>
        <div class="sd-node">
          <strong class="sd-label">Kubernetes Deployment</strong>
          <span class="sd-detail">새 이미지의 Pod로 순차 교체</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">Registry -&gt; node runtime: image pull</span></div>
        <div class="sd-node sd-node--muted">
          <strong class="sd-label">Running Pod</strong>
          <span class="sd-detail">registry의 이미지를 받아 실행</span>
        </div>
      </div>
    </section>
  </div>
  <p class="sd-note">이 단계에서는 Jenkins 빌드를 수동 실행합니다. Jenkins는 이미지를 build/push하고, 운영자가 kubectl로 Deployment를 갱신합니다.</p>
</figure>
