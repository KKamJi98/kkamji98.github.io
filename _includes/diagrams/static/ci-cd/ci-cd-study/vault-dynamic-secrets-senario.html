<div class="sd-node"><strong class="sd-label">Vault Namespace / Vault</strong><span class="sd-detail">role 요청마다 짧은 TTL의 username과 password를 생성합니다.</span></div>

<section class="sd-lane"><div class="sd-lane-title">app Namespace</div>
<div class="sd-flow">
<div class="sd-node"><strong class="sd-label">secretkv</strong><span class="sd-detail">Kubernetes Secret destination; KV static secret 실습</span></div>
<div class="sd-arrow"><span class="sd-edge-label">Secret mount 또는 env 주입</span></div>
