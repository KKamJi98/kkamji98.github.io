<figure class="sd sd--flow" id="vault-dynamic-secrets-senario" aria-labelledby="vault-dynamic-secrets-senario-title">
  <figcaption class="sd-title" id="vault-dynamic-secrets-senario-title">Dynamic Secret은 Vault가 발급하고 VSO가 Kubernetes Secret으로 동기화합니다</figcaption>

  <div class="sd-flow">
    <div class="sd-node sd-node--muted">
      <strong class="sd-label">Postgres Namespace</strong>
      <span class="sd-detail">Postgres가 임시 계정이 연결될 대상입니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">Database Secrets Engine 대상</span></div>
    <div class="sd-node">
      <strong class="sd-label">Vault Namespace / Vault</strong>
      <span class="sd-detail">role 요청마다 짧은 TTL의 username과 password를 생성합니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">VaultAuth 로그인과 VaultDynamicSecret 조회</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Operator Namespace / Vault Secrets Operator</strong>
      <span class="sd-detail">Vault 응답을 대상 namespace의 Secret으로 반영합니다.</span>
    </div>
  </div>

  <div class="sd-grid">
    <section class="sd-lane">
      <div class="sd-lane-title">app Namespace</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">App</strong>
          <span class="sd-detail">애플리케이션 workload</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">Secret 동기화</span></div>
        <div class="sd-node">
          <strong class="sd-label">secretkv</strong>
          <span class="sd-detail">Kubernetes Secret destination</span>
        </div>
      </div>
    </section>
    <section class="sd-lane">
      <div class="sd-lane-title">demo-ns Namespace</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">vso-db-demo</strong>
          <span class="sd-detail">Postgres 자격증명을 사용하는 workload</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">Secret mount</span></div>
        <div class="sd-node">
          <strong class="sd-label">vso-db-demo Secret</strong>
          <span class="sd-detail">username과 password를 Pod에 전달</span>
        </div>
      </div>
    </section>
  </div>

  <p class="sd-note">TTL 10분의 lease를 67% 지점에서 갱신하면 Vault가 계정을 교체하고, VSO가 Secret을 갱신한 뒤 workload rollout을 유도합니다.</p>
</figure>
