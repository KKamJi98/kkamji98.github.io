<figure class="sd sd--flow" id="jenkins-ci-workflow" aria-labelledby="jenkins-ci-workflow-title">
  <figcaption class="sd-title" id="jenkins-ci-workflow-title">Jenkins CI와 GitOps 확장 설계</figcaption>
  <div class="sd-flow">
    <div class="sd-node">
      <strong class="sd-label">개발팀 Repo</strong>
      <span class="sd-detail">애플리케이션 source code</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">source checkout</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">CI server (Jenkins)</strong>
      <span class="sd-detail">실습 Jenkinsfile: source checkout과 image build/push</span>
    </div>
  </div>
  <div class="sd-grid">
    <section class="sd-lane" aria-label="컨테이너 이미지 경로">
      <div class="sd-lane-title">Container image path</div>
      <div class="sd-arrow"><span class="sd-edge-label">CI server (Jenkins) -&gt; Container image registry: image push</span></div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">Build container image</strong>
          <span class="sd-detail">CI 결과물을 배포 가능한 이미지로 생성</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">이미지 업로드</span></div>
        <div class="sd-node">
          <strong class="sd-label">Container image registry</strong>
          <span class="sd-detail">Kubernetes가 가져갈 이미지 저장소</span>
        </div>
      </div>
    </section>
    <section class="sd-lane" aria-label="GitOps 배포 경로">
      <div class="sd-lane-title">GitOps 확장 예시 (실습 미구현)</div>
      <div class="sd-arrow"><span class="sd-edge-label">별도 manifest-update 자동화를 추가한 경우</span></div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">DevOps팀 Repo</strong>
          <span class="sd-detail">Kubernetes manifest 변경을 보관</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">manifest 감시</span></div>
        <div class="sd-node">
          <strong class="sd-label">CD server (Argo CD)</strong>
          <span class="sd-detail">Repo의 desired state를 동기화</span>
        </div>
        <div class="sd-arrow">
          <span class="sd-edge-label">Argo CD -&gt; K8S: sync (삭제는 prune 설정 시)</span>
          <span class="sd-edge-label">Container image registry -&gt; K8S: image pull</span>
        </div>
        <div class="sd-node sd-node--muted">
          <strong class="sd-label">K8S (kind)</strong>
          <span class="sd-detail">manifest를 적용하고 registry에서 image를 pull</span>
        </div>
      </div>
    </section>
  </div>
  <p class="sd-note">본문 실습은 image push 후 운영자가 kubectl set image로 0.0.3을 적용합니다. 오른쪽 GitOps 경로는 별도 확장 설계이며, 제시된 Jenkinsfile에는 manifest 갱신이나 Argo CD 연동이 없습니다.</p>
</figure>
