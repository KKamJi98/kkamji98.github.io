<figure class="sd sd--layers sd--sequence" id="sd-ci-cd-study-argo-rollouts-canary-deployment-strategies" aria-labelledby="sd-title-ci-cd-study-argo-rollouts-canary-deployment-strategies">
  <figcaption class="sd-title" id="sd-title-ci-cd-study-argo-rollouts-canary-deployment-strategies">Canary 배포는 새 버전의 traffic weight를 단계적으로 높인다</figcaption>

            <span class="sd-detail">100% traffic</span>
          </div>

      </section>
      <section class="sd-band" aria-labelledby="sd-ci-cd-study-argo-canary-ten-title">
        <div class="sd-band-title" id="sd-ci-cd-study-argo-canary-ten-title">2. New version used by 10%</div>

          <article class="sd-node">

          <article class="sd-node sd-node--accent">
