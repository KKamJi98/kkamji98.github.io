<figure class="sd sd--flow" id="vault-static-secrets-senario" aria-labelledby="vault-static-secrets-senario-title">
  <figcaption class="sd-title" id="vault-static-secrets-senario-title">Static Secret은 Vault의 KV 값을 VSO가 app namespace로 주기적으로 복사합니다</figcaption>

  <div class="sd-flow">
    <div class="sd-node">
      <strong class="sd-label">Vault Namespace / Vault</strong>
      <span class="sd-detail">KV v2 <code>webapp/config</code>에 고정 secret을 저장합니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">VaultAuth로 인증</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Operator Namespace / Vault Secrets Operator</strong>
      <span class="sd-detail"><code>VaultStaticSecret</code> CRD로 Vault 값을 조회합니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">Kubernetes Secret 생성 또는 갱신</span></div>
    <div class="sd-node">
      <strong class="sd-label">App Namespace / secretkv</strong>
      <span class="sd-detail">VSO가 만든 Kubernetes Secret destination</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">Secret mount</span></div>
    <div class="sd-node sd-node--muted">
      <strong class="sd-label">Pod / App</strong>
      <span class="sd-detail">애플리케이션이 namespace Secret을 사용합니다.</span>
    </div>
  </div>

  <p class="sd-note"><code>refreshAfter: 30s</code> 주기로 Vault를 다시 읽어 Kubernetes Secret을 최신 값으로 유지합니다. Kubernetes Auth에서는 TokenReview로 ServiceAccount token을 검증합니다.</p>
</figure>
