<figure class="sd sd--layers" id="virtualization-model" aria-labelledby="virtualization-model-title">
  <figcaption class="sd-title" id="virtualization-model-title">Hypervisor가 하나의 physical machine을 여러 VM으로 나눕니다</figcaption>
  <p class="sd-note">각 guest가 자신의 kernel을 가지므로 virtual machine은 container와 다른 격리 단위를 제공합니다.</p>

  <div class="sd-stack" aria-label="virtualization model layers">
    <div class="sd-band">
      <strong class="sd-band-title">Application</strong>
      <span class="sd-detail">guest operating system 안에서 실행됩니다.</span>
    </div>

    <div class="sd-band">
      <strong class="sd-band-title">Guest operating system</strong>
      <span class="sd-detail">각 VM이 자기 kernel을 가집니다.</span>
    </div>

    <div class="sd-band">
      <strong class="sd-band-title">Virtual machine</strong>
      <span class="sd-detail">virtual CPU, memory, disk와 NIC를 제공합니다.</span>
    </div>

    <div class="sd-band sd-band--accent">
      <strong class="sd-band-title">Hypervisor</strong>
      <span class="sd-detail">여러 guest를 schedule하고 서로 격리합니다.</span>
    </div>

    <div class="sd-band sd-band--muted">
      <strong class="sd-band-title">Physical hardware</strong>
      <span class="sd-detail">CPU, memory, storage와 network의 실제 자원입니다.</span>
    </div>
  </div>
</figure>
