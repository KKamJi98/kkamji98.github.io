<figure class="sd sd--flow" id="log-monitoring" aria-labelledby="log-monitoring-title">
  <figcaption class="sd-title" id="log-monitoring-title">CloudWatch Logs Subscription Filter가 Lambda 로그를 ELK로 모읍니다</figcaption>
  <p class="sd-note">여러 Lambda의 Log Group을 하나의 forwarding Lambda로 수렴시킨 뒤 Logstash HTTP input <code>5044</code>로 전달합니다.</p>

  <div class="sd-flow">
    <div class="sd-node sd-node--muted">
      <strong class="sd-label">Lambda functions x4</strong>
      <span class="sd-detail">각 함수가 실행 로그를 남깁니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">function별 log stream</span></div>
    <div class="sd-node">
      <strong class="sd-label">CloudWatch Logs Log Groups</strong>
      <span class="sd-detail">Lambda별 그룹에 로그가 분산 저장됩니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">Subscription Filter</span></div>
    <div class="sd-node">
      <strong class="sd-label">Log forwarding Lambda</strong>
      <span class="sd-detail">구독 payload를 읽고 필요한 로그를 필터링합니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">HTTP input :5044</span></div>
    <div class="sd-node">
      <strong class="sd-label">Logstash</strong>
      <span class="sd-detail">정제된 event를 수신해 pipeline으로 전달합니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">index and store</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Elasticsearch</strong>
      <span class="sd-detail">중앙 검색용 로그 index를 보관합니다.</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">dashboard query</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Kibana</strong>
      <span class="sd-detail">여러 Lambda 로그를 한 화면에서 시각화합니다.</span>
    </div>
  </div>
</figure>
