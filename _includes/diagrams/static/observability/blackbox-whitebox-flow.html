<figure class="sd sd--flow" id="sd-observability-blackbox-whitebox-flow" aria-labelledby="sd-title-observability-blackbox-whitebox-flow">
  <figcaption class="sd-title" id="sd-title-observability-blackbox-whitebox-flow">Blackbox는 사용자 증상을 알리고 Whitebox는 원인을 좁힌다</figcaption>
  <div class="sd-flow">
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">User or synthetic check</strong>
      <span class="sd-detail">서비스 바깥에서 사용자 여정을 확인</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">외부 결과 측정</span></div>
    <div class="sd-node sd-node--warning">
      <strong class="sd-label">Blackbox symptom</strong>
      <span class="sd-detail">latency, error rate, availability</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">사용자 영향에 page</span></div>
    <div class="sd-node">
      <strong class="sd-label">Symptom alert</strong>
      <span class="sd-detail">원인보다 먼저 실제 영향에 반응</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">내부 신호로 조사</span></div>
    <div class="sd-node">
      <strong class="sd-label">Whitebox telemetry</strong>
      <span class="sd-detail">서비스 안에서 수집한 logs, metrics, traces</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">같은 incident timeline에서 비교</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Recovery decision</strong>
      <span class="sd-detail">user journey SLI와 내부 신호로 복구 조치 선택</span>
    </div>
  </div>
  <p class="sd-note">증상과 원인은 관측하는 계층에 따라 달라집니다. Blackbox 경보로 사용자 영향을 확인하고 Whitebox 신호로 조사 범위를 좁힙니다.</p>
</figure>
