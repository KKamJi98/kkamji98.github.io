  <figcaption class="sd-title" id="sd-title-observability-monitoring-observability-flow">Monitoring은 threshold를 알리고 Observability는 이유를 묻게 한다</figcaption><div class="sd-semantic-source">
  <div class="sd-flow">
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Monitoring signal</strong>
      <span class="sd-detail">이미 정한 metric이 threshold를 넘음</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">운영자가 처음 보는 신호</span></div>

      <span class="sd-detail">조건을 알리고 현황을 보여줌</span>

    <div class="sd-arrow"><span class="sd-edge-label">추가 신호 조회</span></div>

    </div>
    <div class="sd-arrow"><span class="sd-edge-label">상관관계와 원인 조사</span></div>
    <div class="sd-node">
      <strong class="sd-label">Investigation</strong>

    </div>
    <div class="sd-arrow"><span class="sd-edge-label">조치 후 기준 갱신</span></div>
    <div class="sd-node sd-node--accent">

    </div>
  </div>
  <p class="sd-note">Monitoring은 선택한 조건을 계속 측정하는 운영 활동입니다. Observability는 외부 신호로 새로운 질문에 답할 수 있도록 시스템을 설계하는 성질입니다.</p>
