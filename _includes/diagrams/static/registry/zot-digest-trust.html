<figure class="sd sd--flow sd--fhd" id="sd-zot-digest" aria-labelledby="sd-zot-digest-title" data-canvas-width="1920" data-canvas-height="1080">
  <figcaption class="sd-title" id="sd-zot-digest-title">PR job은 tag가 아니라 main이 기록한 digest로만 CI 이미지를 받습니다</figcaption><div class="sd-semantic-source">
  <div class="sd-grid">
    <section class="sd-lane" id="zd-github">
      <div class="sd-lane-title" id="zd-github-title">GitHub Actions</div>
      <div class="sd-node" id="zd-main"><strong class="sd-label">main: ci-image.yml</strong><span class="sd-detail">CI 이미지를 직접 빌드<br>실행마다 고유한 tag로 push</span></div>
      <div class="sd-node sd-node--accent" id="zd-cache"><strong class="sd-label">Actions cache, main 범위</strong><span class="sd-detail">main이 저장한 digest<br>PR은 읽기만 가능</span></div>
      <div class="sd-node" id="zd-pr"><strong class="sd-label">PR job</strong><span class="sd-detail">cache에서 digest 복원<br>이미지@sha256 형식으로만 pull</span></div>
    </section>
    <section class="sd-lane" id="zd-zot">
      <div class="sd-lane-title" id="zd-zot-title">zot ci/**, 익명 read와 create</div>
      <div class="sd-node" id="zd-tag"><strong class="sd-label">ci/이미지:실행별 tag</strong><span class="sd-detail">같은 tag로 다시 push하면 거부<br>update와 delete 권한 없음</span></div>
      <div class="sd-node sd-node--warning" id="zd-squat"><strong class="sd-label">PR job도 push할 수 있음</strong><span class="sd-detail">예측한 tag를 먼저 만들면 main이 덮어쓸 수 없음<br>그래서 tag는 신뢰하지 않음</span></div>
      <div class="sd-node" id="zd-digest"><strong class="sd-label">ci/이미지@sha256</strong><span class="sd-detail">digest가 같으면 내용도 같음<br>Docker가 manifest와 layer를 검증</span></div>
    </section>
  </div>
  <div class="sd-arrow" id="zd-push" data-from="zd-main" data-to="zd-tag" aria-label="빌드한 이미지를 고유 tag로 push"></div>
  <p class="sd-note" id="zd-push-note">1. 빌드 후 push</p>
  <div class="sd-arrow" id="zd-save" data-from="zd-main" data-to="zd-cache" aria-label="push한 이미지의 digest를 main 범위 cache에 저장"></div>
  <p class="sd-note" id="zd-save-note">2. digest 저장</p>
  <div class="sd-arrow" id="zd-restore" data-from="zd-cache" data-to="zd-pr" aria-label="PR job이 main 범위 cache에서 digest를 읽음"></div>
  <p class="sd-note" id="zd-restore-note">3. digest 복원</p>
  <div class="sd-arrow" id="zd-pull" data-from="zd-pr" data-to="zd-digest" aria-label="digest로 이미지를 pull"></div>
  <p class="sd-note" id="zd-pull-note">4. digest로 pull</p>
  <p class="sd-note" id="zd-fallback">digest가 없거나 pull이 실패하면 약 0.3초 안에 로컬 빌드로 전환</p>
  <p class="sd-note" id="zd-result">첫 PR run의 이미지 단계: job당 102초(이전 66건 중앙값)에서 12~13초</p>
</div>
