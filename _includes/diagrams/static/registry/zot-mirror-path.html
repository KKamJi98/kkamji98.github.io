  <figcaption class="sd-title" id="sd-zot-mirror-title">runner는 클러스터 안의 zot에서 받고, zot이 실패하면 Docker Hub로 직접 갑니다</figcaption><div class="sd-semantic-source">
  <div class="sd-grid">
    <section class="sd-lane" id="zm-runner-ns">
      <div class="sd-lane-title" id="zm-runner-ns-title">ci-full namespace</div>
      <p class="sd-note" id="zm-runner-policy">사설 대역 중 zot 5000 포트만 허용</p>
      <div class="sd-node" id="zm-dockerd"><strong class="sd-label">Runner Pod</strong><span class="sd-detail">rootless dockerd<br>--registry-mirror 설정</span></div>
    </section>
    <section class="sd-lane" id="zm-cache-ns">
      <div class="sd-lane-title" id="zm-cache-ns-title">ci-cache namespace</div>
      <p class="sd-note" id="zm-cache-policy">DNS와 Docker Hub로만 나감</p>
      <div class="sd-node sd-node--accent" id="zm-zot"><strong class="sd-label">zot v2.1.22</strong><span class="sd-detail">library/** 요청 시 mirror<br>emptyDir 30Gi 상한</span></div>
    </section>
    <section class="sd-lane" id="zm-internet">
      <div class="sd-lane-title" id="zm-internet-title">인터넷</div>
      <p class="sd-note" id="zm-internet-policy">FQDN 허용 목록에 CDN 포함</p>
      <div class="sd-node" id="zm-hub"><strong class="sd-label">Docker Hub</strong><span class="sd-detail">registry-1.docker.io<br>blob은 CDN으로 redirect</span></div>
    </section>
  </div>
  <div class="sd-arrow" id="zm-pull" data-from="zm-dockerd" data-to="zm-zot" aria-label="mirror로 image 요청, 클러스터 내부 HTTP 5000"></div>
  <p class="sd-note" id="zm-pull-note">image 요청</p>
  <div class="sd-arrow" id="zm-sync" data-from="zm-zot" data-to="zm-hub" aria-label="처음 받는 image만 Docker Hub에서 받아 저장"></div>
  <p class="sd-note" id="zm-sync-note">cold 요청만</p>
  <div class="sd-arrow" id="zm-fallback" data-from="zm-dockerd" data-to="zm-hub" aria-label="mirror가 실패하면 Docker Hub에서 직접 pull"></div>
  <p class="sd-note" id="zm-fallback-note">zot에 닿지 못하면 Docker Hub에서 직접 받음(fail-open)</p>
  <p class="sd-note" id="zm-failure-title">mirror 실패 방식별 docker pull 시간(같은 버전 Docker로 측정)</p>
  <div class="sd-node" id="zm-refused"><strong class="sd-label">연결 거부: 3.1초</strong><span class="sd-detail">registry Pod 없이 Service만 남음</span></div>
  <div class="sd-node" id="zm-dns"><strong class="sd-label">이름 해석 실패: 3.3초</strong><span class="sd-detail">registry namespace가 없음</span></div>
  <div class="sd-node sd-node--warning" id="zm-drop"><strong class="sd-label">패킷 drop: 3분 34초</strong><span class="sd-detail">network policy가 막음</span></div>
  <p class="sd-note" id="zm-warm">warm mirror에서 338MB image pull: 50.0초, 38.8초에서 7.2초, 8.5초</p>
</div>
