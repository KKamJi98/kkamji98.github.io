<figure class="sd sd--sequence" id="jvm-08-g1gc-regions" aria-labelledby="sd-title-jvm-08-g1gc-regions">
  <figcaption class="sd-title" id="sd-title-jvm-08-g1gc-regions">G1 Heap은 같은 크기 region에 역할을 배정합니다</figcaption>

  <section class="sd-lane">
    <div class="sd-lane-title">Heap: 동일한 크기의 regions</div>
<table class="sd-table sd-quality-table" aria-label="동일 크기 heap region의 한 시점 예시"><tbody><tr><td>E</td><td>E</td><td>S</td><td>O</td><td>O</td></tr><tr><td>O</td><td>E</td><td>H</td><td>O</td><td>E</td></tr><tr><td>S</td><td>O</td><td>E</td><td>E</td><td>O</td></tr><tr><td>O</td><td>H</td><td>O</td><td>S</td><td>E</td></tr></tbody></table><p class="sd-note">E: Eden, S: Survivor, O: Old, H: Humongous. 새 객체는 Eden, Young 생존 객체는 Survivor, 승격 객체는 Old에 배치됩니다. Humongous는 region 절반보다 큰 객체입니다.</p>    <p class="sd-note">세대는 연속된 주소 범위가 아니라 여러 region에 부여된 역할입니다. 한 시점의 region 역할은 GC 사이클에 따라 바뀔 수 있습니다.</p>
  </section>

  <div class="sd-arrow"><span class="sd-edge-label">G1 collection cycle</span></div>
  <div class="sd-flow">
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Young collection</strong>
      <span class="sd-detail">Eden과 Survivor live 객체를 evacuation</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">IHOP에서 시작</span></div>
    <div class="sd-node">
      <strong class="sd-label">Concurrent marking</strong>
      <span class="sd-detail">Old region의 live 객체를 앱과 함께 표시</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">회수 효율이 높은 Old 선택</span></div>
    <div class="sd-node">
      <strong class="sd-label">Mixed collection</strong>
      <span class="sd-detail">Young과 일부 Old를 점진적으로 회수</span>
    </div>
  </div>

  <p class="sd-note">G1은 selected region의 live 객체를 다른 region으로 복사해 evacuation과 compaction을 함께 수행합니다.</p>
</figure>
