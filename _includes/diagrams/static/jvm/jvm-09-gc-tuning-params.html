<figure class="sd sd--comparison" id="jvm-09-gc-tuning-params" aria-labelledby="sd-title-jvm-09-gc-tuning-params">
  <figcaption class="sd-title" id="sd-title-jvm-09-gc-tuning-params">G1 튜닝 손잡이: pause 목표와 제한을 구분합니다</figcaption>

  <div class="sd-grid">
    <section class="sd-lane">
      <div class="sd-lane-title">목표</div>
      <div class="sd-node sd-node--accent">
        <strong class="sd-label"><code>-XX:MaxGCPauseMillis</code> (기본 200)</strong>
        <span class="sd-detail">pause 의도입니다. G1이 목표에 맞춰 Young 크기를 조절합니다.</span>
      </div>
      <p class="sd-note">G1의 pause-time 제어는 Young generation 크기를 주요 수단으로 사용합니다.</p>
    </section>

    <section class="sd-lane">
      <div class="sd-lane-title">제한, trigger와 evidence</div>
      <div class="sd-grid">
        <div class="sd-node">
          <strong class="sd-label"><code>-Xms</code> and <code>-Xmx</code></strong>
          <span class="sd-detail">초기와 최대 Heap 크기</span>
        </div>
        <div class="sd-node sd-node--warning">
          <strong class="sd-label"><code>-XX:MaxNewSize</code> or <code>-Xmn</code></strong>
          <span class="sd-detail">Young 상한, 고정하면 pause 자동 제어를 사실상 끔</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label"><code>-XX:InitiatingHeapOccupancyPercent</code></strong>
          <span class="sd-detail">concurrent marking 시작 기준, adaptive가 기본</span>
        </div>
        <div class="sd-node sd-node--muted">
          <strong class="sd-label"><code>-Xlog:gc*</code> and JFR</strong>
          <span class="sd-detail">각 설정의 실제 pause와 점유를 관찰</span>
        </div>
      </div>
      <p class="sd-note">Adaptive IHOP가 켜져 있으면 IHOP 값은 초기 추정값입니다. 고정 임계치가 필요하면 adaptive 동작을 별도로 끄는 선택이 필요합니다.</p>
    </section>
  </div>
</figure>
