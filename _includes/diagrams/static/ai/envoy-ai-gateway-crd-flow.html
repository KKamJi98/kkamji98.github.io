  <figcaption class="sd-title" id="envoy-ai-gateway-crd-flow-title">Envoy 요청 경로와 외부 처리</figcaption>
<div class="sd-v2-rail"><div class="sd-node"><strong class="sd-label">Client</strong><span class="sd-detail">Gateway endpoint로 요청</span></div><div class="sd-v2-link" aria-hidden="true"></div><div class="sd-node sd-node--accent"><strong class="sd-label">Envoy Proxy</strong><span class="sd-detail">모델에 맞는 upstream 선택</span></div><div class="sd-v2-link" aria-hidden="true"></div><div class="sd-node"><strong class="sd-label">LLM provider</strong><span class="sd-detail">지원되는 모델 API</span></div></div><div class="sd-v2-adjunct"><div class="sd-v2-relation"><span class="sd-edge-label">gRPC 처리 메시지 / 결과</span></div><div class="sd-node"><strong class="sd-label">AI Gateway external processor</strong><span class="sd-detail">API 변환, 토큰 사용량 추출</span></div></div><p class="sd-note">external processor는 Proxy와 통신한다. Provider 호출 홉이 아니다.</p><section class="sd-v2-config" aria-label="요청 경로와 별개인 설정 반영"><div class="sd-v2-section-title">설정 반영: 요청 홉과 별개</div><div class="sd-v2-rail"><div class="sd-node"><strong class="sd-label">CRD와 정책</strong><span class="sd-detail">AIGatewayRoute<br>BackendSecurityPolicy<br>사용량 제한 설정</span></div><div class="sd-v2-link" aria-hidden="true"></div><div class="sd-node"><strong class="sd-label">Controllers</strong><span class="sd-detail">AI Gateway /<br>Envoy Gateway</span></div><div class="sd-v2-link" aria-hidden="true"></div><div class="sd-node"><strong class="sd-label">런타임 구성</strong><span class="sd-detail">Proxy 라우팅/필터<br>external processor 처리 설정</span></div></div><p class="sd-note">선언을 감시하고 구성으로 변환하여 두 런타임에 각각 반영한다. Controller별 내부 변환 단계는 생략했다.</p></section>
