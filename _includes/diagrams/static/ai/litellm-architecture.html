<div class="sd-v2-rail"><div class="sd-node"><strong class="sd-label">Application</strong><span class="sd-detail">가상 키로 추론 요청</span></div><div class="sd-v2-link" aria-hidden="true"></div><div class="sd-node sd-node--accent"><strong class="sd-label">LiteLLM Proxy</strong><span class="sd-detail">인증과 예산 검사<br>모델 선택</span></div><div class="sd-v2-link" aria-hidden="true"></div><div class="sd-node"><strong class="sd-label">Providers</strong><span class="sd-detail">OpenAI<br>AWS Bedrock 등</span></div></div><div class="sd-v2-adjunct"><div class="sd-v2-relation"><span class="sd-edge-label">관리 레코드 조회 / 저장</span></div><div class="sd-node"><strong class="sd-label">PostgreSQL</strong><span class="sd-detail">가상 키, 예산, spend 기록</span></div></div><aside class="sd-v2-setup"><strong class="sd-label">배포 시점 설정</strong><span class="sd-detail">migration Job: DB 스키마 갱신<br>모델/라우팅 YAML: Proxy 설정<br>ESO 관리 Secret: Proxy 환경변수로 주입</span></aside><p class="sd-note">매 요청의 직접 DB 조회나 강한 일관성을 뜻하지 않는다. 모든 설정이 DB에 저장되는 것은 아니다. 같은 변수는 명시적 env가 envFrom보다 우선하며 변경은 새 Pod에 반영한다.</p><p class="sd-note">Provider 경로는 일반 구조다. 기록된 호출 실험은 mock 모델이다.</p>
</div>
