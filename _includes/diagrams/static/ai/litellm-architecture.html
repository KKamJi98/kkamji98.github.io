<figure class="sd sd--flow" id="litellm-architecture" aria-labelledby="litellm-architecture-title">
  <figcaption class="sd-title" id="litellm-architecture-title">LiteLLM의 요청, 저장, 배포 경계</figcaption>
  <div class="sd-stack">
    <section class="sd-band" aria-label="런타임 요청: 일반 provider 경로">
      <div class="sd-band-title">런타임 요청: 일반 provider 경로</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">Application</strong>
          <span class="sd-detail">가상 키로 추론 요청</span>
        </div>
        <div class="sd-arrow"></div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">LiteLLM Proxy</strong>
          <span class="sd-detail">인증과 예산 검사 후 모델 선택</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">검사를 통과한 요청 전달</span></div>
        <div class="sd-node">
          <strong class="sd-label">Providers</strong>
          <span class="sd-detail">OpenAI, AWS Bedrock 등</span>
        </div>
      </div>
    </section>
    <section class="sd-band" aria-label="키와 사용 내역 저장">
      <div class="sd-band-title">키와 사용 내역 저장</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">LiteLLM Proxy</strong>
          <span class="sd-detail">키 관리, 예산 판정, 사용 내역 기록</span>
        </div>
        <div class="sd-arrow sd-arrow--both"><span class="sd-edge-label">관리 레코드 조회와 저장</span></div>
        <div class="sd-node">
          <strong class="sd-label">PostgreSQL</strong>
          <span class="sd-detail">발급된 가상 키, 예산, spend 기록</span>
        </div>
      </div><p class="sd-note">모든 설정의 저장소는 아니다. 매 요청의 직접 DB 조회나 강한 일관성을 뜻하지 않는다.</p>
    </section>
    <section class="sd-band" aria-label="배포 시점 설정">
      <div class="sd-band-title">배포 시점 설정</div>
      <div class="sd-stack">
        <div class="sd-node">
          <strong class="sd-label">migration Job</strong>
          <span class="sd-detail">PostgreSQL 스키마 갱신</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">모델/라우팅 YAML</strong>
          <span class="sd-detail">Proxy에 모델 목록과 라우팅 설정 제공</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">ESO 관리 Secret</strong>
          <span class="sd-detail">Proxy의 환경변수로 참조하여 주입</span>
        </div>
      </div><p class="sd-note">같은 변수는 명시적 env가 envFrom보다 우선한다. Secret 참조를 맞추고 새 Pod에 반영한다.</p>
    </section>
  </div><p class="sd-note">기록된 호출 실험은 mock 모델이다. 위 provider 경로는 일반 구조이며 유료 호출 관측을 뜻하지 않는다.</p>
</figure>
