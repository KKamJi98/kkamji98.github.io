<figure class="sd sd--flow" id="rag-06-latency-eval" aria-labelledby="rag-06-latency-eval-title">
  <figcaption class="sd-title" id="rag-06-latency-eval-title">Semantic cache hit와 RAG latency budget</figcaption>
  <div class="sd-flow">
    <div class="sd-node">
      <strong class="sd-label">User query</strong>
      <span class="sd-detail">한 번의 질문이 cache부터 통과</span>
    </div>
    <div class="sd-arrow"></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">Semantic cache</strong>
      <span class="sd-detail">유사 query의 결과를 재사용할지 판정</span>
    </div>
  </div>
  <div class="sd-grid">
    <section class="sd-lane" aria-label="Cache hit">
      <div class="sd-lane-title">Cache hit</div>
      <div class="sd-node">
        <strong class="sd-label">Bypass retrieval and generation</strong>
        <span class="sd-detail">cache 결과를 공통 Answer로 즉시 전달</span>
      </div>
    </section>
    <section class="sd-lane" aria-label="Cache miss">
      <div class="sd-lane-title">Cache miss</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">Retrieval (ANN)</strong>
          <span class="sd-detail">t_retrieve</span>
        </div>
        <div class="sd-arrow"></div>
        <div class="sd-node">
          <strong class="sd-label">Reranking</strong>
          <span class="sd-detail">t_rerank</span>
        </div>
        <div class="sd-arrow"></div>
        <div class="sd-node">
          <strong class="sd-label">LLM generation</strong>
          <span class="sd-detail">t_generate, usually the largest</span>
        </div>
      </div>
    </section>
  </div>
  <div class="sd-arrow"><span class="sd-edge-label">hit와 miss가 공통 Answer로 재결합</span></div>
  <div class="sd-node">
    <strong class="sd-label">Answer</strong>
    <span class="sd-detail">cache 결과 또는 누적된 생성 결과를 반환</span>
  </div>
  <p class="sd-note"><strong>Latency budget</strong>: t_retrieve + t_rerank + t_generate를 평균이 아니라 p99 기준으로 관리합니다.</p>
  <div class="sd-arrow"><span class="sd-edge-label">Answer 품질을 같은 평가셋에서 확인</span></div>
  <div class="sd-node">
    <strong class="sd-label">Ragas evaluation</strong>
    <span class="sd-detail">faithfulness와 context precision으로 품질을 측정</span>
  </div>
  <p class="sd-note">hit는 짧은 경로이고 miss는 retrieval, reranking, generation의 시간을 모두 더합니다. 두 결과를 같은 Answer 평가 루프로 보냅니다.</p>
</figure>
