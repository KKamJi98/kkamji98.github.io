<figure class="sd sd--gateway-v2" id="litellm-virtual-key-flow" aria-labelledby="litellm-virtual-key-flow-title">
  <figcaption class="sd-title" id="litellm-virtual-key-flow-title">발급은 한 번, 추론은 가상 키로</figcaption>
<section class="sd-v2-issuance" aria-label="사전 발급"><strong class="sd-label">사전 발급</strong><div class="sd-v2-issuance-row"><span class="sd-detail">관리자<br>master key 인증</span><div class="sd-v2-link" aria-hidden="true"></div><span class="sd-detail"><code>/key/generate</code><br>키와 예산 정책 생성</span><div class="sd-v2-link" aria-hidden="true"></div><span class="sd-detail">DB에 관리 레코드 저장<br>가상 키 반환</span></div><p class="sd-note">관리자가 가상 키를 클라이언트에 전달. master key와 발급 API는 반복 추론에 사용하지 않는다.</p></section><section class="sd-v2-request" aria-label="반복 추론"><div class="sd-v2-section-title">반복 추론</div><div class="sd-v2-request-row"><div class="sd-node"><strong class="sd-label">/v1/chat/completions</strong><span class="sd-detail">클라이언트의 가상 키</span></div><div class="sd-v2-link" aria-hidden="true"></div><div class="sd-node sd-node--accent"><strong class="sd-label">인증과 예산 검사</strong><span class="sd-detail">키 권한, spend, max_budget</span></div></div><div class="sd-v2-fork"><section class="sd-v2-outcome" aria-label="검사 통과"><div class="sd-v2-condition">검사 통과</div><div class="sd-node"><strong class="sd-label">Provider 호출</strong><span class="sd-detail">일반 경로: 선택한 모델로 전달</span></div><div class="sd-v2-down" aria-hidden="true"></div><div class="sd-node"><strong class="sd-label">사용 내역 기록</strong><span class="sd-detail">응답의 토큰 사용량과 모델 가격 설정에 따른 비용</span></div></section><section class="sd-v2-outcome sd-v2-outcome--reject" aria-label="예산 조건 미충족"><div class="sd-v2-condition">예산 조건 미충족</div><div class="sd-node sd-node--warning"><strong class="sd-label">요청 거절</strong><span class="sd-detail">관측: max_budget: 0<br>HTTP 429<br>budget_exceeded</span></div></section></div></section><p class="sd-note">관측은 mock 응답 성공과 0 예산 키의 HTTP 429다. 양수 예산 소진과 실제 provider 미도달은 별도 검증이 필요하다.</p>
</figure>
