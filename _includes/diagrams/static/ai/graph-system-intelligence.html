<figure class="sd sd--flow" id="graph-system-intelligence" aria-labelledby="graph-system-intelligence-title">
  <figcaption class="sd-title" id="graph-system-intelligence-title">Graph engineering이 시스템을 조직하는 방식</figcaption>
  <div class="sd-grid">
    <section class="sd-lane" aria-label="Coding loop">
      <div class="sd-lane-title">Loop A</div>
      <div class="sd-node">
        <strong class="sd-label">Coding agent loop</strong>
        <span class="sd-detail">작업을 수행하고 다음 상태를 남김</span>
      </div>
    </section>
    <section class="sd-lane" aria-label="Review loop">
      <div class="sd-lane-title">Loop B</div>
      <div class="sd-node">
        <strong class="sd-label">Review and audit loop</strong>
        <span class="sd-detail">변경을 읽고 검증 결과를 연결</span>
      </div>
    </section>
    <section class="sd-lane" aria-label="Shared vocabulary">
      <div class="sd-lane-title">공유 의미 계층</div>
      <div class="sd-node sd-node--muted">
        <strong class="sd-label">Ontology</strong>
        <span class="sd-detail">agent 사이의 용어와 관계를 통일</span>
      </div>
    </section>
  </div>
  <div class="sd-arrow"><span class="sd-edge-label">loop와 ontology가 같은 구조를 참조</span></div>
  <div class="sd-node sd-node--accent">
    <strong class="sd-label">Task graph</strong>
    <span class="sd-detail">task는 node, dependency와 handoff는 edge</span>
  </div>
  <div class="sd-arrow"></div>
  <div class="sd-node">
    <strong class="sd-label">Shared state</strong>
    <span class="sd-detail">누가 무엇을 했고 상태가 어디에 있는지 함께 기록</span>
  </div>
  <p class="sd-note">여러 loop가 각자 상태를 들지 않고 graph를 공유할 때 individual intelligence가 system intelligence로 확장됩니다.</p>
</figure>
