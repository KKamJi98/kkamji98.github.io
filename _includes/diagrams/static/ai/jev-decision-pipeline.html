<figure class="sd sd--jev" id="jev-decision-pipeline" aria-label="Jev 판단과 실행 권한의 경계">
  <div class="sd-jev-flow">
    <div class="sd-jev-signals" role="group" aria-label="입력을 받아 판단 신호를 반환하는 Jev">
      <section class="sd-node sd-jev-inputs" aria-label="입력: State와 Typed Questions">
        <strong class="sd-label">State</strong>
        <strong class="sd-label">Typed Questions</strong>
      </section>
      <div class="sd-jev-input-link" aria-hidden="true"></div>
      <div class="sd-node sd-jev-judge" role="group" aria-label="Jev: 범위가 제한된 병렬 판단, 실행 권한 없음">
        <strong class="sd-label">Jev</strong>
        <strong class="sd-detail">실행 권한 없음</strong>
      </div>
    </div>

    <div class="sd-jev-transfer" role="group" aria-label="Jev가 정책에 전달하는 데이터: typed answers">
      <span class="sd-edge-label">typed<br>answers</span>
      <span class="sd-jev-transfer-line" aria-hidden="true"></span>
    </div>

    <section class="sd-jev-policy" aria-labelledby="jev-authority-title">
      <strong class="sd-label sd-jev-boundary-label" id="jev-authority-title">실행 권한 판단</strong>
      <div class="sd-node sd-jev-authority">
        <strong class="sd-label">Deterministic Policy</strong>
        <span class="sd-detail">코드와 정책이 결정</span>
      </div>
      <div class="sd-jev-fork" aria-hidden="true">
        <span class="sd-jev-fork-stem"></span>
        <span class="sd-jev-fork-bus"></span>
        <span class="sd-jev-fork-drop sd-jev-fork-drop--shadow"></span>
        <span class="sd-jev-fork-drop sd-jev-fork-drop--escalate"></span>
      </div>
      <div class="sd-jev-outcomes" role="group" aria-label="정책 후속 경로: Shadow 또는 Escalate. 실행 허가를 뜻하지 않음">
        <div class="sd-node sd-jev-shadow">
          <strong class="sd-label">Shadow</strong>
          <span class="sd-detail">실행 없이 비교</span>
        </div>
        <div class="sd-node sd-jev-escalate">
          <strong class="sd-label">Escalate</strong>
          <span class="sd-detail">사람 / 상위 제어</span>
        </div>
      </div>
    </section>
  </div>
</figure>
