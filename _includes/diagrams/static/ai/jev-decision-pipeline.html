<figure class="sd sd--jev sd--fhd" id="jev-decision-pipeline" aria-label="Jev 판단과 실행 권한의 경계" data-canvas-width="1920" data-canvas-height="1080"><div class="sd-semantic-source">
  <div class="sd-jev-flow">
    <div class="sd-jev-signals" role="group" aria-label="Jev 판단 신호">
      <section class="sd-node sd-jev-inputs" aria-label="입력: State와 Typed Questions">
        <strong class="sd-label">State</strong>
        <strong class="sd-label">Typed Questions</strong>
        <span class="sd-jev-field">tool: kubectl</span>
        <span class="sd-jev-field">canonical_args:</span>
        <span class="sd-jev-field">delete, namespace, production</span>
        <span class="sd-jev-field">environment: production</span>
        <span class="sd-jev-field">caller_role: release-bot</span>
        <span class="sd-jev-field">change_window: closed</span>
      </section>
      <div class="sd-jev-input-link" aria-hidden="true"></div>
      <div class="sd-node sd-jev-judge" role="group" aria-label="Jev: 범위가 제한된 병렬 판단, 실행 권한 없음">
        <strong class="sd-label">Jev</strong>
        <strong class="sd-detail">실행 권한 없음</strong>
        <span class="sd-jev-signal sd-jev-signal--choice"><b>Choice / tool_risk</b> <span>review_required, 1.0</span></span>
        <span class="sd-jev-signal sd-jev-signal--noul"><b>Noul / irreversible</b> <span>noul 0.78</span></span>
        <span class="sd-jev-signal sd-jev-signal--score"><b>Score / blast_radius</b> <span>score 2.78, confidence 0.78</span></span>
      </div>
    </div>

    <div class="sd-jev-transfer" role="group" aria-label="Jev가 정책에 전달하는 데이터: typed answers">
      <span class="sd-edge-label">typed<br>answers</span>
      <span class="sd-jev-transfer-line" aria-hidden="true"></span>
    </div>

    <section class="sd-jev-policy" aria-labelledby="jev-authority-title">
      <strong class="sd-label sd-jev-boundary-label" id="jev-authority-title">실행 권한 판단</strong>
      <div class="sd-node sd-jev-authority">
        <strong class="sd-label">Deterministic Policy</strong>
        <span class="sd-detail">코드와 정책이 결정</span>
        <code class="sd-jev-rule">risk.choice != "bounded"</code>
        <code class="sd-jev-rule">risk.confidence &lt; 0.90</code>
        <code class="sd-jev-rule">irreversible.noul &gt;= 0.10</code>
        <code class="sd-jev-rule">blast_radius.score &gt;= 2</code>
        <code class="sd-jev-rule">blast_radius.confidence &lt; 0.90</code>
        <span class="sd-jev-rule-result">하나라도 참이면 Escalate</span>
      </div>
      <div class="sd-jev-fork" aria-hidden="true">
        <span class="sd-jev-fork-stem"></span>
        <span class="sd-jev-fork-bus"></span>
        <span class="sd-jev-fork-drop sd-jev-fork-drop--shadow"></span>
        <span class="sd-jev-fork-drop sd-jev-fork-drop--escalate"></span>
      </div>
      <div class="sd-jev-outcomes" role="group" aria-label="정책 후속 경로: Shadow 또는 Escalate. 실행 허가를 뜻하지 않음">
        <div class="sd-node sd-jev-shadow">
          <strong class="sd-label">Shadow</strong>
          <span class="sd-detail">실행 없이 비교</span>
        </div>
        <div class="sd-node sd-jev-escalate">
          <strong class="sd-label">Escalate</strong>
          <span class="sd-detail">사람 / 상위 제어</span>
        </div>
      </div>
    </section>
  </div>
  <section class="sd-node sd-jev-measured" aria-label="본문 측정 예시: 정책 결과이며 실행 허가가 아님">
    <strong class="sd-label">본문 측정 결과</strong>
    <span class="sd-detail">실행 허가 아님, 임계값은 예시</span>
    <span class="sd-jev-case"><code>kubectl delete namespace production</code> <b>Escalate</b></span>
    <span class="sd-jev-case"><code>git status --short</code> <b>Shadow</b></span>
    <span class="sd-jev-case"><code>rm -rf ./build</code> <b>Escalate</b></span>
  </section>
</div>
