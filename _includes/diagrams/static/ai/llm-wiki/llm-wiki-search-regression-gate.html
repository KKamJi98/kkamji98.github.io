<figure class="sd sd--flow" id="llm-wiki-search-regression-gate" aria-labelledby="llm-wiki-search-regression-gate-title">
  <figcaption class="sd-title" id="llm-wiki-search-regression-gate-title">LLM Wiki 검색 회귀를 merge gate로 측정</figcaption>
  <div class="sd-grid">
    <section class="sd-lane" aria-label="변경 입력">
      <div class="sd-lane-title">변경 입력</div>
      <div class="sd-node">
        <strong class="sd-label">Add or restructure notes</strong>
        <span class="sd-detail">검색 구조를 바꾸는 change under test</span>
      </div>
    </section>
    <section class="sd-lane" aria-label="평가 입력">
      <div class="sd-lane-title">평가 입력</div>
      <div class="sd-node">
        <strong class="sd-label">Eval set</strong>
        <span class="sd-detail">answer notes에 매핑한 50개 real questions</span>
      </div>
    </section>
  </div>
  <div class="sd-arrow"><span class="sd-edge-label">같은 입력으로 결정적 검색을 재실행</span></div>
  <div class="sd-node sd-node--accent">
    <strong class="sd-label">Deterministic retriever</strong>
    <span class="sd-detail">같은 input이면 같은 ranking을 반환</span>
  </div>
  <div class="sd-arrow"></div>
  <div class="sd-node">
    <strong class="sd-label">Recall@5 and MRR@5</strong>
    <span class="sd-detail">지난 run과 검색 순위를 비교</span>
  </div>
  <div class="sd-arrow"></div>
  <div class="sd-node sd-node--warning">
    <strong class="sd-label">Gate</strong>
    <span class="sd-detail">recall이 떨어지면 변경을 되돌리거나 note 구조를 다시 설계</span>
  </div>
  <section class="sd-lane" aria-label="부작용 경로">
    <div class="sd-lane-title">부작용: hub에서 고립된 note</div>
    <div class="sd-flow">
      <div class="sd-node sd-node--muted">
        <strong class="sd-label">Note change</strong>
        <span class="sd-detail">hub link 없이 추가된 note</span>
      </div>
      <div class="sd-arrow"><span class="sd-edge-label">연결이 없으면</span></div>
      <div class="sd-node sd-node--warning">
        <strong class="sd-label">Unreachable notes</strong>
        <span class="sd-detail">어떤 hub에서도 링크되지 않아 candidate가 되지 않음</span>
      </div>
    </div>
  </section>
  <p class="sd-note">Add or restructure notes는 검색 점수뿐 아니라 연결되지 않은 note를 만들 수 있으므로, eval set과 orphan 경로를 함께 확인합니다.</p>
</figure>
