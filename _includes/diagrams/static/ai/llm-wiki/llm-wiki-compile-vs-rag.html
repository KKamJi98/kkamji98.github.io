<figure class="sd sd--comparison" id="llm-wiki-compile-vs-rag" aria-labelledby="llm-wiki-compile-vs-rag-title">
  <figcaption class="sd-title" id="llm-wiki-compile-vs-rag-title">RAG와 LLM Wiki가 정리하는 시점</figcaption>
  <div class="sd-grid">
    <section class="sd-lane" aria-label="RAG over raw sources">
      <div class="sd-lane-title">RAG over raw sources</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">Raw sources</strong>
          <span class="sd-detail">docs, tickets, threads</span>
        </div>
        <div class="sd-arrow"></div>
        <div class="sd-node">
          <strong class="sd-label">Chunk and embed</strong>
          <span class="sd-detail">읽거나 모순을 조정하지 않고 조각을 만듦</span>
        </div>
        <div class="sd-arrow"></div>
        <div class="sd-node">
          <strong class="sd-label">Retrieve at query time</strong>
          <span class="sd-detail">relevant fragments를 가져오지만 unresolved 상태</span>
        </div>
        <div class="sd-arrow"></div>
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">Model reconciles per query</strong>
          <span class="sd-detail">같은 교차 참조와 모순 처리를 매번 반복</span>
        </div>
      </div>
    </section>
    <section class="sd-lane" aria-label="LLM wiki">
      <div class="sd-lane-title">LLM Wiki</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">Raw sources</strong>
          <span class="sd-detail">같은 docs, tickets, threads 입력</span>
        </div>
        <div class="sd-arrow"></div>
        <div class="sd-node">
          <strong class="sd-label">Compile into notes</strong>
          <span class="sd-detail">cross-links와 contradictions를 ingestion에서 해결</span>
        </div>
        <div class="sd-arrow"></div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">Markdown wiki</strong>
          <span class="sd-detail">정리된 지식을 유지하고 git으로 versioning</span>
        </div>
        <div class="sd-arrow"></div>
        <div class="sd-node">
          <strong class="sd-label">Agent reads settled notes</strong>
          <span class="sd-detail">query마다 재추론하지 않음</span>
        </div>
      </div>
    </section>
  </div>
  <p class="sd-note">두 경로의 원문 입력은 같지만, RAG는 query time에 정리하고 LLM Wiki는 ingestion에서 한 번 컴파일합니다.</p>
</figure>
