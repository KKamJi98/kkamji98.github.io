<figure class="sd sd--flow sd--fhd" id="sd-closed-loop-devsecops" aria-labelledby="sd-closed-loop-devsecops-title" data-canvas-width="1920" data-canvas-height="1080">
  <figcaption class="sd-title" id="sd-closed-loop-devsecops-title">닫힌 형식 검증 루프와 열린 프로덕션 DevSecOps 제어 경계 비교</figcaption><div class="sd-semantic-source">
  <section class="sd-lane" id="cl-formal-lane">
    <div class="sd-lane-title" id="cl-formal-title">닫힌 형식 검증 세계 (Lean 4 / 컴파일러): 결정론적 0/1 오라클이 논리 무결성을 자동 인증</div>
    <div class="sd-node" id="cl-f-spec"><strong class="sd-label">1. 고정된 공리와 명제</strong><span class="sd-detail">Mathlib 표준 정의로 고정<br>외부 상태와 모호성 없음<br>명세 자체의 변조 차단 가능</span></div>
    <div class="sd-node" id="cl-f-gen"><strong class="sd-label">2. AI 대규모 탐색 생성</strong><span class="sd-detail">RLVR과 테스트타임 탐색 활용<br>수백만 줄 후보 코드 자동 생성<br>컴파일 실패를 즉시 피드백</span></div>
    <div class="sd-node sd-node--accent" id="cl-f-kernel"><strong class="sd-label">3. 작은 0/1 검증 커널</strong><span class="sd-detail">다중 체커가 불활성 산출물 검사<br>물리 지연과 관측 노이즈 없음<br>거짓 증명 통과 확률 최소화</span></div>
    <div class="sd-node sd-node--accent" id="cl-f-cert"><strong class="sd-label">4. 통독 없는 형식 인증</strong><span class="sd-detail">인간 검수 없이 무결성 판정<br>검증 비용이 생성보다 극히 작음<br>단, 직관적 이해는 별도 과제</span></div>
  </section>
  <section class="sd-lane" id="cl-ops-lane">
    <div class="sd-lane-title" id="cl-ops-title">열린 운영 인프라 세계 (DevSecOps / SRE): 물리 지연과 노이즈 속에서 정책 게이트와 인간 승인선이 통제</div>
    <div class="sd-node sd-node--warning" id="cl-o-world"><strong class="sd-label">1. 불완전한 현실과 요구</strong><span class="sd-detail">트래픽 급변과 하드웨어 결함<br>암묵적 비즈니스 제약과 노이즈<br>단일 컴파일러로 표현 불가</span></div>
    <div class="sd-node sd-node--warning" id="cl-o-gen"><strong class="sd-label">2. AI 코드/IaC 대량 생성</strong><span class="sd-detail">수만 줄 PR과 인프라 변경 생성<br>인간 수동 diff 통독 한계 도달<br>Comprehension Gap 심화</span></div>
    <div class="sd-node sd-node--accent" id="cl-o-gate"><strong class="sd-label">3. 독립 정책/빌드 게이트</strong><span class="sd-detail">격리 IAM / OPA / Kyverno<br>타입, 정적 분석, 재현 빌드<br>terraform plan / dry-run 검증</span></div>
    <div class="sd-node sd-node--accent" id="cl-o-agency"><strong class="sd-label">4. 명시적 인간 승인선</strong><span class="sd-detail">프로덕션 apply와 권한 확대<br>비가역 삭제와 외부 게시 통제<br>이양(handover) 거부 및 Agency</span></div>
  </section>
  <div class="sd-arrow" id="cl-f-e1" data-from="cl-f-spec" data-to="cl-f-gen" aria-label="고정된 형식 공리와 명제가 AI 탐색과 코드 생성의 목표로 제공"></div>
  <div class="sd-arrow" id="cl-f-e2" data-from="cl-f-gen" data-to="cl-f-kernel" aria-label="생성된 후보 증명이 작은 0/1 커널의 결정론적 검사를 거침"></div>
  <div class="sd-arrow" id="cl-f-e3" data-from="cl-f-kernel" data-to="cl-f-cert" aria-label="커널 통과로 인간 통독 없이 형식 무결성 인증 완료"></div>
  <div class="sd-arrow" id="cl-o-e1" data-from="cl-o-world" data-to="cl-o-gen" aria-label="불완전한 운영 요구가 AI 코드 및 IaC 대량 생성으로 전달"></div>
  <div class="sd-arrow" id="cl-o-e2" data-from="cl-o-gen" data-to="cl-o-gate" aria-label="생성 변경분이 격리 정책과 샌드박스 plan 검증 게이트를 통과"></div>
  <div class="sd-arrow" id="cl-o-e3" data-from="cl-o-gate" data-to="cl-o-agency" aria-label="자동 게이트 통과 후 비가역 프로덕션 변경은 명시적 인간 승인선에서 확정"></div>
  <p class="sd-note" id="cl-note">핵심 차이: 형식 수학의 돌파는 닫힌 0/1 오라클에 의존한다. 열린 운영 세계에서는 명세 격리, 작은 TCB 정책 엔진, 비가역 인간 승인선 설계가 안전 경계를 결정한다</p>
</div>
