<figure class="sd sd--comparison" id="sd-foundry-test-create-cast" aria-labelledby="sd-title-foundry-test-create-cast">
  <figcaption class="sd-title" id="sd-title-foundry-test-create-cast">forge test의 임시 EVM과 Anvil 배포 상태는 다릅니다</figcaption>
  <div class="sd-grid">
    <section class="sd-lane" aria-label="forge test">
      <div class="sd-lane-title">forge test</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">in-process EVM</strong>
          <span class="sd-detail">2 passed, Anvil 없이 실행</span>
        </div>
        <div class="sd-arrow">
          <span class="sd-edge-label">test 종료</span>
        </div>
        <div class="sd-node sd-node--muted">
          <strong class="sd-label">address 없음</strong>
          <span class="sd-detail">임시 인스턴스와 receipt가 사라짐</span>
        </div>
      </div>
    </section>
    <section class="sd-lane">
      <div class="sd-lane-title">Anvil 공유 상태</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">forge create</strong>
          <span class="sd-detail">Anvil chainId 31337, 0xe7f1725E, bytecode 964 hex</span>
        </div>
        <div class="sd-arrow">
          <span class="sd-edge-label">state에 deploy</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">deployed address</strong>
          <span class="sd-detail">node 상태 트리에 코드 유지</span>
        </div>
        <div class="sd-arrow">
          <span class="sd-edge-label">cast call / send: 같은 node와 address</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">deployed address 조회</strong>
          <span class="sd-detail">cast call로 number() = 0</span>
        </div>
        <div class="sd-arrow">
          <span class="sd-edge-label">상태 변경 transaction</span>
        </div>
        <div class="sd-node">
          <strong class="sd-label">number() = 1</strong>
          <span class="sd-detail">cast send increment()</span>
        </div>
      </div>
    </section>
  </div>
  <p class="sd-note">forge test의 임시 state는 Anvil과 분리됩니다. forge create로 배포한 address를 같은 Anvil의 cast call과 cast send가 읽고 바꿉니다. 테스트 통과만으로 Anvil address가 생기지는 않습니다.</p>
</figure>
