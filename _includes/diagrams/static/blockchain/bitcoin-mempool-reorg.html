<figure class="sd sd--sequence" id="sd-bitcoin-mempool-reorg" aria-labelledby="sd-title-bitcoin-mempool-reorg">

  <div class="sd-flow">
    <div class="sd-node sd-node--accent">

    <div class="sd-arrow"><span class="sd-edge-label">block 112 편입</span></div>

        <div class="sd-arrow"><span class="sd-edge-label">거래 반환</span></div>

      <div class="sd-lane-title">새 active branch</div>
      <div class="sd-flow">
        <div class="sd-node">
