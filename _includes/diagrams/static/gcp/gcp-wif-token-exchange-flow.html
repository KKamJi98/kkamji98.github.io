  <figcaption class="sd-title" id="gcp-wif-token-exchange-flow-title">WIF는 외부 OIDC token을 단기 Google credential로 교환합니다</figcaption><div class="sd-semantic-source">
  <div class="sd-node">
  <strong class="sd-label">External CI: GitHub Actions</strong>
  <span class="sd-detail">OIDC token: workflow run의 외부 assertion</span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">token exchange 요청</span>
  </div>
  <section class="sd-band">
  <div class="sd-band-title">Security Token Service</div>
  <div class="sd-node sd-node--accent">
  <strong class="sd-label">Assertion 검증과 token 발급</strong>
  <span class="sd-detail">단기 federated token 발급</span>
  </div>
  <section class="sd-band">
  <div class="sd-band-title">STS가 참조하는 trust 설정</div>
  <div class="sd-node">
  <strong class="sd-label">Workload identity pool / OIDC provider</strong>
  <span class="sd-detail">Issuer URL, audience, <code>google.subject</code>와 repository attribute mapping</span>
  </div>
  <div class="sd-node sd-node--warning">
  <strong class="sd-label">Attribute condition</strong>
  <span class="sd-detail">허용한 조직과 repository만 통과; shared issuer의 다른 workload 거부</span>
  </div>
  </section>
  </section>
  <div class="sd-arrow">
  <span class="sd-edge-label">Federated token으로 principal 경로 선택</span>
  </div>
  <div class="sd-grid">
  <div class="sd-node">
  <strong class="sd-label">Direct resource access</strong>
  <span class="sd-detail">target resource role을 federated principalSet에 직접 부여</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">Service Account impersonation</strong>
  <span class="sd-detail">좁은 principalSet에 <code>roles/iam.workloadIdentityUser</code>를 부여하고 단기 Service Account credential 발급</span>
  </div>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">선택한 principal로 호출</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">Target resource</strong>
  <span class="sd-detail">least-privilege role로 필요한 작업만 허용</span>
  </div>
  <p class="sd-note">장기 Service Account key 없이 사용합니다. 조직 ID와 repository ID 같은 좁은 claim을 condition과 IAM binding에 함께 사용합니다.</p>
</div>
