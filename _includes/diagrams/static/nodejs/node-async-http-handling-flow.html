<figure class="sd sd--flow sd--fhd" id="node-async-http-handling-flow" aria-labelledby="sd-title-node-async-http-handling-flow" data-canvas-width="1920" data-canvas-height="1080">
  <figcaption class="sd-title" id="sd-title-node-async-http-handling-flow">한 곳이 response를 소유하고 모든 실패가 그 경계를 통과합니다</figcaption><div class="sd-semantic-source">
  <div class="sd-node">
  <strong class="sd-label">Client / request event</strong>
  <span class="sd-detail">HTTP server가 handleRequest() 호출</span>
  </div>
  <section class="sd-band">
  <div class="sd-band-title">Error boundary: response owner</div>
  <div class="sd-node">
  <strong class="sd-label">handleRequest()</strong>
  <span class="sd-detail">downstream 작업 조정</span>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">await</span>
  </div>
  <div class="sd-node sd-node--accent">
  <strong class="sd-label">fetchJson()</strong>
  <span class="sd-detail">Upstream HTTP service 요청. 완료 전 Promise pending</span>
  </div>
  <p class="sd-note">취소 제어: timeout 또는 client disconnect가 AbortController의 AbortSignal을 fetchJson()에 전달해 downstream 작업을 중단합니다.</p>
  <div class="sd-arrow">
  <span class="sd-edge-label">Promise settlement</span>
  </div>
  <div class="sd-grid">
  <div class="sd-node">
  <strong class="sd-label">fulfilled</strong>
  <span class="sd-detail">정상 body 직렬화</span>
  </div>
  <div class="sd-node sd-node--warning">
  <strong class="sd-label">rejected</strong>
  <span class="sd-detail">error boundary가 안전한 status와 body로 매핑</span>
  </div>
  </div>
  <div class="sd-arrow">
  <span class="sd-edge-label">동일 writer로 합류</span>
  </div>
  <div class="sd-node">
  <strong class="sd-label">writeResponse()</strong>
  <span class="sd-detail">성공과 실패를 쓰는 유일한 writer</span>
  </div>
  </section>
  <p class="sd-note">rejected Promise 자체는 HTTP response가 아닙니다. 연결이 종료됐다면 더 쓰지 않고 정리합니다. timeout/abort가 없으면 Promise와 socket이 pending으로 남을 수 있습니다.</p>
</div>
