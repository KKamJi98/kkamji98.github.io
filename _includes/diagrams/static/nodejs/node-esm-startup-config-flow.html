<figure class="sd sd--flow" id="node-esm-startup-config-flow" aria-labelledby="sd-title-node-esm-startup-config-flow">
  <figcaption class="sd-title" id="sd-title-node-esm-startup-config-flow">Node.js ESM startup: valid config에서만 port를 bind합니다</figcaption>

  <div class="sd-flow">
    <div class="sd-node sd-node--muted">
      <strong class="sd-label">Node CLI</strong>
      <span class="sd-detail"><code>node main.mjs</code></span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">환경 제공</span></div>
    <div class="sd-node">
      <strong class="sd-label">Environment</strong>
      <span class="sd-detail"><code>--env-file</code>와 <code>process.env</code></span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">ESM graph load</span></div>
    <div class="sd-node sd-node--accent">
      <strong class="sd-label">main.mjs</strong>
      <span class="sd-detail">bootstrap entry point</span>
    </div>
    <div class="sd-arrow"><span class="sd-edge-label">static import</span></div>
    <div class="sd-node">
      <strong class="sd-label">config.mjs</strong>
      <span class="sd-detail">server보다 먼저 import</span>
    </div>
  </div>

  <div class="sd-grid">
    <section class="sd-lane">
      <div class="sd-lane-title">Valid configuration 경로</div>
      <div class="sd-flow">
        <div class="sd-node">
          <strong class="sd-label">Parse and validate config</strong>
          <span class="sd-detail">required field와 range를 typed object로 변환, 실패하면 bind 전 종료</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">검증 통과</span></div>
        <div class="sd-node">
          <strong class="sd-label">server.mjs</strong>
          <span class="sd-detail"><code>createServer</code>, module 평가 중 bind하지 않음</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">listen 전 등록</span></div>
        <div class="sd-node">
          <strong class="sd-label">error listener</strong>
          <span class="sd-detail"><code>server.listen()</code>보다 먼저 등록</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">port bind</span></div>
        <div class="sd-node">
          <strong class="sd-label">server.listen()</strong>
          <span class="sd-detail">여기서 TCP port를 bind</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">listening callback</span></div>
        <div class="sd-node sd-node--accent">
          <strong class="sd-label">Ready: HTTP 200</strong>
          <span class="sd-detail">readiness probe가 통과할 수 있음</span>
        </div>
      </div>
    </section>

    <section class="sd-lane">
      <div class="sd-lane-title">Module resolution 또는 evaluation 실패 (config.mjs에서 분기)</div>
      <div class="sd-flow">
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">Module failure</strong>
          <span class="sd-detail">config.mjs graph를 resolve 또는 evaluate하지 못함</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">startup에서 기록</span></div>
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">Startup error</strong>
          <span class="sd-detail">secret 없이 error code를 로그에 남김</span>
        </div>
        <div class="sd-arrow"><span class="sd-edge-label">non-zero exit</span></div>
        <div class="sd-node sd-node--warning">
          <strong class="sd-label">No listener</strong>
          <span class="sd-detail">port bind 전 종료, HTTP response 없음</span>
        </div>
      </div>
      <p class="sd-note">static import resolution 또는 evaluation 실패는 application validation보다 먼저 발생할 수 있습니다.</p>
    </section>
  </div>

  <p class="sd-note">invalid configuration과 startup failure는 HTTP 500이 아닙니다. <code>listen()</code> 전에 server가 없으므로 client에 응답할 수 없습니다.</p>
</figure>
