<figure class="sd sd--flow" id="packer-golden-image" aria-labelledby="packer-golden-image-title">

      <div class="sd-node">
        <strong class="sd-label"><img class="sd-icon" data-static-diagram="true" src="{{ '/assets/img/packer/diagram/packer.svg' | relative_url }}" alt="" width="32" height="32">HCL 템플릿</strong>

      <div class="sd-arrow"><span class="sd-edge-label">Builder가 임시 EC2 생성</span></div>

      <div class="sd-node">
