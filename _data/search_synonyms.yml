# Query-time synonym groups for the site search.
#
# Consumed by `_includes/search-loader.html`: every term in a group matches the
# others, so searching "쿠버네티스" finds posts that only ever write
# "Kubernetes", and "k8s" finds them too. Adding a group here applies to every
# existing post at once, which is why this lives in one file instead of in each
# post's tags.
#
# Rules for adding a term:
#   - lower-case only; a query token is matched against a group exactly
#   - titles are matched on whole words for English terms, so "java" no longer
#     scores a JavaScript post on its title
#   - categories, tags and body are still substring-matched, so a short English
#     term hidden inside a common word ("log" inside "blog", "auth" inside
#     "author") still drags in posts it does not belong to. Keep the
#     distinctive spelling instead.

